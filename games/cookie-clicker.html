<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Clicker - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      justify-content: flex-start;
      padding-top: 3rem;
      background: #0b0f24;
      overflow-x: hidden;
    }

    canvas#bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    }
    /* Full-screen FX canvas for falling cookies — above content, below +1s */
    canvas#fx-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 15;
      pointer-events: none;
    }
    /* Full-screen FX layer for +1 floats — above everything else */
    .fx-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: visible;
    }

    .back-link { z-index: 2; }
    h1, .cookie-area, .reset-link { position: relative; z-index: 2; }

    h1 {
      font-size: 3rem;
      margin-bottom: 1.6rem;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #a0c4ff 0%, #4e7fff 35%, #c7a0ff 70%, #a0c4ff 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 5s ease-in-out infinite, float 6s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(78, 127, 255, 0.4));
    }
    @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    .cookie-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      animation: fadeIn 0.9s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .counter {
      font-size: 4rem;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-weight: 700;
      background: linear-gradient(135deg, #f5d77a, #d49d3e);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px rgba(245, 215, 122, 0.35));
      display: inline-block;
      transform-origin: center;
      line-height: 1.05;
    }
    .counter.pulse { animation: counterPulse 0.18s ease-out; }
    @keyframes counterPulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .cps {
      color: #8ea7d6;
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 1.8rem;
      opacity: 0.85;
    }

    .cookie-wrap {
      position: relative;
      width: min(340px, 82vw);
      height: min(340px, 82vw);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cookie-btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      width: 92%;
      height: 92%;
      transform-origin: center;
      transition: transform 0.12s cubic-bezier(.4,1.6,.5,1), filter 0.2s;
      filter: drop-shadow(0 8px 30px rgba(180, 110, 40, 0.45));
      z-index: 6;
    }
    .cookie-btn:hover { filter: drop-shadow(0 10px 38px rgba(220, 140, 50, 0.6)); }
    .cookie-btn.pop { transform: scale(0.93); }
    .cookie-btn:active { transform: scale(0.9); }
    .cookie-btn:focus-visible { outline: 2px solid #a0c4ff; outline-offset: 10px; border-radius: 50%; }
    .cookie-btn svg { width: 100%; height: 100%; display: block; }

    .fx-plus1 {
      position: fixed;
      transform: translate(-50%, -50%);
      font-size: 1.8rem;
      font-weight: 700;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      color: #ffe48a;
      text-shadow: 0 0 12px rgba(255, 220, 130, 0.7), 0 2px 4px rgba(0,0,0,0.4);
      pointer-events: none;
      animation: floatUp 1.4s cubic-bezier(.25,.7,.4,1) forwards;
      will-change: transform, opacity;
    }
    /* Starts at click point, rises off the top of the viewport. */
    @keyframes floatUp {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      10%  { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
      85%  { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, calc(-50% - 100vh)) scale(0.9); }
    }

    .reset-link {
      position: fixed;
      bottom: 0.8rem;
      right: 1.2rem;
      color: #555;
      font-size: 0.75rem;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: none;
      border: none;
      padding: 0.4rem 0.7rem;
      font-family: inherit;
      transition: color 0.15s;
      z-index: 30;
    }
    .reset-link:hover { color: #aaa; }

    /* TODO: shop / buildings panel goes here when added */
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
  <canvas id="fx-canvas"></canvas>
  <div class="fx-layer" id="fx-layer"></div>
  <a href="../games.html" class="back-link">&larr; All Games</a>

  <h1>Cookie Clicker</h1>

    <div class="cookie-wrap">

            <ellipse cx="170" cy="38"  rx="11" ry="6"  fill="#8c4c1c" transform="rotate(35 170 38)"/>

            <ellipse cx="100" cy="192" rx="13" ry="5"  fill="#9a5a25"/>
            <ellipse cx="35"  cy="170" rx="11" ry="6"  fill="#8c4c1c" transform="rotate(35 35 170)"/>
            <ellipse cx="9"   cy="98"  rx="6"  ry="12" fill="#9a5a25" transform="rotate(-5 9 98)"/>
            <ellipse cx="32"  cy="35"  rx="11" ry="6"  fill="#8c4c1c" transform="rotate(-30 32 35)"/>
          </g>

          <!-- baked texture: many tiny dark specks -->
          <g fill="#3a1f0a" opacity="0.7">
            <circle cx="55"  cy="80"  r="1.2"/>
            <circle cx="78"  cy="42"  r="0.8"/>
            <circle cx="120" cy="76"  r="1.5"/>

            <circle cx="138" cy="155" r="1.4"/>
            <circle cx="62"  cy="172" r="1.1"/>
            <circle cx="155" cy="72"  r="0.7"/>
            <circle cx="32"  cy="102" r="1"/>
            <circle cx="92"  cy="182" r="0.8"/>
            <circle cx="172" cy="135" r="1.2"/>
            <circle cx="73"  cy="62"  r="0.6"/>
            <circle cx="142" cy="32"  r="0.9"/>

          </g>

          <!-- lighter highlight specks (texture bumps catching light) -->
          <g opacity="0.7">
            <circle cx="68"  cy="88"  r="0.9" fill="#f4d9a8"/>
            <circle cx="100" cy="58"  r="1.1" fill="#f4d9a8"/>
            <circle cx="130" cy="98"  r="0.8" fill="#f4d9a8"/>
            <circle cx="155" cy="128" r="1.0" fill="#e9c290"/>
            <circle cx="48"  cy="158" r="0.9" fill="#e9c290"/>
            <circle cx="125" cy="130" r="0.7" fill="#f4d9a8"/>
            <circle cx="80"  cy="155" r="1.0" fill="#e9c290"/>
            <circle cx="38"  cy="75"  r="0.8" fill="#f4d9a8"/>
            <circle cx="148" cy="170" r="0.7" fill="#e9c290"/>
            <circle cx="115" cy="180" r="0.8" fill="#e9c290"/>
          </g>

          <!-- subtle cracks -->
          <path d="M 112 128 Q 132 142 145 165" stroke="#3a1f0a" stroke-width="0.8" fill="none" opacity="0.45"/>
          <path d="M 50 75 Q 65 85 72 96"       stroke="#3a1f0a" stroke-width="0.7" fill="none" opacity="0.40"/>
          <path d="M 130 50 Q 138 70 125 80"    stroke="#3a1f0a" stroke-width="0.6" fill="none" opacity="0.35"/>

          <!-- chocolate chips (shadow + body + highlight for 3D feel) -->
          <g>
            <!-- top-left -->

          <!-- soft top-left highlight -->

          <!-- under-shadow within cookie (gives slight 3D dome) -->

        </svg>
      </button>
    </div>
  </div>

  <button class="reset-link" id="reset" title="Wipe save and start over">reset</button>

  <script>
    const STORAGE_KEY = 'horsey:cookieclicker:v1';

    const cookieEl  = document.getElementById('cookie');
    const counterEl = document.getElementById('counter');
    const cpsEl     = document.getElementById('cps');
    const fxLayer   = document.getElementById('fx-layer');
    const fxCanvas  = document.getElementById('fx-canvas');
    const fxCtx     = fxCanvas.getContext('2d');

    function defaultState() { return { cookies: 0, cps: 0 }; }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return Object.assign(defaultState(), JSON.parse(raw));
      } catch (_) {}
      return defaultState();
    }

    let state = loadState();
    let saveTimer = null;
    function saveStateDebounced() {
      if (saveTimer) return;
      saveTimer = setTimeout(() => {
        saveTimer = null;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
      }, 250);
    }

    function fmt(n) {
      // v1: comma-formatted integer. TODO: K/M/B abbreviations later.
      return Math.floor(n).toLocaleString();
    }

    function renderCounter() {
      counterEl.textContent = fmt(state.cookies) + ' cookies';
      counterEl.classList.remove('pulse');
      void counterEl.offsetWidth;
      counterEl.classList.add('pulse');
      cpsEl.textContent = fmt(state.cps) + ' per second';
    }

    function bumpCookie() {
      cookieEl.classList.remove('pop');
      void cookieEl.offsetWidth;
      cookieEl.classList.add('pop');
    }

    // ---- Floating "+1" (rises all the way off the top of the screen) ----
    function spawnPlusOne(clientX, clientY) {
      const el = document.createElement('span');
      el.className = 'fx-plus1';
      el.textContent = '+1';
      el.style.left = clientX + 'px';
      el.style.top  = clientY + 'px';
      fxLayer.appendChild(el);
      el.addEventListener('animationend', () => el.remove(), { once: true });
    }

    // ---- Falling chocolate-chip cookies (replaces crumbs) ----
    // Pre-render a tiny cookie sprite once so each particle is one drawImage call.
    const MINI = (() => {
      const c = document.createElement('canvas');
      const S = 64;
      c.width = c.height = S;
      const g = c.getContext('2d');
      const cx = S / 2, cy = S / 2, r = S * 0.46;
      const grad = g.createRadialGradient(cx - r*0.25, cy - r*0.3, 0, cx, cy, r);
      grad.addColorStop(0,    '#f3cd91');
      grad.addColorStop(0.55, '#b87b3c');
      grad.addColorStop(1,    '#5a3015');
      g.fillStyle = grad;
      g.beginPath();
      g.arc(cx, cy, r, 0, Math.PI * 2);
      g.fill();
      // rim
      g.strokeStyle = 'rgba(42, 18, 6, 0.7)';
      g.lineWidth = 1.4;
      g.stroke();
      // chips
      const chips = [
        [-0.45, -0.40, 0.18],
        [ 0.42, -0.45, 0.20],
        [-0.22,  0.30, 0.16],
        [ 0.35,  0.28, 0.18],
        [-0.40,  0.05, 0.15],
        [ 0.10, -0.10, 0.14],
      ];
      g.fillStyle = '#1c0a04';
      for (const [dx, dy, fr] of chips) {
        g.beginPath();
        g.arc(cx + dx * r, cy + dy * r, fr * r, 0, Math.PI * 2);
        g.fill();
      }
      // tiny highlight on each chip
      g.fillStyle = 'rgba(180, 95, 45, 0.55)';
      for (const [dx, dy, fr] of chips) {
        g.beginPath();
        g.arc(cx + (dx - 0.06) * r, cy + (dy - 0.06) * r, fr * r * 0.35, 0, Math.PI * 2);
        g.fill();
      }
      // top-left soft highlight on body
      g.fillStyle = 'rgba(255, 255, 255, 0.10)';
      g.beginPath();
      g.ellipse(cx - r*0.3, cy - r*0.35, r*0.35, r*0.18, 0, 0, Math.PI * 2);
      g.fill();
      return c;
    })();

    const falling = [];
    function resizeFxCanvas() {
      fxCanvas.width  = window.innerWidth;
      fxCanvas.height = window.innerHeight;
    }
    function spawnFallingCookies(x, y) {
      const n = 4 + Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.6; // upward fan
        const sp = 4 + Math.random() * 5;
        falling.push({
          x, y,
          vx: Math.cos(angle) * sp,
          vy: Math.sin(angle) * sp,
          size: 14 + Math.random() * 16,            // px (full diameter)
          rot: Math.random() * Math.PI * 2,
          vr:  (Math.random() - 0.5) * 0.35,
          life: 1,                                  // fades when leaving the screen
        });
      }
    }
    function tickFalling() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      const h = fxCanvas.height;
      for (let i = falling.length - 1; i >= 0; i--) {
        const c = falling[i];
        c.x   += c.vx;
        c.y   += c.vy;
        c.vy  += 0.32;                              // gravity
        c.vx  *= 0.998;                             // mild drag
        c.rot += c.vr;
        // start fading when below the screen edge
        if (c.y > h - 40) c.life -= 0.04;
        if (c.life <= 0 || c.y > h + 80) { falling.splice(i, 1); continue; }
        fxCtx.save();
        fxCtx.globalAlpha = Math.min(1, c.life);
        fxCtx.translate(c.x, c.y);
        fxCtx.rotate(c.rot);
        fxCtx.drawImage(MINI, -c.size / 2, -c.size / 2, c.size, c.size);
        fxCtx.restore();
      }
      requestAnimationFrame(tickFalling);
    }

    // ---- Click "pop" sound ----
    let audioCtx = null;
    function ensureAudio() {
      if (audioCtx) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      } catch (_) {}
    }
    function playClickPop() {
      ensureAudio();
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const f0 = 340 + Math.random() * 80;
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f0, t);
      osc.frequency.exponentialRampToValueAtTime(150, t + 0.07);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.18, t + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.1);
    }

    // ---- Click handler ----
    function onCookieClick(e) {
      let cx, cy;
      if (e.clientX || e.clientY) {
        cx = e.clientX;
        cy = e.clientY;
      } else {
        // keyboard activation: pop at button center
        const r = cookieEl.getBoundingClientRect();
        cx = r.left + r.width  / 2;
        cy = r.top  + r.height / 2;
      }
      state.cookies += 1; // TODO: clickPower multiplier
      renderCounter();
      spawnPlusOne(cx, cy);
      spawnFallingCookies(cx, cy);
      playClickPop();
      bumpCookie();
      saveStateDebounced();
    }

    // ---- CpS tick (no-op while cps=0; lives here so future buildings just set state.cps) ----
    function startCpsLoop() {
      setInterval(() => {
        if (state.cps > 0) {
          state.cookies += state.cps / 20;
          renderCounter();
          saveStateDebounced();
        }
      }, 50);
    }

    // ---- Reset ----
    function resetState() {
      if (!confirm('Reset all cookies? This wipes your save.')) return;
      state = defaultState();
      try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
      renderCounter();
    }

    cookieEl.addEventListener('click', onCookieClick);
    document.getElementById('reset').addEventListener('click', resetState);
    window.addEventListener('resize', resizeFxCanvas);

    resizeFxCanvas();
    renderCounter();
    requestAnimationFrame(tickFalling);
    startCpsLoop();

    // TODO: buildings — push into a BUILDINGS array, each {name, baseCost, cps}; render in shop panel
    // TODO: golden cookie spawner
  </script>
  <script src="../bg.js"></script>
</body>
</html>
