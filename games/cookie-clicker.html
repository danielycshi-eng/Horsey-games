<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Clicker - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      justify-content: flex-start;
      padding-top: 3rem;
      background: #0b0f24;
      overflow-x: hidden;
    }

    canvas#bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    }
    canvas#fx-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 15;
      pointer-events: none;
    }
    .fx-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: visible;
    }

    .back-link { z-index: 2; }
    h1, .cookie-area { position: relative; z-index: 2; }

    h1 {
      font-size: 3rem;
      margin-bottom: 1.6rem;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #a0c4ff 0%, #4e7fff 35%, #c7a0ff 70%, #a0c4ff 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 5s ease-in-out infinite, float 6s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(78, 127, 255, 0.4));
    }
    @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    .cookie-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      animation: fadeIn 0.9s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .counter {
      font-size: 4rem;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-weight: 700;
      background: linear-gradient(135deg, #f5d77a, #d49d3e);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px rgba(245, 215, 122, 0.35));
      display: inline-block;
      transform-origin: center;
      line-height: 1.05;
    }
    .counter.pulse { animation: counterPulse 0.18s ease-out; }
    @keyframes counterPulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .cps {
      color: #8ea7d6;
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 1.8rem;
      opacity: 0.85;
    }

    .cookie-wrap {
      position: relative;
      width: min(340px, 82vw);
      height: min(340px, 82vw);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cookie-btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      width: 92%;
      height: 92%;
      transform-origin: center;
      transition: transform 0.12s cubic-bezier(.4,1.6,.5,1), filter 0.2s;
      filter: drop-shadow(0 8px 30px rgba(180, 110, 40, 0.45));
      z-index: 6;
    }
    .cookie-btn:hover { filter: drop-shadow(0 10px 38px rgba(220, 140, 50, 0.6)); }
    .cookie-btn.pop { transform: scale(0.93); }
    .cookie-btn:active { transform: scale(0.9); }
    .cookie-btn:focus-visible { outline: 2px solid #a0c4ff; outline-offset: 10px; border-radius: 50%; }
    .cookie-btn svg { width: 100%; height: 100%; display: block; }

    /* Eat animation — cookie wobbles, shrinks, vanishes */
    .cookie-btn.eating {
      pointer-events: none;
      animation: eatCookie 1.8s cubic-bezier(.45,.05,.55,1) forwards;
    }
    @keyframes eatCookie {
      0%   { transform: scale(1)    rotate(0deg);   opacity: 1; }
      12%  { transform: scale(1.04) rotate(-6deg); }
      25%  { transform: scale(0.88) rotate(8deg); }
      40%  { transform: scale(0.74) rotate(-12deg); }
      55%  { transform: scale(0.55) rotate(14deg); }
      70%  { transform: scale(0.36) rotate(-18deg); opacity: 0.85; }
      85%  { transform: scale(0.16) rotate(22deg);  opacity: 0.5; }
      100% { transform: scale(0)    rotate(-28deg); opacity: 0; }
    }

    /* "Time to eat!" button */
    .eat-btn {
      margin-top: 1.6rem;
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, #e89055, #b95a20);
      border: 2px solid #5a3215;
      border-radius: 12px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
      box-shadow: 0 4px 14px rgba(184, 90, 32, 0.4);
      position: relative;
      z-index: 2;
    }
    .eat-btn:hover {
      background: linear-gradient(135deg, #f3a168, #c96828);
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(220, 120, 50, 0.55);
    }
    .eat-btn:active { transform: translateY(0); }
    .eat-btn:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }

    .fx-plus1 {
      position: fixed;
      transform: translate(-50%, -50%);
      font-size: 1.8rem;
      font-weight: 700;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      color: #ffe48a;
      text-shadow: 0 0 12px rgba(255, 220, 130, 0.7), 0 2px 4px rgba(0,0,0,0.4);
      pointer-events: none;
      animation: floatUp 3s cubic-bezier(.25,.6,.45,1) forwards;
      will-change: transform, opacity;
    }
    /* Slow drift upward; visible for ~2s, gentle fade-out over the last second. */
    @keyframes floatUp {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      6%   { opacity: 1; transform: translate(-50%, -55%) scale(1.18); }
      70%  { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, calc(-50% - 95vh)) scale(0.92); }
    }

    /* TODO: shop / buildings panel goes here when added */
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
  <canvas id="fx-canvas"></canvas>
  <div class="fx-layer" id="fx-layer"></div>
  <a href="../games.html" class="back-link">&larr; All Games</a>

  <h1>Cookie Clicker</h1>

  <div class="cookie-area">
    <div class="counter" id="counter">0 cookies</div>
    <div class="cps" id="cps">0 per second</div>
    <div class="cookie-wrap">
      <button class="cookie-btn" id="cookie" aria-label="Click the cookie">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="cookieBody" cx="42%" cy="38%" r="78%">
              <stop offset="0%"   stop-color="#dda069"/>
              <stop offset="60%"  stop-color="#b07840"/>
              <stop offset="100%" stop-color="#7c4820"/>
            </radialGradient>
            <radialGradient id="chipBody" cx="35%" cy="28%" r="80%">
              <stop offset="0%"   stop-color="#5a2a10"/>
              <stop offset="60%"  stop-color="#2a1006"/>
              <stop offset="100%" stop-color="#0a0301"/>
            </radialGradient>
          </defs>

          <!-- Lumpy cookie outline (irregular, not a perfect circle) -->
          <path d="
            M 100 4
            C 138 2, 168 16, 184 40
            C 200 62, 198 92, 192 110
            C 200 134, 178 164, 152 184
            C 130 196, 105 198, 80 192
            C 50 188, 22 168, 10 142
            C 0 110, 4 80, 18 52
            C 38 22, 70 6, 100 4 Z
          " fill="url(#cookieBody)" stroke="#3a1f0a" stroke-width="2" stroke-linejoin="round"/>

          <!-- Inner subtle baked ring -->
          <path d="
            M 100 12
            C 132 10, 158 24, 174 44
            C 188 64, 188 90, 182 108
            C 190 130, 168 156, 146 174
            C 126 184, 104 186, 82 182
            C 56 178, 32 160, 20 138
            C 12 110, 16 84, 28 60
            C 46 32, 72 16, 100 12 Z
          " fill="none" stroke="#5a3215" stroke-width="0.8" opacity="0.5"/>

          <!-- A few baked specks -->
          <g fill="#3a1f0a" opacity="0.55">
            <circle cx="55"  cy="80"  r="1.3"/>
            <circle cx="120" cy="78"  r="1.4"/>
            <circle cx="158" cy="110" r="1.1"/>
            <circle cx="40"  cy="124" r="1.3"/>
            <circle cx="100" cy="138" r="1"/>
            <circle cx="138" cy="155" r="1.2"/>
            <circle cx="65"  cy="170" r="1.1"/>
            <circle cx="32"  cy="100" r="0.9"/>
            <circle cx="148" cy="40"  r="0.9"/>
          </g>

          <!-- Chocolate chips: simple radial shading, no shadow under -->
          <g>
            <circle cx="60"  cy="55"  r="11" fill="url(#chipBody)"/>
            <circle cx="132" cy="48"  r="13" fill="url(#chipBody)"/>
            <circle cx="170" cy="92"  r="9"  fill="url(#chipBody)"/>
            <circle cx="148" cy="130" r="11" fill="url(#chipBody)"/>
            <circle cx="92"  cy="98"  r="10" fill="url(#chipBody)"/>
            <circle cx="110" cy="156" r="10" fill="url(#chipBody)"/>
            <circle cx="50"  cy="130" r="10" fill="url(#chipBody)"/>
            <circle cx="35"  cy="78"  r="8"  fill="url(#chipBody)"/>
            <circle cx="75"  cy="178" r="8"  fill="url(#chipBody)"/>
            <circle cx="160" cy="168" r="9"  fill="url(#chipBody)"/>
          </g>

          <!-- Soft top-left highlight -->
          <ellipse cx="65" cy="58" rx="40" ry="22" fill="#ffffff" opacity="0.10"/>
        </svg>
      </button>
    </div>

    <button class="eat-btn" id="eat" title="Eat your whole cookie pile">Time to eat!</button>
  </div>

  <script>
    const STORAGE_KEY = 'horsey:cookieclicker:v1';

    const cookieEl  = document.getElementById('cookie');
    const counterEl = document.getElementById('counter');
    const cpsEl     = document.getElementById('cps');
    const eatBtn    = document.getElementById('eat');
    const fxLayer   = document.getElementById('fx-layer');
    const fxCanvas  = document.getElementById('fx-canvas');
    const fxCtx     = fxCanvas.getContext('2d');

    function defaultState() { return { cookies: 0, cps: 0 }; }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return Object.assign(defaultState(), JSON.parse(raw));
      } catch (_) {}
      return defaultState();
    }

    let state = loadState();
    let saveTimer = null;
    function saveStateDebounced() {
      if (saveTimer) return;
      saveTimer = setTimeout(() => {
        saveTimer = null;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
      }, 250);
    }

    function fmt(n) {
      return Math.floor(n).toLocaleString();
    }

    function renderCounter() {
      counterEl.textContent = fmt(state.cookies) + ' cookies';
      counterEl.classList.remove('pulse');
      void counterEl.offsetWidth;
      counterEl.classList.add('pulse');
      cpsEl.textContent = fmt(state.cps) + ' per second';
    }

    function bumpCookie() {
      cookieEl.classList.remove('pop');
      void cookieEl.offsetWidth;
      cookieEl.classList.add('pop');
    }

    // ---- Floating "+1" (slow drift to top of screen, gentle fade-out) ----
    function spawnPlusOne(clientX, clientY) {
      const el = document.createElement('span');
      el.className = 'fx-plus1';
      el.textContent = '+1';
      el.style.left = clientX + 'px';
      el.style.top  = clientY + 'px';
      fxLayer.appendChild(el);
      el.addEventListener('animationend', () => el.remove(), { once: true });
    }

    // ---- Falling chocolate-chip cookies (one per click) ----
    const MINI = (() => {
      const c = document.createElement('canvas');
      const S = 64;
      c.width = c.height = S;
      const g = c.getContext('2d');
      const cx = S / 2, cy = S / 2, r = S * 0.46;
      const grad = g.createRadialGradient(cx - r*0.25, cy - r*0.3, 0, cx, cy, r);
      grad.addColorStop(0,    '#dda069');
      grad.addColorStop(0.6,  '#b07840');
      grad.addColorStop(1,    '#5a3015');
      g.fillStyle = grad;
      g.beginPath();
      g.arc(cx, cy, r, 0, Math.PI * 2);
      g.fill();
      g.strokeStyle = 'rgba(42, 18, 6, 0.75)';
      g.lineWidth = 1.4;
      g.stroke();
      const chips = [
        [-0.45, -0.40, 0.18],
        [ 0.42, -0.45, 0.20],
        [-0.22,  0.30, 0.16],
        [ 0.35,  0.28, 0.18],
        [-0.40,  0.05, 0.15],
      ];
      g.fillStyle = '#1c0a04';
      for (const [dx, dy, fr] of chips) {
        g.beginPath();
        g.arc(cx + dx * r, cy + dy * r, fr * r, 0, Math.PI * 2);
        g.fill();
      }
      g.fillStyle = 'rgba(255, 255, 255, 0.10)';
      g.beginPath();
      g.ellipse(cx - r*0.3, cy - r*0.35, r*0.35, r*0.18, 0, 0, Math.PI * 2);
      g.fill();
      return c;
    })();

    const falling = [];
    function resizeFxCanvas() {
      fxCanvas.width  = window.innerWidth;
      fxCanvas.height = window.innerHeight;
    }
    function spawnFallingCookie(x, y) {
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
      const sp = 5 + Math.random() * 4;
      falling.push({
        x, y,
        vx: Math.cos(angle) * sp,
        vy: Math.sin(angle) * sp,
        size: 22 + Math.random() * 10,
        rot: Math.random() * Math.PI * 2,
        vr:  (Math.random() - 0.5) * 0.3,
        life: 1,
      });
    }
    function tickFalling() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      const h = fxCanvas.height;
      for (let i = falling.length - 1; i >= 0; i--) {
        const c = falling[i];
        c.x   += c.vx;
        c.y   += c.vy;
        c.vy  += 0.32;
        c.vx  *= 0.998;
        c.rot += c.vr;
        if (c.y > h - 40) c.life -= 0.04;
        if (c.life <= 0 || c.y > h + 80) { falling.splice(i, 1); continue; }
        fxCtx.save();
        fxCtx.globalAlpha = Math.min(1, c.life);
        fxCtx.translate(c.x, c.y);
        fxCtx.rotate(c.rot);
        fxCtx.drawImage(MINI, -c.size / 2, -c.size / 2, c.size, c.size);
        fxCtx.restore();
      }
      requestAnimationFrame(tickFalling);
    }

    // ---- Sound ----
    let audioCtx = null;
    function ensureAudio() {
      if (audioCtx) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      } catch (_) {}
    }
    function playClickPop() {
      ensureAudio();
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const f0 = 340 + Math.random() * 80;
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f0, t);
      osc.frequency.exponentialRampToValueAtTime(150, t + 0.07);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.18, t + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.1);
    }
    function playChomp() {
      ensureAudio();
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(190 + Math.random() * 40, t);
      osc.frequency.exponentialRampToValueAtTime(55, t + 0.13);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.22, t + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.18);
    }

    // ---- Click handler ----
    function onCookieClick(e) {
      let cx, cy;
      if (e.clientX || e.clientY) {
        cx = e.clientX;
        cy = e.clientY;
      } else {
        const r = cookieEl.getBoundingClientRect();
        cx = r.left + r.width  / 2;
        cy = r.top  + r.height / 2;
      }
      state.cookies += 1; // TODO: clickPower multiplier
      renderCounter();
      spawnPlusOne(cx, cy);
      spawnFallingCookie(cx, cy);   // exactly one mini-cookie per click
      playClickPop();
      bumpCookie();
      saveStateDebounced();
    }

    // ---- CpS tick (no-op while cps=0) ----
    function startCpsLoop() {
      setInterval(() => {
        if (state.cps > 0) {
          state.cookies += state.cps / 20;
          renderCounter();
          saveStateDebounced();
        }
      }, 50);
    }

    // ---- "Time to eat!" — confirm, animate, then reset ----
    let eating = false;
    function eatCookies() {
      if (eating) return;
      if (state.cookies === 0) {
        alert("You don't have any cookies to eat yet!");
        return;
      }
      const msg = 'Are you sure you want to eat all your cookies? '
                + 'You have ' + fmt(state.cookies) + '.';
      if (!confirm(msg)) return;
      eating = true;
      eatBtn.disabled = true;
      cookieEl.classList.add('eating');
      // 5 chomp sounds spaced through the 1.8s animation
      const chompMs = [0, 320, 640, 980, 1320];
      chompMs.forEach(ms => setTimeout(playChomp, ms));
      cookieEl.addEventListener('animationend', onEatDone, { once: true });
    }
    function onEatDone() {
      state.cookies = 0;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
      renderCounter();
      cookieEl.classList.remove('eating');
      eatBtn.disabled = false;
      eating = false;
    }

    cookieEl.addEventListener('click', onCookieClick);
    eatBtn.addEventListener('click', eatCookies);
    window.addEventListener('resize', resizeFxCanvas);

    resizeFxCanvas();
    renderCounter();
    requestAnimationFrame(tickFalling);
    startCpsLoop();

    // TODO: buildings — push into a BUILDINGS array, each {name, baseCost, cps}; render in shop panel
    // TODO: golden cookie spawner
  </script>
  <script src="../bg.js"></script>
</body>
</html>
