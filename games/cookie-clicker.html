<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Clicker - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      justify-content: flex-start;
      padding-top: 1.5rem;
      background: #0b0f24;
      overflow: hidden;
    }

    canvas#bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    }
    canvas#fx-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 15;
      pointer-events: none;
    }
    .fx-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: visible;
    }

    .back-link { z-index: 2; }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 1rem;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #a0c4ff 0%, #4e7fff 35%, #c7a0ff 70%, #a0c4ff 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 5s ease-in-out infinite, float 6s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(78, 127, 255, 0.4));
      position: relative;
      z-index: 2;
    }
    @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    /* === 3-COLUMN LAYOUT: 1/4 | 1/2 | 1/4 === */
    .layout {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1500px;
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 1rem;
      padding: 0 1rem;
      height: calc(100vh - 6rem);
      margin: 0 auto;
      animation: fadeIn 0.9s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .col-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      min-width: 0;
    }
    .panel {
      background: rgba(11, 15, 36, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(78, 127, 255, 0.18);
      border-radius: 16px;
      padding: 1rem 1.1rem;
      overflow-y: auto;
      min-width: 0;
    }
    .panel::-webkit-scrollbar { width: 8px; }
    .panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
    .panel::-webkit-scrollbar-thumb { background: rgba(78, 127, 255, 0.3); border-radius: 4px; }

    .panel-title {
      color: #a0c4ff;
      font-size: 0.78rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin: 1rem 0 0.5rem;
      border-bottom: 1px solid rgba(78, 127, 255, 0.25);
      padding-bottom: 0.35rem;
      font-weight: 600;
    }
    .panel-title:first-child { margin-top: 0; }
    .empty-state {
      color: #5a6f9c;
      font-size: 0.85rem;
      font-style: italic;
      padding: 0.4rem 0.2rem;
    }

    /* === LEFT COLUMN === */
    .counter-block { text-align: center; }
    .counter-num {
      font-size: 2.6rem;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-weight: 700;
      background: linear-gradient(135deg, #f5d77a, #d49d3e);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px rgba(245, 215, 122, 0.35));
      display: inline-block;
      transform-origin: center;
      line-height: 1;
    }
    .counter-num.pulse { animation: counterPulse 0.18s ease-out; }
    @keyframes counterPulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .counter-label {
      color: #c08850;
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 0.2rem;
    }
    .cps {
      color: #8ea7d6;
      font-size: 0.78rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 0.5rem;
      opacity: 0.85;
    }

    .cookie-wrap {
      position: relative;
      width: min(300px, 22vw);
      height: min(300px, 22vw);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cursors-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 7;
    }
    .auto-cursor {
      position: absolute;
      width: 22px;
      height: 22px;
      pointer-events: none;
      will-change: transform, left, top;
    }
    .cursor-tap {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
      transform-origin: center;
    }
    .cursor-tap.clicking { animation: cursorTap 0.32s ease-out; }
    @keyframes cursorTap {
      0%, 100% { transform: scale(1); }
      40%      { transform: scale(1.55); }
    }
    .cursor-tap svg { width: 100%; height: 100%; display: block; }

    .cookie-btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      width: 92%;
      height: 92%;
      transform-origin: center;
      transition: transform 0.12s cubic-bezier(.4,1.6,.5,1), filter 0.2s;
      filter: drop-shadow(0 8px 30px rgba(180, 110, 40, 0.45));
      z-index: 6;
    }
    .cookie-btn:hover { filter: drop-shadow(0 10px 38px rgba(220, 140, 50, 0.6)); }
    .cookie-btn.pop { transform: scale(0.93); }
    .cookie-btn:active { transform: scale(0.9); }
    .cookie-btn:focus-visible { outline: 2px solid #a0c4ff; outline-offset: 10px; border-radius: 50%; }
    .cookie-btn svg { width: 100%; height: 100%; display: block; }

    .cookie-btn.eating {
      pointer-events: none;
      animation: eatCookie 1.8s cubic-bezier(.45,.05,.55,1) forwards;
    }
    @keyframes eatCookie {
      0%   { transform: scale(1)    rotate(0deg);   opacity: 1; }
      12%  { transform: scale(1.04) rotate(-6deg); }
      25%  { transform: scale(0.88) rotate(8deg); }
      40%  { transform: scale(0.74) rotate(-12deg); }
      55%  { transform: scale(0.55) rotate(14deg); }
      70%  { transform: scale(0.36) rotate(-18deg); opacity: 0.85; }
      85%  { transform: scale(0.16) rotate(22deg);  opacity: 0.5; }
      100% { transform: scale(0)    rotate(-28deg); opacity: 0; }
    }

    .eat-btn {
      padding: 0.6rem 1.6rem;
      background: linear-gradient(135deg, #e89055, #b95a20);
      border: 2px solid #5a3215;
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
      box-shadow: 0 4px 14px rgba(184, 90, 32, 0.4);
    }
    .eat-btn:hover {
      background: linear-gradient(135deg, #f3a168, #c96828);
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(220, 120, 50, 0.55);
    }
    .eat-btn:active { transform: translateY(0); }
    .eat-btn:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }

    .btn-row {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    /* Dev/test "+1000" button — dashed border signals it isn't a normal
       gameplay button. Sits next to "Time to eat!". */
    .test-btn {
      padding: 0.55rem 1rem;
      background: rgba(80, 100, 140, 0.55);
      border: 2px dashed #6b7c97;
      border-radius: 12px;
      color: #e0e6f0;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .test-btn:hover {
      background: rgba(110, 135, 180, 0.75);
      border-color: #9ab2d6;
      transform: translateY(-1px);
    }
    .test-btn:active { transform: translateY(1px); }

    /* === MIDDLE COLUMN: stats === */
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      padding: 0.35rem 0.5rem;
      border-bottom: 1px solid rgba(78, 127, 255, 0.08);
      color: #ccd6ed;
      font-size: 0.9rem;
    }
    .stat-row .label { color: #8ea7d6; }
    .stat-row .val {
      color: #f5d77a;
      font-weight: 600;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }

    /* === RIGHT COLUMN: store === */
    .building-card {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.6rem;
      background: rgba(22, 33, 62, 0.65);
      border: 1.5px solid #0f3460;
      border-radius: 10px;
      margin-bottom: 0.5rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s, box-shadow 0.15s;
      text-align: left;
      font-family: inherit;
      color: #ddd;
      width: 100%;
    }
    .building-card:hover { background: rgba(15, 52, 96, 0.75); transform: translateX(2px); }
    .building-card.affordable {
      border-color: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.18);
    }
    .building-card.affordable:hover {
      background: rgba(34, 197, 94, 0.12);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.4);
    }
    .building-card:not(.affordable):not(.locked) { opacity: 0.7; cursor: not-allowed; }
    .building-card.locked {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(0.9);
    }
    .b-icon {
      font-size: 1.6rem;
      width: 32px;
      text-align: center;
      flex-shrink: 0;
    }
    .b-info { flex: 1; min-width: 0; }
    .b-name {
      font-weight: 700;
      color: #fff;
      font-size: 0.92rem;
      letter-spacing: 0.5px;
    }
    .b-rate {
      color: #f5d77a;
      font-weight: 600;
      font-size: 0.72rem;
      letter-spacing: 0.5px;
      margin-left: 0.4rem;
      opacity: 0.85;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    .building-card.locked .b-rate { color: #98a8c5; }

    /* --- Upgrades grid + hover tooltip --- */
    .upgrades-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 0.5rem;
    }
    .upgrade-tile {
      width: 50px;
      height: 50px;
      background: rgba(22, 33, 62, 0.7);
      border: 2px solid #0f3460;
      border-radius: 9px;
      padding: 5px;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }
    .upgrade-tile:hover { transform: translateY(-2px); border-color: #4e7fff; z-index: 10; }
    .upgrade-tile.affordable { border-color: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,0.3); }
    .upgrade-tile.affordable:hover { box-shadow: 0 0 16px rgba(34,197,94,0.55); }
    .upgrade-tile:not(.affordable):not(.owned) { opacity: 0.75; cursor: not-allowed; }
    .upgrade-tile.owned {
      cursor: default;
      opacity: 1;
      border-color: #f5d77a;
      background: rgba(70, 55, 25, 0.6);
      box-shadow: 0 0 10px rgba(245, 215, 122, 0.25);
    }
    .upgrade-tile.owned:hover {
      border-color: #ffe28a;
      background: rgba(95, 75, 35, 0.7);
      box-shadow: 0 0 18px rgba(245, 215, 122, 0.5);
    }
    .upgrade-tile > svg { width: 100%; height: 100%; display: block; }

    /* Portal tooltip, lives at body level so the right-column panel's
       overflow-y: auto can't clip it. Positioned by JS on hover. */
    .upgrade-tooltip-portal {
      position: fixed;
      width: 240px;
      background: rgba(20, 30, 56, 0.98);
      border: 1.5px solid #4e7fff;
      border-radius: 10px;
      padding: 0.7rem 0.8rem;
      z-index: 9999;
      pointer-events: none;
      box-shadow: 0 8px 30px rgba(0,0,0,0.55);
      text-align: left;
      font-family: sans-serif;
    }
    .tip-head { display: flex; gap: 0.6rem; align-items: center; margin-bottom: 0.55rem; }
    .tip-icon { width: 36px; height: 36px; flex-shrink: 0; }
    .tip-icon svg { width: 100%; height: 100%; display: block; }
    .tip-name { color: #fff; font-weight: 700; font-size: 0.95rem; line-height: 1.1; }
    .tip-cost { color: #f5d77a; font-size: 0.78rem; font-family: ui-monospace, Menlo, Consolas, monospace; margin-top: 2px; }
    .tip-effect {
      color: #a0c4ff;
      font-size: 0.8rem;
      padding: 0.4rem 0;
      border-top: 1px solid rgba(78,127,255,0.22);
      border-bottom: 1px solid rgba(78,127,255,0.22);
      margin-bottom: 0.4rem;
    }
    .tip-desc {
      color: #b0b8ce;
      font-size: 0.78rem;
      font-style: italic;
    }
    .b-desc {
      font-size: 0.72rem;
      color: #98a8c5;
      font-style: italic;
      margin-top: 1px;
    }
    .b-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      flex-shrink: 0;
    }
    .b-cost {
      color: #f5d77a;
      font-weight: 700;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.9rem;
    }
    .b-count {
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      opacity: 0.85;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }

    .fx-plus1 {
      position: fixed;
      transform: translate(-50%, -50%);
      font-size: 1.6rem;
      font-weight: 700;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      color: #ffe48a;
      text-shadow: 0 0 12px rgba(255, 220, 130, 0.7), 0 2px 4px rgba(0,0,0,0.4);
      pointer-events: none;
      animation: floatUp 3s cubic-bezier(.25,.6,.45,1) forwards;
      will-change: transform, opacity;
    }
    @keyframes floatUp {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      6%   { opacity: 1; transform: translate(-50%, -55%) scale(1.18); }
      70%  { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, calc(-50% - 95vh)) scale(0.92); }
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
        height: auto;
        overflow-y: auto;
      }
      body { overflow: auto; }
      .cookie-wrap { width: min(280px, 80vw); height: min(280px, 80vw); }
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
  <canvas id="fx-canvas"></canvas>
  <div class="fx-layer" id="fx-layer"></div>
  <a href="../games.html" class="back-link">&larr; All Games</a>

  <h1>Cookie Clicker</h1>

  <div class="layout">
    <!-- LEFT: cookie + counter + eat -->
    <div class="col-left">
      <div class="counter-block">
        <div class="counter-num" id="counter-num">0</div>
        <div class="counter-label">cookies</div>
        <div class="cps" id="cps">0.0 / sec</div>
      </div>
      <div class="cookie-wrap">
        <div class="cursors-layer" id="cursors-layer"></div>
        <button class="cookie-btn" id="cookie" aria-label="Click the cookie">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="cookieBody" cx="42%" cy="38%" r="78%">
                <stop offset="0%"   stop-color="#dda069"/>
                <stop offset="60%"  stop-color="#b07840"/>
                <stop offset="100%" stop-color="#7c4820"/>
              </radialGradient>
              <radialGradient id="chipBody" cx="35%" cy="28%" r="80%">
                <stop offset="0%"   stop-color="#5a2a10"/>
                <stop offset="60%"  stop-color="#2a1006"/>
                <stop offset="100%" stop-color="#0a0301"/>
              </radialGradient>
            </defs>
            <!-- Mostly-circular cookie outline (slight bumps only) -->
            <path d="
              M 196 100
              C 196 125, 184 149, 166 166
              C 149 184, 125 195, 100 195
              C 75 195, 51 184, 34 166
              C 17 149, 4 125, 4 100
              C 4 75, 17 51, 34 34
              C 51 16, 75 5, 100 5
              C 125 5, 149 16, 166 34
              C 184 51, 196 75, 196 100 Z
            " fill="url(#cookieBody)" stroke="#3a1f0a" stroke-width="2" stroke-linejoin="round"/>
            <path d="
              M 184 100
              C 184 121, 173 142, 158 158
              C 142 174, 121 184, 100 184
              C 79 184, 58 173, 42 158
              C 26 142, 16 121, 16 100
              C 16 79, 27 58, 42 42
              C 58 26, 79 16, 100 16
              C 121 16, 142 27, 158 42
              C 173 58, 184 79, 184 100 Z
            " fill="none" stroke="#5a3215" stroke-width="0.8" opacity="0.5"/>
            <g fill="#3a1f0a" opacity="0.55">
              <circle cx="55"  cy="80"  r="1.3"/>
              <circle cx="120" cy="78"  r="1.4"/>
              <circle cx="158" cy="110" r="1.1"/>
              <circle cx="40"  cy="124" r="1.3"/>
              <circle cx="100" cy="138" r="1"/>
              <circle cx="138" cy="155" r="1.2"/>
              <circle cx="65"  cy="170" r="1.1"/>
              <circle cx="32"  cy="100" r="0.9"/>
              <circle cx="148" cy="40"  r="0.9"/>
            </g>
            <g>
              <circle cx="60"  cy="55"  r="11" fill="url(#chipBody)"/>
              <circle cx="132" cy="48"  r="13" fill="url(#chipBody)"/>
              <circle cx="170" cy="92"  r="9"  fill="url(#chipBody)"/>
              <circle cx="148" cy="130" r="11" fill="url(#chipBody)"/>
              <circle cx="92"  cy="98"  r="10" fill="url(#chipBody)"/>
              <circle cx="110" cy="156" r="10" fill="url(#chipBody)"/>
              <circle cx="50"  cy="130" r="10" fill="url(#chipBody)"/>
              <circle cx="35"  cy="78"  r="8"  fill="url(#chipBody)"/>
              <circle cx="75"  cy="178" r="8"  fill="url(#chipBody)"/>
              <circle cx="160" cy="168" r="9"  fill="url(#chipBody)"/>
            </g>
            <ellipse cx="65" cy="58" rx="40" ry="22" fill="#ffffff" opacity="0.10"/>
          </svg>
        </button>
      </div>
      <div class="btn-row">
        <button class="eat-btn" id="eat" title="Eat all your cookies">Time to eat!</button>
        <button class="test-btn" id="test-1000" title="Dev: +1000 cookies">+1000 🧪</button>
        <button class="test-btn" id="test-x5"   title="Dev: multiply your bank by 5">×5 🧪</button>
        <button class="test-btn" id="test-x10"  title="Dev: multiply your bank by 10">×10 🧪</button>
      </div>
    </div>

    <!-- MIDDLE: stats -->
    <div class="col-middle panel">
      <h2 class="panel-title">Stats</h2>
      <div class="stat-row"><span class="label">Cookies in bank</span>      <span class="val" id="s-cookies">0</span></div>
      <div class="stat-row"><span class="label">All-time cookies made</span><span class="val" id="s-total">0</span></div>
      <div class="stat-row"><span class="label">Per second</span>           <span class="val" id="s-cps">0.0</span></div>
      <div class="stat-row"><span class="label">Per click</span>            <span class="val" id="s-perclick">1</span></div>
      <div class="stat-row"><span class="label">Total hand-clicks</span>    <span class="val" id="s-clicks">0</span></div>

      <h2 class="panel-title">Owned buildings</h2>
      <div id="building-stats">
        <div class="empty-state">No buildings yet. Open the store →</div>
      </div>

      <h2 class="panel-title">Owned upgrades</h2>
      <div id="owned-upgrades">
        <div class="empty-state">No upgrades yet.</div>
      </div>
    </div>

    <!-- RIGHT: upgrades + store -->
    <div class="col-right panel">
      <h2 class="panel-title">Upgrades</h2>
      <div id="upgrades-row" class="upgrades-row"></div>
      <div id="upgrades-empty" class="empty-state">No upgrades yet.</div>
      <h2 class="panel-title">Store</h2>
      <div id="store-buildings"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'horsey:cookieclicker:v1';

    // --- Buildings catalog (only defined buildings; mystery slots are
    //     virtual placeholders rendered separately). When new buildings get
    //     names later, push them onto this list. ---
    const BUILDINGS = [
      { id: 'autoclicker', name: 'Autoclicker', desc: 'Clicks when your hand is tired',                     baseCost: 15,   baseCps: 0.1, icon: '👆' },
      { id: 'grandma',     name: 'Grandma',     desc: 'A nice grandma to make you cookies',                 baseCost: 100,  baseCps: 1.0, icon: '👵' },
      { id: 'farm',        name: 'Farm',        desc: 'A cookie farm that grows cookies from cookie seeds', baseCost: 1100,  baseCps: 8.0,  icon: '🌾' },
      { id: 'mine',        name: 'Mine',        desc: 'Digs out cookie dough and chocolate chips',          baseCost: 12000,  baseCps: 47.0,  icon: '⛏️' },
      { id: 'factory',     name: 'Factory',     desc: 'Produces large quantities of cookies',               baseCost: 130000, baseCps: 260.0, icon: '🏭' },
    ];

    // --- Upgrades catalog ---
    // Each upgrade can multiply click power and/or per-building CPS.
    // `requires(state)` must return true for the upgrade to appear in the panel.
    // Web-pointer hand: closed fist + thumb on the left + index finger up.
    function handCursorSvg(fillColor, nailColor, knuckleColor) {
      return '<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">' +

    function defaultState() {
      const buildings = {};
      for (const b of BUILDINGS) buildings[b.id] = 0;
      return {
        cookies: 0,
        totalEarned: 0,
        totalClicks: 0,
        cps: 0,

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const def = defaultState();
          const merged = Object.assign(def, parsed);
          // Keep only known building keys (drops stale mystery1/2/3 from old saves).
          const cleanBuildings = {};
          for (const id in def.buildings) {
            cleanBuildings[id] = (parsed.buildings && parsed.buildings[id]) || 0;
          }
          merged.buildings = cleanBuildings;
          // Auto-advance reveals: anything the player has already bought is revealed.
          let minRevealed = 2;
          for (let i = 2; i < BUILDINGS.length; i++) {
            if (cleanBuildings[BUILDINGS[i].id] > 0) minRevealed = i + 1;
          }
          merged.revealedCount = Math.max(parsed.revealedCount || 2, minRevealed);
          merged.mysterySlots = merged.revealedCount > 2 ? 2 : (parsed.mysterySlots || 1);
          // Filter upgrades to known ids only.
          const validIds = new Set(UPGRADES.map(u => u.id));
          merged.upgrades = (Array.isArray(parsed.upgrades) ? parsed.upgrades : []).filter(id => validIds.has(id));
          merged.revealedUpgrades = (Array.isArray(parsed.revealedUpgrades) ? parsed.revealedUpgrades : []).filter(id => validIds.has(id));
          return merged;
        }
      } catch (_) {}
      return defaultState();
    }

    function fmt(n)   { return Math.floor(n).toLocaleString(); }

    function buildingCost(b, owned) {
      return Math.ceil(b.baseCost * Math.pow(1.15, owned));
    }

    // Multiplier helpers (from purchased upgrades). Apply to click power and per-building CPS.
    function getClickMult() {
      let m = 1;
      for (const u of UPGRADES) {
        if (state.upgrades.includes(u.id) && u.clickMult) m *= u.clickMult;
      }
      return m;
    }
    function getBuildingMult(id) {
      let m = 1;
      for (const u of UPGRADES) {
        if (state.upgrades.includes(u.id) && u.buildingMult && u.buildingMult[id]) {
          m *= u.buildingMult[id];
        }
      }
      return m;
    }
    // Global multiplier — applied to total CPS (and to per-building rate
    // shown in the store) but NOT to manual click power.
    function getCpsMult() {
      let m = 1;
      for (const u of UPGRADES) {
        if (state.upgrades.includes(u.id) && u.cpsMult) m *= u.cpsMult;
      }
      return m;
    }
    function buildingEffectiveCps(b) {
      return b.baseCps * getBuildingMult(b.id) * getCpsMult();
    }
    function recomputeCps() {
      let s = 0;
      for (const b of BUILDINGS) {
        s += (state.buildings[b.id] || 0) * b.baseCps * getBuildingMult(b.id);
      }
      state.cps = s * getCpsMult();
    }

        const owned = state.buildings[id] || 0;
        const cost  = buildingCost(b, owned);

      if (!next || !next.baseCost) return;
      if (state.cookies >= next.baseCost * 5 / 6) {

      tooltipPortal.innerHTML =

        '<div class="tip-desc">&ldquo;' + u.desc + '&rdquo;</div>';
      tooltipPortal.style.display = 'block';
      const r  = tile.getBoundingClientRect();
      const tr = tooltipPortal.getBoundingClientRect();
      let left = r.left - tr.width - 12;
      let top  = r.top + r.height / 2 - tr.height / 2;
      if (left < 10) left = r.right + 12;                                 // flip to right side
      if (top < 10) top = 10;
      if (top + tr.height > window.innerHeight - 10) {
        top = window.innerHeight - tr.height - 10;
      }
      tooltipPortal.style.left = left + 'px';
      tooltipPortal.style.top  = top  + 'px';
    }

      tooltipPortal.style.display = 'none';

    function appendUpgradeTile(u) {

      tile.className = 'upgrade-tile';

    // Sticky reveal: once an upgrade's requires() fires we remember it,
    // so dropping below the threshold (e.g. spending cookies) doesn't
    // make the tile disappear.
    function checkUpgradeReveals() {
      let changed = false;
      for (const u of UPGRADES) {
        if (state.upgrades.includes(u.id)) continue;
        if (state.revealedUpgrades.includes(u.id)) continue;
        if (u.requires()) {
          state.revealedUpgrades.push(u.id);
          changed = true;

      if (changed) renderUpgrades();

      for (const u of UPGRADES) {
        if (state.upgrades.includes(u.id)) continue;
        if (!state.revealedUpgrades.includes(u.id)) continue;
        appendUpgradeTile(u);
        any = true;
      }
      upgradesEmptyEl.style.display = any ? 'none' : 'block';
    }

    // Owned-upgrades tiles. Only rebuild on actual change (init / buy /
    // eat-reset) so hover transitions don't get interrupted every tick.
    function renderOwnedUpgrades() {
      const ownedUpsEl = document.getElementById('owned-upgrades');
      ownedUpsEl.innerHTML = '';
      const ownedUps = UPGRADES.filter(u => state.upgrades.includes(u.id));
      if (ownedUps.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No upgrades yet.';
        ownedUpsEl.appendChild(empty);
        return;
      }
      const row = document.createElement('div');
      row.className = 'upgrades-row';
      for (const u of ownedUps) {
        const tile = document.createElement('div');
        tile.className = 'upgrade-tile owned';
        tile.innerHTML = u.svg;
        tile.addEventListener('mouseenter', () => showTooltipFor(tile, u));
        tile.addEventListener('mouseleave', hideTooltip);
        row.appendChild(tile);
      }
      ownedUpsEl.appendChild(row);
    }
    function updateUpgradeAffordability() {
      const tiles = upgradesRowEl.querySelectorAll('.upgrade-tile');
      for (const tile of tiles) {
        const u = UPGRADES.find(x => x.id === tile.dataset.upgrade);
        if (!u) continue;
        tile.classList.toggle('affordable', state.cookies >= u.cost);
      }
    }
    function buyUpgrade(id) {
      const u = UPGRADES.find(x => x.id === id);
      if (!u) return;
      if (state.upgrades.includes(id)) return;
      if (!state.revealedUpgrades.includes(id)) return;
      if (state.cookies < u.cost) return;
      state.cookies -= u.cost;
      state.upgrades.push(id);
      recomputeCps();
      renderUpgrades();
      renderOwnedUpgrades();
      updateCounterText();
      updateAffordability();
      updateUpgradeAffordability();
      renderStats();
      saveStateDebounced();
      playPurchase();
    }
    function renderStats() {
      document.getElementById('s-cookies').textContent  = fmt(state.cookies);
      document.getElementById('s-total').textContent    = fmt(state.totalEarned);
      document.getElementById('s-cps').textContent      = fmt1(state.cps);
      document.getElementById('s-perclick').textContent = fmt(getClickMult());
      document.getElementById('s-clicks').textContent   = fmt(state.totalClicks);

      // owned buildings — show effective contribution (post-multipliers)
      const owned = BUILDINGS.filter(b => (state.buildings[b.id] || 0) > 0);
      if (owned.length === 0) {
        buildingStatsEl.innerHTML = '<div class="empty-state">No buildings yet. Open the store →</div>';
      } else {
        let html = '';
        for (const b of owned) {
          const n = state.buildings[b.id];
          const contrib = n * buildingEffectiveCps(b);
          html += '<div class="stat-row">' +
                    '<span class="label">' + b.icon + ' ' + b.name + ' &times; ' + n + '</span>' +
                    '<span class="val">+' + fmt1(contrib) + ' / s</span>' +
                  '</div>';
        }
        buildingStatsEl.innerHTML = html;
      }

      // owned upgrades are NOT rebuilt here — see renderOwnedUpgrades.
      // Doing it on the 200ms tick was wiping :hover state mid-transition
      // and made the tiles bounce.
    }

    function buy(id) {
      const b = BUILDINGS.find(x => x.id === id);
      if (!b) return;
      const owned = state.buildings[id] || 0;
      const cost = buildingCost(b, owned);
      if (state.cookies < cost) return;
      state.cookies -= cost;
      state.buildings[id] = owned + 1;
      recomputeCps();
      updateCounterText();
      updateAffordability();
      checkUpgradeReveals();         // newly purchased building can unlock upgrades
      updateUpgradeAffordability();
      renderStats();
      saveStateDebounced();
      playPurchase();
    }

    // --- Floating "+N" (N = click power) ---
    function spawnPlusOne(clientX, clientY, value) {
      const el = document.createElement('span');
      el.className = 'fx-plus1';
      el.textContent = '+' + (value || 1);
      el.style.left = clientX + 'px';
      el.style.top  = clientY + 'px';
      fxLayer.appendChild(el);
      el.addEventListener('animationend', () => el.remove(), { once: true });
    }

    // --- Falling cookie particle (1 per manual click) ---
    const MINI = (() => {
      const c = document.createElement('canvas');
      const S = 64;
      c.width = c.height = S;
      const g = c.getContext('2d');
      const cx = S / 2, cy = S / 2, r = S * 0.46;
      const grad = g.createRadialGradient(cx - r*0.25, cy - r*0.3, 0, cx, cy, r);
      grad.addColorStop(0,    '#dda069');
      grad.addColorStop(0.6,  '#b07840');
      grad.addColorStop(1,    '#5a3015');
      g.fillStyle = grad;
      g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
      g.strokeStyle = 'rgba(42, 18, 6, 0.75)';
      g.lineWidth = 1.4; g.stroke();
      const chips = [[-0.45,-0.40,0.18],[0.42,-0.45,0.20],[-0.22,0.30,0.16],[0.35,0.28,0.18],[-0.40,0.05,0.15]];
      g.fillStyle = '#1c0a04';
      for (const [dx,dy,fr] of chips) { g.beginPath(); g.arc(cx+dx*r, cy+dy*r, fr*r, 0, Math.PI*2); g.fill(); }
      g.fillStyle = 'rgba(255,255,255,0.10)';
      g.beginPath(); g.ellipse(cx-r*0.3, cy-r*0.35, r*0.35, r*0.18, 0, 0, Math.PI*2); g.fill();
      return c;
    })();

    const falling = [];
    function resizeFxCanvas() {
      fxCanvas.width  = window.innerWidth;
      fxCanvas.height = window.innerHeight;
    }
    function spawnFallingCookie(x, y) {
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
      const sp = 5 + Math.random() * 4;
      falling.push({
        x, y,
        vx: Math.cos(angle) * sp,
        vy: Math.sin(angle) * sp,
        size: 22 + Math.random() * 10,
        rot: Math.random() * Math.PI * 2,
        vr:  (Math.random() - 0.5) * 0.3,
        life: 1,
      });
    }
    function tickFalling() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      const h = fxCanvas.height;
      for (let i = falling.length - 1; i >= 0; i--) {
        const c = falling[i];
        c.x += c.vx; c.y += c.vy;
        c.vy += 0.32; c.vx *= 0.998;
        c.rot += c.vr;
        if (c.y > h - 40) c.life -= 0.04;
        if (c.life <= 0 || c.y > h + 80) { falling.splice(i, 1); continue; }
        fxCtx.save();
        fxCtx.globalAlpha = Math.min(1, c.life);
        fxCtx.translate(c.x, c.y);
        fxCtx.rotate(c.rot);
        fxCtx.drawImage(MINI, -c.size/2, -c.size/2, c.size, c.size);
        fxCtx.restore();
      }
      requestAnimationFrame(tickFalling);
    }

    // --- Sound ---
    let audioCtx = null;
    function ensureAudio() {
      if (audioCtx) return;
      try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); } catch (_) {}
    }
    function playClickPop() {
      ensureAudio(); if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(340 + Math.random() * 80, t);
      osc.frequency.exponentialRampToValueAtTime(150, t + 0.07);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.18, t + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.1);
    }
    function playChomp() {
      ensureAudio(); if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(190 + Math.random() * 40, t);
      osc.frequency.exponentialRampToValueAtTime(55, t + 0.13);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.22, t + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.18);
    }
    function playPurchase() {
      ensureAudio(); if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(560, t);
      osc.frequency.exponentialRampToValueAtTime(880, t + 0.08);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.13, t + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.2);
    }

    // --- Autoclicker cursors ---
    const MAX_VISIBLE_CURSORS = 16;
    const cursorEls = [];
    const CURSOR_SVG =
      '<svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M 11 2 L 5 18 L 11 15 L 17 18 Z" fill="#fff" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round"/>' +
      '</svg>';
    function addCursor() {
      const orbit = document.createElement('div');
      orbit.className = 'auto-cursor';
      const tap = document.createElement('div');
      tap.className = 'cursor-tap';
      tap.innerHTML = CURSOR_SVG;
      orbit.appendChild(tap);
      orbit.lastClick = performance.now() - Math.random() * 10000;
      cursorLayerEl.appendChild(orbit);
      cursorEls.push(orbit);
    }
    function removeCursor() {
      const c = cursorEls.pop();
      if (c) c.remove();
    }
    function syncCursors() {
      const target = Math.min(state.buildings.autoclicker || 0, MAX_VISIBLE_CURSORS);
      while (cursorEls.length < target) addCursor();
      while (cursorEls.length > target) removeCursor();
    }
    function tickCursors() {
      const now = performance.now();
      syncCursors();
      const wrap = cursorLayerEl.getBoundingClientRect();
      if (wrap.width > 0) {
        const cx = wrap.width / 2;
        const cy = wrap.height / 2;
        const radius = Math.min(wrap.width, wrap.height) * 0.48;
        const n = cursorEls.length;
        for (let i = 0; i < n; i++) {
          const ce = cursorEls[i];
          const phase = (i / n) * Math.PI * 2;
          const angle = phase + now * 0.0008;
          const x = cx + radius * Math.cos(angle);
          const y = cy + radius * Math.sin(angle);
          ce.style.left = x + 'px';
          ce.style.top  = y + 'px';
          // tip (default points up) → rotate so it points toward cookie center
          ce.style.transform = 'translate(-50%, -50%) rotate(' + (angle - Math.PI / 2) + 'rad)';

          if (now - ce.lastClick > 10000) {
            ce.lastClick = now;
            const tap = ce.firstChild;
            tap.classList.remove('clicking');
            void tap.offsetWidth;
            tap.classList.add('clicking');
          }
        }
      }
      requestAnimationFrame(tickCursors);
    }

    // --- Manual click ---
    function bumpCookie() {
      cookieEl.classList.remove('pop');
      void cookieEl.offsetWidth;
      cookieEl.classList.add('pop');
    }
    function onCookieClick(e) {
      if (eating) return;
      let cx, cy;
      if (e.clientX || e.clientY) { cx = e.clientX; cy = e.clientY; }
      else {
        const r = cookieEl.getBoundingClientRect();
        cx = r.left + r.width / 2;
        cy = r.top  + r.height / 2;
      }
      const power = getClickMult();
      state.cookies     += power;
      state.totalEarned += power;
      state.totalClicks += 1;
      updateCounterText();
      updateAffordability();
      updateUpgradeAffordability();
      checkReveals();
      checkUpgradeReveals();
      pulseCounter();
      spawnPlusOne(cx, cy, power);
      spawnFallingCookie(cx, cy);
      playClickPop();
      bumpCookie();
      saveStateDebounced();
    }

    // --- CPS loop (passive income from buildings) ---
    function gameTick() {
      if (state.cps > 0) {
        const gained = state.cps / 20;
        state.cookies     += gained;
        state.totalEarned += gained;
        updateCounterText();
        updateAffordability();
        updateUpgradeAffordability();
        checkReveals();
        checkUpgradeReveals();
        saveStateDebounced();
      }
    }
    setInterval(gameTick, 50);
    setInterval(renderStats, 200); // less frequent — stats panel changes are mostly cosmetic

    // --- Eat: full wipe (cookies, buildings, stats, reveals) ---
    let eating = false;
    function eatCookies() {
      if (eating) return;
      if (state.cookies < 1 && state.totalEarned < 1) {
        alert("You don't have any cookies to eat yet!");
        return;
      }
      const msg = 'Are you sure you want to eat all your cookies?\n\n'
                + 'This wipes everything — cookies, buildings, CPS, and stats.\n'
                + 'You currently have ' + fmt(state.cookies) + ' cookies.';
      if (!confirm(msg)) return;
      eating = true;
      eatBtn.disabled = true;
      cookieEl.classList.add('eating');
      [0, 320, 640, 980, 1320].forEach(ms => setTimeout(playChomp, ms));
      cookieEl.addEventListener('animationend', onEatDone, { once: true });
    }
    function onEatDone() {
      state = defaultState();
      recomputeCps();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
      renderStore();
      renderUpgrades();
      renderOwnedUpgrades();
      updateCounterText();
      updateAffordability();
      renderStats();
      cookieEl.classList.remove('eating');
      eatBtn.disabled = false;
      eating = false;
    }

    // --- Wire up ---
    cookieEl.addEventListener('click', onCookieClick);
    eatBtn.addEventListener('click', eatCookies);
    function devGrant(delta) {
      state.cookies     += delta;
      state.totalEarned += delta;
      updateCounterText();
      updateAffordability();
      updateUpgradeAffordability();
      checkReveals();
      checkUpgradeReveals();
      renderStats();
      saveStateDebounced();
    }
    document.getElementById('test-1000').addEventListener('click', () => devGrant(1000));
    document.getElementById('test-x5').addEventListener('click', () => {
      const before = state.cookies;
      const gained = before * 4;          // bank × 5 means +4× to reach 5× total
      if (gained > 0) devGrant(gained);
    });
    document.getElementById('test-x10').addEventListener('click', () => {
      const before = state.cookies;
      const gained = before * 9;          // bank × 10 → +9× current
      if (gained > 0) devGrant(gained);
    });
    window.addEventListener('resize', resizeFxCanvas);

    recomputeCps();
    resizeFxCanvas();
    checkUpgradeReveals();
    renderStore();
    renderUpgrades();
    renderOwnedUpgrades();
    updateCounterText();
    updateAffordability();
    updateUpgradeAffordability();
    renderStats();
    requestAnimationFrame(tickFalling);
    requestAnimationFrame(tickCursors);

    // TODO: upgrades, golden cookies, more buildings — slot into BUILDINGS / upgrades panel
  </script>
  <script src="../bg.js"></script>
</body>
</html>
