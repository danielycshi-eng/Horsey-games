  var P3_BOMB_RACE  = 900;       // and in the bombs
  var P3_SCREECH_AIM = [1.2, 2.2];   // how long each yellow guy follows you
  var P3_CHARGE     = 1100;      // and how fast it then charges down its line
  var SCREECH_SIZE  = 46;        // a big yellow guy
  var P3_FIREBALLS  = 10;
  var P3_FIRE_GAP   = 1.0;       // seconds between them
  var P3_FIRE_SPEED = 500;
  var P3_TOOTH      = 34;        // one dropped spike, one tooth

  function phase3Move(b, mv) {
    var e = roomEdges(), i;
    if (mv.kind === 'crash') {
      mv.speed = 2400;
      mv.slams = P3_SLAMS;
      mv.noBreak = true;
      mv.dur = 10;

    } else if (mv.kind === 'seekers') {
      mv.count = 2;                      // two, normal size, slower - flying out first
      mv.flyOut = true;
      mv.slow = true;

    } else if (mv.kind === 'spikeballs') {
      mv.dur = 0.3 + FINAL_BALLS * 1.0 + 0.3;
      mv.sent = 0;
      mv.race = P3_RACE;

    } else if (mv.kind === 'saws') {
      mv.orbit = 1.7;
      mv.gather = 0.5;
      mv.speed = 340;
      mv.walls = [];
      /* the slots from the ground up: 412, 354, 296, 238 */
      var opens = [[412], [354, 296], [296, 238]];
      var dir = Math.random() < 0.5 ? 1 : -1;
      for (i = 0; i < FINAL_SAW_WALLS; i++) {
        mv.walls.push({ dir: dir, from: dir > 0 ? e.L - 90 : e.R + 90,
                        start: mv.orbit + mv.gather + i * FINAL_SAW_GAP,
                        open: opens[Math.floor(Math.random() * opens.length)] });
        dir = -dir;
      }
      mv.dur = mv.orbit + mv.gather + (FINAL_SAW_WALLS - 1) * FINAL_SAW_GAP +
               (e.R - e.L + 180) / mv.speed + 0.2;

    } else if (mv.kind === 'helpers') {
      mv.dur = 1.6;
      mv.sent = false;

    } else if (mv.kind === 'screech') {
      var cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      mv.birds = [];
      for (i = 0; i < 2; i++) {
        mv.birds.push({ fromX: cx, fromY: cy,
                        toX: i === 0 ? e.L + 70 : e.R - 70, toY: 80,
                        x: cx, y: cy, aimT: P3_SCREECH_AIM[i],
                        ang: 0, fired: false });
      }
      if (Math.random() < 0.5) mv.birds.reverse();       // either side goes first
      mv.birds[0].aimT = P3_SCREECH_AIM[0];
      mv.birds[1].aimT = P3_SCREECH_AIM[1];
      mv.dur = 0.6 + P3_SCREECH_AIM[1] + 0.3 + 1700 / P3_CHARGE;

    } else if (mv.kind === 'rain') {
      /* 13..20 of the floor's tooth-wide slots, picked at random */
      var slots = [];
      for (var sx = e.L + 4; sx + P3_TOOTH <= e.R - 4; sx += P3_TOOTH) slots.push(sx);
      for (i = slots.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = slots[i]; slots[i] = slots[j]; slots[j] = tmp;
      }
      var n = 5 + Math.floor(Math.random() * 5);         // 5 to 9
      mv.drops = slots.slice(0, n);
      mv.sweep = 2.4;                    // he crosses the room dropping them
      mv.dir = (b.x + b.w / 2) < (e.L + e.R) / 2 ? 1 : -1;
      mv.dur = 0.4 + mv.sweep + 0.6;
      mv.dropped = [];

    } else if (mv.kind === 'fire') {
      mv.fired = 0;
      mv.dur = 0.5 + P3_FIREBALLS * P3_FIRE_GAP + 0.4;

    } else if (mv.kind === 'bombs') {
      mv.dur = 14;
      mv.every = 0.3;
      mv.vx = (Math.random() < 0.5 ? 1 : -1) * P3_BOMB_RACE;
      mv.blueAt = 8 + Math.random() * 5;
    }
  }

  /* The spikes he rains down: each falls, lands as one tooth, and stays
     for the next two attacks; then it sinks back into the floor. */
  var RAIN_SINK = 1.4;

  function ageRainSpikes() {
    var list = level.rainSpikes;
    if (!list) return;
    for (var i = 0; i < list.length; i++) {
      if (!list[i].landed) continue;
      list[i].left--;
      if (list[i].left < 0 && !list[i].sinking) list[i].sinking = true;
    }
  }

  function rainBox(s) {
    if (!s.landed) return { x: s.x + 4, y: s.y, w: P3_TOOTH - 8, h: 22 };
    var out = s.sinking ? Math.max(0, 1 - s.sinkT / RAIN_SINK) : 1;
    return { x: s.x, y: GROUND - 22 * out, w: P3_TOOTH, h: 22 * out };
  }

  function updateRainSpikes(dt) {
    var list = level.rainSpikes;
    if (!list) return;
    for (var i = list.length - 1; i >= 0; i--) {
      var s = list[i];
      if (!s.landed) {
        s.vy = Math.min(MAX_FALL * 1.5, s.vy + GRAVITY * dt);
        s.y += s.vy * dt;
        if (s.y + 22 >= GROUND) { s.y = GROUND - 22; s.landed = true;
                                  burst(s.x + P3_TOOTH / 2, GROUND, '#ff2d55', 5, 0.8); }
      } else if (s.sinking) {
        s.sinkT += dt;
        if (s.sinkT >= RAIN_SINK) { list.splice(i, 1); continue; }
      }
      var hb = rainBox(s);
      if (hb.h > 3 && hits(p, hb)) { die(); return; }
    }
  }

  /* his fireballs: straight at where you were */
  function updateFireballs(dt) {
    var list = level.fireballs;
    if (!list) return;
    var e = roomEdges();
    for (var i = list.length - 1; i >= 0; i--) {
      var f = list[i];
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      if (circleHitsBox(f.x, f.y, f.r - 3, p)) { die(); return; }
      if (f.y > GROUND - 4) {
        burst(f.x, GROUND, '#ff8c42', 14, 1.0);
        list.splice(i, 1);
      } else if (f.x < e.L - 200 || f.x > e.R + 200 || f.y < -200) {
        list.splice(i, 1);
      }
    }
  }

  /* a screecher's dotted line, or its shot, as a line out from it */
  function screechLineHits(bd) {
    var dx = Math.cos(bd.ang), dy = Math.sin(bd.ang);
    var px = p.x + p.w / 2 - bd.x, py = p.y + p.h / 2 - bd.y;
    var along = px * dx + py * dy;
    if (along < 0) return false;
    var off = Math.abs(px * dy - py * dx);
    return off < 10 + p.w / 2;
  }

  /* The final boss's versions of the attacks, and his two of his own. */
  var FINAL_SAW_WALLS = 5;
  var FINAL_SAW_GAP   = 1.1;     // seconds between walls
  var FINAL_BALLS     = 5;
  var FINAL_HELPERS   = 10;

  function finalMove(b, mv) {
    var i;
    if (mv.kind === 'laser') {
      /* quicker, and it sweeps there and back */
      mv.charge = 0.8;
      mv.pass = 2.4;
      mv.dur = mv.charge + 2 * mv.pass;

    } else if (mv.kind === 'crash') {
      mv.speed = 2400;                   // comes down faster

    } else if (mv.kind === 'spikes') {
      mv.speed = 2400;
      mv.dur = 7.4;                      // a platform first, then the floor
      mv.twoStage = true;

    } else if (mv.kind === 'bombs') {
      /* faster, more of them, and the blue one somewhere in 7..10s */
      mv.dur = 11;
      mv.every = 0.3;
      mv.vx = (Math.random() < 0.5 ? 1 : -1) * 620;
      mv.blueAt = 7 + Math.random() * 3;

    } else if (mv.kind === 'seekers') {
      mv.count = 3;                      // three, and bigger

    } else if (mv.kind === 'saws') {
      /* five walls, a little slower, from alternate sides */
      mv.orbit = 1.7;                    // circling him, as ever
      mv.gather = 0.5;                   // and flying out to their edge, each wall
      mv.speed = 340;                    // slower
      mv.gapH = 58;
      mv.walls = [];
      var dir = Math.random() < 0.5 ? 1 : -1;
      var open = [296, 180];             // never the floor: you have to get up onto a platform
      for (i = 0; i < FINAL_SAW_WALLS; i++) {
        mv.walls.push({ dir: dir, from: dir > 0 ? -90 : level.worldW + 90,
                        start: mv.orbit + mv.gather + i * FINAL_SAW_GAP,
                        open: [open[Math.floor(Math.random() * open.length)]] });
        dir = -dir;
      }
      mv.dur = mv.orbit + mv.gather + (FINAL_SAW_WALLS - 1) * FINAL_SAW_GAP +
               (level.worldW + 180) / mv.speed + 0.2;

    } else if (mv.kind === 'spikeballs') {
      mv.dur = 0.3 + FINAL_BALLS * 1.0 + 0.3;
      mv.sent = 0;

    } else if (mv.kind === 'helpers') {
      mv.dur = 1.6;
      mv.sent = false;
    }
  }

  /* Where a smash lines up: over you - but the final boss never comes
     down into one of the pits at the ends, so he stops at the edge of
     the floor. (The middle pit has the top platform over it, and he
     lands on that.) */
  function smashAimX(b) {
    var x = p.x + p.w / 2 - b.w / 2;
    if (!b.final) return x;
    if (b.stage === 'phase3') {
      return Math.max(ARENA3_X, Math.min(ARENA3_X + ARENA3_W - b.w, x));
    }
    return Math.max(FINAL_PITS[0].x + FINAL_PITS[0].w,
                    Math.min(FINAL_PITS[2].x - b.w, x));
  }

  /* Is there anything solid under platform `s`, where the boss is? */
  function groundUnder(s, b) {
    return !!solidUnder(b.x + b.w / 2, s.y + 1);
  }

  /* Somewhere on the floor, not over a pit: for the blue bomb. */
  function finalSafeX(x, w) {
    if (level.boss && level.boss.stage === 'phase3') {
      return Math.max(ARENA3_X + 20, Math.min(ARENA3_X + ARENA3_W - 20 - w, x));
    }
    x = Math.max(320, Math.min(2080 - w, x));
    for (var i = 0; i < FINAL_PITS.length; i++) {
      var pit = FINAL_PITS[i];
      if (x + w > pit.x && x < pit.x + pit.w) {
        x = (x + w / 2 < pit.x + pit.w / 2) ? pit.x - w - 10 : pit.x + pit.w + 10;
      }
    }
    return x;
  }

  /* Every blade of the final boss's saws, where it is right now: they
     circle him, then before each wall its blades fly out from round him
     to their edge, then the wall comes. Drawn from this, and judged
     from it, so what you see is what cuts. */
  function finalSawBlades(b, mv) {
    var blades = [];
    for (var wi = 0; wi < mv.walls.length; wi++) {
      var wall = mv.walls[wi];
      var live = [], s;
      for (s = 0; s < mv.slots.length; s++) {
        var sy = mv.slots[s];
        if (wall.open.indexOf(sy) !== -1) continue;       // the way through
        live.push(sy);
      }
      if (wi === 0 && mv.t < mv.orbit) {
        for (s = 0; s < live.length; s++) blades.push(orbitSaw(b, mv, s, live.length));
      }
      if (mv.t >= wall.start - mv.gather && mv.t < wall.start) {
        var g = (mv.t - (wall.start - mv.gather)) / mv.gather;
        for (s = 0; s < live.length; s++) {
          var o = orbitSaw(b, mv, s, live.length);
          blades.push({ x: o.x + (wall.from - o.x) * g,
                        y: o.y + (live[s] - o.y) * g });
        }
      }
      var wx = sawWallX(mv, wall);
      if (wx === null) continue;
      for (s = 0; s < live.length; s++) blades.push({ x: wx, y: live[s] });
    }
    return blades;
  }

  /* A wall of the final boss's saws: where it is, or null if it isn't
     out yet or has gone. */
  function sawWallX(mv, wall) {
    if (mv.t < wall.start) return null;
    var x = wall.from + wall.dir * mv.speed * (mv.t - wall.start);
    var e = roomEdges();
    if (x < e.L - 120 || x > e.R + 120) return null;
    return x;
  }

  /* The room's ends, for the boss: his bare red platform in the last
     part of the final fight, otherwise the whole room. And how far in
     from them he keeps himself when he races about. */
  function roomEdges() {
    if (level.boss && level.boss.stage === 'phase3') {
      return { L: ARENA3_X, R: ARENA3_X + ARENA3_W, inset: 40 };
    }
    return { L: 0, R: level.worldW, inset: 240 };
  }

  /* keep him inside the room as he races, turning him round at the ends */
  function bounceBoss(b, mvOrB) {
    var e = roomEdges();
    if (b.x < e.L + e.inset) { b.x = e.L + e.inset; mvOrB.vx = Math.abs(mvOrB.vx); }
    if (b.x + b.w > e.R - e.inset) {
      b.x = e.R - e.inset - b.w;
      mvOrB.vx = -Math.abs(mvOrB.vx);
    }
  }

  /* The spike balls: they drop from him, land, and roll away from his
     side of the room - off platforms, onto the floor, and on until
     they go off an edge. */
  var BALL_R = 22, BALL_SPEED = 300;
  var BALL_BOSS_SPEED = 420;     // how fast he moves while he drops them (120 otherwise)

  function updateSpikeballs(dt) {
    var list = level.spikeballs;
    if (!list) return;
    for (var i = list.length - 1; i >= 0; i--) {
      var o = list[i];
      o.vy = Math.min(MAX_FALL, o.vy + GRAVITY * dt);
      var prevBottom = o.y + o.r;
      o.y += o.vy * dt;
      o.x += o.vx * dt;
      o.rot += o.vx * dt / o.r;

      for (var k = 0; k < level.solids.length; k++) {
        var s = level.solids[k];
        if (o.x < s.x || o.x > s.x + s.w) continue;
        if (o.vy >= 0 && prevBottom <= s.y + 0.5 && o.y + o.r >= s.y) {
          o.y = s.y - o.r;                 // landed: on it rolls
          o.vy = 0;
        } else if (!s.oneWay && o.y > s.y + 2 && o.y - o.r < s.y + s.h) {
          /* down in a pit, against the side of a slab: no rolling into it */
          o.x = o.vx > 0 ? s.x - 0.5 : s.x + s.w + 0.5;
          o.vx = 0;
        }
      }

      if (circleHitsBox(o.x, o.y, o.r - 4, p)) { die(); return; }
      if (o.y > level.fallY) list.splice(i, 1);
    }
  }

  /* Which saw slots are solid blades (the gap is the way through). */
  function sawSlotBlocked(mv, y) {
    return !(y > mv.gapY - mv.gapH / 2 && y < mv.gapY + mv.gapH / 2);
  }

  /* Where a saw sits during the orbit phase. */
  function orbitSaw(b, mv, idx, count) {
    var a = state.t * 2.2 + (idx / count) * Math.PI * 2;
    var r = 74 + Math.sin(state.t * 3) * 8;
    return { x: b.x + b.w / 2 + Math.cos(a) * r,
             y: b.y + b.h / 2 + Math.sin(a) * r * 0.62 };
  }

  /* How far a bed of the spike eruption is out, 0..1. Beds stay up once
     they've risen — they only go down when the attack ends. */
  function bedOut(mv, bed) {
    if (!mv.beds) return 0;
    var age = mv.since - bed.upAt;
    if (age <= 0) return 0;
    var rise = Math.min(1, age / 0.18);
    var left = mv.dur - mv.t;
    if (left < 0.6) rise *= Math.max(0, left / 0.6);
    return rise;
  }

  /* A bed about to erupt shows a nub first. */
  function bedWarn(mv, bed) {
    if (!mv.beds) return 0;
    var age = mv.since - bed.upAt;
    if (age > 0 || age < -0.4) return 0;
    return 1 - (-age / 0.4);
  }

  /* Spikes run along whatever it landed on. Slam the floor and they
     cross the floor; slam a platform and they only cover that platform. */
  function eruptFrom(mv, originX, surf) {
    /* a second eruption in the same move (the final boss: platform,
       then floor) adds to the beds already up, starting from now */
    if (!mv.beds) { mv.beds = []; mv.since = 0; }

    /* The floor - or down in a pit - means every piece of floor there
       is, and nothing over the pits between them. */
    if (!surf || !surf.oneWay) {
      var any = false;
      for (var i = 0; i < level.solids.length; i++) {
        var fl = level.solids[i];
        if (fl.oneWay || fl.y !== GROUND) continue;
        any = true;
        eruptAlong(mv, originX, fl.y, fl.x, fl.x + fl.w);
      }
      if (any) return;
    }
    if (surf) eruptAlong(mv, originX, surf.y, surf.x, surf.x + surf.w);
    else eruptAlong(mv, originX, GROUND, -60, level.worldW + 60);
  }

  function eruptAlong(mv, originX, y, from, to) {
    mv.surfY = y;
    /* One tooth to a bed, so they come up out of the floor one at a
       time rather than in threes. */
    var BED = 36;
    for (var x = from; x < to - 18; x += BED) {
      var w = Math.min(BED, to - x);
      mv.beds.push({ x: x, w: w, y: mv.surfY,
                     upAt: mv.since + Math.abs(x + w / 2 - originX) / mv.spread });
    }
  }

  /* 33% of the time it drops bombs. Otherwise an attack, and sometimes
     a second one on top of it. Crash never doubles up — it moves the
     boss, and stacking it reads as unfair rather than hard. */
  function chooseAttack(b) {
    /* his bare red platform: a third of the time bombs (the only way to
       hurt him), otherwise one of the rest. Each new attack ages the
       spikes he rained down. */
    if (b.stage === 'phase3') {
      ageRainSpikes();
      if (Math.random() < 0.33) { startMove(b, 'bombs'); return; }
      var p3 = ['crash', 'spikeballs', 'saws', 'helpers', 'screech', 'rain', 'fire'];
      if (level.seekers.length === 0) p3.push('seekers');
      startMove(b, p3[Math.floor(Math.random() * p3.length)]);
      return;
    }

    if (Math.random() < 0.33) { startMove(b, 'bombs'); return; }

    /* the final boss has all eight, and only the beam, the seekers and
       the saws ever double up - the rest move him or fill the room */
    if (b.final) {
      var fpool = ['laser', 'crash', 'spikes', 'saws', 'spikeballs', 'helpers'];
      if (level.seekers.length === 0) fpool.push('seekers');
      var fFirst = fpool[Math.floor(Math.random() * fpool.length)];
      startMove(b, fFirst);
      var pairs = ['laser', 'saws', 'seekers'];
      if (pairs.indexOf(fFirst) !== -1 && Math.random() < 0.3) {
        var fOthers = [];
        for (var fi = 0; fi < pairs.length; fi++) {
          if (pairs[fi] !== fFirst && fpool.indexOf(pairs[fi]) !== -1) fOthers.push(pairs[fi]);
        }
        if (fOthers.length) startMove(b, fOthers[Math.floor(Math.random() * fOthers.length)]);
      }
      return;
    }

    var pool = ['laser', 'crash', 'spikes', 'saws'];
    if (b.mk2 && level.seekers.length === 0) pool.push('seekers');
    var first = pool[Math.floor(Math.random() * pool.length)];
    startMove(b, first);

    if (first !== 'crash' && Math.random() < 0.3) {
      var others = [];
      for (var i = 0; i < pool.length; i++) {
        if (pool[i] !== first && pool[i] !== 'crash') others.push(pool[i]);
      }
      startMove(b, others[Math.floor(Math.random() * others.length)]);
    }
  }

  function spawnBomb(x, blue, fromY) {
    var y = fromY !== undefined ? fromY : 130;
    if (blue) {
      var bb = level.pickups[0];
      bb.hidden = false;
      bb.held = false;
      bb.flying = false;
      bb.grounded = false;
      bb.vy = 0;
      bb.x = x;
      bb.y = y;
      bb.home = { x: x, y: GROUND - bb.h };
      return;
    }
    level.bombs.push({
      x: x, y: y, w: 24, h: 24,
      vy: 0, grounded: false,
      fuse: 1.7, blast: 0,
      instant: !!(level.boss && level.boss.stage === 'phase3')
    });
  }

  function hurtBoss(b) {
    b.hp--;
    b.flash = 0.4;
    burst(b.x + b.w / 2, b.y + b.h / 2, '#4ec3ff', 40, 1.5);
    if (b.hp <= 0 && b.final && b.stage !== 'phase3') {   // not beaten: the chase starts
      if (!b.stage) startFinalScroll(b);
      return;
    }
    if (b.hp <= 0) {
      b.dead = true;
      b.moves.length = 0;
      level.seekers.length = 0;        // its spikes go with it
      if (level.spikeballs) level.spikeballs.length = 0;
      burst(b.x + b.w / 2, b.y + b.h / 2, '#ffd166', 70, 2.2);
      dropKey(b);
    }
  }

  function runMove(b, mv, dt) {
    var i, y;

    if (mv.kind === 'laser') {
      if (mv.t < mv.charge) {
        /* slide to the starting side while it winds up */
        b.x += (mv.fromX - b.x) * Math.min(1, dt * 4);
        b.y += (b.hover - b.y) * Math.min(1, dt * 4);
      } else {
        var k = Math.min(1, (mv.t - mv.charge) / (mv.dur - mv.charge));
        if (mv.pass) {                   // the final boss: there and back
          var k2 = Math.min(2, (mv.t - mv.charge) / mv.pass);
          k = k2 <= 1 ? k2 : 2 - k2;
        }
        b.x = mv.fromX + (mv.toX - mv.fromX) * k;
        var bx = b.x + b.w / 2;
        var stop = beamFloor(bx, b.y + b.h);
        var beam = { x: bx - 17, y: b.y + b.h, w: 34, h: stop - (b.y + b.h) };
        if (beam.h > 0 && hits(p, beam)) { die(); return; }
      }

    } else if (mv.kind === 'crash') {
      mv.subT += dt;

      if (mv.sub === 'move') {
        b.x += (smashAimX(b) - b.x) * Math.min(1, dt * 6);
        b.y += (70 - b.y) * Math.min(1, dt * 6);
        if (mv.subT > 0.5) { mv.sub = 'hang'; mv.subT = 0; }

      } else if (mv.sub === 'hang') {
        if (mv.subT > 0.3) { mv.sub = 'drop'; mv.subT = 0; }

      } else if (mv.sub === 'drop') {
        b.y += (mv.speed || CRASH_SPEED) * dt;
        /* once it has bounced off a platform it goes through it, so
           only look for what is under that platform */
        var fromY = mv.through ? Math.max(b.y, mv.through.y + 1) : b.y;
        var hitS = solidUnder(b.x + b.w / 2, fromY);
        var floorY = hitS ? hitS.y : GROUND;
        if (hits(p, bossBox(b))) { die(); return; }

        /* The second boss hits a platform first, bounces, and then
           comes down through it anyway. */
        if (b.mk2 && !mv.through && hitS && hitS.oneWay && b.y + b.h >= floorY &&
            !(b.final && !groundUnder(hitS, b))) {       // nothing under it but a pit: he stays on it
          b.y = floorY - b.h;
          mv.through = hitS;
          mv.bvy = -420;
          mv.sub = 'bounce';
          mv.subT = 0;
          burst(b.x + b.w / 2, floorY, '#ff5f7e', 22, 1.0);
          state.flash = 0.25;
          return;
        }

        if (b.y + b.h >= floorY) {
          mv.through = null;
          /* it lands, and that's all it does — no shockwave. Getting
             out from under it is the whole answer. */
          b.y = floorY - b.h;
          burst(b.x + b.w / 2, floorY, '#ff5f7e', 26, 1.1);
          state.flash = 0.3;
          mv.done++;
          mv.sub = mv.done >= mv.slams ? 'over' : (mv.noBreak ? 'move' : 'recover');
          mv.subT = 0;
        }

      } else if (mv.sub === 'bounce') {
        /* up off the platform and back down onto it - then through */
        mv.bvy += GRAVITY * dt;
        b.y += mv.bvy * dt;
        if (hits(p, bossBox(b))) { die(); return; }
        if (mv.bvy > 0 && b.y + b.h >= mv.through.y) {
          b.y = mv.through.y - b.h;
          mv.sub = 'drop';
          mv.subT = 0;
        }

      } else if (mv.sub === 'recover') {
        b.y += (b.hover + 40 - b.y) * Math.min(1, dt * 5);
        if (mv.subT > 0.5) { mv.sub = 'move'; mv.subT = 0; }

      } else {
        b.y += (b.hover - b.y) * Math.min(1, dt * 3);
      }

    } else if (mv.kind === 'spikes') {
      mv.subT += dt;

      if (mv.sub === 'move') {
        b.x += (smashAimX(b) - b.x) * Math.min(1, dt * 5);
        b.y += (80 - b.y) * Math.min(1, dt * 5);
        if (mv.subT > 0.6) { mv.sub = 'hang'; mv.subT = 0; }

      } else if (mv.sub === 'hang') {
        if (mv.subT > 0.35) { mv.sub = 'drop'; mv.subT = 0; }

      } else if (mv.sub === 'drop') {
        /* after a bounce it comes down through that platform */
        var below = mv.through ? mv.through.y + 1 : b.y;
        var surf = solidUnder(b.x + b.w / 2, below);
        var landY = surf ? surf.y : GROUND;
        b.y += (mv.speed || CRASH_SPEED) * dt;
        if (hits(p, bossBox(b))) { die(); return; }
        if (b.y + b.h >= landY) {
          b.y = landY - b.h;
          eruptFrom(mv, b.x + b.w / 2, surf);
          burst(b.x + b.w / 2, landY, '#ff5f7e', 50, 1.9);
          state.flash = 0.6;
          mv.subT = 0;
          /* the final boss: a platform gets its spikes, and then he
             bounces off it and gives the floor its spikes too */
          if (mv.twoStage && surf && surf.oneWay && !mv.through) {
            mv.through = surf;
            mv.bvy = -420;
            mv.sub = 'bounce';
          } else {
            mv.sub = 'erupt';
          }
        }

      } else if (mv.sub === 'bounce') {
        mv.bvy += GRAVITY * dt;
        b.y += mv.bvy * dt;
        if (hits(p, bossBox(b))) { die(); return; }
        if (mv.bvy > 0 && b.y + b.h >= mv.through.y) {
          b.y = mv.through.y - b.h;
          mv.subT = 0;
          if (groundUnder(mv.through, b)) {
            mv.sub = 'drop';                 // down through it, onto the floor
          } else {
            /* only a pit under it: he comes back down on the platform,
               and the floor gets its spikes from there */
            eruptFrom(mv, b.x + b.w / 2, null);
            burst(b.x + b.w / 2, mv.through.y, '#ff5f7e', 40, 1.6);
            state.flash = 0.5;
            mv.sub = 'erupt';
          }
        }

      } else {
        if (mv.subT > 0.9) b.y += (b.hover - b.y) * Math.min(1, dt * 2.5);
      }

      /* the teeth that are up, wherever they came up */
      if (mv.beds) {
        mv.since += dt;
        for (i = 0; i < mv.beds.length; i++) {
          var bd = mv.beds[i];
          var out = bedOut(mv, bd);
          if (out <= 0.05) continue;
          var hz = { x: bd.x, y: bd.y - 44 * out, w: bd.w, h: 44 * out };
          if (hits(p, hz)) { die(); return; }
        }
      }

    } else if (mv.kind === 'saws' && mv.walls) {
      /* the final boss's: every blade cuts - circling him, flying out,
         and wall after wall from alternate sides */
      var fb = finalSawBlades(b, mv);
      for (i = 0; i < fb.length; i++) {
        if (circleHitsBox(fb[i].x, fb[i].y, 22, p)) { die(); return; }
      }

    } else if (mv.kind === 'spikeballs') {
      /* he keeps moving, and drops them one at a time; they roll away
         from whichever side of the room he's on */
      b.y += (b.hover - b.y) * Math.min(1, dt * 3);
      b.x += (b.vx > 0 ? 1 : -1) * (mv.race || BALL_BOSS_SPEED) * dt;     // and quick about it
      bounceBoss(b, b);
      while (mv.sent < FINAL_BALLS && mv.t >= 0.3 + mv.sent * 1.0) {
        var bcx = b.x + b.w / 2;
        level.spikeballs.push({ x: bcx, y: b.y + b.h + BALL_R, r: BALL_R, rot: 0,
                                vx: (bcx > (roomEdges().L + roomEdges().R) / 2 ? -1 : 1) * BALL_SPEED,
                                vy: 0 });
        burst(bcx, b.y + b.h, '#ff2d55', 14, 1.0);
        mv.sent++;
      }

    } else if (mv.kind === 'helpers') {
      /* ten reds, dropped in all along the floor */
      if (!mv.sent && mv.t > 0.4) {
        mv.sent = true;
        for (i = 0; i < FINAL_HELPERS; i++) {
          var he = roomEdges();
          var hx = he.inset === 40                       // his bare platform: all along it
            ? he.L + 30 + i * ((he.R - he.L - 82) / (FINAL_HELPERS - 1))
            : finalSafeX(340 + i * (1720 / (FINAL_HELPERS - 1)), 22);
          var red = redOn({ y: GROUND }, hx);
          red.y = 40;
          level.enemies.push(red);
          burst(hx + 11, 60, '#ff5f7e', 16, 1.0);
        }
        state.flash = Math.max(state.flash, 0.3);
      }

    } else if (mv.kind === 'screech') {
      /* two yellow guys up into the corners; each one's line follows
         you, holds still a moment, and then it fires along it */
      b.y += (b.hover - b.y) * Math.min(1, dt * 3);
      for (i = 0; i < mv.birds.length; i++) {
        var bd = mv.birds[i];
        var fk = Math.min(1, mv.t / 0.6);
        var fe = 1 - (1 - fk) * (1 - fk);
        bd.x = bd.fromX + (bd.toX - bd.fromX) * fe;
        bd.y = bd.fromY + (bd.toY - bd.fromY) * fe;
        var lockAt = 0.6 + bd.aimT, fireAt = lockAt + 0.3;
        if (mv.t < lockAt) {
          bd.ang = Math.atan2(p.y + p.h / 2 - bd.y, p.x + p.w / 2 - bd.x);   // following you
        }
        /* then it charges, straight down the line, and on out of the room */
        if (mv.t >= fireAt) {
          if (!bd.fired) {
            bd.fired = true;
            burst(bd.x, bd.y, '#ffd166', 20, 1.2);
          }
          var run = P3_CHARGE * (mv.t - fireAt);
          bd.x = bd.toX + Math.cos(bd.ang) * run;
          bd.y = bd.toY + Math.sin(bd.ang) * run;
          bd.gone = run > 1700;
          if (!bd.gone && circleHitsBox(bd.x, bd.y, SCREECH_SIZE / 2 - 2, p)) { die(); return; }
        }
      }

    } else if (mv.kind === 'rain') {
      /* he crosses the room, dropping the spikes as he goes over them */
      var re = roomEdges();
      var sk = Math.min(1, Math.max(0, (mv.t - 0.4) / mv.sweep));
      var sx0 = mv.dir > 0 ? re.L + 20 : re.R - 20 - b.w;
      var sx1 = mv.dir > 0 ? re.R - 20 - b.w : re.L + 20;
      if (mv.t < 0.4) {
        b.x += (sx0 - b.x) * Math.min(1, dt * 8);
      } else {
        b.x = sx0 + (sx1 - sx0) * sk;
      }
      b.y += (b.hover - b.y) * Math.min(1, dt * 4);
      if (!level.rainSpikes) level.rainSpikes = [];
      var bcx2 = b.x + b.w / 2;
      for (i = 0; i < mv.drops.length; i++) {
        var dx = mv.drops[i];
        if (mv.dropped.indexOf(dx) !== -1 || mv.t < 0.4) continue;
        var passed = mv.dir > 0 ? bcx2 >= dx + P3_TOOTH / 2 : bcx2 <= dx + P3_TOOTH / 2;
        if (!passed) continue;
        mv.dropped.push(dx);
        level.rainSpikes.push({ x: dx, y: b.y + b.h, vy: 0, landed: false,
                                left: 2, sinking: false, sinkT: 0 });
      }

    } else if (mv.kind === 'fire') {
      /* fireballs, one after another, each at where you are */
      b.y += (b.hover - b.y) * Math.min(1, dt * 3);
      if (!level.fireballs) level.fireballs = [];
      while (mv.fired < P3_FIREBALLS && mv.t >= 0.5 + mv.fired * P3_FIRE_GAP) {
        var fx0 = b.x + b.w / 2, fy0 = b.y + b.h;
        var fdx = p.x + p.w / 2 - fx0, fdy = p.y + p.h / 2 - fy0;
        var fd = Math.sqrt(fdx * fdx + fdy * fdy) || 1;
        level.fireballs.push({ x: fx0, y: fy0, r: 13,
                               vx: fdx / fd * P3_FIRE_SPEED, vy: fdy / fd * P3_FIRE_SPEED });
        burst(fx0, fy0, '#ff8c42', 10, 0.8);
        mv.fired++;
      }

    } else if (mv.kind === 'saws') {
      if (mv.t < mv.orbit) {
        /* circling the boss — a warning, not yet a weapon */
        mv.colX = null;

      } else if (mv.t < mv.orbit + mv.gather) {
        mv.colX = null;
        mv.gathering = (mv.t - mv.orbit) / mv.gather;

      } else {
        mv.colX = mv.from + mv.dir * mv.speed * (mv.t - mv.orbit - mv.gather);
        for (i = 0; i < mv.slots.length; i++) {
          y = mv.slots[i];
          if (!sawSlotBlocked(mv, y)) continue;
          if (circleHitsBox(mv.colX, y, 24, p)) { die(); return; }
        }
      }

    } else if (mv.kind === 'bombs' && b.mk2) {
      /* The second boss drops them itself, one every half second, while
         racing from side to side. Partway through, the blue one. */
      b.y += (b.hover - b.y) * Math.min(1, dt * 4);
      b.x += mv.vx * dt;
      bounceBoss(b, mv);
      var due = Math.floor(mv.t / (mv.every || 0.5));
      while (mv.dropped < due) {
        spawnBomb(b.x + b.w / 2 - 12, false, b.y + b.h);
        mv.dropped++;
      }
      var blue = level.pickups[0];
      if (!mv.blueDropped && mv.t > (mv.blueAt || 3.5) && blue.hidden) {
        mv.blueDropped = true;
        var blueX = b.x + b.w / 2 - blue.w / 2;
        if (b.final) blueX = finalSafeX(blueX, blue.w);    // never into a pit
        spawnBomb(blueX, true, b.y + b.h);
      }

    } else if (mv.kind === 'seekers') {
      if (!mv.sent && mv.t > 0.5) {
        mv.sent = true;
        /* two; the final boss sends three, and bigger */
        var sides = mv.count === 3 ? [-1, 0, 1] : [-1, 1];
        for (var sk = 0; sk < sides.length; sk++) {
          var sd = { x: b.x + b.w / 2 + sides[sk] * 50, y: b.y + b.h / 2,
                     side: sides[sk], t: 0, big: mv.count === 3, slow: !!mv.slow };
          /* the final boss's fly out from him first - one to each side
             of the room (and one to the middle, when there are three) -
             and only then come */
          if (mv.count === 3 || mv.flyOut) {
            var se = roomEdges();
            var spots = mv.count === 3 ? [se.L + 120, (se.L + se.R) / 2, se.R - 120]
                                       : [se.L + 120, se.R - 120];
            sd.fly = { fromX: b.x + b.w / 2, fromY: b.y + b.h / 2,
                       toX: spots[sk], toY: 150, t: 0 };
            sd.x = sd.fly.fromX;
            sd.y = sd.fly.fromY;
          }
          level.seekers.push(sd);
        }
        burst(b.x + b.w / 2, b.y + b.h / 2, '#ffd166', 30, 1.3);
      }

    } else if (mv.kind === 'bombs') {
      var want = Math.floor(mv.t / 0.55);
      while (mv.dropped < want && mv.dropped < 6) {
        spawnBomb(220 + Math.random() * (level.worldW - 600), false);
        mv.dropped++;
      }
      if (!mv.blueDropped && mv.t > 1.0) {
        mv.blueDropped = true;
        spawnBomb(260 + Math.random() * (level.worldW - 700), true);
      }
    }
  }

  /* The yellow spikes. They drift after you, slowly, and nothing you
     do touches them. Fifteen seconds after they're sent they go off
     like a bomb, wherever they are. Each keeps to its own side of you
     so the two don't merge into one. */
  var SEEKER_SPEED = 85;
  var SEEKER_LIFE  = 15;
  var SEEKER_SLOW_LIFE = 25;     // the final boss's last two: slow, but they last
  var SEEKER_SLOW  = 55;         // the final boss's last two: slower
  var SEEKER_FLY   = 0.9;        // the final boss's: seconds flying out to their spots

  function updateSeekers(dt) {
    for (var i = level.seekers.length - 1; i >= 0; i--) {
      var s = level.seekers[i];

      /* flying out to its spot: eased, and its fifteen seconds don't
         start until it gets there */
      if (s.fly) {
        s.fly.t += dt;
        var fk = Math.min(1, s.fly.t / SEEKER_FLY);
        var fe = 1 - (1 - fk) * (1 - fk);
        s.x = s.fly.fromX + (s.fly.toX - s.fly.fromX) * fe;
        s.y = s.fly.fromY + (s.fly.toY - s.fly.fromY) * fe;
        if (circleHitsBox(s.x, s.y, s.big ? 18 : 12, p)) { die(); return; }
        if (fk >= 1) s.fly = null;
        continue;
      }

      s.t += dt;
      var tx = p.x + p.w / 2 + s.side * 22, ty = p.y + p.h / 2;
      var dx = tx - s.x, dy = ty - s.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      var stepL = Math.min(d, (s.slow ? SEEKER_SLOW : SEEKER_SPEED) * dt);
      s.x += dx / d * stepL;
      s.y += dy / d * stepL;

      if (circleHitsBox(s.x, s.y, s.big ? 18 : 12, p)) { die(); return; }

      if (s.t >= (s.slow ? SEEKER_SLOW_LIFE : SEEKER_LIFE)) {
        /* it becomes a bomb with no fuse left, and goes off next tick */
        level.bombs.push({ x: s.x - 12, y: s.y - 12, w: 24, h: 24,
                           vy: 0, grounded: true, fuse: 0, blast: 0 });
        level.seekers.splice(i, 1);
      }
    }
  }

  /* ============================================================
     THE FINAL BOSS'S ENTRANCE
     All of it on black: him, big, in the middle of the screen, and you
     nowhere to be seen. Click to move his lines on. Then his green
     goes red, the throne builds itself round him, up on
     its rockets, and down in a fireball - and it is the smash that brings the room
     up around the pair of you.
     ============================================================ */
  var INTRO_TYPE  = 34;          // characters a second, like his other lines
  var INTRO_SCALE = 4;           // how big he is on the black
  var INTRO_TIMED = {
    dark:   0.8,                 // nothing at all
    appear: 0.6,                 // him, fading in out of it
    red:    1.0,                 // his green going red
    throne: 1.2,                 // the throne building itself
    rise:   0.9,                 // up on its rockets
    smash:  0.25,                // and down
    settle: 1.1                  // the room, the fireball, before the first attack
  };
  var INTRO_ORDER = ['dark', 'appear', 'lines', 'red', 'throne',
                     'rise', 'smash', 'settle'];

  var finalIntroSeen = false;    // after once, dying doesn't replay it

  function introRunning() {
    return !!(level && level.intro && !level.intro.done);
  }

  function introNext(it) {
    it.phase = INTRO_ORDER[INTRO_ORDER.indexOf(it.phase) + 1] || 'over';
    it.t = 0;
  }

  /* how far through the current timed part, 0..1 */
  function introK(it) {
    var d = INTRO_TIMED[it.phase];
    return d ? Math.min(1, it.t / d) : 1;
  }

  /* A click finishes the line that is typing, or moves on to the next. */
  function introClick() {
    if (!introRunning()) return;
    var it = level.intro;
    if (it.phase !== 'lines') return;
    var full = FINAL_LINES[it.line].length;
    if (it.chars < full) { it.chars = full; return; }
    it.line++;
    it.chars = 0;
    if (it.line >= FINAL_LINES.length) introNext(it);
  }
  canvas.addEventListener('click', introClick);

  function endIntro() {
    var b = level.boss;
    level.intro.done = true;
    finalIntroSeen = true;
    b.asleep = false;
    b.idle = 0;
    state.titleT = 2.4;          // and now the name card
  }

  function updateIntro(dt) {
    var it = level.intro;
    var b = level.boss;
    state.titleT = 0;

    if (it.phase === 'lines') {
      it.chars = Math.min(FINAL_LINES[it.line].length, it.chars + dt * INTRO_TYPE);
      return;
    }
    it.t += dt;
    if (it.t < INTRO_TIMED[it.phase]) return;

    var was = it.phase;
    introNext(it);
    if (was === 'smash') {             // he lands, and there is the room - in a fireball
      var top = level.solids[3].y;       // the top platform, beside you - it doesn't hurt you
      b.y = top - b.h;
      level.fireball = { x: b.x + b.w / 2, y: top - 20, at: state.t };
      burst(b.x + b.w / 2, top, '#ff8c42', 90, 3.0);
      burst(b.x + b.w / 2, top, '#ffd166', 60, 2.4);
      burst(b.x + b.w / 2, top, '#ff2d55', 50, 2.0);
      state.flash = Math.max(state.flash, 0.8);
    }
    if (it.phase === 'over') endIntro();
  }

  /* The green fellow in his rocket throne. `throneK` is how built the
     throne is (0..1), `redK` how far his green has gone red
     up, and `fire` whether the rockets are lit. `face` is optional. */
  function drawFinalBoss(b, throneK, redK, fire, face) {
    var cx = b.x + b.w / 2, base = b.y + b.h;
    var float = b.asleep ? 0 : Math.sin(state.t * 2.2) * 3;
    if (face === undefined) face = (p.x + p.w / 2) < cx ? -1 : 1;

    ctx.save();
    ctx.translate(0, float);

    if (throneK > 0) {
      ctx.save();
      ctx.globalAlpha = throneK;

      /* the rockets, one each side, and their flames */
      for (var s = -1; s <= 1; s += 2) {
        var rx = cx + s * (b.w / 2 - 7);
        if (fire) {
          var fl = 16 + Math.random() * 14;
          ctx.fillStyle = '#ff8c42';
          ctx.shadowColor = '#ff8c42';
          ctx.shadowBlur = 20;
          ctx.beginPath();
          ctx.moveTo(rx - 6, base + 4);
          ctx.lineTo(rx, base + 4 + fl);
          ctx.lineTo(rx + 6, base + 4);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#ffd166';
          ctx.beginPath();
          ctx.moveTo(rx - 3, base + 4);
          ctx.lineTo(rx, base + 4 + fl * 0.6);
          ctx.lineTo(rx + 3, base + 4);
          ctx.closePath();
          ctx.fill();
          ctx.shadowBlur = 0;
        }
        ctx.fillStyle = '#8a93ad';                     // the tube
        rr(rx - 7, base - 40, 14, 44, 5);
        ctx.fill();
        ctx.fillStyle = '#ff2d55';                     // the nose
        ctx.beginPath();
        ctx.moveTo(rx - 7, base - 38);
        ctx.lineTo(rx, base - 52);
        ctx.lineTo(rx + 7, base - 38);
        ctx.closePath();
        ctx.fill();
      }

      /* the throne: a high back, arms, and a seat */
      ctx.fillStyle = '#3a2a5c';
      ctx.shadowColor = '#ff2d55';
      ctx.shadowBlur = 16 * throneK;
      rr(cx - 26, base - 62, 52, 20, 6);               // the back, over his head
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffd166';                       // three points on top
      for (var c = -1; c <= 1; c++) {
        ctx.beginPath();
        ctx.moveTo(cx + c * 16 - 5, base - 62);
        ctx.lineTo(cx + c * 16, base - 72);
        ctx.lineTo(cx + c * 16 + 5, base - 62);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = '#3a2a5c';
      rr(cx - 30, base - 30, 12, 26, 4);               // arms
      ctx.fill();
      rr(cx + 18, base - 30, 12, 26, 4);
      ctx.fill();
      rr(cx - 30, base - 12, 60, 12, 4);               // the seat
      ctx.fill();
      ctx.restore();
    }

    /* the fan the throne grows for the chase, facing back at you */
    if (b.fanK > 0) {
      var fr = 26 * b.fanK;
      var fxc = cx - 30 - fr * 0.6, fyc = base - 26;
      ctx.save();
      ctx.fillStyle = '#4a5068';
      ctx.fillRect(fxc, fyc - 4, cx - 30 - fxc, 8);           // the arm out to it
      ctx.fillStyle = '#2b2f36';
      ctx.strokeStyle = '#8a93ad';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(fxc, fyc, fr, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.translate(fxc, fyc);
      ctx.rotate(state.t * 25);
      ctx.fillStyle = '#c9d2e6';
      for (var bl = 0; bl < 4; bl++) {
        ctx.rotate(Math.PI / 2);
        ctx.beginPath();
        ctx.ellipse(fr * 0.45, 0, fr * 0.45, fr * 0.16, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#ff2d55';
      ctx.beginPath();
      ctx.arc(0, 0, fr * 0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    /* him, sat in it */
    var cy = base - 12 - SIZE / 2;
    var col = b.flash > 0 ? '#ffffff' : (b.dead ? '#2e5a45' : '#7bffb2');
    drawCube(cx, cy, SIZE, SIZE, col, face, 0);
    if (redK > 0 && b.flash <= 0) {                    // his green goes red
      ctx.save();
      ctx.globalAlpha = redK;
      drawCube(cx, cy, SIZE, SIZE, b.dead ? '#5a1e2a' : '#ff2d55', face, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  /* The fireball he lands in: it blows out wide and burns away. Only
     a sight - it doesn't hurt you. */
  var FIREBALL_LIFE = 1.1;

  function drawFireball() {
    var f = level.fireball;
    if (!f) return;
    var age = state.t - f.at;
    if (age >= FIREBALL_LIFE) { level.fireball = null; return; }
    var k = age / FIREBALL_LIFE;
    var r = 60 + 260 * (1 - Math.pow(1 - k, 3));       // fast out, then slows
    var a = k < 0.35 ? 1 : 1 - (k - 0.35) / 0.65;

    ctx.save();
    ctx.globalAlpha = a;
    var g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
    g.addColorStop(0,    '#ffffff');
    g.addColorStop(0.18, '#fff3b0');
    g.addColorStop(0.4,  '#ffd166');
    g.addColorStop(0.65, '#ff8c42');
    g.addColorStop(0.85, 'rgba(255,45,85,0.7)');
    g.addColorStop(1,    'rgba(255,45,85,0)');
    ctx.fillStyle = g;
    ctx.shadowColor = '#ff8c42';
    ctx.shadowBlur = 60;
    ctx.beginPath();
    ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* While the entrance is on, the screen is black - the room and you
     both hidden - and he is on it, big and in the middle, until the
     smash. */
  function drawIntroScreen() {
    if (!introRunning()) return;
    var it = level.intro;
    if (it.phase === 'settle') return;             // the room is up

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    if (it.phase === 'dark') return;

    var at = INTRO_ORDER.indexOf(it.phase);
    var k = introK(it);
    var redK    = at < 3 ? 0 : at === 3 ? k : 1;
    var throneK = at < 4 ? 0 : at === 4 ? k : 1;
    var fire = it.phase === 'rise' || it.phase === 'smash';
    var lift = 0;
    if (it.phase === 'rise') lift = -140 * k * k * (3 - 2 * k);
    if (it.phase === 'smash') lift = -140 + 460 * k * k;    // down, through the bottom

    var cx = W / 2, cy = H / 2 + 60;
    ctx.save();
    ctx.globalAlpha = it.phase === 'appear' ? k : 1;
    ctx.translate(cx, cy + lift);
    ctx.scale(INTRO_SCALE, INTRO_SCALE);
    drawFinalBoss({ x: -37, y: -28, w: 74, h: 56, flash: 0, dead: false, asleep: true },
                  throneK, redK, fire, 1);
    ctx.restore();

    if (it.phase === 'lines') {
      var top = cy + (28 - 12 - SIZE) * INTRO_SCALE;      // the top of his head
      drawSpeech(cx, top, FINAL_LINES[it.line], it.chars);
      if (it.chars >= FINAL_LINES[it.line].length && Math.sin(state.t * 6) > -0.3) {
        ctx.save();
        ctx.fillStyle = '#7bffb2';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('click ▶', cx + 155, top - 30);
        ctx.restore();
      }
    }
  }

  /* ============================================================
     THE CHASE
     Three hits doesn't finish him. A wooden board grows out of the
     right-hand end of his floor, over the pit - and its whole length
     is spikes. A fan grows on the throne, and he sits at the right of
     the screen blowing you back while the screen scrolls on.

     Along the top of the screen, moving with it, is a conveyor with an
     edge. Everything rides it and rolls off that edge: the platforms
     you cross on, which drop and hang there, and what goes on them -
     crates, spikes, reds - and the orbs and spike balls in the gaps.
     Every piece is something you have to do. Touch the spikes, fall
     off the left of the screen, or die any other way, and you are back
     in his arena with him on one hit. Reach the end of the board and
     that is it...for now.
     ============================================================ */
  var BOARD_X      = 2100;       // where the board starts: the end of his floor
  var BOARD_LEN    = 7600;
  var BOARD_SAFE   = 400;        // no spikes on the first and last of the board
  var SCROLL_SPEED = 207;        // you run 275, less the wind: 235
  var FLOOR_TOOTH  = 34;         // the board's spikes fall one tooth at a time
  var CHASE_GROW   = 2.0;        // the board, the belt and the fan growing
  var WIND_BASE    = 40;         // how hard the fan blows you back, anywhere
  var WIND_NEAR    = 420;        // and up to this much more close to it
  var WIND_REACH   = 420;        // how close "close" is
  var BELT_Y       = 46;         // the top of the conveyor, along the top of the screen
  var BELT_EDGE    = 600;        // its left end, where things fall off (screen x)
  var BELT_REL     = 220;        // how fast its top runs toward that edge
  var BELT_START   = W + 40;     // its right end is off the screen: things come in from there
  var BELT_RIDE_T  = (BELT_START - BELT_EDGE) / BELT_REL;   // seconds a thing is seen riding
  var PLAT_Y       = GROUND - 60;                       // where the platforms hang

  function startFinalScroll(b) {
    b.stage = 'grow';
    b.stageT = 0;
    b.fanK = 0;
    b.moves.length = 0;
    level.seekers.length = 0;
    level.spikeballs.length = 0;
    level.bombs.length = 0;
    level.enemies.length = 0;
    level.pickups[0].hidden = true;
    level.pickups[0].held = false;
    level.pickups[0].flying = false;
    if (p.holding) p.holding = null;
    state.flash = Math.max(state.flash, 0.5);

    level.worldW = ARENA3_X + ARENA3_W + 360;
    /* the red platform waiting at the far end of the board */
    var a3 = arena3Solids(), pits3 = arena3Pits();
    level.solids.push(a3[0]);
    level.hazards.push(pits3[1]);
    var board = { x: BOARD_X, y: GROUND, w: BOARD_LEN, h: 40, wood: true };
    level.solids.push(board);
    level.chase = { board: board, x: cam.x, items: [], floats: [], growW: 0,
                    endX: BOARD_X + BOARD_LEN - 140, on: false, done: false };
    /* the course itself is laid out when the chase starts, so the first
       of it slides in from off the screen rather than appearing on the belt */
  }

  /* The course, a section at a time: the gap before a platform, the
     platform, and what goes on it or in the gap. Every gap is one the
     wind lets you make, just: 120 is a jump, 200 needs both, 360 needs
     the dash ring, and a high platform needs the yellow one. The same
     every time, so a retry is a retry. */
  /* `open`: no spikes go down on the board under that one - fall there
     and you can climb back up and carry on, but it's only ever one
     section, so it never lets you skip much. A high platform (250 up,
     past a double jump) has its yellow ring hung in the middle of the
     gap: jump, take the ring in mid-air, and it throws you up there. */
  var CHASE_SECTIONS = [
    { gap: 120, w: 180, on: [['box', 65]] },                       // jump the crate
    { gap: 200, w: 160, on: [['spike', 60]], open: true },         // land either side of it
    { gap: 360, w: 200, orb: 'dash', on: [['red', 120]] },         // ring, then a red
    { gap: 140, w: 230, on: [['box', 80], ['box', 105]] },         // a step of two
    { gap: 200, w: 180, y: PLAT_Y - 250, orb: 'upMid' },           // up, off the ring in the gap
    { gap: 200, w: 180, ball: [110, PLAT_Y - 60], open: true },    // down, past a ball
    { gap: 140, w: 260, on: [['red', 70], ['red', 190]] },         // two reds
    { gap: 200, w: 150, y: PLAT_Y - 40, on: [['spike', 55]] },
    { gap: 120, w: 200, on: [['spike', 20], ['spike', 140]], open: true },  // the middle only
    { gap: 360, w: 180, orb: 'dash', ball: [250, PLAT_Y - 30] },   // dash over a ball
    { gap: 200, w: 180, y: PLAT_Y - 250, orb: 'upMid' },
    { gap: 160, w: 220, on: [['box', 90], ['spike', 170]] }
  ];

  function buildChase(c, start) {
    c.courseStart = start;
    var items = c.items;
    function add(kind, x, w, h, stopY) {
      items.push({ kind: kind, at: x, w: w, h: h, stopY: stopY,
                   phase: 'wait', x: 0, y: 0, vy: 0 });
    }
    /* the board's spikes, one tooth at a time: each rides the belt and
       goes off the edge on its own, so they rain down in a row */
    function addFloor(x, w) {
      var n = Math.max(1, Math.round(w / FLOOR_TOOTH));
      for (var t = 0; t < n; t++) add('floor', x + t * w / n, w / n, 22, null);
    }
    var end = BOARD_X + BOARD_LEN - BOARD_SAFE - 200;
    var lip = start, lipY = GROUND;                       // off the board, where it starts
    for (var i = 0; ; i++) {
      var s = CHASE_SECTIONS[i % CHASE_SECTIONS.length];
      var px = lip + s.gap, py = s.y || PLAT_Y;
      if (px + s.w > end) break;
      /* the board's spikes come off the belt as well, ahead of the rest */
      if (!s.open) addFloor(lip, px + s.w - lip);
      if (s.orb === 'dash') add('dash', lip + 140, 0, 0, lipY - 92);
      if (s.orb === 'upMid') add('up', lip + s.gap / 2, 0, 0, lipY - 70);
      add('plat', px, s.w, 20, py);
      if (s.ball) add('ball', lip + s.ball[0], 0, 0, s.ball[1]);
      for (var k = 0; s.on && k < s.on.length; k++) {
        var kind = s.on[k][0];
        add(kind, px + s.on[k][1], kind === 'box' ? 50 : kind === 'spike' ? 40 : 22,
            kind === 'box' ? 50 : 22, null);
      }
      lip = px + s.w;
      lipY = py;
    }
    /* and plain platforms the rest of the way to the safe end of the board */
    var safe = BOARD_X + BOARD_LEN - BOARD_SAFE;
    if (safe > lip) addFloor(lip, safe - lip);
    while (safe - lip > 200) {
      add('plat', lip + 140, 160, 20, PLAT_Y);
      lip += 300;
    }
    items.sort(function (a, b) { return a.at - b.at; });
  }

  /* Back onto the board at a checkpoint: the chase already on, the
     screen at `cx`, and everything that had gone off the belt by then
     lying where it fell. */
  function resumeChase(cx, flag, start) {
    var b = level.boss;
    level.intro.done = true;
    b.asleep = false;
    b.hp = 0;
    startFinalScroll(b);
    var c = level.chase;
    buildChase(c, start);                              // the same course as before
    b.stage = 'chase';
    b.stageT = 0;
    b.fanK = 1;
    c.on = true;
    c.growW = BOARD_LEN;
    c.x = cx;
    cam.x = cx;
    b.x = c.x + W - 170;
    b.y = GROUND - b.h;
    for (var i = 0; i < c.items.length; i++) {
      var it = c.items[i], k = it.kind, top;
      if (it.at - BELT_EDGE > cx) break;               // sorted: the rest are still to come
      it.x = it.at;
      it.phase = 'done';
      if (k === 'plat') {
        level.solids.push({ x: it.x, y: it.stopY, w: it.w, h: it.h, oneWay: true, plank: true });
      } else if (k === 'dash' || k === 'up') {
        level.orbs.push({ x: it.x, y: it.stopY, kind: k, r: k === 'dash' ? ORB_R : ORB_R_LAUNCH });
      } else if (k === 'ball') {
        c.floats.push({ x: it.x, y: it.stopY, r: 16, rot: 0 });
      } else if (k === 'red') {
        top = landingTop(it.x, it.w, -9999);
        var red = redOn({ y: top === null ? GROUND : top }, it.x);
        level.enemies.push(red);
      } else {
        top = k === 'floor' ? GROUND : landingTop(it.x, it.w, -9999);
        if (top === null) continue;
        /* nothing comes back down on top of your flag */
        if (flag && hits(flag, { x: it.x, y: top - it.h, w: it.w, h: it.h })) continue;
        if (k === 'box') level.solids.push({ x: it.x, y: top - it.h, w: it.w, h: it.h, block: true });
        else level.hazards.push({ x: it.x, y: top - 22, w: it.w, h: 22 });
      }
    }
  }

  /* how hard the fan is pushing you back, px/s (negative: to the left) */
  function windPush() {
    var b = level.boss;
    if (!b || b.stage !== 'chase') return 0;
    var d = Math.max(0, (b.x - 10) - (p.x + p.w));
    var near = d < WIND_REACH ? WIND_NEAR * (1 - d / WIND_REACH) : 0;
    return -(WIND_BASE + near);
  }

  /* The top of whatever is under the span x..x+w, at or below y. */
  function landingTop(x, w, y) {
    var best = null;
    for (var i = 0; i < level.solids.length; i++) {
      var s = level.solids[i];
      if (s.x >= x + w || s.x + s.w <= x) continue;
      if (s.y < y - 0.5) continue;
      if (best === null || s.y < best) best = s.y;
    }
    return best;
  }

  /* One thing on the conveyor: it rides along the top of the screen to
     the edge, rolls off it, and drops - to hang (a platform, an orb, a
     spike ball) or to land on whatever is under it. Where it falls is
     wherever the edge was when it got there. */
  function updateItem(c, it, dt) {
    var top, k = it.kind;
    var round = k === 'dash' || k === 'up' || k === 'ball';
    var left = (it.at - BELT_EDGE - cam.x) / SCROLL_SPEED;   // seconds to the edge

    if (it.phase === 'wait') {
      if (left > BELT_RIDE_T) return;
      it.phase = 'ride';
      if (k === 'dash' || k === 'up') {                     // live already
        it.orb = { x: 0, y: 0, kind: k, r: k === 'dash' ? ORB_R : ORB_R_LAUNCH };
        level.orbs.push(it.orb);
      }
      if (k === 'ball') {
        it.ball = { x: 0, y: 0, r: 16, rot: 0 };
        c.floats.push(it.ball);
      }
    }

    if (it.phase === 'ride') {
      if (left > 0) {
        it.x = cam.x + BELT_EDGE + BELT_REL * left;
        it.y = round ? BELT_Y - 18 : BELT_Y - it.h;
      } else {
        it.x = it.at;                                       // over the edge
        it.phase = 'fall';
        if (k === 'red') {
          var red = redOn({ y: GROUND }, it.x);
          red.y = it.y;
          red.spawn = { x: it.x, y: PLAT_Y - 22 };
          level.enemies.push(red);
          it.phase = 'done';
        }
      }
    } else if (it.phase === 'fall') {
      it.vy = Math.min(MAX_FALL * 1.5, it.vy + GRAVITY * dt);
      var wasBottom = it.y + it.h;
      it.y += it.vy * dt;

      if (round) {
        if (it.y >= it.stopY) { it.y = it.stopY; it.phase = 'done'; }
      } else if (k === 'plat') {
        if (hits(p, it)) { die(); return; }
        if (it.y >= it.stopY) {                             // and there it hangs
          it.y = it.stopY;
          level.solids.push({ x: it.x, y: it.y, w: it.w, h: it.h, oneWay: true, plank: true });
          burst(it.x + it.w / 2, it.y, '#c08a4e', 12, 0.8);
          it.phase = 'done';
        }
      } else {
        if (hits(p, it)) { die(); return; }
        var teeth = k === 'spike' || k === 'floor';
        /* the board's own spikes go down on the board, nothing else */
        top = k === 'floor' ? (it.y + it.h >= GROUND ? GROUND : null)
                            : landingTop(it.x, it.w, wasBottom);
        if (top !== null && it.y + it.h >= top) {
          burst(it.x + it.w / 2, top, teeth ? '#ff2d55' : '#c08a4e', k === 'floor' ? 5 : 18, 1.0);
          if (teeth) level.hazards.push({ x: it.x, y: top - 22, w: it.w, h: 22 });
          else level.solids.push({ x: it.x, y: top - it.h, w: it.w, h: it.h, block: true });
          it.phase = 'done';
        }
      }
    }

    if (it.orb) { it.orb.x = it.x; it.orb.y = it.y; }
    if (it.ball) { it.ball.x = it.x; it.ball.y = it.y; }
  }

  function updateChase(b, dt) {
    var c = level.chase;
    b.stageT += dt;
    var i;

    if (b.stage === 'grow') {
      var k = Math.min(1, b.stageT / CHASE_GROW);
      c.growW = W * 1.5 * k;
      b.fanK = k;
      var tx = cam.x + W - 170;                         // over to the right, down on the board
      b.x += (tx - b.x) * Math.min(1, dt * 3);
      b.y += ((GROUND - b.h) - b.y) * Math.min(1, dt * 3);
      if (k >= 1) {
        b.stage = 'chase';
        c.x = cam.x;
        c.on = true;
        /* lay the course out from just past where the belt comes on screen */
        buildChase(c, Math.max(BOARD_X + BOARD_SAFE - 20,
                               c.x + BELT_EDGE + SCROLL_SPEED * BELT_RIDE_T + 20));
      }
      return;
    }

    if (b.stage === 'chase') {
      c.growW = BOARD_LEN;
      var stopAt = BOARD_X + BOARD_LEN - W + 60;
      c.x = Math.min(stopAt, c.x + SCROLL_SPEED * dt);
      b.x = c.x + W - 170;
      b.y = GROUND - b.h;                               // on the board, going with it
      if (c.x >= stopAt) {              // the end of the board: he goes on to the red
        b.stage = 'toArena';
        b.stageT = 0;
        c.on = false;
      }
    } else if (b.stage === 'toArena') {
      /* off the board and out onto the middle of the red platform,
         where he waits for you */
      var ax = ARENA3_X + ARENA3_W / 2 - b.w / 2;
      b.x += (ax - b.x) * Math.min(1, dt * 2);
      b.y = GROUND - b.h;
      if (p.onGround && p.x > ARENA3_X + 40 && p.y + p.h <= GROUND + 1) {
        startAngry(b);
        return;
      }
    }

    /* off the left of the screen is off the board */
    if (c.on && p.x + p.w < c.x) { die(); return; }
    /* and there is no getting past the right of it */
    if (c.on && p.x > c.x + W - p.w) p.x = c.x + W - p.w;

    for (i = 0; i < c.items.length; i++) {
      if (c.items[i].phase === 'done') continue;
      updateItem(c, c.items[i], dt);
      if (p.dead) return;
    }
    for (i = 0; i < c.floats.length; i++) {
      var fl = c.floats[i];
      fl.rot += dt * 2;
      if (circleHitsBox(fl.x, fl.y, fl.r - 3, p)) { die(); return; }
    }

  }

  /* ============================================================
     HE GETS ANGRY
     The board ends at another red platform. Step onto it and he loses
     the fan, the camera closes in on him, he goes a glowing red and
     the screen shakes. Then the wood is gone and it's his platform
     again - one flat red floor, no platforms on it, no pit in the
     middle, spike pits off both ends - and he's back up over it.
     (What he does from here comes next.)
     ============================================================ */
  var ARENA3_X     = BOARD_X + BOARD_LEN;   // the red platform at the end of the board
  var ARENA3_W     = W + 80;     // just a little wider than the screen
  var ANGRY_FAN    = 0.7;        // the fan coming off
  var ANGRY_ZOOM   = 0.8;        // the camera closing in
  var ANGRY_RAGE   = 1.6;        // red, and the shaking
  var ANGRY_OUT    = 0.9;        // the camera pulling back out, on the new floor
  var ANGRY_ZOOM_K = 2.2;        // how close it gets

  var camFx = { zoom: 1, fx: 0, fy: 0, shake: 0 };   // zoom on a point, and shake

  function arena3Solids() {
    return [ { x: ARENA3_X, y: GROUND, w: ARENA3_W, h: 160, red: true } ];
  }
  function arena3Pits() {
    return [ { x: ARENA3_X - 360, y: 512, w: 360, h: 28 },
             { x: ARENA3_X + ARENA3_W, y: 512, w: 360, h: 28 } ];
  }

  function cutsceneRunning() {
    return introRunning() || !!(level && level.boss && level.boss.stage === 'angry');
  }

  function startAngry(b) {
    b.stage = 'angry';
    b.stageT = 0;
    p.vx = 0;
    var base = b.y + b.h;
    level.lostFan = { x: b.x + b.w / 2 - 30 - 26 * 0.6, y: base - 26,
                      vx: -90, vy: -320, rot: 0 };
    b.fanK = 0;
    burst(level.lostFan.x, level.lostFan.y, '#c9d2e6', 24, 1.2);
  }

  /* the wood goes: his platform again, bare */
  function swapToArena3(b) {
    level.solids = arena3Solids();
    level.hazards = arena3Pits();
    level.enemies.length = 0;
    level.orbs.length = 0;
    level.bombs.length = 0;
    level.chase = null;
    level.lostFan = null;
    level.worldW = ARENA3_X + ARENA3_W + 360;
    b.stage = 'phase3';
    b.rage = 1;
    b.fanK = 0;
    /* a fresh fight on it: three blue bombs to beat */
    b.hp = 3;
    b.maxHp = 3;
    b.dead = false;
    b.deadT = 0;
    b.idle = 0;
    b.moves.length = 0;
    level.seekers.length = 0;
    level.spikeballs.length = 0;
    level.fireballs = [];
    level.rainSpikes = [];
    level.pickups[0].hidden = true;
  }

  function updateAngry(b, dt) {
    b.stageT += dt;
    var t = b.stageT, cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    var f = level.lostFan;
    if (f) {
      f.vy += GRAVITY * dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.rot += dt * 9;
    }
    camFx.fx = cx;
    camFx.fy = cy;

    if (t < ANGRY_FAN) {
      camFx.zoom = 1;
    } else if (t < ANGRY_FAN + ANGRY_ZOOM) {
      var k = (t - ANGRY_FAN) / ANGRY_ZOOM;
      camFx.zoom = 1 + (ANGRY_ZOOM_K - 1) * k * k * (3 - 2 * k);
    } else if (t < ANGRY_FAN + ANGRY_ZOOM + ANGRY_RAGE) {
      var r = (t - ANGRY_FAN - ANGRY_ZOOM) / ANGRY_RAGE;
      camFx.zoom = ANGRY_ZOOM_K;
      b.rage = Math.min(1, r * 1.6);
      camFx.shake = 10 * Math.min(1, r * 3);
      if (Math.random() < 0.3) burst(cx, cy, '#ff2d55', 4, 0.8);
    } else {
      if (b.stage === 'angry' && !b.swapped) {
        b.swapped = true;
        swapToArena3(b);
        b.stage = 'angry';             // still in the scene while it pulls out
        b.x = ARENA3_X + ARENA3_W / 2 - b.w / 2;
        b.y = GROUND - b.h;            // still down on his floor; he goes up after
        state.flash = Math.max(state.flash, 0.6);
      }
      var o = Math.min(1, (t - ANGRY_FAN - ANGRY_ZOOM - ANGRY_RAGE) / ANGRY_OUT);
      camFx.zoom = ANGRY_ZOOM_K + (1 - ANGRY_ZOOM_K) * o;
      camFx.shake = 10 * (1 - o);
      camFx.fx = b.x + b.w / 2;
      camFx.fy = b.y + b.h / 2;
      if (o >= 1) {
        camFx.zoom = 1;
        camFx.shake = 0;
        b.stage = 'phase3';
        b.stageT = 0;
      }
    }
  }

  /* Straight into the bare red arena: for coming back to it after a
     death there, and for when the scene above is done. */
  function setupPhase3() {
    var b = level.boss;
    level.intro.done = true;
    b.asleep = false;
    b.moves.length = 0;
    swapToArena3(b);
    b.x = ARENA3_X + ARENA3_W / 2 - b.w / 2;
    b.y = b.hover;
    p.x = ARENA3_X + 200;
    p.y = GROUND - SIZE;
    p.vx = 0; p.vy = 0;
    p.onGround = true;
    safeSpot.x = p.x;
    safeSpot.y = p.y;
    cam.x = Math.max(0, Math.min(level.worldW - W, p.x + p.w / 2 - W / 2));
  }

  /* For now he only drifts over his bare floor. */
  /* ============================================================
     THE JETPACK
     On his bare platform, picking up the blue bomb straps it on as a
     jetpack: hold jump to fly up, let go and you fall. A course goes up
     over the platform - red platforms with spikes along their
     undersides, some sliding side to side - and he rises ahead of you
     as you climb. Fly into him at the top and the bomb goes off on him:
     one hit, the jetpack's gone and you fall back down to carry on.
     The fuse is 30 seconds; the climb takes about 15. If it runs out
     the bomb goes off on you.
     ============================================================ */
  var JET_ACCEL  = 1400;         // how hard it lifts, beyond gravity
  var JET_MAX    = 440;          // fastest it climbs
  var JET_FUSE   = 30;
  var JET_ROW    = 260;          // between rows of the course
  var JET_TOP    = GROUND - 9 * JET_ROW - 200;   // where he waits for you
  var JET_SPIKE  = 16;           // the teeth under a platform

  /* The course, a row at a time from the bottom: each row is the
     stretches of platform it has across the room (as fractions of its
     width), or one that slides. The gaps are the way up. */
  var JET_ROWS = [
    { plats: [[0, 0.37], [0.58, 1]] },
    { plats: [[0, 0.12], [0.33, 1]] },
    { slide: { w: 0.67, amp: 0.16, period: 3.0, phase: 0 } },
    { plats: [[0, 0.62], [0.84, 1]] },
    { slide: { w: 0.72, amp: 0.13, period: 2.4, phase: 1.6 } },
    { plats: [[0, 0.19], [0.4, 0.6], [0.81, 1]] },
    { slide: { w: 0.58, amp: 0.2, period: 2.8, phase: 0.8 } },
    { plats: [[0, 0.42], [0.63, 1]] }
  ];

  function startJet() {
    var b = level.boss, e = roomEdges(), L = e.L, Wd = e.R - e.L;
    p.jet = { fuse: JET_FUSE, thrust: false };
    b.moves.length = 0;
    b.idle = 0;
    level.bombs.length = 0;
    level.seekers.length = 0;
    level.spikeballs.length = 0;
    level.fireballs.length = 0;
    level.enemies.length = 0;
    state.flash = Math.max(state.flash, 0.4);
    burst(p.x + p.w / 2, p.y + p.h, '#4ec3ff', 30, 1.4);

    var jet = { solids: [], hazards: [], sliders: [] };
    function plat(x, y, w) {
      var s = { x: x, y: y, w: w, h: 20, red: true };
      var hz = { x: x, y: y + 20, w: w, h: JET_SPIKE, down: true };
      jet.solids.push(s);
      jet.hazards.push(hz);
      return { s: s, hz: hz };
    }
    for (var i = 0; i < JET_ROWS.length; i++) {
      var row = JET_ROWS[i], y = GROUND - (i + 1) * JET_ROW;
      if (row.plats) {
        for (var k = 0; k < row.plats.length; k++) {
          plat(L + row.plats[k][0] * Wd, y, (row.plats[k][1] - row.plats[k][0]) * Wd);
        }
      } else {
        var sw = row.slide.w * Wd;
        var pr = plat(L + (Wd - sw) / 2, y, sw);
        jet.sliders.push({ s: pr.s, hz: pr.hz, x0: L + (Wd - sw) / 2,
                           amp: row.slide.amp * Wd, period: row.slide.period,
                           phase: row.slide.phase });
      }
    }
    /* walls up the sides, so the way up is up - stopping short of his
       floor, so its ends are still open over the pits */
    var top = JET_TOP - 400;
    jet.solids.push({ x: L - 40, y: top, w: 40, h: GROUND - 140 - top, red: true });
    jet.solids.push({ x: e.R, y: top, w: 40, h: GROUND - 140 - top, red: true });

    for (i = 0; i < jet.solids.length; i++) level.solids.push(jet.solids[i]);
    for (i = 0; i < jet.hazards.length; i++) level.hazards.push(jet.hazards[i]);
    level.jet = jet;
  }

  /* the course goes, and so does the jetpack */
  function endJet() {
    var jet = level.jet, i;
    if (jet) {
      for (i = 0; i < jet.solids.length; i++) {
        var si = level.solids.indexOf(jet.solids[i]);
        if (si !== -1) level.solids.splice(si, 1);
      }
      for (i = 0; i < jet.hazards.length; i++) {
        var hi = level.hazards.indexOf(jet.hazards[i]);
        if (hi !== -1) level.hazards.splice(hi, 1);
      }
    }
    level.jet = null;
    p.jet = null;
    if (p.holding) { p.holding.hidden = true; p.holding.held = false; p.holding = null; }
  }

  function updateJet(b, dt) {
    var jet = level.jet;
    var i;
    for (i = 0; i < jet.sliders.length; i++) {
      var sl = jet.sliders[i];
      var was = sl.s.x;
      sl.s.x = sl.x0 + sl.amp * Math.sin(state.t * Math.PI * 2 / sl.period + sl.phase);
      sl.hz.x = sl.s.x;
      if (standingOn({ x: was, y: sl.s.y, w: sl.s.w, h: sl.s.h })) p.x += sl.s.x - was;   // it carries you
    }

    /* he goes up ahead of you, and waits at the top */
    var want = Math.max(JET_TOP, Math.min(b.hover, p.y - 380));
    b.y += (want - b.y) * Math.min(1, dt * 3);
    var e = roomEdges();
    b.x += ((e.L + e.R) / 2 - b.w / 2 - b.x) * Math.min(1, dt * 2);

    p.jet.fuse -= dt;
    if (p.jet.fuse <= 0) {                           // too slow: it goes off on you
      burst(p.x + p.w / 2, p.y + p.h / 2, '#ff5f7e', 60, 2.2);
      endJet();
      die();
      return;
    }

    /* into him with it: one hit, and down you go */
    if (hits(p, bossBox(b))) {
      endJet();
      b.hp--;
      b.flash = 0.4;
      burst(b.x + b.w / 2, b.y + b.h / 2, '#4ec3ff', 70, 2.2);
      state.flash = Math.max(state.flash, 0.6);
      p.vy = 0;
      if (b.hp <= 0) { b.dead = true; b.deadT = 0; }
    }
  }

  function updatePhase3(b, dt) {
    /* three blue bombs and he's down - for now, that's the end */
    if (b.dead) {
      b.y += (b.hover - 40 - b.y) * Math.min(1, dt * 2);
      b.deadT += dt;
      if (b.deadT > 2.5 && !state.complete) {
        state.complete = true;
        saveGame();
        finishLevel();
      }
      return;
    }

    /* on the jetpack: no attacks, only the climb */
    if (level.jet) { updateJet(b, dt); updateRainSpikes(dt); return; }

    updateSeekers(dt);      if (p.dead) return;
    updateSpikeballs(dt);   if (p.dead) return;
    updateFireballs(dt);    if (p.dead) return;
    updateRainSpikes(dt);   if (p.dead) return;

    for (var i = b.moves.length - 1; i >= 0; i--) {
      var mv = b.moves[i];
      mv.t += dt;
      runMove(b, mv, dt);
      if (p.dead) return;
      if (mv.t >= mv.dur) b.moves.splice(i, 1);
    }

    /* between attacks he drifts over his floor */
    if (b.moves.length === 0) {
      b.y += (b.hover - b.y) * Math.min(1, dt * 3);
      b.x += b.vx * dt;
      var e = roomEdges();
      if (b.x < e.L + 200) { b.x = e.L + 200; b.vx = Math.abs(b.vx); }
      if (b.x + b.w > e.R - 200) { b.x = e.R - 200 - b.w; b.vx = -Math.abs(b.vx); }
      b.idle += dt;
      if (b.idle >= b.rest) { b.idle = 0; chooseAttack(b); }
    }
  }

  function updateBoss(dt) {
    var b = level.boss;
    if (!b || b.asleep) return;
    if (b.flash > 0) b.flash -= dt;
    if (b.stage === 'angry') { updateAngry(b, dt); return; }
    if (b.stage === 'phase3') { updatePhase3(b, dt); return; }
    if (b.stage) { updateChase(b, dt); return; }
    if (!b.dead) {
      updateSeekers(dt);
      if (p.dead) return;
      updateSpikeballs(dt);
      if (p.dead) return;
    }
    if (b.dead) {
      b.y += (b.hover - 40 - b.y) * Math.min(1, dt * 2);
      /* there's no door in his room: beating him ends it...for now */
      if (b.final) {
        b.deadT += dt;
        if (b.deadT > 2.5 && !state.complete) {
          state.complete = true;
          saveGame();
          finishLevel();
        }
      }
      return;
    }

    for (var i = b.moves.length - 1; i >= 0; i--) {
      var mv = b.moves[i];
      mv.t += dt;
      runMove(b, mv, dt);
      if (p.dead) return;
      if (mv.t >= mv.dur) b.moves.splice(i, 1);
    }

    /* between attacks it drifts, so it's never a stationary target */
    if (b.moves.length === 0) {
      b.y += (b.hover - b.y) * Math.min(1, dt * 3);
      b.x += b.vx * dt;
      if (b.x < 240) { b.x = 240; b.vx = Math.abs(b.vx); }
      if (b.x + b.w > level.worldW - 240) {
        b.x = level.worldW - 240 - b.w;
        b.vx = -Math.abs(b.vx);
      }
      b.idle += dt;
      if (b.idle >= b.rest) { b.idle = 0; chooseAttack(b); }
    }
  }

  /* The last platform of the last room. Walk in past `atX` and a laser
     comes down at each end of it, and the dormant purples wake. Once
     every one of them is down the lasers go and the key comes out. */
  var LASER_W = 16;

  function arenaLasers(a) {
    return [ { x: a.left - LASER_W / 2,  y: -400, w: LASER_W, h: a.floor + 400 },
             { x: a.right - LASER_W / 2, y: -400, w: LASER_W, h: a.floor + 400 } ];
  }

  function updateArena() {
    var a = level.arena;
    if (!a) return;
    var i, e;

    if (a.phase === 'waiting') {
      if (p.onGround && p.x > a.atX && p.x < a.right && p.y + p.h <= a.floor + 2) {
        a.phase = 'fight';
        state.flash = Math.max(state.flash, 0.4);
        for (i = 0; i < level.enemies.length; i++) {
          e = level.enemies[i];
          if (!e.arena) continue;
          e.dormant = false;
          burst(e.x + e.w / 2, e.y + e.h / 2, '#c77dff', 40, 1.6);
        }
      }
      return;
    }
    if (a.phase !== 'fight') return;

    var beams = arenaLasers(a);
    for (i = 0; i < beams.length; i++) {
      if (hits(p, beams[i])) { die(); return; }
    }

    for (i = 0; i < level.enemies.length; i++) {
      e = level.enemies[i];
      if (e.arena && !e.dead) return;
    }
    a.phase = 'done';                  // all three down: lasers off, key out
    burst(a.left, a.floor - 120, '#ff2d55', 30, 1.4);
    burst(a.right, a.floor - 120, '#ff2d55', 30, 1.4);
    dropKey(null);
  }

  function drawArena() {
    var a = level.arena;
    if (!a || a.phase !== 'fight') return;
    var beams = arenaLasers(a);
    var pulse = 0.75 + Math.sin(state.t * 40) * 0.25;
    for (var i = 0; i < beams.length; i++) {
      var bm = beams[i];
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#ff2d55';
      ctx.shadowColor = '#ff2d55';
      ctx.shadowBlur = 30;
      ctx.fillRect(bm.x - 9, bm.y, bm.w + 18, bm.h);
      ctx.fillStyle = '#fff';
      ctx.fillRect(bm.x + 2, bm.y, bm.w - 4, bm.h);
      ctx.restore();
      ctx.fillStyle = 'rgba(255,45,85,0.5)';       // scorch where it lands
      ctx.fillRect(bm.x - 18, a.floor - 5, bm.w + 36, 5);
    }
  }

  /* Red bombs fall, sit, then go off. Being near one when it does is
     the whole danger; the blue one is the opportunity. */
  function updateBombs(dt) {
    for (var i = level.bombs.length - 1; i >= 0; i--) {
      var bo = level.bombs[i];

      if (bo.blast > 0) {
        bo.blast -= dt;
        if (circleHitsBox(bo.x + bo.w / 2, bo.y + bo.h / 2, bo.r || 74, p)) { die(); return; }
        if (bo.blast <= 0) level.bombs.splice(i, 1);
        continue;
      }

      if (!bo.grounded) {
        bo.vy += GRAVITY * dt;
        var wasB = bo.y + bo.h;
        bo.y += bo.vy * dt;
        var nowB = bo.y + bo.h;
        for (var k = 0; k < level.solids.length; k++) {
          var s = level.solids[k];
          if (bo.x + bo.w <= s.x || bo.x >= s.x + s.w) continue;
          if (wasB <= s.y && nowB >= s.y) {
            bo.y = s.y - bo.h; bo.vy = 0; bo.grounded = true;
            if (bo.instant) bo.fuse = 0.5;       // his last bombs go off half a second after they land
            break;
          }
        }
        if (bo.y > level.fallY) { level.bombs.splice(i, 1); continue; }
      }

      bo.fuse -= dt;
      if (bo.fuse <= 0) {
        bo.blast = 0.3;
        burst(bo.x + bo.w / 2, bo.y + bo.h / 2, '#ff5f7e', 44, 1.8);
        state.flash = Math.max(state.flash, 0.35);
      }
    }
  }

  /* ============================================================
     PARTICLES
     ============================================================ */
  function burst(x, y, color, n, power) {
    power = power || 1;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = (60 + Math.random() * 190) * power;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 60 * power,
        life: 0.35 + Math.random() * 0.45,
        max: 0.8,
        size: 2 + Math.random() * 3,
        color: color
      });
    }
  }

  /* ============================================================
     UPDATE
     ============================================================ */
  /* ============================================================
     THE CATCH

     Room Eleven's last gap cannot be crossed, and you only find that
     out in mid-air. The green fellow from Room Five comes up out of
     the dark underneath you, takes hold, and carries you the rest of
     the way. While he has you, nothing in the room can touch you and
     nothing you press does anything.
     ============================================================ */
  var SWOOP_TIME = 0.34;         // him rising to meet you
  var CARRY_TIME = 1.25;         // the flight across
  var CARRY_LIFT = 130;          // how high the arc of it goes

  function ease(k) { return k * k * (3 - 2 * k); }

  /* True only while he actually has hold of you. */
  function rescueHolding() {
    var r = level.rescue;
    return !!r && (r.phase === 'swoop' || r.phase === 'carry');
  }

  function updateRescue(dt) {
    var r = level.rescue;
    if (r.phase === 'done') return;

    if (r.phase === 'waiting') {
      /* past the last pad, and far enough down that you have had time
         to work out the gap was never going to happen */
      if (p.x < r.atX || p.y < r.atY) return;
      r.phase = 'swoop';
      r.t = 0;
      r.x = p.x - 34;
      r.y = level.fallY + 90;
      p.vx = 0; p.vy = 0; p.dash = 0;
      state.flash = Math.max(state.flash, 0.3);
      return;
    }

    r.t += dt;

    if (r.phase === 'swoop') {
      var k = ease(Math.min(1, r.t / SWOOP_TIME));
      var y0 = level.fallY + 90;
      r.x = (p.x - 34) + 34 * k;
      r.y = y0 + ((p.y + p.h + 6) - y0) * k;
      p.vx = 0; p.vy = 0; p.rot = 0; p.dash = 0;
      if (r.t >= SWOOP_TIME) {
        r.phase = 'carry';
        r.t = 0;
        r.fromX = p.x; r.fromY = p.y;
        burst(p.x + p.w / 2, p.y + p.h, '#7bffb2', 22, 1.0);
      }
      return;
    }

    if (r.phase === 'carry') {
      r.say += dt;
      var c = ease(Math.min(1, r.t / CARRY_TIME));
      p.x = r.fromX + (r.to.x - r.fromX) * c;
      p.y = r.fromY + ((r.to.y - SIZE) - r.fromY) * c
            - Math.sin(c * Math.PI) * CARRY_LIFT;
      p.vx = 0; p.vy = 0; p.face = 1; p.rot = 0;
      r.x = p.x - 2; r.y = p.y + p.h + 6;
      if (r.t >= CARRY_TIME) {
        p.x = r.to.x;
        p.y = r.to.y - SIZE;
        p.onGround = true;
        p.airJumps = 1;
        safeSpot.x = p.x; safeSpot.y = p.y;
        r.phase = 'leaving';
        r.t = 0;
        burst(p.x + p.w / 2, p.y + p.h, '#7bffb2', 26, 1.2);
      }
      return;
    }

    /* 'leaving' — he lets go and climbs back out of the room */
    r.say += dt;
    r.x += 170 * dt;
    r.y -= 230 * dt;
    if (r.t > 3.4) r.phase = 'done';
  }

  function update(dt) {
    state.t += dt;
    if (state.flash > 0) state.flash = Math.max(0, state.flash - dt * 2.5);
    if (state.titleT > 0) state.titleT = Math.max(0, state.titleT - dt);

    var i;
    for (i = particles.length - 1; i >= 0; i--) {
      var q = particles[i];
      q.life -= dt;
      if (q.life <= 0) { particles.splice(i, 1); continue; }
      q.vy += 900 * dt;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
    }

    var sc = level.scarecrow;
    if (sc) {
      if (sc.flash > 0) sc.flash -= dt;
      if (sc.shake > 0) sc.shake -= dt;
      if (sc.hp <= 0) {
        sc.regen -= dt;
        if (sc.regen <= 0) {
          sc.hp = sc.maxHp;
          burst(sc.x + sc.w / 2, sc.y + sc.h / 2, '#f9c74f', 16);
        }
      }
    }

    if (p.dead) {
      p.deadT += dt;
      if (p.deadT > (state.grey ? GREY_TIME : 0.7)) respawn();
      return;
    }

    if (state.complete) return;

    /* --- the final boss's entrance: you stand and watch --- */
    if (introRunning()) {
      updateIntro(dt);
      updateCamera(dt);
      return;
    }
    /* --- and him getting angry: you stand and watch that too --- */
    if (cutsceneRunning()) {
      updateBoss(dt);
      updateCamera(dt);
      return;
    }

    /* --- somebody catching you, in the one room that has somebody.
           While he has hold of you the rest of the room is off. --- */
    if (level.rescue) {
      updateRescue(dt);
      if (rescueHolding()) { updateCamera(dt); return; }
    }

    if (p.dash > 0) {
      /* --- a dash overrides everything: flat, fast, no gravity.
             DASH_TIME is the most you get, but letting go of the key
             cuts it short wherever you are — so how far you travel is
             yours to choose. --- */
      p.dash -= dt;
      if (!(keys.Space || keys.ArrowUp || keys.KeyW)) p.dash = 0;
      p.face = p.dashDir;
      p.vx = DASH_SPD * p.dashDir;
      p.vy = 0;
      p.rot += dt * 13 * p.dashDir;
      state.buffer = 0;
      if (p.dash <= 0) p.vx = MOVE_SPD * p.dashDir;   // drop back to a run

    } else if (p.yeet > 0) {
      /* --- thrown by a red belt: a plain arc, and nothing you press
             changes it --- */
      p.yeet -= dt;
      p.vx = p.yeetVx;
      p.face = p.yeetVx >= 0 ? 1 : -1;
      state.buffer = 0;
      p.vy += GRAVITY * dt;
      if (p.vy > MAX_FALL) p.vy = MAX_FALL;

    } else {
      /* --- horizontal --- */
      var want = 0;
      if (keys.ArrowLeft || keys.KeyA) want -= 1;
      if (keys.ArrowRight || keys.KeyD) want += 1;
      if (state.xray) { want = 0; state.buffer = 0; }   // frozen while you look
      if (want !== 0) {
        p.vx += want * ACCEL * dt;
        if (p.vx > MOVE_SPD) p.vx = MOVE_SPD;
        if (p.vx < -MOVE_SPD) p.vx = -MOVE_SPD;
        p.face = want;
      } else {
