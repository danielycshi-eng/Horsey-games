<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>???</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../gate.js" data-gate="unnamed"></script>
  <style>
    body {
      background: #05070f;
      justify-content: flex-start;
      padding-top: 3.2rem;
      overflow: hidden;
    }

    #stage {
      position: relative;
      width: min(96vw, 960px);
      aspect-ratio: 16 / 9;
      border: 2px solid #1d2b5c;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(78, 195, 255, 0.18), 0 0 120px rgba(78, 195, 255, 0.06);
    }

    #game { display: block; width: 100%; height: 100%; }

    /* ---- full-screen menus ---- */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: radial-gradient(ellipse at center, #131a3d 0%, #05070f 75%);
      z-index: 5;
    }
    .screen.hidden { display: none; }

    .qmark {
      font-size: clamp(3.5rem, 12vw, 7rem);
      font-weight: 800;
      letter-spacing: 12px;
      color: #4ec3ff;
      text-shadow: 0 0 24px rgba(78, 195, 255, 0.7), 0 0 70px rgba(78, 195, 255, 0.3);
      animation: qpulse 2.6s ease-in-out infinite;
    }
    @keyframes qpulse {
      0%, 100% { transform: scale(1); opacity: 0.92; }
      50%      { transform: scale(1.04); opacity: 1; }
    }

    .done-title {
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      font-weight: 800;
      letter-spacing: 6px;
      color: #4ec3ff;
      text-shadow: 0 0 22px rgba(78, 195, 255, 0.6);
    }

    .screen p {
      color: #8ea7d6;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-size: 0.8rem;
      margin: 0.5rem 0 1.4rem;
    }

    #nameInput {
      width: min(80%, 320px);
      padding: 0.7rem 1rem;
      font-family: inherit;
      font-size: 1.2rem;
      letter-spacing: 3px;
      text-align: center;
      color: #fff;
      background: #0b0f24;
      border: 2px solid #1d2b5c;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #nameInput:focus {
      border-color: #4ec3ff;
      box-shadow: 0 0 18px rgba(78, 195, 255, 0.35);
    }

    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hide { display: none !important; }

    .tbtn {
      margin-top: 1.1rem;
      width: min(78vw, 280px);
      padding: 0.65rem 1.4rem;
      font-family: inherit;
      font-size: 1rem;
      letter-spacing: 3px;
      color: #05070f;
      font-weight: 700;
      background: #4ec3ff;
      border: 2px solid #4ec3ff;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, border-color 0.15s, color 0.15s;
    }
    .tbtn:hover { background: #7fd6ff; border-color: #7fd6ff; transform: scale(1.04); }

    .tbtn.ghost {
      color: #8ea7d6;
      background: transparent;
      border-color: #1d2b5c;
      font-weight: 600;
    }
    .tbtn.ghost:hover {
      color: #fff;
      background: transparent;
      border-color: #4ec3ff;
    }

    .keys {
      margin-top: 2rem;
      color: #56658c;
      font-size: 0.75rem;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <a href="../games.html" class="back-link">&larr; Games</a>

  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>

    <div class="screen" id="titleScreen">
      <div class="qmark">???</div>
      <p>A story with no name yet</p>

      <div class="panel hide" id="menuPanel">
        <button id="continueBtn" class="tbtn" type="button">Continue Game</button>
        <button id="newBtn" class="tbtn ghost" type="button">New Game</button>
      </div>

      <div class="panel" id="namePanel">
        <input id="nameInput" type="text" maxlength="12" placeholder="NAME YOUR HERO" autocomplete="off" spellcheck="false">
        <button id="beginBtn" class="tbtn" type="button">Begin</button>
      </div>

      <div class="keys">One life. No checkpoints. Mind the gap.</div>
    </div>

    <div class="screen hidden" id="doneScreen">
      <div class="done-title" id="doneTitle">TUTORIAL COMPLETE</div>
      <p id="doneSub">Nice work</p>
      <div class="panel">
        <button id="nextBtn" class="tbtn" type="button">Start the Game</button>
        <button id="againBtn" class="tbtn ghost" type="button">Restart the Tutorial</button>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx    = canvas.getContext('2d');
  var W = 960, H = 540;

  var GROUND = 440;
  var SIZE   = 30;               // a square cube, like a proper icon

  /* ============================================================
     PHYSICS
     ============================================================ */
  var GRAVITY  = 2000;
  var MOVE_SPD = 275;
  var ACCEL    = 2800;
  var FRICTION = 3000;
  var JUMP_V   = 640;            // one jump: 102px up, 176px across
  var JUMP_V2  = 700;            // the second jump kicks a little harder
  var MAX_FALL = 950;
  var COYOTE   = 0.10;
  var BUFFER   = 0.12;
  var ATK_TIME = 0.20;
  var ATK_COOL = 0.32;

  /* ============================================================
     LEVELS

     Each builder returns a fresh, self-contained room. Nothing is
     shared between them, so reloading a level is a clean slate.

     solids  - you stand on these
     hazards - touching one kills you
     pickup  - the one thing you can carry (B), with a home to
               return to
     door    - walk into it carrying `needs` and the room is over
     fallY   - fall past this and you're gone
     ============================================================ */
  function buildTutorial() {
    return {
      name: 'Tutorial',
      worldW: 3720,
      start: { x: 120, y: GROUND - SIZE },
      fallY: 520,

      /* Each lesson gets its own stretch of ground with nothing else
         in it, so you never meet two new ideas at the same time. */
      solids: [
        { x: -60,  y: GROUND, w: 1160, h: 160 },   // ground A: 0 .. 1100
        { x: 820,  y: 370,    w: 140,  h: 70  },   // the ledge (teaches JUMP)
        { x: 1320, y: GROUND, w: 2400, h: 160 },   // ground B: 1320 .. 3720
        { x: 2800, y: 386,    w: 70,   h: 54  }    // apple pedestal
      ],
      hazards: [ { x: 1100, y: 486, w: 220, h: 54 } ],
      pit: { x: 1100, w: 220 },                    // 220px: too far for one jump

      scarecrow: { x: 1800, y: 352, w: 46, h: 88, hp: 3, maxHp: 3,
                   regen: 0, flash: 0, shake: 0, everBroken: false },
      barrier: { x: 2250, y: 120, w: 26, h: 320, open: false },

      pickups: [ { kind: 'apple', x: 2822, y: 358, w: 26, h: 28,
                   home: { x: 2822, y: 358 } } ],
      door: { x: 3450, y: 300, w: 60, h: 140, needs: 'apple' },

      waves: [],
      boss: null,
      bombs: [],
      sinkers: [],
      enemies: [],
      saws: [],
      arrows: [[1180, 330], [1250, 268]],
      hints: [
        { x: 300,  y: 360, big: '←   →',   small: 'MOVE' },
        { x: 760,  y: 286, big: 'SPACE',             small: 'JUMP' },
        { x: 1210, y: 200, big: 'SPACE IN THE AIR',  small: 'DOUBLE JUMP' },
        { x: 1720, y: 292, big: 'I',                 small: 'ATTACK' },
        { x: 2720, y: 286, big: 'B',                 small: 'PICK UP / DROP' }
      ]
    };
  }

  /* Room One. Four beats, each one jump harder than the last:
     a single jump up, a double jump higher, a double jump over
     spikes, then the key and the door out. */
  function buildRoomOne() {
    return {
      name: 'Room One',
      worldW: 2700,
      start: { x: 80, y: GROUND - SIZE },
      fallY: 620,

      solids: [
        { x: -60,  y: GROUND, w: 660, h: 160 },   // start ground: 0 .. 600
        { x: 700,  y: 370,    w: 140, h: 26 },    // 1. one jump up (70 high)
        { x: 960,  y: 240,    w: 140, h: 26 },    // 2. 130 higher - needs two
        { x: 1180, y: 300,    w: 140, h: 26 },    // the run-up
        { x: 1320, y: 300,    w: 240, h: 26 },    // 3. the spiked stretch
        { x: 1560, y: 300,    w: 200, h: 26 },    // landing
        { x: 1860, y: 300,    w: 260, h: 26 },    // 4. the key
        { x: 2200, y: 300,    w: 340, h: 26 }     // the door
      ],
      hazards: [ { x: 1326, y: 272, w: 228, h: 28 } ],

      pickups: [ { kind: 'key', x: 1960, y: 274, w: 30, h: 26,
                   home: { x: 1960, y: 274 } } ],
      door: { x: 2300, y: 170, w: 60, h: 130, needs: 'key' },

      waves: [],
      boss: null,
      bombs: [],
      sinkers: [],
      enemies: [],
      saws: [],
      arrows: [],
      hints: []          // no labels: they can remember how to pick things up
    };
  }

  /* Room Two. Four jumps across a void, each gap patrolled by a saw
     that rides up and down through it. Wait for the blade to drop,
     then go. The last gap is 240px with two saws in it, so it takes
     a double jump AND a read of both blades. */
  function buildRoomTwo() {
    return {
      name: 'Room Two',
      worldW: 2200,
      start: { x: 80, y: 380 - SIZE },
      fallY: 620,

      solids: [
        { x: -60,  y: 380, w: 480, h: 26 },   // start:  -60 .. 420
        { x: 560,  y: 380, w: 200, h: 26 },   // jump 1: gap of 140
        { x: 900,  y: 380, w: 200, h: 26 },   // jump 2: gap of 140
        { x: 1240, y: 380, w: 220, h: 26 },   // jump 3: gap of 140
        { x: 1700, y: 380, w: 340, h: 26 }    // jump 4: gap of 240
      ],
      hazards: [],

      /* y0 is the top of the swing, y1 the bottom. At the bottom the
         blade sits below the platforms and the jump arc is clear. */
      saws: [
        { x0: 490,  x1: 490,  y0: 290, y1: 500, r: 26, period: 2.2, phase: 0.00 },
        { x0: 830,  x1: 830,  y0: 290, y1: 500, r: 26, period: 2.0, phase: 0.30 },
        { x0: 1170, x1: 1170, y0: 290, y1: 500, r: 26, period: 2.4, phase: 0.60 },
        { x0: 1520, x1: 1520, y0: 290, y1: 500, r: 26, period: 2.6, phase: 0.00 },
        { x0: 1640, x1: 1640, y0: 290, y1: 500, r: 26, period: 2.6, phase: 0.25 }
      ],

      waves: [],
      boss: null,
      bombs: [],
      sinkers: [],
      enemies: [],
      pickups: [],
      door: { x: 1900, y: 250, w: 60, h: 130, needs: null },

      arrows: [],
      hints: []
    };
  }

  /* Room Three. Platforms up to an arena where a small red cube lives.
     It chases you and hangs on: two seconds of contact and you're gone.
     Three hits kill it, and it drops the key to the next room. */
  function buildRoomThree() {
    return {
      name: 'Room Three',
      worldW: 3500,
      start: { x: 80, y: GROUND - SIZE },
      fallY: 620,

      /* Every gap is 240px — double jump distance, for you and for it. */
      solids: [
        { x: -60,  y: GROUND, w: 560, h: 160 },   // start:  -60 .. 500
        { x: 740,  y: 380,    w: 220, h: 26  },   // 740 .. 960
        { x: 1200, y: 320,    w: 240, h: 26  },   // 1200 .. 1440
        { x: 1680, y: 380,    w: 260, h: 26  },   // 1680 .. 1940
        { x: 2180, y: GROUND, w: 620, h: 160 },   // the arena: 2180 .. 2800
        { x: 3040, y: 380,    w: 320, h: 26  }    // the way out
      ],
      waves: [],
      boss: null,
      bombs: [],
      sinkers: [],
      hazards: [],
      saws: [],

      /* It jumps, it double jumps, and it will follow you anywhere
         in the room. There is no outrunning it forever. */
      enemies: [{
        x: 2400, y: GROUND - 22, w: 22, h: 22,
        vx: 0, vy: 0,
        hp: 3, maxHp: 3,
        speed: 235,                    // slower than you (275), but not by much
        face: -1,
        flash: 0,
        knock: 0,
        dead: false,
        onGround: false,
        airJumps: 1,
        spawn: { x: 2400, y: GROUND - 22 }
      }],

      /* Hidden until the cube drops it. */
      pickups: [ { kind: 'key', x: 2400, y: 380, w: 30, h: 26, hidden: true,
                   home: { x: 2400, y: 380 } } ],
      door: { x: 3180, y: 250, w: 60, h: 130, needs: 'key' },

      arrows: [],
      hints: []
    };
  }

  /* One red cube, on a platform, with a saw skating along its top. */
  function redOn(plat, atX) {
    return {
      x: atX, y: plat.y - 22, w: 22, h: 22,
      vx: 0, vy: 0,
      hp: 3, maxHp: 3,
      speed: 235,
      face: -1,
      flash: 0,
      knock: 0,
      dead: false,
      onGround: false,
      airJumps: 1,
      spawn: { x: atX, y: plat.y - 22 }
    };
  }

  /* Room Four. Solid ground underfoot, three platforms climbing away
     from it, a red on each and a saw sliding along each one. Kill all
     three and the key appears on the top platform, so the climb is the
     room. The saws sit ON the platforms and never dip below them. */
  function buildRoomFour() {
    /* 240px gaps, the same double-jump distance as Room Three, and the
       undersides pass through so you can come up from below. */
    var ground = { x: -60,  y: GROUND, w: 2720, h: 160 };
    var platA  = { x: 560,  y: 350,    w: 260,  h: 26, oneWay: true };
    var platB  = { x: 1060, y: 270,    w: 260,  h: 26, oneWay: true };
    var platC  = { x: 1560, y: 190,    w: 260,  h: 26, oneWay: true };

    /* A saw rides with its underside exactly on the platform top, and
       turns back before either edge, so it never hangs off. */
    function sawOn(plat, period, phase) {
      var r = 22;
      return {
        x0: plat.x + r, x1: plat.x + plat.w - r,
        y0: plat.y - r, y1: plat.y - r,
        r: r, period: period, phase: phase
      };
    }

    return {
      name: 'Room Four',
      worldW: 2600,
      start: { x: 80, y: GROUND - SIZE },
      fallY: 620,

      solids: [ground, platA, platB, platC],
      waves: [],
      boss: null,
      bombs: [],
      sinkers: [],
      hazards: [],
      saws: [ sawOn(platA, 3.0, 0.00),
              sawOn(platB, 2.6, 0.35),
              sawOn(platC, 2.2, 0.70) ],

      enemies: [ redOn(platA, 700), redOn(platB, 1200), redOn(platC, 1700) ],

      /* Appears up top once all three are down. */
      pickups: [ { kind: 'key', x: 1680, y: 164, w: 30, h: 26, hidden: true,
                   spawnAt: { x: 1680, y: 164 },
                   home: { x: 1680, y: 164 } } ],
      door: { x: 2300, y: 310, w: 60, h: 130, needs: 'key' },

      arrows: [],
      hints: []
    };
  }

  /* Room Five. No hazards, no enemies. A green fellow says hello and
     buries you in apples you can carry around for absolutely no reason. */
  function buildRoomFive() {
    var apples = [];
    for (var i = 0; i < 22; i++) {
      apples.push({
        kind: 'apple',
        x: 780 + (i % 11) * 46 + (i > 10 ? 22 : 0),
        y: -140 - Math.floor(i / 11) * 90 - (i % 5) * 40,
        w: 26, h: 28,
        hidden: true, grounded: false, vy: 0,
        home: { x: 800 + i * 40, y: GROUND - 28 }
      });
    }

    return {
      name: 'Room Five',
      worldW: 2200,
      start: { x: 80, y: GROUND - SIZE },
      fallY: 620,

      solids: [ { x: -60, y: GROUND, w: 2320, h: 160 } ],
      hazards: [],
      saws: [],
      enemies: [],
      waves: [],
      boss: null,
      bombs: [],
      sinkers: [],

      npc: {
        x: 900, y: GROUND - 34, w: 30, h: 34,
        said: false, t: 0,
        line: 'You have come here? You must be tired! Here, some apples!'
      },

      pickups: apples,
      door: { x: 1900, y: 310, w: 60, h: 130, needs: null },

      arrows: [],
      hints: []
    };
  }

  /* Room Six. Room Four turned all the way up: ten reds, saws on the
     platforms, another skating along the ground, and spikes surging out
     of the floor in a travelling wave. You start on a ledge above it. */
  function buildRoomSix() {
    var ground = { x: -60,  y: GROUND, w: 3760, h: 160 };
    var ledge  = { x: 40,   y: 350,    w: 200,  h: 26, oneWay: true };
    var platA  = { x: 700,  y: 350,    w: 260,  h: 26, oneWay: true };
    var platB  = { x: 1200, y: 270,    w: 260,  h: 26, oneWay: true };
    var platC  = { x: 1700, y: 190,    w: 260,  h: 26, oneWay: true };

    function sawOn(plat, period, phase) {
      var r = 22;
      return {
        x0: plat.x + r, x1: plat.x + plat.w - r,
        y0: plat.y - r, y1: plat.y - r,
        r: r, period: period, phase: phase
      };
    }

    /* One unbroken carpet of spikes, end to end, running under the
       spawn ledge as well — the ledge is the only safe floor in the
       room. Each bed lags the one before it, so the whole thing rolls
       past as a travelling wave and you move with the troughs. */
    var waves = [];
    var BED = 120;
    for (var i = 0; i * BED - 60 < 3760; i++) {
      waves.push({
        x: -60 + i * BED, w: BED, h: 34,   // low, and slow, with a tell
        period: 4.6, phase: (i * 0.26) % 1
      });
    }

    var reds = [];
    var spots = [[760, platA], [900, platA],
                 [1260, platB], [1400, platB],
                 [1760, platC], [1900, platC],
                 [1500, ground], [2100, ground], [2600, ground], [3000, ground]];
    for (var j = 0; j < spots.length; j++) {
      reds.push(redOn(spots[j][1], spots[j][0]));
    }

    return {
      name: 'Room Six',
      worldW: 3700,
      start: { x: 90, y: 350 - SIZE },     // the ledge, clear of the spikes
      fallY: 620,

      solids: [ground, ledge, platA, platB, platC],
      hazards: [],
      waves: waves,
      boss: null,
      bombs: [],
      sinkers: [],

      saws: [],                            // no blades in here at all

      enemies: reds,

      pickups: [ { kind: 'key', x: 1820, y: 164, w: 30, h: 26, hidden: true,
                   spawnAt: { x: 1820, y: 164 },
                   home: { x: 1820, y: 164 } } ],
      door: { x: 3450, y: 310, w: 60, h: 130, needs: 'key' },

      arrows: [],
      hints: []
    };
  }

  /* The boss. Two low platforms with a high one between them, and a
     thing in the air that will not come down to your level. Everything
     it does is survivable from somewhere: under a platform, on top of
     one, or by being somewhere else entirely. */
  function buildRoomSeven() {
    var ground = { x: -60,  y: GROUND, w: 2520, h: 160 };
    var lowL   = { x: 420,  y: 330,    w: 320,  h: 24, oneWay: true };
    var high   = { x: 880,  y: 210,    w: 320,  h: 24, oneWay: true };
    var lowR   = { x: 1340, y: 330,    w: 320,  h: 24, oneWay: true };

    return {
      name: 'The Boss',
      worldW: 2400,
      start: { x: 120, y: GROUND - SIZE },
      fallY: 620,

      solids: [ground, lowL, high, lowR],
      hazards: [],
      saws: [],
      waves: [],
      enemies: [],
      bombs: [],
      sinkers: [],

      boss: {
        x: 1000, y: 96, w: 74, h: 56,
        vx: 120,
        hp: 3, maxHp: 3,
        flash: 0, dead: false,
        hover: 96,
        idle: 0, rest: 1.4,
        moves: []
      },

      /* the blue bomb appears during a bomb drop; the key when it dies */
      pickups: [
        { kind: 'bomb', x: 0, y: 0, w: 26, h: 26, hidden: true,
          grounded: true, vy: 0, flying: false,
          home: { x: 1000, y: GROUND - 26 } },
        { kind: 'key', x: 1020, y: 184, w: 30, h: 26, hidden: true,
          spawnAt: { x: 1020, y: 184 },
          home: { x: 1020, y: 184 } }
      ],
      door: { x: 2100, y: 310, w: 60, h: 130, needs: 'key' },

      arrows: [],
      hints: []
    };
  }

  /* Room Eight. Nothing underneath but a long drop, and the platforms
     sag under you the moment you land. Some share a chain and go down
     together; some are capped with spikes and are only ever something
     to clear. Almost every gap is a double jump. */
  function buildRoomEight() {
    var TOP = 380;

    function sinker(x, w, chain) {
      return { x: x, y: TOP, w: w, h: 24, oneWay: true,
               home: TOP, chain: chain || null,
               rate: 26, back: 44, max: 180, active: false };
    }

    function spiked(x, w) {
      return { x: x, y: TOP, w: w, h: 24, oneWay: true, spiked: true };
    }

    /* Gaps are 240, and 280 where you have to clear a spiked one. A
       double jump carries 288px spending the second jump at the apex,
       so everything here is inside comfortable reach. */
    var start = { x: -60, y: TOP, w: 300, h: 160 };
    var p1 = sinker(420, 220);
    var s1 = spiked(740, 120);
    var p2 = sinker(920, 220);
    var p3 = sinker(1380, 220, 'a');          // these two are chained
    var p4 = sinker(1840, 220, 'a');
    var s2 = spiked(2160, 120);
    var p5 = sinker(2340, 220);
    var p6 = sinker(2800, 220, 'b');          // and so are these
    var p7 = sinker(3260, 220, 'b');
    var end = { x: 3720, y: TOP, w: 360, h: 160 };

    return {
      name: 'Room Eight',
      worldW: 4080,
      start: { x: 60, y: TOP - SIZE },
      fallY: 640,

      solids: [start, p1, s1, p2, p3, p4, s2, p5, p6, p7, end],
      sinkers: [p1, p2, p3, p4, p5, p6, p7],

      /* the spiked caps sit on top of their platforms */
      hazards: [
        { x: s1.x, y: TOP - 24, w: s1.w, h: 24 },
        { x: s2.x, y: TOP - 24, w: s2.w, h: 24 }
      ],

      saws: [],
      waves: [],
      enemies: [],
      bombs: [],
      boss: null,
      pickups: [],
      door: { x: 3870, y: TOP - 130, w: 60, h: 130, needs: null },

      arrows: [],
      hints: []
    };
  }

  var BUILDERS = [buildTutorial, buildRoomOne, buildRoomTwo,
                  buildRoomThree, buildRoomFour, buildRoomFive,
                  buildRoomSix, buildRoomSeven, buildRoomEight];

  var GRAB_MAX = 2;              // seconds of being held before you die

  /* ============================================================
     STATE
     ============================================================ */
  var level = null;
  var levelIndex = 0;

  var p = {
    x: 0, y: 0, w: SIZE, h: SIZE,
    vx: 0, vy: 0,
    onGround: false, airJumps: 1,
    face: 1, rot: 0,
    atk: 0, cool: 0, swung: false,
    holding: null,
    dead: false, deadT: 0
  };

  var state = {
    name: 'HERO',
    running: false,
    coyote: 0,
    buffer: 0,
    picked: false,          // the room's pickup has been in your hands
    complete: false,
    grab: 0,               // how long the red cube has had hold of you
    flash: 0,
    saveT: 0,
    titleT: 0,              // room-name card countdown
    t: 0
  };

  var cam = { x: 0 };
  var particles = [];

  /* The last patch of solid ground you stood on. This is what gets
     saved, so Continue can never drop you into a pit or mid-air. */
  var safeSpot = { x: 0, y: 0 };

  /* ============================================================
     LOADING A ROOM
     ============================================================ */
  function loadLevel(i) {
    levelIndex = i;
    level = BUILDERS[i]();

    p.x = level.start.x;
    p.y = level.start.y;
    p.vx = 0; p.vy = 0;
    p.rot = 0;
    p.onGround = false;
    p.airJumps = 1;
    p.face = 1;
    p.atk = 0; p.cool = 0; p.swung = false;
    p.holding = null;
    p.dead = false; p.deadT = 0;

    state.picked = false;
    state.complete = false;
    state.grab = 0;
    state.coyote = 0;
    state.buffer = 0;
    state.saveT = 0;
    state.titleT = 2.4;
    state.t = 0;            // saws restart in the same place every attempt

    safeSpot.x = level.start.x;
    safeSpot.y = level.start.y;

    particles.length = 0;
    cam.x = Math.max(0, Math.min(level.worldW - W, p.x + p.w / 2 - W / 2));
  }

  /* No checkpoints: dying rewinds the whole room. */
  function respawn() {
    loadLevel(levelIndex);
  }

  /* ============================================================
     SAVE / CONTINUE
     Progress lives in localStorage so closing the tab doesn't cost
     you your run. (The passcode gate deliberately remembers
     nothing — that's separate, and stays that way.)
     ============================================================ */
  var SAVE_KEY = 'unnamed_save_v2';

  function readSave() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (!s || s.v !== 2) return null;
      if (typeof s.x !== 'number' || typeof s.y !== 'number') return null;
      if (typeof s.level !== 'number' || !BUILDERS[s.level]) return null;
      return s;
    } catch (e) {
      return null;
    }
  }

  function saveGame() {
    if (!state.running || !level) return;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        v: 2,
        name: state.name,
        level: levelIndex,
        x: safeSpot.x,
        y: safeSpot.y,
        picked: state.picked,
        barrierOpen: !!(level.barrier && level.barrier.open)
      }));
    } catch (e) {}
  }

  function clearSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  }

  /* ============================================================
     INPUT
     ============================================================ */
  var keys = {};
  var BLOCK = ['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];

  window.addEventListener('keydown', function (e) {
    if (BLOCK.indexOf(e.code) !== -1) e.preventDefault();
    if (!state.running) return;
    if (!keys[e.code]) press(e.code);
    keys[e.code] = true;
  });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });
  window.addEventListener('blur', function () { keys = {}; });

  function press(code) {
    if (p.dead || state.complete) return;
    if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW') state.buffer = BUFFER;
    if (code === 'KeyI') attack();
    if (code === 'KeyB') toggleCarry();
    if (code === 'KeyR') respawn();
  }

  function attack() {
    if (p.cool > 0) return;
    p.atk = ATK_TIME;
    p.cool = ATK_COOL;
    p.swung = false;
  }

  function toggleCarry() {
    if (p.holding) {
      var held = p.holding;
      held.x = p.x + p.w / 2 - held.w / 2 + p.face * 18;
      held.y = p.y;
      held.held = false;
      held.grounded = false;
      held.vy = 0;
      p.holding = null;

      /* let go of the blue bomb and it goes looking for the boss */
      if (held.kind === 'bomb' && level.boss && !level.boss.dead) {
        held.flying = true;
        burst(held.x + held.w / 2, held.y + held.h / 2, '#4ec3ff', 16);
      }
      return;
    }

    /* grab whichever loose thing is nearest */
    var best = null, bestD = 1e9;
    for (var i = 0; i < level.pickups.length; i++) {
      var c = level.pickups[i];
      if (c.hidden || c.held) continue;
      if (!near(p, c, 58)) continue;
      var d = Math.abs((p.x + p.w / 2) - (c.x + c.w / 2));
      if (d < bestD) { bestD = d; best = c; }
    }
    if (!best) return;

    best.held = true;
    p.holding = best;
    if (level.door.needs && best.kind === level.door.needs) state.picked = true;
    burst(best.x + best.w / 2, best.y + best.h / 2,
          best.kind === 'key' ? '#ffd166' : '#ff5f7e', 12);
    saveGame();
  }

  function near(a, b, d) {
    var ax = a.x + a.w / 2, ay = a.y + a.h / 2;
    var bx = b.x + b.w / 2, by = b.y + b.h / 2;
    return Math.abs(ax - bx) < d && Math.abs(ay - by) < d + 20;
  }

  /* ============================================================
     PHYSICS
     ============================================================ */
  function activeSolids() {
    if (level.barrier && !level.barrier.open) {
      return level.solids.concat([level.barrier]);
    }
    return level.solids;
  }

  function hits(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  /* Where a saw sits right now. It slides between (x0,y0) and (x1,y1),
     so the same thing does both the vertical blades in Room Two and the
     ones skating along platform tops in Room Four. Phase 0 is end one. */
  function sawPos(sw) {
    var u = (1 - Math.cos((state.t / sw.period + sw.phase) * Math.PI * 2)) / 2;
    return {
      x: sw.x0 + (sw.x1 - sw.x0) * u,
      y: sw.y0 + (sw.y1 - sw.y0) * u
    };
  }

  /* How far a bed of spikes is out of the floor right now, 0 to 1.
     They spend longer down than up, so there's always a way through. */
  function waveOut(wv) {
    var u = (1 - Math.cos((state.t / wv.period + wv.phase) * Math.PI * 2)) / 2;
    return Math.max(0, (u - 0.5) / 0.5);
  }

  function waveBox(wv) {
    var out = waveOut(wv);
    return { x: wv.x, y: GROUND - wv.h * out, w: wv.w, h: wv.h * out };
  }

  /* 0 while a bed is quiet, ramping to 1 over the last WAVE_TELL seconds
     before it fires. Spikes that appear with no notice aren't a test of
     anything — you want to see it coming and choose to move. */
  var WAVE_TELL = 0.7;

  function waveWarn(wv) {
    if (waveOut(wv) > 0) return 0;
    var th = ((state.t / wv.period + wv.phase) % 1) * Math.PI * 2;
    var window = Math.PI * 2 * WAVE_TELL / wv.period;
    var fires = Math.PI / 2;                 // where it starts coming up
    if (th >= fires - window && th < fires) return (th - (fires - window)) / window;
    return 0;
  }

  /* Saws are drawn round, so judge them round — squaring them off
     would kill you for near misses that visibly cleared the blade. */
  function circleHitsBox(cx, cy, r, b) {
    var nx = Math.max(b.x, Math.min(cx, b.x + b.w));
    var ny = Math.max(b.y, Math.min(cy, b.y + b.h));
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  /* The door only wants a key if the room says so. */
  function doorReady() {
    return !level.door.needs || state.picked;
  }

  function movePlayer(dt) {
    var list = activeSolids();
    var i, s;

    p.x += p.vx * dt;
    for (i = 0; i < list.length; i++) {
      s = list[i];
      if (s.oneWay) continue;                   // never blocks from the side
      if (!hits(p, s)) continue;
      if (p.vx > 0) p.x = s.x - p.w;
      else if (p.vx < 0) p.x = s.x + s.w;
      p.vx = 0;
    }

    var wasAir = !p.onGround;
    var prevBottom = p.y + p.h;
    p.onGround = false;
    p.y += p.vy * dt;
    for (i = 0; i < list.length; i++) {
      s = list[i];
      if (!hits(p, s)) continue;
      /* A one-way platform only exists when you're coming down onto it,
         so you can jump up through the underside and land on top. */
      if (s.oneWay && (p.vy <= 0 || prevBottom > s.y + 0.5)) continue;
      if (p.vy > 0) {
        p.y = s.y - p.h;
        if (wasAir && p.vy > 320) burst(p.x + p.w / 2, p.y + p.h, '#4ec3ff', 8, 0.5);
        p.onGround = true;
        p.airJumps = 1;
      } else if (p.vy < 0) {
        p.y = s.y + s.h;
      }
      p.vy = 0;
    }

    if (p.x < 0) { p.x = 0; p.vx = 0; }
    if (p.x + p.w > level.worldW) { p.x = level.worldW - p.w; p.vx = 0; }
  }

  function jump(isDouble) {
    p.vy = isDouble ? -JUMP_V2 : -JUMP_V;
    p.onGround = false;
    burst(p.x + p.w / 2, p.y + p.h,
          isDouble ? '#c7a0ff' : '#4ec3ff', isDouble ? 14 : 7, 0.6);
  }

  function die() {
    if (p.dead) return;
    p.dead = true;
    p.deadT = 0;
    state.flash = 1;
    burst(p.x + p.w / 2, p.y + p.h / 2, '#ff5f7e', 34, 1.4);
  }

  /* ============================================================
     SINKING PLATFORMS
     They sag while you stand on them and creep back up once you're
     off. Chained ones move as one, so stepping on either sinks both.
     The player rides whatever they're standing on.
     ============================================================ */
  function standingOn(s) {
    if (!p.onGround) return false;
    if (Math.abs((p.y + p.h) - s.y) > 2) return false;
    return p.x + p.w > s.x && p.x < s.x + s.w;
  }

  function updateSinkers(dt) {
    var list = level.sinkers;
    if (!list.length) return;
    var i, s;

    for (i = 0; i < list.length; i++) list[i].active = false;

    /* whatever you're on goes down, and so does anything sharing its chain */
    for (i = 0; i < list.length; i++) {
      if (!standingOn(list[i])) continue;
      list[i].active = true;
      if (list[i].chain) {
        for (var k = 0; k < list.length; k++) {
          if (list[k].chain === list[i].chain) list[k].active = true;
        }
      }
    }

    for (i = 0; i < list.length; i++) {
      s = list[i];
      var was = s.y;
      if (s.active) s.y = Math.min(s.home + s.max, s.y + s.rate * dt);
      else s.y = Math.max(s.home, s.y - s.back * dt);

      /* carry the player down with it rather than leaving them hovering */
      var moved = s.y - was;
      if (moved > 0 && standingOn({ x: s.x, y: was, w: s.w, h: s.h })) {
        p.y += moved;
      }
    }
  }

  /* ============================================================
     THE BOSS

     It floats, and it never comes down to your level except to crash.
     Attacks live in boss.moves, so two can run at once — a laser while
     the spikes roll, say. Every attack is survivable from somewhere:
     under a platform, on top of one, or simply elsewhere.
     ============================================================ */
  var CRASH_SPEED = 1500;

  function bossBox(b) { return { x: b.x, y: b.y, w: b.w, h: b.h }; }

  /* How far down a beam from `x` gets before something stops it. This is
     what makes hiding under a platform work, with no special cases. */
  function solidUnder(x, fromY) {
    var best = null;
    for (var i = 0; i < level.solids.length; i++) {
      var s = level.solids[i];
      if (x < s.x || x > s.x + s.w) continue;
      if (s.y < fromY) continue;
      if (!best || s.y < best.y) best = s;
    }
    return best;
  }

  function beamFloor(x, fromY) {
    var s = solidUnder(x, fromY);
    return s ? s.y : GROUND;
  }

  function startMove(b, kind) {
    var mv = { kind: kind, t: 0 };

    if (kind === 'laser') {
      /* it charges, then walks the beam across the whole arena */
      mv.dur = 5.4;
      mv.charge = 1.0;
      mv.dir = (b.x + b.w / 2) < level.worldW / 2 ? 1 : -1;
      mv.fromX = mv.dir > 0 ? 200 : level.worldW - 200 - b.w;
      mv.toX   = mv.dir > 0 ? level.worldW - 200 - b.w : 200;

    } else if (kind === 'crash') {
      /* three slams, each one wherever you happen to be standing */
      mv.dur = 6.6;
      mv.slams = 3;
      mv.done = 0;
      mv.sub = 'move';
      mv.subT = 0;

    } else if (kind === 'spikes') {
      /* it slams the floor and spikes erupt outward from the impact,
         and they stay up — the ground turns against you */
      mv.dur = 5.6;
      mv.sub = 'move';
      mv.subT = 0;
      mv.beds = null;
      mv.since = 0;
      mv.spread = 620;                  // a teeny bit slower

    } else if (kind === 'saws') {
      /* the blades gather around it first, then it throws them at you */
      mv.dur = 8.6;
      mv.orbit = 1.7;
      mv.gather = 0.5;
      mv.dir = Math.random() < 0.5 ? 1 : -1;
      mv.speed = 380;
      mv.gapY = 170 + Math.random() * 200;
      mv.gapH = 150;
      mv.from = mv.dir > 0 ? -90 : level.worldW + 90;
      mv.slots = [];
      for (var y = 470; y > 90; y -= 58) mv.slots.push(y);

    } else if (kind === 'bombs') {
      mv.dur = 5.2;
      mv.dropped = 0;
      mv.blueDropped = false;
    }
    b.moves.push(mv);
  }

  /* Which saw slots are solid blades (the gap is the way through). */
  function sawSlotBlocked(mv, y) {
    return !(y > mv.gapY - mv.gapH / 2 && y < mv.gapY + mv.gapH / 2);
  }

  /* Where a saw sits during the orbit phase. */
  function orbitSaw(b, mv, idx, count) {
    var a = state.t * 2.2 + (idx / count) * Math.PI * 2;
    var r = 74 + Math.sin(state.t * 3) * 8;
    return { x: b.x + b.w / 2 + Math.cos(a) * r,
             y: b.y + b.h / 2 + Math.sin(a) * r * 0.62 };
  }

  /* How far a bed of the spike eruption is out, 0..1. Beds stay up once
     they've risen — they only go down when the attack ends. */
  function bedOut(mv, bed) {
    if (!mv.beds) return 0;
    var age = mv.since - bed.upAt;
    if (age <= 0) return 0;
    var rise = Math.min(1, age / 0.18);
    var left = mv.dur - mv.t;
    if (left < 0.6) rise *= Math.max(0, left / 0.6);
    return rise;
  }

  /* A bed about to erupt shows a nub first. */
  function bedWarn(mv, bed) {
    if (!mv.beds) return 0;
    var age = mv.since - bed.upAt;
    if (age > 0 || age < -0.4) return 0;
    return 1 - (-age / 0.4);
  }

  /* Spikes run along whatever it landed on. Slam the floor and they
     cross the floor; slam a platform and they only cover that platform. */
  function eruptFrom(mv, originX, surf) {
    mv.beds = [];
    mv.since = 0;
    mv.surfY = surf ? surf.y : GROUND;

    var from = surf ? surf.x : -60;
    var to   = surf ? surf.x + surf.w : level.worldW + 60;
    var BED = 110;
    for (var x = from; x < to - 18; x += BED) {
      var w = Math.min(BED, to - x);
      mv.beds.push({ x: x, w: w,
                     upAt: Math.abs(x + w / 2 - originX) / mv.spread });
    }
  }

  /* 33% of the time it drops bombs. Otherwise an attack, and sometimes
     a second one on top of it. Crash never doubles up — it moves the
     boss, and stacking it reads as unfair rather than hard. */
  function chooseAttack(b) {
    if (Math.random() < 0.33) { startMove(b, 'bombs'); return; }

    var pool = ['laser', 'crash', 'spikes', 'saws'];
    var first = pool[Math.floor(Math.random() * pool.length)];
    startMove(b, first);

    if (first !== 'crash' && Math.random() < 0.3) {
      var others = [];
      for (var i = 0; i < pool.length; i++) {
        if (pool[i] !== first && pool[i] !== 'crash') others.push(pool[i]);
      }
      startMove(b, others[Math.floor(Math.random() * others.length)]);
    }
  }

  function spawnBomb(x, blue) {
    if (blue) {
      var bb = level.pickups[0];
      bb.hidden = false;
      bb.held = false;
      bb.flying = false;
      bb.grounded = false;
      bb.vy = 0;
      bb.x = x;
      bb.y = 130;
      bb.home = { x: x, y: GROUND - bb.h };
      return;
    }
    level.bombs.push({
      x: x, y: 130, w: 24, h: 24,
      vy: 0, grounded: false,
      fuse: 1.7, blast: 0
    });
  }

  function hurtBoss(b) {
    b.hp--;
    b.flash = 0.4;
    burst(b.x + b.w / 2, b.y + b.h / 2, '#4ec3ff', 40, 1.5);
    if (b.hp <= 0) {
      b.dead = true;
      b.moves.length = 0;
      burst(b.x + b.w / 2, b.y + b.h / 2, '#ffd166', 70, 2.2);
      dropKey(b);
    }
  }

  function runMove(b, mv, dt) {
    var i, y;

    if (mv.kind === 'laser') {
      if (mv.t < mv.charge) {
        /* slide to the starting side while it winds up */
        b.x += (mv.fromX - b.x) * Math.min(1, dt * 4);
        b.y += (b.hover - b.y) * Math.min(1, dt * 4);
      } else {
        var k = Math.min(1, (mv.t - mv.charge) / (mv.dur - mv.charge));
        b.x = mv.fromX + (mv.toX - mv.fromX) * k;
        var bx = b.x + b.w / 2;
        var stop = beamFloor(bx, b.y + b.h);
        var beam = { x: bx - 17, y: b.y + b.h, w: 34, h: stop - (b.y + b.h) };
        if (beam.h > 0 && hits(p, beam)) { die(); return; }
      }

    } else if (mv.kind === 'crash') {
      mv.subT += dt;

      if (mv.sub === 'move') {
        b.x += ((p.x + p.w / 2 - b.w / 2) - b.x) * Math.min(1, dt * 6);
        b.y += (70 - b.y) * Math.min(1, dt * 6);
        if (mv.subT > 0.5) { mv.sub = 'hang'; mv.subT = 0; }

      } else if (mv.sub === 'hang') {
        if (mv.subT > 0.3) { mv.sub = 'drop'; mv.subT = 0; }

      } else if (mv.sub === 'drop') {
        b.y += CRASH_SPEED * dt;
        var floorY = beamFloor(b.x + b.w / 2, b.y);
        if (hits(p, bossBox(b))) { die(); return; }
        if (b.y + b.h >= floorY) {
          /* it lands, and that's all it does — no shockwave. Getting
             out from under it is the whole answer. */
          b.y = floorY - b.h;
          burst(b.x + b.w / 2, floorY, '#ff5f7e', 26, 1.1);
          state.flash = 0.3;
          mv.done++;
          mv.sub = mv.done >= mv.slams ? 'over' : 'recover';
          mv.subT = 0;
        }

      } else if (mv.sub === 'recover') {
        b.y += (b.hover + 40 - b.y) * Math.min(1, dt * 5);
        if (mv.subT > 0.5) { mv.sub = 'move'; mv.subT = 0; }

      } else {
        b.y += (b.hover - b.y) * Math.min(1, dt * 3);
      }

    } else if (mv.kind === 'spikes') {
      mv.subT += dt;

      if (mv.sub === 'move') {
        b.x += ((p.x + p.w / 2 - b.w / 2) - b.x) * Math.min(1, dt * 5);
        b.y += (80 - b.y) * Math.min(1, dt * 5);
        if (mv.subT > 0.6) { mv.sub = 'hang'; mv.subT = 0; }

      } else if (mv.sub === 'hang') {
        if (mv.subT > 0.35) { mv.sub = 'drop'; mv.subT = 0; }

      } else if (mv.sub === 'drop') {
        var surf = solidUnder(b.x + b.w / 2, b.y);
        var landY = surf ? surf.y : GROUND;
        b.y += CRASH_SPEED * dt;
        if (hits(p, bossBox(b))) { die(); return; }
        if (b.y + b.h >= landY) {
          b.y = landY - b.h;
          mv.sub = 'erupt';
          mv.subT = 0;
          eruptFrom(mv, b.x + b.w / 2, surf);
          burst(b.x + b.w / 2, landY, '#ff5f7e', 50, 1.9);
          state.flash = 0.6;
        }

      } else {
        mv.since += dt;
        if (mv.subT > 0.9) b.y += (b.hover - b.y) * Math.min(1, dt * 2.5);
        for (i = 0; i < mv.beds.length; i++) {
          var bd = mv.beds[i];
          var out = bedOut(mv, bd);
          if (out <= 0.05) continue;
          var hz = { x: bd.x, y: mv.surfY - 44 * out, w: bd.w, h: 44 * out };
          if (hits(p, hz)) { die(); return; }
        }
      }

    } else if (mv.kind === 'saws') {
      if (mv.t < mv.orbit) {
        /* circling the boss — a warning, not yet a weapon */
        mv.colX = null;

      } else if (mv.t < mv.orbit + mv.gather) {
        mv.colX = null;
        mv.gathering = (mv.t - mv.orbit) / mv.gather;

      } else {
        mv.colX = mv.from + mv.dir * mv.speed * (mv.t - mv.orbit - mv.gather);
        for (i = 0; i < mv.slots.length; i++) {
          y = mv.slots[i];
          if (!sawSlotBlocked(mv, y)) continue;
          if (circleHitsBox(mv.colX, y, 24, p)) { die(); return; }
        }
      }

    } else if (mv.kind === 'bombs') {
      var want = Math.floor(mv.t / 0.55);
      while (mv.dropped < want && mv.dropped < 6) {
        spawnBomb(220 + Math.random() * (level.worldW - 600), false);
        mv.dropped++;
      }
      if (!mv.blueDropped && mv.t > 1.0) {
        mv.blueDropped = true;
        spawnBomb(260 + Math.random() * (level.worldW - 700), true);
      }
    }
  }

  function updateBoss(dt) {
    var b = level.boss;
    if (!b) return;
    if (b.flash > 0) b.flash -= dt;
    if (b.dead) {
      b.y += (b.hover - 40 - b.y) * Math.min(1, dt * 2);
      return;
    }

    for (var i = b.moves.length - 1; i >= 0; i--) {
      var mv = b.moves[i];
      mv.t += dt;
      runMove(b, mv, dt);
      if (p.dead) return;
      if (mv.t >= mv.dur) b.moves.splice(i, 1);
    }

    /* between attacks it drifts, so it's never a stationary target */
    if (b.moves.length === 0) {
      b.y += (b.hover - b.y) * Math.min(1, dt * 3);
      b.x += b.vx * dt;
      if (b.x < 240) { b.x = 240; b.vx = Math.abs(b.vx); }
      if (b.x + b.w > level.worldW - 240) {
        b.x = level.worldW - 240 - b.w;
        b.vx = -Math.abs(b.vx);
      }
      b.idle += dt;
      if (b.idle >= b.rest) { b.idle = 0; chooseAttack(b); }
    }
  }

  /* Red bombs fall, sit, then go off. Being near one when it does is
     the whole danger; the blue one is the opportunity. */
  function updateBombs(dt) {
    for (var i = level.bombs.length - 1; i >= 0; i--) {
      var bo = level.bombs[i];

      if (bo.blast > 0) {
        bo.blast -= dt;
        if (circleHitsBox(bo.x + bo.w / 2, bo.y + bo.h / 2, 74, p)) { die(); return; }
        if (bo.blast <= 0) level.bombs.splice(i, 1);
        continue;
      }

      if (!bo.grounded) {
        bo.vy += GRAVITY * dt;
        var wasB = bo.y + bo.h;
        bo.y += bo.vy * dt;
        var nowB = bo.y + bo.h;
        for (var k = 0; k < level.solids.length; k++) {
          var s = level.solids[k];
          if (bo.x + bo.w <= s.x || bo.x >= s.x + s.w) continue;
          if (wasB <= s.y && nowB >= s.y) {
            bo.y = s.y - bo.h; bo.vy = 0; bo.grounded = true; break;
          }
        }
        if (bo.y > level.fallY) { level.bombs.splice(i, 1); continue; }
      }

      bo.fuse -= dt;
      if (bo.fuse <= 0) {
        bo.blast = 0.3;
        burst(bo.x + bo.w / 2, bo.y + bo.h / 2, '#ff5f7e', 44, 1.8);
        state.flash = Math.max(state.flash, 0.35);
      }
    }
  }

  /* ============================================================
     PARTICLES
     ============================================================ */
  function burst(x, y, color, n, power) {
    power = power || 1;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = (60 + Math.random() * 190) * power;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 60 * power,
        life: 0.35 + Math.random() * 0.45,
        max: 0.8,
        size: 2 + Math.random() * 3,
        color: color
      });
    }
  }

  /* ============================================================
     UPDATE
     ============================================================ */
  function update(dt) {
    state.t += dt;
    if (state.flash > 0) state.flash = Math.max(0, state.flash - dt * 2.5);
    if (state.titleT > 0) state.titleT = Math.max(0, state.titleT - dt);

    var i;
    for (i = particles.length - 1; i >= 0; i--) {
      var q = particles[i];
      q.life -= dt;
      if (q.life <= 0) { particles.splice(i, 1); continue; }
      q.vy += 900 * dt;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
    }

    var sc = level.scarecrow;
    if (sc) {
      if (sc.flash > 0) sc.flash -= dt;
      if (sc.shake > 0) sc.shake -= dt;
      if (sc.hp <= 0) {
        sc.regen -= dt;
        if (sc.regen <= 0) {
          sc.hp = sc.maxHp;
          burst(sc.x + sc.w / 2, sc.y + sc.h / 2, '#f9c74f', 16);
        }
      }
    }

    if (p.dead) {
      p.deadT += dt;
      if (p.deadT > 0.7) respawn();
      return;
    }

    if (state.complete) return;

    /* --- horizontal --- */
    var want = 0;
    if (keys.ArrowLeft || keys.KeyA) want -= 1;
    if (keys.ArrowRight || keys.KeyD) want += 1;
    if (want !== 0) {
      p.vx += want * ACCEL * dt;
      if (p.vx > MOVE_SPD) p.vx = MOVE_SPD;
      if (p.vx < -MOVE_SPD) p.vx = -MOVE_SPD;
      p.face = want;
    } else {
      if (p.vx > 0) p.vx = Math.max(0, p.vx - FRICTION * dt);
      else if (p.vx < 0) p.vx = Math.min(0, p.vx + FRICTION * dt);
    }

    /* --- jumping: coyote time + input buffer so it feels fair --- */
    if (p.onGround) state.coyote = COYOTE;
    else state.coyote = Math.max(0, state.coyote - dt);
    state.buffer = Math.max(0, state.buffer - dt);

    if (state.buffer > 0) {
      if (p.onGround || state.coyote > 0) {
        jump(false);
        p.airJumps = 1;
        state.coyote = 0;
        state.buffer = 0;
      } else if (p.airJumps > 0) {
        p.airJumps--;
        jump(true);
        state.buffer = 0;
      }
    }

    // short hop: release jump early and you rise less
    if (p.vy < 0 && !(keys.Space || keys.ArrowUp || keys.KeyW)) p.vy += GRAVITY * 0.9 * dt;

    p.vy += GRAVITY * dt;
    if (p.vy > MAX_FALL) p.vy = MAX_FALL;

    movePlayer(dt);

    updateSinkers(dt);

    /* --- remember safe ground, and checkpoint the save --- */
    if (p.onGround) { safeSpot.x = p.x; safeSpot.y = p.y; }
    state.saveT += dt;
    if (state.saveT > 2) { state.saveT = 0; saveGame(); }

    /* --- cube roll, Geometry Dash style --- */
    if (!p.onGround) p.rot += dt * 7.5 * (p.vx >= 0 ? 1 : -1);
    else p.rot += (0 - p.rot) * Math.min(1, dt * 14);

    /* --- attack --- */
    if (p.cool > 0) p.cool -= dt;
    if (p.atk > 0) {
      p.atk -= dt;
      if (!p.swung) {
        /* The swing covers your own body as well as the space in front,
           so something clamped onto you can always be hit off. */
        var hb = { x: p.face > 0 ? p.x : p.x - 34,
                   y: p.y - 2, w: p.w + 34, h: p.h + 4 };
        hitEnemies(hb);
        if (sc && sc.hp > 0 && hits(hb, sc)) {
          sc.hp--;
          sc.flash = 0.16;
          sc.shake = 0.28;
          burst(sc.x + sc.w / 2, sc.y + 30, '#f9c74f', 14);
          if (sc.hp <= 0) {
            sc.regen = 2.6;
            burst(sc.x + sc.w / 2, sc.y + 40, '#ffd166', 26, 1.3);
            if (!sc.everBroken) {
              sc.everBroken = true;
              if (level.barrier) {
                level.barrier.open = true;
                burst(level.barrier.x + 13, level.barrier.y + 160, '#4ec3ff', 40, 1.6);
              }
              saveGame();
            }
          }
        }
        p.swung = true;
      }
    }

    /* --- the boss and its bombs --- */
    updateBoss(dt);
    if (p.dead) return;
    updateBombs(dt);
    if (p.dead) return;

    /* --- carried and dropped things --- */
    for (var pi = 0; pi < level.pickups.length; pi++) {
      var item = level.pickups[pi];
      if (item.hidden) continue;

      /* a thrown blue bomb makes its own way to the boss */
      if (item.flying) {
        var bs = level.boss;
        if (!bs || bs.dead) { item.hidden = false; item.flying = false; continue; }
        var tx = bs.x + bs.w / 2, ty = bs.y + bs.h / 2;
        var dx = tx - (item.x + item.w / 2), dy = ty - (item.y + item.h / 2);
        var dist = Math.sqrt(dx * dx + dy * dy) || 1;
        item.x += (dx / dist) * 640 * dt;
        item.y += (dy / dist) * 640 * dt;
        if (dist < 46) {
          item.flying = false;
          item.hidden = true;
          hurtBoss(bs);
        }
        continue;
      }

      if (item.held) {
        item.x = p.x + p.w / 2 - item.w / 2;
        item.y = p.y - item.h - 8;
      } else if (item.grounded === false) {
        item.vy += GRAVITY * dt;
        var wasBottom = item.y + item.h;
        item.y += item.vy * dt;
        var nowBottom = item.y + item.h;

        /* Sweep the fall rather than testing the item's current spot:
           a key that spawns already overlapping the floor would never
           find it otherwise, and drops straight through the world. */
        if (item.vy > 0) {
          for (var k = 0; k < level.solids.length; k++) {
            var so = level.solids[k];
            if (item.x + item.w <= so.x || item.x >= so.x + so.w) continue;
            if (wasBottom <= so.y && nowBottom >= so.y) {
              item.y = so.y - item.h;
              item.vy = 0;
              item.grounded = true;
              break;
            }
          }
        }
        /* last resort: if it somehow escapes, put it back where it fell */
        if (item.y > level.fallY) {
          item.x = item.home.x;
          item.y = item.home.y;
          item.vy = 0;
          item.grounded = true;
        }
      }
    }

    /* --- the green fellow, and his apples --- */
    var npc = level.npc;
    if (npc && !npc.said && Math.abs((p.x + p.w / 2) - (npc.x + npc.w / 2)) < 190) {
      npc.said = true;
      npc.t = 0;
    }
    if (npc && npc.said) {
      var before = npc.t;
      npc.t += dt;
      if (before < 1.1 && npc.t >= 1.1) {       // the apples arrive
        for (i = 0; i < level.pickups.length; i++) {
          level.pickups[i].hidden = false;
          level.pickups[i].grounded = false;
        }
      }
    }

    /* --- hazards --- */
    for (i = 0; i < level.hazards.length; i++) {
      if (hits(p, level.hazards[i])) { die(); return; }
    }
    for (i = 0; i < level.waves.length; i++) {
      var wb = waveBox(level.waves[i]);
      if (wb.h > 2 && hits(p, wb)) { die(); return; }
    }
    for (i = 0; i < level.saws.length; i++) {
      var sw = level.saws[i];
      /* Saws are for you only — the reds share their platforms with one
         and must never be cut by it. */
      var at = sawPos(sw);
      if (circleHitsBox(at.x, at.y, sw.r - 4, p)) { die(); return; }
    }

    /* --- the red cube's grip: two seconds of contact and you're gone.
           Break away and the meter bleeds back down, slowly. --- */
    updateEnemies(dt);
    if (touchingAnyEnemy()) state.grab += dt;
    else state.grab = Math.max(0, state.grab - dt * 0.6);
    if (state.grab >= GRAB_MAX) { die(); return; }

    if (p.y > level.fallY) { die(); return; }

    /* --- the door out --- */
    if (doorReady() && hits(p, level.door)) {
      state.complete = true;
      burst(level.door.x + level.door.w / 2, level.door.y + 70, '#4ec3ff', 50, 1.8);
      saveGame();
      finishLevel();
      return;
    }

    /* --- camera --- */
    var target = p.x + p.w / 2 - W / 2;
    if (target < 0) target = 0;
    if (target > level.worldW - W) target = level.worldW - W;
    cam.x += (target - cam.x) * Math.min(1, dt * 9);
  }

  /* ============================================================
     THE RED CUBE
     Walks the arena, comes at you, and hangs on. It can't leave its
     platform, so there's always somewhere to back off to.
     ============================================================ */
  /* Is there floor just past the cube's toes? */
  function groundAhead(e) {
    var probe = {
      x: e.face > 0 ? e.x + e.w + 2 : e.x - 10,
      y: e.y + e.h + 2, w: 8, h: 10
    };
    for (var i = 0; i < level.solids.length; i++) {
      if (hits(probe, level.solids[i])) return true;
    }
    return false;
  }

  /* Anything at all to land on below? */
  function groundBelow(e) {
    var probe = { x: e.x, y: e.y + e.h, w: e.w, h: 240 };
    for (var i = 0; i < level.solids.length; i++) {
      if (hits(probe, level.solids[i])) return true;
    }
    return false;
  }

  function updateEnemies(dt) {
    for (var n = 0; n < level.enemies.length; n++) updateEnemy(level.enemies[n], dt);
  }

  function allDead() {
    for (var n = 0; n < level.enemies.length; n++) {
      if (!level.enemies[n].dead) return false;
    }
    return true;
  }

  function touchingAnyEnemy() {
    for (var n = 0; n < level.enemies.length; n++) {
      var e = level.enemies[n];
      if (!e.dead && hits(p, e)) return true;
    }
    return false;
  }

  function updateEnemy(e, dt) {
    if (e.dead) return;

    if (e.flash > 0) e.flash -= dt;

    var toward = (p.x + p.w / 2) - (e.x + e.w / 2);

    /* knockback carries it for a moment, then it comes for you again */
    if (e.knock > 0) {
      e.knock -= dt;
      e.vx -= e.vx * Math.min(1, dt * 3.5);
    } else {
      e.face = toward < 0 ? -1 : 1;
      e.vx = e.face * e.speed;
    }

    var i, s;
    e.x += e.vx * dt;

    var blocked = false;
    for (i = 0; i < level.solids.length; i++) {
      s = level.solids[i];
      if (s.oneWay) continue;
      if (!hits(e, s)) continue;
      if (e.vx > 0) e.x = s.x - e.w;
      else if (e.vx < 0) e.x = s.x + s.w;
      e.vx = 0;
      blocked = true;
    }

    e.vy += GRAVITY * dt;
    if (e.vy > MAX_FALL) e.vy = MAX_FALL;
    var ePrevBottom = e.y + e.h;
    e.y += e.vy * dt;

    e.onGround = false;
    for (i = 0; i < level.solids.length; i++) {
      s = level.solids[i];
      if (!hits(e, s)) continue;
      if (s.oneWay && (e.vy <= 0 || ePrevBottom > s.y + 0.5)) continue;
      if (e.vy > 0) { e.y = s.y - e.h; e.onGround = true; e.airJumps = 1; }
      else if (e.vy < 0) { e.y = s.y + s.h; }
      e.vy = 0;
    }

    /* --- when to jump ---
       Off the ground it jumps at a wall, at a ledge it needs to clear,
       or when you're above it. In the air it spends its second jump the
       moment it's falling with nothing underneath — which is what gets
       it across a 240px gap, same as it would for you. */
    if (e.knock <= 0) {
      if (e.onGround) {
        var wants = blocked ||
                    (p.y + p.h < e.y - 12) ||
                    !groundAhead(e);
        if (wants && Math.abs(toward) > 6) {
          e.vy = -JUMP_V;
          e.onGround = false;
          e.airJumps = 1;
        }
      } else if (e.airJumps > 0 && e.vy > 150 && !groundBelow(e)) {
        e.vy = -JUMP_V2;
        e.airJumps--;
      }
    }

    /* if it ever falls out of the world, put it back — otherwise the
       key never drops and the room can't be finished */
    if (e.y > level.fallY) {
      e.x = e.spawn.x;
      e.y = e.spawn.y;
      e.vx = 0; e.vy = 0;
      e.knock = 0;
    }
  }

  /* Three hits each, and the key only comes when every one is down. */
  function hitEnemies(hb) {
    for (var n = 0; n < level.enemies.length; n++) {
      var e = level.enemies[n];
      if (e.dead || !hits(hb, e)) continue;

      e.hp--;
      e.flash = 0.18;
      e.vx = p.face * 300;             // knocked back, so one swing isn't three
      e.vy = -260;
      e.knock = 0.35;
      burst(e.x + e.w / 2, e.y + e.h / 2, '#ff5f7e', 16);

      if (e.hp <= 0) {
        e.dead = true;
        burst(e.x + e.w / 2, e.y + e.h / 2, '#ff5f7e', 40, 1.5);
        if (allDead()) dropKey(e);
      }
    }
  }

  /* The key either falls where the last one died, or appears at a fixed
     spot the room picked out — up on the top platform, say. */
  function dropKey(e) {
    var it = null;
    for (var i = 0; i < level.pickups.length; i++) {
      if (level.pickups[i].kind === level.door.needs) { it = level.pickups[i]; break; }
    }
    if (!it) return;
    it.hidden = false;
    it.held = false;

    if (it.spawnAt) {
      it.x = it.spawnAt.x;
      it.y = it.spawnAt.y;
      it.vy = 0;
      it.grounded = true;
    } else {
      it.x = e.x + e.w / 2 - it.w / 2;
      it.y = e.y + e.h - it.h;         // flush with its feet, not its head
      it.vy = -200;
      it.grounded = false;
    }
    it.home = { x: it.x, y: it.y };
    burst(it.x + it.w / 2, it.y, '#ffd166', 22, 1.2);
  }

  /* ============================================================
     DRAW
     ============================================================ */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackground() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#131a3d');
    g.addColorStop(1, '#05070f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.strokeStyle = 'rgba(78,195,255,0.07)';
    ctx.lineWidth = 1;
    var off = (cam.x * 0.35) % 60;
    var x, y;
    for (x = -off; x < W; x += 60) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (y = 0; y < H; y += 60) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.16;
    for (var i = 0; i < 6; i++) {
      var span = W + 300;
      var bx = ((i * 430 - cam.x * 0.18) % span + span) % span - 150;
      var by = 70 + (i % 3) * 120 + Math.sin(state.t * 0.6 + i) * 10;
      ctx.fillStyle = i % 2 ? '#4e7fff' : '#c7a0ff';
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(state.t * 0.25 + i);
      ctx.fillRect(-22, -22, 44, 44);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawSolid(s) {
    /* a sinking platform hangs from a chain, and the chain pays out as
       it drops — chained pairs share a colour so you can see the link */
    if (s.home !== undefined) {
      var tone = s.chain === 'a' ? '#ffd166' : s.chain === 'b' ? '#7bffb2' : '#5c6579';
      ctx.save();
      ctx.strokeStyle = tone;
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = 3;
      ctx.setLineDash([7, 7]);
      ctx.beginPath();
      ctx.moveTo(s.x + 18, 0);
      ctx.lineTo(s.x + 18, s.y);
      ctx.moveTo(s.x + s.w - 18, 0);
      ctx.lineTo(s.x + s.w - 18, s.y);
      ctx.stroke();
      ctx.restore();

      if (s.chain) {                            // a tag at each end of a pair
        ctx.save();
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = tone;
        ctx.fillRect(s.x + 8, s.y - 7, 14, 5);
        ctx.fillRect(s.x + s.w - 22, s.y - 7, 14, 5);
        ctx.restore();
      }
    }

    /* spiked caps get their teeth drawn on top */
    if (s.spiked) {
      ctx.fillStyle = '#ff5f7e';
      ctx.shadowColor = '#ff5f7e';
      ctx.shadowBlur = 14;
      for (var sx = s.x; sx < s.x + s.w - 1; sx += s.w / 4) {
        ctx.beginPath();
        ctx.moveTo(sx, s.y);
        ctx.lineTo(sx + s.w / 8, s.y - 24);
        ctx.lineTo(sx + s.w / 4, s.y);
        ctx.closePath();
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }

    ctx.fillStyle = '#16224d';
    ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = 'rgba(78,195,255,0.10)';
    ctx.fillRect(s.x, s.y, s.w, Math.min(10, s.h));
    ctx.fillStyle = '#4ec3ff';
    ctx.shadowColor = '#4ec3ff';
    ctx.shadowBlur = 14;
    ctx.fillRect(s.x, s.y - 3, s.w, 5);
    ctx.shadowBlur = 0;
  }

  function drawHazard(hz) {
    ctx.fillStyle = '#ff5f7e';
    ctx.shadowColor = '#ff5f7e';
    ctx.shadowBlur = 16;
    var step = 34;
    var n = Math.max(1, Math.floor(hz.w / step));
    var wide = hz.w / n;
    for (var i = 0; i < n; i++) {
      var x = hz.x + i * wide;
      ctx.beginPath();
      ctx.moveTo(x, hz.y + hz.h);
      ctx.lineTo(x + wide / 2, hz.y);
      ctx.lineTo(x + wide, hz.y + hz.h);
      ctx.closePath();
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function drawArrows() {
    var marks = level.arrows;
    if (!marks || !marks.length) return;
    var pulse = 0.55 + Math.sin(state.t * 4) * 0.35;
    for (var i = 0; i < marks.length; i++) {
      ctx.save();
      ctx.globalAlpha = pulse * (i === marks.length - 1 ? 1 : 0.7);
      ctx.strokeStyle = '#c7a0ff';
      ctx.shadowColor = '#c7a0ff';
      ctx.shadowBlur = 14;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(marks[i][0] - 18, marks[i][1] + 16);
      ctx.lineTo(marks[i][0], marks[i][1] - 8);
      ctx.lineTo(marks[i][0] + 18, marks[i][1] + 16);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawWaves() {
    for (var i = 0; i < level.waves.length; i++) {
      var wv = level.waves[i];
      var out = waveOut(wv);

      /* the slot they come out of, so you can see where they'll be */
      ctx.fillStyle = 'rgba(255,95,126,0.10)';
      ctx.fillRect(wv.x, GROUND - 4, wv.w, 4);

      /* the tell: the slot lights up and little nubs peek out just
         before this bed fires */
      var warn = waveWarn(wv);
      if (warn > 0) {
        var flash = 0.35 + 0.65 * warn * (0.6 + 0.4 * Math.sin(state.t * 22));
        ctx.save();
        ctx.globalAlpha = flash;
        ctx.fillStyle = '#ffd166';
        ctx.shadowColor = '#ffd166';
        ctx.shadowBlur = 12;
        ctx.fillRect(wv.x + 2, GROUND - 5, wv.w - 4, 5);
        var nub = 3 + warn * 5;
        for (var t = 0; t < 3; t++) {
          var nx = wv.x + (t + 0.5) * (wv.w / 3);
          ctx.beginPath();
          ctx.moveTo(nx - 7, GROUND);
          ctx.lineTo(nx, GROUND - nub);
          ctx.lineTo(nx + 7, GROUND);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      if (out <= 0.02) continue;

      var h = wv.h * out;
      ctx.fillStyle = '#ff5f7e';
      ctx.shadowColor = '#ff5f7e';
      ctx.shadowBlur = 14;
      var n = 3;
      var each = wv.w / n;
      for (var k = 0; k < n; k++) {
        var x = wv.x + k * each;
        ctx.beginPath();
        ctx.moveTo(x, GROUND);
        ctx.lineTo(x + each / 2, GROUND - h);
        ctx.lineTo(x + each, GROUND);
        ctx.closePath();
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }
  }

  function drawBoss() {
    var b = level.boss;
    if (!b) return;

    /* attack telegraphs and live danger, drawn behind the boss */
    for (var i = 0; i < b.moves.length; i++) {
      var mv = b.moves[i];

      if (mv.kind === 'laser') {
        var bx = b.x + b.w / 2;
        var stop = beamFloor(bx, b.y + b.h);
        if (mv.t < mv.charge) {
          var chg = mv.t / mv.charge;
          ctx.save();
          ctx.globalAlpha = 0.25 + 0.5 * chg;
          ctx.strokeStyle = '#ffd166';
          ctx.setLineDash([9, 9]);
          ctx.lineWidth = 2 + chg * 4;
          ctx.beginPath();
          ctx.moveTo(bx, b.y + b.h);
          ctx.lineTo(bx, stop);
          ctx.stroke();
          ctx.restore();
        } else {
          var pulse = 0.75 + Math.sin(state.t * 40) * 0.25;
          ctx.save();
          ctx.globalAlpha = pulse;
          ctx.fillStyle = '#ff2d55';
          ctx.shadowColor = '#ff2d55';
          ctx.shadowBlur = 30;
          ctx.fillRect(bx - 17, b.y + b.h, 34, stop - (b.y + b.h));
          ctx.fillStyle = '#fff';
          ctx.fillRect(bx - 6, b.y + b.h, 12, stop - (b.y + b.h));
          ctx.restore();
          ctx.fillStyle = 'rgba(255,45,85,0.5)';       // scorch where it lands
          ctx.fillRect(bx - 26, stop - 5, 52, 5);
        }

      } else if (mv.kind === 'crash') {
        if (mv.sub === 'hang') {
          var down = beamFloor(b.x + b.w / 2, b.y);
          ctx.save();
          ctx.globalAlpha = 0.3 + 0.4 * Math.sin(state.t * 30);
          ctx.fillStyle = '#ffd166';
          ctx.fillRect(b.x, b.y + b.h, b.w, down - (b.y + b.h));
          ctx.restore();
        }

      } else if (mv.kind === 'spikes') {
        if (mv.sub === 'hang') {
          ctx.save();
          ctx.globalAlpha = 0.35 + 0.4 * Math.sin(state.t * 30);
          ctx.fillStyle = '#ffd166';
          ctx.fillRect(b.x, b.y + b.h, b.w,
                       beamFloor(b.x + b.w / 2, b.y) - (b.y + b.h));
          ctx.restore();
        }
        if (mv.beds) {
          for (var q = 0; q < mv.beds.length; q++) {
            var bd = mv.beds[q];
            var warn = bedWarn(mv, bd);
            if (warn > 0) {
              ctx.save();
              ctx.globalAlpha = warn;
              ctx.fillStyle = '#ffd166';
              ctx.fillRect(bd.x + 2, mv.surfY - 5, bd.w - 4, 5);
              ctx.restore();
            }
            var out = bedOut(mv, bd);
            if (out <= 0.02) continue;
            var hgt = 44 * out;
            ctx.fillStyle = '#ff2d55';
            ctx.shadowColor = '#ff2d55';
            ctx.shadowBlur = 14;
            for (var sx = bd.x; sx < bd.x + bd.w - 1; sx += bd.w / 3) {
              ctx.beginPath();
              ctx.moveTo(sx, mv.surfY);
              ctx.lineTo(sx + bd.w / 6, mv.surfY - hgt);
              ctx.lineTo(sx + bd.w / 3, mv.surfY);
              ctx.closePath();
              ctx.fill();
            }
            ctx.shadowBlur = 0;
          }
        }

      } else if (mv.kind === 'saws') {
        var blades = [];
        if (mv.colX === null) {
          /* orbiting, or streaking out to the edge */
          var live = [];
          for (var s = 0; s < mv.slots.length; s++) {
            if (sawSlotBlocked(mv, mv.slots[s])) live.push(mv.slots[s]);
          }
          for (var s = 0; s < live.length; s++) {
            var o = orbitSaw(b, mv, s, live.length);
            if (mv.gathering !== undefined && mv.t >= mv.orbit) {
              var g = mv.gathering;
              blades.push({ x: o.x + (mv.from - o.x) * g,
                            y: o.y + (live[s] - o.y) * g });
            } else {
              blades.push(o);
            }
          }
        } else {
          for (var s = 0; s < mv.slots.length; s++) {
            if (!sawSlotBlocked(mv, mv.slots[s])) continue;
            blades.push({ x: mv.colX, y: mv.slots[s] });
          }
        }
        for (var s = 0; s < blades.length; s++) {
          ctx.save();
          ctx.translate(blades[s].x, blades[s].y);
          ctx.rotate(state.t * 9);
          ctx.fillStyle = '#ff2d55';
          ctx.shadowColor = '#ff2d55';
          ctx.shadowBlur = 14;
          ctx.beginPath();
          for (var k = 0; k < 10; k++) {
            var a0 = (k / 10) * Math.PI * 2;
            var a1 = ((k + 0.5) / 10) * Math.PI * 2;
            ctx.lineTo(Math.cos(a0) * 24, Math.sin(a0) * 24);
            ctx.lineTo(Math.cos(a1) * 16, Math.sin(a1) * 16);
          }
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }
    }

    /* the thing itself */
    ctx.save();
    ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
    var float = Math.sin(state.t * 2.2) * 3;
    ctx.fillStyle = b.flash > 0 ? '#ffffff' : (b.dead ? '#4a2030' : '#e01e3c');
    ctx.shadowColor = '#ff2d55';
    ctx.shadowBlur = 30;
    rr(-b.w / 2, -b.h / 2 + float, b.w, b.h, 12);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#2a0410';
    rr(-b.w / 2 + 9, -b.h / 2 + 10 + float, b.w - 18, b.h - 22, 7);
    ctx.fill();
    ctx.fillStyle = b.dead ? '#56658c' : '#ffd166';
    ctx.fillRect(-18, -6 + float, 13, 9);
    ctx.fillRect(5, -6 + float, 13, 9);
    ctx.restore();
  }

  function drawBombs() {
    for (var i = 0; i < level.bombs.length; i++) {
      var bo = level.bombs[i];
      if (bo.blast > 0) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, bo.blast / 0.3);
        ctx.fillStyle = '#ff5f7e';
        ctx.shadowColor = '#ff5f7e';
        ctx.shadowBlur = 40;
        ctx.beginPath();
        ctx.arc(bo.x + bo.w / 2, bo.y + bo.h / 2, 74, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        continue;
      }
      var soon = bo.fuse < 0.6;
      ctx.save();
      ctx.translate(bo.x + bo.w / 2, bo.y + bo.h / 2);
      ctx.fillStyle = soon && Math.sin(state.t * 30) > 0 ? '#ffffff' : '#8a2036';
      ctx.shadowColor = '#ff5f7e';
      ctx.shadowBlur = soon ? 20 : 8;
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(4, -10);
      ctx.lineTo(9, -17);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawNpc() {
    var n = level.npc;
    if (!n) return;

    ctx.save();
    ctx.translate(n.x + n.w / 2, n.y + n.h / 2);
    var bob = Math.sin(state.t * 2) * 2;
    ctx.fillStyle = '#7bffb2';
    ctx.shadowColor = '#7bffb2';
    ctx.shadowBlur = 18;
    rr(-n.w / 2, -n.h / 2 + bob, n.w, n.h, 7);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#05323a';
    ctx.fillRect(-8, -7 + bob, 5, 7);
    ctx.fillRect(3, -7 + bob, 5, 7);
    ctx.strokeStyle = '#05323a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 3 + bob, 6, 0.15 * Math.PI, 0.85 * Math.PI);   // a big grin
    ctx.stroke();
    ctx.restore();

    if (!n.said) return;

    /* speech bubble, typed out a character at a time */
    var shown = n.line.substring(0, Math.floor(n.t * 34));
    var bw = 330, bh = 74;
    var bx = n.x + n.w / 2 - bw / 2, by = n.y - bh - 22;

    ctx.fillStyle = 'rgba(5,7,15,0.88)';
    ctx.strokeStyle = '#7bffb2';
    ctx.lineWidth = 2;
    rr(bx, by, bw, bh, 10);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(n.x + n.w / 2 - 8, by + bh);
    ctx.lineTo(n.x + n.w / 2, by + bh + 12);
    ctx.lineTo(n.x + n.w / 2 + 8, by + bh);
    ctx.closePath();
    ctx.fillStyle = 'rgba(5,7,15,0.88)';
    ctx.fill();

    ctx.fillStyle = '#bfffe0';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    var words = shown.split(' ');
    var line = '', lines = [];
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (test.length > 38) { lines.push(line); line = words[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    for (i = 0; i < lines.length && i < 3; i++) {
      ctx.fillText(lines[i], n.x + n.w / 2, by + 26 + i * 18);
    }
  }

  function drawSaws() {
    for (var i = 0; i < level.saws.length; i++) {
      var sw = level.saws[i];
      var at = sawPos(sw);

      /* the rail it rides, so you can read the swing before you jump */
      ctx.strokeStyle = 'rgba(255,95,126,0.16)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(sw.x0, sw.y0);
      ctx.lineTo(sw.x1, sw.y1);
      ctx.stroke();

      ctx.save();
      ctx.translate(at.x, at.y);
      ctx.rotate(state.t * 9);

      ctx.fillStyle = '#ff5f7e';
      ctx.shadowColor = '#ff5f7e';
      ctx.shadowBlur = 18;
      var teeth = 10;
      ctx.beginPath();
      for (var k = 0; k < teeth; k++) {
        var a0 = (k / teeth) * Math.PI * 2;
        var a1 = ((k + 0.5) / teeth) * Math.PI * 2;
        ctx.lineTo(Math.cos(a0) * sw.r, Math.sin(a0) * sw.r);
        ctx.lineTo(Math.cos(a1) * (sw.r - 8), Math.sin(a1) * (sw.r - 8));
      }
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#8a93a8';
      ctx.beginPath();
      ctx.arc(0, 0, sw.r - 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#05070f';
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawBarrier() {
    var b = level.barrier;
    if (!b || b.open) return;
    var pulse = 0.7 + Math.sin(state.t * 6) * 0.3;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ff5f7e';
    ctx.shadowColor = '#ff5f7e';
    ctx.shadowBlur = 22;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (var y = b.y; y < b.y + b.h; y += 26) ctx.fillRect(b.x, y, b.w, 3);
  }

  function drawScarecrow() {
    var s = level.scarecrow;
    if (!s) return;
    ctx.save();
    var jitter = s.shake > 0 ? (Math.random() - 0.5) * 7 : 0;
    ctx.translate(s.x + jitter, s.y);

    if (s.hp <= 0) {
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = '#6b4b2a';
      ctx.fillRect(19, 48, 8, 40);
      ctx.restore();
      return;
    }

    if (s.flash > 0) { ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 20; }
    ctx.fillStyle = '#6b4b2a';
    ctx.fillRect(19, 26, 8, 62);
    ctx.fillRect(2, 36, 42, 7);
    ctx.fillStyle = s.flash > 0 ? '#ffffff' : '#f9c74f';
    rr(8, 0, 30, 30, 6); ctx.fill();
    ctx.fillStyle = '#3a2a12';
    ctx.fillRect(15, 10, 5, 5);
    ctx.fillRect(27, 10, 5, 5);
    ctx.strokeStyle = '#3a2a12';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(16, 22); ctx.lineTo(23, 26); ctx.lineTo(30, 22);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();

    for (var i = 0; i < s.maxHp; i++) {
      ctx.fillStyle = i < s.hp ? '#f9c74f' : 'rgba(249,199,79,0.18)';
      ctx.fillRect(s.x + 4 + i * 14, s.y - 14, 10, 5);
    }
  }

  function drawEnemies() {
    for (var n = 0; n < level.enemies.length; n++) drawEnemy(level.enemies[n]);
  }

  function drawEnemy(e) {
    if (e.dead) return;

    ctx.save();
    ctx.translate(e.x + e.w / 2, e.y + e.h / 2);
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#ff5f7e';
    ctx.shadowColor = '#ff5f7e';
    ctx.shadowBlur = 18;
    rr(-e.w / 2, -e.h / 2, e.w, e.h, 5);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#3a0713';
    ctx.fillRect(e.face > 0 ? 0 : -5, -4, 4, 6);      // two mean little eyes
    ctx.fillRect(e.face > 0 ? -6 : 2, -4, 4, 6);
    ctx.restore();

    for (var i = 0; i < e.maxHp; i++) {               // hit pips
      ctx.fillStyle = i < e.hp ? '#ff5f7e' : 'rgba(255,95,126,0.18)';
      ctx.fillRect(e.x - 3 + i * 10, e.y - 12, 7, 4);
    }
  }

  function drawPickups() {
    for (var i = 0; i < level.pickups.length; i++) drawPickup(level.pickups[i]);
  }

  function drawPickup(it) {
    if (it.hidden) return;
    var bob = it.held ? 0 : Math.sin(state.t * 3 + it.x) * 3;
    ctx.save();
    ctx.translate(it.x + it.w / 2, it.y + it.h / 2 + bob);

    if (it.kind === 'bomb') {
      ctx.fillStyle = '#4ec3ff';
      ctx.shadowColor = '#4ec3ff';
      ctx.shadowBlur = 22;
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.arc(-4, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#bff0ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(4, -10);
      ctx.lineTo(9, -17);
      ctx.stroke();
    } else if (it.kind === 'key') {
      ctx.fillStyle = it.kind === 'bomb' ? '#4ec3ff' : '#ffd166';
      ctx.shadowColor = it.kind === 'bomb' ? '#4ec3ff' : '#ffd166';
      ctx.shadowBlur = 16;
      ctx.beginPath();                         // bow
      ctx.arc(-7, 0, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#05070f';
      ctx.beginPath();
      ctx.arc(-7, 0, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffd166';
      ctx.fillRect(-1, -3, 16, 6);             // shaft
      ctx.fillRect(9, 3, 4, 6);                // teeth
      ctx.fillRect(14, 3, 3, 5);
    } else {
      ctx.fillStyle = '#ff5f7e';
      ctx.shadowColor = '#ff5f7e';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(0, 2, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#7bffb2';
      ctx.beginPath();
      ctx.moveTo(2, -10); ctx.lineTo(14, -16); ctx.lineTo(5, -4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.arc(-5, -2, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawDoor() {
    var d = level.door;
    var ready = doorReady();
    var pulse = 0.6 + Math.sin(state.t * 3) * 0.25;
    ctx.save();
    ctx.globalAlpha = ready ? pulse + 0.25 : 0.3;
    ctx.fillStyle = ready ? '#4ec3ff' : '#3d4a72';
    if (ready) { ctx.shadowColor = '#4ec3ff'; ctx.shadowBlur = 30; }
    rr(d.x, d.y, d.w, d.h, 10);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(5,7,15,0.75)';
    rr(d.x + 10, d.y + 12, d.w - 20, d.h - 24, 6);
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.fillStyle = ready ? '#bff0ff' : '#56658c';
    if (d.needs === 'key' && !ready) {
      ctx.font = 'bold 20px sans-serif';       // a keyhole, while locked
      ctx.fillText('⚿', d.x + d.w / 2, d.y + d.h / 2 + 8);
    } else {
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText('?', d.x + d.w / 2, d.y + d.h / 2 + 9);
    }
  }

  function drawHints() {
    ctx.textAlign = 'center';
    for (var i = 0; i < level.hints.length; i++) {
      var h = level.hints[i];
      var dist = Math.abs((p.x + p.w / 2) - h.x);
      var a = dist > 480 ? 0 : dist > 330 ? (480 - dist) / 150 : 1;
      if (a <= 0) continue;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#4ec3ff';
      ctx.shadowColor = 'rgba(78,195,255,0.6)';
      ctx.shadowBlur = 12;
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText(h.big, h.x, h.y);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#8ea7d6';
      ctx.font = '12px sans-serif';
      ctx.fillText(h.small, h.x, h.y + 20);
      ctx.restore();
    }
  }

  function drawPlayer() {
    if (p.dead) return;
    var cx = p.x + p.w / 2, cy = p.y + p.h / 2;

    if (p.atk > 0) {
      var t = 1 - p.atk / ATK_TIME;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(p.face, 1);
      ctx.globalAlpha = 1 - t;
      ctx.strokeStyle = '#ffffff';
      ctx.shadowColor = '#4ec3ff';
      ctx.shadowBlur = 20;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(6, 0, 26 + t * 12, -0.9 + t * 1.4, 0.9 + t * 1.4);
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(p.rot);
    ctx.fillStyle = '#4ec3ff';
    ctx.shadowColor = '#4ec3ff';
    ctx.shadowBlur = 18;
    rr(-p.w / 2, -p.h / 2, p.w, p.h, 6);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#05070f';
    rr(-p.w / 2 + 5, -p.h / 2 + 5, p.w - 10, p.h - 10, 4);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(p.face > 0 ? 1 : -6, -6, 5, 7);
    ctx.fillRect(p.face > 0 ? -7 : 2, -6, 5, 7);
    ctx.restore();

    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(191,240,255,0.75)';
    ctx.fillText(state.name, cx, p.y - 10);

    /* how much longer you can stand being held */
    if (state.grab > 0.05) {
