<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Platformer Game</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../gate.js" data-gate="unnamed"></script>
  <style>
    body {
      background: #05070f;
      justify-content: flex-start;
      padding-top: 3.2rem;
      overflow: hidden;
    }

    #stage {
      position: relative;
      width: min(96vw, 960px);
      aspect-ratio: 16 / 9;
      border: 2px solid #1d2b5c;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(78, 195, 255, 0.18), 0 0 120px rgba(78, 195, 255, 0.06);
    }

    #game { display: block; width: 100%; height: 100%; }

    /* ---- full-screen menus ---- */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: radial-gradient(ellipse at center, #131a3d 0%, #05070f 75%);
      z-index: 5;
    }
    .screen.hidden { display: none; }

    .qmark {
      font-size: clamp(2rem, 7vw, 4.5rem);
      font-weight: 800;
      letter-spacing: 4px;
      text-align: center;
      color: #4ec3ff;
      text-shadow: 0 0 24px rgba(78, 195, 255, 0.7), 0 0 70px rgba(78, 195, 255, 0.3);
      animation: qpulse 2.6s ease-in-out infinite;
    }
    @keyframes qpulse {
      0%, 100% { transform: scale(1); opacity: 0.92; }
      50%      { transform: scale(1.04); opacity: 1; }
    }

    .done-title {
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      font-weight: 800;
      letter-spacing: 6px;
      color: #4ec3ff;
      text-shadow: 0 0 22px rgba(78, 195, 255, 0.6);
    }

    .screen p {
      color: #8ea7d6;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-size: 0.8rem;
      margin: 0.5rem 0 1.4rem;
    }

    #nameInput {
      width: min(80%, 320px);
      padding: 0.7rem 1rem;
      font-family: inherit;
      font-size: 1.2rem;
      letter-spacing: 3px;
      text-align: center;
      color: #fff;
      background: #0b0f24;
      border: 2px solid #1d2b5c;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #nameInput:focus {
      border-color: #4ec3ff;
      box-shadow: 0 0 18px rgba(78, 195, 255, 0.35);
    }

    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hide { display: none !important; }

    .tbtn {
      margin-top: 1.1rem;
      width: min(78vw, 280px);
      padding: 0.65rem 1.4rem;
      font-family: inherit;
      font-size: 1rem;
      letter-spacing: 3px;
      color: #05070f;
      font-weight: 700;
      background: #4ec3ff;
      border: 2px solid #4ec3ff;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, border-color 0.15s, color 0.15s;
    }
    .tbtn:hover { background: #7fd6ff; border-color: #7fd6ff; transform: scale(1.04); }

    .tbtn.ghost {
      color: #8ea7d6;
      background: transparent;
      border-color: #1d2b5c;
      font-weight: 600;
    }
    .tbtn.ghost:hover {
      color: #fff;
      background: transparent;
      border-color: #4ec3ff;
    }

    /* Admin (test) toggle, tucked into the title screen's bottom-left
       corner and dark enough to miss. On, checkpoints stop blocking
       the way on. */
    #adminBtn {
      position: absolute;
      left: 10px;
      bottom: 10px;
      padding: 0.25rem 0.6rem;
      font-family: inherit;
      font-size: 0.65rem;
      letter-spacing: 2px;
      color: #1d2645;
      background: transparent;
      border: 1px solid #10162e;
      border-radius: 6px;
      cursor: pointer;
    }
    #adminBtn:hover { color: #3a4a78; border-color: #1d2b5c; }
    #adminBtn.on { color: #ff9a9a; border-color: #ff5a5a; }

    .keys {
      margin-top: 2rem;
      color: #56658c;
      font-size: 0.75rem;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <a href="../games.html" class="back-link">&larr; Games</a>

  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>

    <div class="screen" id="titleScreen">
      <div class="qmark">A Platformer Game</div>

      <div class="panel hide" id="menuPanel">
        <button id="continueBtn" class="tbtn" type="button">Continue Game</button>
        <button id="newBtn" class="tbtn ghost" type="button">New Game</button>
      </div>

      <div class="panel" id="namePanel">
        <input id="nameInput" type="text" maxlength="12" placeholder="NAME YOUR HERO" autocomplete="off" spellcheck="false">
        <button id="beginBtn" class="tbtn" type="button">Begin</button>
      </div>

      <button id="adminBtn" type="button">ADMIN: OFF</button>
    </div>

    <div class="screen hidden" id="doneScreen">
      <div class="done-title" id="doneTitle">TUTORIAL COMPLETE</div>
      <p id="doneSub">Nice work</p>
      <div class="panel">
        <button id="nextBtn" class="tbtn" type="button">Start the Game</button>
        <button id="againBtn" class="tbtn ghost" type="button">Restart the Tutorial</button>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx    = canvas.getContext('2d');
  var W = 960, H = 540;

  var GROUND = 440;
  var SIZE   = 30;               // a square cube, like a proper icon

  /* ============================================================
     PHYSICS
     ============================================================ */
  var GRAVITY  = 2000;
  var MOVE_SPD = 275;
  var ACCEL    = 2800;
  var FRICTION = 3000;
  var JUMP_V   = 640;            // one jump: 102px up, 176px across
  var JUMP_V2  = 700;            // the second jump kicks a little harder
  var MAX_FALL = 950;
  var COYOTE   = 0.10;
  var BUFFER   = 0.12;
  var ATK_TIME = 0.20;
  var ATK_COOL = 0.32;
  var DASH_SPD  = 700;           // a dash orb throws you flat and fast
  var DASH_TIME = 0.52;          // 364px of it
  var UP_V      = 950;           // a yellow orb: 225px straight up
  var HIGH_V    = 1250;          // a red one: 390px, and nothing else reaches

  /* The dash ring keeps the size it has always had. The two launchers
     are smaller — 24px across, narrower than the 30px cube — and all
     three are caught on the same 34px circle, so the size is a look and
     not a hitbox.

     Nothing goes on cooldown. A ring fires every single time you are
     inside it and press jump, however often that is. */
  var ORB_R        = 17;
  var ORB_R_LAUNCH = 12;
  var ORB_CATCH    = 34;

  /* ============================================================
     LEVELS

     Each builder returns a fresh, self-contained room. Nothing is
     shared between them, so reloading a level is a clean slate.

     solids  - you stand on these
     hazards - touching one kills you
     pickup  - the one thing you can carry (B), with a home to
               return to
     door    - walk into it carrying `needs` and the room is over
     fallY   - fall past this and you're gone
     ============================================================ */
  function buildTutorial() {
    return {
      name: 'Tutorial',
      worldW: 3720,
      start: { x: 120, y: GROUND - SIZE },
      fallY: 520,

      /* Each lesson gets its own stretch of ground with nothing else
         in it, so you never meet two new ideas at the same time. */
      solids: [
        { x: -60,  y: GROUND, w: 1160, h: 160 },   // ground A: 0 .. 1100
        { x: 820,  y: 370,    w: 140,  h: 70  },   // the ledge (teaches JUMP)
        { x: 1320, y: GROUND, w: 2400, h: 160 },   // ground B: 1320 .. 3720
        { x: 2800, y: 386,    w: 70,   h: 54  }    // apple pedestal
      ],
      hazards: [ { x: 1100, y: 486, w: 220, h: 54 } ],
      pit: { x: 1100, w: 220 },                    // 220px: too far for one jump

      scarecrow: { x: 1800, y: 352, w: 46, h: 88, hp: 3, maxHp: 3,
                   regen: 0, flash: 0, shake: 0, everBroken: false },
      barrier: { x: 2250, y: 120, w: 26, h: 320, open: false },

      pickups: [ { kind: 'apple', x: 2822, y: 358, w: 26, h: 28,
                   home: { x: 2822, y: 358 } } ],
      door: { x: 3450, y: 300, w: 60, h: 140, needs: 'apple' },

      waves: [],
      boss: null,
      bombs: [],
      sinkers: [],
      orbs: [],
      enemies: [],
      saws: [],
      arrows: [[1180, 330], [1250, 268]],
      hints: [
        { x: 300,  y: 360, big: '←   →',   small: 'MOVE' },
        { x: 760,  y: 286, big: 'SPACE',             small: 'JUMP' },
        { x: 1210, y: 200, big: 'SPACE IN THE AIR',  small: 'DOUBLE JUMP' },
        { x: 1720, y: 292, big: 'I',                 small: 'ATTACK' },
        { x: 2720, y: 286, big: 'B',                 small: 'PICK UP / DROP' }
      ]
    };
  }

  /* Room One. Four beats, each one jump harder than the last:
     a single jump up, a double jump higher, a double jump over
     spikes, then the key and the door out. */
  function buildRoomOne() {
    return {
      name: 'Room One',
      worldW: 2700,
      start: { x: 80, y: GROUND - SIZE },
      fallY: 620,

      solids: [
        { x: -60,  y: GROUND, w: 660, h: 160 },   // start ground: 0 .. 600
        { x: 700,  y: 370,    w: 140, h: 26 },    // 1. one jump up (70 high)
        { x: 960,  y: 240,    w: 140, h: 26 },    // 2. 130 higher - needs two
        { x: 1180, y: 300,    w: 140, h: 26 },    // the run-up
        { x: 1320, y: 300,    w: 240, h: 26 },    // 3. the spiked stretch
        { x: 1560, y: 300,    w: 200, h: 26 },    // landing
        { x: 1860, y: 300,    w: 260, h: 26 },    // 4. the key
        { x: 2200, y: 300,    w: 340, h: 26 }     // the door
      ],
      hazards: [ { x: 1326, y: 272, w: 228, h: 28 } ],

      pickups: [ { kind: 'key', x: 1960, y: 274, w: 30, h: 26,
                   home: { x: 1960, y: 274 } } ],
      door: { x: 2300, y: 170, w: 60, h: 130, needs: 'key' },

      waves: [],
      boss: null,
      bombs: [],
      sinkers: [],
      orbs: [],
      enemies: [],
      saws: [],
      arrows: [],
      hints: []          // no labels: they can remember how to pick things up
    };
  }

  /* Room Two. Four jumps across a void, each gap patrolled by a saw
     that rides up and down through it. Wait for the blade to drop,
     then go. The last gap is 240px with two saws in it, so it takes
     a double jump AND a read of both blades. */
  function buildRoomTwo() {
    return {
      name: 'Room Two',
      worldW: 2200,
      start: { x: 80, y: 380 - SIZE },
      fallY: 620,

      solids: [
        { x: -60,  y: 380, w: 480, h: 26 },   // start:  -60 .. 420
        { x: 560,  y: 380, w: 200, h: 26 },   // jump 1: gap of 140
        { x: 900,  y: 380, w: 200, h: 26 },   // jump 2: gap of 140
        { x: 1240, y: 380, w: 220, h: 26 },   // jump 3: gap of 140
        { x: 1700, y: 380, w: 340, h: 26 }    // jump 4: gap of 240
      ],
      hazards: [],

      /* y0 is the top of the swing, y1 the bottom. At the bottom the
         blade sits below the platforms and the jump arc is clear. */
      saws: [
        { x0: 490,  x1: 490,  y0: 290, y1: 500, r: 26, period: 2.2, phase: 0.00 },
        { x0: 830,  x1: 830,  y0: 290, y1: 500, r: 26, period: 2.0, phase: 0.30 },
        { x0: 1170, x1: 1170, y0: 290, y1: 500, r: 26, period: 2.4, phase: 0.60 },
        { x0: 1520, x1: 1520, y0: 290, y1: 500, r: 26, period: 2.6, phase: 0.00 },
        { x0: 1640, x1: 1640, y0: 290, y1: 500, r: 26, period: 2.6, phase: 0.25 }
      ],

      waves: [],
      boss: null,
      bombs: [],
      sinkers: [],
      orbs: [],
      enemies: [],
      pickups: [],
      door: { x: 1900, y: 250, w: 60, h: 130, needs: null },

      arrows: [],
      hints: []
    };
  }

  /* Room Three. Platforms up to an arena where a small red cube lives.
     It chases you and hangs on: two seconds of contact and you're gone.
     Three hits kill it, and it drops the key to the next room. */
  function buildRoomThree() {
    return {
      name: 'Room Three',
      worldW: 3500,
      start: { x: 80, y: GROUND - SIZE },
      fallY: 620,

      /* Every gap is 240px — double jump distance, for you and for it. */
      solids: [
        { x: -60,  y: GROUND, w: 560, h: 160 },   // start:  -60 .. 500
        { x: 740,  y: 380,    w: 220, h: 26  },   // 740 .. 960
        { x: 1200, y: 320,    w: 240, h: 26  },   // 1200 .. 1440
        { x: 1680, y: 380,    w: 260, h: 26  },   // 1680 .. 1940
        { x: 2180, y: GROUND, w: 620, h: 160 },   // the arena: 2180 .. 2800
        { x: 3040, y: 380,    w: 320, h: 26  }    // the way out
      ],
      waves: [],
      boss: null,
      bombs: [],
      sinkers: [],
      orbs: [],
      hazards: [],
      saws: [],

      /* It jumps, it double jumps, and it will follow you anywhere
         in the room. There is no outrunning it forever. */
      enemies: [{
        x: 2400, y: GROUND - 22, w: 22, h: 22,
        vx: 0, vy: 0,
        hp: 3, maxHp: 3,
        speed: 235,                    // slower than you (275), but not by much
        face: -1,
        flash: 0,
        knock: 0,
        dead: false,
        onGround: false,
        airJumps: 1,
        spawn: { x: 2400, y: GROUND - 22 }
      }],

      /* Hidden until the cube drops it. */
      pickups: [ { kind: 'key', x: 2400, y: 380, w: 30, h: 26, hidden: true,
                   home: { x: 2400, y: 380 } } ],
      door: { x: 3180, y: 250, w: 60, h: 130, needs: 'key' },

      arrows: [],
      hints: []
    };
  }

  /* One red cube, on a platform, with a saw skating along its top. */
  function redOn(plat, atX) {
    return {
      x: atX, y: plat.y - 22, w: 22, h: 22,
      vx: 0, vy: 0,
      hp: 3, maxHp: 3,
      speed: 235,
      face: -1,
      flash: 0,
      knock: 0,
      dead: false,
      onGround: false,
      airJumps: 1,
      spawn: { x: atX, y: plat.y - 22 }
    };
  }

  /* Room Four. Solid ground underfoot, three platforms climbing away
     from it, a red on each and a saw sliding along each one. Kill all
     three and the key appears on the top platform, so the climb is the
     room. The saws sit ON the platforms and never dip below them. */
  function buildRoomFour() {
    /* 240px gaps, the same double-jump distance as Room Three, and the
       undersides pass through so you can come up from below. */
    var ground = { x: -60,  y: GROUND, w: 2720, h: 160 };
    var platA  = { x: 560,  y: 350,    w: 260,  h: 26, oneWay: true };
    var platB  = { x: 1060, y: 270,    w: 260,  h: 26, oneWay: true };
    var platC  = { x: 1560, y: 190,    w: 260,  h: 26, oneWay: true };

    /* A saw rides with its underside exactly on the platform top, and
       turns back before either edge, so it never hangs off. */
    function sawOn(plat, period, phase) {
      var r = 22;
      return {
        x0: plat.x + r, x1: plat.x + plat.w - r,
        y0: plat.y - r, y1: plat.y - r,
        r: r, period: period, phase: phase
      };
    }

    return {
      name: 'Room Four',
      worldW: 2600,
      start: { x: 80, y: GROUND - SIZE },
      fallY: 620,

      solids: [ground, platA, platB, platC],
      waves: [],
      boss: null,
      bombs: [],
      sinkers: [],
      orbs: [],
      hazards: [],
      saws: [ sawOn(platA, 3.0, 0.00),
              sawOn(platB, 2.6, 0.35),
              sawOn(platC, 2.2, 0.70) ],

      enemies: [ redOn(platA, 700), redOn(platB, 1200), redOn(platC, 1700) ],

      /* Appears up top once all three are down. */
      pickups: [ { kind: 'key', x: 1680, y: 164, w: 30, h: 26, hidden: true,
                   spawnAt: { x: 1680, y: 164 },
                   home: { x: 1680, y: 164 } } ],
      door: { x: 2300, y: 310, w: 60, h: 130, needs: 'key' },

      arrows: [],
      hints: []
    };
  }

  /* Room Five. No hazards, no enemies. A green fellow says hello and
     buries you in apples you can carry around for absolutely no reason. */
  function buildRoomFive() {
    var apples = [];
    for (var i = 0; i < 22; i++) {
      apples.push({
        kind: 'apple',
        x: 780 + (i % 11) * 46 + (i > 10 ? 22 : 0),
        y: -140 - Math.floor(i / 11) * 90 - (i % 5) * 40,
        w: 26, h: 28,
        hidden: true, grounded: false, vy: 0,
        home: { x: 800 + i * 40, y: GROUND - 28 }
      });
    }

    return {
      name: 'Room Five',
      worldW: 2200,
      start: { x: 80, y: GROUND - SIZE },
      fallY: 620,

      solids: [ { x: -60, y: GROUND, w: 2320, h: 160 } ],
      hazards: [],
      saws: [],
      enemies: [],
      waves: [],
      boss: null,
      bombs: [],
      sinkers: [],
      orbs: [],

      npc: {
        x: 900, y: GROUND - SIZE, w: SIZE, h: SIZE,
        said: false, t: 0,
        line: 'You have come here? You must be tired! Here, some apples!'
      },

      pickups: apples,
      door: { x: 1900, y: 310, w: 60, h: 130, needs: null },

      arrows: [],
      hints: []
    };
  }

  /* Room Six. Room Four turned all the way up: ten reds, saws on the
     platforms, another skating along the ground, and spikes surging out
     of the floor in a travelling wave. You start on a ledge above it. */
  function buildRoomSix() {
    var ground = { x: -60,  y: GROUND, w: 3760, h: 160 };
    var ledge  = { x: 40,   y: 350,    w: 200,  h: 26, oneWay: true };
    var platA  = { x: 700,  y: 350,    w: 260,  h: 26, oneWay: true };
    var platB  = { x: 1200, y: 270,    w: 260,  h: 26, oneWay: true };
    var platC  = { x: 1700, y: 190,    w: 260,  h: 26, oneWay: true };

    function sawOn(plat, period, phase) {
      var r = 22;
      return {
        x0: plat.x + r, x1: plat.x + plat.w - r,
        y0: plat.y - r, y1: plat.y - r,
        r: r, period: period, phase: phase
      };
    }

    /* One unbroken carpet of spikes, end to end, running under the
       spawn ledge as well — the ledge is the only safe floor in the
       room. Each bed lags the one before it, so the whole thing rolls
       past as a travelling wave and you move with the troughs. */
    var waves = [];
    var BED = 40;                        // one tooth to a bed
    for (var i = 0; i * BED - 60 < 3760; i++) {
      waves.push({
        x: -60 + i * BED, w: BED, h: 34,   // low, and slow, with a tell
        period: 4.6, phase: (i * (0.26 / 3)) % 1
      });
    }

    var reds = [];
    var spots = [[760, platA], [900, platA],
                 [1260, platB], [1400, platB],
                 [1760, platC], [1900, platC],
                 [1500, ground], [2100, ground], [2600, ground], [3000, ground]];
    for (var j = 0; j < spots.length; j++) {
      reds.push(redOn(spots[j][1], spots[j][0]));
    }

    return {
      name: 'Room Six',
      worldW: 3700,
      start: { x: 90, y: 350 - SIZE },     // the ledge, clear of the spikes
      fallY: 620,

      solids: [ground, ledge, platA, platB, platC],
      hazards: [],
      waves: waves,
      boss: null,
      bombs: [],
      sinkers: [],
      orbs: [],

      saws: [],                            // no blades in here at all

      enemies: reds,

      pickups: [ { kind: 'key', x: 1820, y: 164, w: 30, h: 26, hidden: true,
                   spawnAt: { x: 1820, y: 164 },
                   home: { x: 1820, y: 164 } } ],
      door: { x: 3450, y: 310, w: 60, h: 130, needs: 'key' },

      arrows: [],
      hints: []
    };
  }

  /* The boss. Two low platforms with a high one between them, and a
     thing in the air that will not come down to your level. Everything
     it does is survivable from somewhere: under a platform, on top of
     one, or by being somewhere else entirely. */
  function buildRoomSeven() {
    var ground = { x: -60,  y: GROUND, w: 2520, h: 160 };
    var lowL   = { x: 420,  y: 330,    w: 320,  h: 24, oneWay: true };
    var high   = { x: 880,  y: 210,    w: 320,  h: 24, oneWay: true };
    var lowR   = { x: 1340, y: 330,    w: 320,  h: 24, oneWay: true };

    return {
      name: 'The Boss',
      worldW: 2400,
      start: { x: 120, y: GROUND - SIZE },
      fallY: 620,

      solids: [ground, lowL, high, lowR],
      hazards: [],
      saws: [],
      waves: [],
      enemies: [],
      bombs: [],
      sinkers: [],
      orbs: [],

      boss: {
        x: 1000, y: 96, w: 74, h: 56,
        vx: 120,
        hp: 3, maxHp: 3,
        flash: 0, dead: false,
        hover: 96,
        idle: 0, rest: 1.4,
        moves: []
      },

      /* the blue bomb appears during a bomb drop; the key when it dies */
      pickups: [
        { kind: 'bomb', x: 0, y: 0, w: 26, h: 26, hidden: true,
          grounded: true, vy: 0, flying: false,
          home: { x: 1000, y: GROUND - 26 } },
        { kind: 'key', x: 1020, y: 184, w: 30, h: 26, hidden: true,
          spawnAt: { x: 1020, y: 184 },
          home: { x: 1020, y: 184 } }
      ],
      door: { x: 2100, y: 310, w: 60, h: 130, needs: 'key' },

      arrows: [],
      hints: []
    };
  }

  /* Room Eight. Nothing underneath but a long drop, and the platforms
     sag under you the moment you land. Some share a chain and go down
     together; some are capped with spikes and are only ever something
     to clear. Almost every gap is a double jump. */
  function buildRoomEight() {
    var TOP = 380;

    /* `spike` puts a bed of teeth on part of the platform's own surface,
       so it rides down with the platform and you have to land clear of
       it. Sinking stops at `max` — hitting the bottom is a setback, not
       a death. */
    function sinker(x, w, chain, spike) {
      return { x: x, y: TOP, w: w, h: 22, oneWay: true,
               home: TOP, chain: chain || null,
               rate: 58, back: 50, max: 130, active: false,
               spike: spike || null };
    }

    /* Gaps are 240. A double jump carries 288px spending the second
       jump at the apex, so they're all inside comfortable reach. */
    var start = { x: -60, y: TOP, w: 300, h: 160 };
    var p1 = sinker(420, 150);
    var p2 = sinker(810, 150, null, { off: 0,   w: 54 });
    var p3 = sinker(1200, 150, 'a');          // four on one chain
    var p4 = sinker(1590, 150, 'a');
    var p5 = sinker(1980, 150, 'a', { off: 0, w: 54 });
    var p6 = sinker(2370, 150, 'a');
    var p7 = sinker(2760, 150, 'b');          // and a pair

    var end = { x: 3540, y: TOP, w: 360, h: 160 };

    return {

      worldW: 3900,
      start: { x: 60, y: TOP - SIZE },
      fallY: 640,

      solids: [start, p1, p2, p3, p4, p5, p6, p7, p8, end],
      sinkers: [p1, p2, p3, p4, p5, p6, p7, p8],
      hazards: [],
      orbs: [],

      saws: [],
      waves: [],
      enemies: [],
      bombs: [],
      boss: null,
      pickups: [],
      door: { x: 3690, y: TOP - 130, w: 60, h: 130, needs: null },

      arrows: [],
      hints: []
    };
  }

  /* Room Nine. Room Eight with the brakes off: the platforms start low,

  function buildRoomNine() {

          r: 24, period: 2.1, phase: 0.4 },
        { x0: 3610, x1: 3610, y0: TOP - 215, y1: TOP - 25,

  /* Room Ten. Everything the orb can do, asked for in one go: dashes
     chained end to end over open void, dashes threaded past blades, and
     one short pad that riding the dash out sails straight over — there
     you have to let go early to land at all. The pads sag the moment
     you touch them, so there is no stopping to think. */
  function buildRoomTen() {

    var LINE = TOP - 92;              // the height a dash flies at

    function pad(x, w, chain, teeth) {

    var p1    = pad(1000, 190, null, true);   // 1. two dashes chained

    var p4    = pad(2640, 170, 'b',  true);   // 4. dash over the shelf

    var end   = { x: 4180, y: TOP, w: 420, h: 200 };   // 6. two blades

      name: 'Room Ten',

         the first dash flies you straight through the second orb */
      orbs: [ orb(400),  orb(720),           // 1. chain them, 760px of void

              orb(1940),                     // 3. and let go early

              orb(2970), orb(3290),          // 5. chain again
              orb(3920) ],                   // 6. two blades in a row

      saws: [
        blade(1480, 1.5, 0.00),

  /* Room Eleven. Everything the game has, in one run: a wave of spikes
     rolling along solid ground with a blade at either end of it, then
     the ground stops and it is pads, orbs and teeth the rest of the
     way. The last gap cannot be crossed. That is not a mistake. */
  function buildRoomEleven() {
    var TOP  = GROUND;                // the floor and the pads share a line
    var LINE = TOP - 92;              // the height a dash flies at

    /* `teeth` is 1 for a bed on the near lip, 2 for a bed at each end —
       and two beds means the landing is the strip between them, which
       you only hit by letting go of the dash at the right moment. These
       sag half again as fast as Room Ten's: there is no reading the
       room from on top of one. */
    function pad(x, w, chain, teeth) {
      var bed = null;
      if (teeth === 1) bed = { off: 0, w: 50 };
      if (teeth === 2) bed = [{ off: 0, w: 50 }, { off: w - 50, w: 50 }];
      return { x: x, y: TOP, w: w, h: 22, oneWay: true,
               home: TOP, chain: chain || null,
               rate: 120, back: 70, max: 99999,
               active: false,
               spike: bed };
    }
    function orb(x) { return { x: x, y: LINE, r: ORB_R }; }
    function blade(x, period, phase) {
      return { x0: x, x1: x, y0: TOP - 215, y1: TOP - 25,
               r: 22, period: period, phase: phase };
    }

    /* --- part one: the gate, then the wave.

           The gate is two blades with a bed of floor spikes between
           them, so there is nowhere to stand in the middle: you wait on
           the near side until both have swung up, then clear the whole
           248px of it in one go. One jump carries 176px. You need the
           second one.

           Then the wave, and it runs all the way to the lip now — no
           landing strip at the end to gather yourself on. Each bed
           fires a beat LATER than the one to its left, which sends the
           whole thing rolling rightwards at about 275px/s, exactly how
           fast you run. Set off with it and the trough carries you to
           the edge and straight off it. Set off wrong and it is teeth
           the whole way. --- */
    var ground = { x: -60, y: TOP, w: 1420, h: 160 };      // lip at 1360
    var gate   = { x: 240, y: TOP - 34, w: 90, h: 34 };    // nowhere to stand

    var waves = [];
    var BED = 110 / 3;                   // one tooth to a bed
    for (var i = 0; i < 24; i++) {
      waves.push({ x: 480 + i * BED, w: BED, h: 34,      // 480 .. 1360
                   period: 4.6, phase: (1 - i * (0.087 / 3)) % 1 });
    }

    /* --- part two: the ground runs out and the orbs take over. The
           gaps are the ones Room Ten taught — 420 for one dash, 760 for
           two chained — and a shelf of teeth you go over, never on. --- */
    var p1    = pad(1780, 190, null, 1);   // 420: one dash, one blade
    var p2    = pad(2730, 190, 'a',  1);   // 760: chain them
    var shelf = { x: 2990, y: TOP, w: 180, h: 200 };

    /* 330, not 420 — the orb still sits 160 out from the lip, because
       that is where a jump arc crosses the line a dash flies at, but
       the pad is close enough that riding the dash out sails over it
       entirely. Teeth at both ends, so the landing is the strip in the
       middle and the only way onto it is to let go early, and to let
       go at the right moment. */
    var p3    = pad(3250, 200, 'a',  2);

    /* --- part three: one more orb, sitting exactly where the last four
           sat, and 670px of nothing after the dash gives out. --- */
    var end = { x: 4700, y: TOP, w: 500, h: 200 };

    return {
      name: 'Room Eleven',
      worldW: 5300,
      start: { x: 60, y: TOP - SIZE },
      fallY: 640,

      solids: [ground, p1, p2, shelf, p3, end],
      sinkers: [p1, p2, p3],
      hazards: [ gate,
                 { x: shelf.x, y: TOP - 34, w: shelf.w, h: 34 } ],
      waves: waves,

      orbs: [ orb(1520),               // 1. off the ground and across
              orb(2130), orb(2450),    // 2. chained
              orb(3080),               // 3. over the teeth
              orb(3610) ],             // 4. and this one is a lie

      saws: [ blade(200, 2.6, 0.00),   // the gate: both have to be up
              blade(380, 2.3, 0.45),   // before the jump is on
              blade(1600, 1.7, 0.00),  // and two hanging in the gaps
              blade(2600, 1.9, 0.35) ],

      /* The gap after p3 is 1160px with one orb in it. Nothing you have
         crosses that, and the pads sag the moment you touch them, so
         there is no waiting it out either. You have to jump, and then
         somebody else has to do the rest. */
      rescue: {
        atX: 3470,                     // only once you are past the last pad
        atY: 520,                      // how far you get to fall first
        to: { x: 4790, y: TOP },
        line: 'Up you go!',
        phase: 'waiting', t: 0, say: 0,
        x: 0, y: 0, w: SIZE, h: SIZE,
        fromX: 0, fromY: 0
      },

      enemies: [],
      bombs: [],
      boss: null,
      pickups: [],
      door: { x: 4980, y: TOP - 130, w: 60, h: 130, needs: null },

      arrows: [],
      hints: []
    };
  }

  /* Room Twelve. The two launcher orbs, taught the only way this game
     teaches anything: by putting something in your way that your legs
     cannot do, and leaving one lit ring next to it.

     A yellow one hangs at the height a jump tops out at, and throws
     you 225px further. A red one is hung low, down where you run,
     because 390px from the top of a jump would put you through the
     ceiling — and that low hang is the tell for how hard it kicks. */
  function buildRoomTwelve() {
    function orb(x, y, kind) {
      return { x: x, y: y, kind: kind,
               r: kind === 'dash' ? ORB_R : ORB_R_LAUNCH };
    }

    /* Nothing between the lessons but the few strides each take-off
       needs. Every ring is in sight while the last one is still
       ringing — the room is 3790px and four of those are lessons. */

    /* --- one: a shelf 310px up. A double jump gets 224 and stops. --- */
    var groundA = { x: -60,  y: GROUND, w: 360, h: 160 };   // lip at 300
    var shelfB  = { x: 300,  y: 130,    w: 220, h: 420 };   // 310 up

    /* --- two: the same idea, 370px up, and the ring is red and low.
           Yellow off this one tops out 145px short of it. --- */
    var groundC = { x: 520,  y: GROUND, w: 240, h: 160 };   // lip at 760
    var shelfD  = { x: 760,  y: 70,     w: 250, h: 480 };   // 370 up

    /* --- three: walk off D, drop to the last of the floor, and then
           there is nothing underneath for fourteen hundred pixels. Dash
           out, fall into a red, fall into a yellow, fall into a red.
           Each ring is hung where the fall from the one before
           arrives. --- */
    var ledgeE  = { x: 1010, y: GROUND, w: 220, h: 160 };   // lip at 1230
    var floorG  = { x: 2630, y: GROUND, w: 600, h: 160 };   // lip at 3230

    /* --- and out: three reds on that floor, the key when they are
           down, and one more low ring to get up to the door. --- */
    var shelfH  = { x: 3330, y: 200,    w: 280, h: 340 };

    return {
      name: 'Room Twelve',
      worldW: 3790,
      start: { x: 80, y: GROUND - SIZE },
      fallY: 620,

      solids: [groundA, shelfB, groundC, shelfD, ledgeE, floorG, shelfH],

      orbs: [ orb(200,  300, 'up'),     // 1. jump into it
              orb(630,  400, 'high'),   // 2. run into it

              orb(1390, 348, 'dash'),   // 3. the chain, and it is all
              orb(1810, 430, 'high'),   //    one held breath: miss any
              orb(2160, 300, 'up'),     //    one of them and the floor
              orb(2500, 430, 'high'),   //    is 200px below you

              orb(3190, 400, 'high') ], // 4. and up to the door

      enemies: [ redOn(floorG, 2860), redOn(floorG, 3000),
                 redOn(floorG, 3140) ],

      pickups: [ { kind: 'key', x: 2990, y: 404, w: 30, h: 26, hidden: true,
                   spawnAt: { x: 2990, y: 404 },
                   home: { x: 2990, y: 404 } } ],
      door: { x: 3530, y: 70, w: 60, h: 130, needs: 'key' },

      hazards: [],
      saws: [],
      waves: [],
      sinkers: [],
      bombs: [],
      boss: null,

      arrows: [],
      hints: []
    };
  }

  /* Room Thirteen. The course: everything the game has taught, run
     together with no room to think between the pieces.

     Pads that sag the moment you touch them, with a blade swinging in
     every gap between them. Then the dashes, over teeth and past more
     blades. Then the floor stops for good, and the last four rings all
     hang over nothing: miss one and there is no landing to be had.

     Every measurement in here is one the game has already proved
     somewhere else - 220 and 240 gaps, 420 for a dash, 760 for two
     chained, 225 off a yellow, 390 off a red. What is new is the
     blades, that none of the last rings has floor under it, and that
     the red one at the end deliberately does not reach the door. */
  function buildRoomThirteen() {
    var TOP  = GROUND;
    var LINE = TOP - 92;              // the height a dash flies at

    /* These never stop sinking - there is no waiting anything out on
       one, and the blade in the next gap is still swinging. */
    function pad(x, w, chain, teeth) {
      var bed = null;
      if (teeth === 1) bed = { off: 0, w: 50 };
      return { x: x, y: TOP, w: w, h: 22, oneWay: true,
               home: TOP, chain: chain || null,
               rate: 75, back: 70, max: 99999,
               active: false, spike: bed };
    }
    function orb(x, y, kind) {
      return { x: x, y: y, kind: kind,
               r: kind === 'dash' ? ORB_R : ORB_R_LAUNCH };
    }
    function blade(x, period, phase) {
      return { x0: x, x1: x, y0: TOP - 215, y1: TOP - 25,
               r: 22, period: period, phase: phase };
    }

    /* --- one: three sagging pads, 220 apart, and a blade in each gap.
           A double jump carries 288, so the gap is never the problem -
           the blade is, and so is the fact that the pad you are
           standing on to time it is going down, which is why 220 and
           not 240. B and C share a chain, so stepping on B drops C
           before you ever get there. --- */
    var ground0 = { x: -60, y: TOP, w: 320, h: 160 };      // lip at 260
    var padA    = pad(480,  170);
    var padB    = pad(870,  170, 'a');
    var padC    = pad(1260, 170, 'a');

    /* --- two: the ground gives out. 420 is one dash, the orb sits 160
           out from the lip where a jump arc crosses the dash line, and
           the landing has teeth on its near lip. --- */
    var padD = pad(1850, 190, null, 1);

    /* --- three: 760, which is two dashes chained, with a blade
           between the second orb and the landing. --- */
    var ledgeI = { x: 2800, y: TOP, w: 240, h: 160 };      // lip at 3040

    /* --- and out: past this lip there is no more floor. Every ring
           from here hangs over nothing, so missing one is not a
           setback, it is the end of the run.

           Dash out, fall into a yellow, and you are thrown 225 up with
           a blade sweeping sideways across the top of that arc - the
           only thing in the room that moves along your line rather
           than across it. Fall into a second yellow, then a red, and
           the red does not reach: it puts you short, and the second
           jump is what covers the rest. There is no ground before the
           door to land on and gather yourself. --- */
    var doorPad = { x: 4500, y: TOP, w: 260, h: 160 };

    return {
      name: 'Room Thirteen',
      worldW: 4940,
      start: { x: 60, y: TOP - SIZE },
      fallY: 640,

      solids: [ground0, padA, padB, padC, padD, ledgeI, doorPad],
      sinkers: [padA, padB, padC, padD],

      orbs: [ orb(1590, LINE, 'dash'),   // 2. one dash, over the teeth
              orb(2200, LINE, 'dash'),   // 3. and two chained
              orb(2520, LINE, 'dash'),

              orb(3200, LINE, 'dash'),   // 4. out over the void
              orb(3620, 430,  'up'),     //    up, and across the blade
              orb(3880, 430,  'up'),     //    up again
              orb(4140, 430,  'high') ], //    and this one lands short

      saws: [ blade(370,  2.0, 0.00),    // one in every gap of part one
              blade(760,  1.7, 0.35),
              blade(1150, 2.3, 0.60),
              blade(1670, 1.7, 0.00),    // and one in each dash gap
              blade(2670, 1.9, 0.35),

              /* The only horizontal one. It rides the line between the
                 two yellows, at the height their arc tops out, and it
                 is fastest through the middle where you need to be. */
              { x0: 3660, y0: 230, x1: 3840, y1: 230,
                r: 22, period: 1.8, phase: 0.00 } ],

      hazards: [],
      waves: [],
      enemies: [],
      bombs: [],
      boss: null,
      pickups: [],
      door: { x: 4540, y: TOP - 130, w: 60, h: 130, needs: null },

      arrows: [],
      hints: []
    };
  }

  /* Room Fourteen. The boss room's three platforms with no boss in it,
     ten reds instead, and Room Six's spikes rolling along the floor -
     and along the top of every platform too. Kill all ten and the key
     drops where the last one died. */
  function buildRoomFourteen() {
    var ground = { x: -60,  y: GROUND, w: 2520, h: 160 };
    var lowL   = { x: 420,  y: 330,    w: 320,  h: 24, oneWay: true };
    var high   = { x: 880,  y: 210,    w: 320,  h: 24, oneWay: true };
    var lowR   = { x: 1340, y: 330,    w: 320,  h: 24, oneWay: true };

    /* One tooth to a bed, the same carpet as Room Six: 40 wide, 34
       tall, 4.6s round, each bed a twelfth of a beat behind the last.
       It runs the whole floor, spawn included. The whole wave is
       shifted so the two beds under the spawn have only just gone down
       when the room starts: about two seconds before they come up. */
    var BED = 40, LAG = 0.26 / 3, X0 = -60, SHIFT = 0.52;
    function phaseAt(x) { return (((x - X0) / BED) * LAG + SHIFT) % 1; }

    var waves = [];
    for (var i = 0; X0 + i * BED < 2460; i++) {
      var gx = X0 + i * BED;
      waves.push({ x: gx, w: BED, h: 34, period: 4.6, phase: phaseAt(gx) });
    }
    /* A platform is only eight beds long. At the floor's lag those
       eight cover barely half a beat, so most of it would be up at
       once, leaving one 40px tooth to stand on. Here the eight share
       out one whole beat instead: half the platform is always down,
       and that half rolls along it. */
    var plats = [lowL, high, lowR];
    for (var k = 0; k < plats.length; k++) {
      var pl = plats[k], n = pl.w / BED;
      for (var b = 0; b < n; b++) {
        waves.push({ x: pl.x + b * BED, y: pl.y, w: BED, h: 34, period: 4.6,
                     phase: (b / n + k / 3) % 1 });
      }
    }

    var reds = [];
    var spots = [[480, lowL], [640, lowL],
                 [940, high], [1100, high],
                 [1400, lowR], [1560, lowR],
                 [800, ground], [1250, ground], [1800, ground], [2000, ground]];
    for (var j = 0; j < spots.length; j++) {
      reds.push(redOn(spots[j][1], spots[j][0]));
    }

    return {
      name: 'Room Fourteen',
      worldW: 2400,
      start: { x: 80, y: GROUND - SIZE },  // on the bare floor, left of the carpet
      fallY: 620,

      solids: [ground, lowL, high, lowR],
      hazards: [],
      waves: waves,
      saws: [],
      boss: null,
      bombs: [],
      sinkers: [],
      orbs: [],

      enemies: reds,

      /* no spawnAt: it falls where the last red goes down */
      pickups: [ { kind: 'key', x: 0, y: 0, w: 30, h: 26, hidden: true,
                   home: { x: 0, y: 0 } } ],
      door: { x: 2200, y: 310, w: 60, h: 130, needs: 'key' },

      arrows: [],
      hints: []
    };
  }

  /* Room Fifteen. X-ray. A wall you cannot see stops you almost at
     once, and the sign says what to do about it. Then a short course
     the size of Room One where every platform, spike and orb is
     invisible until you look - and looking freezes you, even on a
     platform that is falling out from under you. */
  function buildRoomFifteen() {
    var TOP = 300;
    var LINE = TOP - 92;                     // the height a dash flies at

    function ghost(x, y, w, h) {
      return { x: x, y: y, w: w, h: h, oneWay: y !== GROUND, ghost: true };
    }
    /* falls while you stand on it and never stops, X-ray or not */
    function faller(x, w) {
      return { x: x, y: TOP, w: w, h: 22, oneWay: true, ghost: true,
               home: TOP, chain: null,

  /* Room Twenty-Four. Fifty reds on small platforms over nothing, and
     one purple. The purple takes ten hits and swells with each; the
     tenth lights it, and it goes off like a bomb, only far bigger. The
     key comes out on the far side once every one of them is down. */
  function buildRoomTwentyFour() {
    var TOP = 400, HIGH = 270;

    function plat(x, y) {
      return { x: x, y: y, w: 100, h: 26, oneWay: true };
    }

    var start = { x: -60, y: TOP, w: 340, h: 160 };      // lip 280
    var solids = [start];
    var reds = [];

    /* two staggered rows, 180 apart along each: 13 low, 12 high */
    var plats = [];
    var i;
    for (i = 0; i < 13; i++) plats.push(plat(400 + i * 280, TOP));
    for (i = 0; i < 12; i++) plats.push(plat(540 + i * 280, HIGH));
    for (i = 0; i < plats.length; i++) {
      solids.push(plats[i]);
      reds.push(redOn(plats[i], plats[i].x + 12),
                redOn(plats[i], plats[i].x + 66));    // two to a platform: fifty
    }

    var end = { x: 4040, y: TOP, w: 600, h: 160 };
    solids.push(end);

    /* the purple, in the middle of the high row */
    var mid = plats[13 + 6];
    var purple = redOn(mid, mid.x + 39);
    purple.purple = true;
    purple.hp = 10;
    purple.maxHp = 10;
    reds.push(purple);

    return {
      name: 'Room Twenty-Four',
      worldW: 4600,
      start: { x: 60, y: TOP - SIZE },
      fallY: 660,

      solids: solids,
      sinkers: [],
      hazards: [],
      orbs: [],
      saws: [],

      enemies: reds,
      waves: [],
      bombs: [],
      boss: null,

      /* when the last one goes down, the key appears on the far side */
      pickups: [ { kind: 'key', x: 0, y: 0, w: 30, h: 26, hidden: true,
                   spawnAt: { x: 4140, y: TOP - 26 },
                   home: { x: 4140, y: TOP - 26 } } ],
      door: { x: 4440, y: TOP - 130, w: 60, h: 130, needs: 'key' },

      arrows: [],
      hints: []
    };
  }

  /* Room Twenty-Five. The last one, and everything at once: a spike
     carpet, belts both ways with teeth riding round one, falling
     platforms with teeth only X-ray shows, a platform only X-ray
     shows, dashes, a yellow, blades, an invisible wall, reds along the
     way, and the red belt that throws you onto the last platform.

     Walk far enough onto that platform and lasers come down at both
     ends of it, and three purples appear. Beat all three and the
     lasers go and the key comes out. */
  function buildRoomTwentyFive() {
    var TOP = 400;
    var LINE = TOP - 92;                     // the height a dash flies at

    function plat(x, y, w) {
      return { x: x, y: y, w: w, h: 26, oneWay: true };
    }
    function belt(x, w, speed) {
      return { x: x, y: TOP, w: w, h: 14, oneWay: true, belt: speed };
    }
    function drop(x, w, chain, bed) {        // falls; its teeth are X-ray only
      return { x: x, y: TOP, w: w, h: 22, oneWay: true,
               home: TOP, chain: chain, rate: 230, back: 70, max: 99999,
               active: false, spike: bed, spikeGhost: !!bed };
    }
    function blade(x, period, phase, ghost) {
      return { x0: x, x1: x, y0: TOP - 215, y1: TOP - 25,
               r: 22, period: period, phase: phase, ghost: !!ghost };
    }

    /* 1. a spike carpet rolling along the first floor, two reds on it */
    var ground = { x: -60, y: TOP, w: 1160, h: 160 };        // lip 1100
    var waves = [];
    var BED = 40;                                            // one tooth to a bed
    for (var i = 0; 400 + i * BED < 1100; i++) {
      waves.push({ x: 400 + i * BED, y: TOP, w: BED, h: 34,
                   period: 4.6, phase: (i * (0.26 / 3)) % 1 });
    }

    /* 2. a belt on with you, a blade in the gap before it */
    var b1 = belt(1320, 360, 260);                           // 220, lip 1680
    /* 3. a falling platform with hidden teeth at the back */
    var f1 = drop(1900, 150, null, { off: 100, w: 50 });     // 220, lip 2050
    /* 4. a platform only X-ray shows */
    var g1 = { x: 2270, y: TOP, w: 140, h: 26, oneWay: true, ghost: true };  // 220, lip 2410
    /* 5. a dash across 420, past an unseen blade, onto teeth-lipped landing */
    var p5 = plat(2830, TOP, 200);                           // lip 3030
    /* 6. a belt running back at you, teeth riding round it */
    var b2 = belt(3250, 360, -230);                          // 220, lip 3610
    b2.riders = [0, 368];
    /* 7. a yellow up onto a blade-swept ledge */
    var high = plat(3730, TOP - 180, 200);                   // lip 3930
    /* 8. two chained falling platforms - stepping on one drops both */
    var f2 = drop(4150, 120, 'a', null);                     // 220
    var f3 = drop(4490, 120, 'a', { off: 70, w: 50 });       // 220, lip 4610
    /* 9. two dashes chained over 760, the second ring X-ray only */
    var p9 = { x: 5370, y: TOP, w: 900, h: 160 };            // lip 6270
    var wall = { x: 5800, y: TOP - 160, w: 40, h: 160, ghost: true };   // unseen
    /* 10. the red belt, and across the void onto the last platform */
    var yeet = { x: 6490, y: TOP, w: 240, h: 14, oneWay: true,
                 belt: 200, yeet: true,                      // 220, lip 6730
                 to: { x: 7420, y: TOP } };                 // lands you left of middle, clear of both lasers
    var arena = { x: 7200, y: TOP, w: 900, h: 160 };         // 7200 .. 8100

    var reds = [ redOn(ground, 600), redOn(ground, 800), redOn(ground, 1000),
                 redOn(p5, 2900), redOn(p5, 3000),
                 redOn(high, 3800), redOn(high, 3900),
                 redOn(p9, 5500), redOn(p9, 5650), redOn(p9, 5950),
                 redOn(p9, 6100), redOn(p9, 6230) ];

    /* the three purples, not there until the lasers come down */
    var spots = [7450, 7650, 7850];
    for (i = 0; i < spots.length; i++) {
      var pu = redOn(arena, spots[i]);
      pu.purple = true;
      pu.hp = 10;
      pu.maxHp = 10;
      pu.dormant = true;
      pu.arena = true;
      reds.push(pu);
    }

    return {
      name: 'Room Twenty-Five',
      worldW: 8200,
      start: { x: 60, y: TOP - SIZE },
      fallY: 660,

      solids: [ground, b1, f1, g1, p5, b2, high, f2, f3, p9, wall, yeet, arena],
      sinkers: [f1, f2, f3],
      hazards: [ { x: 2830, y: TOP - 22, w: 44, h: 22, ghost: true } ],   // dash too short
      waves: waves,
      orbs: [ { x: 2570, y: LINE, kind: 'dash', r: ORB_R },
              { x: 3670, y: TOP - 20, kind: 'up', r: ORB_R_LAUNCH, ghost: true },
              { x: 4770, y: LINE, kind: 'dash', r: ORB_R },
              { x: 5090, y: LINE, kind: 'dash', r: ORB_R, ghost: true } ],
      saws: [ blade(1210, 1.2, 0.0),                  // before the first belt
              blade(1790, 1.2, 0.5, true),            // before the falling one, unseen
              blade(2160, 1.1, 0.4),                  // before the unseen platform
              { x0: 2700, x1: 2700, y0: TOP - 260, y1: TOP - 40,   // across the dash, unseen
                r: 22, period: 1.1, phase: 0.2, ghost: true },
              blade(3140, 1.2, 0.7, true),            // before the backward belt, unseen
              { x0: high.x + 22, x1: high.x + high.w - 22,         // along the high ledge
                y0: high.y - 22, y1: high.y - 22,
                r: 22, period: 1.3, phase: 0.5 },
              blade(4040, 1.1, 0.1),                  // before the falling pair
              blade(4380, 1.1, 0.3, true),            // between them, unseen
              { x0: 4930, x1: 4930, y0: TOP - 260, y1: TOP - 40,   // between the rings
                r: 22, period: 1.1, phase: 0.6 },
              { x0: 5400, x1: 5760, y0: TOP - 22, y1: TOP - 22,   // along the long floor
                r: 22, period: 1.6, phase: 0.0 } ],

      enemies: reds,
      bombs: [],
      boss: null,

      /* lasers at both ends of the last platform; walk in past `atX`
         and they come down, and the purples wake */
      arena: { left: arena.x + 6, right: arena.x + arena.w - 6,
               atX: arena.x + 100, floor: arena.y, phase: 'waiting' },

      pickups: [ { kind: 'key', x: 0, y: 0, w: 30, h: 26, hidden: true,
                   spawnAt: { x: 7635, y: TOP - 26 },
                   home: { x: 7635, y: TOP - 26 } } ],
      door: { x: 7980, y: TOP - 130, w: 60, h: 130, needs: 'key' },
      straightOn: true,        // no cleared screen: the dark, and him

      arrows: [],
      hints: []
    };
  }

  /* The final boss. Out of Room Twenty-Five's door the screen goes
     black, and the green fellow is there. He has a few things to say.
     Then his outline goes red, a rocket throne builds itself round him,
     he goes up, comes down on the floor, and it starts: the second
     boss's arena and every one of its attacks, from him. */
  var FINAL_LINES = [
    'A Platformer Game.',
    'You did a great job',
    'More things will be added later!',
    'But...',
    "You didn't think there wasn't going to be a final boss fight, did you?"
  ];
  var FINAL_GX = 1090;           // where he comes down, on the top platform

  /* His arena is the second boss's, gone red: the side platforms
     smaller, a spike pit under the middle one, and spike pits at both
     ends where the floor - and the door - used to be. The floor is two
     slabs and there is no walking off it. */
  var FINAL_PITS = [ { x: -60,  w: 360 },     // the left end,  -60 .. 300
                     { x: 880,  w: 320 },     // under the high one, 880 .. 1200
                     { x: 2100, w: 360 } ];   // the right end, 2100 .. 2460

  function buildFinalBoss() {
    var floorL = { x: 300,  y: GROUND, w: 580,  h: 160, red: true };   // 300 .. 880
    var floorR = { x: 1200, y: GROUND, w: 900,  h: 160, red: true };   // 1200 .. 2100
    var lowL   = { x: 480,  y: 330,    w: 200,  h: 24, oneWay: true, red: true };
    var high   = { x: 880,  y: 210,    w: 320,  h: 24, oneWay: true, red: true };
    var lowR   = { x: 1400, y: 330,    w: 200,  h: 24, oneWay: true, red: true };

    var pitSpikes = [];
    for (var i = 0; i < FINAL_PITS.length; i++) {
      pitSpikes.push({ x: FINAL_PITS[i].x, y: 512, w: FINAL_PITS[i].w, h: 28 });
    }

    return {
      name: 'The Final Boss',
      worldW: 2400,
      start: { x: 900, y: 210 - SIZE },    // the top platform
      fallY: 620,

      solids: [floorL, floorR, lowL, high, lowR],
      hazards: pitSpikes,
      spikeballs: [],
      saws: [],
      waves: [],
      enemies: [],
      bombs: [],
      sinkers: [],
      orbs: [],

      /* sat on the floor in his throne, asleep until the scene is over */
      boss: {
        x: FINAL_GX - 37, y: 210 - 56, w: 74, h: 56,   // landed on the top platform
        vx: 120,
        hp: 3, maxHp: 3,               // three blue bombs and you win...for now
        flash: 0, dead: false, deadT: 0,
        hover: 96,
        idle: 0, rest: 1.4,
        moves: [],
        mk2: true,
        final: true,
        asleep: true
      },
      intro: { phase: 'dark', t: 0, line: 0, chars: 0, done: false },

      /* the blue bomb only - there is no key and no door here; beating
         him is the end of the room */
      pickups: [
        { kind: 'bomb', x: 0, y: 0, w: 26, h: 26, hidden: true,
          grounded: true, vy: 0, flying: false,
          home: { x: 600, y: GROUND - 26 } }
      ],
      door: { x: -9999, y: 0, w: 0, h: 0, needs: 'key' },

      arrows: [],
      hints: []
    };
  }

  var BUILDERS = [buildTutorial, buildRoomOne, buildRoomTwo,
                  buildRoomThree, buildRoomFour, buildRoomFive,
                  buildRoomSix, buildRoomSeven, buildRoomEight,
                  buildRoomNine, buildRoomTen, buildRoomEleven,
                  buildRoomTwelve, buildRoomThirteen, buildRoomFourteen,
                  buildRoomFifteen, buildRoomSixteen, buildRoomSeventeen,
                  buildRoomEighteen, buildRoomNineteen, buildRoomTwenty,
                  buildRoomTwentyOne, buildRoomTwentyTwo,
                  buildRoomTwentyThree, buildRoomTwentyFour,
                  buildRoomTwentyFive, buildFinalBoss];

  var GRAB_MAX = 2;              // seconds of being held before you die

  /* the purple one: ten hits, bigger with each, then it blows */
  var PURPLE_GROW  = 6;          // px wider and taller per hit
  var PURPLE_FUSE  = 1.2;        // seconds of flashing before it goes
  var PURPLE_BLAST = 200;        // blast radius; a bomb's is 74

  /* ============================================================
     STATE
     ============================================================ */
  var level = null;
  var levelIndex = 0;

  var p = {
    x: 0, y: 0, w: SIZE, h: SIZE,
    vx: 0, vy: 0,
    onGround: false, airJumps: 1,
    face: 1, rot: 0,
    atk: 0, cool: 0, swung: false,
    dash: 0, dashDir: 1,
    holding: null,
    dead: false, deadT: 0
  };

  var state = {
    name: 'HERO',
    running: false,
    coyote: 0,
    buffer: 0,
    picked: false,          // the room's pickup has been in your hands
    complete: false,
    cpUsed: false,          // a flag has gone down in this room
    xray: false,            // X: see the hidden blocks, but you cannot move
    grab: 0,              // how long the red cube has had hold of you
    flash: 0,
    saveT: 0,
    titleT: 0,              // room-name card countdown
    t: 0
  };

  var cam = { x: 0, y: 0 };      // y is 0 except up the final boss's jetpack course
  var particles = [];

  /* The last patch of solid ground you stood on. This is what gets
     saved, so Continue can never drop you into a pit or mid-air. */
  var safeSpot = { x: 0, y: 0 };

  /* P drops a checkpoint where you are standing, and dying puts you
     back on it instead of at the top of the room. It lives here rather
     than in `level` so that respawning - which rebuilds the room from
     scratch, blades and pads and all - does not wipe it. Leaving the
     room does: a checkpoint is for the attempt you are in the middle
     of, not something you carry around. */
  var checkpoint = null;

  /* ============================================================
     LOADING A ROOM
     ============================================================ */
  function loadLevel(i) {
    levelIndex = i;
    level = BUILDERS[i]();
    level.seekers = [];      // the second boss's yellow spikes, when it sends them

    p.x = level.start.x;
    p.y = level.start.y;
    p.vx = 0; p.vy = 0;
    p.rot = 0;
    p.onGround = false;
    p.airJumps = 1;
    p.face = 1;
    p.atk = 0; p.cool = 0; p.swung = false;
    p.dash = 0; p.dashDir = 1;
    p.yeet = 0; p.yeetVx = 0;
    p.jet = null;
    cam.y = 0;
    p.holding = null;
    p.dead = false; p.deadT = 0;

    state.picked = false;
    state.complete = false;
    state.cpUsed = false;
    state.xray = false;
    state.grab = 0;
    state.coyote = 0;
    state.buffer = 0;
    state.saveT = 0;
    state.titleT = 2.4;
    state.t = 0;            // saws restart in the same place every attempt

    safeSpot.x = level.start.x;
    safeSpot.y = level.start.y;
    checkpoint = null;

    particles.length = 0;
    cam.x = Math.max(0, Math.min(level.worldW - W, p.x + p.w / 2 - W / 2));
  }

  /* Which solid you are standing on, or null. */
  function solidUnderFeet() {
    for (var i = 0; i < level.solids.length; i++) {
      if (standingOn(level.solids[i])) return level.solids[i];
    }
    return null;
  }

  /* P drops a checkpoint under your feet, and P again while you are
     standing on it picks it back up — so a clean run of the room is
     always one keypress away.

     It only goes down when you are on your feet. A checkpoint hanging
     in mid-air over one of the voids would respawn you falling, into
     the same death, for ever.

     What gets stored is the top of the platform you are on, not your
     own y: a pad you are standing on is sinking, and respawning
     rebuilds the room with it back at its home height. Store where you
     are and you would come back buried inside it. */
  var CP_REACH = 26;

  function placeCheckpoint() {
    if (!p.onGround) return;

    if (checkpoint && Math.abs(checkpoint.x - p.x) < CP_REACH &&
        Math.abs(checkpoint.y - p.y) < CP_REACH) {
      burst(checkpoint.x + SIZE / 2, checkpoint.y + SIZE / 2,
            '#4ec3ff', 14, 0.9);
      checkpoint = null;
      return;
    }

    var s = solidUnderFeet();
    var top = s ? (s.home !== undefined ? s.home : s.y) : p.y + p.h;
    checkpoint = { x: p.x, y: top - SIZE };
    /* on the final boss's board: where the screen had got to, as well */
    if (level.chase && level.chase.on) {
      checkpoint.chaseX = level.chase.x;
      checkpoint.courseStart = level.chase.courseStart;
    }
    state.cpUsed = true;    // and that's it - no way on from this room now
    burst(p.x + p.w / 2, p.y + p.h, '#4ec3ff', 20, 1.1);
  }

  /* Dying rewinds the whole room — every pad back up, every blade back
     to where it started. A checkpoint does not stop that; it only
     changes where you are standing when it is done.

     Once a flag has gone down in a room, the door will not let you on
     to the next one - picking it up again or dying does not undo that.
     Only coming into the room afresh (Try Again) does.

     In a boss room a checkpoint also keeps your progress: the hits you
     had landed on the boss when you died are still landed when you
     come back - every boss, the final one too. */
  function respawn() {
    state.grey = false;
    var cp = checkpoint;
    var used = state.cpUsed;
    var bossHp = level.boss ? level.boss.hp : null;
    var chaseDeath = !!(level.boss && level.boss.stage);
    /* got as far as his bare red platform: that's where you come back */
    var arena3Death = !!(level.boss && (level.boss.stage === 'phase3' || level.boss.swapped));
    loadLevel(levelIndex);
    state.cpUsed = used;
    camFx.zoom = 1;
    camFx.shake = 0;
    if (level.intro && finalIntroSeen) {     // you've seen him; straight back to the fight
      level.intro.done = true;
      level.boss.asleep = false;
    }
    if (arena3Death) {
      setupPhase3();
      if (cp && cp.x >= ARENA3_X) {          // a flag down on it: there
        checkpoint = cp;
        if (bossHp > 0) level.boss.hp = bossHp;   // and your hits on him kept
        p.x = cp.x;
        p.y = cp.y;
        safeSpot.x = p.x;
        safeSpot.y = p.y;
      } else {
        checkpoint = null;
      }
      return;
    }
    /* died in the chase: back to his arena, him on one hit, so one more
       blue bomb starts it again - checkpoint or not */
    /* a flag down on the board: back on the board, the screen where it
       was when the flag went down */
    var onBoard = !!(cp && cp.chaseX !== undefined);
    if (chaseDeath && !onBoard) level.boss.hp = 1;
    if (!cp) return;
    checkpoint = cp;
    if (onBoard) resumeChase(cp.chaseX, { x: cp.x, y: cp.y, w: SIZE, h: SIZE }, cp.courseStart);
    if (level.boss && bossHp !== null && !chaseDeath) {
      level.boss.hp = bossHp;
      if (bossHp <= 0) {                     // already beaten: it stays beaten
        level.boss.dead = true;
        dropKey(level.boss);
      }
    }
    p.x = cp.x;
    p.y = cp.y;
    p.vx = 0; p.vy = 0;
    p.onGround = true;
    p.airJumps = 1;
    safeSpot.x = p.x;
    safeSpot.y = p.y;
  }

  /* ============================================================
     SAVE / CONTINUE
     Progress lives in localStorage so closing the tab doesn't cost
     you your run. (The passcode gate deliberately remembers
     nothing — that's separate, and stays that way.)
     ============================================================ */
  var SAVE_KEY = 'unnamed_save_v2';

  function readSave() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (!s || s.v !== 2) return null;
      if (typeof s.x !== 'number' || typeof s.y !== 'number') return null;
      if (typeof s.level !== 'number' || !BUILDERS[s.level]) return null;
      return s;
    } catch (e) {
      return null;
    }
  }

  function saveGame() {
    if (!state.running || !level) return;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        v: 2,
        name: state.name,
        level: levelIndex,
        x: safeSpot.x,
        y: safeSpot.y,
        picked: state.picked,
        cpUsed: state.cpUsed,
        barrierOpen: !!(level.barrier && level.barrier.open)
      }));
    } catch (e) {}
  }

  function clearSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  }

  /* ============================================================
     INPUT
     ============================================================ */
  var keys = {};
  var BLOCK = ['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];

  window.addEventListener('keydown', function (e) {
    if (BLOCK.indexOf(e.code) !== -1) e.preventDefault();
    if (!state.running) return;
    /* nothing works while he talks - except Y, the skip */
    if (!keys[e.code] && (!cutsceneRunning() || e.code === 'KeyY')) press(e.code);
    keys[e.code] = true;
  });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });
  window.addEventListener('blur', function () { keys = {}; });

  /* Three kinds of orb, and hitting jump inside one does its thing
     instead of jumping:

       dash (green)  throws you flat and fast — Room Nine's gaps
       up   (yellow) throws you 225px straight up, past a double jump
       high (red)    throws you 390px, and nothing else in the game
                     goes that high

     A red one is hung low, down where you run, because 390px from a
     jump's apex would put you through the ceiling. A yellow one hangs
     at the height a jump tops out at. Between them that is the whole
     grammar, and nobody has to be told it. */
  var ORB_COLOR = { dash: '#7bffb2', up: '#ffd166', high: '#ff5f7e' };

  function orbColor(o) { return ORB_COLOR[o.kind || 'dash']; }

  function tryOrb() {
    for (var i = 0; i < level.orbs.length; i++) {
      var o = level.orbs[i];
      /* the ring is small, the catch is forgiving — same as Geometry Dash */
      if (!circleHitsBox(o.x, o.y, ORB_CATCH, p)) continue;
      var kind = o.kind || 'dash';
      if (kind === 'dash') {
        p.dash = DASH_TIME;
        p.dashDir = p.face;
        p.vy = 0;
      } else {
        p.dash = 0;
        p.vy = -(kind === 'high' ? HIGH_V : UP_V);
      }
      p.airJumps = 1;                  // the orb hands your air jump back
      burst(o.x, o.y, orbColor(o), 26, 1.4);
      return true;
    }
    return false;
  }

  function press(code) {
    if (p.dead || state.complete) return;
    if (code === 'KeyX') state.xray = !state.xray;
    if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW') {
      if (state.xray) return;          // no moving while you look
      if (tryOrb()) return;
      state.buffer = BUFFER;
    }
    if (code === 'KeyI') attack();
    if (code === 'KeyB') toggleCarry();
    if (code === 'KeyP') placeCheckpoint();
    if (code === 'KeyR') respawn();
    if (code === 'KeyY') skipToChase();
  }

  /* Y: straight to the final boss's conveyor chase, from anywhere -
     past the scene and the fight, stood at the end of his floor. */
  function skipToChase() {
    var last = BUILDERS.length - 1;
    var st = levelIndex === last && level.boss ? level.boss.stage : null;
    /* on the chase already: Y goes on to his bare red platform */
    if (st === 'grow' || st === 'chase' || st === 'toArena') {
      camFx.zoom = 1;
      camFx.shake = 0;
      checkpoint = null;
      setupPhase3();
      saveGame();
      return;
    }
    if (st) return;                    // there already, or getting angry
    if (levelIndex !== last) loadLevel(last);
    level.intro.done = true;
    finalIntroSeen = true;
    state.titleT = 0;
    var b = level.boss;
    b.asleep = false;
    b.hp = 0;
    p.x = BOARD_X - 200;
    p.y = GROUND - SIZE;
    p.vx = 0; p.vy = 0;
    p.onGround = true;
    safeSpot.x = p.x;
    safeSpot.y = p.y;
    cam.x = p.x + p.w / 2 - W / 2;
    b.x = cam.x + W - 170;
    b.y = GROUND - b.h;
    startFinalScroll(b);
    saveGame();
  }

  function attack() {
    if (p.cool > 0) return;
    p.atk = ATK_TIME;
    p.cool = ATK_COOL;
    p.swung = false;
  }

  function toggleCarry() {
    if (p.jet) return;                 // strapped on: no letting go of it
    if (p.holding) {
      var held = p.holding;
      held.x = p.x + p.w / 2 - held.w / 2 + p.face * 18;
      held.y = p.y;
      held.held = false;
      held.grounded = false;
      held.vy = 0;
      p.holding = null;

      /* let go of the blue bomb and it goes looking for the boss */
      if (held.kind === 'bomb' && level.boss && !level.boss.dead) {
        held.flying = true;
        /* the second boss's goes straight up from over your head - it
           is up to you to be under the boss */
        if (level.boss.mk2) {
          held.x = p.x + p.w / 2 - held.w / 2;
          held.y = p.y - held.h - 8;
          held.vy = -1100;
        }
        burst(held.x + held.w / 2, held.y + held.h / 2, '#4ec3ff', 16);
      }
      return;
    }

    /* grab whichever loose thing is nearest */
    var best = null, bestD = 1e9;
    for (var i = 0; i < level.pickups.length; i++) {
      var c = level.pickups[i];
      if (c.hidden || c.held || c.flying) continue;
      if (!near(p, c, 58)) continue;
      var d = Math.abs((p.x + p.w / 2) - (c.x + c.w / 2));
      if (d < bestD) { bestD = d; best = c; }
    }
    if (!best) return;

    best.held = true;
    p.holding = best;
    /* the final boss's last part: his blue bomb is a jetpack */
    if (best.kind === 'bomb' && level.boss && level.boss.stage === 'phase3' && !p.jet) startJet();
    if (level.door.needs && best.kind === level.door.needs) state.picked = true;
    burst(best.x + best.w / 2, best.y + best.h / 2,
          best.kind === 'key' ? '#ffd166' : '#ff5f7e', 12);
    saveGame();
  }

  function near(a, b, d) {
    var ax = a.x + a.w / 2, ay = a.y + a.h / 2;
    var bx = b.x + b.w / 2, by = b.y + b.h / 2;
    return Math.abs(ax - bx) < d && Math.abs(ay - by) < d + 20;
  }

  /* ============================================================
     PHYSICS
     ============================================================ */
  function activeSolids() {
    if (level.barrier && !level.barrier.open) {
      return level.solids.concat([level.barrier]);
    }
    return level.solids;
  }

  function hits(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  /* Where a saw sits right now. It slides between (x0,y0) and (x1,y1),
     so the same thing does both the vertical blades in Room Two and the
     ones skating along platform tops in Room Four. Phase 0 is end one. */
  function sawPos(sw) {
    var u = (1 - Math.cos((state.t / sw.period + sw.phase) * Math.PI * 2)) / 2;
    return {
      x: sw.x0 + (sw.x1 - sw.x0) * u,
      y: sw.y0 + (sw.y1 - sw.y0) * u
    };
  }

  /* How far a bed of spikes is out of the floor right now, 0 to 1.
     They spend longer down than up, so there's always a way through. */
  function waveOut(wv) {
    var u = (1 - Math.cos((state.t / wv.period + wv.phase) * Math.PI * 2)) / 2;
    return Math.max(0, (u - 0.5) / 0.5);
  }

  /* A bed comes up out of the floor unless it says which surface -
     Room Fourteen's platforms carry their own. */
  function waveBase(wv) { return wv.y !== undefined ? wv.y : GROUND; }

  function waveBox(wv) {
    var out = waveOut(wv);
    return { x: wv.x, y: waveBase(wv) - wv.h * out, w: wv.w, h: wv.h * out };
  }

  /* 0 while a bed is quiet, ramping to 1 over the last WAVE_TELL seconds
     before it fires. Spikes that appear with no notice aren't a test of
     anything — you want to see it coming and choose to move. */
  var WAVE_TELL = 0.7;

  function waveWarn(wv) {
    if (waveOut(wv) > 0) return 0;
    var th = ((state.t / wv.period + wv.phase) % 1) * Math.PI * 2;
    var window = Math.PI * 2 * WAVE_TELL / wv.period;
    var fires = Math.PI / 2;                 // where it starts coming up
    if (th >= fires - window && th < fires) return (th - (fires - window)) / window;
    return 0;
  }

  /* Saws are drawn round, so judge them round — squaring them off
     would kill you for near misses that visibly cleared the blade. */
  function circleHitsBox(cx, cy, r, b) {
    var nx = Math.max(b.x, Math.min(cx, b.x + b.w));
    var ny = Math.max(b.y, Math.min(cy, b.y + b.h));
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  /* The door only wants a key if the room says so - and then you have
     to be carrying it as you walk through, not just have picked it up. */
  function doorReady() {
    return !level.door.needs ||
           (!!p.holding && p.holding.kind === level.door.needs);
  }

  function movePlayer(dt) {
    var list = activeSolids();
    var i, s;

    /* a conveyor belt under your feet carries you along its `belt`
       speed, on top of whatever you are doing yourself - X-ray too */
    var carry = 0;
    if (p.onGround) {
      var under = solidUnderFeet();
      if (under && under.belt) carry = under.belt;
    }
    carry += windPush();                       // the final boss's fan, in the chase
    var dx = (p.vx + carry) * dt;

    p.x += dx;
    for (i = 0; i < list.length; i++) {
      s = list[i];
      if (s.oneWay) continue;                   // never blocks from the side
      if (!hits(p, s)) continue;
      if (dx > 0) p.x = s.x - p.w;
      else if (dx < 0) p.x = s.x + s.w;
      p.vx = 0;
    }

    var wasAir = !p.onGround;
    var prevBottom = p.y + p.h;
    p.onGround = false;
    p.y += p.vy * dt;
    for (i = 0; i < list.length; i++) {
      s = list[i];
      if (!hits(p, s)) continue;
      /* A one-way platform only exists when you're coming down onto it,
         so you can jump up through the underside and land on top. */
      if (s.oneWay && (p.vy <= 0 || prevBottom > s.y + 0.5)) continue;
      if (p.vy > 0) {
        p.y = s.y - p.h;
        if (wasAir && p.vy > 320) burst(p.x + p.w / 2, p.y + p.h, '#4ec3ff', 8, 0.5);
        p.onGround = true;
        p.airJumps = 1;
      } else if (p.vy < 0) {
        p.y = s.y + s.h;
      }
      p.vy = 0;
    }

    if (p.x < 0) { p.x = 0; p.vx = 0; }
    if (p.x + p.w > level.worldW) { p.x = level.worldW - p.w; p.vx = 0; }
  }

  /* A belt marked `yeet` heats up red while you stand on it, and when
     it is fully red it throws you - on an arc worked out from wherever
     you are, so it lands you in the door every time. */
  var YEET_HEAT = 0.6;          // seconds on it before it goes
  var YEET_TIME = 0.85;         // how long the flight takes

  function updateYeetBelts(dt) {
    for (var i = 0; i < level.solids.length; i++) {
      var s = level.solids[i];
      if (!s.yeet) continue;
      if (!s.heat) s.heat = 0;
      if (standingOn(s) && p.yeet <= 0) {
        s.heat = Math.min(1, s.heat + dt / YEET_HEAT);
        /* land near the far end and it would carry you off before it
           was hot - so at the edge it goes at once */
        var atEdge = s.belt > 0 ? p.x + p.w > s.x + s.w - 12 : p.x < s.x + 12;
        if (atEdge) s.heat = 1;
        if (s.heat >= 1) yeetToDoor(s);
      } else if (p.yeet <= 0) {
        s.heat = Math.max(0, s.heat - dt);    // cools off if you step off
      }
    }
  }

  function yeetToDoor(s) {
    var d = level.door;
    var T = YEET_TIME;
    var tx = d.x + d.w / 2 - p.w / 2;
    var ty = d.y + d.h - p.h - 30;             // into the doorway, not the floor
    if (s.to) {                                // or onto a spot the room picked
      tx = s.to.x - p.w / 2;
      ty = s.to.y - p.h - 30;
    }
    p.yeetVx = (tx - p.x) / T;
    p.vy = (ty - p.y - 0.5 * GRAVITY * T * T) / T;
    p.yeet = T + 0.3;
    p.onGround = false;
    p.dash = 0;
    burst(p.x + p.w / 2, p.y + p.h, '#ff2d55', 40, 1.8);
    state.flash = Math.max(state.flash, 0.3);
  }

  function jump(isDouble) {
    p.vy = isDouble ? -JUMP_V2 : -JUMP_V;
    p.onGround = false;
    burst(p.x + p.w / 2, p.y + p.h,
          isDouble ? '#c7a0ff' : '#4ec3ff', isDouble ? 14 : 7, 0.6);
  }

  function die() {
    if (p.dead) return;
    p.dead = true;
    p.deadT = 0;
    state.flash = 1;
    burst(p.x + p.w / 2, p.y + p.h / 2, '#ff5f7e', 34, 1.4);
    /* against the final boss: everything goes grey for a moment
       before you are back */
    state.grey = !!(level.boss && level.boss.final && !introRunning());
  }

  var GREY_TIME = 1.2;           // how long the grey lasts before you're back

  /* ============================================================
     SINKING PLATFORMS
     They sag while you stand on them and creep back up once you're
     off. Chained ones move as one, so stepping on either sinks both.
     The player rides whatever they're standing on.
     ============================================================ */
  /* A platform's teeth. One bed is written as a plain { off, w }; a
     platform with teeth at both ends gives an array of them, and then
     the only safe landing is the strip in the middle. */
  function teethOf(s) {
    if (!s.spike) return [];
    return s.spike.length === undefined ? [s.spike] : s.spike;
  }

  function standingOn(s) {
    if (!p.onGround) return false;
    if (Math.abs((p.y + p.h) - s.y) > 2) return false;
    return p.x + p.w > s.x && p.x < s.x + s.w;
  }

  function updateSinkers(dt) {
    var list = level.sinkers;
    if (!list.length) return;
    var i, s;

    for (i = 0; i < list.length; i++) list[i].active = false;

    /* whatever you're on goes down, and so does anything sharing its chain */
    for (i = 0; i < list.length; i++) {
      if (!standingOn(list[i])) continue;
      list[i].active = true;
      if (list[i].chain) {
        for (var k = 0; k < list.length; k++) {
          if (list[k].chain === list[i].chain) list[k].active = true;
        }
      }
    }

    for (i = 0; i < list.length; i++) {
      s = list[i];
      var was = s.y;
      if (s.active) s.y = Math.min(s.home + s.max, s.y + s.rate * dt);
      else s.y = Math.max(s.home, s.y - s.back * dt);

      /* carry the player down with it rather than leaving them hovering */
      var moved = s.y - was;
      if (moved > 0 && standingOn({ x: s.x, y: was, w: s.w, h: s.h })) {
        p.y += moved;
      }
    }
  }

  /* ============================================================
     THE BOSS

     It floats, and it never comes down to your level except to crash.
     Attacks live in boss.moves, so two can run at once — a laser while
     the spikes roll, say. Every attack is survivable from somewhere:
     under a platform, on top of one, or simply elsewhere.
     ============================================================ */
  var CRASH_SPEED = 1500;

  function bossBox(b) { return { x: b.x, y: b.y, w: b.w, h: b.h }; }

  /* How far down a beam from `x` gets before something stops it. This is
     what makes hiding under a platform work, with no special cases. */
  function solidUnder(x, fromY) {
    var best = null;
    for (var i = 0; i < level.solids.length; i++) {
      var s = level.solids[i];
      if (x < s.x || x > s.x + s.w) continue;
      if (s.y < fromY) continue;
      if (!best || s.y < best.y) best = s;
    }
    return best;
  }

  function beamFloor(x, fromY) {
    var s = solidUnder(x, fromY);
    return s ? s.y : GROUND;
  }

  function startMove(b, kind) {
    var mv = { kind: kind, t: 0 };

    if (kind === 'laser') {
      /* it charges, then walks the beam across the whole arena */
      mv.dur = 5.4;
      mv.charge = 1.0;
      mv.dir = (b.x + b.w / 2) < level.worldW / 2 ? 1 : -1;
      mv.fromX = mv.dir > 0 ? 200 : level.worldW - 200 - b.w;
      mv.toX   = mv.dir > 0 ? level.worldW - 200 - b.w : 200;

    } else if (kind === 'crash') {
      /* three slams, each one wherever you happen to be standing */
      mv.dur = b.mk2 ? 8.4 : 6.6;       // the second one bounces, so give it time
      mv.slams = 3;
      mv.done = 0;
      mv.sub = 'move';
      mv.subT = 0;
      mv.through = null;                // the platform it bounced off, if any

    } else if (kind === 'spikes') {
      /* it slams the floor and spikes erupt outward from the impact,
         and they stay up — the ground turns against you */
      mv.dur = 5.6;
      mv.sub = 'move';
      mv.subT = 0;
      mv.beds = null;
      mv.since = 0;
      mv.spread = 620;                  // a teeny bit slower

    } else if (kind === 'saws') {
      /* the blades gather around it first, then it throws them at you */
      mv.dur = 8.6;
      mv.orbit = 1.7;
      mv.gather = 0.5;
      mv.dir = Math.random() < 0.5 ? 1 : -1;
      mv.speed = 380;
      mv.gapY = 170 + Math.random() * 200;
      mv.gapH = 150;
      mv.from = mv.dir > 0 ? -90 : level.worldW + 90;
      mv.slots = [];
      for (var y = 470; y > 90; y -= 58) mv.slots.push(y);

      /* The second boss throws them faster, and leaves exactly one blade
         out: the one level with the floor, the low platforms, or the
         high one - so there is always somewhere to stand in it. */
      if (b.mk2) {
        mv.speed = 600;
        var open = [412, 296, 180];
        mv.gapY = open[Math.floor(Math.random() * open.length)];
        mv.gapH = 58;
        mv.dur = mv.orbit + mv.gather + (level.worldW + 180) / mv.speed + 0.2;
      }

    } else if (kind === 'bombs') {
      mv.dur = b.mk2 ? 7.0 : 5.2;
      mv.dropped = 0;
      mv.blueDropped = false;
      mv.vx = (Math.random() < 0.5 ? 1 : -1) * 440;   // the second one races about

    } else if (kind === 'seekers') {
      /* two yellow spikes, sent after you; they outlive the move */
      mv.dur = 1.0;
      mv.sent = false;
    }
    if (b.stage === 'phase3') phase3Move(b, mv);
    else if (b.final) finalMove(b, mv);
    b.moves.push(mv);
  }

  /* The last part of the final fight, on his bare red platform: his
     attacks again, angrier, and three of his own.
       crash      six slams, no break between them
       seekers    two yellow stars, smaller and slower
       spikeballs and him racing back and forth
       saws       five walls from alternate sides; the way through is the
                  ground slot, or the 2nd and 3rd up, or the 3rd and 4th
       helpers    ten reds
       screech    two yellow guys up in the corners; a dotted line
                  follows you, then each charges down it at you - one, then the other
       rain       5 to 9 spikes dropped on the floor, which stay for two
                  more attacks and then sink away
       fire       ten fireballs, one every second, aimed at you
       bombs      they go off the moment they land, he races, and the blue
                  one comes 8 to 13 seconds in */
  var P3_SLAMS      = 6;
  var P3_RACE       = 800;       // him back and forth, in the spike balls
