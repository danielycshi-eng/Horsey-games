        if (p.vx > 0) p.vx = Math.max(0, p.vx - FRICTION * dt);
        else if (p.vx < 0) p.vx = Math.min(0, p.vx + FRICTION * dt);
      }

      /* --- jumping: coyote time + input buffer so it feels fair --- */
      if (p.onGround) state.coyote = COYOTE;
      else state.coyote = Math.max(0, state.coyote - dt);
      state.buffer = Math.max(0, state.buffer - dt);

      if (p.jet) {
        /* the jetpack: hold jump and it lifts you, let go and you fall */
        state.buffer = 0;
        p.jet.thrust = !!(keys.Space || keys.ArrowUp || keys.KeyW);
        if (p.jet.thrust) p.vy = Math.max(-JET_MAX, p.vy - (GRAVITY + JET_ACCEL) * dt);
      } else if (state.buffer > 0) {
        if (p.onGround || state.coyote > 0) {
          jump(false);
          p.airJumps = 1;
          state.coyote = 0;
          state.buffer = 0;
        } else if (p.airJumps > 0) {
          p.airJumps--;
          jump(true);
          state.buffer = 0;
        }
      }

      // short hop: release jump early and you rise less
      if (!p.jet && p.vy < 0 && !(keys.Space || keys.ArrowUp || keys.KeyW)) p.vy += GRAVITY * 0.9 * dt;

      p.vy += GRAVITY * dt;
      if (p.vy > MAX_FALL) p.vy = MAX_FALL;
    }

    movePlayer(dt);

    updateSinkers(dt);
    updateYeetBelts(dt);

    /* --- remember safe ground, and checkpoint the save --- */
    if (p.onGround) { safeSpot.x = p.x; safeSpot.y = p.y; }
    state.saveT += dt;
    if (state.saveT > 2) { state.saveT = 0; saveGame(); }

    /* --- cube roll, Geometry Dash style --- */
    if (!p.onGround) p.rot += dt * 7.5 * (p.vx >= 0 ? 1 : -1);
    else p.rot += (0 - p.rot) * Math.min(1, dt * 14);

    /* --- attack --- */
    if (p.cool > 0) p.cool -= dt;
    if (p.atk > 0) {
      p.atk -= dt;
      if (!p.swung) {
        /* The swing covers your own body as well as the space in front,
           so something clamped onto you can always be hit off. */
        var hb = { x: p.face > 0 ? p.x : p.x - 34,
                   y: p.y - 2, w: p.w + 34, h: p.h + 4 };
        hitEnemies(hb);
        if (sc && sc.hp > 0 && hits(hb, sc)) {
          sc.hp--;
          sc.flash = 0.16;
          sc.shake = 0.28;
          burst(sc.x + sc.w / 2, sc.y + 30, '#f9c74f', 14);
          if (sc.hp <= 0) {
            sc.regen = 2.6;
            burst(sc.x + sc.w / 2, sc.y + 40, '#ffd166', 26, 1.3);
            if (!sc.everBroken) {
              sc.everBroken = true;
              if (level.barrier) {
                level.barrier.open = true;
                burst(level.barrier.x + 13, level.barrier.y + 160, '#4ec3ff', 40, 1.6);
              }
              saveGame();
            }
          }
        }
        p.swung = true;
      }
    }

    /* --- the boss and its bombs --- */
    updateBoss(dt);
    if (p.dead) return;
    updateBombs(dt);
    if (p.dead) return;
    updateArena();
    if (p.dead) return;

    /* --- carried and dropped things --- */
    for (var pi = 0; pi < level.pickups.length; pi++) {
      var item = level.pickups[pi];
      if (item.hidden) continue;

      /* a thrown blue bomb makes its own way to the boss */
      if (item.flying) {
        var bs = level.boss;
        if (!bs || bs.dead) { item.hidden = false; item.flying = false; continue; }

        /* Straight up, then - if it missed - straight back down, and it
           goes off wherever it lands. */
        if (bs.mk2) {
          item.vy += GRAVITY * dt;
          var wasBot = item.y + item.h;
          item.y += item.vy * dt;
          if (hits(item, bossBox(bs))) {
            item.flying = false;
            item.hidden = true;
            hurtBoss(bs);
            continue;
          }
          var landed = item.y > level.fallY;
          if (item.vy > 0) {
            for (var k2 = 0; k2 < level.solids.length && !landed; k2++) {
              var so2 = level.solids[k2];
              if (item.x + item.w <= so2.x || item.x >= so2.x + so2.w) continue;
              if (wasBot <= so2.y && item.y + item.h >= so2.y) {
                item.y = so2.y - item.h;
                landed = true;
              }
            }
          }
          if (landed) {
            item.flying = false;
            item.hidden = true;
            level.bombs.push({ x: item.x + item.w / 2 - 12, y: item.y + item.h - 24,
                               w: 24, h: 24, vy: 0, grounded: true,
                               fuse: 0, blast: 0 });
          }
          continue;
        }

        var tx = bs.x + bs.w / 2, ty = bs.y + bs.h / 2;
        var dx = tx - (item.x + item.w / 2), dy = ty - (item.y + item.h / 2);
        var dist = Math.sqrt(dx * dx + dy * dy) || 1;
        item.x += (dx / dist) * 640 * dt;
        item.y += (dy / dist) * 640 * dt;
        if (dist < 46) {
          item.flying = false;
          item.hidden = true;
          hurtBoss(bs);
        }
        continue;
      }

      if (item.held) {
        item.x = p.x + p.w / 2 - item.w / 2;
        item.y = p.y - item.h - 8;
      } else if (item.grounded === false) {
        item.vy += GRAVITY * dt;
        var wasBottom = item.y + item.h;
        item.y += item.vy * dt;
        var nowBottom = item.y + item.h;

        /* Sweep the fall rather than testing the item's current spot:
           a key that spawns already overlapping the floor would never
           find it otherwise, and drops straight through the world. */
        if (item.vy > 0) {
          for (var k = 0; k < level.solids.length; k++) {
            var so = level.solids[k];
            if (item.x + item.w <= so.x || item.x >= so.x + so.w) continue;
            if (wasBottom <= so.y && nowBottom >= so.y) {
              item.y = so.y - item.h;
              item.vy = 0;
              item.grounded = true;
              break;
            }
          }
        }
        /* last resort: if it somehow escapes, put it back where it fell */
        if (item.y > level.fallY) {
          item.x = item.home.x;
          item.y = item.home.y;
          item.vy = 0;
          item.grounded = true;
        }
      }
    }

    /* --- the green fellow, and whatever he gives you. `gives` names
           the kind of pickup he lets loose; without it, everything. --- */
    var npcs = npcList();
    for (var ni = 0; ni < npcs.length; ni++) {
      var npc = npcs[ni];
      if (!npc.said && Math.abs((p.x + p.w / 2) - (npc.x + npc.w / 2)) < 190) {
        npc.said = true;
        npc.t = 0;
      }
      if (!npc.said) continue;
      var before = npc.t;
      npc.t += dt;
      if (before < 1.1 && npc.t >= 1.1) {       // the gift arrives
        for (i = 0; i < level.pickups.length; i++) {
          if (npc.gives && level.pickups[i].kind !== npc.gives) continue;
          level.pickups[i].hidden = false;
          level.pickups[i].grounded = false;
        }
      }
    }

    /* --- hazards --- */
    for (i = 0; i < level.hazards.length; i++) {
      if (hits(p, level.hazards[i])) { die(); return; }
    }
    for (i = 0; i < level.waves.length; i++) {
      var wb = waveBox(level.waves[i]);
      if (wb.h > 2 && hits(p, wb)) { die(); return; }
    }
    /* spikes riding a conveyor */
    for (i = 0; i < level.solids.length; i++) {
      var rs = level.solids[i];
      if (!rs.riders) continue;
      for (var rj = 0; rj < rs.riders.length; rj++) {
        var rt = riderTeeth(rs, rs.riders[rj]);
        for (var rk = 0; rk < rt.length; rk++) {
          /* judged along the straight runs, up top and hanging below;
             going round a roller they are tucked in against it */
          var tb = null;
          if (rt[rk].side === 'top') tb = { x: rt[rk].x - 6, y: rs.y - 22, w: 12, h: 22 };
          if (rt[rk].side === 'bottom') tb = { x: rt[rk].x - 6, y: rs.y + rs.h, w: 12, h: 22 };
          if (tb && hits(p, tb)) { die(); return; }
        }
      }
    }
    /* teeth carried on a sinking platform's own surface */
    for (i = 0; i < level.sinkers.length; i++) {
      var sk = level.sinkers[i];
      var teeth = teethOf(sk);
      for (var ti = 0; ti < teeth.length; ti++) {
        if (hits(p, { x: sk.x + teeth[ti].off, y: sk.y - 22,
                      w: teeth[ti].w, h: 22 })) { die(); return; }
      }
    }
    for (i = 0; i < level.saws.length; i++) {
      var sw = level.saws[i];
      /* Saws are for you only — the reds share their platforms with one
         and must never be cut by it. */
      var at = sawPos(sw);
      if (circleHitsBox(at.x, at.y, sw.r - 4, p)) { die(); return; }
    }

    /* --- the red cube's grip: two seconds of contact and you're gone.
           Break away and the meter bleeds back down, slowly. --- */
    updateEnemies(dt);
    if (touchingAnyEnemy()) state.grab += dt;
    else state.grab = Math.max(0, state.grab - dt * 0.6);
    if (state.grab >= GRAB_MAX) { die(); return; }

    if (p.y > level.fallY) { die(); return; }

    /* --- the door out --- */
    if (doorReady() && hits(p, level.door)) {
      state.complete = true;
      burst(level.door.x + level.door.w / 2, level.door.y + 70, '#4ec3ff', 50, 1.8);
      saveGame();
      finishLevel();
      return;
    }

    /* --- camera --- */
    updateCamera(dt);
  }

  function updateCamera(dt) {
    /* up and down only on the final boss's jetpack course, and coming
       back down from it; everywhere else the camera stays level */
    var up = level.jet || (level.boss && level.boss.stage === 'phase3' && p.y < GROUND - 300);
    var ty = up ? Math.min(0, p.y + p.h / 2 - H * 0.55) : 0;
    cam.y += (ty - cam.y) * Math.min(1, dt * 8);
    if (!up && Math.abs(cam.y) < 0.5) cam.y = 0;

    if (level.chase && level.chase.on) { cam.x = level.chase.x; return; }   // autoscroll
    var target = p.x + p.w / 2 - W / 2;
    if (target < 0) target = 0;
    if (target > level.worldW - W) target = level.worldW - W;
    cam.x += (target - cam.x) * Math.min(1, dt * 9);
  }

  /* ============================================================
     THE RED CUBE
     Walks the arena, comes at you, and hangs on. It can't leave its
     platform, so there's always somewhere to back off to.
     ============================================================ */
  /* Is there floor just past the cube's toes? */
  function groundAhead(e) {
    var probe = {
      x: e.face > 0 ? e.x + e.w + 2 : e.x - 10,
      y: e.y + e.h + 2, w: 8, h: 10
    };
    for (var i = 0; i < level.solids.length; i++) {
      if (hits(probe, level.solids[i])) return true;
    }
    return false;
  }

  /* Anything at all to land on below? */
  function groundBelow(e) {
    var probe = { x: e.x, y: e.y + e.h, w: e.w, h: 240 };
    for (var i = 0; i < level.solids.length; i++) {
      if (hits(probe, level.solids[i])) return true;
    }
    return false;
  }

  function updateEnemies(dt) {
    for (var n = 0; n < level.enemies.length; n++) updateEnemy(level.enemies[n], dt);
  }

  function allDead() {
    for (var n = 0; n < level.enemies.length; n++) {
      if (!level.enemies[n].dead) return false;
    }
    return true;
  }

  function touchingAnyEnemy() {
    for (var n = 0; n < level.enemies.length; n++) {
      var e = level.enemies[n];
      if (!e.dead && !e.dormant && hits(p, e)) return true;
    }
    return false;
  }

  function updateEnemy(e, dt) {
    if (e.dead || e.dormant) return;

    if (e.flash > 0) e.flash -= dt;

    /* a lit purple stands still, flashing, and then goes up like a
       bomb - a much bigger one */
    if (e.fuse > 0) {
      e.fuse -= dt;
      if (e.fuse <= 0) {
        var cx = e.x + e.w / 2, cy = e.y + e.h / 2;
        level.bombs.push({ x: cx - 12, y: cy - 12, w: 24, h: 24,
                           vy: 0, grounded: true, fuse: 0, blast: 0.3,
                           r: PURPLE_BLAST, color: '#c77dff' });
        burst(cx, cy, '#c77dff', 90, 2.6);
        state.flash = Math.max(state.flash, 0.5);
        e.dead = true;
        if (allDead()) dropKey(e);
      }
      return;
    }

    var toward = (p.x + p.w / 2) - (e.x + e.w / 2);

    /* knockback carries it for a moment, then it comes for you again */
    if (e.knock > 0) {
      e.knock -= dt;
      e.vx -= e.vx * Math.min(1, dt * 3.5);
    } else {
      e.face = toward < 0 ? -1 : 1;
      e.vx = e.face * e.speed;
    }

    var i, s;
    e.x += e.vx * dt;

    var blocked = false;
    for (i = 0; i < level.solids.length; i++) {
      s = level.solids[i];
      if (s.oneWay) continue;
      if (!hits(e, s)) continue;
      if (e.vx > 0) e.x = s.x - e.w;
      else if (e.vx < 0) e.x = s.x + s.w;
      e.vx = 0;
      blocked = true;
    }

    e.vy += GRAVITY * dt;
    if (e.vy > MAX_FALL) e.vy = MAX_FALL;
    var ePrevBottom = e.y + e.h;
    e.y += e.vy * dt;

    e.onGround = false;
    for (i = 0; i < level.solids.length; i++) {
      s = level.solids[i];
      if (!hits(e, s)) continue;
      if (s.oneWay && (e.vy <= 0 || ePrevBottom > s.y + 0.5)) continue;
      if (e.vy > 0) { e.y = s.y - e.h; e.onGround = true; e.airJumps = 1; }
      else if (e.vy < 0) { e.y = s.y + s.h; }
      e.vy = 0;
    }

    /* --- when to jump ---
       Off the ground it jumps at a wall, at a ledge it needs to clear,
       or when you're above it. In the air it spends its second jump the
       moment it's falling with nothing underneath — which is what gets
       it across a 240px gap, same as it would for you. */
    if (e.knock <= 0) {
      if (e.onGround) {
        var wants = blocked ||
                    (p.y + p.h < e.y - 12) ||
                    !groundAhead(e);
        if (wants && Math.abs(toward) > 6) {
          e.vy = -JUMP_V;
          e.onGround = false;
          e.airJumps = 1;
        }
      } else if (e.airJumps > 0 && e.vy > 150 && !groundBelow(e)) {
        e.vy = -JUMP_V2;
        e.airJumps--;
      }
    }

    /* if it ever falls out of the world, put it back — otherwise the
       key never drops and the room can't be finished */
    if (e.y > level.fallY) {
      e.x = e.spawn.x;
      e.y = e.spawn.y - (e.h - 22);    // a swollen purple stands on the same spot
      e.vx = 0; e.vy = 0;
      e.knock = 0;
    }
  }

  /* Three hits each, and the key only comes when every one is down. */
  function hitEnemies(hb) {
    for (var n = 0; n < level.enemies.length; n++) {
      var e = level.enemies[n];
      if (e.dead || e.dormant || e.fuse > 0 || !hits(hb, e)) continue;

      e.hp--;

      /* the purple one swells with every hit, standing where it stood,
         and the last one lights it rather than killing it */
      if (e.purple) {
        if (e.hp > 0) {
          e.x -= PURPLE_GROW / 2;
          e.y -= PURPLE_GROW;
          e.w += PURPLE_GROW;
          e.h += PURPLE_GROW;
        } else {
          e.fuse = PURPLE_FUSE;
          e.vx = 0;
        }
        e.flash = 0.18;
        burst(e.x + e.w / 2, e.y + e.h / 2, '#c77dff', 16);
        continue;
      }

      e.flash = 0.18;
      e.vx = p.face * 300;             // knocked back, so one swing isn't three
      e.vy = -260;
      e.knock = 0.35;
      burst(e.x + e.w / 2, e.y + e.h / 2, '#ff5f7e', 16);

      if (e.hp <= 0) {
        e.dead = true;
        burst(e.x + e.w / 2, e.y + e.h / 2, '#ff5f7e', 40, 1.5);
        if (allDead()) dropKey(e);
      }
    }
  }

  /* The key either falls where the last one died, or appears at a fixed
     spot the room picked out — up on the top platform, say. */
  function dropKey(e) {
    var it = null;
    for (var i = 0; i < level.pickups.length; i++) {
      if (level.pickups[i].kind === level.door.needs) { it = level.pickups[i]; break; }
    }
    if (!it) return;
    it.hidden = false;
    it.held = false;

    if (it.spawnAt) {
      it.x = it.spawnAt.x;
      it.y = it.spawnAt.y;
      it.vy = 0;
      it.grounded = true;
    } else {
      it.x = e.x + e.w / 2 - it.w / 2;
      it.y = e.y + e.h - it.h;         // flush with its feet, not its head
      it.vy = -200;
      it.grounded = false;
    }
    it.home = { x: it.x, y: it.y };
    burst(it.x + it.w / 2, it.y, '#ffd166', 22, 1.2);
  }

  /* ============================================================
     DRAW
     ============================================================ */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackground() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#131a3d');
    g.addColorStop(1, '#05070f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.strokeStyle = 'rgba(78,195,255,0.07)';
    ctx.lineWidth = 1;
    var off = (cam.x * 0.35) % 60;
    var x, y;
    for (x = -off; x < W; x += 60) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (y = 0; y < H; y += 60) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.16;
    for (var i = 0; i < 5; i++) {
      var span = W + 300;
      var bx = ((i * 430 - cam.x * 0.18) % span + span) % span - 150;
      var by = 70 + (i % 3) * 120 + Math.sin(state.t * 0.6 + i) * 10;
      ctx.fillStyle = i % 2 ? '#4e7fff' : '#c7a0ff';
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(state.t * 0.25 + i);
      ctx.fillRect(-22, -22, 44, 44);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawSolid(s) {
    /* a sinking platform hangs from a chain, and the chain pays out as
       it drops — chained pairs share a colour so you can see the link */
    if (s.home !== undefined && (!s.hideChain || state.xray)) {
      var tone = s.chain === 'a' ? '#ffd166' : s.chain === 'b' ? '#7bffb2' : '#5c6579';
      ctx.save();
      ctx.strokeStyle = tone;
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = 3;
      ctx.setLineDash([7, 7]);
      ctx.beginPath();
      ctx.moveTo(s.x + 18, 0);
      ctx.lineTo(s.x + 18, s.y);
      ctx.moveTo(s.x + s.w - 18, 0);
      ctx.lineTo(s.x + s.w - 18, s.y);
      ctx.stroke();
      ctx.restore();

      if (s.chain) {                            // a tag at each end of a pair
        ctx.save();
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = tone;
        ctx.fillRect(s.x + 8, s.y - 7, 14, 5);
        ctx.fillRect(s.x + s.w - 22, s.y - 7, 14, 5);
        ctx.restore();
      }
    }

    /* teeth sitting on part of the platform's own surface - `spikeGhost`
       teeth only show under X-ray, though the platform itself does */
    var bed = (s.spikeGhost && !state.xray) ? [] : teethOf(s);
    for (var bi = 0; bi < bed.length; bi++) {
      var tx = s.x + bed[bi].off, tw = bed[bi].w;
      ctx.fillStyle = '#ff5f7e';
      ctx.shadowColor = '#ff5f7e';
      ctx.shadowBlur = 14;
      for (var sx = tx; sx < tx + tw - 1; sx += tw / 3) {
        ctx.beginPath();
        ctx.moveTo(sx, s.y);
        ctx.lineTo(sx + tw / 6, s.y - 22);
        ctx.lineTo(sx + tw / 3, s.y);
        ctx.closePath();
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }

    if (s.wood) { drawBoard(s); return; }
    if (s.belt) { drawBelt(s); return; }
    if (s.block) { drawCrate(s.x, s.y, s.w, s.h); return; }
    if (s.plank) { drawPlank(s.x, s.y, s.w, s.h); return; }

    /* `red`: the final boss's floor and platforms */
    ctx.fillStyle = s.red ? '#4d1622' : '#16224d';
    ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = s.red ? 'rgba(255,45,85,0.10)' : 'rgba(78,195,255,0.10)';
    ctx.fillRect(s.x, s.y, s.w, Math.min(10, s.h));
    ctx.fillStyle = s.red ? '#ff2d55' : '#4ec3ff';
    ctx.shadowColor = s.red ? '#ff2d55' : '#4ec3ff';
    ctx.shadowBlur = 14;
    ctx.fillRect(s.x, s.y - 3, s.w, 5);
    ctx.shadowBlur = 0;
  }

  /* ---- wood: the chase's board, its planks and its crates ----
     Built up in layers so it reads as wood: a warm gradient, a lit top
     edge and a dark underside, grain running along each plank, seams
     where the planks butt together, and nails either side of a seam. */
  var WOOD_LIGHT = '#b07a44', WOOD_MID = '#8a5a30', WOOD_DARK = '#5a3618',
      WOOD_EDGE = '#d9a066', WOOD_GRAIN = 'rgba(60,30,10,0.35)';

  /* a small, cheap number from a position, so the grain sits still */
  function woodHash(n) {
    var s = Math.sin(n * 12.9898) * 43758.5453;
    return s - Math.floor(s);
  }

  /* one plank lying flat, from x to x+w */
  function drawPlankBody(x, y, w, h, seed, from, to) {
    from = from === undefined ? x : Math.max(x, from);
    to = to === undefined ? x + w : Math.min(x + w, to);
    if (to <= from) return;
    var g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, WOOD_LIGHT);
    g.addColorStop(0.55, WOOD_MID);
    g.addColorStop(1, WOOD_DARK);
    ctx.fillStyle = g;
    ctx.fillRect(from, y, to - from, h);

    /* grain: long, slightly wavy lines, a knot now and then */
    ctx.strokeStyle = WOOD_GRAIN;
    ctx.lineWidth = 1;
    var lines = Math.max(1, Math.floor(h / 6));
    for (var i = 0; i < lines; i++) {
      var gy = y + (i + 0.6) * h / (lines + 0.2);
      var amp = 0.6 + woodHash(seed + i) * 1.2;
      ctx.beginPath();
      ctx.moveTo(from, gy);
      for (var gx = from; gx < to; gx += 24) {
        var nx = Math.min(to, gx + 24);
        ctx.quadraticCurveTo(gx + 12, gy + Math.sin((gx + seed * 7) * 0.05) * amp * 2, nx, gy);
      }
      ctx.stroke();
    }
    for (var kx = x + 30 + woodHash(seed) * 60; kx < to; kx += 140 + woodHash(kx) * 80) {
      if (kx < from) continue;
      ctx.fillStyle = 'rgba(60,30,10,0.45)';
      ctx.beginPath();
      ctx.ellipse(kx, y + h * (0.35 + woodHash(kx) * 0.3), 5, 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = WOOD_EDGE;                         // the lit top edge
    ctx.fillRect(from, y, to - from, 2);
    ctx.fillStyle = 'rgba(30,15,5,0.55)';              // and the shadowed bottom
    ctx.fillRect(from, y + h - 2, to - from, 2);
  }

  function drawNail(x, y) {
    ctx.fillStyle = '#3a3f4a';
    ctx.beginPath();
    ctx.arc(x, y, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(x - 1, y - 1, 1, 1);
  }

  /* where two planks butt together: a dark gap, and a nail each side */
  function drawSeam(x, y, h) {
    ctx.fillStyle = 'rgba(30,15,5,0.7)';
    ctx.fillRect(x - 1, y, 2, h);
    drawNail(x - 5, y + 5);
    drawNail(x + 5, y + 5);
    if (h > 14) { drawNail(x - 5, y + h - 5); drawNail(x + 5, y + h - 5); }
  }

  /* The chase's wooden board: two courses of planks with staggered
     seams, growing out of his floor while it's being built. */
  function drawBoard(s) {
    var c = level.chase;
    var w = Math.min(s.w, c ? c.growW : s.w);
    if (w <= 0) return;
    var from = Math.max(s.x, cam.x - 20), to = Math.min(s.x + w, cam.x + W + 20);
    if (to <= from) return;
    var half = s.h / 2, PLANK = 160, x;
    drawPlankBody(s.x, s.y, w, half, 1, from, to);
    drawPlankBody(s.x, s.y + half, w, half, 2, from, to);
    for (x = s.x + Math.ceil((from - s.x) / PLANK) * PLANK; x < to; x += PLANK) {
      drawSeam(x, s.y, half);
    }
    for (x = s.x + PLANK / 2 + Math.ceil((from - s.x - PLANK / 2) / PLANK) * PLANK; x < to; x += PLANK) {
      drawSeam(x, s.y + half, half);
    }
  }

  /* a wooden plank: the platforms the chase's conveyor drops */
  function drawPlank(x, y, w, h) {
    drawPlankBody(x, y, w, h, Math.floor(x));
    for (var sx = x + 90; sx < x + w - 20; sx += 90) drawSeam(sx, y, h);
    drawNail(x + 5, y + h / 2);
    drawNail(x + w - 5, y + h / 2);
  }

  /* a wooden crate: horizontal slats in a frame, with a brace plank
     across it corner to corner, and nails where the brace meets the
     frame */
  function drawCrate(x, y, w, h) {
    var slats = 3, sh = h / slats;
    for (var i = 0; i < slats; i++) drawPlankBody(x, y + i * sh, w, sh, Math.floor(x) + i * 5);

    /* the brace */
    var len = Math.sqrt(w * w + h * h), ang = Math.atan2(h - 12, w - 12);
    ctx.save();
    ctx.translate(x + 6, y + 6);
    ctx.rotate(ang);
    drawPlankBody(0, -4, len - 17, 8, Math.floor(y));
    ctx.restore();

    /* the frame */
    ctx.strokeStyle = WOOD_DARK;
    ctx.lineWidth = 6;
    ctx.strokeRect(x + 3, y + 3, w - 6, h - 6);
    ctx.strokeStyle = WOOD_EDGE;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.strokeStyle = 'rgba(255,220,170,0.25)';
    ctx.strokeRect(x + 6.5, y + 6.5, w - 13, h - 13);

    drawNail(x + 6, y + 6);
    drawNail(x + w - 6, y + 6);
    drawNail(x + 6, y + h - 6);
    drawNail(x + w - 6, y + h - 6);
  }

  /* Everything else of the chase: the conveyor overhead, his hangers,
     the wind, what's falling, what's floating, and the finish. */
  function drawChase() {
    var c = level.chase, b = level.boss;
    if (!c) return;
    var i;

    if (b.stage === 'chase') {                         // the wind, streaming back at you
      ctx.save();
      ctx.strokeStyle = 'rgba(220,235,255,0.35)';
      ctx.lineWidth = 2;
      var fanX = b.x - 10;
      for (i = 0; i < 18; i++) {
        var run = (state.t * 700 + i * 137) % 700;
        var sx = fanX - run;
        var sy = GROUND - 200 + ((i * 59) % 190);
        ctx.globalAlpha = 0.35 * (1 - run / 700);
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx - 46, sy);
        ctx.stroke();
      }
      ctx.restore();
    }

    /* the conveyor along the top of the screen, going with it: its top
       runs toward its left end, and that end is the edge things go off.
       It slides in from the right while the board grows. */
    var slide = b.stage === 'grow' ? (1 - Math.min(1, b.stageT / CHASE_GROW)) * (W - BELT_EDGE + 60) : 0;
    drawBelt({ x: cam.x + BELT_EDGE + slide, y: BELT_Y, w: BELT_START + 40 - BELT_EDGE, h: 18,
               belt: -BELT_REL });

    /* what it is carrying, and what it has let go of */
    for (i = 0; i < c.items.length; i++) {
      var f = c.items[i];
      if (f.phase !== 'ride' && f.phase !== 'fall') continue;
      if (f.kind === 'plat') {
        drawPlank(f.x, f.y, f.w, f.h);
      } else if (f.kind === 'box') {
        drawCrate(f.x, f.y, f.w, f.h);
      } else if (f.kind === 'spike' || f.kind === 'floor') {
        drawHazard(f);                 // the same tooth it'll be once it lands
      } else if (f.kind === 'red') {
        ctx.fillStyle = '#ff5f7e';
        ctx.shadowColor = '#ff5f7e';
        ctx.shadowBlur = 18;
        rr(f.x, f.y, f.w, f.h, 5);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      /* orbs and spike balls draw themselves; they are live already */
      if (f.phase === 'fall' && f.w) {
        ctx.save();                    // its shadow on the board
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#000';
        ctx.fillRect(f.x, GROUND - 3, f.w, 3);
        ctx.restore();
      }
    }

    for (i = 0; i < c.floats.length; i++) {
      var o = c.floats[i];
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(o.rot);
      ctx.fillStyle = '#ff2d55';
      ctx.shadowColor = '#ff2d55';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      for (var k = 0; k < 12; k++) {
        var a0 = (k / 12) * Math.PI * 2, a1 = ((k + 0.5) / 12) * Math.PI * 2;
        ctx.lineTo(Math.cos(a0) * (o.r + 7), Math.sin(a0) * (o.r + 7));
        ctx.lineTo(Math.cos(a1) * o.r * 0.8, Math.sin(a1) * o.r * 0.8);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

  }

  /* A screecher: a yellow bat. A round body with two pointed ears and
     mean eyes, and a pair of scalloped wings that flap - folded back
     into a dart while it charges. `size` is about its body's width. */
  function drawBat(x, y, size, face, charging) {
    var col = '#ffd166';
    var flap = charging ? -0.15 : Math.sin(state.t * 18);   // -1 down .. 1 up
    var span = size * (charging ? 0.9 : 1.25);
    var r = size * 0.36;

    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = 16;

    /* the wings, one each side: a top edge out to the tip, then three
       scallops back in along the bottom */
    for (var s = -1; s <= 1; s += 2) {
      var tipX = s * span, tipY = -flap * size * 0.45 - size * 0.1;
      ctx.beginPath();
      ctx.moveTo(s * r * 0.6, -r * 0.35);
      ctx.quadraticCurveTo(s * span * 0.55, tipY - size * 0.35, tipX, tipY);
      var bx0 = tipX, by0 = tipY;
      for (var k = 1; k <= 3; k++) {
        var tx = s * (span - k * (span - r * 0.6) / 3);
        var ty = r * 0.35 + (tipY - r * 0.35) * (1 - k / 3) * 0.6;
        ctx.quadraticCurveTo((bx0 + tx) / 2, Math.max(by0, ty) - size * 0.08, tx, ty);
        bx0 = tx; by0 = ty;
      }
      ctx.closePath();
      ctx.fill();
    }

    /* the body and its ears */
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    for (var e = -1; e <= 1; e += 2) {
      ctx.beginPath();
      ctx.moveTo(e * r * 0.25, -r * 0.8);
      ctx.lineTo(e * r * 0.65, -r * 1.55);
      ctx.lineTo(e * r * 0.85, -r * 0.55);
      ctx.closePath();
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    /* mean little eyes, looking your way, and a fang */
    ctx.fillStyle = '#3a2a05';
    ctx.fillRect(face * r * 0.15 - r * 0.45, -r * 0.25, r * 0.3, r * 0.32);
    ctx.fillRect(face * r * 0.15 + r * 0.15, -r * 0.25, r * 0.3, r * 0.32);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(face * r * 0.1 - r * 0.08, r * 0.3);
    ctx.lineTo(face * r * 0.1, r * 0.6);
    ctx.lineTo(face * r * 0.1 + r * 0.08, r * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* The blue bomb strapped on as a jetpack, and its flame while you
     hold jump. */
  function drawJetpack() {
    if (!p.jet || p.dead) return;
    var bx = p.x + p.w / 2 - p.face * (p.w / 2 + 6), by = p.y + p.h / 2;
    if (p.jet.thrust) {
      var fl = 18 + Math.random() * 14;
      ctx.save();
      ctx.fillStyle = '#ff8c42';
      ctx.shadowColor = '#ff8c42';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.moveTo(bx - 7, by + 10);
      ctx.lineTo(bx, by + 10 + fl);
      ctx.lineTo(bx + 7, by + 10);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.moveTo(bx - 4, by + 10);
      ctx.lineTo(bx, by + 10 + fl * 0.6);
      ctx.lineTo(bx + 4, by + 10);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.save();
    ctx.fillStyle = '#4ec3ff';
    ctx.shadowColor = '#4ec3ff';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(bx, by, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#8a93ad';                       // the nozzle
    ctx.fillRect(bx - 5, by + 6, 10, 6);
    /* the fuse, burning down: shorter as time runs out */
    var left = p.jet.fuse / JET_FUSE;
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx, by - 12);
    ctx.lineTo(bx + 3, by - 12 - 12 * left);
    ctx.stroke();
    if (Math.sin(state.t * 30) > 0) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(bx + 2, by - 14 - 12 * left, 3, 3);
    }
    ctx.restore();
  }

  /* the fuse, counting down, big across the top of the screen */
  function drawJetHUD() {
    if (!p.jet) return;
    var s = Math.max(0, p.jet.fuse);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = 'bold 28px sans-serif';
    ctx.fillStyle = s < 5 && Math.sin(state.t * 20) > 0 ? '#ffffff' : (s < 10 ? '#ff2d55' : '#4ec3ff');
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 16;
    ctx.fillText('FUSE ' + s.toFixed(1), W / 2, 70);
    ctx.font = '12px sans-serif';
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#8ea7d6';
    ctx.fillText('HOLD SPACE TO FLY  -  GET IT TO HIM', W / 2, 90);
    ctx.restore();
  }

  /* Dead, against the final boss: everything goes grey, and then
     you're back. */
  function drawDeathGrey() {
    if (!p.dead || !state.grey) return;
    ctx.save();
    ctx.globalCompositeOperation = 'saturation';
    ctx.fillStyle = '#808080';
    ctx.globalAlpha = Math.min(1, p.deadT / 0.3);
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  /* the fan on its own, once it has come off the throne */
  function drawFanAt(x, y, r, rot) {
    ctx.save();
    ctx.fillStyle = '#2b2f36';
    ctx.strokeStyle = '#8a93ad';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = '#c9d2e6';
    for (var bl = 0; bl < 4; bl++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath();
      ctx.ellipse(r * 0.45, 0, r * 0.45, r * 0.16, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /* A factory conveyor: a grey rubber belt looped round a roller at
     each end, with cleats across it that travel the way it carries you
     - along the top, and back the other way underneath. */
  /* Spikes that ride a belt. Each rider is a pair of teeth fixed to
     the rubber, so they go all the way round with it: along the top,
     round the right-hand roller, back along the bottom hanging upside
     down, round the left-hand roller and up over the top again.

     `off` is where on that loop the pair starts. The loop is measured
     clockwise from the top of the left roller, so a belt running right
     moves its riders forward along it and one running left, back. */
  var RIDER_TOOTH = 16;

  /* The point `u` along the loop, and which way is outward there. */
  function beltLoopAt(s, u) {
    var r = s.h / 2;
    var x0 = s.x + r, x1 = s.x + s.w - r, cy = s.y + r;
    var run = x1 - x0, arc = Math.PI * r;
    var P = 2 * run + 2 * arc;
    u = ((u % P) + P) % P;
    var a;
    if (u < run) return { x: x0 + u, y: s.y, ang: -Math.PI / 2, side: 'top' };
    u -= run;
    if (u < arc) {
      a = -Math.PI / 2 + u / r;
      return { x: x1 + Math.cos(a) * r, y: cy + Math.sin(a) * r, ang: a, side: 'round' };
    }
    u -= arc;
    if (u < run) return { x: x1 - u, y: s.y + s.h, ang: Math.PI / 2, side: 'bottom' };
    u -= run;
    a = Math.PI / 2 + u / r;
    return { x: x0 + Math.cos(a) * r, y: cy + Math.sin(a) * r, ang: a, side: 'round' };
  }

  /* The two teeth of a rider, each at the middle of its base. */
  function riderTeeth(s, off) {
    var u = off + state.t * s.belt;
    return [ beltLoopAt(s, u + RIDER_TOOTH / 2),
             beltLoopAt(s, u + RIDER_TOOTH * 1.5) ];
  }

  function drawBelt(s) {
    var r = s.h / 2;                           // the rollers fill its height
    var x0 = s.x + r, x1 = s.x + s.w - r;
    var cy = s.y + r;
    var CLEAT = 18;
    var off = ((state.t * s.belt) % CLEAT + CLEAT) % CLEAT;

    ctx.save();

    /* the belt: a long rounded loop */
    ctx.fillStyle = '#2b2f36';
    rr(s.x, s.y, s.w, s.h, r);
    ctx.fill();

    /* a yeet belt going red as it heats up under you */
    if (s.heat > 0) {
      ctx.save();
      ctx.globalAlpha = s.heat;
      ctx.fillStyle = '#c0182f';
      ctx.shadowColor = '#ff2d55';
      ctx.shadowBlur = 18 * s.heat;
      rr(s.x, s.y, s.w, s.h, r);
      ctx.fill();
      ctx.restore();
    }

    /* its top run, a little lighter where the light catches it */
    ctx.fillStyle = s.heat > 0.5 ? '#ff6b80' : '#6b717c';
    ctx.fillRect(x0, s.y, x1 - x0, 3);

    /* the cleats, clipped to the straight runs */
    ctx.beginPath();
    ctx.rect(x0, s.y, x1 - x0, s.h);
    ctx.clip();
    ctx.fillStyle = '#4a4f58';
    for (var cx = x0 - CLEAT + off; cx < x1 + CLEAT; cx += CLEAT) {
      ctx.fillRect(cx, s.y, 4, 4);                            // top, going
      ctx.fillRect(x0 + x1 - cx - 4, s.y + s.h - 4, 4, 4);    // under, coming back
    }
    ctx.restore();

    /* the rollers, turning with it */
    var spin = state.t * s.belt / r;
    for (var k = 0; k < 2; k++) {
      var rx = k === 0 ? x0 : x1;
      ctx.save();
      ctx.translate(rx, cy);
      ctx.fillStyle = '#8a909b';
      ctx.beginPath();
      ctx.arc(0, 0, r - 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.rotate(spin);
      ctx.strokeStyle = '#3a3e46';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-(r - 3), 0);
      ctx.lineTo(r - 3, 0);
      ctx.moveTo(0, -(r - 3));
      ctx.lineTo(0, r - 3);
      ctx.stroke();
      ctx.fillStyle = '#c4c9d1';
      ctx.beginPath();
      ctx.arc(0, 0, 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      /* a tiny green arrow on the hub, pointing the way it carries you
         - it doesn't turn with the roller */
      var ad = s.belt > 0 ? 1 : -1;
      ctx.save();
      ctx.translate(rx, cy);
      ctx.fillStyle = '#7bffb2';
      ctx.shadowColor = '#7bffb2';
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.moveTo(4 * ad, 0);
      ctx.lineTo(-2 * ad, -3.5);
      ctx.lineTo(-2 * ad, 3.5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    /* the spikes riding on it */
    if (s.riders) {
      ctx.save();
      ctx.fillStyle = '#ff5f7e';
      ctx.shadowColor = '#ff5f7e';
      ctx.shadowBlur = 12;
      for (var ri = 0; ri < s.riders.length; ri++) {
        var teeth2 = riderTeeth(s, s.riders[ri]);
        for (var t2 = 0; t2 < teeth2.length; t2++) {
          var tt = teeth2[t2];
          ctx.save();
          ctx.translate(tt.x, tt.y);
          ctx.rotate(tt.ang + Math.PI / 2);   // point straight out from the belt
          ctx.beginPath();
          ctx.moveTo(-RIDER_TOOTH / 2, 0);
          ctx.lineTo(0, -22);
          ctx.lineTo(RIDER_TOOTH / 2, 0);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }
      ctx.restore();
    }
  }

  function drawHazard(hz) {
    ctx.fillStyle = '#ff5f7e';
    ctx.shadowColor = '#ff5f7e';
    ctx.shadowBlur = 16;
    var step = 34;
    var n = Math.max(1, Math.floor(hz.w / step));
    var wide = hz.w / n;
    for (var i = 0; i < n; i++) {
      var x = hz.x + i * wide;
      ctx.beginPath();
      if (hz.down) {                   // hanging under a platform, points down
        ctx.moveTo(x, hz.y);
        ctx.lineTo(x + wide / 2, hz.y + hz.h);
        ctx.lineTo(x + wide, hz.y);
      } else {
        ctx.moveTo(x, hz.y + hz.h);
        ctx.lineTo(x + wide / 2, hz.y);
        ctx.lineTo(x + wide, hz.y + hz.h);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function drawArrows() {
    var marks = level.arrows;
    if (!marks || !marks.length) return;
    var pulse = 0.55 + Math.sin(state.t * 4) * 0.35;
    for (var i = 0; i < marks.length; i++) {
      ctx.save();
      ctx.globalAlpha = pulse * (i === marks.length - 1 ? 1 : 0.7);
      ctx.strokeStyle = '#c7a0ff';
      ctx.shadowColor = '#c7a0ff';
      ctx.shadowBlur = 14;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(marks[i][0] - 18, marks[i][1] + 16);
      ctx.lineTo(marks[i][0], marks[i][1] - 8);
      ctx.lineTo(marks[i][0] + 18, marks[i][1] + 16);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawWaves() {
    for (var i = 0; i < level.waves.length; i++) {
      var wv = level.waves[i];
      var out = waveOut(wv);
      var base = waveBase(wv);

      /* the slot they come out of, so you can see where they'll be */
      ctx.fillStyle = 'rgba(255,95,126,0.10)';
      ctx.fillRect(wv.x, base - 4, wv.w, 4);

      /* the tell: the slot lights up and little nubs peek out just
         before this bed fires */
      var warn = waveWarn(wv);
      if (warn > 0) {
        var flash = 0.35 + 0.65 * warn * (0.6 + 0.4 * Math.sin(state.t * 22));
        ctx.save();
        ctx.globalAlpha = flash;
        ctx.fillStyle = '#ffd166';
        ctx.shadowColor = '#ffd166';
        ctx.shadowBlur = 12;
        ctx.fillRect(wv.x + 2, base - 5, wv.w - 4, 5);
        var nub = 3 + warn * 5;
        var nx = wv.x + wv.w / 2;             // the one nub
        ctx.beginPath();
        ctx.moveTo(nx - 7, base);
        ctx.lineTo(nx, base - nub);
        ctx.lineTo(nx + 7, base);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      if (out <= 0.02) continue;

      var h = wv.h * out;
      ctx.fillStyle = '#ff5f7e';
      ctx.shadowColor = '#ff5f7e';
      ctx.shadowBlur = 14;
      ctx.beginPath();                        // the one tooth
      ctx.moveTo(wv.x, base);
      ctx.lineTo(wv.x + wv.w / 2, base - h);
      ctx.lineTo(wv.x + wv.w, base);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawBoss() {
    var b = level.boss;
    if (!b) return;

    /* attack telegraphs and live danger, drawn behind the boss */
    for (var i = 0; i < b.moves.length; i++) {
      var mv = b.moves[i];

      if (mv.kind === 'laser') {
        var bx = b.x + b.w / 2;
        var stop = beamFloor(bx, b.y + b.h);
        if (mv.t < mv.charge) {
          var chg = mv.t / mv.charge;
          ctx.save();
          ctx.globalAlpha = 0.25 + 0.5 * chg;
          ctx.strokeStyle = '#ffd166';
          ctx.setLineDash([9, 9]);
          ctx.lineWidth = 2 + chg * 4;
          ctx.beginPath();
          ctx.moveTo(bx, b.y + b.h);
          ctx.lineTo(bx, stop);
          ctx.stroke();
          ctx.restore();
        } else {
          var pulse = 0.75 + Math.sin(state.t * 40) * 0.25;
          ctx.save();
          ctx.globalAlpha = pulse;
          ctx.fillStyle = '#ff2d55';
          ctx.shadowColor = '#ff2d55';
          ctx.shadowBlur = 30;
          ctx.fillRect(bx - 17, b.y + b.h, 34, stop - (b.y + b.h));
          ctx.fillStyle = '#fff';
          ctx.fillRect(bx - 6, b.y + b.h, 12, stop - (b.y + b.h));
          ctx.restore();
          ctx.fillStyle = 'rgba(255,45,85,0.5)';       // scorch where it lands
          ctx.fillRect(bx - 26, stop - 5, 52, 5);
        }

      } else if (mv.kind === 'crash') {
        if (mv.sub === 'hang') {
          var down = beamFloor(b.x + b.w / 2, b.y);
          ctx.save();
          ctx.globalAlpha = 0.3 + 0.4 * Math.sin(state.t * 30);
          ctx.fillStyle = '#ffd166';
          ctx.fillRect(b.x, b.y + b.h, b.w, down - (b.y + b.h));
          ctx.restore();
        }

      } else if (mv.kind === 'spikes') {
        if (mv.sub === 'hang') {
          ctx.save();
          ctx.globalAlpha = 0.35 + 0.4 * Math.sin(state.t * 30);
          ctx.fillStyle = '#ffd166';
          ctx.fillRect(b.x, b.y + b.h, b.w,
                       beamFloor(b.x + b.w / 2, b.y) - (b.y + b.h));
          ctx.restore();
        }
        if (mv.beds) {
          for (var q = 0; q < mv.beds.length; q++) {
            var bd = mv.beds[q];
            var warn = bedWarn(mv, bd);
            if (warn > 0) {
              ctx.save();
              ctx.globalAlpha = warn;
              ctx.fillStyle = '#ffd166';
              ctx.fillRect(bd.x + 2, bd.y - 5, bd.w - 4, 5);
              ctx.restore();
            }
            var out = bedOut(mv, bd);
            if (out <= 0.02) continue;
            var hgt = 44 * out;
            ctx.fillStyle = '#ff2d55';
            ctx.shadowColor = '#ff2d55';
            ctx.shadowBlur = 14;
            ctx.beginPath();                       // the one tooth
            ctx.moveTo(bd.x, bd.y);
            ctx.lineTo(bd.x + bd.w / 2, bd.y - hgt);
            ctx.lineTo(bd.x + bd.w, bd.y);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
          }
        }

      } else if (mv.kind === 'saws') {
        var blades = [];
        if (mv.walls) {
          blades = finalSawBlades(b, mv);
        } else if (mv.colX === null) {
          /* orbiting, or streaking out to the edge */
          var live = [];
          for (var s = 0; s < mv.slots.length; s++) {
            if (sawSlotBlocked(mv, mv.slots[s])) live.push(mv.slots[s]);
          }
          for (var s = 0; s < live.length; s++) {
            var o = orbitSaw(b, mv, s, live.length);
            if (mv.gathering !== undefined && mv.t >= mv.orbit) {
              var g = mv.gathering;
              blades.push({ x: o.x + (mv.from - o.x) * g,
                            y: o.y + (live[s] - o.y) * g });
            } else {
              blades.push(o);
            }
          }
        } else {
          for (var s = 0; s < mv.slots.length; s++) {
            if (!sawSlotBlocked(mv, mv.slots[s])) continue;
            blades.push({ x: mv.colX, y: mv.slots[s] });
          }
        }
        for (var s = 0; s < blades.length; s++) {
          ctx.save();
          ctx.translate(blades[s].x, blades[s].y);
          ctx.rotate(state.t * 9);
          ctx.fillStyle = '#ff2d55';
          ctx.shadowColor = '#ff2d55';
          ctx.shadowBlur = 14;
          ctx.beginPath();
          for (var k = 0; k < 10; k++) {
            var a0 = (k / 10) * Math.PI * 2;
            var a1 = ((k + 0.5) / 10) * Math.PI * 2;
            ctx.lineTo(Math.cos(a0) * 24, Math.sin(a0) * 24);
            ctx.lineTo(Math.cos(a1) * 16, Math.sin(a1) * 16);
          }
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }
    }

    /* the yellow screechers: their lines following you, then the shot */
    for (var si = 0; si < b.moves.length; si++) {
      var smv = b.moves[si];
      if (smv.kind !== 'screech') continue;
      for (var bi2 = 0; bi2 < smv.birds.length; bi2++) {
        var bd = smv.birds[bi2];
        var lockAt = 0.6 + bd.aimT, fireAt = lockAt + 0.3;
        var reach = 1600;
        var ex = bd.x + Math.cos(bd.ang) * reach, ey = bd.y + Math.sin(bd.ang) * reach;
        ctx.save();
        if (smv.t >= 0.6 && smv.t < fireAt) {
          var locked = smv.t >= lockAt;
          ctx.strokeStyle = locked ? (Math.sin(state.t * 40) > 0 ? '#ff2d55' : '#ffffff') : '#ffd166';
          ctx.globalAlpha = locked ? 0.95 : 0.7;
          ctx.lineWidth = locked ? 3 : 2;
          ctx.setLineDash([10, 9]);
          ctx.beginPath();
          ctx.moveTo(bd.x, bd.y);
          ctx.lineTo(ex, ey);
          ctx.stroke();
        } else if (bd.fired && !bd.gone) {
          /* charging: a streak behind it, back up its line */
          ctx.strokeStyle = 'rgba(255,209,102,0.5)';
          ctx.shadowColor = '#ffd166';
          ctx.shadowBlur = 18;
          ctx.lineWidth = 10;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(bd.x, bd.y);
          ctx.lineTo(bd.x - Math.cos(bd.ang) * 90, bd.y - Math.sin(bd.ang) * 90);
          ctx.stroke();
        }
        ctx.restore();
        if (!bd.gone) drawBat(bd.x, bd.y, SCREECH_SIZE, bd.x < p.x ? 1 : -1, bd.fired);
      }
    }

    /* his fireballs */
    if (level.fireballs) {
      for (var fi = 0; fi < level.fireballs.length; fi++) {
        var fb = level.fireballs[fi];
        var fg = ctx.createRadialGradient(fb.x, fb.y, 0, fb.x, fb.y, fb.r + 6);
        fg.addColorStop(0, '#ffffff');
        fg.addColorStop(0.35, '#ffd166');
        fg.addColorStop(0.7, '#ff8c42');
        fg.addColorStop(1, 'rgba(255,45,85,0)');
        ctx.fillStyle = fg;
        ctx.beginPath();
        ctx.arc(fb.x, fb.y, fb.r + 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /* the spikes he rained down: falling, standing, or sinking away */
    if (level.rainSpikes) {
      for (var ri2 = 0; ri2 < level.rainSpikes.length; ri2++) {
        var rb = rainBox(level.rainSpikes[ri2]);
        if (rb.h > 1) drawHazard({ x: level.rainSpikes[ri2].x, y: rb.y, w: P3_TOOTH, h: rb.h });
      }
    }

    /* his spike balls, rolling */
    if (level.spikeballs) {
      for (var bi = 0; bi < level.spikeballs.length; bi++) {
        var ball = level.spikeballs[bi];
        ctx.save();
        ctx.translate(ball.x, ball.y);
        ctx.rotate(ball.rot);
        ctx.fillStyle = '#ff2d55';
        ctx.shadowColor = '#ff2d55';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        for (var k = 0; k < 12; k++) {
          var a0 = (k / 12) * Math.PI * 2;
          var a1 = ((k + 0.5) / 12) * Math.PI * 2;
          ctx.lineTo(Math.cos(a0) * (ball.r + 8), Math.sin(a0) * (ball.r + 8));
          ctx.lineTo(Math.cos(a1) * ball.r * 0.8, Math.sin(a1) * ball.r * 0.8);
        }
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#4d1622';
        ctx.beginPath();
        ctx.arc(0, 0, ball.r * 0.55, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    /* the last one is the green fellow, in his throne */
    if (b.final) {
      /* the entrance itself is drawn on the black, over everything */
      if (b.rage > 0) {                                 // angry: a red glow round him
        var gr = 70 + Math.sin(state.t * 10) * 8;
        var gcx = b.x + b.w / 2, gcy = b.y + b.h / 2;
        var grad = ctx.createRadialGradient(gcx, gcy, 10, gcx, gcy, gr);
        grad.addColorStop(0, 'rgba(255,45,85,' + (0.55 * b.rage) + ')');
        grad.addColorStop(1, 'rgba(255,45,85,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(gcx, gcy, gr, 0, Math.PI * 2);
        ctx.fill();
      }
      drawFinalBoss(b, 1, 1, !b.dead && !b.asleep);
      if (level.lostFan) drawFanAt(level.lostFan.x, level.lostFan.y, 26, level.lostFan.rot);
      return;
    }

    /* the thing itself */
    ctx.save();
    ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
    var float = Math.sin(state.t * 2.2) * 3;
    ctx.fillStyle = b.flash > 0 ? '#ffffff' : (b.dead ? '#4a2030' : '#e01e3c');
    ctx.shadowColor = '#ff2d55';
    ctx.shadowBlur = 30;
    rr(-b.w / 2, -b.h / 2 + float, b.w, b.h, 12);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#2a0410';
    rr(-b.w / 2 + 9, -b.h / 2 + 10 + float, b.w - 18, b.h - 22, 7);
    ctx.fill();
    ctx.fillStyle = b.dead ? '#56658c' : '#ffd166';
    ctx.fillRect(-18, -6 + float, 13, 9);
    ctx.fillRect(5, -6 + float, 13, 9);
    ctx.restore();
  }

  /* The yellow spikes: a turning four-point star. In their last two
     seconds they flicker white, the way a bomb does before it goes. */
  function drawSeekers() {
    for (var i = 0; i < level.seekers.length; i++) {
      var s = level.seekers[i];
      var soon = (s.slow ? SEEKER_SLOW_LIFE : SEEKER_LIFE) - s.t < 2;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(state.t * 2.4 * (s.side || 1));     // the middle one spins too
      ctx.fillStyle = soon && Math.sin(state.t * 30) > 0 ? '#ffffff' : '#ffd166';
      ctx.shadowColor = '#ffd166';
      ctx.shadowBlur = soon ? 22 : 12;
      ctx.beginPath();
      for (var k = 0; k < 8; k++) {
        var a = (k / 8) * Math.PI * 2;
        var r = (k % 2 === 0 ? 17 : 6) * (s.big ? 1.55 : 1);
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function drawBombs() {
    drawSeekers();
    for (var i = 0; i < level.bombs.length; i++) {
      var bo = level.bombs[i];
      if (bo.blast > 0) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, bo.blast / 0.3);
        ctx.fillStyle = bo.color || '#ff5f7e';
        ctx.shadowColor = bo.color || '#ff5f7e';
        ctx.shadowBlur = 40;
        ctx.beginPath();
        ctx.arc(bo.x + bo.w / 2, bo.y + bo.h / 2, bo.r || 74, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        continue;
      }
      var soon = bo.fuse < 0.6;
      ctx.save();
      ctx.translate(bo.x + bo.w / 2, bo.y + bo.h / 2);
      ctx.fillStyle = soon && Math.sin(state.t * 30) > 0 ? '#ffffff' : '#8a2036';
      ctx.shadowColor = '#ff5f7e';
      ctx.shadowBlur = soon ? 20 : 8;
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(4, -10);
      ctx.lineTo(9, -17);
      ctx.stroke();
      ctx.restore();
    }
  }

  /* One cube, drawn the way the hero is drawn: a bright rounded square
     with a dark square sunk into it and two eyes looking the way it is
     going. The green fellow is the same sort of thing you are, so he
     gets exactly the same body — only the colour differs. */
  function drawCube(cx, cy, w, h, color, face, rot) {
    ctx.save();
    ctx.translate(cx, cy);
    if (rot) ctx.rotate(rot);
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    rr(-w / 2, -h / 2, w, h, 6);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#05070f';
    rr(-w / 2 + 5, -h / 2 + 5, w - 10, h - 10, 4);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(face > 0 ? 1 : -6, -6, 5, 7);
    ctx.fillRect(face > 0 ? -7 : 2, -6, 5, 7);
    ctx.restore();
  }

  /* A bubble sitting above `anchorY`, with the line typing itself out.
     `chars` is how much of it has arrived so far. */
  function drawSpeech(cx, anchorY, text, chars) {
    var shown = text.substring(0, Math.max(0, Math.floor(chars)));
    var bw = 330, bh = 74;
    var bx = cx - bw / 2, by = anchorY - bh - 22;

    ctx.fillStyle = 'rgba(5,7,15,0.88)';
    ctx.strokeStyle = '#7bffb2';
    ctx.lineWidth = 2;
    rr(bx, by, bw, bh, 10);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - 8, by + bh);
    ctx.lineTo(cx, by + bh + 12);
    ctx.lineTo(cx + 8, by + bh);
    ctx.closePath();
    ctx.fillStyle = 'rgba(5,7,15,0.88)';
    ctx.fill();

    ctx.fillStyle = '#bfffe0';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    var words = shown.split(' ');
    var line = '', lines = [];
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (test.length > 38) { lines.push(line); line = words[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    for (i = 0; i < lines.length && i < 3; i++) {
      ctx.fillText(lines[i], cx, by + 26 + i * 18);
    }
  }

  /* A room has one green fellow (`npc`) or several (`npcs`). */
  function npcList() {
    if (level.npcs) return level.npcs;
    return level.npc ? [level.npc] : [];
  }

  function drawNpc() {
    var list = npcList();
    for (var i = 0; i < list.length; i++) {
      var n = list[i];
      var bob = Math.sin(state.t * 2) * 2;
      drawCube(n.x + n.w / 2, n.y + n.h / 2 + bob, n.w, n.h, '#7bffb2',
               (p.x + p.w / 2) < (n.x + n.w / 2) ? -1 : 1, 0);

      if (n.said) drawSpeech(n.x + n.w / 2, n.y + bob, n.line, n.t * 34);
    }
  }

  /* The same fellow, in the one room where he is busy. */
  function drawRescue() {
    var r = level.rescue;
    if (!r || r.phase === 'waiting' || r.phase === 'done') return;

    var bob = Math.sin(state.t * 9) * 2;        // he is straining at it
    drawCube(r.x + r.w / 2, r.y + r.h / 2 + bob, r.w, r.h, '#7bffb2', 1, 0);

    /* He says nothing until he actually has you. Mid-carry he is tucked
       in underneath, so his bubble goes above the pair of you — hung off
       him, it would land squarely on top of you. */
    if (r.phase === 'swoop') return;
    if (r.phase === 'carry') drawSpeech(p.x + p.w / 2, p.y - 6, r.line, r.say * 26);
    else drawSpeech(r.x + r.w / 2, r.y + bob, r.line, r.say * 26);
  }

  /* Small, bright, and ringed — the Geometry Dash shape: a solid core
     inside a thin ring, with ticks turning around the outside. */
  function drawOrbs() {
    for (var i = 0; i < level.orbs.length; i++) {
      var o = level.orbs[i];
      if (!seen(o)) continue;
      var pulse = 0.82 + Math.sin(state.t * 6 + o.x) * 0.18;
      var col = orbColor(o);

      ctx.save();
      ctx.translate(o.x, o.y);

      ctx.globalAlpha = 0.22 * pulse;          // soft halo
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(0, 0, o.r * 1.75, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.strokeStyle = col;                   // the ring
      ctx.shadowColor = col;
      ctx.shadowBlur = 16;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, o.r, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = col;                     // the core
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.arc(0, 0, o.r * 0.46, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      ctx.rotate(state.t * 2.2);               // ticks turning around it
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      for (var k = 0; k < 4; k++) {
        ctx.rotate(Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(o.r + 4, 0);
        ctx.lineTo(o.r + 9, 0);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawSaws() {
    for (var i = 0; i < level.saws.length; i++) {
      var sw = level.saws[i];
      if (!seen(sw)) continue;
      var at = sawPos(sw);

      /* the rail it rides, so you can read the swing before you jump */
      ctx.strokeStyle = 'rgba(255,95,126,0.16)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(sw.x0, sw.y0);
      ctx.lineTo(sw.x1, sw.y1);
      ctx.stroke();

      ctx.save();
      ctx.translate(at.x, at.y);
      ctx.rotate(state.t * 9);

      ctx.fillStyle = '#ff5f7e';
      ctx.shadowColor = '#ff5f7e';
      ctx.shadowBlur = 18;
      var teeth = 10;
      ctx.beginPath();
      for (var k = 0; k < teeth; k++) {
        var a0 = (k / teeth) * Math.PI * 2;
        var a1 = ((k + 0.5) / teeth) * Math.PI * 2;
        ctx.lineTo(Math.cos(a0) * sw.r, Math.sin(a0) * sw.r);
        ctx.lineTo(Math.cos(a1) * (sw.r - 8), Math.sin(a1) * (sw.r - 8));
      }
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#8a93a8';
      ctx.beginPath();
      ctx.arc(0, 0, sw.r - 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#05070f';
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawBarrier() {
    var b = level.barrier;
    if (!b || b.open) return;
    var pulse = 0.7 + Math.sin(state.t * 6) * 0.3;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ff5f7e';
    ctx.shadowColor = '#ff5f7e';
    ctx.shadowBlur = 22;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (var y = b.y; y < b.y + b.h; y += 26) ctx.fillRect(b.x, y, b.w, 3);
  }

  function drawScarecrow() {
    var s = level.scarecrow;
    if (!s) return;
    ctx.save();
    var jitter = s.shake > 0 ? (Math.random() - 0.5) * 7 : 0;
    ctx.translate(s.x + jitter, s.y);

    if (s.hp <= 0) {
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = '#6b4b2a';
      ctx.fillRect(19, 48, 8, 40);
      ctx.restore();
      return;
    }

    if (s.flash > 0) { ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 20; }
    ctx.fillStyle = '#6b4b2a';
    ctx.fillRect(19, 26, 8, 62);
    ctx.fillRect(2, 36, 42, 7);
    ctx.fillStyle = s.flash > 0 ? '#ffffff' : '#f9c74f';
    rr(8, 0, 30, 30, 6); ctx.fill();
    ctx.fillStyle = '#3a2a12';
    ctx.fillRect(15, 10, 5, 5);
    ctx.fillRect(27, 10, 5, 5);
    ctx.strokeStyle = '#3a2a12';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(16, 22); ctx.lineTo(23, 26); ctx.lineTo(30, 22);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();

    for (var i = 0; i < s.maxHp; i++) {
      ctx.fillStyle = i < s.hp ? '#f9c74f' : 'rgba(249,199,79,0.18)';
      ctx.fillRect(s.x + 4 + i * 14, s.y - 14, 10, 5);
    }
  }

  function drawEnemies() {
    for (var n = 0; n < level.enemies.length; n++) {
      if (seen(level.enemies[n])) drawEnemy(level.enemies[n]);
    }
  }

  function drawEnemy(e) {
    if (e.dead || e.dormant) return;

    ctx.save();
    ctx.translate(e.x + e.w / 2, e.y + e.h / 2);
    var body = e.purple ? '#c77dff' : '#ff5f7e';
    var lit = e.fuse > 0 && Math.sin(state.t * 40) > 0;   // flashing, about to go
    ctx.fillStyle = (e.flash > 0 || lit) ? '#ffffff' : body;
    ctx.shadowColor = body;
    ctx.shadowBlur = e.fuse > 0 ? 40 : 18;
    rr(-e.w / 2, -e.h / 2, e.w, e.h, 5);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = e.purple ? '#24073a' : '#3a0713';
    var k = e.w / 22;                                 // the eyes grow with it
    ctx.fillRect((e.face > 0 ? 0 : -5) * k, -4 * k, 4 * k, 6 * k);      // two mean little eyes
    ctx.fillRect((e.face > 0 ? -6 : 2) * k, -4 * k, 4 * k, 6 * k);
    ctx.restore();

    var pipL = e.x + e.w / 2 - (e.maxHp * 10 - 3) / 2;
    for (var i = 0; i < e.maxHp; i++) {               // hit pips
      ctx.fillStyle = i < e.hp ? body : (e.purple ? 'rgba(199,125,255,0.18)' : 'rgba(255,95,126,0.18)');
      ctx.fillRect(e.purple ? pipL + i * 10 : e.x - 3 + i * 10, e.y - 12, 7, 4);
    }
  }

  function drawPickups() {
    for (var i = 0; i < level.pickups.length; i++) drawPickup(level.pickups[i]);
  }

  function drawPickup(it) {
    if (it.hidden) return;
    var bob = it.held ? 0 : Math.sin(state.t * 3 + it.x) * 3;
    ctx.save();
    ctx.translate(it.x + it.w / 2, it.y + it.h / 2 + bob);

    if (it.kind === 'bomb') {
      ctx.fillStyle = '#4ec3ff';
      ctx.shadowColor = '#4ec3ff';
      ctx.shadowBlur = 22;
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.arc(-4, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#bff0ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(4, -10);
      ctx.lineTo(9, -17);
      ctx.stroke();
    } else if (it.kind === 'key') {
      ctx.fillStyle = it.kind === 'bomb' ? '#4ec3ff' : '#ffd166';
      ctx.shadowColor = it.kind === 'bomb' ? '#4ec3ff' : '#ffd166';
      ctx.shadowBlur = 16;
      ctx.beginPath();                         // bow
      ctx.arc(-7, 0, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#05070f';
      ctx.beginPath();
      ctx.arc(-7, 0, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffd166';
      ctx.fillRect(-1, -3, 16, 6);             // shaft
      ctx.fillRect(9, 3, 4, 6);                // teeth
      ctx.fillRect(14, 3, 3, 5);
    } else {
      ctx.fillStyle = '#ff5f7e';
      ctx.shadowColor = '#ff5f7e';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(0, 2, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#7bffb2';
      ctx.beginPath();
      ctx.moveTo(2, -10); ctx.lineTo(14, -16); ctx.lineTo(5, -4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.arc(-5, -2, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawDoor() {
    var d = level.door;
    if (d.w <= 0) return;              // a room with no door (the final boss)
    var ready = doorReady();
    var pulse = 0.6 + Math.sin(state.t * 3) * 0.25;
    ctx.save();
    ctx.globalAlpha = ready ? pulse + 0.25 : 0.3;
    ctx.fillStyle = ready ? '#4ec3ff' : '#3d4a72';
    if (ready) { ctx.shadowColor = '#4ec3ff'; ctx.shadowBlur = 30; }
    rr(d.x, d.y, d.w, d.h, 10);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(5,7,15,0.75)';
    rr(d.x + 10, d.y + 12, d.w - 20, d.h - 24, 6);
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.fillStyle = ready ? '#bff0ff' : '#56658c';
    if (d.needs === 'key' && !ready) {
      ctx.font = 'bold 20px sans-serif';       // a keyhole, while locked
      ctx.fillText('⚿', d.x + d.w / 2, d.y + d.h / 2 + 8);
    } else {
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText('?', d.x + d.w / 2, d.y + d.h / 2 + 9);
    }
  }

  function drawHints() {
    ctx.textAlign = 'center';
    for (var i = 0; i < level.hints.length; i++) {
      var h = level.hints[i];
      var dist = Math.abs((p.x + p.w / 2) - h.x);
      var a = dist > 480 ? 0 : dist > 330 ? (480 - dist) / 150 : 1;
      if (a <= 0) continue;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#4ec3ff';
      ctx.shadowColor = 'rgba(78,195,255,0.6)';
      ctx.shadowBlur = 12;
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText(h.big, h.x, h.y);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#8ea7d6';
      ctx.font = '12px sans-serif';
      ctx.fillText(h.small, h.x, h.y + 20);
      ctx.restore();
    }
  }

  /* The checkpoint: a post with a flag on it, in the one blue nothing
     else in the game uses, so it never reads as something to catch or
     something to dodge. */
  function drawCheckpoint() {
    if (!checkpoint) return;
    var x = checkpoint.x + SIZE / 2;
    var y = checkpoint.y + SIZE;
    var wave = Math.sin(state.t * 4) * 2;

    ctx.save();
    ctx.globalAlpha = 0.18;                  // a patch of light on the floor
    ctx.fillStyle = '#4ec3ff';
    ctx.beginPath();
    ctx.ellipse(x, y, 22, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.strokeStyle = '#4ec3ff';             // the post
    ctx.shadowColor = '#4ec3ff';
    ctx.shadowBlur = 10;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y - 40);
    ctx.stroke();

    ctx.fillStyle = '#4ec3ff';               // and the flag
    ctx.beginPath();
    ctx.moveTo(x, y - 40);
    ctx.lineTo(x + 20 + wave, y - 33);
    ctx.lineTo(x, y - 26);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function drawPlayer() {
    if (p.dead) return;
    var cx = p.x + p.w / 2, cy = p.y + p.h / 2;

    if (p.atk > 0) {
      var t = 1 - p.atk / ATK_TIME;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(p.face, 1);
      ctx.globalAlpha = 1 - t;
      ctx.strokeStyle = '#ffffff';
      ctx.shadowColor = '#4ec3ff';
      ctx.shadowBlur = 20;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(6, 0, 26 + t * 12, -0.9 + t * 1.4, 0.9 + t * 1.4);
      ctx.stroke();
      ctx.restore();
    }

    drawCube(cx, cy, p.w, p.h, '#4ec3ff', p.face, p.rot);

    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(191,240,255,0.75)';
    ctx.fillText(state.name, cx, p.y - 10);

    /* how much longer you can stand being held */
    if (state.grab > 0.05) {
      var f = Math.min(1, state.grab / GRAB_MAX);
      ctx.fillStyle = 'rgba(5,7,15,0.7)';
      ctx.fillRect(cx - 22, p.y - 26, 44, 6);
      ctx.fillStyle = '#ff5f7e';
      ctx.shadowColor = '#ff5f7e';
      ctx.shadowBlur = 10;
      ctx.fillRect(cx - 22, p.y - 26, 44 * f, 6);
      ctx.shadowBlur = 0;
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var q = particles[i];
      ctx.globalAlpha = Math.max(0, q.life / q.max);
      ctx.fillStyle = q.color;
      ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.save();
    ctx.textAlign = 'left';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillStyle = '#4ec3ff';
    ctx.fillText(state.name.toUpperCase(), 18, 30);

    if (p.holding) {
      ctx.textAlign = 'right';
      ctx.fillStyle = '#8ea7d6';
      ctx.font = '12px sans-serif';
      ctx.fillText('CARRYING: ' + p.holding.kind.toUpperCase() + '  —  PRESS B TO DROP', W - 18, 30);
    }
    ctx.restore();

    /* boss health, across the top */
    if (level.boss && !level.boss.final) {     // no bar for the last one
      var bb = level.boss;
      var bw = 320, bx = W / 2 - bw / 2;
      ctx.save();
      ctx.fillStyle = 'rgba(5,7,15,0.75)';
      rr(bx - 3, 61, bw + 6, 16, 8);
      ctx.fill();
      for (var i = 0; i < bb.maxHp; i++) {
        var seg = (bw - (bb.maxHp - 1) * 6) / bb.maxHp;
        ctx.fillStyle = i < bb.hp ? '#ff2d55' : 'rgba(255,45,85,0.16)';
        if (i < bb.hp) { ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 12; }
        else ctx.shadowBlur = 0;
        ctx.fillRect(bx + i * (seg + 6), 64, seg, 10);
      }
      ctx.shadowBlur = 0;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#8ea7d6';
      ctx.font = '11px sans-serif';
      ctx.fillText(bb.dead ? 'DOWN' : '???', W / 2, 54);
      ctx.restore();
    }

    /* X-ray: the whole screen goes a little green, and the edges glow
       green strongest - and how to turn it off */
    if (state.xray) {
      ctx.save();
      ctx.fillStyle = 'rgba(123,255,178,0.07)';
      ctx.fillRect(0, 0, W, H);

      var GLOW = 90;
      var edges = [
        [0, 0, 0, GLOW,     0, 0, W, GLOW],            // top
        [0, H, 0, H - GLOW, 0, H - GLOW, W, GLOW],     // bottom
        [0, 0, GLOW, 0,     0, 0, GLOW, H],            // left
        [W, 0, W - GLOW, 0, W - GLOW, 0, GLOW, H]      // right
      ];
      for (var gi = 0; gi < edges.length; gi++) {
        var eg = edges[gi];
        var grad = ctx.createLinearGradient(eg[0], eg[1], eg[2], eg[3]);
        grad.addColorStop(0, 'rgba(123,255,178,0.32)');
        grad.addColorStop(1, 'rgba(123,255,178,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(eg[4], eg[5], eg[6], eg[7]);
      }
      ctx.restore();

      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#7bffb2';
      ctx.shadowColor = 'rgba(123,255,178,0.6)';
      ctx.shadowBlur = 10;
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('Press X again to remove X-Ray', W / 2, 30);
      ctx.restore();
    }

    /* room name card, on the way in */
    if (state.titleT > 0) {
      var a = Math.min(1, state.titleT / 0.6);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#4ec3ff';
      ctx.shadowColor = '#4ec3ff';
      ctx.shadowBlur = 20;
      ctx.font = 'bold 30px sans-serif';
      ctx.fillText(level.name.toUpperCase(), W / 2, 92);
      ctx.restore();
    }

    /* the screen closes in while the cube has you */
    if (state.grab > 0.05) {
      var g = Math.min(1, state.grab / GRAB_MAX);
      ctx.fillStyle = 'rgba(255,95,126,' + (g * 0.22) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    if (state.flash > 0) {
      ctx.fillStyle = 'rgba(255,95,126,' + (state.flash * 0.45) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* Anything marked `ghost` is there - you stand on it, it kills you,
     it throws you - but it only shows up under X-ray. */
  function seen(o) { return !o.ghost || state.xray; }

  function draw() {
    drawBackground();
    if (!level) return;

    ctx.save();
    /* the camera closing in on a point, and shaking (the final boss
       getting angry); at zoom 1 with no shake this does nothing */
    if (camFx.zoom !== 1 || camFx.shake > 0) {
      var zk = Math.max(0, (camFx.zoom - 1) / (ANGRY_ZOOM_K - 1));
      var tx = W / 2 + (camFx.fx - cam.x - W / 2) * zk;
      var ty = H / 2 + (camFx.fy - cam.y - H / 2) * zk;
      ctx.translate(W / 2 + (Math.random() - 0.5) * 2 * camFx.shake,
                    H / 2 + (Math.random() - 0.5) * 2 * camFx.shake);
      ctx.scale(camFx.zoom, camFx.zoom);
      ctx.translate(-tx, -ty);
    }
    ctx.translate(-Math.round(cam.x), -Math.round(cam.y));

    var i;
    for (i = 0; i < level.hazards.length; i++) {
      if (seen(level.hazards[i])) drawHazard(level.hazards[i]);
    }
    drawWaves();
    for (i = 0; i < level.solids.length; i++) {
      if (seen(level.solids[i])) drawSolid(level.solids[i]);
    }
    drawSaws();
    drawOrbs();
    drawBarrier();
    drawArrows();
    drawDoor();
    drawScarecrow();
    drawChase();
    drawBoss();
    drawArena();
    drawBombs();
    drawNpc();
    drawRescue();
    drawEnemies();
    drawPickups();
    drawHints();
    drawCheckpoint();
    drawPlayer();
    drawJetpack();
    drawParticles();
    drawFireball();

    ctx.restore();
    drawHUD();
    drawIntroScreen();             // the final boss's way in
    drawJetHUD();
    drawDeathGrey();
  }

  /* ============================================================
     LOOP
     ============================================================ */
  var last = 0;
  function frame(now) {
    var dt = last ? (now - last) / 1000 : 0;
    last = now;
    if (dt > 0.05) dt = 0.05;   // a stutter shouldn't teleport anyone into a pit
    if (state.running && level) update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  /* ============================================================
     MENUS
     ============================================================ */
  var titleScreen = document.getElementById('titleScreen');
  var menuPanel   = document.getElementById('menuPanel');
  var namePanel   = document.getElementById('namePanel');
  var continueBtn = document.getElementById('continueBtn');
  var newBtn      = document.getElementById('newBtn');
  var nameInput   = document.getElementById('nameInput');
  var beginBtn    = document.getElementById('beginBtn');

  var doneScreen  = document.getElementById('doneScreen');
  var doneTitle   = document.getElementById('doneTitle');
  var doneSub     = document.getElementById('doneSub');
  var nextBtn     = document.getElementById('nextBtn');
  var againBtn    = document.getElementById('againBtn');

  var adminBtn    = document.getElementById('adminBtn');

  var onNext = null, onAgain = null;

  /* Admin (test) mode, switched on from the title screen: checkpoints
     no longer stop you going on. Not saved - off every time you load. */
  var admin = false;

  function toggleAdmin() {
    admin = !admin;
    adminBtn.textContent = 'ADMIN: ' + (admin ? 'ON' : 'OFF');
    if (admin) adminBtn.classList.add('on');
    else adminBtn.classList.remove('on');
  }

  /* Placed a flag in this room, and not an admin: no way on. */
  function blocked() { return state.cpUsed && !admin; }

  function enterGame() {
    titleScreen.classList.add('hidden');
    doneScreen.classList.add('hidden');
    state.running = true;
    saveGame();
  }

  function newGame() {
    var n = nameInput.value.trim();
    state.name = n ? n : 'HERO';
    clearSave();
    loadLevel(0);
    enterGame();
  }

  function continueGame() {
    var s = readSave();
    if (!s) { showNamePanel(); return; }
    loadLevel(s.level);
    state.name = s.name || 'HERO';
    state.picked = !!s.picked;
    state.cpUsed = !!s.cpUsed;
    if (level.barrier && s.barrierOpen) {
      level.barrier.open = true;
      if (level.scarecrow) level.scarecrow.everBroken = true;
    }
    /* the final boss's room always starts from its own start, with the
       scene: a spot saved in it may be somewhere it has since changed */
    if (!level.intro) {
      p.x = s.x;
      p.y = s.y;
      safeSpot.x = s.x;
      safeSpot.y = s.y;
    }
    cam.x = Math.max(0, Math.min(level.worldW - W, p.x + p.w / 2 - W / 2));
    enterGame();
  }

  function showNamePanel() {
    menuPanel.classList.add('hide');
    namePanel.classList.remove('hide');
    nameInput.value = '';
    nameInput.focus();
  }

  /* Reaching a door ends the room and offers the two ways onward. */
  /* Set when you duck back into the tutorial from a room you'd cleared,
     so finishing it returns you to that room's screen instead of
     dumping you at Room One with your place lost. */
  var returnToDone = null;

  function finishLevel() {
    state.running = false;

    /* Room Twenty-Five runs straight on into the dark, no cleared
       screen - unless a flag went down, then it's the usual Try Again */
    if (level.straightOn && !blocked()) {
      loadLevel(levelIndex + 1);
      enterGame();
      return;
    }

    /* a flagged tutorial does not hand you back to the cleared room's
       screen either - it keeps you here until you do it clean */
    if (levelIndex === 0 && returnToDone !== null && !blocked()) {
      var back = returnToDone;
      returnToDone = null;
      showDoneFor(back);
      return;
    }
    showDoneFor(levelIndex);
  }

  function showDoneFor(finished) {
    state.running = false;

    if (finished === 0) {
      doneTitle.textContent = 'TUTORIAL COMPLETE';
      doneSub.textContent = 'Nice work, ' + state.name;
      nextBtn.textContent = 'Start the Game';
      againBtn.textContent = 'Restart the Tutorial';
      onNext  = function () { loadLevel(1); enterGame(); };
      onAgain = function () { loadLevel(0); enterGame(); };
    } else {
      var last = finished === BUILDERS.length - 1;
      doneTitle.textContent = BUILDERS[finished]().name.toUpperCase() + ' CLEARED';
      doneSub.textContent = last ? 'To be continued' : 'Onward';
      nextBtn.textContent = last ? 'Play It Again' : 'Next Room';
      againBtn.textContent = last ? 'Back to the Tutorial' : 'Play It Again';
      onNext  = function () { loadLevel(last ? finished : finished + 1); enterGame(); };
      onAgain = last
        ? function () { returnToDone = finished; loadLevel(0); enterGame(); }
        : function () { loadLevel(finished); enterGame(); };
    }

    /* Put a flag down in the room you just finished? Then the way on
       becomes the way back in; the other button stays as it was. */
    if (blocked() && finished === levelIndex) {
      doneSub.textContent = 'You cannot pass if you used checkpoints';
      nextBtn.textContent = 'Try Again';
      onNext = function () { loadLevel(finished); enterGame(); };
    }

    doneScreen.classList.remove('hidden');
  }

  continueBtn.addEventListener('click', continueGame);
  newBtn.addEventListener('click', showNamePanel);
  beginBtn.addEventListener('click', newGame);
  nameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); newGame(); }
  });
  nextBtn.addEventListener('click', function () { if (onNext) onNext(); });
  againBtn.addEventListener('click', function () { if (onAgain) onAgain(); });

  adminBtn.addEventListener('click', function () {
    toggleAdmin();
    adminBtn.blur();        // so Space in the first room doesn't flip it back
  });

  /* Don't lose progress on the way out — leaving via the Games link,
     closing the tab, or the browser backgrounding us all count. */
  window.addEventListener('pagehide', saveGame);
  window.addEventListener('beforeunload', saveGame);
  var backLink = document.querySelector('.back-link');
  if (backLink) backLink.addEventListener('click', saveGame);

  /* Two unlabelled buttons. Working out which is which is the player's job. */
  if (readSave()) {
    menuPanel.classList.remove('hide');
    namePanel.classList.add('hide');
  }

  loadLevel(0);
  state.titleT = 0;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
