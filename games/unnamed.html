      var f = Math.min(1, state.grab / GRAB_MAX);
      ctx.fillStyle = 'rgba(5,7,15,0.7)';
      ctx.fillRect(cx - 22, p.y - 26, 44, 6);
      ctx.fillStyle = '#ff5f7e';
      ctx.shadowColor = '#ff5f7e';
      ctx.shadowBlur = 10;
      ctx.fillRect(cx - 22, p.y - 26, 44 * f, 6);
      ctx.shadowBlur = 0;
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var q = particles[i];
      ctx.globalAlpha = Math.max(0, q.life / q.max);
      ctx.fillStyle = q.color;
      ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.save();
    ctx.textAlign = 'left';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillStyle = '#4ec3ff';
    ctx.fillText(state.name.toUpperCase(), 18, 30);

    if (p.holding) {
      ctx.textAlign = 'right';
      ctx.fillStyle = '#8ea7d6';
      ctx.font = '12px sans-serif';
      ctx.fillText('CARRYING: ' + p.holding.kind.toUpperCase() + '  —  PRESS B TO DROP', W - 18, 30);
    }
    ctx.restore();

    /* boss health, across the top */
    if (level.boss) {
      var bb = level.boss;
      var bw = 320, bx = W / 2 - bw / 2;
      ctx.save();
      ctx.fillStyle = 'rgba(5,7,15,0.75)';
      rr(bx - 3, 61, bw + 6, 16, 8);
      ctx.fill();
      for (var i = 0; i < bb.maxHp; i++) {
        var seg = (bw - (bb.maxHp - 1) * 6) / bb.maxHp;
        ctx.fillStyle = i < bb.hp ? '#ff2d55' : 'rgba(255,45,85,0.16)';
        if (i < bb.hp) { ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 12; }
        else ctx.shadowBlur = 0;
        ctx.fillRect(bx + i * (seg + 6), 64, seg, 10);
      }
      ctx.shadowBlur = 0;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#8ea7d6';
      ctx.font = '11px sans-serif';
      ctx.fillText(bb.dead ? 'DOWN' : '???', W / 2, 54);
      ctx.restore();
    }

    /* room name card, on the way in */
    if (state.titleT > 0) {
      var a = Math.min(1, state.titleT / 0.6);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#4ec3ff';
      ctx.shadowColor = '#4ec3ff';
      ctx.shadowBlur = 20;
      ctx.font = 'bold 30px sans-serif';
      ctx.fillText(level.name.toUpperCase(), W / 2, 92);
      ctx.restore();
    }

    /* the screen closes in while the cube has you */
    if (state.grab > 0.05) {
      var g = Math.min(1, state.grab / GRAB_MAX);
      ctx.fillStyle = 'rgba(255,95,126,' + (g * 0.22) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    if (state.flash > 0) {
      ctx.fillStyle = 'rgba(255,95,126,' + (state.flash * 0.45) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function draw() {
    drawBackground();
    if (!level) return;

    ctx.save();
    ctx.translate(-Math.round(cam.x), 0);

    var i;
    for (i = 0; i < level.hazards.length; i++) drawHazard(level.hazards[i]);
    drawWaves();
    for (i = 0; i < level.solids.length; i++) drawSolid(level.solids[i]);
    drawSaws();
    drawBarrier();
    drawArrows();
    drawDoor();
    drawScarecrow();
    drawBoss();
    drawBombs();
    drawNpc();
    drawEnemies();
    drawPickups();
    drawHints();
    drawPlayer();
    drawParticles();

    ctx.restore();
    drawHUD();
  }

  /* ============================================================
     LOOP
     ============================================================ */
  var last = 0;
  function frame(now) {
    var dt = last ? (now - last) / 1000 : 0;
    last = now;
    if (dt > 0.05) dt = 0.05;   // a stutter shouldn't teleport anyone into a pit
    if (state.running && level) update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  /* ============================================================
     MENUS
     ============================================================ */
  var titleScreen = document.getElementById('titleScreen');
  var menuPanel   = document.getElementById('menuPanel');
  var namePanel   = document.getElementById('namePanel');
  var continueBtn = document.getElementById('continueBtn');
  var newBtn      = document.getElementById('newBtn');
  var nameInput   = document.getElementById('nameInput');
  var beginBtn    = document.getElementById('beginBtn');

  var doneScreen  = document.getElementById('doneScreen');
  var doneTitle   = document.getElementById('doneTitle');
  var doneSub     = document.getElementById('doneSub');
  var nextBtn     = document.getElementById('nextBtn');
  var againBtn    = document.getElementById('againBtn');

  var onNext = null, onAgain = null;

  function enterGame() {
    titleScreen.classList.add('hidden');
    doneScreen.classList.add('hidden');
    state.running = true;
    saveGame();
  }

  function newGame() {
    var n = nameInput.value.trim();
    state.name = n ? n : 'HERO';
    clearSave();
    loadLevel(0);
    enterGame();
  }

  function continueGame() {
    var s = readSave();
    if (!s) { showNamePanel(); return; }
    loadLevel(s.level);
    state.name = s.name || 'HERO';
    state.picked = !!s.picked;
    if (level.barrier && s.barrierOpen) {
      level.barrier.open = true;
      if (level.scarecrow) level.scarecrow.everBroken = true;
    }
    p.x = s.x;
    p.y = s.y;
    safeSpot.x = s.x;
    safeSpot.y = s.y;
    cam.x = Math.max(0, Math.min(level.worldW - W, p.x + p.w / 2 - W / 2));
    enterGame();
  }

  function showNamePanel() {
    menuPanel.classList.add('hide');
    namePanel.classList.remove('hide');
    nameInput.value = '';
    nameInput.focus();
  }

  /* Reaching a door ends the room and offers the two ways onward. */
  /* Set when you duck back into the tutorial from a room you'd cleared,
     so finishing it returns you to that room's screen instead of
     dumping you at Room One with your place lost. */
  var returnToDone = null;

  function finishLevel() {
    state.running = false;

    if (levelIndex === 0 && returnToDone !== null) {
      var back = returnToDone;
      returnToDone = null;
      showDoneFor(back);
      return;
    }
    showDoneFor(levelIndex);
  }

  function showDoneFor(finished) {
    state.running = false;

    if (finished === 0) {
      doneTitle.textContent = 'TUTORIAL COMPLETE';
      doneSub.textContent = 'Nice work, ' + state.name;
      nextBtn.textContent = 'Start the Game';
      againBtn.textContent = 'Restart the Tutorial';
      onNext  = function () { loadLevel(1); enterGame(); };
      onAgain = function () { loadLevel(0); enterGame(); };
    } else {
      var last = finished === BUILDERS.length - 1;
      doneTitle.textContent = BUILDERS[finished]().name.toUpperCase() + ' CLEARED';
      doneSub.textContent = last ? 'To be continued' : 'Onward';
      nextBtn.textContent = last ? 'Play It Again' : 'Next Room';
      againBtn.textContent = last ? 'Back to the Tutorial' : 'Play It Again';
      onNext  = function () { loadLevel(last ? finished : finished + 1); enterGame(); };
      onAgain = last
        ? function () { returnToDone = finished; loadLevel(0); enterGame(); }
        : function () { loadLevel(finished); enterGame(); };
    }

    doneScreen.classList.remove('hidden');
  }

  continueBtn.addEventListener('click', continueGame);
  newBtn.addEventListener('click', showNamePanel);
  beginBtn.addEventListener('click', newGame);
  nameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); newGame(); }
  });
  nextBtn.addEventListener('click', function () { if (onNext) onNext(); });
  againBtn.addEventListener('click', function () { if (onAgain) onAgain(); });

  /* Don't lose progress on the way out — leaving via the Games link,
     closing the tab, or the browser backgrounding us all count. */
  window.addEventListener('pagehide', saveGame);
  window.addEventListener('beforeunload', saveGame);
  var backLink = document.querySelector('.back-link');
  if (backLink) backLink.addEventListener('click', saveGame);

  /* Two unlabelled buttons. Working out which is which is the player's job. */
  if (readSave()) {
    menuPanel.classList.remove('hide');
    namePanel.classList.add('hide');
  }

  loadLevel(0);
  state.titleT = 0;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
