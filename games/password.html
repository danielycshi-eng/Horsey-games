<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a Password - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../gate.js" data-gate="password"></script>
  <style>
    body { justify-content: flex-start; padding-top: 4.5rem; }

    .wrap { width: min(620px, 92vw); display: flex; flex-direction: column; gap: 0.9rem; }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      color: #e0e8ff;
      letter-spacing: 1px;
    }

    /* The password box: a text box that grows onto more lines as it gets
       long, with a copy of the text laid exactly behind it where the
       parts a broken rule is about are marked red. */
    /* the whole box - the text, and under it (once it's needed) the
       toolbar - in one border */
    .field {
      background: #0b1022;
      border: 2px solid #3a4a78;
      border-radius: 12px;
      transition: border-color 0.2s;
    }
    .field:focus-within { border-color: #4ec3ff; box-shadow: 0 0 0 3px rgba(78, 195, 255, 0.15); }
    .field .text { position: relative; }
    #pw, #hl {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 0;
      /* monospace: its bold is exactly as wide, so the copy behind stays
         lined up with the box */
      font: 400 1.35rem/1.4 'Consolas', 'Courier New', monospace;
      letter-spacing: 0;
      padding: 0.85rem 1rem;
      border: 0;
      border-radius: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    /* the copy behind is what you actually see: bold where it's bold,
       red where a broken rule says so */
    #hl {
      position: absolute;
      inset: 0;
      color: #e0e8ff;
      pointer-events: none;
    }
    #hl .b { font-weight: 700; color: #ffffff; }
    #hl .m {
      background: rgba(255, 95, 126, 0.5);
      border-radius: 3px;
    }
    /* the box itself: its own letters invisible, its cursor and selection not */
    #pw {
      position: relative;
      color: transparent;
      caret-color: #e0e8ff;
      background: transparent;
      outline: none;
      resize: none;
      overflow: hidden;
    }

    /* the Bold button, once the bold rule is here: in a toolbar strip along
       the bottom of the password box itself, like an editor's, in a box of
       its own */
    .toolbar {
      display: flex;
      gap: 0.3rem;
      padding: 0.4rem 0.6rem;
      border-top: 1px solid #1d2b5c;
      animation: ruleIn 0.35s ease-out;
    }
    .toolbar.hidden { display: none; }
    #boldBtn {
      font: 700 0.95rem/1 'Segoe UI', system-ui, sans-serif;
      color: #c9d2e6;
      background: #0f1530;
      border: 2px solid #3a4a78;
      border-radius: 8px;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
    }
    #boldBtn:hover { border-color: #4ec3ff; }
    #boldBtn.on { color: #05070f; background: #e0e8ff; border-color: #e0e8ff; }

    .under { display: flex; justify-content: space-between; align-items: center; }
    #count { color: #56658c; font-size: 0.9rem; }
    .gens { display: flex; gap: 0.4rem; }
    #genBtn, #genAllBtn {
      font: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffd166;
      background: transparent;
      border: 1px solid #6b5a2a;
      border-radius: 8px;
      padding: 0.3rem 0.8rem;
      cursor: pointer;
    }
    #genBtn:hover, #genAllBtn:hover { background: rgba(255, 209, 102, 0.1); }

    /* the rules, spaced out down the page */
    #rules { display: flex; flex-direction: column; gap: 1.1rem; margin-top: 0.4rem; }

    /* a rule: red while it's broken, green once it's met */
    .rule {
      border: 2px solid #ff5f7e;
      border-radius: 12px;
      background: #1a0b14;
      overflow: hidden;
    }
    .rule.new {
      animation: ruleIn 0.35s ease-out;          /* only as it first appears */
    }
    .rule .head {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.6rem 1rem;
      background: rgba(255, 95, 126, 0.18);
      color: #ff8fa3;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .rule .mark {
      width: 1.35rem;
      height: 1.35rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: #05070f;
      background: #ff5f7e;
    }
    .rule .body { padding: 1rem 1.1rem 1.1rem; color: #f0d6dd; text-align: left; font-size: 1.05rem; }
    .rule.ok { border-color: #7bffb2; background: #0b1a14; }
    .rule.ok .head { background: rgba(123, 255, 178, 0.16); color: #9effc6; }
    .rule.ok .mark { background: #7bffb2; }
    .rule.ok .body { color: #d4f5e2; }
    /* Meowy, big, to copy into your password */
    .meowy {
      margin-top: 0.7rem;
      font-size: 3rem;
      line-height: 1.1;
      user-select: all;
    }

    /* how many buff guys you have: a bar filling up, green to red */
    .buffbar {
      margin-top: 0.7rem;
      height: 14px;
      background: #0b1022;
      border: 2px solid #3a4a78;
      border-radius: 8px;
      overflow: hidden;
    }
    .buffbar .fill {
      width: 0;
      height: 100%;
      background: #7bffb2;
      transition: width 0.12s;
    }

    /* and if you take him out again */
    #dead {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      animation: goDark 0.6s ease-out;
    }
    #dead.hidden { display: none; }
    .deadText {
      position: relative;
      padding: 0 1rem 2rem;
      font: 700 clamp(2rem, 7vw, 4.2rem) 'Georgia', 'Times New Roman', serif;
      color: #8a0303;
      text-shadow: 0 2px 0 #4a0000, 0 0 18px rgba(170, 0, 0, 0.6);
      text-align: center;
    }
    /* the blood running down off the words */
    .drips { position: absolute; left: 0; right: 0; top: 70%; height: 0; }
    .drips span {
      position: absolute;
      top: 0;
      height: 0;
      background: linear-gradient(#8a0303, #5c0000);
      border-radius: 0 0 50% 50% / 0 0 8px 8px;
      animation-name: drip;
      animation-timing-function: ease-in;
      animation-fill-mode: forwards;
    }
    @keyframes drip { to { height: 38vh; } }
    @keyframes goDark { from { opacity: 0; } to { opacity: 1; } }
    #startOver {
      font: inherit;
      font-weight: 700;
      letter-spacing: 4px;
      color: #ff8a8a;
      background: transparent;
      border: 2px solid #8a0303;
      border-radius: 10px;
      padding: 0.7rem 2.2rem;
      cursor: pointer;
    }
    #startOver:hover { background: rgba(138, 3, 3, 0.25); }

    /* the equation, big, in its own box */
    .eq {
      font: 600 1.35rem/1.3 "Cambria Math", "Times New Roman", serif;
      color: #e0e8ff;
      background: #0b1022;
      border: 2px solid #3a4a78;
      border-radius: 10px;
      padding: 0.6rem 1rem;
    }

    /* the chess board */
    .board { margin-top: 0.8rem; }
    .board canvas { border-radius: 6px; max-width: 100%; height: auto; }

    /* the CAPTCHA picture, and its refresh */
    .cap { display: flex; align-items: center; gap: 0.7rem; margin-top: 0.8rem; }
    .cap canvas { border-radius: 8px; border: 2px solid rgba(255, 255, 255, 0.15); max-width: 78%; height: auto; }
    .cap .refresh {
      font-size: 1.5rem;
      line-height: 1;
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 50%;
      color: #e0e8ff;
      background: #1d2b5c;
      border: 2px solid #3a4a78;
      cursor: pointer;
    }
    .cap .refresh:hover { background: #2a3d7a; }

    @keyframes ruleIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #win {
      border: 2px solid #7bffb2;
      border-radius: 14px;
      background: #0b1a14;
      padding: 1.2rem;
      text-align: center;
      box-shadow: 0 0 30px rgba(123, 255, 178, 0.2);
      animation: ruleIn 0.4s ease-out;
    }
    #win.hidden { display: none; }
    #win h2 { margin: 0 0 0.5rem; color: #7bffb2; }
    #win code b { font-weight: 700; color: #ffffff; }
    #win code {
      display: block;
      margin: 0.4rem 0 0.9rem;
      font-size: 1.15rem;
      color: #e0e8ff;
      word-break: break-all;
      font-weight: 400;
    }
    #againBtn {
      font: inherit;
      font-weight: 700;
      letter-spacing: 2px;
      color: #05070f;
      background: #7bffb2;
      border: none;
      border-radius: 10px;
      padding: 0.55rem 1.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <a href="../games.html" class="back-link">&larr; All Games</a>

  <div class="wrap">
    <h1>Please choose a password</h1>
    <div class="field">
      <div class="text">
        <div id="hl" aria-hidden="true"></div>
        <textarea id="pw" rows="1" autocomplete="off" spellcheck="false"></textarea>
      </div>
      <div id="toolbar" class="toolbar hidden">
        <button type="button" id="boldBtn" title="Bold (Ctrl+B): what you have selected - or, with nothing selected, what you type next">Bold</button>
      </div>
    </div>
    <div class="under">
      <span id="count"></span>
      <span class="gens">
        <button type="button" id="genBtn" title="Every rule but the last - press again to finish (for testing)">GENERATE</button>
        <button type="button" id="genAllBtn" title="Straight to a password that meets every rule (for testing)">&#10003;</button>
      </span>
    </div>
    <div id="win" class="hidden"></div>
    <div id="rules"></div>
  </div>

  <!-- if Meowy is taken out of the password -->
  <div id="dead" class="hidden">
    <div class="deadText"><span id="deadMsg">You have killed Meowy.</span><div class="drips"></div></div>
    <button type="button" id="startOver">START OVER</button>
  </div>

  <script>
  (function () {
    'use strict';

    /* ============================================================
       THE RULES
       In order. Each: what it says, whether a password meets it, and
       (for GENERATE) how to change a password so it does. Adding one is
       adding a line here.
       ============================================================ */
    var RULES = [
      { text: 'Your password must be at least 5 characters.',
        check: function (pw) { return pw.length >= 5; },
        fix:   function (pw) { while (pw.length < 5) pw += 'x'; return pw; } },
      { text: 'Your password must include a number.',
        check: function (pw) { return /[0-9]/.test(pw); },
        fix:   function (pw) { return pw + '1'; } },
      { text: 'Your password must include a special character.',
        check: function (pw) { return /[^A-Za-z0-9\s]/.test(pw); },
        fix:   function (pw) { return pw + '!'; } },
      { text: 'The digits in your password must add up to 25.',
        check: function (pw) { return digitSum(pw) === 25; },
        marks: function (pw) { return spansOf(pw, /[0-9]/g); },
        fix:   function (pw) { return pw.replace(/[0-9]/g, '') + '997'; } },
      { text: 'Your password must include a Roman numeral.',
        check: function (pw) { return romans(pw).length > 0; },
        fix:   function (pw) { return pw + 'X'; } },
      { text: '',                        // set for each game: see newTarget()
        check: function (pw) { var r = romans(pw); return r.length > 0 && romanProduct(pw) === state.target; },
        marks: function (pw) { return spansOf(pw, /[IVXLCDM]+/g); },
        fix:   function (pw) { return pw.replace(/[IVXLCDM]/g, '') + toRoman(state.target); } },
      { text: 'Your password must include this CAPTCHA:',
        captcha: true,                   // its box shows the picture, and a refresh
        check: function (pw) { return pw.indexOf(state.captcha) !== -1; },
        fix:   function (pw) { return pw + state.captcha; } },
      { text: 'Your password must include a two-letter symbol from the periodic table.',
        check: function (pw) { return hasElement(pw); },
        fix:   function (pw) { return pw + 'He'; } },
      { text: 'Your password must include a leap year.',
        check: function (pw) { return hasLeapYear(pw); },
        fix:   function (pw) { return pw + 'y2024'; } },
      { text: 'Your password must include the current phase of the moon as an emoji.',
        check: function (pw) { return pw.indexOf(MOONS[moonPhase(new Date())]) !== -1; },
        fix:   function (pw) { return pw + MOONS[moonPhase(new Date())]; } },
      { text: 'Your password must include the best move in algebraic chess notation. White to move.',
        chess: true,                     // its box shows the board
        check: function (pw) { return chessMove(pw) !== null; },
        fix:   function (pw) { return pw + PUZZLES[state.puzzle].mates[0]; } },
      { text: 'Your password must include the answer to this math equation:',
        math: true,                      // its box shows the equation, and a refresh
        check: function (pw) { return hasNumber(pw, state.answer); },
        fix:   function (pw) { return pw + 'z' + state.answer + 'z'; } },
      { text: 'This is Meowy the Cat. He is sleeping, so put him in your password and keep him safe.',
        meowy: true,                     // its box shows him, to copy
        check: function (pw) { return pw.indexOf(MEOWY) !== -1; },
        fix:   function (pw) { return pw + MEOWY; } },
      { text: 'The atomic numbers of the elements in your password must add up to 200.',
        check: function (pw) { return elementSum(pw) === 200; },
        marks: function (pw) { return elementSpans(pw); },
        fix:   function (pw) { var r = 200 - elementSum(pw); return r > 0 ? pw + elementFill(r) : pw; } },
      { text: 'All vowels in your password must be bolded.',
        format: true,                    // about how it's written, not what's in it
        check: function (pw) { return unboldedVowels(pw).length === 0; },
        marks: function (pw) { return unboldedVowels(pw); },
        fix:   function (pw) { return pw; } },
      { text: '',                        // see BUFF, below
        buff: true,                      // its box shows him, and how many you have
        check: function (pw) { return countBuff(pw) >= BUFF_NEED; },
        fix:   function (pw) { var n = countBuff(pw); while (n++ < BUFF_NEED) pw += BUFF; return pw; } },
      { text: '',                        // see FIRE, below
        check: function (pw) { return state.fireLit && pw.indexOf(FIRE) === -1; },   // (lit, and all put out)
        fix:   function (pw) { return pw.split(FIRE).join(''); } },
      { text: '',                        // see FOOD, below
        food: true,                      // its box shows his food, to copy
        check: function (pw) { var n = countFood(pw); return n > 0 && n < FOOD_MAX; },
        fix:   function (pw) { return countFood(pw) ? pw : pw + FOOD; } }
    ];

    /* The buff guy: five of him to be strong enough. Until you have five,
       one goes from your password every quarter of a second - so paste
       fast - and if you drop below five again, it starts again. */
    var BUFF = '🏋️‍♂️';
    var BUFF_NEED = 5, BUFF_EVERY = 250;
    RULES[15].text = 'Your password is not strong enough ' + BUFF;
    function countBuff(pw) { return pw.split(BUFF).length - 1; }

    /* The fire: it starts on one of your characters - never Meowy, or the
       two either side of him - and spreads to the ones next to it, burning
       them away. Delete all of it to meet the rule. If it reaches Meowy, he
       burns. It only ever starts once. */
    var FIRE = '🔥';
    var FIRE_EVERY = 900, FIRE_CATCH = 0.6;   // each tick, the chance a neighbour catches
    RULES[16].text = 'Oh no! Your password is on fire ' + FIRE + ' Quick, put it out!';
    /* the password as characters - an emoji (even one made of several,
       like the buff guy) counting as one */
    function chars(pw) {
      return pw.match(/(?:[\uD800-\uDBFF][\uDC00-\uDFFF]|[\s\S])(?:️|‍(?:[\uD800-\uDBFF][\uDC00-\uDFFF]|[\s\S]))*/g) || [];
    }

    /* Meowy wakes (his Zzz in your password turns into him) and he's
       hungry: three fish a minute. Once you've put the first one in, he
       eats one every 20 seconds - and if there are none for him when it's
       time, he starves. Ten or more at once, and he's overfed. */
    var FOOD = '🐟';
    var FOOD_EVERY = 20000, FOOD_MAX = 10;
    RULES[17].text = 'Meowy has woken! He eats three ' + FOOD + ' per minute! Remember to feed him!';
    function countFood(pw) { return pw.split(FOOD).length - 1; }

    /* Meowy: a sleeping cat. Once he's in your password, taking him out
       again kills him - and that's the end. */
    var ZZZ = '💤', CAT = '🐱';
    var MEOWY = ZZZ;         // his Zzz while he sleeps; the cat once he's woken (rule 18)

    /* ---- the math: a new equation each game, worked with the usual order
       (brackets, powers, then times and divide, then plus and minus),
       always coming out to a whole number above 0 - and one whose
       digits don't eat all of rule 4's 25 ---- */
    function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
    function newMath() {
      var T = '×', M = '−', D = '÷', SQ = '²', CU = '³', RT = '√';
      function signed(n) { return n < 0 ? ' ' + M + ' ' + (-n) : ' + ' + n; }
      for (var tries = 0; tries < 300; tries++) {
        var a, b, c, d, k, m, x, eq, ans, kind = rnd(0, 5);
        if (kind === 0) {
          /* x on both sides: 7x - 12 = 3x + 48 */
          x = rnd(4, 40); a = rnd(4, 11); c = rnd(2, a - 1); b = rnd(-40, 40);
          d = (a - c) * x + b;
          if (b === 0 || d === 0) continue;
          eq = 'Solve for x:  ' + a + 'x' + signed(b) + ' = ' + c + 'x' + signed(d);
          ans = x;
        } else if (kind === 1) {
          /* powers and brackets: 4^3 + 3 x (15 - 9)^2 */
          a = rnd(2, 5); b = rnd(2, 6); c = rnd(12, 25); d = c - rnd(2, 9);
          eq = a + CU + ' + ' + b + ' ' + T + ' (' + c + ' ' + M + ' ' + d + ')' + SQ;
          ans = a * a * a + b * (c - d) * (c - d);
        } else if (kind === 2) {
          /* a square root: root 361 x 4 - 3^2 */
          a = rnd(12, 25); k = rnd(3, 9); m = rnd(2, 9);
          eq = RT + (a * a) + ' ' + T + ' ' + k + ' ' + M + ' ' + m + SQ;
          ans = a * k - m * m;
        } else if (kind === 3) {
          /* negatives: (-7)^2 x 3 - 5 x (-8) */
          a = rnd(4, 12); b = rnd(2, 6); c = rnd(3, 9); d = rnd(4, 15);
          eq = '(' + M + a + ')' + SQ + ' ' + T + ' ' + b + ' ' + M + ' ' + c + ' ' + T + ' (' + M + d + ')';
          ans = a * a * b + c * d;
        } else if (kind === 4) {
          /* a percentage: 35% of 240 + 17 */
          var P = [15, 25, 35, 45, 60, 75, 85];
          a = P[rnd(0, P.length - 1)]; b = 20 * rnd(3, 30); c = rnd(11, 89);
          if ((a * b) % 100) continue;
          eq = a + '% of ' + b + ' + ' + c;
          ans = a * b / 100 + c;
        } else {
          /* a fraction of a number: 3/4 of 96 - 17 */
          var F = [[2, 3], [3, 4], [3, 5], [5, 6], [4, 7], [5, 8], [7, 9]];
          var fr = F[rnd(0, F.length - 1)];
          b = fr[1] * rnd(6, 30); c = rnd(11, 59);
          eq = fr[0] + '/' + fr[1] + ' of ' + b + ' ' + M + ' ' + c;
          ans = fr[0] * b / fr[1] - c;
        }
        if (ans > 0 && ans === Math.floor(ans) && digitSum(String(ans)) <= 14) break;
      }
      state.answer = ans;
      state.equation = eq;
      if (mathEl) mathEl.textContent = eq;
    }

    var mathEl = null;                   // where the equation is shown, once its box exists

    /* the number on its own: a run of digits that is exactly it */
    function hasNumber(pw, n) {
      var runs = pw.match(/[0-9]+/g) || [];
      for (var i = 0; i < runs.length; i++) if (parseInt(runs[i], 10) === n && runs[i].charAt(0) !== '0') return true;
      return false;
    }

    /* ---- the chess puzzles: white to move and mate. The mates were
       worked out by a move generator (every legal move tried, every
       black reply checked), so they're every move that mates - and any
       of them is the best move. Written with or without the #. ---- */
    var PUZZLES = [
      { fen: '6k1/5ppp/8/8/8/8/5PPP/3R2K1', mates: ['Rd8#'] },
      { fen: '7k/5Q2/6K1/8/8/8/8/8', mates: ['Qe8#', 'Qf8#', 'Qg7#', 'Qh7#'] },
      { fen: '6rk/6pp/8/6N1/8/8/8/6K1', mates: ['Nf7#'] },
      { fen: 'r1bqkbnr/pppp1ppp/2n5/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR', mates: ['Qxf7#'] },
      { fen: 'k7/8/1K6/8/8/8/8/7R', mates: ['Rh8#'] },
      { fen: 'rnbqkbnr/ppppp2p/5p2/6p1/4P3/3P4/PPP2PPP/RNBQKBNR', mates: ['Qh5#'] },
      { fen: '4k3/R7/4K3/8/8/8/8/1R6', mates: ['Ra8#', 'Rb8#'] },
      { fen: 'k7/1R6/2K5/8/8/8/8/7R', mates: ['Rh8#', 'Ra1#'] },
      { fen: 'k7/2P5/1K6/8/8/8/8/8', mates: ['c8=Q#', 'c8=R#'] },
      { fen: '6k1/5ppp/8/8/8/8/1B3PPP/3Q2K1', mates: ['Qd8#'] },
      { fen: '6k1/5ppp/8/8/8/8/5PPP/1R2R1K1', mates: ['Rb8#', 'Re8#'] },
      { fen: '6k1/5p1p/6pB/8/8/8/6PP/3Q2K1', mates: ['Qd8#'] },
      { fen: '3k4/3P4/3K4/8/8/8/8/7R', mates: ['Rh8#'] }
    ];

    /* the mating move in it, if there is one (with or without the #) */
    function chessMove(pw) {
      var m = PUZZLES[state.puzzle].mates;
      for (var i = 0; i < m.length; i++) {
        if (pw.indexOf(m[i].replace('#', '')) !== -1) return m[i];
      }
      return null;
    }

    function newPuzzle() {
      state.puzzle = Math.floor(Math.random() * PUZZLES.length);
      drawBoard();
    }

    /* the board: light and dark squares, the pieces as chess symbols -
       white ones filled white and edged dark, black ones dark - and the
       files and ranks round the edge */
    var boardCanvas = null;
    var GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
    function drawBoard() {
      if (!boardCanvas || !boardCanvas.getContext) return;
      var c = boardCanvas.getContext('2d'), S = 34, M = 18;
      c.fillStyle = '#0b1022';
      c.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
      var rows = PUZZLES[state.puzzle].fen.split('/');
      for (var r = 0; r < 8; r++) {
        for (var f = 0; f < 8; f++) {
          c.fillStyle = (r + f) % 2 ? '#7a5a8c' : '#e6dcef';
          c.fillRect(M + f * S, r * S, S, S);
        }
        var file = 0, row = rows[r];
        for (var i = 0; i < row.length; i++) {
          var ch = row.charAt(i);
          if (/[1-8]/.test(ch)) { file += +ch; continue; }
          var isW = ch === ch.toUpperCase();
          c.font = Math.round(S * 0.86) + 'px "Segoe UI Symbol", "DejaVu Sans", "Arial Unicode MS", serif';
          c.textAlign = 'center';
          c.textBaseline = 'middle';
          var x = M + file * S + S / 2, y = r * S + S / 2 + 2, g = GLYPH[ch.toLowerCase()] + '︎';
          c.lineWidth = 2.2;
          c.strokeStyle = isW ? '#1b1430' : '#e6dcef';
          c.strokeText(g, x, y);
          c.fillStyle = isW ? '#ffffff' : '#1b1430';
          c.fillText(g, x, y);
          file++;
        }
      }
      c.fillStyle = '#8ea7d6';                          // a..h along the bottom, 8..1 up the side
      c.font = 'bold 11px sans-serif';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      for (var k = 0; k < 8; k++) {
        c.fillText('abcdefgh'.charAt(k), M + k * S + S / 2, 8 * S + 9);
        c.fillText(String(8 - k), M / 2, k * S + S / 2);
      }
    }

    /* ---- the moon, worked out from the date - no internet needed. It
       goes round once every 29.53 days, counted from a known new moon
       (6 January 2000, 18:14 UTC), and the month is split into its eight
       phases, each centred on its moment. ---- */
    var MOONS = ['🌑', '🌒', '🌓', '🌔',    // new, waxing crescent, first quarter, waxing gibbous
                 '🌕', '🌖', '🌗', '🌘'];   // full, waning gibbous, last quarter, waning crescent
    var SYNODIC = 29.530588853;
    var KNOWN_NEW = Date.UTC(2000, 0, 6, 18, 14);
    function moonPhase(date) {
      var days = (date.getTime() - KNOWN_NEW) / 86400000;
      var age = ((days % SYNODIC) + SYNODIC) % SYNODIC;
      return Math.floor(age / SYNODIC * 8 + 0.5) % 8;
    }

    /* ---- the periodic table's two-letter symbols: a capital and then a
       small letter, exactly as written (He, not HE or he) ---- */
    var ELEMENTS = ('He Li Be Ne Na Mg Al Si Cl Ar Ca Sc Ti Cr Mn Fe Co Ni Cu Zn Ga Ge As Se ' +
      'Br Kr Rb Sr Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd ' +
      'Tb Dy Ho Er Tm Yb Lu Hf Ta Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa Np Pu ' +
      'Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og').split(' ');
    function hasElement(pw) {
      for (var i = 0; i < ELEMENTS.length; i++) if (pw.indexOf(ELEMENTS[i]) !== -1) return true;
      return false;
    }

    /* ---- a leap year: any number in it (each run of digits is one
       number) that's a leap year - 0 included ---- */
    function isLeap(n) { return n % 4 === 0 && (n % 100 !== 0 || n % 400 === 0); }   // 0 counts
    function hasLeapYear(pw) {
      var runs = pw.match(/[0-9]+/g) || [];
      for (var i = 0; i < runs.length; i++) if (isLeap(parseInt(runs[i], 10))) return true;
      return false;
    }

    /* ---- the CAPTCHA: five random lowercase letters and numbers ---- */
    var CAP_CHARS = 'abcdefghijklmnopqrstuvwxyz0123456789';
    function newCaptcha() {
      var s = '';
      for (var i = 0; i < 5; i++) s += CAP_CHARS.charAt(Math.floor(Math.random() * CAP_CHARS.length));
      state.captcha = s;
      drawCaptcha();
    }

    /* ---- what the rules need ---- */
    function digitSum(pw) {
      var s = 0;
      for (var i = 0; i < pw.length; i++) if (/[0-9]/.test(pw.charAt(i))) s += +pw.charAt(i);
      return s;
    }

    /* the Roman numerals in it: each run of capital I V X L C D M */
    function romans(pw) {
      return pw.match(/[IVXLCDM]+/g) || [];
    }

    var ROMAN = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };

    /* one numeral's value, the usual way: a smaller one before a bigger
       one is taken away (IV = 4, XIX = 19) */
    function romanValue(r) {
      var total = 0;
      for (var i = 0; i < r.length; i++) {
        var v = ROMAN[r.charAt(i)], next = i + 1 < r.length ? ROMAN[r.charAt(i + 1)] : 0;
        total += v < next ? -v : v;
      }
      return total;
    }

    function romanProduct(pw) {
      var r = romans(pw), p = 1;
      for (var i = 0; i < r.length; i++) p *= romanValue(r[i]);
      return p;
    }

    function toRoman(n) {
      var parts = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'],
                   [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
      var s = '';
      for (var i = 0; i < parts.length; i++) while (n >= parts[i][0]) { s += parts[i][1]; n -= parts[i][0]; }
      return s;
    }

    /* each game, a new number for the numerals to multiply to: 10 to 30 */
    /* ---- every element, in order: the atomic number is the place in
       the list. Read left to right through the password, a capital and a
       small letter that make a symbol count as that (He, Ho); otherwise a
       capital that's one on its own counts (H, C, N, I...). ---- */
    var TABLE = ('H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu ' +
      'Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr ' +
      'Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac ' +
      'Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og').split(' ');
    var ATOMIC = {};
    for (var an = 0; an < TABLE.length; an++) ATOMIC[TABLE[an]] = an + 1;

    function elementSum(pw) {
      var sum = 0;
      for (var i = 0; i < pw.length; i++) {
        var two = pw.substr(i, 2), one = pw.charAt(i);
        if (/^[A-Z][a-z]$/.test(two) && ATOMIC[two]) { sum += ATOMIC[two]; i++; }
        else if (/[A-Z]/.test(one) && ATOMIC[one]) sum += ATOMIC[one];
      }
      return sum;
    }

    /* where the elements are in it, as [start, end) spans - read the same
       way as elementSum */
    function elementSpans(pw) {
      var out = [];
      for (var i = 0; i < pw.length; i++) {
        var two = pw.substr(i, 2), one = pw.charAt(i);
        if (/^[A-Z][a-z]$/.test(two) && ATOMIC[two]) { out.push([i, i + 2]); i++; }
        else if (/[A-Z]/.test(one) && ATOMIC[one]) out.push([i, i + 1]);
      }
      return out;
    }

    /* ---- bold: which characters of the password are bold, kept beside
       the text (the text box itself can't hold it). For the password
       that's in the box, that's what you've bolded; for one the game is
       only trying out, nothing is. ---- */
    function boldOf(pw) { return pw === state.text ? state.bold : []; }

    function unboldedVowels(pw) {
      var b = boldOf(pw), out = [];
      for (var i = 0; i < pw.length; i++) {
        if (/[aeiouAEIOU]/.test(pw.charAt(i)) && !b[i]) out.push([i, i + 1]);
      }
      return out;
    }

    /* The text in the box has changed: work out what was taken out and
       what was put in (the same at the start, the same at the end, the
       rest is new), keep the bold of what stayed, and make what was typed
       bold if bold typing is on. */
    function syncBold(pw) {
      var old = state.text, ob = state.bold;
      if (pw === old) return;
      var p = 0;
      while (p < old.length && p < pw.length && old.charAt(p) === pw.charAt(p)) p++;
      var s = 0;
      while (s < old.length - p && s < pw.length - p &&
             old.charAt(old.length - 1 - s) === pw.charAt(pw.length - 1 - s)) s++;
      var nb = ob.slice(0, p);
      for (var i = p; i < pw.length - s; i++) nb.push(state.boldMode);
      for (i = old.length - s; i < old.length; i++) nb.push(!!ob[i]);
      state.text = pw;
      state.bold = nb;
    }

    /* every match of a pattern, as [start, end) spans */
    function spansOf(pw, re) {
      var out = [], m;
      re.lastIndex = 0;
      while ((m = re.exec(pw)) !== null) {
        out.push([m.index, m.index + m[0].length]);
        if (!m[0].length) re.lastIndex++;
      }
      return out;
    }

    /* elements making up `r`, each on its own (a dot after each so it
       can't join the next letter) - none of them a Roman numeral */
    function elementFill(r) {
      var BITS = [['U', 92], ['W', 74], ['Y', 39], ['K', 19], ['S', 16], ['P', 15], ['F', 9],
                  ['O', 8], ['N', 7], ['B', 5], ['H', 1]];
      var s = '';
      for (var i = 0; i < BITS.length; i++) while (r >= BITS[i][1]) { s += BITS[i][0] + '.'; r -= BITS[i][1]; }
      return s;
    }

    /* the mating move that adds least to the elements (Ra8 has radium in it) */
    function lightestMate() {
      var m = PUZZLES[state.puzzle].mates, best = m[0];
      for (var i = 1; i < m.length; i++) if (elementSum(m[i]) < elementSum(best)) best = m[i];
      return best;
    }

    function newTarget() {
      /* 10 to 30 - but not 13, 18, 23 or 28: their numerals (XIII, XVIII...)
         are so full of iodine and vanadium that the elements could never
         come back down to 200 */
      do { state.target = 10 + Math.floor(Math.random() * 21); }
      while (elementSum(toRoman(state.target)) > 153);
      RULES[5].text = 'The Roman numerals in your password must multiply to ' + state.target + '.';
    }

    var state = { revealed: 0, target: 0, captcha: '', puzzle: 0, answer: 0, equation: '', meowyIn: false, dead: false, fireLit: false, fireOut: false, awake: false, nextMeal: 0,
                  text: '', bold: [], boldMode: false };

    /* every rule shown so far, met or not */
    function results(pw) {
      var out = [];
      for (var i = 0; i < state.revealed; i++) if (!gone(i)) out.push({ n: i + 1, ok: RULES[i].check(pw) });
      return out;
    }

    function allMet(pw) {
      for (var i = 0; i < state.revealed; i++) if (!gone(i) && !RULES[i].check(pw)) return false;
      return true;
    }

    /* Some rules go away for good once done, with no more warnings: the
       fire, once it's out, and feeding Meowy, once you've fed him the
       first time (after that, it's up to you to remember). */
    function gone(i) {
      return (i === 16 && state.fireOut) || (i === 17 && state.nextMeal > 0);
    }

    /* Rule 1 comes with the first thing you type; each next one comes
       once every rule showing is met. Shown rules never go away. */
    function reveal(pw) {
      if (!state.revealed && pw.length) state.revealed = 1;
      while (state.revealed && state.revealed < RULES.length && allMet(pw)) state.revealed++;
    }

    /* broken ones on top, then the met ones, newest first */
    function ordered(pw) {
      var list = results(pw);
      list.sort(function (a, b) {
        if (a.ok !== b.ok) return a.ok ? 1 : -1;
        return b.n - a.n;
      });
      return list;
    }

    function allRulesMet(pw) {
      for (var i = 0; i < RULES.length; i++) if (!RULES[i].check(pw)) return false;
      return true;
    }

    function won(pw) {
      return state.revealed === RULES.length && allMet(pw);
    }

    /* GENERATE: start from a word and let each rule fix what it needs,
       until it meets all of them */
    /* A password that meets the first `n` rules (all of them, if not
       given). */
    function generate(n) {
      if (n === undefined) n = RULES.length;
      var withCap = n >= 7;                         // rule 7 is the CAPTCHA
      /* the CAPTCHA's numbers count towards the 25 - if they're already
         over it, get a new one, the way a player would */
      var withLeap = n >= 9;                        // rule 9 is the leap year
      var move = n >= 11 ? lightestMate() : '';                     // rule 11, the chess move
      var moveDigits = digitSum(move);
      var answer = n >= 12 ? String(state.answer) : '';             // rule 12, the math
      moveDigits += digitSum(answer);
      /* (stopping short of the leap year rule, a CAPTCHA with one in it
         would give it away - so get another of those too) */
      if (withCap) for (var tries = 0; tries < 50 &&
                        (digitSum(state.captcha) > 25 - moveDigits || (!withLeap && hasLeapYear(state.captcha))); tries++) newCaptcha();
      var need = 25 - (withCap ? digitSum(state.captcha) : 0) - moveDigits;   // the move's numbers count too
      /* a leap year whose digits fit in what's left of the 25 */
      var leap = '';
      if (withLeap) {
        var LEAPS = ['36', '8', '16', '24', '32', '4', '12', '20', '10000', '0'];   // digit sums 9 down to 0
        for (var li = 0; li < LEAPS.length; li++) {
          if (digitSum(LEAPS[li]) <= need) { leap = LEAPS[li]; need -= digitSum(leap); break; }
        }
      }
      /* the rest as single odd digits, each on its own, so none of them
         is a leap year by accident: 9z9z5 */
      var fill = [];
      while (need > 0) {
        var d = Math.min(9, need);
        if (d % 2 === 0) d--;
        fill.push(d);
        need -= d;
      }
      var pw = 'horse!He' + (withCap ? state.captcha : '') + 'z' + fill.join('z') +
               (leap ? 'y' + leap : '') + 'z' + toRoman(state.target) + (move ? 'z' + move + 'z' : '') +
               (answer ? 'z' + answer + 'z' : '');
      /* and anything else, rule by rule */
      for (var round = 0; round < 10; round++) {
        var changed = false;
        for (var i = 0; i < n; i++) {
          if (RULES[i].format) continue;           // bolding is done to it after, not in it
          if (!RULES[i].check(pw)) { pw = RULES[i].fix(pw); changed = true; }
        }
        if (!changed) break;
      }
      return pw;
    }

    /* every rule but the last met, and the last not: where GENERATE
       stops first, so you can see the last rule */
    function allButLast(pw) {
      for (var i = 0; i < RULES.length - 1; i++) if (!RULES[i].check(pw)) return false;
      return !RULES[RULES.length - 1].check(pw);
    }

    /* ============================================================
       ON THE PAGE
       ============================================================ */
    var input = document.getElementById('pw');
    var hlEl = document.getElementById('hl');
    var rulesEl = document.getElementById('rules');
    var winEl = document.getElementById('win');
    var countEl = document.getElementById('count');

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }


    function update() {
      var pw = input.value || '';
      /* Meowy: once he's in, he has to stay in */
      if (state.meowyIn && pw.indexOf(MEOWY) === -1) { killMeowy(); return; }
      if (pw.indexOf(MEOWY) !== -1) state.meowyIn = true;
      syncBold(pw);
      reveal(pw);
      /* the fire rule shows: the fire starts */
      if (state.revealed >= 17 && !state.fireLit) { lightFire(); if (state.fireLit && pw !== input.value) return; }
      if (state.fireLit && pw.indexOf(FIRE) === -1) state.fireOut = true;
      /* the food rule shows: Meowy wakes */
      if (state.revealed >= 18 && !state.awake) { wakeMeowy(); update(); return; }
      if (state.awake) {
        var fish = countFood(pw);
        if (fish >= FOOD_MAX) { killMeowy('Meowy was overfed.'); return; }
        if (fish && !state.nextMeal) state.nextMeal = new Date().getTime() + FOOD_EVERY;   // his meals start with the first one
      }
      countEl.textContent = pw.length ? pw.length + (pw.length === 1 ? ' character' : ' characters') : '';

      render(ordered(pw));
      highlight(pw);
      /* how many buff guys you have, as a bar */
      if (buffFillEl && buffFillEl.style) buffFillEl.style.width = Math.min(countBuff(pw), BUFF_NEED) / BUFF_NEED * 100 + '%';
      /* the Bold button comes with the bold rule */
      if (toolbarEl) {
        var bolding = state.revealed >= BOLD_RULE + 1;
        if (bolding) { toolbarEl.classList.remove('hidden'); fieldEl.classList.add('bolding'); }
        else { toolbarEl.classList.add('hidden'); fieldEl.classList.remove('bolding'); }
        if (input.style) { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; }   // (the room for the button can change how many lines it takes)
      }

      if (won(pw)) {
        winEl.innerHTML = '<h2>Your password is strong enough!</h2>' +
                          '<code>' + withBold(pw) + '</code>' +
                          '<button type="button" id="againBtn">PLAY AGAIN</button>';
        winEl.classList.remove('hidden');
        var again = document.getElementById('againBtn');
        if (again && again.addEventListener) again.addEventListener('click', restart);
      } else {
        winEl.classList.add('hidden');
      }
    }

    /* Each rule keeps its own box, so when the order changes - a rule
       broken and jumping back to the top, or met and dropping back down -
       the boxes slide from where they were to where they're going,
       rather than just being somewhere else. */
    var boxes = {};
    var MOVE = 'transform 0.45s cubic-bezier(.2,.8,.2,1)';

    /* The CAPTCHA, drawn the way the nasty ones are: on a speckled
       ground, the characters crowded together and overlapping, each in
       its own font, size, tilt and height - then the whole thing bent
       into a wave, and scratched through with lines and dots in the
       same inks as the letters. */
    var capCanvas = null;
    function drawCaptcha() {
      if (!capCanvas || !capCanvas.getContext) return;
      var c = capCanvas.getContext('2d'), w = capCanvas.width, h = capCanvas.height, i;
      var rnd = function (a, b) { return a + Math.random() * (b - a); };
      var fonts = ['Georgia', 'Courier New', 'Verdana', 'Times New Roman', 'Trebuchet MS'];
      var inks = ['#2b3a78', '#5a1e3a', '#1e4a3a', '#3a2a5c', '#4a3a1e', '#24304f'];
      var ink = function () { return inks[Math.floor(rnd(0, inks.length))]; };

      c.fillStyle = '#dfe3ee';
      c.fillRect(0, 0, w, h);
      for (i = 0; i < 420; i++) {                       // speckle
        c.fillStyle = 'rgba(40,50,80,' + rnd(0.08, 0.35) + ')';
        c.fillRect(rnd(0, w), rnd(0, h), rnd(1, 2.5), rnd(1, 2.5));
      }

      /* the characters, drawn flat first ... */
      var off = document.createElement('canvas');
      off.width = w;
      off.height = h;
      var o = off.getContext('2d');
      var step = (w - 50) / state.captcha.length;
      for (i = 0; i < state.captcha.length; i++) {
        o.save();
        o.translate(30 + i * step + rnd(-5, 5), h / 2 + rnd(-10, 10));
        o.rotate(rnd(-0.6, 0.6));
        o.transform(1, 0, rnd(-0.35, 0.35), 1, 0, 0);    // a lean
        o.scale(rnd(0.85, 1.25), rnd(0.85, 1.25));
        o.font = (Math.random() < 0.5 ? 'bold ' : '') + Math.round(rnd(40, 52)) + 'px ' +
                 fonts[Math.floor(rnd(0, fonts.length))];
        o.textAlign = 'center';
        o.textBaseline = 'middle';
        if (Math.random() < 0.25) {                     // some only outlined
          o.strokeStyle = ink();
          o.lineWidth = 2;
          o.strokeText(state.captcha.charAt(i), 0, 0);
        } else {
          o.fillStyle = ink();
          o.fillText(state.captcha.charAt(i), 0, 0);
        }
        o.restore();
      }
      for (i = 0; i < 3; i++) {                         // lines that bend with them
        o.strokeStyle = ink();
        o.lineWidth = rnd(1.5, 3);
        o.beginPath();
        o.moveTo(0, rnd(0, h));
        o.bezierCurveTo(w / 3, rnd(0, h), 2 * w / 3, rnd(0, h), w, rnd(0, h));
        o.stroke();
      }

      /* ... then bent: each thin column moved up or down along a wave */
      var amp = rnd(5, 9), freq = rnd(0.025, 0.045), ph = rnd(0, 6.3);
      for (var x = 0; x < w; x += 2) {
        c.drawImage(off, x, 0, 2, h, x, Math.sin(x * freq + ph) * amp, 2, h);
      }

      for (i = 0; i < 3; i++) {                         // and scratched over the top
        c.strokeStyle = 'rgba(40,50,80,' + rnd(0.35, 0.65) + ')';
        c.lineWidth = rnd(1, 2);
        c.beginPath();
        c.moveTo(0, rnd(0, h));
        c.bezierCurveTo(w / 3, rnd(0, h), 2 * w / 3, rnd(0, h), w, rnd(0, h));
        c.stroke();
      }
      for (i = 0; i < 60; i++) {                        // ink spots
        c.fillStyle = ink();
        c.beginPath();
        c.arc(rnd(0, w), rnd(0, h), rnd(0.8, 2.2), 0, Math.PI * 2);
        c.fill();
      }
    }

    function boxFor(n) {
      if (boxes[n]) return boxes[n];
      var el = document.createElement('div');
      el.className = 'rule new';
      el.innerHTML = '<div class="head"><span class="mark"></span>Rule ' + n + '</div>' +
                     '<div class="body">' + esc(RULES[n - 1].text) +
                     (RULES[n - 1].captcha ?
                       '<div class="cap"><canvas width="320" height="96"></canvas>' +
                       '<button type="button" class="refresh" title="A new one">&#8635;</button></div>' : '') +
                     (RULES[n - 1].chess ? '<div class="board"><canvas width="290" height="292"></canvas></div>' : '') +
                     (RULES[n - 1].meowy ? '<div class="meowy">' + MEOWY + '</div>' : '') +
                     (RULES[n - 1].food ? '<div class="meowy">' + FOOD + '</div>' : '') +
                     (RULES[n - 1].buff ? '<div class="meowy">' + BUFF + '</div>' +
                       '<div class="buffbar"><div class="fill"></div></div>' : '') +
                     (RULES[n - 1].math ? '<div class="cap"><div class="eq"></div>' +
                       '<button type="button" class="refresh" title="A new one">&#8635;</button></div>' : '') +
                     '</div>';
      if (RULES[n - 1].buff) buffFillEl = el.querySelector('.fill');
      if (RULES[n - 1].math) {
        mathEl = el.querySelector('.eq');
        mathEl.textContent = state.equation;
        el.querySelector('.refresh').addEventListener('click', function () {
          newMath();
          update();
        });
      }
      if (RULES[n - 1].chess) {
        boardCanvas = el.querySelector('canvas');
        drawBoard();
      }
      if (RULES[n - 1].captcha) {
        capCanvas = el.querySelector('canvas');
        drawCaptcha();
        el.querySelector('.refresh').addEventListener('click', function () {
          newCaptcha();
          update();
        });
      }
      /* the slide-in is for its first appearance only */
      el.addEventListener('animationend', function () { el.classList.remove('new'); });
      boxes[n] = el;
      return el;
    }

    function render(list) {
      if (!rulesEl.appendChild || !document.createElement) return;   // (the test harness has no page)
      /* where each box is now */
      var was = {}, n;
      for (n in boxes) was[n] = boxes[n].getBoundingClientRect().top;
      /* into the new order, coloured for met or broken */
      for (var i = 0; i < list.length; i++) {
        var r = list[i], el = boxFor(r.n);
        if (r.ok) el.classList.add('ok'); else el.classList.remove('ok');
        el.querySelector('.mark').innerHTML = r.ok ? '&#10003;' : '&#10007;';
        rulesEl.appendChild(el);
      }
      /* (and the ones that have gone, gone) */
      var showing = {};
      for (i = 0; i < list.length; i++) showing[list[i].n] = true;
      for (n in boxes) if (!showing[n]) {
        if (boxes[n].parentNode) boxes[n].parentNode.removeChild(boxes[n]);
        delete boxes[n];
      }
      /* and slide each from where it was to where it is */
      for (i = 0; i < list.length; i++) {
        el = boxes[list[i].n];
        if (was[list[i].n] === undefined) continue;
        var dy = was[list[i].n] - el.getBoundingClientRect().top;
        if (Math.abs(dy) < 1) continue;
        el.style.transition = 'none';
        el.style.transform = 'translateY(' + dy + 'px)';
        el.getBoundingClientRect();                   // let it take that, then go
        el.style.transition = MOVE;
        el.style.transform = '';
      }
    }

    /* The red: for each rule that's showing and broken and is about
       particular characters (the digits, the Roman numerals, the
       elements), those characters are marked in the copy of the text
       behind the box - so you can see what has to change. */
    function marked(pw) {
      var on = [], i, j;
      for (i = 0; i < state.revealed; i++) {
        var rule = RULES[i];
        if (!rule.marks || rule.check(pw)) continue;
        var spans = rule.marks(pw);
        for (j = 0; j < spans.length; j++) for (var k = spans[j][0]; k < spans[j][1]; k++) on[k] = true;
      }
      return on;
    }

    /* the password as written, bold and all - for the win box */
    function withBold(pw) {
      var b = boldOf(pw), html = '', on = false;
      for (var i = 0; i < pw.length; i++) {
        if (b[i] && !on) { html += '<b>'; on = true; }
        if (!b[i] && on) { html += '</b>'; on = false; }
        html += esc(pw.charAt(i));
      }
      return html + (on ? '</b>' : '');
    }

    /* the text you see: the copy behind the box, bold where it's bold,
       red where a broken rule says so */
    function highlight(pw) {
      var on = marked(pw), b = boldOf(pw), html = '', cur = '';
      for (var i = 0; i < pw.length; i++) {
        var cls = (b[i] ? 'b' : '') + (on[i] ? ' m' : '');
        if (cls !== cur) {
          if (cur) html += '</span>';
          if (cls) html += '<span class="' + cls + '">';
          cur = cls;
        }
        html += esc(pw.charAt(i));
      }
      if (cur) html += '</span>';
      hlEl.innerHTML = html + '​';          // so an empty last line still has height
      /* the box grows to fit the password, a line at a time */
      if (input.style) {
        input.style.height = 'auto';
        input.style.height = input.scrollHeight + 'px';
      }
    }

    /* ---- the buff guys draining away: every quarter second, while the
       rule's showing and you've some but not enough, the last one goes
       (the cursor stays where it was) ---- */
    var buffFillEl = null;
    function drainTick() {
      if (state.revealed < 16 || state.dead) return;
      var pw = input.value || '';
      var n = countBuff(pw);
      if (n >= BUFF_NEED || n === 0) return;
      var at = pw.lastIndexOf(BUFF);
      var a = input.selectionStart, z = input.selectionEnd;
      input.value = pw.slice(0, at) + pw.slice(at + BUFF.length);
      if (typeof a === 'number') {
        var shift = function (p) { return p > at ? Math.max(at, p - BUFF.length) : p; };
        input.selectionStart = shift(a);
        input.selectionEnd = shift(z);
      }
      update();
    }
    if (typeof setInterval !== 'undefined') setInterval(drainTick, BUFF_EVERY);

    /* ---- the fire, lit and spreading ---- */
    /* put changed characters back in the box (the same number of them),
       the cursor staying with the character it was by */
    function setChars(cs, oldCs) {
      var a = input.selectionStart, z = input.selectionEnd;
      var map = function (p) {
        var o = 0, n = 0;
        for (var k = 0; k < oldCs.length; k++) { if (p <= o) return n; o += oldCs[k].length; n += cs[k].length; }
        return n;
      };
      input.value = cs.join('');
      if (typeof a === 'number') { input.selectionStart = map(a); input.selectionEnd = map(z); }
      update();
    }
    function lightFire() {
      state.fireLit = true;
      var cs = chars(input.value || ''), old = cs.slice(), ok = [], i, j;
      for (i = 0; i < cs.length; i++) {
        var near = false;
        for (j = Math.max(0, i - 2); j <= Math.min(cs.length - 1, i + 2); j++) if (cs[j] === MEOWY) near = true;
        if (!near) ok.push(i);
      }
      if (!ok.length) return;
      cs[ok[Math.floor(Math.random() * ok.length)]] = FIRE;
      setChars(cs, old);
    }
    function fireTick() {
      if (state.revealed < 17 || state.dead) return;
      var cs = chars(input.value || ''), next = cs.slice(), i, d, j;
      for (i = 0; i < cs.length; i++) {
        if (cs[i] !== FIRE) continue;
        for (d = -1; d <= 1; d += 2) {
          j = i + d;
          if (j < 0 || j >= cs.length || cs[j] === FIRE || Math.random() >= FIRE_CATCH) continue;
          if (cs[j] === MEOWY) { killMeowy('Meowy has burned.'); return; }
          next[j] = FIRE;
        }
      }
      if (next.join('') !== cs.join('')) setChars(next, cs);
    }
    if (typeof setInterval !== 'undefined') setInterval(fireTick, FIRE_EVERY);

    /* ---- Meowy awake: waking him, and his meals ---- */
    function wakeMeowy() {
      state.awake = true;
      var pw = input.value || '';
      MEOWY = CAT;
      var at = pw.indexOf(ZZZ);
      if (at !== -1) {                   // (the same length, so the cursor can stay put)
        var a = input.selectionStart, z = input.selectionEnd;
        input.value = pw.slice(0, at) + CAT + pw.slice(at + ZZZ.length);
        if (typeof a === 'number') { input.selectionStart = a; input.selectionEnd = z; }
      }
      var box = boxes[13];
      var m = box && box.querySelector ? box.querySelector('.meowy') : null;
      if (m) m.textContent = CAT;
    }
    function mealTick() {
      if (!state.awake || state.dead || !state.nextMeal) return;
      if (new Date().getTime() < state.nextMeal) return;
      state.nextMeal += FOOD_EVERY;
      var pw = input.value || '';
      if (!countFood(pw)) { killMeowy('Meowy has starved.'); return; }
      var cs = chars(pw), old = cs.slice();
      for (var i = 0; i < cs.length; i++) if (cs[i] === FOOD) { cs.splice(i, 1); break; }   // he eats the first one
      var a = input.selectionStart, z = input.selectionEnd, cut = old.slice(0, i).join('').length;
      input.value = cs.join('');
      if (typeof a === 'number') {
        var shift = function (p) { return p > cut ? Math.max(cut, p - FOOD.length) : p; };
        input.selectionStart = shift(a);
        input.selectionEnd = shift(z);
      }
      update();
    }
    if (typeof setInterval !== 'undefined') setInterval(mealTick, 250);

    /* ---- the Bold button (and Ctrl+B): bold or unbold what's selected -
       or, with nothing selected, turn bold typing on or off ---- */
    var BOLD_RULE = 14;                  // the vowels rule, counting from 0
    var toolbarEl = document.getElementById('toolbar');
    var fieldEl = document.querySelector('.field');
    var boldBtn = document.getElementById('boldBtn');

    function toggleBold() {
      var a = input.selectionStart, z = input.selectionEnd;
      if (a === undefined || a === z) {
        state.boldMode = !state.boldMode;
      } else {
        var all = true, i;
        for (i = a; i < z; i++) if (!state.bold[i]) all = false;
        for (i = a; i < z; i++) state.bold[i] = !all;
      }
      if (boldBtn && boldBtn.classList) {
        if (state.boldMode) boldBtn.classList.add('on'); else boldBtn.classList.remove('on');
      }
      update();
    }

    /* put a password the game made into the box - its vowels bolded if
       it's meant to meet the bold rule too */
    function putGenerated(pw, boldVowels) {
      input.value = pw;
      state.text = pw;
      state.bold = [];
      for (var i = 0; i < pw.length; i++) state.bold.push(!!boldVowels && /[aeiouAEIOU]/.test(pw.charAt(i)));
      update();
    }

    /* GENERATE never takes Meowy out once he's in */
    function keepMeowy(pw) {
      return state.meowyIn && pw.indexOf(MEOWY) === -1 ? pw + MEOWY : pw;
    }

    /* You took him out. Black, and the words running down in blood. */
    var deadEl = document.getElementById('dead');
    function killMeowy(msg) {
      state.dead = true;
      state.meowyIn = false;
      if (!deadEl || !deadEl.querySelector) return;
      var msgEl = document.getElementById('deadMsg');
      if (msgEl) msgEl.textContent = msg || 'You have killed Meowy.';
      var drips = deadEl.querySelector('.drips'), html = '';
      for (var i = 0; i < 18; i++) {
        html += '<span style="left:' + (3 + Math.random() * 94) + '%;' +
                'width:' + (3 + Math.random() * 5) + 'px;' +
                'animation-delay:' + (0.4 + Math.random() * 2.2) + 's;' +
                'animation-duration:' + (2.5 + Math.random() * 3) + 's"></span>';
      }
      drips.innerHTML = html;
      deadEl.classList.remove('hidden');
      if (input.blur) input.blur();
    }

    function restart() {
      state.revealed = 0;
      state.meowyIn = false;
      state.dead = false;
      state.fireLit = false;
      state.fireOut = false;
      state.awake = false;
      state.nextMeal = 0;
      MEOWY = ZZZ;
      buffFillEl = null;
      state.text = '';
      state.bold = [];
      state.boldMode = false;
      if (boldBtn && boldBtn.classList) boldBtn.classList.remove('on');
      if (deadEl) deadEl.classList.add("hidden");
      newTarget();
      capCanvas = null;
      newCaptcha();
      boardCanvas = null;
      newPuzzle();
      mathEl = null;
      newMath();
      for (var n in boxes) if (boxes[n].parentNode) boxes[n].parentNode.removeChild(boxes[n]);
      boxes = {};
      input.value = '';
      update();
      if (input.focus) input.focus();
    }

    input.addEventListener('input', update);
    /* one line of password, no Enter */
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') e.preventDefault(); });
    /* GENERATE: first, everything but the last rule, so you can see it;
       press again and it finishes. The tick goes straight to the end. */
    function generateStep() {
      var pw = input.value || '';
      if (allButLast(pw)) { putGenerated(keepMeowy(generate()), true); return; }
      /* stopping short of the last rule - and if what it made happens to
         meet that one anyway (a small answer to the math, say), get a new
         equation and try again, the way a player would refresh */
      for (var tries = 0; tries < 30; tries++) {
        pw = generate(RULES.length - 1);
        if (!RULES[RULES.length - 1].check(pw)) break;
        if (RULES[RULES.length - 1].math) newMath(); else break;
      }
      putGenerated(keepMeowy(pw), RULES.length - 1 > BOLD_RULE);
    }
    document.getElementById('genBtn').addEventListener('click', generateStep);
    document.getElementById('startOver').addEventListener('click', restart);
    document.getElementById('genAllBtn').addEventListener('click', function () {
      state.fireLit = true;              // (straight to the end: the fire's been and gone)
      putGenerated(keepMeowy(generate()), true);
    });
    if (boldBtn) {
      /* (pressing it mustn't take the focus - or the selection - off the box) */
      boldBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
      boldBtn.addEventListener('click', toggleBold);
    }
    input.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'b' || e.key === 'B')) { e.preventDefault(); toggleBold(); }
    });
    if (input.focus) input.focus();
    newTarget();
    newCaptcha();
    newPuzzle();
    newMath();
    update();
  })();
  </script>
</body>
</html>
