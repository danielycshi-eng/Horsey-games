<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a Password - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../gate.js" data-gate="password"></script>
  <style>
    body { justify-content: flex-start; padding-top: 4.5rem; }

    .wrap { width: min(620px, 92vw); display: flex; flex-direction: column; gap: 0.9rem; }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      color: #e0e8ff;
      letter-spacing: 1px;
    }

    .field { position: relative; }
    #pw {
      width: 100%;
      box-sizing: border-box;
      font: 600 1.35rem/1.4 'Consolas', 'Courier New', monospace;
      color: #e0e8ff;
      background: #0b1022;
      border: 2px solid #3a4a78;
      border-radius: 12px;
      padding: 0.85rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #pw:focus { border-color: #4ec3ff; box-shadow: 0 0 0 3px rgba(78, 195, 255, 0.15); }

    .under { display: flex; justify-content: space-between; align-items: center; }
    #count { color: #56658c; font-size: 0.9rem; }
    #genBtn {
      font: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffd166;
      background: transparent;
      border: 1px solid #6b5a2a;
      border-radius: 8px;
      padding: 0.3rem 0.8rem;
      cursor: pointer;
    }
    #genBtn:hover { background: rgba(255, 209, 102, 0.1); }

    /* the rules, spaced out down the page */
    #rules { display: flex; flex-direction: column; gap: 1.1rem; margin-top: 0.4rem; }

    /* a rule: red while it's broken, green once it's met */
    .rule {
      border: 2px solid #ff5f7e;
      border-radius: 12px;
      background: #1a0b14;
      overflow: hidden;
    }
    .rule.new {
      animation: ruleIn 0.35s ease-out;          /* only as it first appears */
    }
    .rule .head {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.6rem 1rem;
      background: rgba(255, 95, 126, 0.18);
      color: #ff8fa3;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .rule .mark {
      width: 1.35rem;
      height: 1.35rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: #05070f;
      background: #ff5f7e;
    }
    .rule .body { padding: 1rem 1.1rem 1.1rem; color: #f0d6dd; text-align: left; font-size: 1.05rem; }
    .rule.ok { border-color: #7bffb2; background: #0b1a14; }
    .rule.ok .head { background: rgba(123, 255, 178, 0.16); color: #9effc6; }
    .rule.ok .mark { background: #7bffb2; }
    .rule.ok .body { color: #d4f5e2; }
    @keyframes ruleIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #win {
      border: 2px solid #7bffb2;
      border-radius: 14px;
      background: #0b1a14;
      padding: 1.2rem;
      text-align: center;
      box-shadow: 0 0 30px rgba(123, 255, 178, 0.2);
      animation: ruleIn 0.4s ease-out;
    }
    #win.hidden { display: none; }
    #win h2 { margin: 0 0 0.5rem; color: #7bffb2; }
    #win code {
      display: block;
      margin: 0.4rem 0 0.9rem;
      font-size: 1.15rem;
      color: #e0e8ff;
      word-break: break-all;
    }
    #againBtn {
      font: inherit;
      font-weight: 700;
      letter-spacing: 2px;
      color: #05070f;
      background: #7bffb2;
      border: none;
      border-radius: 10px;
      padding: 0.55rem 1.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <a href="../games.html" class="back-link">&larr; All Games</a>

  <div class="wrap">
    <h1>Please choose a password</h1>
    <div class="field">
      <input id="pw" type="text" autocomplete="off" spellcheck="false">
    </div>
    <div class="under">
      <span id="count"></span>
      <button type="button" id="genBtn" title="Fill in a password that meets every rule (for testing)">GENERATE</button>
    </div>
    <div id="win" class="hidden"></div>
    <div id="rules"></div>
  </div>

  <script>
  (function () {
    'use strict';

    /* ============================================================
       THE RULES
       In order. Each: what it says, whether a password meets it, and
       (for GENERATE) how to change a password so it does. Adding one is
       adding a line here.
       ============================================================ */
    var RULES = [
      { text: 'Your password must be at least 5 characters.',
        check: function (pw) { return pw.length >= 5; },
        fix:   function (pw) { while (pw.length < 5) pw += 'x'; return pw; } },
      { text: 'Your password must include a number.',
        check: function (pw) { return /[0-9]/.test(pw); },
        fix:   function (pw) { return pw + '1'; } },
      { text: 'Your password must include a special character.',
        check: function (pw) { return /[^A-Za-z0-9\s]/.test(pw); },
        fix:   function (pw) { return pw + '!'; } },
      { text: 'The digits in your password must add up to 25.',
        check: function (pw) { return digitSum(pw) === 25; },
        fix:   function (pw) { return pw.replace(/[0-9]/g, '') + '997'; } },
      { text: 'Your password must include a Roman numeral.',
        check: function (pw) { return romans(pw).length > 0; },
        fix:   function (pw) { return pw + 'X'; } },
      { text: '',                        // set for each game: see newTarget()
        check: function (pw) { var r = romans(pw); return r.length > 0 && romanProduct(pw) === state.target; },
        fix:   function (pw) { return pw.replace(/[IVXLCDM]/g, '') + toRoman(state.target); } }
    ];

    /* ---- what the rules need ---- */
    function digitSum(pw) {
      var s = 0;
      for (var i = 0; i < pw.length; i++) if (/[0-9]/.test(pw.charAt(i))) s += +pw.charAt(i);
      return s;
    }

    /* the Roman numerals in it: each run of capital I V X L C D M */
    function romans(pw) {
      return pw.match(/[IVXLCDM]+/g) || [];
    }

    var ROMAN = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };

    /* one numeral's value, the usual way: a smaller one before a bigger
       one is taken away (IV = 4, XIX = 19) */
    function romanValue(r) {
      var total = 0;
      for (var i = 0; i < r.length; i++) {
        var v = ROMAN[r.charAt(i)], next = i + 1 < r.length ? ROMAN[r.charAt(i + 1)] : 0;
        total += v < next ? -v : v;
      }
      return total;
    }

    function romanProduct(pw) {
      var r = romans(pw), p = 1;
      for (var i = 0; i < r.length; i++) p *= romanValue(r[i]);
      return p;
    }

    function toRoman(n) {
      var parts = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'],
                   [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
      var s = '';
      for (var i = 0; i < parts.length; i++) while (n >= parts[i][0]) { s += parts[i][1]; n -= parts[i][0]; }
      return s;
    }

    /* each game, a new number for the numerals to multiply to: 10 to 30 */
    function newTarget() {
      state.target = 10 + Math.floor(Math.random() * 21);
      RULES[5].text = 'The Roman numerals in your password must multiply to ' + state.target + '.';
    }

    var state = { revealed: 0, target: 0 };

    /* every rule shown so far, met or not */
    function results(pw) {
      var out = [];
      for (var i = 0; i < state.revealed; i++) out.push({ n: i + 1, ok: RULES[i].check(pw) });
      return out;
    }

    function allMet(pw) {
      for (var i = 0; i < state.revealed; i++) if (!RULES[i].check(pw)) return false;
      return true;
    }

    /* Rule 1 comes with the first thing you type; each next one comes
       once every rule showing is met. Shown rules never go away. */
    function reveal(pw) {
      if (!state.revealed && pw.length) state.revealed = 1;
      while (state.revealed && state.revealed < RULES.length && allMet(pw)) state.revealed++;
    }

    /* broken ones on top, then the met ones, newest first */
    function ordered(pw) {
      var list = results(pw);
      list.sort(function (a, b) {
        if (a.ok !== b.ok) return a.ok ? 1 : -1;
        return b.n - a.n;
      });
      return list;
    }

    function won(pw) {
      return state.revealed === RULES.length && allMet(pw);
    }

    /* GENERATE: start from a word and let each rule fix what it needs,
       until it meets all of them */
    function generate() {
      var pw = 'Horse';
      for (var round = 0; round < 10; round++) {
        var changed = false;
        for (var i = 0; i < RULES.length; i++) {
          if (!RULES[i].check(pw)) { pw = RULES[i].fix(pw); changed = true; }
        }
        if (!changed) break;
      }
      return pw;
    }

    /* ============================================================
       ON THE PAGE
       ============================================================ */
    var input = document.getElementById('pw');
    var rulesEl = document.getElementById('rules');
    var winEl = document.getElementById('win');
    var countEl = document.getElementById('count');

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }


    function update() {
      var pw = input.value || '';
      reveal(pw);
      countEl.textContent = pw.length ? pw.length + (pw.length === 1 ? ' character' : ' characters') : '';

      render(ordered(pw));

      if (won(pw)) {
        winEl.innerHTML = '<h2>Your password is strong enough!</h2>' +
                          '<code>' + esc(pw) + '</code>' +
                          '<button type="button" id="againBtn">PLAY AGAIN</button>';
        winEl.classList.remove('hidden');
        var again = document.getElementById('againBtn');
        if (again && again.addEventListener) again.addEventListener('click', restart);
      } else {
        winEl.classList.add('hidden');
      }
    }

    /* Each rule keeps its own box, so when the order changes - a rule
       broken and jumping back to the top, or met and dropping back down -
       the boxes slide from where they were to where they're going,
       rather than just being somewhere else. */
    var boxes = {};
    var MOVE = 'transform 0.45s cubic-bezier(.2,.8,.2,1)';

    function boxFor(n) {
      if (boxes[n]) return boxes[n];
      var el = document.createElement('div');
      el.className = 'rule new';
      el.innerHTML = '<div class="head"><span class="mark"></span>Rule ' + n + '</div>' +
                     '<div class="body">' + esc(RULES[n - 1].text) + '</div>';
      /* the slide-in is for its first appearance only */
      el.addEventListener('animationend', function () { el.classList.remove('new'); });
      boxes[n] = el;
      return el;
    }

    function render(list) {
      if (!rulesEl.appendChild || !document.createElement) return;   // (the test harness has no page)
      /* where each box is now */
      var was = {}, n;
      for (n in boxes) was[n] = boxes[n].getBoundingClientRect().top;
      /* into the new order, coloured for met or broken */
      for (var i = 0; i < list.length; i++) {
        var r = list[i], el = boxFor(r.n);
        if (r.ok) el.classList.add('ok'); else el.classList.remove('ok');
        el.querySelector('.mark').innerHTML = r.ok ? '&#10003;' : '&#10007;';
        rulesEl.appendChild(el);
      }
      /* and slide each from where it was to where it is */
      for (i = 0; i < list.length; i++) {
        el = boxes[list[i].n];
        if (was[list[i].n] === undefined) continue;
        var dy = was[list[i].n] - el.getBoundingClientRect().top;
        if (Math.abs(dy) < 1) continue;
        el.style.transition = 'none';
        el.style.transform = 'translateY(' + dy + 'px)';
        el.getBoundingClientRect();                   // let it take that, then go
        el.style.transition = MOVE;
        el.style.transform = '';
      }
    }

    function restart() {
      state.revealed = 0;
      newTarget();
      for (var n in boxes) if (boxes[n].parentNode) boxes[n].parentNode.removeChild(boxes[n]);
      boxes = {};
      input.value = '';
      update();
      if (input.focus) input.focus();
    }

    input.addEventListener('input', update);
    document.getElementById('genBtn').addEventListener('click', function () {
      input.value = generate();
      update();
    });
    if (input.focus) input.focus();
    newTarget();
    update();
  })();
  </script>
</body>
</html>
