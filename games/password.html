<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a Password - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../gate.js" data-gate="password"></script>
  <style>
    body { justify-content: flex-start; padding-top: 4.5rem; }

    .wrap { width: min(620px, 92vw); display: flex; flex-direction: column; gap: 0.9rem; }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      color: #e0e8ff;
      letter-spacing: 1px;
    }

    .field { position: relative; }
    #pw {
      width: 100%;
      box-sizing: border-box;
      font: 600 1.35rem/1.4 'Consolas', 'Courier New', monospace;
      color: #e0e8ff;
      background: #0b1022;
      border: 2px solid #3a4a78;
      border-radius: 12px;
      padding: 0.85rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #pw:focus { border-color: #4ec3ff; box-shadow: 0 0 0 3px rgba(78, 195, 255, 0.15); }

    .under { display: flex; justify-content: space-between; align-items: center; }
    #count { color: #56658c; font-size: 0.9rem; }
    .gens { display: flex; gap: 0.4rem; }
    #genBtn, #genAllBtn {
      font: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffd166;
      background: transparent;
      border: 1px solid #6b5a2a;
      border-radius: 8px;
      padding: 0.3rem 0.8rem;
      cursor: pointer;
    }
    #genBtn:hover, #genAllBtn:hover { background: rgba(255, 209, 102, 0.1); }

    /* the rules, spaced out down the page */
    #rules { display: flex; flex-direction: column; gap: 1.1rem; margin-top: 0.4rem; }

    /* a rule: red while it's broken, green once it's met */
    .rule {
      border: 2px solid #ff5f7e;
      border-radius: 12px;
      background: #1a0b14;
      overflow: hidden;
    }
    .rule.new {
      animation: ruleIn 0.35s ease-out;          /* only as it first appears */
    }
    .rule .head {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.6rem 1rem;
      background: rgba(255, 95, 126, 0.18);
      color: #ff8fa3;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .rule .mark {
      width: 1.35rem;
      height: 1.35rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: #05070f;
      background: #ff5f7e;
    }
    .rule .body { padding: 1rem 1.1rem 1.1rem; color: #f0d6dd; text-align: left; font-size: 1.05rem; }
    .rule.ok { border-color: #7bffb2; background: #0b1a14; }
    .rule.ok .head { background: rgba(123, 255, 178, 0.16); color: #9effc6; }
    .rule.ok .mark { background: #7bffb2; }
    .rule.ok .body { color: #d4f5e2; }
    /* the CAPTCHA picture, and its refresh */
    .cap { display: flex; align-items: center; gap: 0.7rem; margin-top: 0.8rem; }
    .cap canvas { border-radius: 8px; border: 2px solid rgba(255, 255, 255, 0.15); max-width: 78%; height: auto; }
    .cap .refresh {
      font-size: 1.5rem;
      line-height: 1;
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 50%;
      color: #e0e8ff;
      background: #1d2b5c;
      border: 2px solid #3a4a78;
      cursor: pointer;
    }
    .cap .refresh:hover { background: #2a3d7a; }

    @keyframes ruleIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #win {
      border: 2px solid #7bffb2;
      border-radius: 14px;
      background: #0b1a14;
      padding: 1.2rem;
      text-align: center;
      box-shadow: 0 0 30px rgba(123, 255, 178, 0.2);
      animation: ruleIn 0.4s ease-out;
    }
    #win.hidden { display: none; }
    #win h2 { margin: 0 0 0.5rem; color: #7bffb2; }
    #win code {
      display: block;
      margin: 0.4rem 0 0.9rem;
      font-size: 1.15rem;
      color: #e0e8ff;
      word-break: break-all;
    }
    #againBtn {
      font: inherit;
      font-weight: 700;
      letter-spacing: 2px;
      color: #05070f;
      background: #7bffb2;
      border: none;
      border-radius: 10px;
      padding: 0.55rem 1.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <a href="../games.html" class="back-link">&larr; All Games</a>

  <div class="wrap">
    <h1>Please choose a password</h1>
    <div class="field">
      <input id="pw" type="text" autocomplete="off" spellcheck="false">
    </div>
    <div class="under">
      <span id="count"></span>
      <span class="gens">
        <button type="button" id="genBtn" title="Every rule but the last - press again to finish (for testing)">GENERATE</button>
        <button type="button" id="genAllBtn" title="Straight to a password that meets every rule (for testing)">&#10003;</button>
      </span>
    </div>
    <div id="win" class="hidden"></div>
    <div id="rules"></div>
  </div>

  <script>
  (function () {
    'use strict';

    /* ============================================================
       THE RULES
       In order. Each: what it says, whether a password meets it, and
       (for GENERATE) how to change a password so it does. Adding one is
       adding a line here.
       ============================================================ */
    var RULES = [
      { text: 'Your password must be at least 5 characters.',
        check: function (pw) { return pw.length >= 5; },
        fix:   function (pw) { while (pw.length < 5) pw += 'x'; return pw; } },
      { text: 'Your password must include a number.',
        check: function (pw) { return /[0-9]/.test(pw); },
        fix:   function (pw) { return pw + '1'; } },
      { text: 'Your password must include a special character.',
        check: function (pw) { return /[^A-Za-z0-9\s]/.test(pw); },
        fix:   function (pw) { return pw + '!'; } },
      { text: 'The digits in your password must add up to 25.',
        check: function (pw) { return digitSum(pw) === 25; },
        fix:   function (pw) { return pw.replace(/[0-9]/g, '') + '997'; } },
      { text: 'Your password must include a Roman numeral.',
        check: function (pw) { return romans(pw).length > 0; },
        fix:   function (pw) { return pw + 'X'; } },
      { text: '',                        // set for each game: see newTarget()
        check: function (pw) { var r = romans(pw); return r.length > 0 && romanProduct(pw) === state.target; },
        fix:   function (pw) { return pw.replace(/[IVXLCDM]/g, '') + toRoman(state.target); } },
      { text: 'Your password must include this CAPTCHA:',
        captcha: true,                   // its box shows the picture, and a refresh
        check: function (pw) { return pw.indexOf(state.captcha) !== -1; },
        fix:   function (pw) { return pw + state.captcha; } },
      { text: 'Your password must include a two-letter symbol from the periodic table.',
        check: function (pw) { return hasElement(pw); },
        fix:   function (pw) { return pw + 'He'; } },
      { text: 'Your password must include a leap year (not 0).',
        check: function (pw) { return hasLeapYear(pw); },
        fix:   function (pw) { return pw + 'y2024'; } }
    ];

    /* ---- the periodic table's two-letter symbols: a capital and then a
       small letter, exactly as written (He, not HE or he) ---- */
    var ELEMENTS = ('He Li Be Ne Na Mg Al Si Cl Ar Ca Sc Ti Cr Mn Fe Co Ni Cu Zn Ga Ge As Se ' +
      'Br Kr Rb Sr Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd ' +
      'Tb Dy Ho Er Tm Yb Lu Hf Ta Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa Np Pu ' +
      'Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og').split(' ');
    function hasElement(pw) {
      for (var i = 0; i < ELEMENTS.length; i++) if (pw.indexOf(ELEMENTS[i]) !== -1) return true;
      return false;
    }

    /* ---- a leap year: any number in it (each run of digits is one
       number) that's a leap year and isn't 0 ---- */
    function isLeap(n) { return n > 0 && n % 4 === 0 && (n % 100 !== 0 || n % 400 === 0); }
    function hasLeapYear(pw) {
      var runs = pw.match(/[0-9]+/g) || [];
      for (var i = 0; i < runs.length; i++) if (isLeap(parseInt(runs[i], 10))) return true;
      return false;
    }

    /* ---- the CAPTCHA: five random lowercase letters and numbers ---- */
    var CAP_CHARS = 'abcdefghijklmnopqrstuvwxyz0123456789';
    function newCaptcha() {
      var s = '';
      for (var i = 0; i < 5; i++) s += CAP_CHARS.charAt(Math.floor(Math.random() * CAP_CHARS.length));
      state.captcha = s;
      drawCaptcha();
    }

    /* ---- what the rules need ---- */
    function digitSum(pw) {
      var s = 0;
      for (var i = 0; i < pw.length; i++) if (/[0-9]/.test(pw.charAt(i))) s += +pw.charAt(i);
      return s;
    }

    /* the Roman numerals in it: each run of capital I V X L C D M */
    function romans(pw) {
      return pw.match(/[IVXLCDM]+/g) || [];
    }

    var ROMAN = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };

    /* one numeral's value, the usual way: a smaller one before a bigger
       one is taken away (IV = 4, XIX = 19) */
    function romanValue(r) {
      var total = 0;
      for (var i = 0; i < r.length; i++) {
        var v = ROMAN[r.charAt(i)], next = i + 1 < r.length ? ROMAN[r.charAt(i + 1)] : 0;
        total += v < next ? -v : v;
      }
      return total;
    }

    function romanProduct(pw) {
      var r = romans(pw), p = 1;
      for (var i = 0; i < r.length; i++) p *= romanValue(r[i]);
      return p;
    }

    function toRoman(n) {
      var parts = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'],
                   [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
      var s = '';
      for (var i = 0; i < parts.length; i++) while (n >= parts[i][0]) { s += parts[i][1]; n -= parts[i][0]; }
      return s;
    }

    /* each game, a new number for the numerals to multiply to: 10 to 30 */
    function newTarget() {
      state.target = 10 + Math.floor(Math.random() * 21);
      RULES[5].text = 'The Roman numerals in your password must multiply to ' + state.target + '.';
    }

    var state = { revealed: 0, target: 0, captcha: '' };

    /* every rule shown so far, met or not */
    function results(pw) {
      var out = [];
      for (var i = 0; i < state.revealed; i++) out.push({ n: i + 1, ok: RULES[i].check(pw) });
      return out;
    }

    function allMet(pw) {
      for (var i = 0; i < state.revealed; i++) if (!RULES[i].check(pw)) return false;
      return true;
    }

    /* Rule 1 comes with the first thing you type; each next one comes
       once every rule showing is met. Shown rules never go away. */
    function reveal(pw) {
      if (!state.revealed && pw.length) state.revealed = 1;
      while (state.revealed && state.revealed < RULES.length && allMet(pw)) state.revealed++;
    }

    /* broken ones on top, then the met ones, newest first */
    function ordered(pw) {
      var list = results(pw);
      list.sort(function (a, b) {
        if (a.ok !== b.ok) return a.ok ? 1 : -1;
        return b.n - a.n;
      });
      return list;
    }

    function allRulesMet(pw) {
      for (var i = 0; i < RULES.length; i++) if (!RULES[i].check(pw)) return false;
      return true;
    }

    function won(pw) {
      return state.revealed === RULES.length && allMet(pw);
    }

    /* GENERATE: start from a word and let each rule fix what it needs,
       until it meets all of them */
    /* A password that meets the first `n` rules (all of them, if not
       given). */
    function generate(n) {
      if (n === undefined) n = RULES.length;
      var withCap = n >= 7;                         // rule 7 is the CAPTCHA
      /* the CAPTCHA's numbers count towards the 25 - if they're already
         over it, get a new one, the way a player would */
      var withLeap = n >= 9;                        // rule 9 is the leap year
      /* (stopping short of the leap year rule, a CAPTCHA with one in it
         would give it away - so get another of those too) */
      if (withCap) for (var tries = 0; tries < 50 &&
                        (digitSum(state.captcha) > (withLeap ? 24 : 25) || (!withLeap && hasLeapYear(state.captcha))); tries++) newCaptcha();
      var need = 25 - (withCap ? digitSum(state.captcha) : 0);
      /* a leap year whose digits fit in what's left of the 25 */
      var leap = '';
      if (withLeap) {
        var LEAPS = ['36', '8', '16', '24', '32', '4', '12', '20', '10000'];   // digit sums 9 down to 1
        for (var li = 0; li < LEAPS.length; li++) {
          if (digitSum(LEAPS[li]) <= need) { leap = LEAPS[li]; need -= digitSum(leap); break; }
        }
      }
      /* the rest as single odd digits, each on its own, so none of them
         is a leap year by accident: 9z9z5 */
      var fill = [];
      while (need > 0) {
        var d = Math.min(9, need);
        if (d % 2 === 0) d--;
        fill.push(d);
        need -= d;
      }
      var pw = 'Horse!' + (withCap ? state.captcha : '') + 'z' + fill.join('z') +
               (leap ? 'y' + leap : '') + 'z' + toRoman(state.target);
      /* and anything else, rule by rule */
      for (var round = 0; round < 10; round++) {
        var changed = false;
        for (var i = 0; i < n; i++) {
          if (!RULES[i].check(pw)) { pw = RULES[i].fix(pw); changed = true; }
        }
        if (!changed) break;
      }
      return pw;
    }

    /* every rule but the last met, and the last not: where GENERATE
       stops first, so you can see the last rule */
    function allButLast(pw) {
      for (var i = 0; i < RULES.length - 1; i++) if (!RULES[i].check(pw)) return false;
      return !RULES[RULES.length - 1].check(pw);
    }

    /* ============================================================
       ON THE PAGE
       ============================================================ */
    var input = document.getElementById('pw');
    var rulesEl = document.getElementById('rules');
    var winEl = document.getElementById('win');
    var countEl = document.getElementById('count');

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }


    function update() {
      var pw = input.value || '';
      reveal(pw);
      countEl.textContent = pw.length ? pw.length + (pw.length === 1 ? ' character' : ' characters') : '';

      render(ordered(pw));

      if (won(pw)) {
        winEl.innerHTML = '<h2>Your password is strong enough!</h2>' +
                          '<code>' + esc(pw) + '</code>' +
                          '<button type="button" id="againBtn">PLAY AGAIN</button>';
        winEl.classList.remove('hidden');
        var again = document.getElementById('againBtn');
        if (again && again.addEventListener) again.addEventListener('click', restart);
      } else {
        winEl.classList.add('hidden');
      }
    }

    /* Each rule keeps its own box, so when the order changes - a rule
       broken and jumping back to the top, or met and dropping back down -
       the boxes slide from where they were to where they're going,
       rather than just being somewhere else. */
    var boxes = {};
    var MOVE = 'transform 0.45s cubic-bezier(.2,.8,.2,1)';

    /* The CAPTCHA, drawn the way the nasty ones are: on a speckled
       ground, the characters crowded together and overlapping, each in
       its own font, size, tilt and height - then the whole thing bent
       into a wave, and scratched through with lines and dots in the
       same inks as the letters. */
    var capCanvas = null;
    function drawCaptcha() {
      if (!capCanvas || !capCanvas.getContext) return;
      var c = capCanvas.getContext('2d'), w = capCanvas.width, h = capCanvas.height, i;
      var rnd = function (a, b) { return a + Math.random() * (b - a); };
      var fonts = ['Georgia', 'Courier New', 'Verdana', 'Times New Roman', 'Trebuchet MS'];
      var inks = ['#2b3a78', '#5a1e3a', '#1e4a3a', '#3a2a5c', '#4a3a1e', '#24304f'];
      var ink = function () { return inks[Math.floor(rnd(0, inks.length))]; };

      c.fillStyle = '#dfe3ee';
      c.fillRect(0, 0, w, h);
      for (i = 0; i < 420; i++) {                       // speckle
        c.fillStyle = 'rgba(40,50,80,' + rnd(0.08, 0.35) + ')';
        c.fillRect(rnd(0, w), rnd(0, h), rnd(1, 2.5), rnd(1, 2.5));
      }

      /* the characters, drawn flat first ... */
      var off = document.createElement('canvas');
      off.width = w;
      off.height = h;
      var o = off.getContext('2d');
      var step = (w - 50) / state.captcha.length;
      for (i = 0; i < state.captcha.length; i++) {
        o.save();
        o.translate(30 + i * step + rnd(-5, 5), h / 2 + rnd(-10, 10));
        o.rotate(rnd(-0.6, 0.6));
        o.transform(1, 0, rnd(-0.35, 0.35), 1, 0, 0);    // a lean
        o.scale(rnd(0.85, 1.25), rnd(0.85, 1.25));
        o.font = (Math.random() < 0.5 ? 'bold ' : '') + Math.round(rnd(40, 52)) + 'px ' +
                 fonts[Math.floor(rnd(0, fonts.length))];
        o.textAlign = 'center';
        o.textBaseline = 'middle';
        if (Math.random() < 0.25) {                     // some only outlined
          o.strokeStyle = ink();
          o.lineWidth = 2;
          o.strokeText(state.captcha.charAt(i), 0, 0);
        } else {
          o.fillStyle = ink();
          o.fillText(state.captcha.charAt(i), 0, 0);
        }
        o.restore();
      }
      for (i = 0; i < 3; i++) {                         // lines that bend with them
        o.strokeStyle = ink();
        o.lineWidth = rnd(1.5, 3);
        o.beginPath();
        o.moveTo(0, rnd(0, h));
        o.bezierCurveTo(w / 3, rnd(0, h), 2 * w / 3, rnd(0, h), w, rnd(0, h));
        o.stroke();
      }

      /* ... then bent: each thin column moved up or down along a wave */
      var amp = rnd(5, 9), freq = rnd(0.025, 0.045), ph = rnd(0, 6.3);
      for (var x = 0; x < w; x += 2) {
        c.drawImage(off, x, 0, 2, h, x, Math.sin(x * freq + ph) * amp, 2, h);
      }

      for (i = 0; i < 3; i++) {                         // and scratched over the top
        c.strokeStyle = 'rgba(40,50,80,' + rnd(0.35, 0.65) + ')';
        c.lineWidth = rnd(1, 2);
        c.beginPath();
        c.moveTo(0, rnd(0, h));
        c.bezierCurveTo(w / 3, rnd(0, h), 2 * w / 3, rnd(0, h), w, rnd(0, h));
        c.stroke();
      }
      for (i = 0; i < 60; i++) {                        // ink spots
        c.fillStyle = ink();
        c.beginPath();
        c.arc(rnd(0, w), rnd(0, h), rnd(0.8, 2.2), 0, Math.PI * 2);
        c.fill();
      }
    }

    function boxFor(n) {
      if (boxes[n]) return boxes[n];
      var el = document.createElement('div');
      el.className = 'rule new';
      el.innerHTML = '<div class="head"><span class="mark"></span>Rule ' + n + '</div>' +
                     '<div class="body">' + esc(RULES[n - 1].text) +
                     (RULES[n - 1].captcha ?
                       '<div class="cap"><canvas width="320" height="96"></canvas>' +
                       '<button type="button" class="refresh" title="A new one">&#8635;</button></div>' : '') +
                     '</div>';
      if (RULES[n - 1].captcha) {
        capCanvas = el.querySelector('canvas');
        drawCaptcha();
        el.querySelector('.refresh').addEventListener('click', function () {
          newCaptcha();
          update();
        });
      }
      /* the slide-in is for its first appearance only */
      el.addEventListener('animationend', function () { el.classList.remove('new'); });
      boxes[n] = el;
      return el;
    }

    function render(list) {
      if (!rulesEl.appendChild || !document.createElement) return;   // (the test harness has no page)
      /* where each box is now */
      var was = {}, n;
      for (n in boxes) was[n] = boxes[n].getBoundingClientRect().top;
      /* into the new order, coloured for met or broken */
      for (var i = 0; i < list.length; i++) {
        var r = list[i], el = boxFor(r.n);
        if (r.ok) el.classList.add('ok'); else el.classList.remove('ok');
        el.querySelector('.mark').innerHTML = r.ok ? '&#10003;' : '&#10007;';
        rulesEl.appendChild(el);
      }
      /* and slide each from where it was to where it is */
      for (i = 0; i < list.length; i++) {
        el = boxes[list[i].n];
        if (was[list[i].n] === undefined) continue;
        var dy = was[list[i].n] - el.getBoundingClientRect().top;
        if (Math.abs(dy) < 1) continue;
        el.style.transition = 'none';
        el.style.transform = 'translateY(' + dy + 'px)';
        el.getBoundingClientRect();                   // let it take that, then go
        el.style.transition = MOVE;
        el.style.transform = '';
      }
    }

    function restart() {
      state.revealed = 0;
      newTarget();
      capCanvas = null;
      newCaptcha();
      for (var n in boxes) if (boxes[n].parentNode) boxes[n].parentNode.removeChild(boxes[n]);
      boxes = {};
      input.value = '';
      update();
      if (input.focus) input.focus();
    }

    input.addEventListener('input', update);
    /* GENERATE: first, everything but the last rule, so you can see it;
       press again and it finishes. The tick goes straight to the end. */
    function generateStep() {
      var pw = input.value || '';
      input.value = allButLast(pw) ? generate() : generate(RULES.length - 1);
      update();
    }
    document.getElementById('genBtn').addEventListener('click', generateStep);
    document.getElementById('genAllBtn').addEventListener('click', function () {
      input.value = generate();
      update();
    });
    if (input.focus) input.focus();
    newTarget();
    newCaptcha();
    update();
  })();
  </script>
</body>
</html>
