<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shapes - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    :root { --shop-w: min(340px, 88vw); }
    html, body { overflow-x: hidden; }
    body {
      justify-content: flex-start;
      padding-top: 1.5rem;
      background: #ffffff;
      color: #2a2f3a;
      overflow-y: auto;
      transition: padding-right 0.45s cubic-bezier(.5,.15,.2,1);
    }
    /* When the shop lane is open, reserve the right lane so the left content
       (title/score/arena) centers in the remaining space — i.e. shifts left.
       When collapsed, this padding is gone and everything re-centers. */
    body.shop-open { padding-right: var(--shop-w); }

    .back-link { color: #3a6fd0; z-index: 2; }
    .back-link:hover { color: #1a4fb0; }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 0.4rem;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #3f74e6 0%, #6a4fd8 50%, #9b3fc4 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 5s ease-in-out infinite, float 6s ease-in-out infinite;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.12));
      position: relative;
      z-index: 2;
    }
    @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    .stage {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      animation: fadeIn 0.9s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* === Counter === */
    .counter-block { text-align: center; }
    .counter-num {
      font-size: 2.8rem;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-weight: 700;
      background: linear-gradient(135deg, #4e7fff, #2f5fd0);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      line-height: 1;
      transform-origin: center;
    }
    .counter-num.pulse { animation: counterPulse 0.18s ease-out; }
    @keyframes counterPulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .counter-label {
      color: #5a6f9c;
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }

    /* Restart button (top of the game area) */
    .restart-btn {
      padding: 0.45rem 1.1rem;
      background: #ffffff;
      border: 2px solid #e05a6e;
      color: #d23a52;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }
    .restart-btn:hover { background: #e05a6e; color: #fff; transform: translateY(-1px); }
    .restart-btn:active { transform: translateY(1px); }

    /* === Spawn arena === */
    .arena {
      position: relative;
      width: min(560px, 90vw);
      height: min(360px, 50vh);
      background: #eef1f6;
      border: 1px solid #d3d9e3;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.06);
    }

    /* A spawned circle — all the same small size, flat gray with a gray rim */
    .shape {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #b2b2b2, #979797 60%, #7d7d7d);
      border: 2px solid #5f5f5f;
      cursor: pointer;
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.15s linear, transform 0.12s ease-out;
      will-change: opacity, transform;
    }
    .shape:hover { transform: scale(1.25); }
    /* Fade-out phase (added by JS). Long transition = the slow fade. */
    .shape.fading {
      opacity: 0;
      transition: opacity 4.5s linear;
    }
    /* Collect pop when clicked */
    .shape.collected {
      pointer-events: none;
      animation: collectPop 0.32s cubic-bezier(.3,1.4,.5,1) forwards;
    }
    @keyframes collectPop {
      0%   { transform: scale(1);   opacity: 1; }
      40%  { transform: scale(1.5); opacity: 0.9; }
      100% { transform: scale(0);   opacity: 0; }
    }

    /* === Shop lane (full-height right column, slides in/out) === */
    .shop-drawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      z-index: 6;
      transition: transform 0.45s cubic-bezier(.5,.15,.2,1);
    }
    .shop-drawer.closed { transform: translateX(var(--shop-w)); }

    .shop-tab {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      padding: 18px 9px;
      background: #e9edf5;
      border: 1px solid #cdd3de;
      border-right: none;
      border-radius: 12px 0 0 12px;
      color: #4e6a9c;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: -3px 3px 10px rgba(0, 0, 0, 0.08);
      transition: background 0.15s, color 0.15s;
    }
    .shop-tab:hover { background: #dde3ee; color: #33518a; }

    .shop-panel {
      width: var(--shop-w);
      height: 100vh;
      background: #f4f6fa;
      border-left: 1px solid #cdd3de;
      box-shadow: -6px 0 30px rgba(0, 0, 0, 0.12);
      padding: 1.4rem 1.2rem;
      overflow-y: auto;
    }
    .shop-title {
      color: #3a5a9c;
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin: 0 0 0.7rem;
      border-bottom: 1px solid #d3d9e3;
      padding-bottom: 0.45rem;
      font-weight: 700;
      text-align: center;
    }

    /* Boarded-up storefront inside the panel */
    .store {
      position: relative;
      width: 100%;
      cursor: default;
      filter: grayscale(0.9) brightness(0.8);
      transition: filter 0.4s ease, transform 0.15s ease;
    }
    .store svg { width: 100%; height: auto; display: block; }
    .store.unlocked {
      cursor: pointer;
      filter: grayscale(0) brightness(1);
      animation: storeGlow 2s ease-in-out infinite;
    }
    .store.unlocked:hover { transform: translateY(-2px); }
    @keyframes storeGlow {
      0%, 100% { filter: grayscale(0) brightness(1) drop-shadow(0 0 6px rgba(245, 200, 90, 0.5)); }
      50%      { filter: grayscale(0) brightness(1.08) drop-shadow(0 0 20px rgba(245, 200, 90, 0.9)); }
    }
    /* Board planks nailed across the storefront */
    .board {
      transition: transform 0.5s cubic-bezier(.5,-0.4,.5,1), opacity 0.5s ease;
      transform-origin: center;
    }
    .board.gone {
      opacity: 0;
      transform: translateX(60px) rotate(22deg);
    }

    .shop-body { margin-top: 0.4rem; }
    .shop-empty {
      color: #7a86a0;
      font-size: 0.9rem;
      font-style: italic;
      padding: 1.4rem 0.2rem;
      text-align: center;
    }
    .hidden { display: none !important; }

    /* Dev/test button — dashed border signals it isn't a normal button. */
    .test-btn {
      padding: 0.5rem 1rem;
      background: #eef1f6;
      border: 2px dashed #9aa6bd;
      border-radius: 12px;
      color: #4a5a78;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .test-btn:hover {
      background: #e2e7f0;
      border-color: #6b7c97;
      transform: translateY(-1px);
    }
    .test-btn:active { transform: translateY(1px); }

    /* Floating "+1" feedback on collect */
    .fx-plus1 {
      position: fixed;
      transform: translate(-50%, -50%);
      font-size: 1.4rem;
      font-weight: 700;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      color: #2f6fe0;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      pointer-events: none;
      z-index: 30;
      animation: floatUp 1.4s cubic-bezier(.25,.6,.45,1) forwards;
      will-change: transform, opacity;
    }
    @keyframes floatUp {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      15%  { opacity: 1; transform: translate(-50%, -70%) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -180%) scale(0.9); }
    }

    @media (max-width: 900px) {
      h1 { font-size: 2rem; }
      .arena { height: min(320px, 46vh); }
    }
  </style>
</head>
<body>
  <a href="../games.html" class="back-link">&larr; All Games</a>

  <h1>Shapes</h1>

  <div class="stage">
    <button class="restart-btn" id="restart" title="Erase all progress and start over">&#8635; Restart</button>

    <div class="counter-block">
      <div class="counter-num" id="counter-num">0</div>
      <div class="counter-label">points</div>
    </div>

    <div class="arena" id="arena"></div>

    <button class="test-btn" id="test-10" title="Dev: +10 points">+10 &#129514;</button>
  </div>

  <!-- Shop drawer: click the tab to slide it out of / back into view -->
  <div class="shop-drawer" id="shop-drawer">
    <button class="shop-tab" id="shop-tab" aria-label="Show or hide the shop">Shop</button>
    <div class="shop-panel">
      <h2 class="shop-title">Shop</h2>
      <div class="store" id="store" role="button" aria-label="The boarded-up store">
        <svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
          <!-- awning -->
          <rect x="20" y="34" width="260" height="24" rx="4" fill="#7a3b4a"/>
          <g fill="#e05a6e">
            <rect x="24"  y="34" width="26" height="24"/>
            <rect x="76"  y="34" width="26" height="24"/>
            <rect x="128" y="34" width="26" height="24"/>
            <rect x="180" y="34" width="26" height="24"/>
            <rect x="232" y="34" width="26" height="24"/>
          </g>
          <path d="M20 58 h260 l-14 16 h-232 z" fill="#5f2c38"/>
          <!-- sign -->
          <rect x="70" y="12" width="160" height="22" rx="5" fill="#16213e" stroke="#4e7fff" stroke-width="2"/>
          <text x="150" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
                font-size="13" letter-spacing="2" fill="#a0c4ff" font-weight="700">SHOP</text>
          <!-- storefront body -->
          <rect x="30" y="74" width="240" height="132" rx="6" fill="#2a2f45" stroke="#1a1e2e" stroke-width="2"/>
          <!-- dark window / doorway behind the boards -->
          <rect x="52" y="92" width="196" height="102" rx="4" fill="#0c1020"/>
          <!-- boards nailed across (5 planks) -->
          <g id="boards">
            <g class="board" data-board="0">
              <rect x="40" y="96"  width="220" height="20" rx="2" fill="#9c6b3f" stroke="#5f3d20" stroke-width="1.5" transform="rotate(-4 150 106)"/>
              <circle cx="58"  cy="104" r="2.2" fill="#3a2510"/>
              <circle cx="242" cy="110" r="2.2" fill="#3a2510"/>
            </g>
            <g class="board" data-board="1">
              <rect x="40" y="120" width="220" height="20" rx="2" fill="#b07d4c" stroke="#5f3d20" stroke-width="1.5" transform="rotate(3 150 130)"/>
              <circle cx="58"  cy="132" r="2.2" fill="#3a2510"/>
              <circle cx="242" cy="126" r="2.2" fill="#3a2510"/>
            </g>
            <g class="board" data-board="2">
              <rect x="40" y="144" width="220" height="20" rx="2" fill="#9c6b3f" stroke="#5f3d20" stroke-width="1.5" transform="rotate(-2 150 154)"/>
              <circle cx="58"  cy="150" r="2.2" fill="#3a2510"/>
              <circle cx="242" cy="156" r="2.2" fill="#3a2510"/>
            </g>
            <g class="board" data-board="3">
              <rect x="40" y="168" width="220" height="20" rx="2" fill="#b07d4c" stroke="#5f3d20" stroke-width="1.5" transform="rotate(4 150 178)"/>
              <circle cx="58"  cy="176" r="2.2" fill="#3a2510"/>
              <circle cx="242" cy="170" r="2.2" fill="#3a2510"/>
            </g>
            <g class="board" data-board="4">
              <rect x="66" y="86" width="20" height="112" rx="2" fill="#8a5d38" stroke="#5f3d20" stroke-width="1.5" transform="rotate(6 76 142)"/>
              <circle cx="76" cy="98"  r="2.2" fill="#3a2510"/>
              <circle cx="76" cy="186" r="2.2" fill="#3a2510"/>
            </g>
          </g>
        </svg>
      </div>
      <div class="shop-body hidden" id="shop-body">
        <div class="shop-empty">Shop coming soon&hellip;</div>
      </div>
    </div>
  </div>

  <script>
    'use strict';
    const STORAGE_KEY = 'horsey:shapes:v1';

    const SPAWN_CHANCE = 0.10;   // per second
    const CIRCLE_SIZE  = 16;     // px diameter — every circle is the same size
    const CIRCLE_LIFE  = 30000;  // ms fully visible before the fade begins
    const FADE_MS      = 4500;   // must match .shape.fading transition duration
    const UNLOCK_AT    = 10;     // total points earned to unlock the store
    const TOTAL_BOARDS = 5;

    const DEFAULT_STATE = { points: 0, totalEarned: 0, boardsRemoved: 0, shopOpen: false, drawerOpen: true };

    // --- Persistence ---
    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { ...DEFAULT_STATE };
        const parsed = JSON.parse(raw);
        return {
          points:        Number(parsed.points)     || 0,
          totalEarned:   Number(parsed.totalEarned) || 0,
          boardsRemoved: Math.min(TOTAL_BOARDS, Number(parsed.boardsRemoved) || 0),
          shopOpen:      !!parsed.shopOpen,
          drawerOpen:    parsed.drawerOpen !== false,   // default open
        };
      } catch (e) {
        return { ...DEFAULT_STATE };
      }
    }
    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    const state = load();

    // --- Elements ---
    const arena       = document.getElementById('arena');
    const counterNum  = document.getElementById('counter-num');
    const store       = document.getElementById('store');
    const boardsGroup = document.getElementById('boards');
    const shopBody    = document.getElementById('shop-body');
    const drawer      = document.getElementById('shop-drawer');
    const shopTab     = document.getElementById('shop-tab');

    // --- Circle spawning ---
    // Live circles being animated. Each: { el, x, y, vx, vy, dead }.
    const circles = [];
    const SIZE = CIRCLE_SIZE;

    function spawnCircle() {
      const rect = arena.getBoundingClientRect();
      const W = rect.width, H = rect.height;
      if (W < SIZE || H < SIZE) return;
      const speed = 0.2 + Math.random() * 0.5;       // slow float
      const drift = () => (Math.random() - 0.5) * speed * 1.6;

      // Spawn on a random edge, heading inward.
      let x, y, vx, vy;
      switch (Math.floor(Math.random() * 4)) {
        case 0: x = Math.random() * (W - SIZE); y = 0;        vx = drift();  vy = speed;  break; // top
        case 1: x = Math.random() * (W - SIZE); y = H - SIZE; vx = drift();  vy = -speed; break; // bottom
        case 2: x = 0;        y = Math.random() * (H - SIZE); vx = speed;    vy = drift(); break; // left
        default:x = W - SIZE; y = Math.random() * (H - SIZE); vx = -speed;   vy = drift(); break; // right
      }

      const el = document.createElement('div');
      el.className = 'shape';
      el.style.width  = SIZE + 'px';
      el.style.height = SIZE + 'px';
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      el.style.transform = 'scale(0)';                // pop-in
      arena.appendChild(el);
      requestAnimationFrame(() => { el.style.transform = 'scale(1)'; });

      const c = { el, x, y, vx, vy, dead: false };

      // Begin the slow fade after CIRCLE_LIFE, remove once fully faded.
      const fadeTimer = setTimeout(() => {
        el.classList.add('fading');
        setTimeout(() => { c.dead = true; el.remove(); }, FADE_MS);
      }, CIRCLE_LIFE);

      el.addEventListener('click', (e) => {
        if (c.dead) return;               // fully faded circles are already gone
        c.dead = true;
        clearTimeout(fadeTimer);
        collect(e.clientX, e.clientY);
        el.classList.add('collected');
        setTimeout(() => el.remove(), 320);
      });

      circles.push(c);
    }

    // Float the circles around, bouncing off the arena walls.
    function animate() {
      const rect = arena.getBoundingClientRect();
      const W = rect.width, H = rect.height;
      for (let i = circles.length - 1; i >= 0; i--) {
        const c = circles[i];
        if (c.dead) { circles.splice(i, 1); continue; }
        c.x += c.vx;
        c.y += c.vy;
        if (c.x <= 0)               { c.x = 0;         c.vx =  Math.abs(c.vx); }
        else if (c.x >= W - SIZE)   { c.x = W - SIZE;  c.vx = -Math.abs(c.vx); }
        if (c.y <= 0)               { c.y = 0;         c.vy =  Math.abs(c.vy); }
        else if (c.y >= H - SIZE)   { c.y = H - SIZE;  c.vy = -Math.abs(c.vy); }
        c.el.style.left = c.x + 'px';
        c.el.style.top  = c.y + 'px';
      }
      requestAnimationFrame(animate);
    }

    function collect(x, y) {
      state.points += 1;
      state.totalEarned += 1;
      save();
      floatPlus1(x, y);
      refresh();
    }

    function floatPlus1(x, y) {
      const f = document.createElement('div');
      f.className = 'fx-plus1';
      f.textContent = '+1';
      f.style.left = x + 'px';
      f.style.top  = y + 'px';
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 1400);
    }

    // --- Store / boards ---
    function renderBoards() {
      boardsGroup.querySelectorAll('.board').forEach((b) => {
        const idx = Number(b.getAttribute('data-board'));
        // Boards are removed from the top down: indices < boardsRemoved are gone.
        b.classList.toggle('gone', idx < state.boardsRemoved);
      });
    }

    function refresh() {
      counterNum.textContent = state.points;
      counterNum.classList.remove('pulse');
      void counterNum.offsetWidth;                    // reflow to restart the pulse
      counterNum.classList.add('pulse');

      const unlocked = state.totalEarned >= UNLOCK_AT;
      store.classList.toggle('unlocked', unlocked && !state.shopOpen);
      if (state.shopOpen) {
        store.classList.add('hidden');
        shopBody.classList.remove('hidden');
      }
      renderBoards();
    }

    // --- Drawer toggle ---
    function applyDrawer() {
      drawer.classList.toggle('closed', !state.drawerOpen);
      document.body.classList.toggle('shop-open', state.drawerOpen);
    }
    shopTab.addEventListener('click', () => {
      state.drawerOpen = !state.drawerOpen;
      applyDrawer();
      save();
    });

    // --- Restart ---
    document.getElementById('restart').addEventListener('click', () => {
      if (!confirm('Restart Shapes? This erases all your points and shop progress.')) return;
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      location.reload();
    });

    store.addEventListener('click', () => {
      if (state.shopOpen) return;
      if (state.totalEarned < UNLOCK_AT) return;
      if (state.boardsRemoved >= TOTAL_BOARDS) return;
      state.boardsRemoved += 1;
      if (state.boardsRemoved >= TOTAL_BOARDS) state.shopOpen = true;
      save();
      refresh();
    });

    document.getElementById('test-10').addEventListener('click', () => {
      state.points += 10;
      state.totalEarned += 10;
      save();
      refresh();
    });

    // --- Boot ---
    applyDrawer();
    renderBoards();
    refresh();
    requestAnimationFrame(animate);
    // Each second, an independent 10% chance to spawn a single circle.
    setInterval(() => {
      if (Math.random() < SPAWN_CHANCE) spawnCircle();
    }, 1000);
  </script>
</body>
</html>
