<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shapes - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    :root { --shop-w: min(340px, 88vw); }
    html, body { overflow-x: hidden; }
    body {
      justify-content: flex-start;
      padding-top: 1.5rem;
      background: #ffffff;
      color: #2a2f3a;
      overflow-y: auto;
      transition: padding-right 0.45s cubic-bezier(.5,.15,.2,1);
    }
    /* When the shop lane is open, reserve the right lane so the left content
       centers in the remaining space — i.e. shifts left. When collapsed the
       padding is gone and everything re-centers. */
    body.shop-open { padding-right: var(--shop-w); }

    .back-link { color: #3a6fd0; z-index: 2; }
    .back-link:hover { color: #1a4fb0; }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 0.4rem;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #3f74e6 0%, #6a4fd8 50%, #9b3fc4 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 5s ease-in-out infinite, float 6s ease-in-out infinite;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.12));
      position: relative;
      z-index: 2;
    }
    @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    .stage {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      animation: fadeIn 0.9s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Restart button */
    .restart-btn {
      padding: 0.45rem 1.1rem;
      background: #ffffff;
      border: 2px solid #e05a6e;
      color: #d23a52;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }
    .restart-btn:hover { background: #e05a6e; color: #fff; transform: translateY(-1px); }
    .restart-btn:active { transform: translateY(1px); }

    /* === Counter === */
    .counter-block { text-align: center; }
    .counter-num {
      font-size: 2.8rem;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-weight: 700;
      background: linear-gradient(135deg, #4e7fff, #2f5fd0);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      line-height: 1;
      transform-origin: center;
    }
    .counter-num.pulse { animation: counterPulse 0.18s ease-out; }
    @keyframes counterPulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .counter-label {
      color: #5a6f9c;
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }

    /* === Spawn arena === */
    .arena {
      position: relative;
      width: min(480px, 86vw);
      height: min(300px, 44vh);
      background: #eef1f6;
      border: 1px solid #d3d9e3;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.06);
    }

    /* A spawned circle — flat gray with a gray rim */
    .shape {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #b2b2b2, #979797 60%, #7d7d7d);
      border: 2px solid #5f5f5f;
      cursor: pointer;
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.15s linear, transform 0.12s ease-out;
      will-change: opacity, transform;
    }
    .shape:hover { transform: scale(1.22); }
    /* Big (grown) circle — larger, worth more, with an inner ring */
    .shape.big {
      background: radial-gradient(circle at 35% 30%, #bcbcbc, #9c9c9c 60%, #808080);
      border-color: #555555;
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.9), inset 0 0 0 5px #6f6f6f;
    }
    /* Fade-out phase. Long transition = the slow fade. */
    .shape.fading {
      opacity: 0;
      transition: opacity 4.5s linear;
    }
    /* Collect pop when clicked */
    .shape.collected {
      pointer-events: none;
      animation: collectPop 0.32s cubic-bezier(.3,1.4,.5,1) forwards;
    }
    @keyframes collectPop {
      0%   { transform: scale(1);   opacity: 1; }
      40%  { transform: scale(1.5); opacity: 0.9; }
      100% { transform: scale(0);   opacity: 0; }
    }

    /* === Shop lane (full-height right column, slides in/out) === */
    .shop-drawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      z-index: 6;
      transition: transform 0.45s cubic-bezier(.5,.15,.2,1);
    }
    .shop-drawer.closed { transform: translateX(var(--shop-w)); }

    .shop-tab {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      padding: 18px 9px;
      background: #e9edf5;
      border: 1px solid #cdd3de;
      border-right: none;
      border-radius: 12px 0 0 12px;
      color: #4e6a9c;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: -3px 3px 10px rgba(0, 0, 0, 0.08);
      transition: background 0.15s, color 0.15s;
    }
    .shop-tab:hover { background: #dde3ee; color: #33518a; }

    .shop-panel {
      width: var(--shop-w);
      height: 100vh;
      background: #f4f6fa;
      border-left: 1px solid #cdd3de;
      box-shadow: -6px 0 30px rgba(0, 0, 0, 0.12);
      padding: 1.4rem 1.2rem;
      overflow-y: auto;
    }
    .shop-title {
      color: #3a5a9c;
      font-size: 0.95rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin: 0 0 0.9rem;
      border-bottom: 1px solid #d3d9e3;
      padding-bottom: 0.5rem;
      font-weight: 700;
      text-align: center;
    }

    /* Locked (grayed) state before the shop unlocks */
    .shop-locked {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 220px;
    }
    .shop-locked .lock-ic {
      font-size: 3.4rem;
      opacity: 0.35;
      filter: grayscale(1);
    }

    /* Top tabs: Evolution / Shapes / Special */
    .shop-tabs { display: flex; gap: 0.35rem; margin-bottom: 0.8rem; }
    .shop-tab-btn {
      flex: 1;
      padding: 0.45rem 0.3rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: #e9edf5;
      border: 1px solid #cdd3de;
      border-radius: 8px;
      color: #5a6f9c;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }
    .shop-tab-btn:hover:not(.locked):not(.active) { background: #dde3ee; }
    .shop-tab-btn.active { background: #3a5a9c; color: #fff; border-color: #3a5a9c; }
    .shop-tab-btn.locked { opacity: 0.45; cursor: not-allowed; }

    /* Sub-tabs (e.g. Circles under Shapes) */
    .shop-subtabs { display: flex; gap: 0.35rem; margin-bottom: 0.7rem; }
    .shop-subtab-btn {
      padding: 0.3rem 0.85rem;
      font-size: 0.72rem;
      font-weight: 700;
      background: #eef1f6;
      border: 1px solid #d3d9e3;
      border-radius: 20px;
      color: #5a6f9c;
      cursor: pointer;
      font-family: inherit;
    }
    .shop-subtab-btn.active { background: #dbe4f3; color: #33518a; border-color: #b9c8e0; }

    /* Item cards */
    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      text-align: left;
      padding: 0.6rem 0.7rem;
      margin-bottom: 0.5rem;
      background: #ffffff;
      border: 1.5px solid #d3d9e3;
      border-radius: 10px;
      font-family: inherit;
      cursor: default;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.1s;
    }
    .si-name { font-weight: 600; color: #2a2f3a; font-size: 0.9rem; }
    .si-price {
      color: #3a5a9c;
      font-weight: 700;
      font-size: 0.78rem;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      white-space: nowrap;
    }
    .shop-item.buyable { border-color: #22c55e; cursor: pointer; }
    .shop-item.buyable:hover {
      background: #f0fff5;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.28);
      transform: translateY(-1px);
    }
    .shop-item.owned { border-color: #4e7fff; background: #eef3ff; }
    .shop-item.owned .si-price { color: #4e7fff; }
    .shop-item.locked,
    .shop-item.unaffordable { opacity: 0.5; filter: grayscale(0.4); cursor: not-allowed; }

    .shop-empty {
      color: #8a94a8;
      font-size: 0.85rem;
      font-style: italic;
      text-align: center;
      padding: 1.4rem 0.2rem;
    }
    .hidden { display: none !important; }

    /* Dev/test button — dashed border signals it isn't a normal button. */
    .test-btn {
      padding: 0.5rem 1rem;
      background: #eef1f6;
      border: 2px dashed #9aa6bd;
      border-radius: 12px;
      color: #4a5a78;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .test-btn:hover { background: #e2e7f0; border-color: #6b7c97; transform: translateY(-1px); }
    .test-btn:active { transform: translateY(1px); }

    /* Floating "+N" feedback on collect */
    .fx-plus1 {
      position: fixed;
      transform: translate(-50%, -50%);
      font-size: 1.4rem;
      font-weight: 700;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      color: #2f6fe0;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      pointer-events: none;
      z-index: 30;
      animation: floatUp 1.4s cubic-bezier(.25,.6,.45,1) forwards;
      will-change: transform, opacity;
    }
    .fx-plus1.big { font-size: 1.9rem; color: #1c8f4a; }
    @keyframes floatUp {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      15%  { opacity: 1; transform: translate(-50%, -70%) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -180%) scale(0.9); }
    }

    @media (max-width: 900px) {
      h1 { font-size: 2rem; }
      .arena { height: min(280px, 42vh); }
    }
  </style>
</head>
<body>
  <a href="../games.html" class="back-link">&larr; All Games</a>

  <h1>Shapes</h1>

  <div class="stage">
    <button class="restart-btn" id="restart" title="Erase all progress and start over">&#8635; Restart</button>

    <div class="counter-block">
      <div class="counter-num" id="counter-num">0</div>
      <div class="counter-label">points</div>
    </div>

    <div class="arena" id="arena"></div>

    <button class="test-btn" id="test-10" title="Dev: +10 points">+10 &#129514;</button>
  </div>

  <!-- Shop lane: click the tab to slide it out of / back into view -->
  <div class="shop-drawer" id="shop-drawer">
    <button class="shop-tab" id="shop-tab" aria-label="Show or hide the shop">Shop</button>
    <div class="shop-panel">
      <h2 class="shop-title">Shop</h2>
      <div class="shop-locked" id="shop-locked"><div class="lock-ic">&#128274;</div></div>
      <div class="shop-inner hidden" id="shop-inner">
        <div class="shop-tabs" id="shop-tabs"></div>
        <div class="shop-subtabs" id="shop-subtabs"></div>
        <div class="shop-items" id="shop-items"></div>
      </div>
    </div>
  </div>

  <script>
    'use strict';
    const STORAGE_KEY = 'horsey:shapes:v1';

    const BASE_SPAWN   = 0.10;   // per second
    const FAST_SPAWN   = 0.13;   // after the spawn-rate upgrade
    const CIRCLE_SIZE  = 16;     // normal circle diameter (px)
    const BIG_SIZE     = 26;     // grown circle diameter (px)
    const BIG_VALUE    = 5;      // points from a grown circle
    const BIG_CHANCE_1 = 0.10;   // chance once Growth is unlocked
    const BIG_CHANCE_2 = 0.15;   // chance after the Evolution upgrade
    const CIRCLE_LIFE  = 30000;  // ms fully visible before the fade begins
    const FADE_MS      = 4500;   // must match .shape.fading transition duration
    const UNLOCK_AT    = 10;     // total points earned to unlock the shop

    const DEFAULT_STATE = {
      points: 0,
      totalEarned: 0,
      drawerOpen: true,
      growthUnlocked: false,   // "Unlock Growth"
      spawnUpgraded: false,    // "Upgrade Spawn Rate"
      growthChancePlus: false, // Evolution: "Growth Chance +5%"
    };

    // --- Persistence ---
    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { ...DEFAULT_STATE };
        const p = JSON.parse(raw);
        return {
          points:           Number(p.points)      || 0,
          totalEarned:      Number(p.totalEarned)  || 0,
          drawerOpen:       p.drawerOpen !== false,
          growthUnlocked:   !!p.growthUnlocked,
          spawnUpgraded:    !!p.spawnUpgraded,
          growthChancePlus: !!p.growthChancePlus,
        };
      } catch (e) {
        return { ...DEFAULT_STATE };
      }
    }
    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    const state = load();

    // --- Derived rates ---
    function spawnChanceNow() { return state.spawnUpgraded ? FAST_SPAWN : BASE_SPAWN; }
    function bigChanceNow() {
      if (!state.growthUnlocked) return 0;
      return state.growthChancePlus ? BIG_CHANCE_2 : BIG_CHANCE_1;
    }

    // --- Elements ---
    const arena       = document.getElementById('arena');
    const counterNum  = document.getElementById('counter-num');
    const drawer      = document.getElementById('shop-drawer');
    const shopTab     = document.getElementById('shop-tab');
    const shopLocked  = document.getElementById('shop-locked');
    const shopInner   = document.getElementById('shop-inner');
    const shopTabsEl  = document.getElementById('shop-tabs');
    const shopSubsEl  = document.getElementById('shop-subtabs');
    const shopItemsEl = document.getElementById('shop-items');

    // --- Circle spawning ---
    // Each: { el, x, y, vx, vy, size, dead }.
    const circles = [];

    function spawnCircle() {
      const rect = arena.getBoundingClientRect();
      const W = rect.width, H = rect.height;
      const isBig = Math.random() < bigChanceNow();
      const size  = isBig ? BIG_SIZE : CIRCLE_SIZE;
      const value = isBig ? BIG_VALUE : 1;
      if (W < size || H < size) return;

      const speed = 0.2 + Math.random() * 0.5;       // slow float
      const drift = () => (Math.random() - 0.5) * speed * 1.6;

      // Spawn on a random edge, heading inward.
      let x, y, vx, vy;
      switch (Math.floor(Math.random() * 4)) {
        case 0: x = Math.random() * (W - size); y = 0;        vx = drift();  vy = speed;  break; // top
        case 1: x = Math.random() * (W - size); y = H - size; vx = drift();  vy = -speed; break; // bottom
        case 2: x = 0;        y = Math.random() * (H - size); vx = speed;    vy = drift(); break; // left
        default:x = W - size; y = Math.random() * (H - size); vx = -speed;   vy = drift(); break; // right
      }

      const el = document.createElement('div');
      el.className = 'shape' + (isBig ? ' big' : '');
      el.style.width  = size + 'px';
      el.style.height = size + 'px';
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      el.style.transform = 'scale(0)';                // pop-in
      arena.appendChild(el);
      requestAnimationFrame(() => { el.style.transform = 'scale(1)'; });

      const c = { el, x, y, vx, vy, size, dead: false };

      const fadeTimer = setTimeout(() => {
        el.classList.add('fading');
        setTimeout(() => { c.dead = true; el.remove(); }, FADE_MS);
      }, CIRCLE_LIFE);

      el.addEventListener('click', (e) => {
        if (c.dead) return;               // fully faded circles are already gone
        c.dead = true;
        clearTimeout(fadeTimer);
        collect(e.clientX, e.clientY, value);
        el.classList.add('collected');
        setTimeout(() => el.remove(), 320);
      });

      circles.push(c);
    }

    // Float the circles around, bouncing off the arena walls.
    function animate() {
      const rect = arena.getBoundingClientRect();
      const W = rect.width, H = rect.height;
      for (let i = circles.length - 1; i >= 0; i--) {
        const c = circles[i];
        if (c.dead) { circles.splice(i, 1); continue; }
        c.x += c.vx;
        c.y += c.vy;
        if (c.x <= 0)                 { c.x = 0;          c.vx =  Math.abs(c.vx); }
        else if (c.x >= W - c.size)   { c.x = W - c.size; c.vx = -Math.abs(c.vx); }
        if (c.y <= 0)                 { c.y = 0;          c.vy =  Math.abs(c.vy); }
        else if (c.y >= H - c.size)   { c.y = H - c.size; c.vy = -Math.abs(c.vy); }
        c.el.style.left = c.x + 'px';
        c.el.style.top  = c.y + 'px';
      }
      requestAnimationFrame(animate);
    }

    function collect(x, y, value) {
      state.points += value;
      state.totalEarned += value;
      save();
      floatPlus1(x, y, value);
      refresh();
    }

    function floatPlus1(x, y, value) {
      const f = document.createElement('div');
      f.className = 'fx-plus1' + (value > 1 ? ' big' : '');
      f.textContent = '+' + value;
      f.style.left = x + 'px';
      f.style.top  = y + 'px';
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 1400);
    }

    // === Shop catalog ===
    // Each item: name, price, requires() gate, owned() flag, buy() effect.
    const SHOP = {
      evolution: [
        {
          id: 'growth_chance',
          name: 'Growth Chance +5%',
          price: 100,
          requires: () => state.growthUnlocked,   // locked until Growth is unlocked
          owned: () => state.growthChancePlus,
          buy: () => { state.growthChancePlus = true; },
        },
      ],
      circles: [
        {
          id: 'unlock_growth',
          name: 'Unlock Growth',
          price: 30,
          requires: () => true,
          owned: () => state.growthUnlocked,
          buy: () => { state.growthUnlocked = true; },
        },
        {
          id: 'spawn_rate',
          name: 'Upgrade Spawn Rate',
          price: 70,
          requires: () => true,
          owned: () => state.spawnUpgraded,
          buy: () => { state.spawnUpgraded = true; },
        },
      ],
    };

    const TABS = [
      { id: 'evolution', label: 'Evolution' },
      { id: 'shapes',    label: 'Shapes' },
      { id: 'special',   label: 'Special', locked: true },
    ];

    let activeTab = 'shapes';   // default to the tab with buyable items

    function buyItem(item) {
      if (item.owned() || !item.requires() || state.points < item.price) return;
      state.points -= item.price;
      item.buy();
      save();
      refresh();
    }

    function makeItemCard(item) {
      const owned = item.owned();
      const available = item.requires();
      const afford = state.points >= item.price;
      const buyable = !owned && available && afford;

      const btn = document.createElement('button');
      btn.className = 'shop-item ' +
        (owned ? 'owned' : !available ? 'locked' : !afford ? 'unaffordable' : 'buyable');
      btn.innerHTML =
        '<span class="si-name">' + item.name + '</span>' +
        '<span class="si-price">' + (owned ? 'Owned' : 'Price: ' + item.price) + '</span>';
      if (buyable) btn.addEventListener('click', () => buyItem(item));
      return btn;
    }

    function renderShop() {
      const unlocked = state.totalEarned >= UNLOCK_AT;
      shopLocked.classList.toggle('hidden', unlocked);
      shopInner.classList.toggle('hidden', !unlocked);
      if (!unlocked) return;

      // Top tabs
      shopTabsEl.innerHTML = '';
      TABS.forEach((t) => {
        const b = document.createElement('button');
        b.className = 'shop-tab-btn' +
          (t.id === activeTab ? ' active' : '') + (t.locked ? ' locked' : '');
        b.textContent = t.label;
        if (!t.locked) b.addEventListener('click', () => { activeTab = t.id; renderShop(); });
        shopTabsEl.appendChild(b);
      });

      // Sub-tabs + items
      shopSubsEl.innerHTML = '';
      shopItemsEl.innerHTML = '';

      if (activeTab === 'evolution') {
        SHOP.evolution.forEach((it) => shopItemsEl.appendChild(makeItemCard(it)));
      } else if (activeTab === 'shapes') {
        const sub = document.createElement('button');
        sub.className = 'shop-subtab-btn active';
        sub.textContent = 'Circles';
        shopSubsEl.appendChild(sub);
        SHOP.circles.forEach((it) => shopItemsEl.appendChild(makeItemCard(it)));
      } else if (activeTab === 'special') {
        shopItemsEl.innerHTML = '<div class="shop-empty">Locked</div>';
      }
    }

    function refresh() {
      counterNum.textContent = state.points;
      counterNum.classList.remove('pulse');
      void counterNum.offsetWidth;                    // reflow to restart the pulse
      counterNum.classList.add('pulse');
      renderShop();
    }

    // --- Drawer toggle ---
    function applyDrawer() {
      drawer.classList.toggle('closed', !state.drawerOpen);
      document.body.classList.toggle('shop-open', state.drawerOpen);
    }
    shopTab.addEventListener('click', () => {
      state.drawerOpen = !state.drawerOpen;
      applyDrawer();
      save();
    });

    // --- Restart ---
    document.getElementById('restart').addEventListener('click', () => {
      if (!confirm('Restart Shapes? This erases all your points and shop progress.')) return;
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      location.reload();
    });

    // --- Dev: +10 points ---
    document.getElementById('test-10').addEventListener('click', () => {
      state.points += 10;
      state.totalEarned += 10;
      save();
      refresh();
    });

    // --- Boot ---
    applyDrawer();
    refresh();
    requestAnimationFrame(animate);
    setInterval(() => {
      if (Math.random() < spawnChanceNow()) spawnCircle();
    }, 1000);
  </script>
</body>
</html>
