<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risk - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../gate.js" data-gate="risk"></script>
  <style>
    body { background: #05070f; }

    .stage {
      position: relative;
      width: min(960px, 96vw);
      aspect-ratio: 16 / 9;
      margin: 0 auto;
    }

    #game {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 14px;
      background: #070a18;
      box-shadow: 0 0 40px rgba(78, 195, 255, 0.12);
      cursor: pointer;
    }

    /* the setup screen, over the canvas */
    #setup {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      border-radius: 14px;
      background: radial-gradient(ellipse at center, #1a1030 0%, #05070f 75%);
    }
    #setup.hidden { display: none; }

    #setup h1 {
      font-size: clamp(2.2rem, 7vw, 4rem);
      letter-spacing: 10px;
      color: #ff5f7e;
      text-shadow: 0 0 24px rgba(255, 95, 126, 0.7);
      margin: 0;
    }
    #setup p { color: #8ea7d6; margin: 0; }

    .pick { display: flex; gap: 0.6rem; align-items: center; }
    .pick span { width: 5.5rem; text-align: right; color: #a0c4ff; letter-spacing: 2px; }
    .pick button, #startBtn {
      font: inherit;
      font-weight: 700;
      color: #a0c4ff;
      background: #101830;
      border: 2px solid #1d2b5c;
      border-radius: 10px;
      padding: 0.45rem 0.95rem;
      cursor: pointer;
    }
    .pick button.on { color: #05070f; background: #ff5f7e; border-color: #ff5f7e; }
    .names { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
    .names input {
      width: 8.5rem;
      font: inherit;
      font-weight: 700;
      text-align: center;
      letter-spacing: 1px;
      color: #e0e8ff;
      background: #0b1022;
      border: 2px solid;
      border-radius: 10px;
      padding: 0.45rem 0.4rem;
      text-transform: uppercase;
    }
    .names input.off { display: none; }
    #startBtn {
      margin-top: 0.6rem;
      padding: 0.7rem 2.6rem;
      color: #05070f;
      background: #ff5f7e;
      border-color: #ff5f7e;
      letter-spacing: 4px;
    }
  </style>
</head>
<body>
  <a href="../games.html" class="back-link">&larr; All Games</a>

  <div class="stage">
    <canvas id="game" width="960" height="540"></canvas>

    <div id="setup">
      <h1>RISK</h1>
      <p>Pass and play. One gun. Last one sitting wins.</p>
      <div class="pick" id="pickPlayers"><span>PLAYERS</span>
        <button type="button" data-v="2" class="on">2</button>
        <button type="button" data-v="3">3</button>
        <button type="button" data-v="4">4</button>
      </div>
      <div class="pick" id="pickLives"><span>LIVES</span>
        <button type="button" data-v="3" class="on">3</button>
        <button type="button" data-v="4">4</button>
        <button type="button" data-v="5">5</button>
      </div>
      <div class="names" id="names">
        <input type="text" maxlength="10" placeholder="PLAYER 1" spellcheck="false" style="border-color:#4ec3ff">
        <input type="text" maxlength="10" placeholder="PLAYER 2" spellcheck="false" style="border-color:#ff5f7e">
        <input type="text" maxlength="10" placeholder="PLAYER 3" spellcheck="false" style="border-color:#7bffb2" class="off">
        <input type="text" maxlength="10" placeholder="PLAYER 4" spellcheck="false" style="border-color:#ffd166" class="off">
      </div>
      <button type="button" id="startBtn">START</button>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    var canvas = document.getElementById('game');
    var ctx = canvas.getContext('2d');
    var W = 960, H = 540;

    var COLORS = ['#4ec3ff', '#ff5f7e', '#7bffb2', '#ffd166'];

    /* ============================================================
       THE RULES
       Kept apart from the drawing, so they can be checked on their own.
       ============================================================ */
    var G = { players: [], holder: 0, shells: [], round: 0, live: 0, blank: 0, lives: 3 };

    function rand(n) { return Math.floor(Math.random() * n); }

    function shuffle(a) {
      for (var i = a.length - 1; i > 0; i--) {
        var j = rand(i + 1), t = a[i];
        a[i] = a[j];
        a[j] = t;
      }
      return a;
    }

    /* `shown` is the lives the hearts show: the heart goes the moment
       a live one hits - and how they are drawn goes by it, so nobody
       looks out before the shot has actually landed */

    function setupGame(n, lives, names) {
      G.players = [];
      for (var i = 0; i < n; i++) {
        var nm = names && names[i] ? names[i] : 'PLAYER ' + (i + 1);
        G.players.push({ name: nm.toUpperCase(), color: COLORS[i],
                         lives: lives, shown: lives, alive: true, knockT: -1 });
      }
      G.lives = lives;
      G.round = 0;
      G.holder = 0;
      G.shells = [];
    }

    /* up to four live and up to four blank, at least one of each,
       shuffled into the gun */
    function newRound() {
      G.round++;
      G.live = 1 + rand(4);
      G.blank = 1 + rand(4);
      var s = [], i;
      for (i = 0; i < G.live; i++) s.push(true);
      for (i = 0; i < G.blank; i++) s.push(false);
      G.shells = shuffle(s);
      G.show = shuffle(s.slice());       // shown scrambled - but not the gun's own order
    }

    function aliveList() {
      var a = [];
      for (var i = 0; i < G.players.length; i++) if (G.players[i].alive) a.push(i);
      return a;
    }

    function spinPick() {
      var a = aliveList();
      return a[rand(a.length)];
    }

    function winner() {
      var a = aliveList();
      return a.length === 1 ? a[0] : -1;
    }

    /* The holder fires the next shell at `target` (themselves or someone
       else). Returns what happened and who goes next:
         a number - that player has the gun
         'spin'   - it spins to a random player
         'round'  - the gun is empty: new shells, and `then` - who was
                    getting it - keeps it (or it spins, if that was next)
         'win'    - one player is left */
    function fire(target) {
      var shooter = G.holder;
      var live = G.shells.shift();
      var res = { shooter: shooter, target: target, live: live, died: false, next: null };
      if (live) {
        var t = G.players[target];
        t.lives--;
        if (t.lives <= 0) { t.lives = 0; t.alive = false; res.died = true; }
      }
      var who;
      if (target === shooter) who = live ? 'spin' : shooter;   // a blank at yourself: again
      else who = res.died ? 'spin' : target;                   // they get it
      if (winner() !== -1) res.next = 'win';
      else if (!G.shells.length) { res.next = 'round'; res.then = who; }   // and they keep it into it
      else res.next = who;
      return res;
    }

    /* ============================================================
       THE SCREENS
       setup -> announce -> spin -> pass -> aim -> shot -> ... -> win
       ============================================================ */
    var ANNOUNCE_T = 3.2;          // the shells shown, then shuffled in
    var SPIN_T     = 2.6;          // the gun spinning
    var SPIN_HOLD  = 1.3;          // and who it landed on
    var SHOT_AIM   = 0.5;          // turning the gun on them
    var KNOCK_BACK = 0.1;          // a live one throws them back - fast
    var KNOCK_HOLD = 0.25;         // a moment there
    var KNOCK_RISE = 1.7;          // and they come back up, slowly
    var BLANK_HOLD = 1.1;          // how long a blank's *click* hangs there
    var OUT_FALL   = 0.9;          // the last one: thrown back, then off the chair
    var OUT_HOLD   = 0.6;          // and lying there a moment before the game goes on

    var S = { phase: 'setup', t: 0, data: {}, hover: -1, hoverSelf: false, shake: 0, flash: 0 };
    var setupN = 2, setupLives = 3, setupNames = [];

    function go(phase, data) {
      S.phase = phase;
      S.t = 0;
      S.data = data || {};
    }

    function startGame() {
      setupGame(setupN, setupLives, setupNames);
      newRound();
      go('announce');
    }

    /* the angle round the table of each seat, seen from above: seat 0 at
       the bottom, the rest going round */
    function seatAngle(i) {
      return Math.PI / 2 + i * Math.PI * 2 / G.players.length;
    }

    function startSpin() {
      var target = spinPick();
      var from = S.data.gunAng !== undefined ? S.data.gunAng : -Math.PI / 2;
      var to = seatAngle(target);
      while (to < from) to += Math.PI * 2;
      to += Math.PI * 2 * (4 + rand(2));           // a few good turns first
      go('spin', { target: target, from: from, to: to, gunAng: from });
    }

    function afterShot(res) {
      if (res.next === 'win') { go('win', { who: winner() }); return; }
      if (res.next === 'round') { newRound(); go('announce', { then: res.then, gunAng: S.data.gunAng }); return; }
      if (res.next === 'spin') { startSpin(); return; }
      if (res.next === G.holder) { go('aim'); return; }      // same hands: on you go
      G.holder = res.next;
      go('pass');
    }

    function update(dt) {
      S.t += dt;
      if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 2.2);
      if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 1.6);
      for (var i = 0; i < G.players.length; i++) {
        var pl = G.players[i];
        if (pl.knockT >= 0) {
          pl.knockT += dt;
          /* up again and done - unless they are out: then it keeps
             counting, for the fall off the chair */
          if (pl.shown > 0 && pl.knockT > KNOCK_BACK + KNOCK_HOLD + KNOCK_RISE) pl.knockT = -1;
          if (pl.shown === 0 && pl.knockT > 10) pl.knockT = 10;
        }
      }

      if (S.phase === 'announce' && S.t >= ANNOUNCE_T) {
        /* whoever was getting the gun when it ran dry keeps it - unless
           it was going to spin anyway */
        var then = S.data.then;
        if (typeof then === 'number' && G.players[then].alive) {
          G.holder = then;
          go('pass');
        } else startSpin();
      } else if (S.phase === 'spin') {
        var k = Math.min(1, S.t / SPIN_T);
        var e = 1 - Math.pow(1 - k, 3);
        S.data.gunAng = S.data.from + (S.data.to - S.data.from) * e;
        if (S.t >= SPIN_T + SPIN_HOLD) {
          G.holder = S.data.target;
          go('pass');
        }
      } else if (S.phase === 'shot') {
        /* aim, fire, the hit plays out - knocked back, slowly up - and
           only then does the heart go; on the last one, over they go */
        var r = S.data.res, tp = G.players[r.target];
        if (!S.data.fired && S.t >= SHOT_AIM) {
          S.data.fired = true;
          if (r.live) {
            tp.knockT = 0;
            tp.shown = tp.lives;           // the heart goes as it hits
            if (r.target === r.shooter) { S.shake = 1; S.flash = 1; }
            else S.flash = 0.35;
          }
        }
        /* a hit: thrown back and slowly up again - or, out, thrown back
           and left there a moment; a blank: just the click */
        var hitEnd = SHOT_AIM + (r.died ? KNOCK_BACK + KNOCK_HOLD + OUT_FALL + OUT_HOLD :
                                 r.live ? KNOCK_BACK + KNOCK_HOLD + KNOCK_RISE : BLANK_HOLD);
        if (S.t >= hitEnd) afterShot(r);
      }
    }

    /* ============================================================
       WHERE EVERYONE SITS, SEEN FROM THE HOLDER'S CHAIR
       The others round the table: straight across, or out to the sides.
       ============================================================ */
    function viewSpot(i) {
      var n = G.players.length;
      var k = (i - G.holder + n) % n;
      var a = k * Math.PI * 2 / n;                  // 0 is you, PI across from you
      var d = (1 - Math.cos(a)) / 2;                // 0 near .. 1 far
      /* round the far side and the ends of the table, sat at its edge */
      return { x: W / 2 + Math.sin(a) * 330, y: 345 - d * d * 110, s: 1.2 - 0.4 * d };
    }

    function targetAt(mx, my) {
      for (var i = 0; i < G.players.length; i++) {
        if (i === G.holder || !G.players[i].alive) continue;
        var v = viewSpot(i);
        var r = 62 * v.s;
        if (Math.abs(mx - v.x) < r && my > v.y - 110 * v.s && my < v.y + 46 * v.s) return i;
      }
      return -1;
    }

    var SELF_BTN = { x: W - 270, y: H - 74, w: 250, h: 54 };
    var WIN_BTNS = [ { x: W / 2 - 230, y: 330, w: 210, h: 56, label: 'PLAY AGAIN' },
                     { x: W / 2 + 20,  y: 330, w: 210, h: 56, label: 'NEW GAME' } ];

    function inRect(mx, my, r) {
      return mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h;
    }

    function shoot(target) {
      var res = fire(target);
      go('shot', { res: res, fired: false });
    }

    function onClick(mx, my) {
      if (S.phase === 'pass') { go('aim'); return; }
      if (S.phase === 'aim') {
        if (inRect(mx, my, SELF_BTN)) { shoot(G.holder); return; }
        var t = targetAt(mx, my);
        if (t !== -1) shoot(t);
        return;
      }
      if (S.phase === 'win') {
        if (inRect(mx, my, WIN_BTNS[0])) { startGame(); return; }
        if (inRect(mx, my, WIN_BTNS[1])) { go('setup'); setupEl.classList.remove('hidden'); }
      }
    }

    function toCanvas(e) {
      var r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
    }

    canvas.addEventListener('click', function (e) { var c = toCanvas(e); onClick(c.x, c.y); });
    canvas.addEventListener('mousemove', function (e) {
      var c = toCanvas(e);
      S.hover = S.phase === 'aim' ? targetAt(c.x, c.y) : -1;
      S.hoverSelf = S.phase === 'aim' && inRect(c.x, c.y, SELF_BTN);
    });

    /* ============================================================
       DRAWING
       ============================================================ */
    function rr(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function text(str, x, y, size, color, glow) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + size + 'px sans-serif';
      ctx.fillStyle = color;
      if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
      ctx.fillText(str, x, y);
      ctx.restore();
    }

    function heart(x, y, s, full) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(s, s);
      ctx.fillStyle = full ? '#ff5f7e' : 'rgba(255,95,126,0.18)';
      if (full) { ctx.shadowColor = '#ff5f7e'; ctx.shadowBlur = 8; }
      ctx.beginPath();
      ctx.moveTo(0, 4);
      ctx.bezierCurveTo(-8, -3, -4, -10, 0, -5);
      ctx.bezierCurveTo(4, -10, 8, -3, 0, 4);
      ctx.fill();
      ctx.restore();
    }

    function hearts(pl, x, y, s) {
      var gap = 16 * s;
      var x0 = x - (G.lives - 1) * gap / 2;
      for (var i = 0; i < G.lives; i++) heart(x0 + i * gap, y, s, i < pl.shown);
    }

    /* how far back a hit has thrown them, 0..1: snapped back fast, held
       there a moment, then a slow climb back up */
    function leanOf(pl) {
      if (pl.knockT < 0) return pl.shown > 0 ? 0 : 1;          // out: and they stay down
      if (pl.knockT < KNOCK_BACK) {
        var q = pl.knockT / KNOCK_BACK;
        return 1 - (1 - q) * (1 - q);
      }
      if (pl.shown === 0 || pl.knockT < KNOCK_BACK + KNOCK_HOLD) return 1;
      var k = Math.min(1, (pl.knockT - KNOCK_BACK - KNOCK_HOLD) / KNOCK_RISE);
      return 1 - k * k * (3 - 2 * k);
    }

    /* out: how far off the chair they've gone, 0..1, after the hit has
       thrown them back */
    function fallOf(pl) {
      if (pl.shown > 0) return 0;
      if (pl.knockT < 0) return 1;                         // out from before: lying there
      var k = (pl.knockT - KNOCK_BACK - KNOCK_HOLD) / OUT_FALL;
      return Math.max(0, Math.min(1, k));
    }

    /* A block drawn like the cube on A Platformer Game's icon: a rounded
       block in the player's colour, glowing, with a dark one sunk into
       it - so each block is a thick coloured line round a dark middle. */
    function block(x, y, w, h, color, s) {
      var edge = Math.max(2.5, 5 * s);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 10;
      rr(x, y, w, h, Math.min(6 * s, w / 3));
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#05070f';
      rr(x + edge, y + edge, w - 2 * edge, h - 2 * edge, Math.min(4 * s, w / 4));
      ctx.fill();
    }

    /* A blocky person in their floating chair at the table, facing you,
       made of those blocks, with the cube's white eyes. A hit throws the
       head and body back from the hips - the chair stays where it is -
       and they slowly come back up; on the last one, they stay down. */
    function drawSeated(i, v, highlight) {
      var pl = G.players[i];
      var s = v.s;
      var bob = Math.sin(performanceNow() * 2 + i) * 3 * s;
      var cx = v.x, seat = v.y + bob;
      var lean = leanOf(pl);
      var col = pl.color;
      /* thrown back is away from the table: out to their side for the
         ones at the ends, up and over for the one across from you */
      var outDir = Math.abs(v.x - W / 2) < 40 ? 0 : (v.x > W / 2 ? 1 : -1);
      var face = v.x > W / 2 + 40 ? -1 : 1;      // looking in toward the table

      /* the glow it floats on, and the chair: a high back and the seat */
      ctx.save();
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#c7a0ff';
      ctx.beginPath();
      ctx.ellipse(cx, v.y + 70 * s, 46 * s, 9 * s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#2a2f63';
      ctx.strokeStyle = 'rgba(199,160,255,0.75)';
      ctx.lineWidth = 2.5;
      rr(cx - 46 * s, seat - 158 * s, 92 * s, 154 * s, 10 * s);         // the back
      ctx.fill();
      ctx.stroke();
      rr(cx - 50 * s, seat - 4 * s, 100 * s, 14 * s, 6 * s);            // the seat
      ctx.fill();
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, seat);

      /* out: after the hit has thrown them back, they go off the chair -
         over its side and down onto the floor beside it, and lie there */
      var fall = fallOf(pl);
      if (fall > 0) {
        var fdir = outDir || (i % 2 ? 1 : -1);
        var e = fall * fall * (3 - 2 * fall);
        ctx.translate(fdir * e * 100 * s, -Math.sin(e * Math.PI) * 30 * s + e * 46 * s);
        ctx.rotate(fdir * e * Math.PI / 2);
      }

      /* legs on the seat and down off its front */
      block(-20 * s, -6 * s, 40 * s, 14 * s, col, s);
      block(-19 * s, 6 * s, 16 * s, 36 * s, col, s);
      block(3 * s, 6 * s, 16 * s, 36 * s, col, s);

      /* the top half, from the hips: thrown back by a hit */
      ctx.translate(0, -4 * s);
      if (outDir) ctx.rotate(outDir * lean * 1.05);
      else {                                       // straight across: back and up
        ctx.translate(0, -lean * 22 * s);
        ctx.scale(1 - 0.2 * lean, 1 - 0.2 * lean);
        ctx.rotate(lean * 0.25);
      }
      block(-20 * s, -54 * s, 40 * s, 52 * s, col, s);                  // body
      /* the arms: flung up and out by the hit, coming back down with them */
      var fling = lean * 1.9;
      ctx.save();
      ctx.translate(-26 * s, -50 * s);
      ctx.rotate(fling);
      block(-6 * s, -2 * s, 12 * s, 42 * s, col, s);
      ctx.restore();
      ctx.save();
      ctx.translate(26 * s, -50 * s);
      ctx.rotate(-fling);
      block(-6 * s, -2 * s, 12 * s, 42 * s, col, s);
      ctx.restore();
      var hw = 38 * s, hy = -54 * s - hw - 3 * s;
      block(-hw / 2, hy, hw, hw, col, s);                               // head
      /* the cube's eyes: two white bars, looking your way - shut, out */
      var k = hw / 30;
      ctx.fillStyle = '#ffffff';
      var ecy = hy + hw / 2 - 6 * k;
      var out = pl.shown === 0 && lean >= 0.99;
      var eh = out ? 2 * k : 7 * k, eo = out ? 3 * k : 0;
      ctx.fillRect((face > 0 ? 1 : -6) * k, ecy + eo, 5 * k, eh);
      ctx.fillRect((face > 0 ? -7 : 2) * k, ecy + eo, 5 * k, eh);
      if (pl.knockT >= 0 && pl.knockT < 0.18) {                         // the hit
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.fillRect(-20 * s, -54 * s, 40 * s, 52 * s);
      }
      ctx.restore();

      if (highlight) {
        ctx.save();
        ctx.strokeStyle = '#ff5f7e';
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.arc(cx, seat - 52 * s, 76 * s, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      text(pl.name, cx, seat - 172 * s, Math.round(15 * s), pl.shown > 0 ? col : '#56658c');
      if (pl.shown > 0) hearts(pl, cx, seat - 192 * s, s);
    }

    /* A revolver, seen from above, barrel pointing up (-y), the middle
       of it at 0,0. Proper parts - barrel with a rib and front sight,
       a fluted cylinder, the frame, hammer, trigger guard and a wooden
       grip - but kept simple and clean. */
    var GUN_TIP = -118;                    // where the barrel ends

    function drawRevolver(fired) {
      var steel = '#9aa3b8', dark = '#5c6274', light = '#d4dbea';

      /* the grip, angled back, wood with a darker panel */
      ctx.save();
      ctx.translate(0, 34);
      ctx.rotate(0.18);
      ctx.fillStyle = '#5a3a22';
      rr(-13, 0, 26, 64, 9);
      ctx.fill();
      ctx.fillStyle = '#7a5232';
      rr(-8, 8, 16, 48, 6);
      ctx.fill();
      ctx.strokeStyle = 'rgba(40,22,10,0.6)';
      ctx.lineWidth = 1.2;
      for (var g = 0; g < 4; g++) {                // the checkering
        ctx.beginPath();
        ctx.moveTo(-7, 14 + g * 10);
        ctx.lineTo(7, 20 + g * 10);
        ctx.stroke();
      }
      ctx.restore();

      /* the trigger guard and the trigger */
      ctx.strokeStyle = dark;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(11, 30, 11, -Math.PI / 2, Math.PI / 2);
      ctx.stroke();
      ctx.fillStyle = dark;
      ctx.fillRect(8, 24, 4, 12);

      /* the frame, and the hammer at the back of it */
      ctx.fillStyle = dark;
      rr(-15, -8, 30, 44, 6);
      ctx.fill();
      ctx.fillStyle = '#3a3f4a';
      rr(-5, 32, 10, 12, 3);
      ctx.fill();

      /* the cylinder, with its flutes */
      ctx.fillStyle = steel;
      rr(-19, -40, 38, 36, 9);
      ctx.fill();
      ctx.fillStyle = dark;
      for (var f = -1; f <= 1; f++) rr(f * 11 - 2.5, -36, 5, 28, 2.5);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      rr(-17, -38, 8, 32, 4);
      ctx.fill();

      /* the barrel: the long part, a rib along the top, the front sight */
      ctx.fillStyle = steel;
      rr(-7, GUN_TIP, 14, 80, 4);
      ctx.fill();
      ctx.fillStyle = light;
      ctx.fillRect(-2, GUN_TIP + 4, 4, 72);
      ctx.fillStyle = dark;
      ctx.fillRect(-3, GUN_TIP - 4, 6, 7);
      ctx.fillStyle = '#05070f';                   // the muzzle
      ctx.beginPath();
      ctx.arc(0, GUN_TIP, 3, 0, Math.PI * 2);
      ctx.fill();

      if (fired) {                                 // the muzzle flash
        ctx.fillStyle = '#ffd166';
        ctx.shadowColor = '#ff8c42';
        ctx.shadowBlur = 40;
        ctx.beginPath();
        for (var k = 0; k < 10; k++) {
          var a = k / 10 * Math.PI * 2, rad = k % 2 ? 14 : 38;
          ctx.lineTo(Math.cos(a) * rad, GUN_TIP - 12 + Math.sin(a) * rad);
        }
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    /* the gun in your hand, pointing at `ang` (0 = straight ahead), or
       turned round on yourself */
    function drawGun(ang, self, fired) {
      ctx.save();
      ctx.translate(W / 2, H - 80);
      /* a pool of light under it, so it stands out from the table */
      var lg = ctx.createRadialGradient(0, -40, 10, 0, -40, 190);
      lg.addColorStop(0, 'rgba(160,196,255,0.22)');
      lg.addColorStop(1, 'rgba(160,196,255,0)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.arc(0, -40, 190, 0, Math.PI * 2);
      ctx.fill();
      if (self) {
        ctx.translate(0, -50);
        ctx.scale(1.7, 1.7);                         // coming at you
        ctx.rotate(Math.PI);
      } else {
        ctx.scale(1.35, 1.35);                       // big, and in your hand
        ctx.rotate(ang);
      }
      ctx.shadowColor = 'rgba(220,230,255,0.85)';    // a bright edge all round it
      ctx.shadowBlur = 12;
      drawRevolver(fired);
      ctx.restore();
    }

    function drawTable() {
      /* an ordinary table, and you sat at it: its near edge is right
         in front of you, at the bottom of the view */
      var g = ctx.createRadialGradient(W / 2, 400, 40, W / 2, 400, 420);
      g.addColorStop(0, '#2a1638');
      g.addColorStop(1, '#120a20');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(W / 2, 400, 400, 165, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,95,126,0.45)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    function drawRoom() {
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0b0820');
      g.addColorStop(1, '#05070f');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,209,102,0.08)';         // a lamp over the table
      ctx.beginPath();
      ctx.moveTo(W / 2 - 40, 0);
      ctx.lineTo(W / 2 + 40, 0);
      ctx.lineTo(W / 2 + 330, 330);
      ctx.lineTo(W / 2 - 330, 330);
      ctx.closePath();
      ctx.fill();
    }

    /* first person, from the chair of whoever has the gun */
    function drawView() {
      var me = G.players[G.holder];

      /* shot yourself: the view is thrown back from the table, then
         slowly comes back - and on your last life it stays back and
         goes dark */
      var myLean = leanOf(me);
      var myFall = (!me.alive && S.phase === 'shot')
        ? Math.min(1, Math.max(0, S.t - SHOT_AIM - KNOCK_BACK - KNOCK_HOLD) / OUT_FALL) : 0;
      ctx.save();
      /* blasted back from the table: everything goes further off, then
         slowly comes back */
      var back = 1 - 0.3 * myLean;
      ctx.translate(W / 2, H / 2);
      ctx.scale(back, back);
      ctx.translate(-W / 2, -H / 2);
      ctx.translate(0, myLean * 40);

      drawRoom();
      var order = [], i;
      for (i = 0; i < G.players.length; i++) if (i !== G.holder) order.push(i);
      order.sort(function (a, b) { return viewSpot(a).s - viewSpot(b).s; });   // far ones first
      /* everyone sits at the table: it goes over their laps */
      for (i = 0; i < order.length; i++) {
        drawSeated(order[i], viewSpot(order[i]), S.phase === 'aim' && S.hover === order[i]);
      }
      drawTable();

      /* the gun: on whoever you point at, or turned on yourself */
      var ang = 0, self = false, fired = false;
      if (S.phase === 'aim' && S.hover !== -1) ang = aimAt(S.hover);
      if (S.phase === 'aim' && S.hoverSelf) self = true;
      if (S.phase === 'shot') {
        var r = S.data.res;
        self = r.target === r.shooter;
        var k = Math.min(1, S.t / SHOT_AIM);
        ang = self ? 0 : aimAt(r.target) * k;
        fired = r.live && S.t >= SHOT_AIM && S.t < SHOT_AIM + 0.12;
      }
      drawGun(ang, self, fired);
      ctx.restore();
      if (myFall > 0) {                                   // and it all goes dark
        ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, myFall * 1.3) + ')';
        ctx.fillRect(0, 0, W, H);
      }

      /* this round's shells, as they were announced, top left */
      ctx.save();
      ctx.fillStyle = 'rgba(5,7,15,0.7)';
      rr(14, 14, 200, 40, 10);
      ctx.fill();
      ctx.textAlign = 'left';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillStyle = '#ff2d55';
      ctx.fillText(G.live + ' LIVE', 26, 42);
      ctx.fillStyle = '#c9d2e6';
      ctx.fillText(G.blank + ' BLANK', 108, 42);
      ctx.restore();

      /* you: your colour, your name, your lives, and the other choice */
      ctx.fillStyle = me.color;
      ctx.fillRect(0, H - 6, W, 6);
      text('YOU: ' + me.name, 120, H - 46, 18, me.color, 10);
      hearts(me, 120, H - 22, 1.3);
      if (S.phase === 'aim') {
        ctx.fillStyle = S.hoverSelf ? '#ff5f7e' : '#2a0f1c';
        rr(SELF_BTN.x, SELF_BTN.y, SELF_BTN.w, SELF_BTN.h, 12);
        ctx.fill();
        ctx.strokeStyle = '#ff5f7e';
        ctx.lineWidth = 2;
        ctx.stroke();
        text('SHOOT YOURSELF', SELF_BTN.x + SELF_BTN.w / 2, SELF_BTN.y + 35, 20,
             S.hoverSelf ? '#05070f' : '#ff5f7e');
        text('Click a player to shoot them - or yourself', W / 2, 40, 16, '#8ea7d6');
        text(G.shells.length + ' SHELLS LEFT IN THE GUN', W / 2, 64, 13, '#56658c');
      }

      /* what it was */
      if (S.phase === 'shot' && S.t >= SHOT_AIM) {
        var res = S.data.res;
        if (res.live) {
          text('LIVE!', W / 2, 130, 64, '#ff2d55', 30);
          if (res.died && S.data.applied) text(G.players[res.target].name + ' IS OUT', W / 2, 172, 22, '#ff8fa3');
        } else {
          text('*click*', W / 2, 130, 58, '#e6ecff', 18);
          text('BLANK', W / 2, 192, 52, '#c9d2e6', 12);
        }
      }
    }

    function aimAt(i) {
      var v = viewSpot(i);
      return Math.atan2(v.x - W / 2, (H - 80) - (v.y - 45 * v.s));   // their chest
    }

    /* the table from above, with the gun spinning in the middle */
    function drawSpin() {
      drawRoom();
      var cx = W / 2, cy = 236, R = 140;             // up a little: the table in the middle
      ctx.fillStyle = '#1e1030';
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,95,126,0.5)';
      ctx.lineWidth = 3;
      ctx.stroke();
      for (var i = 0; i < G.players.length; i++) {
        var a = seatAngle(i), pl = G.players[i];
        var sx = cx + Math.cos(a) * (R + 56), sy = cy + Math.sin(a) * (R + 56);
        ctx.fillStyle = '#2b3166';
        rr(sx - 34, sy - 34, 68, 68, 10);
        ctx.fill();
        if (pl.alive) {
          ctx.fillStyle = pl.color;
          ctx.shadowColor = pl.color;
          ctx.shadowBlur = 14;
          rr(sx - 22, sy - 22, 44, 44, 7);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#05070f';
          rr(sx - 15, sy - 15, 30, 30, 5);
          ctx.fill();
        }
        text(pl.name, sx, sy + (Math.sin(a) > 0.5 || Math.sin(a) < -0.5 ? 50 : -42), 13, pl.alive ? pl.color : '#56658c');
      }
      /* the gun, lying on the table, spinning */
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(S.data.gunAng + Math.PI / 2);       // its barrel pointing the way it faces
      ctx.scale(0.9, 0.9);
      ctx.translate(0, 10);                          // spun round its own middle
      drawRevolver(false);
      ctx.restore();
      if (S.t >= SPIN_T) {
        var w = G.players[S.data.target];
        text(w.name + ' HAS THE GUN', W / 2, 522, 28, w.color, 18);
      } else {
        text('WHO GETS THE GUN?', W / 2, 522, 24, '#8ea7d6');
      }
    }

    /* the shells for this round, then into the gun */
    function drawAnnounce() {
      drawRoom();
      text('ROUND ' + G.round, W / 2, 110, 28, '#8ea7d6');
      text(G.live + ' LIVE  -  ' + G.blank + ' BLANK', W / 2, 180, 46, '#ffffff', 16);
      var n = G.live + G.blank, gap = 70, x0 = W / 2 - (n - 1) * gap / 2;
      var into = Math.max(0, Math.min(1, (S.t - 2.0) / 1.0));   // flying into the gun
      for (var i = 0; i < n; i++) {
        var live = G.show[i];                  // scrambled - not the order they are in the gun
        /* shuffling - and they keep shuffling all the way into the gun */
        var mix = S.t > 1.3 ? Math.sin(S.t * 30 + i * 2) * 26 : 0;
        var mixY = S.t > 1.3 ? Math.cos(S.t * 23 + i * 3) * 14 : 0;
        var sx = x0 + i * gap, sy = 290;
        sx += (W / 2 - sx) * into;
        sy += (430 - sy) * into;
        sx += mix;
        sy += mixY;
        ctx.save();
        ctx.globalAlpha = 1 - into;
        ctx.translate(sx, sy);
        ctx.fillStyle = live ? '#ff2d55' : '#8a93ad';
        if (live) { ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 16; }
        rr(-16, -38, 32, 64, 8);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffd166';
        rr(-16, 18, 32, 14, 4);                // the brass end
        ctx.fill();
        ctx.restore();
      }
      if (S.t > 1.3) text('SHUFFLING...', W / 2, 400, 20, '#56658c');
    }

    function drawPass() {
      ctx.fillStyle = '#05070f';
      ctx.fillRect(0, 0, W, H);
      var pl = G.players[G.holder];
      text('PASS TO', W / 2, 210, 24, '#8ea7d6');
      text(pl.name, W / 2, 280, 64, pl.color, 26);
      text('click when ready', W / 2, 340, 16, '#56658c');
    }

    function drawWin() {
      drawRoom();
      var pl = G.players[S.data.who];
      text(pl.name + ' WINS', W / 2, 220, 64, pl.color, 28);
      text('the last one sitting', W / 2, 262, 18, '#8ea7d6');
      for (var i = 0; i < WIN_BTNS.length; i++) {
        var b = WIN_BTNS[i];
        ctx.fillStyle = i === 0 ? '#ff5f7e' : '#101830';
        rr(b.x, b.y, b.w, b.h, 12);
        ctx.fill();
        ctx.strokeStyle = '#ff5f7e';
        ctx.lineWidth = 2;
        ctx.stroke();
        text(b.label, b.x + b.w / 2, b.y + 36, 20, i === 0 ? '#05070f' : '#ff5f7e');
      }
    }

    function draw() {
      ctx.save();
      if (S.shake > 0) ctx.translate((Math.random() - 0.5) * 18 * S.shake,
                                     (Math.random() - 0.5) * 18 * S.shake);
      if (S.phase === 'announce') drawAnnounce();
      else if (S.phase === 'spin') drawSpin();
      else if (S.phase === 'pass') drawPass();
      else if (S.phase === 'aim' || S.phase === 'shot') drawView();
      else if (S.phase === 'win') drawWin();
      else drawRoom();
      ctx.restore();
      if (S.flash > 0) {                               // a live one, red across everything
        ctx.fillStyle = 'rgba(255,45,85,' + (S.flash * 0.45) + ')';
        ctx.fillRect(0, 0, W, H);
      }
    }

    /* ============================================================
       SETUP AND THE LOOP
       ============================================================ */
    var setupEl = document.getElementById('setup');

    function wirePick(id, set) {
      var box = document.getElementById(id);
      if (!box.querySelectorAll) return;
      var btns = box.querySelectorAll('button');
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener('click', function () {
          for (var j = 0; j < btns.length; j++) btns[j].classList.remove('on');
          this.classList.add('on');
          set(+this.getAttribute('data-v'));
        });
      }
    }
    /* a name box for each player there is */
    var nameBox = document.getElementById('names');
    var nameInputs = nameBox.querySelectorAll ? nameBox.querySelectorAll('input') : [];
    function showNameBoxes() {
      for (var i = 0; i < nameInputs.length; i++) {
        if (i < setupN) nameInputs[i].classList.remove('off');
        else nameInputs[i].classList.add('off');
      }
    }
    wirePick('pickPlayers', function (v) { setupN = v; showNameBoxes(); });
    wirePick('pickLives', function (v) { setupLives = v; });
    document.getElementById('startBtn').addEventListener('click', function () {
      setupNames = [];
      for (var i = 0; i < nameInputs.length; i++) setupNames.push(nameInputs[i].value.trim());
      setupEl.classList.add('hidden');
      startGame();
    });

    var clock = 0;
    function performanceNow() { return clock; }

    var last = 0;
    function frame(now) {
      var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
      last = now;
      clock += dt;
      if (S.phase !== 'setup') update(dt);
      draw();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
