<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risk - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../gate.js" data-gate="risk"></script>
  <style>
    body { background: #05070f; }

    .stage {
      position: relative;
      width: min(960px, 96vw);
      aspect-ratio: 16 / 9;
      margin: 0 auto;
    }

    #game {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 14px;
      background: #070a18;
      box-shadow: 0 0 40px rgba(78, 195, 255, 0.12);
      cursor: pointer;
    }

    /* the setup screen, over the canvas */
    #setup {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      border-radius: 14px;
      background: radial-gradient(ellipse at center, #1a1030 0%, #05070f 75%);
    }
    #setup.hidden { display: none; }

    #setup h1 {
      font-size: clamp(2.2rem, 7vw, 4rem);
      letter-spacing: 10px;
      color: #ff5f7e;
      text-shadow: 0 0 24px rgba(255, 95, 126, 0.7);
      margin: 0;
    }
    #setup p { color: #8ea7d6; margin: 0; }

    .pick { display: flex; gap: 0.6rem; align-items: center; }
    .pick span { width: 5.5rem; text-align: right; color: #a0c4ff; letter-spacing: 2px; }
    .pick button, #startBtn {
      font: inherit;
      font-weight: 700;
      color: #a0c4ff;
      background: #101830;
      border: 2px solid #1d2b5c;
      border-radius: 10px;
      padding: 0.45rem 0.95rem;
      cursor: pointer;
    }
    .pick button.on { color: #05070f; background: #ff5f7e; border-color: #ff5f7e; }
    .pick button.gear { margin-left: 0.6rem; color: #ffd166; border-color: #6b5a2a; }

    #settings {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      border-radius: 14px;
      background: radial-gradient(ellipse at center, #10162e 0%, #05070f 80%);
      z-index: 3;
    }
    #settings.hidden { display: none; }
    #settings h2 { margin: 0; color: #ffd166; letter-spacing: 6px; }
    #settings p { margin: 0 0 0.4rem; color: #8ea7d6; }
    #itemList {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.5rem;
      width: min(880px, 92%);
    }
    .itemRow {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 0.6rem;
      background: #0f1530;
      border: 2px solid #3a4a78;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: #c9d2e6;
    }
    .itemRow canvas { flex: none; width: 40px; height: 40px; }
    .itemRow b { display: block; color: #4ec3ff; font-size: 0.85rem; letter-spacing: 1px; }
    .itemRow small { display: block; color: #8ea7d6; font-size: 0.7rem; line-height: 1.25; }
    .itemRow .sw {
      margin-left: auto;
      flex: none;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      color: #05070f;
      background: #7bffb2;
    }
    .itemRow.off { opacity: 0.5; border-color: #2a2f45; }
    .itemRow.off .sw { background: #ff5f7e; }
    #settingsDone {
      margin-top: 0.4rem;
      font: inherit;
      font-weight: 700;
      letter-spacing: 4px;
      color: #05070f;
      background: #ffd166;
      border: 2px solid #ffd166;
      border-radius: 10px;
      padding: 0.6rem 2.4rem;
      cursor: pointer;
    }

    .names { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
    .names input {
      width: 8.5rem;
      font: inherit;
      font-weight: 700;
      text-align: center;
      letter-spacing: 1px;
      color: #e0e8ff;
      background: #0b1022;
      border: 2px solid;
      border-radius: 10px;
      padding: 0.45rem 0.4rem;
      text-transform: uppercase;
    }
    .names input.off { display: none; }
    #startBtn {
      margin-top: 0.6rem;
      padding: 0.7rem 2.6rem;
      color: #05070f;
      background: #ff5f7e;
      border-color: #ff5f7e;
      letter-spacing: 4px;
    }
  </style>
</head>
<body>
  <a href="../games.html" class="back-link">&larr; All Games</a>

  <div class="stage">
    <canvas id="game" width="960" height="540"></canvas>

    <div id="setup">
      <h1>RISK</h1>
      <p>Pass and play. One gun. Last one sitting wins.</p>
      <div class="pick" id="pickPlayers"><span>PLAYERS</span>
        <button type="button" data-v="2" class="on">2</button>
        <button type="button" data-v="3">3</button>
        <button type="button" data-v="4">4</button>
      </div>
      <div class="pick" id="pickLives"><span>LIVES</span>
        <button type="button" data-v="3" class="on">3</button>
        <button type="button" data-v="4">4</button>
        <button type="button" data-v="5">5</button>
      </div>
      <div class="pick" id="pickShow"><span>ITEMS</span>
        <button type="button" data-v="1" class="on">EVERYONE SEES ALL</button>
        <button type="button" data-v="0">ONLY YOUR OWN</button>
        <button type="button" id="settingsBtn" class="gear">&#9881; SETTINGS</button>
      </div>
      <div class="names" id="names">
        <input type="text" maxlength="10" placeholder="PLAYER 1" spellcheck="false" style="border-color:#4ec3ff">
        <input type="text" maxlength="10" placeholder="PLAYER 2" spellcheck="false" style="border-color:#ff5f7e">
        <input type="text" maxlength="10" placeholder="PLAYER 3" spellcheck="false" style="border-color:#7bffb2" class="off">
        <input type="text" maxlength="10" placeholder="PLAYER 4" spellcheck="false" style="border-color:#ffd166" class="off">
      </div>
      <button type="button" id="startBtn">START</button>
    </div>

    <!-- settings: switch off any item you think is too strong -->
    <div id="settings" class="hidden">
      <h2>ITEMS IN THE GAME</h2>
      <p>Switch off any you think are too strong. Off ones are never dealt.</p>
      <div id="itemList"></div>
      <button type="button" id="settingsDone">DONE</button>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    var canvas = document.getElementById('game');
    var ctx = canvas.getContext('2d');
    var W = 960, H = 540;

    var COLORS = ['#4ec3ff', '#ff5f7e', '#7bffb2', '#ffd166'];

    /* ============================================================
       THE RULES
       Kept apart from the drawing, so they can be checked on their own.
       ============================================================ */
    var G = { players: [], holder: 0, shells: [], round: 0, live: 0, blank: 0, lives: 3 };

    function rand(n) { return Math.floor(Math.random() * n); }

    function shuffle(a) {
      for (var i = a.length - 1; i > 0; i--) {
        var j = rand(i + 1), t = a[i];
        a[i] = a[j];
        a[j] = t;
      }
      return a;
    }

    /* `shown` is the lives the hearts show: the heart goes the moment
       a live one hits - and how they are drawn goes by it, so nobody
       looks out before the shot has actually landed */

    function setupGame(n, lives, names) {
      G.players = [];
      for (var i = 0; i < n; i++) {
        var nm = names && names[i] ? names[i] : 'PLAYER ' + (i + 1);
        G.players.push({ name: nm.toUpperCase(), color: COLORS[i],
                         lives: lives, shown: lives, alive: true, knockT: -1,
                         items: [], jammed: false });
      }
      G.lives = lives;
      G.round = 0;
      G.holder = 0;
      G.shells = [];
      G.powder = false;
    }

    /* up to four live and up to four blank, at least one of each,
       shuffled into the gun */
    function newRound() {
      G.round++;
      G.live = 1 + rand(4);
      G.blank = 1 + rand(4);
      var s = [], i;
      for (i = 0; i < G.live; i++) s.push(true);
      for (i = 0; i < G.blank; i++) s.push(false);
      G.shells = shuffle(s);
      G.show = shuffle(s.slice());       // shown scrambled - but not the gun's own order
      G.powder = false;
      /* two new items each, every round - whatever you didn't use is gone -
         out of the ones switched on in the settings */
      var pool = [];
      for (i = 0; i < ITEM_KINDS.length; i++) if (ITEM_ON[ITEM_KINDS[i]]) pool.push(ITEM_KINDS[i]);
      for (i = 0; i < G.players.length; i++) {
        var pl = G.players[i];
        pl.items = pl.alive && pool.length ? [pool[rand(pool.length)], pool[rand(pool.length)]] : [];
      }
    }

    function aliveList() {
      var a = [];
      for (var i = 0; i < G.players.length; i++) if (G.players[i].alive) a.push(i);
      return a;
    }

    function spinPick() {
      var a = aliveList();
      return a[rand(a.length)];
    }

    function winner() {
      var a = aliveList();
      return a.length === 1 ? a[0] : -1;
    }

    /* The holder fires the next shell at `target` (themselves or someone
       else). Returns what happened and who goes next:
         a number - that player has the gun
         'spin'   - it spins to a random player
         'round'  - the gun is empty: new shells, and `then` - who was
                    getting it - keeps it (or it spins, if that was next)
         'win'    - one player is left */
    function fire(target) {
      var shooter = G.holder;
      var live = G.shells.shift();
      var res = { shooter: shooter, target: target, live: live, died: false, next: null,
                  dmg: live ? (G.powder ? 2 : 1) : 0 };
      G.powder = false;                  // used up on this shot, live or blank
      if (live) {
        var t = G.players[target];
        t.lives -= res.dmg;
        if (t.lives <= 0) { t.lives = 0; t.alive = false; res.died = true; }
      }
      var who;
      if (target === shooter) who = live ? 'spin' : shooter;   // a blank at yourself: again
      else who = res.died ? 'spin' : target;                   // they get it
      if (winner() !== -1) res.next = 'win';
      else if (!G.shells.length) { res.next = 'round'; res.then = who; }   // and they keep it into it
      else res.next = who;
      return res;
    }

    /* ============================================================
       ITEMS
       Two each round, used on your own turn, whenever you like before
       you shoot. What each one does to the game is here; how it looks
       is with the drawing.
       ============================================================ */
    var ITEMS = {
      radio:   { name: 'RADIO',          desc: 'Tells you what one of the shells after this one is. You still shoot.' },
      glass:   { name: 'MAGNIFYING GLASS', desc: 'See whether the shell in the chamber is live or blank. You still shoot.' },
      crowbar: { name: 'CROWBAR',        desc: 'Pry the shell in the chamber out - you see what it was. You still shoot.' },
      powder:  { name: 'GUNPOWDER',      desc: 'The next shell does double damage. Your turn ends - the gun spins.' },
      grab:    { name: 'GRABBERS',       desc: 'Take one item from another player - you see theirs. You still shoot.' },
      remote:  { name: 'REMOTE',         desc: 'Spin the gun right now - it goes to someone random.' },
      jammer:  { name: 'JAMMER',         desc: 'Pick a player: the next time the gun comes to them, it comes straight back.' },
      invert:  { name: 'INVERTER',       desc: 'Flip the shell in the chamber: live to blank, blank to live. You still shoot.' },
      drink:   { name: 'ENERGY DRINK',   desc: 'Get one life back. You still shoot.' }
    };
    var ITEM_KINDS = ['radio', 'glass', 'crowbar', 'powder', 'grab', 'remote', 'jammer', 'invert', 'drink'];
    /* which are in the game: all of them, unless switched off in settings */
    var ITEM_ON = {};
    for (var ik = 0; ik < ITEM_KINDS.length; ik++) ITEM_ON[ITEM_KINDS[ik]] = true;

    /* The holder uses their item at `slot`. `arg` is the player for a
       jammer or grabbers, and `argItem` the slot of theirs to take.
       Returns what happened, and `next` if it changes who has the gun:
       'spin', or 'round' if it emptied the gun. */
    function useItem(slot, arg, argItem) {
      var me = G.players[G.holder];
      var kind = me.items[slot];
      var res = { kind: kind, next: null };
      me.items.splice(slot, 1);
      if (kind === 'radio') {
        if (G.shells.length > 1) {
          res.pos = 1 + rand(G.shells.length - 1);          // one of the ones after this
          res.live = G.shells[res.pos];
        } else res.pos = -1;                                // nothing after this one
      } else if (kind === 'glass') {
        res.live = G.shells[0];
      } else if (kind === 'crowbar') {
        res.live = G.shells.shift();
        if (!G.shells.length) { res.next = 'round'; res.then = G.holder; }
      } else if (kind === 'powder') {
        G.powder = true;
        res.next = 'spin';
      } else if (kind === 'grab') {
        res.from = arg;
        res.took = G.players[arg].items.splice(argItem, 1)[0];
        me.items.push(res.took);
      } else if (kind === 'remote') {
        res.next = 'spin';
      } else if (kind === 'jammer') {
        res.on = arg;
        G.players[arg].jammed = true;
      } else if (kind === 'invert') {
        G.shells[0] = !G.shells[0];
      } else if (kind === 'drink') {
        res.was = me.lives;
        me.lives = Math.min(G.lives, me.lives + 1);
        me.shown = me.lives;
      }
      return res;
    }

    /* The gun is going from `from` to `to`. If `to` is jammed, the jam
       is used up and it goes straight back to `from` (if they are still
       in). Returns who actually gets it. */
    function handOff(from, to) {
      if (to !== from && G.players[to].jammed && from >= 0 && G.players[from].alive) {
        G.players[to].jammed = false;
        return from;
      }
      return to;
    }

    /* ============================================================
       THE SCREENS
       setup -> announce -> spin -> pass -> aim -> shot -> ... -> win
       (and from aim: item -> aim, or on to a spin)
       ============================================================ */
    var ANNOUNCE_T = 3.2;          // the shells shown, then shuffled in
    var SPIN_T     = 2.6;          // the gun spinning
    var SPIN_HOLD  = 1.3;          // and who it landed on
    var SHOT_AIM   = 0.5;          // turning the gun on them
    var KNOCK_BACK = 0.1;          // a live one throws them back - fast
    var KNOCK_HOLD = 0.25;         // a moment there
    var KNOCK_RISE = 1.7;          // and they come back up, slowly
    var BLANK_HOLD = 1.1;          // how long a blank's *click* hangs there
    var OUT_FALL   = 0.9;          // the last one: thrown back, then off the chair
    var OUT_HOLD   = 0.6;          // and lying there a moment before the game goes on

    var S = { phase: 'setup', t: 0, data: {}, hover: -1, hoverSelf: false, shake: 0, flash: 0 };
    var setupN = 2, setupLives = 3, setupNames = [], setupShow = 1;

    function go(phase, data) {
      S.phase = phase;
      S.t = 0;
      S.data = data || {};
      S.pick = null;                     // picking a player for an item
      S.grabFrom = -1;
      /* what your radio or glass told you lasts for your turn, no longer */
      if (phase !== 'aim' && phase !== 'item' && phase !== 'shot') S.note = null;
    }

    function ordinal(n) {
      var s = n % 100 >= 11 && n % 100 <= 13 ? 'TH' :
              n % 10 === 1 ? 'ST' : n % 10 === 2 ? 'ND' : n % 10 === 3 ? 'RD' : 'TH';
      return n + s;
    }

    var ITEM_T = 1.6;                    // an item being used
    var RADIO_T = 2.3;                   // the radio takes its time

    function startGame() {
      setupGame(setupN, setupLives, setupNames);
      G.showItems = !!setupShow;
      newRound();
      go('announce');
    }

    /* the angle round the table of each seat, seen from above: seat 0 at
       the bottom, the rest going round */
    function seatAngle(i) {
      return Math.PI / 2 + i * Math.PI * 2 / G.players.length;
    }

    function startSpin() {
      var target = spinPick();
      var from = S.data.gunAng !== undefined ? S.data.gunAng : -Math.PI / 2;
      var to = seatAngle(target);
      while (to < from) to += Math.PI * 2;
      to += Math.PI * 2 * (4 + rand(2));           // a few good turns first
      go('spin', { target: target, from: from, to: to, gunAng: from, prev: G.holder });
    }

    /* the gun goes to `to` from whoever has it - unless `to` is jammed */
    function passTo(to) {
      var from = G.holder;
      var got = handOff(from, to);
      if (got === from) {
        go('aim');
        if (to !== from) S.note = G.players[to].name + ' WAS JAMMED - IT CAME BACK';
        return;
      }
      G.holder = got;
      go('pass');
    }

    function afterShot(res) {
      if (res.next === 'win') { go('win', { who: winner() }); return; }
      if (res.next === 'round') { newRound(); go('announce', { then: res.then, gunAng: S.data.gunAng }); return; }
      if (res.next === 'spin') { startSpin(); return; }
      passTo(res.next);
    }

    function useAndShow(slot, arg, argItem) {
      var res = useItem(slot, arg, argItem);
      go('item', { res: res });
    }

    function afterItem(res) {
      if (res.next === 'spin') { startSpin(); return; }
      if (res.next === 'round') { newRound(); go('announce', { then: res.then }); return; }
      var note = S.note;
      go('aim');
      S.note = note;
    }

    function update(dt) {
      S.t += dt;
      if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 2.2);
      if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 1.6);
      for (var i = 0; i < G.players.length; i++) {
        var pl = G.players[i];
        if (pl.knockT >= 0) {
          pl.knockT += dt;
          /* up again and done - unless they are out: then it keeps
             counting, for the fall off the chair */
          if (pl.shown > 0 && pl.knockT > KNOCK_BACK + KNOCK_HOLD + KNOCK_RISE) pl.knockT = -1;
          if (pl.shown === 0 && pl.knockT > 10) pl.knockT = 10;
        }
      }

      if (S.phase === 'announce' && S.t >= ANNOUNCE_T) {
        /* whoever was getting the gun when it ran dry keeps it - unless
           it was going to spin anyway */
        var then = S.data.then;
        if (typeof then === 'number' && G.players[then].alive) {
          G.holder = handOff(G.holder, then);    // jammed: it stays where it was
          go('pass');
        } else startSpin();
      } else if (S.phase === 'spin') {
        var k = Math.min(1, S.t / SPIN_T);
        var e = 1 - Math.pow(1 - k, 3);
        S.data.gunAng = S.data.from + (S.data.to - S.data.from) * e;
        /* landed on someone jammed: straight back to whoever spun it */
        if (S.data.bounce === undefined && S.t >= SPIN_T) {
          S.data.got = handOff(S.data.prev, S.data.target);
          S.data.bounce = S.data.got !== S.data.target;
        }
        if (S.t >= SPIN_T + SPIN_HOLD + (S.data.bounce ? 1.0 : 0)) {
          G.holder = S.data.got;
          go('pass');
        }
      } else if (S.phase === 'item') {
        var ir = S.data.res;
        if (S.t >= (ir.kind === 'radio' ? RADIO_T : ITEM_T)) {
          if (ir.kind === 'radio') S.note = ir.pos < 0 ? 'NOTHING AFTER THIS SHELL' :
            'THE ' + ordinal(ir.pos + 1) + ' SHELL IS ' + (ir.live ? 'LIVE' : 'BLANK');
          if (ir.kind === 'glass') S.note = 'THIS SHELL IS ' + (ir.live ? 'LIVE' : 'BLANK');
          if (ir.kind === 'crowbar') S.note = 'THE ONE YOU PRIED OUT WAS ' + (ir.live ? 'LIVE' : 'BLANK');
          if (ir.kind === 'invert') S.note = S.note && S.note.indexOf('THIS SHELL') === 0 ?
            'THIS SHELL IS ' + (G.shells[0] ? 'LIVE' : 'BLANK') : S.note;
          afterItem(ir);
        }
      } else if (S.phase === 'shot') {
        /* aim, fire, the hit plays out - knocked back, slowly up - and
           only then does the heart go; on the last one, over they go */
        var r = S.data.res, tp = G.players[r.target];
        if (!S.data.fired && S.t >= SHOT_AIM) {
          S.data.fired = true;
          if (r.live) {
            tp.knockT = 0;
            tp.shown = tp.lives;           // the heart goes as it hits
            if (r.target === r.shooter) { S.shake = 1; S.flash = 1; }
            else S.flash = 0.35;
          }
        }
        /* a hit: thrown back and slowly up again - or, out, thrown back
           and left there a moment; a blank: just the click */
        var hitEnd = SHOT_AIM + (r.died ? KNOCK_BACK + KNOCK_HOLD + OUT_FALL + OUT_HOLD :
                                 r.live ? KNOCK_BACK + KNOCK_HOLD + KNOCK_RISE : BLANK_HOLD);
        if (S.t >= hitEnd) afterShot(r);
      }
    }

    /* ============================================================
       WHERE EVERYONE SITS, SEEN FROM THE HOLDER'S CHAIR
       The others round the table: straight across, or out to the sides.
       ============================================================ */
    function viewSpot(i) {
      var n = G.players.length;
      var k = (i - G.holder + n) % n;
      var a = k * Math.PI * 2 / n;                  // 0 is you, PI across from you
      var d = (1 - Math.cos(a)) / 2;                // 0 near .. 1 far
      /* round the far side and the ends of the table, sat at its edge */
      return { x: W / 2 + Math.sin(a) * 330, y: 345 - d * d * 110, s: 1.2 - 0.4 * d };
    }

    function targetAt(mx, my) {
      for (var i = 0; i < G.players.length; i++) {
        if (i === G.holder || !G.players[i].alive) continue;
        var v = viewSpot(i);
        var r = 62 * v.s;
        if (Math.abs(mx - v.x) < r && my > v.y - 110 * v.s && my < v.y + 46 * v.s) return i;
      }
      return -1;
    }

    var SELF_BTN = { x: W - 270, y: H - 74, w: 250, h: 54 };
    var WIN_BTNS = [ { x: W / 2 - 230, y: 330, w: 210, h: 56, label: 'PLAY AGAIN' },
                     { x: W / 2 + 20,  y: 330, w: 210, h: 56, label: 'NEW GAME' } ];

    function inRect(mx, my, r) {
      return mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h;
    }

    function shoot(target) {
      var res = fire(target);
      go('shot', { res: res, fired: false });
    }

    /* your items, along the bottom between your lives and the gun */
    function itemSlot(i) { return { x: 236 + i * 76, y: H - 84, w: 64, h: 64 }; }
    /* grabbers: their items, big, to pick from */
    function grabSlot(i, n) { return { x: W / 2 - n * 50 + i * 100 + 10, y: 200, w: 80, h: 80 }; }

    function itemAt(mx, my) {
      var me = G.players[G.holder];
      for (var i = 0; i < me.items.length; i++) if (inRect(mx, my, itemSlot(i))) return i;
      return -1;
    }

    function onClick(mx, my) {
      if (S.phase === 'pass') { go('aim'); return; }
      if (S.phase === 'aim') {
        var me = G.players[G.holder];
        /* grabbers, second step: which of theirs */
        if (S.pick === 'grab' && S.grabFrom >= 0) {
          var their = G.players[S.grabFrom].items;
          for (var g = 0; g < their.length; g++) {
            if (inRect(mx, my, grabSlot(g, their.length))) { useAndShow(S.pickSlot, S.grabFrom, g); return; }
          }
          S.pick = null; S.grabFrom = -1;              // clicked off: never mind
          return;
        }
        var it = itemAt(mx, my);
        if (it !== -1) {
          if (S.pick && S.pickSlot === it) { S.pick = null; return; }   // again: never mind
          var kind = me.items[it];
          if (kind === 'jammer' || kind === 'grab') { S.pick = kind; S.pickSlot = it; return; }
          useAndShow(it);
          return;
        }
        var t = targetAt(mx, my);
        if (S.pick) {                                  // picking a player for the item
          if (t === -1) { S.pick = null; return; }
          if (S.pick === 'jammer') { useAndShow(S.pickSlot, t); return; }
          if (!G.players[t].items.length) { S.note = G.players[t].name + ' HAS NOTHING TO TAKE'; S.pick = null; return; }
          S.grabFrom = t;
          return;
        }
        if (inRect(mx, my, SELF_BTN)) { shoot(G.holder); return; }
        if (t !== -1) shoot(t);
        return;
      }
      if (S.phase === 'win') {
        if (inRect(mx, my, WIN_BTNS[0])) { startGame(); return; }
        if (inRect(mx, my, WIN_BTNS[1])) { go('setup'); setupEl.classList.remove('hidden'); }
      }
    }

    function toCanvas(e) {
      var r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
    }

    canvas.addEventListener('click', function (e) { var c = toCanvas(e); onClick(c.x, c.y); });
    canvas.addEventListener('mousemove', function (e) {
      var c = toCanvas(e);
      var aiming = S.phase === 'aim' && S.grabFrom < 0;
      S.hover = aiming ? targetAt(c.x, c.y) : -1;
      S.hoverSelf = aiming && !S.pick && inRect(c.x, c.y, SELF_BTN);
      S.hoverItem = S.phase === 'aim' ? itemAt(c.x, c.y) : -1;
      S.mouse = c;
    });

    /* ============================================================
       DRAWING
       ============================================================ */
    function rr(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function text(str, x, y, size, color, glow) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + size + 'px sans-serif';
      ctx.fillStyle = color;
      if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
      ctx.fillText(str, x, y);
      ctx.restore();
    }

    function heart(x, y, s, full) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(s, s);
      ctx.fillStyle = full ? '#ff5f7e' : 'rgba(255,95,126,0.18)';
      if (full) { ctx.shadowColor = '#ff5f7e'; ctx.shadowBlur = 8; }
      ctx.beginPath();
      ctx.moveTo(0, 4);
      ctx.bezierCurveTo(-8, -3, -4, -10, 0, -5);
      ctx.bezierCurveTo(4, -10, 8, -3, 0, 4);
      ctx.fill();
      ctx.restore();
    }

    function hearts(pl, x, y, s) {
      var gap = 16 * s;
      var x0 = x - (G.lives - 1) * gap / 2;
      for (var i = 0; i < G.lives; i++) heart(x0 + i * gap, y, s, i < pl.shown);
    }

    /* how far back a hit has thrown them, 0..1: snapped back fast, held
       there a moment, then a slow climb back up */
    function leanOf(pl) {
      if (pl.knockT < 0) return pl.shown > 0 ? 0 : 1;          // out: and they stay down
      if (pl.knockT < KNOCK_BACK) {
        var q = pl.knockT / KNOCK_BACK;
        return 1 - (1 - q) * (1 - q);
      }
      if (pl.shown === 0 || pl.knockT < KNOCK_BACK + KNOCK_HOLD) return 1;
      var k = Math.min(1, (pl.knockT - KNOCK_BACK - KNOCK_HOLD) / KNOCK_RISE);
      return 1 - k * k * (3 - 2 * k);
    }

    /* out: how far off the chair they've gone, 0..1, after the hit has
       thrown them back */
    function fallOf(pl) {
      if (pl.shown > 0) return 0;
      if (pl.knockT < 0) return 1;                         // out from before: lying there
      var k = (pl.knockT - KNOCK_BACK - KNOCK_HOLD) / OUT_FALL;
      return Math.max(0, Math.min(1, k));
    }

    /* A block drawn like the cube on A Platformer Game's icon: a rounded
       block in the player's colour, glowing, with a dark one sunk into
       it - so each block is a thick coloured line round a dark middle. */
    function block(x, y, w, h, color, s) {
      var edge = Math.max(2.5, 5 * s);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 10;
      rr(x, y, w, h, Math.min(6 * s, w / 3));
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#05070f';
      rr(x + edge, y + edge, w - 2 * edge, h - 2 * edge, Math.min(4 * s, w / 4));
      ctx.fill();
    }

    /* A blocky person in their floating chair at the table, facing you,
       made of those blocks, with the cube's white eyes. A hit throws the
       head and body back from the hips - the chair stays where it is -
       and they slowly come back up; on the last one, they stay down. */
    function drawSeated(i, v, highlight) {
      var pl = G.players[i];
      var s = v.s;
      var bob = Math.sin(performanceNow() * 2 + i) * 3 * s;
      var cx = v.x, seat = v.y + bob;
      var lean = leanOf(pl);
      var col = pl.color;
      /* thrown back is away from the table: out to their side for the
         ones at the ends, up and over for the one across from you */
      var outDir = Math.abs(v.x - W / 2) < 40 ? 0 : (v.x > W / 2 ? 1 : -1);
      var face = v.x > W / 2 + 40 ? -1 : 1;      // looking in toward the table

      /* the glow it floats on, and the chair: a high back and the seat */
      ctx.save();
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#c7a0ff';
      ctx.beginPath();
      ctx.ellipse(cx, v.y + 70 * s, 46 * s, 9 * s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#2a2f63';
      ctx.strokeStyle = 'rgba(199,160,255,0.75)';
      ctx.lineWidth = 2.5;
      rr(cx - 46 * s, seat - 158 * s, 92 * s, 154 * s, 10 * s);         // the back
      ctx.fill();
      ctx.stroke();
      rr(cx - 50 * s, seat - 4 * s, 100 * s, 14 * s, 6 * s);            // the seat
      ctx.fill();
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, seat);

      /* out: after the hit has thrown them back, they go off the chair -
         over its side and down onto the floor beside it, and lie there */
      var fall = fallOf(pl);
      if (fall > 0) {
        var fdir = outDir || (i % 2 ? 1 : -1);
        var e = fall * fall * (3 - 2 * fall);
        ctx.translate(fdir * e * 100 * s, -Math.sin(e * Math.PI) * 30 * s + e * 46 * s);
        ctx.rotate(fdir * e * Math.PI / 2);
      }

      /* legs on the seat and down off its front */
      block(-20 * s, -6 * s, 40 * s, 14 * s, col, s);
      block(-19 * s, 6 * s, 16 * s, 36 * s, col, s);
      block(3 * s, 6 * s, 16 * s, 36 * s, col, s);

      /* the top half, from the hips: thrown back by a hit */
      ctx.translate(0, -4 * s);
      if (outDir) ctx.rotate(outDir * lean * 1.05);
      else {                                       // straight across: back and up
        ctx.translate(0, -lean * 22 * s);
        ctx.scale(1 - 0.2 * lean, 1 - 0.2 * lean);
        ctx.rotate(lean * 0.25);
      }
      block(-20 * s, -54 * s, 40 * s, 52 * s, col, s);                  // body
      /* the arms: flung up and out by the hit, coming back down with them */
      var fling = lean * 1.9;
      ctx.save();
      ctx.translate(-26 * s, -50 * s);
      ctx.rotate(fling);
      block(-6 * s, -2 * s, 12 * s, 42 * s, col, s);
      ctx.restore();
      ctx.save();
      ctx.translate(26 * s, -50 * s);
      ctx.rotate(-fling);
      block(-6 * s, -2 * s, 12 * s, 42 * s, col, s);
      ctx.restore();
      var hw = 38 * s, hy = -54 * s - hw - 3 * s;
      block(-hw / 2, hy, hw, hw, col, s);                               // head
      /* the cube's eyes: two white bars, looking your way - shut, out */
      var k = hw / 30;
      ctx.fillStyle = '#ffffff';
      var ecy = hy + hw / 2 - 6 * k;
      var out = pl.shown === 0 && lean >= 0.99;
      var eh = out ? 2 * k : 7 * k, eo = out ? 3 * k : 0;
      ctx.fillRect((face > 0 ? 1 : -6) * k, ecy + eo, 5 * k, eh);
      ctx.fillRect((face > 0 ? -7 : 2) * k, ecy + eo, 5 * k, eh);
      if (pl.knockT >= 0 && pl.knockT < 0.18) {                         // the hit
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.fillRect(-20 * s, -54 * s, 40 * s, 52 * s);
      }
      ctx.restore();

      if (highlight) {
        ctx.save();
        ctx.strokeStyle = '#ff5f7e';
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.arc(cx, seat - 52 * s, 76 * s, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      text(pl.name, cx, seat - 172 * s, Math.round(15 * s), pl.shown > 0 ? col : '#56658c');
      if (pl.shown > 0) {
        hearts(pl, cx, seat - 192 * s, s);
        /* their items, if everyone's are on show - and grabbers always see */
        if (G.showItems || (S.pick === 'grab' && S.grabFrom < 0)) {
          for (var j = 0; j < pl.items.length; j++) {
            drawItemIcon(pl.items[j], cx + (j - (pl.items.length - 1) / 2) * 30 * s, seat - 216 * s, 24 * s);
          }
        }
        if (pl.jammed) text('JAMMED', cx, seat - 240 * s, Math.round(14 * s), '#c7a0ff', 8);
      }
    }

    /* A revolver, seen from above, barrel pointing up (-y), the middle
       of it at 0,0. Proper parts - barrel with a rib and front sight,
       a fluted cylinder, the frame, hammer, trigger guard and a wooden
       grip - but kept simple and clean. */
    var GUN_TIP = -118;                    // where the barrel ends

    function drawRevolver(fired) {
      var steel = '#9aa3b8', dark = '#5c6274', light = '#d4dbea';

      /* the grip, angled back, wood with a darker panel */
      ctx.save();
      ctx.translate(0, 34);
      ctx.rotate(0.18);
      ctx.fillStyle = '#5a3a22';
      rr(-13, 0, 26, 64, 9);
      ctx.fill();
      ctx.fillStyle = '#7a5232';
      rr(-8, 8, 16, 48, 6);
      ctx.fill();
      ctx.strokeStyle = 'rgba(40,22,10,0.6)';
      ctx.lineWidth = 1.2;
      for (var g = 0; g < 4; g++) {                // the checkering
        ctx.beginPath();
        ctx.moveTo(-7, 14 + g * 10);
        ctx.lineTo(7, 20 + g * 10);
        ctx.stroke();
      }
      ctx.restore();

      /* the trigger guard and the trigger */
      ctx.strokeStyle = dark;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(11, 30, 11, -Math.PI / 2, Math.PI / 2);
      ctx.stroke();
      ctx.fillStyle = dark;
      ctx.fillRect(8, 24, 4, 12);

      /* the frame, and the hammer at the back of it */
      ctx.fillStyle = dark;
      rr(-15, -8, 30, 44, 6);
      ctx.fill();
      ctx.fillStyle = '#3a3f4a';
      rr(-5, 32, 10, 12, 3);
      ctx.fill();

      /* the cylinder, with its flutes */
      ctx.fillStyle = steel;
      rr(-19, -40, 38, 36, 9);
      ctx.fill();
      ctx.fillStyle = dark;
      for (var f = -1; f <= 1; f++) rr(f * 11 - 2.5, -36, 5, 28, 2.5);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      rr(-17, -38, 8, 32, 4);
      ctx.fill();

      /* the barrel: the long part, a rib along the top, the front sight */
      ctx.fillStyle = steel;
      rr(-7, GUN_TIP, 14, 80, 4);
      ctx.fill();
      ctx.fillStyle = light;
      ctx.fillRect(-2, GUN_TIP + 4, 4, 72);
      ctx.fillStyle = dark;
      ctx.fillRect(-3, GUN_TIP - 4, 6, 7);
      ctx.fillStyle = '#05070f';                   // the muzzle
      ctx.beginPath();
      ctx.arc(0, GUN_TIP, 3, 0, Math.PI * 2);
      ctx.fill();

      if (fired) {                                 // the muzzle flash
        ctx.fillStyle = '#ffd166';
        ctx.shadowColor = '#ff8c42';
        ctx.shadowBlur = 40;
        ctx.beginPath();
        for (var k = 0; k < 10; k++) {
          var a = k / 10 * Math.PI * 2, rad = k % 2 ? 14 : 38;
          ctx.lineTo(Math.cos(a) * rad, GUN_TIP - 12 + Math.sin(a) * rad);
        }
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    /* the gun in your hand, pointing at `ang` (0 = straight ahead), or
       turned round on yourself */
    function drawGun(ang, self, fired) {
      ctx.save();
      ctx.translate(W / 2, H - 80);
      /* a pool of light under it, so it stands out from the table */
      var lg = ctx.createRadialGradient(0, -40, 10, 0, -40, 190);
      lg.addColorStop(0, 'rgba(160,196,255,0.22)');
      lg.addColorStop(1, 'rgba(160,196,255,0)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.arc(0, -40, 190, 0, Math.PI * 2);
      ctx.fill();
      if (self) {
        ctx.translate(0, -50);
        ctx.scale(1.7, 1.7);                         // coming at you
        ctx.rotate(Math.PI);
      } else {
        ctx.scale(1.35, 1.35);                       // big, and in your hand
        ctx.rotate(ang);
      }
      ctx.shadowColor = 'rgba(220,230,255,0.85)';    // a bright edge all round it
      ctx.shadowBlur = 12;
      drawRevolver(fired);
      ctx.restore();
    }

    /* ---- the items, drawn small and simple, centred on cx,cy ---- */
    function drawItemIcon(kind, cx, cy, size) {
      var k = size / 40;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(k, k);
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (kind === 'radio') {
        ctx.fillStyle = '#4ec3ff';
        rr(-16, -6, 32, 20, 4); ctx.fill();
        ctx.fillStyle = '#05070f';
        ctx.beginPath(); ctx.arc(-6, 4, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(4, -1, 8, 2); ctx.fillRect(4, 4, 8, 2); ctx.fillRect(4, 9, 8, 2);
        ctx.strokeStyle = '#4ec3ff';
        ctx.beginPath(); ctx.moveTo(10, -6); ctx.lineTo(16, -18); ctx.stroke();
      } else if (kind === 'glass') {
        ctx.strokeStyle = '#c9d2e6';
        ctx.beginPath(); ctx.arc(-4, -4, 11, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = 'rgba(160,196,255,0.25)';
        ctx.fill();
        ctx.strokeStyle = '#8a5a30';
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(4, 4); ctx.lineTo(15, 15); ctx.stroke();
      } else if (kind === 'crowbar') {
        ctx.strokeStyle = '#ff5f7e';
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(-12, 16); ctx.lineTo(8, -12); ctx.quadraticCurveTo(12, -18, 17, -13); ctx.stroke();
      } else if (kind === 'powder') {
        ctx.fillStyle = '#8a5a30';
        rr(-12, -10, 24, 26, 6); ctx.fill();
        ctx.fillStyle = '#ffd166';
        ctx.fillRect(-12, -2, 24, 4);
        ctx.fillStyle = '#3a3f4a';
        ctx.beginPath(); ctx.arc(0, -14, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ff8c42';
        for (var g = 0; g < 4; g++) ctx.fillRect(-6 + g * 4, 6 + (g % 2) * 3, 2, 2);
      } else if (kind === 'grab') {
        ctx.strokeStyle = '#7bffb2';
        ctx.beginPath(); ctx.moveTo(0, 18); ctx.lineTo(0, -2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(-10, -10); ctx.lineTo(-8, -18); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(10, -10); ctx.lineTo(8, -18); ctx.stroke();
      } else if (kind === 'remote') {
        ctx.fillStyle = '#3a3f4a';
        rr(-9, -18, 18, 36, 5); ctx.fill();
        ctx.fillStyle = '#ff2d55';
        ctx.beginPath(); ctx.arc(0, -9, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#c9d2e6';
        ctx.fillRect(-5, 0, 4, 4); ctx.fillRect(1, 0, 4, 4); ctx.fillRect(-5, 7, 4, 4); ctx.fillRect(1, 7, 4, 4);
      } else if (kind === 'jammer') {
        ctx.strokeStyle = '#c7a0ff';
        ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-10, 10); ctx.lineTo(10, -10); ctx.stroke();
        ctx.fillStyle = '#c7a0ff';
        ctx.beginPath(); ctx.moveTo(-2, -8); ctx.lineTo(-7, 1); ctx.lineTo(-1, 1); ctx.lineTo(-4, 9);
        ctx.lineTo(3, -2); ctx.lineTo(-3, -2); ctx.closePath(); ctx.fill();
      } else if (kind === 'invert') {
        ctx.strokeStyle = '#ffd166';
        ctx.beginPath(); ctx.arc(0, 0, 12, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(9, -12); ctx.lineTo(12, -4); ctx.lineTo(4, -5); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, 12, Math.PI * 0.1, Math.PI * 0.9); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-9, 12); ctx.lineTo(-12, 4); ctx.lineTo(-4, 5); ctx.stroke();
      } else if (kind === 'drink') {
        ctx.fillStyle = '#7bffb2';
        rr(-9, -16, 18, 32, 4); ctx.fill();
        ctx.fillStyle = '#05070f';
        ctx.fillRect(-9, -6, 18, 10);
        ctx.fillStyle = '#7bffb2';
        ctx.beginPath(); ctx.moveTo(2, -5); ctx.lineTo(-3, 0); ctx.lineTo(1, 0); ctx.lineTo(-2, 4);
        ctx.lineTo(4, -1); ctx.lineTo(0, -1); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#c9d2e6';
        ctx.fillRect(-6, -19, 12, 3);
      }
      ctx.restore();
    }

    /* a tile with an item on it: your tray, the grab popup */
    function itemTile(kind, r, lit) {
      ctx.fillStyle = lit ? '#1d2b5c' : '#0f1530';
      rr(r.x, r.y, r.w, r.h, 10);
      ctx.fill();
      ctx.strokeStyle = lit ? '#ffffff' : '#3a4a78';
      ctx.lineWidth = 2;
      ctx.stroke();
      drawItemIcon(kind, r.x + r.w / 2, r.y + r.h / 2, r.w * 0.62);
    }

    /* hover an item: what it is and what it does */
    function tooltip(kind, x, y) {
      var it = ITEMS[kind];
      ctx.save();
      ctx.font = '13px sans-serif';
      var words = it.desc.split(' '), lines = [], line = '';
      for (var i = 0; i < words.length; i++) {
        var test = line ? line + ' ' + words[i] : words[i];
        if (ctx.measureText(test).width > 230 && line) { lines.push(line); line = words[i]; }
        else line = test;
      }
      lines.push(line);
      var h = 34 + lines.length * 17, w = 254;
      var bx = Math.max(10, Math.min(W - w - 10, x - w / 2)), by = y - h - 10;
      ctx.fillStyle = 'rgba(5,7,15,0.94)';
      rr(bx, by, w, h, 10);
      ctx.fill();
      ctx.strokeStyle = '#4ec3ff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.textAlign = 'left';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillStyle = '#4ec3ff';
      ctx.fillText(it.name, bx + 12, by + 22);
      ctx.font = '13px sans-serif';
      ctx.fillStyle = '#c9d2e6';
      for (i = 0; i < lines.length; i++) ctx.fillText(lines[i], bx + 12, by + 42 + i * 17);
      ctx.restore();
    }

    function drawTable() {
      /* an ordinary table, and you sat at it: its near edge is right
         in front of you, at the bottom of the view */
      var g = ctx.createRadialGradient(W / 2, 400, 40, W / 2, 400, 420);
      g.addColorStop(0, '#2a1638');
      g.addColorStop(1, '#120a20');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(W / 2, 400, 400, 165, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,95,126,0.45)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    function drawRoom() {
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0b0820');
      g.addColorStop(1, '#05070f');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,209,102,0.08)';         // a lamp over the table
      ctx.beginPath();
      ctx.moveTo(W / 2 - 40, 0);
      ctx.lineTo(W / 2 + 40, 0);
      ctx.lineTo(W / 2 + 330, 330);
      ctx.lineTo(W / 2 - 330, 330);
      ctx.closePath();
      ctx.fill();
    }

    /* first person, from the chair of whoever has the gun */
    function drawView() {
      var me = G.players[G.holder];

      /* shot yourself: the view is thrown back from the table, then
         slowly comes back - and on your last life it stays back and
         goes dark */
      var myLean = leanOf(me);
      var myFall = (!me.alive && S.phase === 'shot')
        ? Math.min(1, Math.max(0, S.t - SHOT_AIM - KNOCK_BACK - KNOCK_HOLD) / OUT_FALL) : 0;
      ctx.save();
      /* blasted back from the table: everything goes further off, then
         slowly comes back */
      var back = 1 - 0.3 * myLean;
      ctx.translate(W / 2, H / 2);
      ctx.scale(back, back);
      ctx.translate(-W / 2, -H / 2);
      ctx.translate(0, myLean * 40);

      drawRoom();
      var order = [], i;
      for (i = 0; i < G.players.length; i++) if (i !== G.holder) order.push(i);
      order.sort(function (a, b) { return viewSpot(a).s - viewSpot(b).s; });   // far ones first
      /* everyone sits at the table: it goes over their laps */
      for (i = 0; i < order.length; i++) {
        drawSeated(order[i], viewSpot(order[i]), S.phase === 'aim' && S.hover === order[i]);
      }
      drawTable();

      /* the gun: on whoever you point at, or turned on yourself */
      var ang = 0, self = false, fired = false;
      if (S.phase === 'aim' && S.hover !== -1) ang = aimAt(S.hover);
      if (S.phase === 'aim' && S.hoverSelf) self = true;
      if (S.phase === 'shot') {
        var r = S.data.res;
        self = r.target === r.shooter;
        var k = Math.min(1, S.t / SHOT_AIM);
        ang = self ? 0 : aimAt(r.target) * k;
        fired = r.live && S.t >= SHOT_AIM && S.t < SHOT_AIM + 0.12;
      }
      drawGun(ang, self, fired);
      ctx.restore();
      if (myFall > 0) {                                   // and it all goes dark
        ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, myFall * 1.3) + ')';
        ctx.fillRect(0, 0, W, H);
      }

      /* this round's shells, as they were announced, top left */
      ctx.save();
      ctx.fillStyle = 'rgba(5,7,15,0.7)';
      rr(14, 14, 200, 40, 10);
      ctx.fill();
      ctx.textAlign = 'left';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillStyle = '#ff2d55';
      ctx.fillText(G.live + ' LIVE', 26, 42);
      ctx.fillStyle = '#c9d2e6';
      ctx.fillText(G.blank + ' BLANK', 108, 42);
      ctx.restore();

      /* you: your colour, your name, your lives, your items, and the
         other choice */
      ctx.fillStyle = me.color;
      ctx.fillRect(0, H - 6, W, 6);
      text('YOU: ' + me.name, 120, H - 46, 18, me.color, 10);
      hearts(me, 120, H - 22, 1.3);
      for (var it = 0; it < me.items.length; it++) {
        itemTile(me.items[it], itemSlot(it),
                 S.phase === 'aim' && (S.hoverItem === it || (S.pick && S.pickSlot === it)));
      }
      if (G.powder) {                                     // gunpowder's in
        text('x2', W / 2 + 70, H - 150, 30, '#ff8c42', 16);
      }

      if (S.phase === 'aim') {
        if (!S.pick) {
          ctx.fillStyle = S.hoverSelf ? '#ff5f7e' : '#2a0f1c';
          rr(SELF_BTN.x, SELF_BTN.y, SELF_BTN.w, SELF_BTN.h, 12);
          ctx.fill();
          ctx.strokeStyle = '#ff5f7e';
          ctx.lineWidth = 2;
          ctx.stroke();
          text('SHOOT YOURSELF', SELF_BTN.x + SELF_BTN.w / 2, SELF_BTN.y + 35, 20,
               S.hoverSelf ? '#05070f' : '#ff5f7e');
        }
        /* what to do, top right */
        ctx.save();
        ctx.textAlign = 'right';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillStyle = '#8ea7d6';
        var hint = S.pick === 'jammer' ? 'Click the player to jam' :
                   S.pick === 'grab' ? (S.grabFrom < 0 ? 'Click who to grab from' : 'Click the item to take') :
                   'Shoot a player, or yourself - or use an item';
        ctx.fillText(hint, W - 20, 34);
        ctx.font = '13px sans-serif';
        ctx.fillStyle = '#56658c';
        ctx.fillText(G.shells.length + ' SHELLS LEFT IN THE GUN', W - 20, 54);
        ctx.restore();

        /* grabbers: their items, big, to choose from */
        if (S.pick === 'grab' && S.grabFrom >= 0) {
          var from = G.players[S.grabFrom];
          ctx.fillStyle = 'rgba(5,7,15,0.8)';
          ctx.fillRect(0, 0, W, H);
          text('TAKE ONE OF ' + from.name + "'S", W / 2, 170, 24, from.color, 10);
          for (var g = 0; g < from.items.length; g++) {
            var gs = grabSlot(g, from.items.length);
            itemTile(from.items[g], gs, S.mouse && inRect(S.mouse.x, S.mouse.y, gs));
            text(ITEMS[from.items[g]].name, gs.x + gs.w / 2, gs.y + gs.h + 20, 12, '#8ea7d6');
          }
        }
        if (S.hoverItem >= 0 && S.hoverItem < me.items.length && !(S.pick === 'grab' && S.grabFrom >= 0)) {
          var hs = itemSlot(S.hoverItem);
          tooltip(me.items[S.hoverItem], hs.x + hs.w / 2, hs.y);
        }
      }

      /* what your radio, glass or crowbar told you - for this turn */
      if (S.note && (S.phase === 'aim' || S.phase === 'shot')) {
        text(S.note, W / 2, 30, 20, '#ffd166', 12);
      }

      if (S.phase === 'item') drawItemUse();

      /* what it was */
      if (S.phase === 'shot' && S.t >= SHOT_AIM) {
        var res = S.data.res;
        if (res.live) {
          text(res.dmg > 1 ? 'LIVE!  x2' : 'LIVE!', W / 2, 130, 64, '#ff2d55', 30);
          if (res.died && S.t >= SHOT_AIM + KNOCK_BACK + KNOCK_HOLD) {
            text(G.players[res.target].name + ' IS OUT', W / 2, 172, 22, '#ff8fa3');
          }
        } else {
          text('*click*', W / 2, 130, 58, '#e6ecff', 18);
          text('BLANK', W / 2, 192, 52, '#c9d2e6', 12);
        }
      }
    }

    /* an item being used: what it looks like, over your view */
    function drawItemUse() {
      var r = S.data.res, t = S.t, k = Math.min(1, t / ITEM_T);
      var gx = W / 2, gy = H - 110;                   // the gun's chamber, more or less
      var me = G.players[G.holder];
      var col = function (live) { return live ? '#ff2d55' : '#c9d2e6'; };
      var word = function (live) { return live ? 'LIVE' : 'BLANK'; };
      var i;

      if (r.kind === 'radio') {
        drawItemIcon('radio', W / 2, 200, 110);
        ctx.save();
        ctx.strokeStyle = '#4ec3ff';
        ctx.lineWidth = 3;
        for (i = 0; i < 3; i++) {                       // it crackles
          var rad = 40 + ((t * 90 + i * 30) % 90);
          ctx.globalAlpha = 1 - (rad - 40) / 90;
          ctx.beginPath();
          ctx.arc(W / 2 + 30, 160, rad, -1.2, -0.2);
          ctx.stroke();
        }
        ctx.restore();
        if (r.pos < 0) text('...NOTHING AFTER THIS ONE', W / 2, 300, 30, '#c9d2e6', 10);
        else {
          text('THE ' + ordinal(r.pos + 1) + ' SHELL IS...', W / 2, 300, 30, '#c9d2e6', 10);
          if (t > 1.2) text(word(r.live), W / 2, 356, 52, col(r.live), 20);
        }
      } else if (r.kind === 'glass') {
        /* the glass comes down over the chamber, and you see the shell */
        var lx = gx + 120 * (1 - k), ly = gy - 40 - 60 * (1 - k);
        ctx.fillStyle = col(r.live);
        ctx.beginPath();
        ctx.arc(lx - 6, ly - 6, 22, 0, Math.PI * 2);
        ctx.fill();
        drawItemIcon('glass', lx, ly, 100);
        if (t > 0.7) text('THIS SHELL IS ' + word(r.live), W / 2, 200, 40, col(r.live), 16);
      } else if (r.kind === 'crowbar') {
        /* pried at, and the shell flies out */
        ctx.save();
        ctx.translate(gx + 40, gy);
        ctx.rotate(-0.4 + Math.sin(Math.min(1, t / 0.5) * Math.PI) * 0.5);
        drawItemIcon('crowbar', 0, -30, 90);
        ctx.restore();
        if (t > 0.5) {
          var ft = (t - 0.5) / 1.1;
          var sx = gx + 20 + ft * 300, sy = gy - 20 - ft * 260 + ft * ft * 260;
          ctx.save();
          ctx.translate(sx, sy);
          ctx.rotate(ft * 10);
          ctx.fillStyle = col(r.live);
          rr(-9, -20, 18, 34, 5);
          ctx.fill();
          ctx.fillStyle = '#ffd166';
          rr(-9, 10, 18, 8, 3);
          ctx.fill();
          ctx.restore();
          text('OUT IT COMES: ' + word(r.live), W / 2, 200, 36, col(r.live), 14);
        }
      } else if (r.kind === 'powder') {
        /* poured in, a stream of grains into the gun */
        drawItemIcon('powder', gx + 90, gy - 150 + 20 * Math.sin(t * 3), 80);
        ctx.fillStyle = '#ff8c42';
        for (i = 0; i < 24; i++) {
          var pt = (t * 1.6 + i / 24) % 1;
          ctx.fillRect(gx + 80 - pt * 80 + Math.sin(i * 7) * 4, gy - 120 + pt * 110, 3, 3);
        }
        text('DOUBLE DAMAGE', W / 2, 200, 40, '#ff8c42', 16);
        if (t > 0.9) text('...and the gun spins', W / 2, 240, 18, '#8ea7d6');
      } else if (r.kind === 'grab') {
        /* the claw reaches over and brings it back */
        var v = viewSpot(r.from);
        var back = t < 0.6 ? t / 0.6 : 1 - (t - 0.6) / 1.0;
        var slot = itemSlot(me.items.length - 1);
        var hx = (slot.x + 32) + (v.x - slot.x - 32) * Math.max(0, back);
        var hy = (slot.y + 32) + (v.y - 200 * v.s - slot.y - 32) * Math.max(0, back);
        drawItemIcon('grab', hx, hy - 30, 70);
        if (t > 0.6) drawItemIcon(r.took, hx, hy, 40);
        text('TOOK ' + ITEMS[r.took].name, W / 2, 200, 32, '#7bffb2', 12);
      } else if (r.kind === 'remote') {
        drawItemIcon('remote', W / 2, 220, 110);
        if (Math.sin(t * 30) > 0) {
          ctx.fillStyle = 'rgba(255,45,85,0.35)';
          ctx.beginPath(); ctx.arc(W / 2, 200, 40, 0, Math.PI * 2); ctx.fill();
        }
        text('SPIN IT!', W / 2, 330, 44, '#ff5f7e', 16);
      } else if (r.kind === 'jammer') {
        /* it flies over and sticks to them */
        var jv = viewSpot(r.on);
        var e = Math.min(1, t / 0.8);
        drawItemIcon('jammer', W / 2 + (jv.x - W / 2) * e, H - 140 + (jv.y - 120 * jv.s - H + 140) * e, 70);
        if (t > 0.8) text(G.players[r.on].name + ' IS JAMMED', W / 2, 200, 34, '#c7a0ff', 14);
      } else if (r.kind === 'invert') {
        /* the arrows go round the chamber, and it flips */
        ctx.save();
        ctx.translate(gx, gy - 40);
        ctx.rotate(t * 7);
        drawItemIcon('invert', 0, 0, 130);
        ctx.restore();
        text('THE SHELL IS FLIPPED', W / 2, 200, 36, '#ffd166', 14);
      } else if (r.kind === 'drink') {
        /* up to your mouth, tipped back, and down */
        var up = t < 0.5 ? t / 0.5 : t < 1.2 ? 1 : 1 - (t - 1.2) / 0.4;
        ctx.save();
        ctx.translate(W / 2 + 60, H + 40 - up * 260);
        ctx.rotate(-up * 2.2);
        drawItemIcon('drink', 0, 0, 120);
        ctx.restore();
        if (t > 0.9) text(me.lives > r.was ? '+1 LIFE' : 'ALREADY FULL', W / 2, 200, 40, '#7bffb2', 16);
      }
    }

    function aimAt(i) {
      var v = viewSpot(i);
      return Math.atan2(v.x - W / 2, (H - 80) - (v.y - 45 * v.s));   // their chest
    }

    /* the table from above, with the gun spinning in the middle */
    function drawSpin() {
      drawRoom();
      var cx = W / 2, cy = 236, R = 140;             // up a little: the table in the middle
      ctx.fillStyle = '#1e1030';
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,95,126,0.5)';
      ctx.lineWidth = 3;
      ctx.stroke();
      for (var i = 0; i < G.players.length; i++) {
        var a = seatAngle(i), pl = G.players[i];
        var sx = cx + Math.cos(a) * (R + 56), sy = cy + Math.sin(a) * (R + 56);
        ctx.fillStyle = '#2b3166';
        rr(sx - 34, sy - 34, 68, 68, 10);
        ctx.fill();
        if (pl.alive) {
          ctx.fillStyle = pl.color;
          ctx.shadowColor = pl.color;
          ctx.shadowBlur = 14;
          rr(sx - 22, sy - 22, 44, 44, 7);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#05070f';
          rr(sx - 15, sy - 15, 30, 30, 5);
          ctx.fill();
        }
        text(pl.name, sx, sy + (Math.sin(a) > 0.5 || Math.sin(a) < -0.5 ? 50 : -42), 13, pl.alive ? pl.color : '#56658c');
      }
      /* the gun, lying on the table, spinning */
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(S.data.gunAng + Math.PI / 2);       // its barrel pointing the way it faces
      ctx.scale(0.9, 0.9);
      ctx.translate(0, 10);                          // spun round its own middle
      drawRevolver(false);
      ctx.restore();
      if (S.t >= SPIN_T) {
        var w = G.players[S.data.target];
        text(w.name + ' HAS THE GUN', W / 2, 522, 28, w.color, 18);
      } else {
        text('WHO GETS THE GUN?', W / 2, 522, 24, '#8ea7d6');
      }
    }

    /* the shells for this round, then into the gun */
    function drawAnnounce() {
      drawRoom();
      text('ROUND ' + G.round, W / 2, 110, 28, '#8ea7d6');
      text(G.live + ' LIVE  -  ' + G.blank + ' BLANK', W / 2, 180, 46, '#ffffff', 16);
      var n = G.live + G.blank, gap = 70, x0 = W / 2 - (n - 1) * gap / 2;
      var into = Math.max(0, Math.min(1, (S.t - 2.0) / 1.0));   // flying into the gun
      for (var i = 0; i < n; i++) {
        var live = G.show[i];                  // scrambled - not the order they are in the gun
        /* shuffling - and they keep shuffling all the way into the gun */
        var mix = S.t > 1.3 ? Math.sin(S.t * 30 + i * 2) * 26 : 0;
        var mixY = S.t > 1.3 ? Math.cos(S.t * 23 + i * 3) * 14 : 0;
        var sx = x0 + i * gap, sy = 290;
        sx += (W / 2 - sx) * into;
        sy += (430 - sy) * into;
        sx += mix;
        sy += mixY;
        ctx.save();
        ctx.globalAlpha = 1 - into;
        ctx.translate(sx, sy);
        ctx.fillStyle = live ? '#ff2d55' : '#8a93ad';
        if (live) { ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 16; }
        rr(-16, -38, 32, 64, 8);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffd166';
        rr(-16, 18, 32, 14, 4);                // the brass end
        ctx.fill();
        ctx.restore();
      }
      if (S.t > 1.3) text('SHUFFLING...', W / 2, 400, 20, '#56658c');
    }

    function drawPass() {
      ctx.fillStyle = '#05070f';
      ctx.fillRect(0, 0, W, H);
      var pl = G.players[G.holder];
      text('PASS TO', W / 2, 210, 24, '#8ea7d6');
      text(pl.name, W / 2, 280, 64, pl.color, 26);
      text('click when ready', W / 2, 340, 16, '#56658c');
    }

    function drawWin() {
      drawRoom();
      var pl = G.players[S.data.who];
      text(pl.name + ' WINS', W / 2, 220, 64, pl.color, 28);
      text('the last one sitting', W / 2, 262, 18, '#8ea7d6');
      for (var i = 0; i < WIN_BTNS.length; i++) {
        var b = WIN_BTNS[i];
        ctx.fillStyle = i === 0 ? '#ff5f7e' : '#101830';
        rr(b.x, b.y, b.w, b.h, 12);
        ctx.fill();
        ctx.strokeStyle = '#ff5f7e';
        ctx.lineWidth = 2;
        ctx.stroke();
        text(b.label, b.x + b.w / 2, b.y + 36, 20, i === 0 ? '#05070f' : '#ff5f7e');
      }
    }

    function draw() {
      ctx.save();
      if (S.shake > 0) ctx.translate((Math.random() - 0.5) * 18 * S.shake,
                                     (Math.random() - 0.5) * 18 * S.shake);
      if (S.phase === 'announce') drawAnnounce();
      else if (S.phase === 'spin') drawSpin();
      else if (S.phase === 'pass') drawPass();
      else if (S.phase === 'aim' || S.phase === 'shot' || S.phase === 'item') drawView();
      else if (S.phase === 'win') drawWin();
      else drawRoom();
      ctx.restore();
      if (S.flash > 0) {                               // a live one, red across everything
        ctx.fillStyle = 'rgba(255,45,85,' + (S.flash * 0.45) + ')';
        ctx.fillRect(0, 0, W, H);
      }
    }

    /* ============================================================
       SETUP AND THE LOOP
       ============================================================ */
    var setupEl = document.getElementById('setup');

    function wirePick(id, set) {
      var box = document.getElementById(id);
      if (!box.querySelectorAll) return;
      var btns = box.querySelectorAll('button[data-v]');      // not the settings one
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener('click', function () {
          for (var j = 0; j < btns.length; j++) btns[j].classList.remove('on');
          this.classList.add('on');
          set(+this.getAttribute('data-v'));
        });
      }
    }

    /* the settings screen: every item, with its icon, what it does, and
       a switch */
    var settingsEl = document.getElementById('settings');
    var itemList = document.getElementById('itemList');
    function buildSettings() {
      if (!itemList.appendChild) return;
      for (var i = 0; i < ITEM_KINDS.length; i++) {
        (function (kind) {
          var row = document.createElement('button');
          row.type = 'button';
          row.className = 'itemRow';
          var c = document.createElement('canvas');
          c.width = 40;
          c.height = 40;
          var mainCtx = ctx;                        // draw the icon into its own little canvas
          ctx = c.getContext('2d');
          drawItemIcon(kind, 20, 20, 34);
          ctx = mainCtx;
          var words = document.createElement('div');
          words.innerHTML = '<b>' + ITEMS[kind].name + '</b><small>' + ITEMS[kind].desc + '</small>';
          var sw = document.createElement('span');
          sw.className = 'sw';
          sw.textContent = 'ON';
          row.appendChild(c);
          row.appendChild(words);
          row.appendChild(sw);
          row.addEventListener('click', function () {
            ITEM_ON[kind] = !ITEM_ON[kind];
            sw.textContent = ITEM_ON[kind] ? 'ON' : 'OFF';
            if (ITEM_ON[kind]) row.classList.remove('off');
            else row.classList.add('off');
          });
          itemList.appendChild(row);
        })(ITEM_KINDS[i]);
      }
    }
    buildSettings();
    document.getElementById('settingsBtn').addEventListener('click', function () {
      settingsEl.classList.remove('hidden');
    });
    document.getElementById('settingsDone').addEventListener('click', function () {
      settingsEl.classList.add('hidden');
    });
    /* a name box for each player there is */
    var nameBox = document.getElementById('names');
    var nameInputs = nameBox.querySelectorAll ? nameBox.querySelectorAll('input') : [];
    function showNameBoxes() {
      for (var i = 0; i < nameInputs.length; i++) {
        if (i < setupN) nameInputs[i].classList.remove('off');
        else nameInputs[i].classList.add('off');
      }
    }
    wirePick('pickPlayers', function (v) { setupN = v; showNameBoxes(); });
    wirePick('pickLives', function (v) { setupLives = v; });
    wirePick('pickShow', function (v) { setupShow = v; });
    document.getElementById('startBtn').addEventListener('click', function () {
      setupNames = [];
      for (var i = 0; i < nameInputs.length; i++) setupNames.push(nameInputs[i].value.trim());
      setupEl.classList.add('hidden');
      startGame();
    });

    var clock = 0;
    function performanceNow() { return clock; }

    var last = 0;
    function frame(now) {
      var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
      last = now;
      clock += dt;
      if (S.phase !== 'setup') update(dt);
      draw();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
