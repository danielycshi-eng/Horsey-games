<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskmaster - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body { background: #0b0f24; overflow: hidden; justify-content: flex-start; padding-top: 0; }
    canvas#bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%); }
    .back-link { z-index: 30; }
    .hidden { display: none !important; }

    /* ===== MENU ===== */
    #menu {
      position: relative; z-index: 5;
      display: flex; flex-direction: column; align-items: center;
      width: 100%; max-width: 720px; margin: 0 auto;
      padding: 1.2rem 0; gap: 0.8rem; max-height: 100vh; overflow-y: auto;
      animation: fadeIn 0.9s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    #menu h1 {
      font-size: 2rem; letter-spacing: 3px; margin: 0.2rem 0;
      background: linear-gradient(135deg, #a0ffcf 0%, #4ec38a 35%, #4e7fff 70%, #a0c4ff 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: shimmer 5s ease-in-out infinite; filter: drop-shadow(0 0 18px rgba(78,195,138,0.4));
    }
    @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    .tagline { color: #8ea7d6; font-size: 0.78rem; letter-spacing: 3px; text-transform: uppercase; margin-top: -0.4rem; }

    .menu-stats { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .stat-card { background: rgba(11,15,36,0.55); backdrop-filter: blur(8px);
      border: 1px solid rgba(78,127,255,0.2); border-radius: 14px; padding: 0.5rem 1.1rem; min-width: 120px; text-align: center; }
    .stat-card .label { font-size: 0.66rem; letter-spacing: 2px; text-transform: uppercase; color: #8ea7d6; margin-bottom: 0.2rem; }
    .stat-card .val { font-size: 1.3rem; font-weight: 700; font-family: ui-monospace, Menlo, Consolas, monospace; color: #f5d77a; }
    .stat-card .val.tok { color: #6be2a6; }

    .panel { background: rgba(11,15,36,0.55); backdrop-filter: blur(8px);
      border: 1px solid rgba(78,127,255,0.18); border-radius: 16px; padding: 0.8rem 0.9rem; width: 100%; }
    .panel-title { color: #a0c4ff; font-size: 0.8rem; letter-spacing: 3px; text-transform: uppercase;
      margin-bottom: 0.5rem; border-bottom: 1px solid rgba(78,127,255,0.25); padding-bottom: 0.3rem; font-weight: 700; }

    .tabs { display: flex; gap: 0.4rem; margin-bottom: 0.7rem; }
    .tab { flex: 1; padding: 0.45rem; border-radius: 9px; cursor: pointer; font-family: inherit;
      font-weight: 700; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase;
      background: rgba(22,33,62,0.5); border: 1.5px solid #0f3460; color: #9fb2d6;
      transition: background 0.15s, border-color 0.15s, color 0.15s; }
    .tab.active { border-color: #6be2a6; color: #fff; background: rgba(46,110,80,0.35); }

    .shop-item { display: flex; align-items: center; gap: 0.8rem; padding: 0.5rem 0.6rem; background: rgba(22,33,62,0.5);
      border: 1.5px solid #0f3460; border-radius: 10px; margin-bottom: 0.4rem; }
    .shop-item.affordable { border-color: #22c55e; }
    .shop-item.selected { border-color: #6be2a6; box-shadow: 0 0 10px rgba(107,226,166,0.2); }
    .shop-item .swatch { width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.25); }
    .shop-item .info { flex: 1; min-width: 0; }
    .shop-item .name { font-weight: 700; color: #fff; font-size: 0.92rem; }
    .shop-item .desc { font-size: 0.74rem; color: #98a8c5; font-style: italic; }
    .shop-item .lvl { font-size: 0.7rem; color: #9aa; letter-spacing: 1px; }
    .shop-item button { background: linear-gradient(135deg, #4e7fff, #345edb); color: #fff; border: none;
      padding: 0.45rem 0.85rem; border-radius: 8px; cursor: pointer; font-family: ui-monospace, Menlo, Consolas, monospace;
      font-weight: 700; font-size: 0.82rem; min-width: 84px; transition: transform 0.1s, box-shadow 0.15s; }
    .shop-item button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(78,127,255,0.4); }
    .shop-item button:disabled { opacity: 0.5; cursor: default; }
    .shop-item button.select { background: linear-gradient(135deg, #22c55e, #15803d); }
    .shop-item button.selected { background: #2a3550; }

    .start-btn { padding: 0.75rem 2.8rem; background: linear-gradient(135deg, #22c55e, #15803d);
      color: #fff; border: 2px solid #15803d; border-radius: 14px; font-size: 1.2rem;
      font-weight: 800; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; font-family: inherit;
      box-shadow: 0 8px 24px rgba(34,197,94,0.4); transition: transform 0.15s, box-shadow 0.2s; }
    .start-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(34,197,94,0.55); }

    /* ===== PLAY ===== */
    #play { position: fixed; inset: 0; z-index: 10; }
    #game { display: block; width: 100%; height: 100%; background: #10152b; }

    .hud { position: fixed; z-index: 15; font-family: sans-serif; color: #eaf0ff; }
    #hud-timer { top: 0.8rem; left: 50%; transform: translateX(-50%);
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 2rem; font-weight: 800;
      padding: 0.2rem 1rem; background: rgba(11,15,36,0.7); border-radius: 12px; letter-spacing: 2px;
      border: 1.5px solid rgba(78,127,255,0.3); }
    #hud-timer.urgent { color: #ff6b6b; border-color: #e94560; animation: pulse 0.5s ease-in-out infinite alternate; }
    @keyframes pulse { from { box-shadow: 0 0 0 rgba(233,69,96,0); } to { box-shadow: 0 0 18px rgba(233,69,96,0.7); } }

    #hud-tasks { top: 0.8rem; left: 0.8rem; width: 270px; max-width: 46vw;
      background: rgba(11,15,36,0.82); border: 1.5px solid rgba(78,127,255,0.3); border-radius: 12px; padding: 0.7rem 0.8rem; }
    #hud-tasks h3 { margin: 0 0 0.5rem; font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: #a0c4ff; }
    .task-row { display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.28rem 0; font-size: 0.9rem; }
    .task-row .box { flex-shrink: 0; width: 18px; height: 18px; border-radius: 5px; border: 2px solid #4e7fff; text-align: center; line-height: 15px; font-weight: 800; color: #6be2a6; }
    .task-row.done .box { background: #22c55e; border-color: #22c55e; color: #06210f; }
    .task-row.done .label { text-decoration: line-through; color: #7f8ba3; }
    .task-row .label { flex: 1; }
    .task-row .prog { color: #f5d77a; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.8rem; }

    #hud-top-right { top: 0.8rem; right: 0.8rem; display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; }
    .token-pill { background: rgba(11,15,36,0.75); border: 1.5px solid rgba(107,226,166,0.4); border-radius: 20px; padding: 0.3rem 0.9rem; font-weight: 800; color: #6be2a6; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .end-btn { padding: 0.45rem 1rem; background: linear-gradient(135deg, #e94560, #b73247); color: #fff; border: none;
      border-radius: 10px; cursor: pointer; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-family: inherit; font-size: 0.75rem; }
    #hud-hint { bottom: 0.8rem; left: 50%; transform: translateX(-50%); font-size: 0.75rem; color: #9fb2d6; letter-spacing: 1px; background: rgba(11,15,36,0.6); padding: 0.3rem 0.8rem; border-radius: 8px; }
    #hud-hint kbd { background: rgba(78,127,255,0.2); color: #a0c4ff; padding: 1px 5px; border-radius: 3px; font-family: ui-monospace, Menlo, Consolas, monospace; }

    /* ===== RESULT ===== */
    #result { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
      background: rgba(6,9,22,0.7); backdrop-filter: blur(4px); }
    #result .card { background: rgba(15,22,45,0.97); border: 2px solid rgba(78,127,255,0.4); border-radius: 18px;
      padding: 1.6rem 2rem; text-align: center; max-width: 440px; animation: fadeIn 0.4s both; }
    #result h2 { margin: 0 0 0.4rem; font-size: 1.8rem; letter-spacing: 2px; }
    #result h2.win { color: #6be2a6; }
    #result h2.lose { color: #ff8ba0; }
    #result .tokens { font-size: 2.4rem; font-weight: 800; color: #f5c542; font-family: ui-monospace, Menlo, Consolas, monospace; margin: 0.6rem 0; }
    #result .lines { color: #b9c4dc; font-size: 0.9rem; line-height: 1.5; margin-bottom: 1rem; }
    #result button { padding: 0.7rem 2rem; background: linear-gradient(135deg, #4e7fff, #345edb); color: #fff; border: none;
      border-radius: 12px; cursor: pointer; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; font-family: inherit; font-size: 1rem; }

    #toast { position: fixed; top: 4.5rem; left: 50%; transform: translateX(-50%); padding: 0.55rem 1.2rem;
      background: rgba(11,15,36,0.95); color: #fff; border-radius: 12px; font-weight: 700; z-index: 100;
      pointer-events: none; opacity: 0; transition: opacity 0.3s; border: 2px solid #22c55e; }
    #toast.show { opacity: 1; }
    #toast.fail { border-color: #e94560; }

    .reset-link { position: fixed; bottom: 0.8rem; right: 1.2rem; color: #555; font-size: 0.7rem; cursor: pointer;
      letter-spacing: 2px; text-transform: uppercase; background: none; border: none; font-family: inherit; z-index: 25; }
    .reset-link:hover { color: #aaa; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
  <a href="../games.html" class="back-link">&larr; All Games</a>

  <!-- ===== MENU ===== -->
  <div id="menu">
    <h1>Taskmaster</h1>
    <div class="tagline">complete the list · beat the clock</div>

    <div class="menu-stats">
      <div class="stat-card"><div class="label">TaskTokens</div><div class="val tok" id="menu-tokens">0</div></div>
      <div class="stat-card"><div class="label">Rounds Won</div><div class="val" id="menu-rounds">0</div></div>
      <div class="stat-card"><div class="label">Tasks Done</div><div class="val" id="menu-tasks">0</div></div>
    </div>

    <div class="panel">
      <div class="panel-title">Redeem Shop</div>
      <div class="tabs">
        <button class="tab active" data-tab="power">Power-ups</button>
        <button class="tab" data-tab="cosmetics">Skins</button>
        <button class="tab" data-tab="worlds">Worlds</button>
      </div>
      <div id="shop-list"></div>
    </div>

    <button class="start-btn" id="start-round">Start Round</button>
  </div>

  <!-- ===== PLAY ===== -->
  <div id="play" class="hidden">
    <canvas id="game"></canvas>
    <div class="hud" id="hud-timer">1:00</div>
    <div class="hud" id="hud-tasks"><h3>Tasklist</h3><div id="task-rows"></div></div>
    <div class="hud" id="hud-top-right">
      <div class="token-pill" id="hud-tokens">◈ 0</div>
      <button class="end-btn" id="end-round">Give Up</button>
    </div>
    <div class="hud" id="hud-hint"><kbd>WASD</kbd> move · <kbd>Space</kbd> jump · <kbd>E</kbd> interact</div>
  </div>

  <div id="result" class="hidden"><div class="card">
    <h2 id="result-title">Round Complete!</h2>
    <div class="tokens" id="result-tokens">+0 ◈</div>
    <div class="lines" id="result-lines"></div>
    <button id="result-continue">Continue</button>
  </div></div>

  <div id="toast"></div>
  <button class="reset-link" id="reset" title="Wipe save">reset</button>

  <script>
    // =====================================================================
    // CONSTANTS & STATE
    // =====================================================================
    const STORAGE_KEY = 'horsey:taskmaster:v1';
    const TILE_W = 64, TILE_H = 46;      // flatter diamond => more top-down (but not fully flat)
    const COLS = 16, ROWS = 16;
    const BASE_MOVE = 3.7;               // tiles / sec
    const JUMP_V = 210, GRAVITY = 780;
    const AVATAR_R = 0.34;
    const BASE_TIME = 75;
    const TOKENS_PER_TASK = 3, FINISH_BONUS = 6;

    const SKINS = [
      { id: 'blue',   name: 'Cadet',    cost: 0,  body: '#4e7fff', head: '#ffd9a0' },
      { id: 'red',    name: 'Crimson',  cost: 30, body: '#e94560', head: '#ffd9a0' },
      { id: 'green',  name: 'Clover',   cost: 30, body: '#22c55e', head: '#ffd9a0' },
      { id: 'purple', name: 'Violet',   cost: 60, body: '#9370db', head: '#ffd9a0' },
      { id: 'gold',   name: 'Golden',   cost: 90, body: '#f5c542', head: '#ffe9b0' },
    ];
    const WORLDS = [
      { id: 'meadow', name: 'Meadow',  cost: 0,  tileA: '#3f8f4f', tileB: '#357f45', line: 'rgba(0,0,0,0.13)',   obstacles: ['🌳','🪨'], deco: ['🌷','🌼','🌿','🍄','🌸','☘️'], accent: '#ffd54a' },
      { id: 'sand',   name: 'Dunes',   cost: 40, tileA: '#d9b26b', tileB: '#cfa457', line: 'rgba(90,60,20,0.2)', obstacles: ['🌵','🪨'], deco: ['🌵','🪨','🌾','🦴'],           accent: '#5ec6ff' },
      { id: 'snow',   name: 'Tundra',  cost: 55, tileA: '#dfe8f2', tileB: '#cdd9e8', line: 'rgba(60,80,110,0.18)', obstacles: ['🎄','⛄'], deco: ['❄️','🌲','🪨','🧊'],          accent: '#4e7fff' },
      { id: 'lava',   name: 'Volcano', cost: 75, tileA: '#3a2320', tileB: '#301c1a', line: 'rgba(0,0,0,0.35)',   obstacles: ['🪨','🌋'], deco: ['🔥','🪨','💨'],               accent: '#ff5a2a' },
      { id: 'neon',   name: 'Neon',    cost: 95, tileA: '#171233', tileB: '#120e28', line: 'rgba(120,90,255,0.18)', obstacles: ['🔷','🔶'], deco: ['✨','⭐','🔹','💠'],        accent: '#39e0ff' },
    ];
    const POWERUPS = [
      { id: 'time',  name: 'Extra Time',   desc: '+10s per round',       costs: [20, 40, 70] },
      { id: 'speed', name: 'Sprinter',     desc: '+15% move speed',      costs: [25, 50, 90] },
      { id: 'map',   name: 'Cartographer', desc: 'Edge arrows to tasks', costs: [40] },
    ];

    function defaultState() {
      return {
        tokens: 0, roundsWon: 0, tasksDone: 0,
        skins: { blue: true }, worlds: { meadow: true },
        selectedSkin: 'blue', selectedWorld: 'meadow',
        upgrades: { time: 0, speed: 0, map: 0 },
      };
    }
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const p = JSON.parse(raw), d = defaultState();
          const m = Object.assign(d, p);
          m.skins = Object.assign(d.skins, p.skins || {});
          m.worlds = Object.assign(d.worlds, p.worlds || {});
          m.upgrades = Object.assign({ time: 0, speed: 0, map: 0 }, p.upgrades || {});
          if (!m.skins[m.selectedSkin]) m.selectedSkin = 'blue';
          if (!m.worlds[m.selectedWorld]) m.selectedWorld = 'meadow';
          return m;
        }
      } catch (_) {}
      return defaultState();
    }
    let state = loadState();
    let saveTimer = null;
    function saveStateDebounced() {
      if (saveTimer) return;
      saveTimer = setTimeout(() => { saveTimer = null; try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {} }, 200);
    }

    function theme()      { return WORLDS.find(w => w.id === state.selectedWorld) || WORLDS[0]; }
    function skin()       { return SKINS.find(s => s.id === state.selectedSkin) || SKINS[0]; }
    function moveSpeed()  { return BASE_MOVE * (1 + 0.15 * state.upgrades.speed); }
    function roundTime()  { return BASE_TIME + 10 * state.upgrades.time; }

    function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
    function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    // =====================================================================
    // ISO RENDER HELPERS
    // =====================================================================
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let viewW = 0, viewH = 0, frame = 0;
    const cam = { x: 0, y: 0 };

    function resize() {
      viewW = canvas.clientWidth; viewH = canvas.clientHeight;
      canvas.width = viewW; canvas.height = viewH;
    }
    function toScreen(wx, wy, wz) {
      const rx = (wx - wy) * (TILE_W / 2);
      const ry = (wx + wy) * (TILE_H / 2) - (wz || 0);
      return { x: rx - cam.x + viewW / 2, y: ry - cam.y + viewH / 2 };
    }
    function camTarget() { return { x: (av.wx - av.wy) * (TILE_W / 2), y: (av.wx + av.wy) * (TILE_H / 2) }; }
    function shade(hex, f) {
      const n = parseInt(hex.slice(1), 16);
      let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      r = Math.min(255, Math.round(r * f)); g = Math.min(255, Math.round(g * f)); b = Math.min(255, Math.round(b * f));
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }
    function fillPoly(pts, color, stroke) {
      ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath(); ctx.fillStyle = color; ctx.fill();
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
    }
    function groundQuad(cx, cy, hw, hh, fill, stroke) {
      const A = toScreen(cx - hw, cy - hh, 0), B = toScreen(cx + hw, cy - hh, 0),
            C = toScreen(cx + hw, cy + hh, 0), D = toScreen(cx - hw, cy + hh, 0);
      fillPoly([A, B, C, D], fill, stroke);
    }
    function drawCube(cx, cy, fw, fh, baseZ, height, top, right, left) {
      const hw = fw / 2, hh = fh / 2;
      const B = toScreen(cx + hw, cy - hh, baseZ), C = toScreen(cx + hw, cy + hh, baseZ), D = toScreen(cx - hw, cy + hh, baseZ);
      const At = toScreen(cx - hw, cy - hh, baseZ + height), Bt = toScreen(cx + hw, cy - hh, baseZ + height),
            Ct = toScreen(cx + hw, cy + hh, baseZ + height), Dt = toScreen(cx - hw, cy + hh, baseZ + height);
      fillPoly([Bt, Ct, C, B], right);
      fillPoly([Dt, Ct, C, D], left);
      fillPoly([At, Bt, Ct, Dt], top);
    }
    function drawShadow(cx, cy, r, alpha) {
      const p = toScreen(cx, cy, 0);
      ctx.save(); ctx.translate(p.x, p.y); ctx.scale(1, 0.5);
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,' + alpha + ')'; ctx.fill(); ctx.restore();
    }
    function rr(x, y, w, h, r) {
      ctx.beginPath(); ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }
    function drawSprite(o) {
      if (o.hidden) return;
      const wz = o.floatZ ? (7 + Math.sin(frame * 0.08 + (o.bob || 0)) * 2.5) : 0;
      const p = toScreen(o.wx, o.wy, wz);
      const size = o.size || 24;
      if (!o.deco) drawShadow(o.wx, o.wy, size * 0.26, 0.18);
      ctx.font = size + 'px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(o.emoji, p.x, p.y + size * 0.32);
      if (o.bubble) {
        ctx.font = '15px sans-serif';
        const tw = ctx.measureText(o.bubble).width, bw = tw + 14, bx = p.x - bw / 2, by = p.y - size - 8;
        ctx.fillStyle = 'rgba(255,255,255,0.94)'; rr(bx, by, bw, 22, 7); ctx.fill();
        ctx.fillStyle = '#20263a'; ctx.textBaseline = 'middle'; ctx.fillText(o.bubble, p.x, by + 12);
      }
    }

    // =====================================================================
    // AVATAR
    // =====================================================================
    const av = { wx: COLS / 2, wy: ROWS / 2, wz: 0, vz: 0, bob: 0, moving: false };
    const keys = { w: false, a: false, s: false, d: false };

    function collidesAt(x, y, r) {
      r = r || AVATAR_R;
      if (x < r || y < r || x > COLS - r || y > ROWS - r) return true;
      for (const o of world.solids) {
        const cxp = Math.max(o.wx - o.w / 2, Math.min(x, o.wx + o.w / 2));
        const cyp = Math.max(o.wy - o.h / 2, Math.min(y, o.wy + o.h / 2));
        const dx = x - cxp, dy = y - cyp;
        if (dx * dx + dy * dy < r * r) return true;
      }
      return false;
    }
    function updateAvatar(dt) {
      const sdx = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
      const sdy = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
      av.moving = false;
      if (sdx || sdy) {
        let dwx = sdx / TILE_W + sdy / TILE_H;
        let dwy = sdy / TILE_H - sdx / TILE_W;
        const len = Math.hypot(dwx, dwy); dwx /= len; dwy /= len;
        const sp = moveSpeed() * dt;
        if (!collidesAt(av.wx + dwx * sp, av.wy)) av.wx += dwx * sp;
        if (!collidesAt(av.wx, av.wy + dwy * sp)) av.wy += dwy * sp;
        av.moving = true; av.bob += dt * 10;
      }
      if (av.wz > 0 || av.vz !== 0) {
        av.vz -= GRAVITY * dt; av.wz += av.vz * dt;
        if (av.wz <= 0) { av.wz = 0; av.vz = 0; }
      }
    }
    function jump() { if (av.wz === 0 && av.vz === 0) { av.vz = JUMP_V; playPop(); } }

    function drawAvatar() {
      const bob = av.moving ? Math.sin(av.bob) * 1.5 : 0;
      const s = skin();
      drawShadow(av.wx, av.wy, 13, 0.28 * (1 - Math.min(1, av.wz / 70)));
      drawCube(av.wx, av.wy, 0.46, 0.46, av.wz + bob, 17, s.body, shade(s.body, 0.8), shade(s.body, 0.62));
      drawCube(av.wx, av.wy, 0.38, 0.38, av.wz + bob + 17, 14, s.head, shade(s.head, 0.86), shade(s.head, 0.72));
      // face — billboard, sits on the front of the head
      const hc = toScreen(av.wx, av.wy, av.wz + bob + 17 + 7);
      ctx.fillStyle = '#2a2118';
      ctx.beginPath(); ctx.arc(hc.x - 4.2, hc.y + 1, 1.9, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(hc.x + 4.2, hc.y + 1, 1.9, 0, Math.PI * 2); ctx.fill();
      // eye shine
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(hc.x - 3.5, hc.y + 0.3, 0.7, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(hc.x + 4.9, hc.y + 0.3, 0.7, 0, Math.PI * 2); ctx.fill();
      // rosy cheeks
      ctx.fillStyle = 'rgba(255,120,120,0.5)';
      ctx.beginPath(); ctx.arc(hc.x - 6.5, hc.y + 3, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(hc.x + 6.5, hc.y + 3, 1.6, 0, Math.PI * 2); ctx.fill();
      // smile
      ctx.strokeStyle = '#2a2118'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(hc.x, hc.y + 2.5, 3.4, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    }

    // =====================================================================
    // WORLD + TASKS
    // =====================================================================
    let world = { solids: [], zones: [], sprites: [], sheep: [], tasks: [] };
    const placed = [];

    function near(o, r) { return Math.hypot(av.wx - o.wx, av.wy - o.wy) < r; }
    function addSprite(o) { world.sprites.push(o); return o; }
    function occupied(x, y, pad) {
      pad = pad || 1.1;
      if (Math.hypot(x - COLS / 2, y - ROWS / 2) < 1.8) return true;
      for (const o of world.solids) if (Math.abs(x - o.wx) < o.w / 2 + 0.6 && Math.abs(y - o.wy) < o.h / 2 + 0.6) return true;
      for (const p of placed) if (Math.hypot(x - p.x, y - p.y) < pad) return true;
      return false;
    }
    function freeTile(pad) {
      for (let i = 0; i < 250; i++) {
        const x = 1.5 + Math.random() * (COLS - 3), y = 1.5 + Math.random() * (ROWS - 3);
        if (!occupied(x, y, pad)) { placed.push({ x, y }); return { x, y }; }
      }
      const x = 1.5 + Math.random() * (COLS - 3), y = 1.5 + Math.random() * (ROWS - 3);
      placed.push({ x, y }); return { x, y };
    }

    function genDecorations() {
      const set = theme().deco, n = 28 + randInt(0, 10);
      for (let i = 0; i < n; i++) {
        const x = 0.7 + Math.random() * (COLS - 1.4), y = 0.7 + Math.random() * (ROWS - 1.4);
        addSprite({ wx: x, wy: y, emoji: pick(set), size: 15 + Math.random() * 7, deco: true });
      }
    }
    function genObstacles() {
      const set = theme().obstacles, n = randInt(8, 12);
      for (let i = 0; i < n; i++) {
        const x = 1.5 + Math.random() * (COLS - 3), y = 1.5 + Math.random() * (ROWS - 3);
        if (Math.hypot(x - COLS / 2, y - ROWS / 2) < 2.4) continue;
        addSprite({ wx: x, wy: y, emoji: pick(set), size: 38 });
        world.solids.push({ wx: x, wy: y, w: 0.7, h: 0.7 });
        placed.push({ x, y });
      }
    }

    // ---- Death ----
    function die() {
      if (mode !== 'playing') return;
      const dt = world.tasks.find(t => t.isDie && !t.done);
      if (dt) { dt.done = true; playPoof(); toast('☠️ You died — task complete!'); av.wx = COLS / 2; av.wy = ROWS / 2; av.wz = 0; av.vz = 0; }
      else { playPoof(); finishRound(true); }
    }
    function checkHazards() {
      for (const z of world.zones) {
        if (z.danger && Math.abs(av.wx - z.wx) < z.w / 2 && Math.abs(av.wy - z.wy) < z.h / 2) { die(); return; }
      }
    }
    function updateSheep(dt) {
      for (const s of world.sheep) {
        if (s.penned) continue;
        const dx = s.wx - av.wx, dy = s.wy - av.wy, d = Math.hypot(dx, dy);
        if (d < 2.6 && d > 0.001) { s.vx += (dx / d) * 11 * dt; s.vy += (dy / d) * 11 * dt; }
        s.wanderT -= dt;
        if (s.wanderT <= 0) { s.wanderT = 1 + Math.random() * 2; s.vx += (Math.random() - 0.5) * 1.4; s.vy += (Math.random() - 0.5) * 1.4; }
        const sp = Math.hypot(s.vx, s.vy), max = 2.1;
        if (sp > max) { s.vx = s.vx / sp * max; s.vy = s.vy / sp * max; }
        const px = s.wx, py = s.wy;
        s.wx += s.vx * dt; s.wy += s.vy * dt;
        if (collidesAt(s.wx, py, 0.3)) { s.wx = px; s.vx *= -0.4; }
        if (collidesAt(s.wx, s.wy, 0.3)) { s.wy = py; s.vy *= -0.4; }
        s.wx = clamp(s.wx, 0.6, COLS - 0.6); s.wy = clamp(s.wy, 0.6, ROWS - 0.6);
        const fr = Math.max(0, 1 - 1.6 * dt); s.vx *= fr; s.vy *= fr;
        if (s.pen && Math.abs(s.wx - s.pen.wx) < s.pen.w / 2 && Math.abs(s.wy - s.pen.wy) < s.pen.h / 2) { s.penned = true; s.vx = s.vy = 0; playPing(); }
      }
    }
    function doInteract() { for (const t of world.tasks) if (t.interact) t.interact(); }

    // ---- Task generators (each returns a task object) ----
    function genEat() {
      const need = 3, safe = ['🍗','🍎','🍞','🧀','🍇','🍕','🍔','🍩'], raw = ['🥩','🐟','🍄'];
      const foods = [];
      for (let i = 0; i < need + 2; i++) { const p = freeTile(); foods.push(addSprite({ wx: p.x, wy: p.y, emoji: pick(safe), size: 24, floatZ: true, bob: Math.random() * 6, raw: false, eaten: false })); }
      for (let i = 0; i < 3; i++) { const p = freeTile(); foods.push(addSprite({ wx: p.x, wy: p.y, emoji: pick(raw), size: 24, floatZ: true, bob: Math.random() * 6, raw: true, eaten: false })); }
      return { label: 'Eat 3 cooked foods — raw ones are DEADLY ☠️', done: false, ate: 0, foods, beacon: foods[0],
        update() { for (const f of this.foods) if (!f.eaten && near(f, 0.55)) { f.eaten = true; f.hidden = true; if (f.raw) { die(); return; } this.ate++; playPing(); if (this.ate >= need) this.done = true; } },
        progress() { return this.ate + '/' + need; } };
    }
    function genDie() {
      const p = freeTile(2);
      const zone = { wx: p.x, wy: p.y, w: 1.6, h: 1.6, danger: true, label: '☠️' }; world.zones.push(zone);
      addSprite({ wx: p.x, wy: p.y, emoji: '💀', size: 30, deco: true });
      return { label: 'Perish — find a way to die', isDie: true, done: false, beacon: zone,
        update() {}, progress() { return this.done ? '☠️' : 'alive'; } };
    }
    function genHerd() {
      const n = 3 + randInt(0, 1);
      const pz = freeTile(3); const pen = { wx: pz.x, wy: pz.y, w: 2.4, h: 2.4, label: '🐑 PEN', pen: true }; world.zones.push(pen);
      const sheep = [];
      for (let i = 0; i < n; i++) { const p = freeTile(1.4); const s = addSprite({ wx: p.x, wy: p.y, emoji: '🐑', size: 27, vx: 0, vy: 0, penned: false, wanderT: Math.random() * 2, pen }); world.sheep.push(s); sheep.push(s); }
      return { label: 'Herd all ' + n + ' sheep into the pen', done: false, sheep, beacon: pen,
        update() { this.done = this.sheep.every(s => s.penned); }, progress() { return this.sheep.filter(s => s.penned).length + '/' + n; } };
    }
    function genDave() {
      const corners = [[2, 2], [COLS - 2, 2], [2, ROWS - 2], [COLS - 2, ROWS - 2]], c = pick(corners);
      const dave = addSprite({ wx: c[0], wy: c[1], emoji: '🧑‍🌾', size: 34, bubble: '❓' }); placed.push({ x: c[0], y: c[1] });
      return { label: 'Talk with Dave', done: false, dave, beacon: dave,
        interact() { if (!this.done && near(this.dave, 1.1)) { this.done = true; this.dave.bubble = 'Howdy! 👋'; playPing(); } },
        progress() { return this.done ? '✓' : '…'; } };
    }
    function genCoins() {
      const n = 5 + randInt(0, 2), coins = [];
      for (let i = 0; i < n; i++) { const p = freeTile(); coins.push(addSprite({ wx: p.x, wy: p.y, emoji: '🪙', size: 22, floatZ: true, bob: Math.random() * 6, eaten: false })); }
      return { label: 'Collect all ' + n + ' coins', done: false, got: 0, coins, beacon: coins[0],
        update() { for (const c of this.coins) if (!c.eaten && near(c, 0.5)) { c.eaten = true; c.hidden = true; this.got++; playPing(); } this.done = this.got >= n; },
        progress() { return this.got + '/' + n; } };
    }
    function genWater() {
      const n = 3, fl = [];
      for (let i = 0; i < n; i++) { const p = freeTile(); fl.push(addSprite({ wx: p.x, wy: p.y, emoji: '🥀', size: 24, watered: false })); }
      return { label: 'Water all ' + n + ' wilted flowers', done: false, fl, beacon: fl[0],
        interact() { for (const f of this.fl) if (!f.watered && near(f, 0.85)) { f.watered = true; f.emoji = '🌸'; playPing(); } this.done = this.fl.every(f => f.watered); },
        progress() { return this.fl.filter(f => f.watered).length + '/' + n; } };
    }
    function genCampfire() {
      const n = 3, cf = [];
      for (let i = 0; i < n; i++) { const p = freeTile(); cf.push(addSprite({ wx: p.x, wy: p.y, emoji: '🪵', size: 24, lit: false })); }
      return { label: 'Light all ' + n + ' campfires', done: false, cf, beacon: cf[0],
        interact() { for (const f of this.cf) if (!f.lit && near(f, 0.85)) { f.lit = true; f.emoji = '🔥'; playPing(); } this.done = this.cf.every(f => f.lit); },
        progress() { return this.cf.filter(f => f.lit).length + '/' + n; } };
    }
    function genPetDog() {
      const p = freeTile(); const dog = addSprite({ wx: p.x, wy: p.y, emoji: '🐕', size: 30 });
      return { label: 'Pet the dog', done: false, dog, beacon: dog,
        interact() { if (!this.done && near(this.dog, 0.9)) { this.done = true; this.dog.bubble = '❤️'; playPing(); } },
        progress() { return this.done ? '✓' : '…'; } };
    }
    function genChop() {
      const p = freeTile(1.6); const tree = addSprite({ wx: p.x, wy: p.y, emoji: '🌳', size: 44 });
      const solid = { wx: p.x, wy: p.y, w: 0.7, h: 0.7 }; world.solids.push(solid);
      return { label: 'Chop down the tree (4 hits)', done: false, hits: 0, tree, solid, beacon: tree,
        interact() { if (this.done) return; if (near(this.tree, 1.2)) { this.hits++; playChop(); if (this.hits >= 4) { this.done = true; this.tree.emoji = '🪵'; this.tree.size = 28; const i = world.solids.indexOf(this.solid); if (i >= 0) world.solids.splice(i, 1); } } },
        progress() { return this.hits + '/4'; } };
    }
    function genFlag() {
      const p = freeTile(); const flag = addSprite({ wx: p.x, wy: p.y, emoji: '🚩', size: 32 });
      return { label: 'Reach the flag', done: false, flag, beacon: flag,
        update() { if (!this.done && near(this.flag, 0.6)) { this.done = true; playPing(); } },
        progress() { return this.done ? '✓' : '→'; } };
    }
    function genStomp() {
      const n = 4, ms = [];
      for (let i = 0; i < n; i++) { const p = freeTile(); ms.push(addSprite({ wx: p.x, wy: p.y, emoji: '🍄', size: 24, done: false })); }
      return { label: 'Stomp all ' + n + ' mushrooms', done: false, ms, got: 0, beacon: ms[0],
        update() { for (const m of this.ms) if (!m.done && near(m, 0.5)) { m.done = true; m.hidden = true; this.got++; playPop(); } this.done = this.got >= n; },
        progress() { return this.got + '/' + n; } };
    }

    const POOL = [genEat, genDie, genHerd, genDave, genCoins, genWater, genCampfire, genPetDog, genChop, genFlag, genStomp];
    function generateTasks() {
      const idx = POOL.map((_, i) => i);
      for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
      for (let i = 0; i < 3; i++) world.tasks.push(POOL[idx[i]]());
    }

    // =====================================================================
    // RENDER
    // =====================================================================
    function render() {
      frame++;
      const th = theme();
      ctx.clearRect(0, 0, viewW, viewH);
      // ground
      for (let j = 0; j < ROWS; j++)
        for (let i = 0; i < COLS; i++)
          groundQuad(i + 0.5, j + 0.5, 0.5, 0.5, (i + j) % 2 ? th.tileA : th.tileB, th.line);
      // zones (flat)
      for (const z of world.zones) {
        const fill = z.danger ? 'rgba(233,69,96,0.22)' : 'rgba(255,214,74,0.16)';
        const stroke = z.danger ? 'rgba(255,90,90,0.85)' : 'rgba(255,214,74,0.75)';
        groundQuad(z.wx, z.wy, z.w / 2, z.h / 2, fill, stroke);
        const c = toScreen(z.wx, z.wy, 0);
        ctx.fillStyle = z.danger ? '#ffd0d0' : 'rgba(255,236,180,0.95)';
        ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(z.label, c.x, c.y);
      }
      // depth-sorted sprites + avatar
      const items = [];
      for (const s of world.sprites) if (!s.hidden) items.push({ d: s.wx + s.wy, f: () => drawSprite(s) });
      items.push({ d: av.wx + av.wy, f: drawAvatar });
      items.sort((a, b) => a.d - b.d);
      for (const it of items) it.f();
      // Cartographer arrows
      if (state.upgrades.map > 0) {
        for (const t of world.tasks) if (!t.done && t.beacon) drawEdgeArrow(t.beacon.wx, t.beacon.wy, th.accent);
      }
    }
    function drawEdgeArrow(wx, wy, color) {
      const p = toScreen(wx, wy, 0), m = 60;
      if (p.x > m && p.x < viewW - m && p.y > m && p.y < viewH - m) return;
      const cx = viewW / 2, cy = viewH / 2, dx = p.x - cx, dy = p.y - cy;
      const sc = Math.min((viewW / 2 - m) / Math.abs(dx || 0.001), (viewH / 2 - m) / Math.abs(dy || 0.001));
      const ax = cx + dx * sc, ay = cy + dy * sc, ang = Math.atan2(dy, dx);
      ctx.save(); ctx.translate(ax, ay);
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
      ctx.rotate(ang); ctx.fillStyle = color;
      ctx.beginPath(); ctx.moveTo(11, 0); ctx.lineTo(-6, -7); ctx.lineTo(-2, 0); ctx.lineTo(-6, 7); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // =====================================================================
    // ROUND FLOW
    // =====================================================================
    let mode = 'menu', timeLeft = 0;
    const menuEl = document.getElementById('menu');
    const playEl = document.getElementById('play');
    const resultEl = document.getElementById('result');

    function startRound() {
      world = { solids: [], zones: [], sprites: [], sheep: [], tasks: [] };
      placed.length = 0;
      av.wx = COLS / 2; av.wy = ROWS / 2; av.wz = 0; av.vz = 0; av.bob = 0;
      genDecorations(); genObstacles(); generateTasks();
      timeLeft = roundTime();
      const t = camTarget(); cam.x = t.x; cam.y = t.y;
      mode = 'playing';
      menuEl.classList.add('hidden'); playEl.classList.remove('hidden'); resultEl.classList.add('hidden');
      resize(); renderChecklist(); updateTimerHud(); updateHudTokens();
    }
    function finishRound(died) {
      if (mode !== 'playing') return;
      mode = 'menu';
      const completed = world.tasks.filter(t => t.done).length, total = world.tasks.length;
      const win = !died && completed === total;
      let tok = completed * TOKENS_PER_TASK, timeBonus = 0;
      if (win) { tok += FINISH_BONUS; timeBonus = Math.floor(timeLeft / 5); tok += timeBonus; }
      state.tokens += tok; state.tasksDone += completed; if (win) state.roundsWon++;
      saveStateDebounced();
      const title = document.getElementById('result-title');
      title.textContent = died ? 'You Died! 💀' : (win ? 'Round Complete! 🎉' : "Time's Up! ⏰");
      title.className = win ? 'win' : 'lose';
      document.getElementById('result-tokens').textContent = '+' + tok + ' ◈';
      document.getElementById('result-lines').innerHTML =
        'Tasks completed: <b>' + completed + '/' + total + '</b><br>' +
        (win ? ('Finish bonus +' + FINISH_BONUS + ' &middot; Time bonus +' + timeBonus) : 'Give it another go!');
      resultEl.classList.remove('hidden'); playEl.classList.add('hidden');
      if (win) playWin(); else playErr();
    }
    function giveUp() { mode = 'menu'; playEl.classList.add('hidden'); menuEl.classList.remove('hidden'); renderMenu(); }

    // =====================================================================
    // HUD
    // =====================================================================
    const taskRowsEl = document.getElementById('task-rows');
    const timerEl = document.getElementById('hud-timer');
    const hudTokensEl = document.getElementById('hud-tokens');
    let lastSig = '';
    function renderChecklist() {
      let html = '', sig = '';
      for (const t of world.tasks) {
        const p = t.progress(); sig += (t.done ? '1' : '0') + p + '|';
        html += '<div class="task-row ' + (t.done ? 'done' : '') + '"><div class="box">' + (t.done ? '✓' : '') + '</div>' +
                '<div class="label">' + t.label + '</div><div class="prog">' + p + '</div></div>';
      }
      if (sig !== lastSig) { taskRowsEl.innerHTML = html; lastSig = sig; }
    }
    function updateTimerHud() {
      const s = Math.max(0, Math.ceil(timeLeft));
      timerEl.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
      timerEl.classList.toggle('urgent', timeLeft <= 10);
    }
    function updateHudTokens() { hudTokensEl.textContent = '◈ ' + state.tokens; }

    // =====================================================================
    // MENU + SHOP
    // =====================================================================
    let shopTab = 'power';
    const shopListEl = document.getElementById('shop-list');
    function renderMenu() {
      document.getElementById('menu-tokens').textContent = state.tokens;
      document.getElementById('menu-rounds').textContent = state.roundsWon;
      document.getElementById('menu-tasks').textContent = state.tasksDone;
      renderShop();
    }
    function renderShop() {
      shopListEl.innerHTML = '';
      if (shopTab === 'power') {
        for (const def of POWERUPS) {
          const lvl = state.upgrades[def.id], maxLvl = def.costs.length, maxed = lvl >= maxLvl, cost = maxed ? null : def.costs[lvl];
          const row = document.createElement('div');
          row.className = 'shop-item' + (!maxed && state.tokens >= cost ? ' affordable' : '');
          row.innerHTML = '<div class="info"><div class="name">' + def.name + '</div><div class="desc">' + def.desc +
            '</div><div class="lvl">Level ' + lvl + ' / ' + maxLvl + '</div></div>' +
            (maxed ? '<button disabled>MAX</button>' : '<button data-buy="pow:' + def.id + '">◈ ' + cost + '</button>');
          shopListEl.appendChild(row);
        }
      } else if (shopTab === 'cosmetics') { for (const s of SKINS) buildCosmeticRow(s, 'skin'); }
      else { for (const w of WORLDS) buildCosmeticRow(w, 'world'); }
      shopListEl.querySelectorAll('button[data-buy]').forEach(b => b.addEventListener('click', () => handleBuy(b.dataset.buy)));
    }
    function buildCosmeticRow(item, kind) {
      const ownedMap = kind === 'skin' ? state.skins : state.worlds;
      const sel = kind === 'skin' ? state.selectedSkin : state.selectedWorld;
      const owned = !!ownedMap[item.id], selected = sel === item.id, swatch = kind === 'skin' ? item.body : item.tileA;
      const row = document.createElement('div');
      row.className = 'shop-item' + (selected ? ' selected' : (!owned && state.tokens >= item.cost ? ' affordable' : ''));
      let btn;
      if (!owned) btn = '<button data-buy="' + kind + ':' + item.id + '">◈ ' + item.cost + '</button>';
      else if (selected) btn = '<button class="selected" disabled>Selected</button>';
      else btn = '<button class="select" data-buy="' + kind + ':' + item.id + '">Select</button>';
      row.innerHTML = '<div class="swatch" style="background:' + swatch + '"></div><div class="info"><div class="name">' + item.name +
        '</div><div class="desc">' + (owned ? (selected ? 'Equipped' : 'Owned') : 'Unlock to use') + '</div></div>' + btn;
      shopListEl.appendChild(row);
    }
    function handleBuy(code) {
      const [kind, id] = code.split(':');
      if (kind === 'pow') {
        const def = POWERUPS.find(d => d.id === id), lvl = state.upgrades[id];
        if (lvl >= def.costs.length) return;
        const cost = def.costs[lvl];
        if (state.tokens < cost) { toast('Not enough tokens', true); return; }
        state.tokens -= cost; state.upgrades[id]++; playBuy();
      } else {
        const list = kind === 'skin' ? SKINS : WORLDS, ownedMap = kind === 'skin' ? state.skins : state.worlds, item = list.find(x => x.id === id);
        if (!ownedMap[id]) { if (state.tokens < item.cost) { toast('Not enough tokens', true); return; } state.tokens -= item.cost; ownedMap[id] = true; playBuy(); }
        if (kind === 'skin') state.selectedSkin = id; else state.selectedWorld = id;
      }
      saveStateDebounced(); renderMenu();
    }

    // =====================================================================
    // INPUT
    // =====================================================================
    window.addEventListener('keydown', (e) => {
      if (mode !== 'playing') return;
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = true;
      else if (k === 'a' || k === 'arrowleft') keys.a = true;
      else if (k === 's' || k === 'arrowdown') keys.s = true;
      else if (k === 'd' || k === 'arrowright') keys.d = true;
      else if (k === ' ') { if (!e.repeat) jump(); }
      else if (k === 'e') { if (!e.repeat) doInteract(); }
      if (['w', 'a', 's', 'd', ' ', 'e'].includes(k) || k.startsWith('arrow')) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = false;
      else if (k === 'a' || k === 'arrowleft') keys.a = false;
      else if (k === 's' || k === 'arrowdown') keys.s = false;
      else if (k === 'd' || k === 'arrowright') keys.d = false;
    });
    window.addEventListener('blur', () => { keys.w = keys.a = keys.s = keys.d = false; });
    window.addEventListener('resize', () => { if (mode === 'playing') resize(); });

    document.getElementById('start-round').addEventListener('click', startRound);
    document.getElementById('end-round').addEventListener('click', giveUp);
    document.getElementById('result-continue').addEventListener('click', () => { resultEl.classList.add('hidden'); menuEl.classList.remove('hidden'); renderMenu(); });
    document.getElementById('reset').addEventListener('click', () => {
      if (!confirm('Reset ALL progress (tokens + unlocks)?')) return;
      try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
      state = defaultState(); renderMenu();
    });
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
      shopTab = t.dataset.tab;
      document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
      renderShop();
    }));

    // =====================================================================
    // SOUND + TOAST
    // =====================================================================
    let audioCtx = null;
    function blip(f1, f2, dur, vol, type) {
      try { if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; audioCtx = new AC(); } } catch (_) { return; }
      if (!audioCtx) return; if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'triangle'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + dur + 0.02);
    }
    function playPing() { blip(660, 990, 0.1, 0.14, 'sine'); }
    function playPop()  { blip(300, 520, 0.09, 0.12, 'triangle'); }
    function playChop() { blip(180, 90, 0.1, 0.16, 'square'); }
    function playPoof() { blip(400, 80, 0.28, 0.18, 'sawtooth'); }
    function playErr()  { blip(240, 120, 0.2, 0.16, 'sawtooth'); }
    function playBuy()  { blip(500, 900, 0.12, 0.13, 'sine'); }
    function playWin()  { blip(660, 660, 0.12, 0.16, 'sine'); setTimeout(() => blip(880, 880, 0.12, 0.16, 'sine'), 90); setTimeout(() => blip(1180, 1180, 0.2, 0.15, 'sine'), 190); }

    const toastEl = document.getElementById('toast');
    let toastT = null;
    function toast(msg, fail) {
      toastEl.textContent = msg; toastEl.classList.toggle('fail', !!fail); toastEl.classList.add('show');
      if (toastT) clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 1600);
    }

    // =====================================================================
    // LOOP
    // =====================================================================
    let last = performance.now(), tick = 0;
    function loop() {
      const now = performance.now();
      let dt = (now - last) / 1000; if (dt > 0.05) dt = 0.05; last = now;
      if (mode === 'playing') {
        updateAvatar(dt); updateSheep(dt); checkHazards();
        if (mode === 'playing') for (const t of world.tasks) t.update && t.update(dt);
        if (mode === 'playing') {
          const tg = camTarget();
          cam.x += (tg.x - cam.x) * Math.min(1, 10 * dt);
          cam.y += (tg.y - cam.y) * Math.min(1, 10 * dt);
          render();
          timeLeft -= dt; tick += dt;
          if (tick >= 0.15) { tick = 0; renderChecklist(); updateTimerHud(); }
          if (world.tasks.length && world.tasks.every(t => t.done)) finishRound(false);
          else if (timeLeft <= 0) finishRound(false);
        }
      }
      requestAnimationFrame(loop);
    }

    renderMenu(); resize(); requestAnimationFrame(loop);
  </script>
  <script src="../bg.js"></script>
</body>
