<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Options Limited - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body { justify-content: flex-start; padding-top: 4rem; background: #0b0f24; overflow-x: hidden; }

    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    }
    .back-link { z-index: 2; }
    h1, #menu, #play, #result { position: relative; z-index: 2; }

    h1 {
      font-size: 3rem;
      margin-bottom: 2.2rem;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #a0c4ff 0%, #4e7fff 35%, #c7a0ff 70%, #a0c4ff 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 5s ease-in-out infinite, float 6s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(78, 127, 255, 0.4));
    }
    @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    .hidden { display: none !important; }

    /* --- Menu (difficulty select) --- */
    #menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      margin-top: 0.5rem;
      animation: fadeIn 0.9s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #menu .menu-tagline {
      color: #8ea7d6;
      font-size: 0.95rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-align: center;
    }
    #menu .diff-row {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .diff-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      min-width: 160px;
      padding: 1.4rem 1.8rem;
      background: rgba(11, 15, 36, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 2px solid;
      border-radius: 14px;
      cursor: pointer;
      color: #fff;
      font-family: inherit;
      transition: transform 0.2s, box-shadow 0.25s, background 0.2s;
    }
    .diff-btn:hover { transform: translateY(-5px); }
    .diff-btn .label  { font-size: 1.5rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
    .diff-btn .count  { font-size: 0.85rem; color: #aaa; letter-spacing: 2px; }

    .diff-btn.easy   { border-color: #22c55e; box-shadow: 0 0 14px rgba(34,197,94,0.25); }
    .diff-btn.easy:hover   { background: rgba(34,197,94,0.12); box-shadow: 0 0 28px rgba(34,197,94,0.5), 0 0 60px rgba(34,197,94,0.18); }
    .diff-btn.easy .label   { color: #22c55e; }

    .diff-btn.medium { border-color: #f59e0b; box-shadow: 0 0 14px rgba(245,158,11,0.25); }
    .diff-btn.medium:hover { background: rgba(245,158,11,0.12); box-shadow: 0 0 28px rgba(245,158,11,0.5), 0 0 60px rgba(245,158,11,0.18); }
    .diff-btn.medium .label { color: #f59e0b; }

    .diff-btn.hard   { border-color: #e94560; box-shadow: 0 0 14px rgba(233,69,96,0.25); }
    .diff-btn.hard:hover   { background: rgba(233,69,96,0.12); box-shadow: 0 0 28px rgba(233,69,96,0.5), 0 0 60px rgba(233,69,96,0.18); }
    .diff-btn.hard .label   { color: #e94560; }

    /* --- Play screen --- */
    #timer {
      position: fixed;
      top: 1.2rem;
      right: 1.5rem;
      font-family: monospace;
      font-size: 1.6rem;
      color: #a0c4ff;
      z-index: 30;
    }

    #target-bar {
      font-size: 1.2rem;
      color: #aaa;
      margin-bottom: 1.2rem;
      text-align: center;
    }
    #target-bar strong { color: #fff; font-weight: 600; }

    #options-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      max-width: 1100px;
      width: 92%;
      padding-bottom: 3rem;
    }

    .option {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 6px;
      padding: 0.4rem 0.7rem;
      font-size: 0.95rem;
      color: #ddd;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s, border-color 0.1s;
      font-family: sans-serif;
    }
    .option:hover { background: #0f3460; border-color: #4e7fff; }
    .option.wrong {
      background: #4a1a22;
      border-color: #e94560;
      animation: shake 0.25s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    /* --- Result screen --- */
    #result {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      margin-top: 2rem;
    }
    #result .time { font-size: 3rem; color: #a0c4ff; font-family: monospace; }
    #result .label { color: #aaa; font-size: 1rem; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
  <a href="../games.html" class="back-link">&larr; All Games</a>
  <h1>Options Limited</h1>

  <div id="menu">
    <div class="menu-tagline">find the phrase shown — fast</div>
    <div class="diff-row">
      <button class="diff-btn easy" data-level="easy">
        <span class="label">Easy</span>
        <span class="count"></span>
      </button>
      <button class="diff-btn medium" data-level="medium">
        <span class="label">Medium</span>
        <span class="count"></span>
      </button>
      <button class="diff-btn hard" data-level="hard">
        <span class="label">Hard</span>
        <span class="count"></span>
      </button>
    </div>
  </div>

  <div id="play" class="hidden">
    <div id="timer">0.0s</div>
    <div id="target-bar">Find: <strong id="target-text"></strong></div>
    <div id="options-grid"></div>
  </div>

  <div id="result" class="hidden">
    <div class="label">Found in</div>
    <div class="time" id="result-time">0.0s</div>
    <button class="btn" id="play-again">Play Again</button>
  </div>

  <script>
    // The 6 possible target phrases. One is picked at random each round.
    const POSSIBLE_TARGETS = [
      "I am a robot",
      "I love to eat",
      "Horses are goated",
      "You find that thing now!",
      "Do your homework!",
      "Horse and cat reunite",
    ];

    // TODO: tune counts
    const DIFFICULTY = {
      easy:   { count: 20  },
      medium: { count: 80  },
      hard:   { count: 200 },
    };

    // Given a target phrase, generate visibly-distinguishable "near" decoys:
    // case shifts, punctuation tweaks, single- and two-letter typos, vowel/
    // consonant insertions, word doubling, word concat, reversal, internal
    // caps. All fair — every variant is a transform of THIS target's words,
    // so the grid stays on-topic.
    function generateNearVariants(target) {
      const out = new Set();
      const punctMatch = target.match(/[.!?,;:]+$/);
      const trail = punctMatch ? punctMatch[0] : '';
      const core = trail ? target.slice(0, -trail.length) : target;
      const words = core.split(' ');
      const add = (cv) => out.add(cv + trail);
      const sub = (i, replacement) => {
        const arr = [...words]; arr[i] = replacement;
        add(arr.join(' '));
      };

      // 1. Per-word capitalization
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        for (const c of [
          w.toLowerCase(),
          w.toUpperCase(),
          w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(),
        ]) {
          if (c !== w) sub(i, c);
        }
      }

      // 2. Full-string case
      out.add(target.toLowerCase());
      out.add(target.toUpperCase());
      add(core.toLowerCase());
      add(core.toUpperCase());

      // 3. Punctuation swap
      for (const p of ['.', '!', '?', ',', ';', ':', '...', '!!', '??', '-']) {
        if (p !== trail) out.add(core + p);
      }
      if (trail) out.add(core);

      // 4. Duplicate a single letter
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        for (let j = 0; j < w.length; j++) {
          sub(i, w.slice(0, j) + w[j] + w.slice(j));
        }
      }

      // 5. Drop a letter (word > 3)
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        if (w.length <= 3) continue;
        for (let j = 0; j < w.length; j++) {
          sub(i, w.slice(0, j) + w.slice(j + 1));
        }
      }

      // 6. Swap adjacent letters
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        for (let j = 0; j < w.length - 1; j++) {
          if (w[j] === w[j + 1]) continue;
          sub(i, w.slice(0, j) + w[j + 1] + w[j] + w.slice(j + 2));
        }
      }

      // 7. Reverse word order
      if (words.length >= 2) add([...words].reverse().join(' '));

      // 8. Double a word
      for (let i = 0; i < words.length; i++) {
        const arr = [...words]; arr.splice(i, 0, words[i]);
        add(arr.join(' '));
      }

      // 9. Concat adjacent words
      for (let i = 0; i < words.length - 1; i++) {
        const arr = [...words]; arr.splice(i, 2, words[i] + words[i + 1]);
        add(arr.join(' '));
      }

      // 10. Two-letter dup within a word
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        if (w.length < 3) continue;
        for (let j = 0; j < w.length; j++) {
          for (let k = j + 1; k < w.length; k++) {
            sub(i, w.slice(0, j) + w[j] + w.slice(j, k) + w[k] + w.slice(k));
          }
        }
      }

      // 11. Insert a common letter at each position
      const INSERTS = ['a', 'e', 'i', 'o', 'u', 'n', 's', 't', 'r', 'l'];
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        for (let j = 0; j <= w.length; j++) {
          for (const ch of INSERTS) {
            sub(i, w.slice(0, j) + ch + w.slice(j));
          }
        }
      }

      // 12. Capitalize one internal letter
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        for (let j = 1; j < w.length; j++) {
          if (w[j].toUpperCase() === w[j]) continue;
          sub(i, w.slice(0, j) + w[j].toUpperCase() + w.slice(j + 1));
        }
      }

      out.delete(target);
      return [...out];
    }

    const nearCache = new Map();
    function nearVariants(target) {
      if (!nearCache.has(target)) nearCache.set(target, generateNearVariants(target));
      return nearCache.get(target);
    }

    // Pool for a given target = ONLY its own near-variants. Variants of the
    // other 5 phrases would be off-topic, so they're excluded.
    function buildPool(target) {
      return nearVariants(target);
    }

    const menuEl = document.getElementById('menu');
    const playEl = document.getElementById('play');
    const resultEl = document.getElementById('result');
    const timerEl = document.getElementById('timer');
    const gridEl = document.getElementById('options-grid');
    const targetTextEl = document.getElementById('target-text');
    const resultTimeEl = document.getElementById('result-time');

    let currentTarget = '';
    let startTime = 0;
    let rafId = null;
    let finished = false;

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function pickTarget() {
      return POSSIBLE_TARGETS[Math.floor(Math.random() * POSSIBLE_TARGETS.length)];
    }

    function buildGrid(level) {
      const cfg = DIFFICULTY[level];
      const pool = buildPool(currentTarget);
      shuffle(pool);
      const decoyCount = Math.min(cfg.count - 1, pool.length);
      const items = pool.slice(0, decoyCount);
      items.push(currentTarget);
      shuffle(items);

      gridEl.innerHTML = '';
      for (const text of items) {
        const el = document.createElement('div');
        el.className = 'option';
        el.textContent = text;
        el.addEventListener('click', () => onOptionClick(el, text));
        gridEl.appendChild(el);
      }
    }

    function onOptionClick(el, text) {
      if (finished) return;
      if (text === currentTarget) {
        finish();
      } else {
        // TODO: decide wrong-click penalty (time add? game over? streak break?)
        el.classList.remove('wrong');
        void el.offsetWidth;
        el.classList.add('wrong');
      }
    }

    function tickTimer() {
      const elapsed = (performance.now() - startTime) / 1000;
      timerEl.textContent = elapsed.toFixed(1) + 's';
      rafId = requestAnimationFrame(tickTimer);
    }

    function startGame(level) {
      finished = false;
      currentTarget = pickTarget();
      targetTextEl.textContent = currentTarget;
      menuEl.classList.add('hidden');
      resultEl.classList.add('hidden');
      playEl.classList.remove('hidden');
      buildGrid(level);
      startTime = performance.now();
      timerEl.textContent = '0.0s';
      tickTimer();
    }

    function finish() {
      finished = true;
      cancelAnimationFrame(rafId);
      const elapsed = (performance.now() - startTime) / 1000;
      resultTimeEl.textContent = elapsed.toFixed(2) + 's';
      playEl.classList.add('hidden');
      resultEl.classList.remove('hidden');
      // TODO: decide end condition — single find (current), N rounds, or countdown
      // TODO: scoring / leaderboard?
    }

    function resetToMenu() {
      cancelAnimationFrame(rafId);
      playEl.classList.add('hidden');
      resultEl.classList.add('hidden');
      menuEl.classList.remove('hidden');
    }

    document.querySelectorAll('#menu .diff-btn').forEach(btn => {
      const level = btn.dataset.level;
      btn.querySelector('.count').textContent = DIFFICULTY[level].count + ' options';
      btn.addEventListener('click', () => startGame(level));
    });
    document.getElementById('play-again').addEventListener('click', resetToMenu);
  </script>
  <script src="../bg.js"></script>
</body>
</html>
