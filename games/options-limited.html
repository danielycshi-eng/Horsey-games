<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Options Limited - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body { justify-content: flex-start; padding-top: 4rem; }

    h1 { font-size: 2.5rem; margin-bottom: 0.3rem; letter-spacing: 2px; }
    .subtitle { color: #6b8ecf; font-size: 1rem; margin-bottom: 2rem; letter-spacing: 1px; }

    .hidden { display: none !important; }

    /* --- Menu (difficulty select) --- */
    #menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      margin-top: 1rem;
    }
    #menu .menu-tagline { color: #ddd; font-size: 1.1rem; text-align: center; }
    #menu .diff-row { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    #menu .btn { min-width: 130px; }

    /* --- Play screen --- */
    #timer {
      position: fixed;
      top: 1.2rem;
      right: 1.5rem;
      font-family: monospace;
      font-size: 1.6rem;
      color: #a0c4ff;
      z-index: 30;
    }

    #target-bar {
      font-size: 1.2rem;
      color: #aaa;
      margin-bottom: 1.2rem;
      text-align: center;
    }
    #target-bar strong { color: #fff; font-weight: 600; }

    #options-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      max-width: 1100px;
      width: 92%;
      padding-bottom: 3rem;
    }

    .option {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 6px;
      padding: 0.4rem 0.7rem;
      font-size: 0.95rem;
      color: #ddd;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s, border-color 0.1s;
      font-family: sans-serif;
    }
    .option:hover { background: #0f3460; border-color: #4e7fff; }
    .option.wrong {
      background: #4a1a22;
      border-color: #e94560;
      animation: shake 0.25s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    /* --- Result screen --- */
    #result {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      margin-top: 2rem;
    }
    #result .time { font-size: 3rem; color: #a0c4ff; font-family: monospace; }
    #result .label { color: #aaa; font-size: 1rem; }
  </style>
</head>
<body>
  <a href="../games.html" class="back-link">&larr; All Games</a>
  <h1>Options Limited</h1>
  <p class="subtitle">prove you're not a robot</p>

  <div id="menu">
    <div class="menu-tagline">Find the phrase shown — as fast as you can.</div>
    <div class="diff-row">
      <button class="btn" data-level="easy">Easy</button>
      <button class="btn" data-level="medium">Medium</button>
      <button class="btn" data-level="hard">Hard</button>
    </div>
  </div>

  <div id="play" class="hidden">
    <div id="timer">0.0s</div>
    <div id="target-bar">Find: <strong id="target-text"></strong></div>
    <div id="options-grid"></div>
  </div>

  <div id="result" class="hidden">
    <div class="label">Found in</div>
    <div class="time" id="result-time">0.0s</div>
    <button class="btn" id="play-again">Play Again</button>
  </div>

  <script>
    // The 6 possible target phrases. One is picked at random each round.
    const POSSIBLE_TARGETS = [
      "I am a robot",
      "I love to eat",
      "Horses are goated",
      "You find that thing now!",
      "Do your homework!",
      "Horse and cat reunite",
    ];

    // TODO: tune counts
    const DIFFICULTY = {
      easy:   { count: 20  },
      medium: { count: 80  },
      hard:   { count: 200 },
    };

    // Given a target phrase, generate visibly-distinguishable "near" decoys:
    // case shifts, punctuation tweaks, single- and two-letter typos, vowel/
    // consonant insertions, word doubling, word concat, reversal, internal
    // caps. All fair — every variant is a transform of THIS target's words,
    // so the grid stays on-topic.
    function generateNearVariants(target) {
      const out = new Set();
      const punctMatch = target.match(/[.!?,;:]+$/);
      const trail = punctMatch ? punctMatch[0] : '';
      const core = trail ? target.slice(0, -trail.length) : target;
      const words = core.split(' ');
      const add = (cv) => out.add(cv + trail);
      const sub = (i, replacement) => {
        const arr = [...words]; arr[i] = replacement;
        add(arr.join(' '));
      };

      // 1. Per-word capitalization
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        for (const c of [
          w.toLowerCase(),
          w.toUpperCase(),
          w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(),
        ]) {
          if (c !== w) sub(i, c);
        }
      }

      // 2. Full-string case
      out.add(target.toLowerCase());
      out.add(target.toUpperCase());
      add(core.toLowerCase());
      add(core.toUpperCase());

      // 3. Punctuation swap
      for (const p of ['.', '!', '?', ',', ';', ':', '...', '!!', '??', '-']) {
        if (p !== trail) out.add(core + p);
      }
      if (trail) out.add(core);

      // 4. Duplicate a single letter
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        for (let j = 0; j < w.length; j++) {
          sub(i, w.slice(0, j) + w[j] + w.slice(j));
        }
      }

      // 5. Drop a letter (word > 3)
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        if (w.length <= 3) continue;
        for (let j = 0; j < w.length; j++) {
          sub(i, w.slice(0, j) + w.slice(j + 1));
        }
      }

      // 6. Swap adjacent letters
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        for (let j = 0; j < w.length - 1; j++) {
          if (w[j] === w[j + 1]) continue;
          sub(i, w.slice(0, j) + w[j + 1] + w[j] + w.slice(j + 2));
        }
      }

      // 7. Reverse word order
      if (words.length >= 2) add([...words].reverse().join(' '));

      // 8. Double a word
      for (let i = 0; i < words.length; i++) {
        const arr = [...words]; arr.splice(i, 0, words[i]);
        add(arr.join(' '));
      }

      // 9. Concat adjacent words
      for (let i = 0; i < words.length - 1; i++) {
        const arr = [...words]; arr.splice(i, 2, words[i] + words[i + 1]);
        add(arr.join(' '));
      }

      // 10. Two-letter dup within a word
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        if (w.length < 3) continue;
        for (let j = 0; j < w.length; j++) {
          for (let k = j + 1; k < w.length; k++) {
            sub(i, w.slice(0, j) + w[j] + w.slice(j, k) + w[k] + w.slice(k));
          }
        }
      }

      // 11. Insert a common letter at each position
      const INSERTS = ['a', 'e', 'i', 'o', 'u', 'n', 's', 't', 'r', 'l'];
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        for (let j = 0; j <= w.length; j++) {
          for (const ch of INSERTS) {
            sub(i, w.slice(0, j) + ch + w.slice(j));
          }
        }
      }

      // 12. Capitalize one internal letter
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        for (let j = 1; j < w.length; j++) {
          if (w[j].toUpperCase() === w[j]) continue;
          sub(i, w.slice(0, j) + w[j].toUpperCase() + w.slice(j + 1));
        }
      }

      out.delete(target);
      return [...out];
    }

    const nearCache = new Map();
    function nearVariants(target) {
      if (!nearCache.has(target)) nearCache.set(target, generateNearVariants(target));
      return nearCache.get(target);
    }

    // Pool for a given target = ONLY its own near-variants. Variants of the
    // other 5 phrases would be off-topic, so they're excluded.
    function buildPool(target) {
      return nearVariants(target);
    }

    const menuEl = document.getElementById('menu');
    const playEl = document.getElementById('play');
    const resultEl = document.getElementById('result');
    const timerEl = document.getElementById('timer');
    const gridEl = document.getElementById('options-grid');
    const targetTextEl = document.getElementById('target-text');
    const resultTimeEl = document.getElementById('result-time');

    let currentTarget = '';
    let startTime = 0;
    let rafId = null;
    let finished = false;

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function pickTarget() {
      return POSSIBLE_TARGETS[Math.floor(Math.random() * POSSIBLE_TARGETS.length)];
    }

    function buildGrid(level) {
      const cfg = DIFFICULTY[level];
      const pool = buildPool(currentTarget);
      shuffle(pool);
      const decoyCount = Math.min(cfg.count - 1, pool.length);
      const items = pool.slice(0, decoyCount);
      items.push(currentTarget);
      shuffle(items);

      gridEl.innerHTML = '';
      for (const text of items) {
        const el = document.createElement('div');
        el.className = 'option';
        el.textContent = text;
        el.addEventListener('click', () => onOptionClick(el, text));
        gridEl.appendChild(el);
      }
    }

    function onOptionClick(el, text) {
      if (finished) return;
      if (text === currentTarget) {
        finish();
      } else {
        // TODO: decide wrong-click penalty (time add? game over? streak break?)
        el.classList.remove('wrong');
        void el.offsetWidth;
        el.classList.add('wrong');
      }
    }

    function tickTimer() {
      const elapsed = (performance.now() - startTime) / 1000;
      timerEl.textContent = elapsed.toFixed(1) + 's';
      rafId = requestAnimationFrame(tickTimer);
    }

    function startGame(level) {
      finished = false;
      currentTarget = pickTarget();
      targetTextEl.textContent = currentTarget;
      menuEl.classList.add('hidden');
      resultEl.classList.add('hidden');
      playEl.classList.remove('hidden');
      buildGrid(level);
      startTime = performance.now();
      timerEl.textContent = '0.0s';
      tickTimer();
    }

    function finish() {
      finished = true;
      cancelAnimationFrame(rafId);
      const elapsed = (performance.now() - startTime) / 1000;
      resultTimeEl.textContent = elapsed.toFixed(2) + 's';
      playEl.classList.add('hidden');
      resultEl.classList.remove('hidden');
      // TODO: decide end condition — single find (current), N rounds, or countdown
      // TODO: scoring / leaderboard?
    }

    function resetToMenu() {
      cancelAnimationFrame(rafId);
      playEl.classList.add('hidden');
      resultEl.classList.add('hidden');
      menuEl.classList.remove('hidden');
    }

    document.querySelectorAll('#menu .btn').forEach(btn => {
      btn.addEventListener('click', () => startGame(btn.dataset.level));
    });
    document.getElementById('play-again').addEventListener('click', resetToMenu);
  </script>
</body>
</html>
