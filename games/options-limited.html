<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Options Limited - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body { justify-content: flex-start; padding-top: 4rem; }

    h1 { font-size: 2.5rem; margin-bottom: 0.3rem; letter-spacing: 2px; }
    .subtitle { color: #6b8ecf; font-size: 1rem; margin-bottom: 2rem; letter-spacing: 1px; }

    .hidden { display: none !important; }

    /* --- Menu (difficulty select) --- */
    #menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      margin-top: 1rem;
    }
    #menu .menu-tagline { color: #ddd; font-size: 1.1rem; text-align: center; }
    #menu .menu-tagline strong { color: #fff; }
    #menu .diff-row { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    #menu .btn { min-width: 130px; }

    /* --- Play screen --- */
    #timer {
      position: fixed;
      top: 1.2rem;
      right: 1.5rem;
      font-family: monospace;
      font-size: 1.6rem;
      color: #a0c4ff;
      z-index: 30;
    }

    #target-bar {
      font-size: 1.1rem;
      color: #aaa;
      margin-bottom: 1.2rem;
      text-align: center;
    }
    #target-bar strong { color: #fff; font-weight: 600; }

    #options-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      max-width: 1100px;
      width: 92%;
      padding-bottom: 3rem;
    }

    .option {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 6px;
      padding: 0.4rem 0.7rem;
      font-size: 0.95rem;
      color: #ddd;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s, border-color 0.1s;
      font-family: sans-serif;
      white-space: pre;
    }
    .option:hover { background: #0f3460; border-color: #4e7fff; }
    .option.wrong {
      background: #4a1a22;
      border-color: #e94560;
      animation: shake 0.25s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    /* --- Result screen --- */
    #result {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      margin-top: 2rem;
    }
    #result .time { font-size: 3rem; color: #a0c4ff; font-family: monospace; }
    #result .label { color: #aaa; font-size: 1rem; }
  </style>
</head>
<body>
  <a href="../games.html" class="back-link">&larr; All Games</a>
  <h1>Options Limited</h1>
  <p class="subtitle">prove you're not a robot</p>

  <div id="menu">
    <div class="menu-tagline">Find <strong>I am a robot</strong> — as fast as you can.</div>
    <div class="diff-row">
      <button class="btn" data-level="easy">Easy</button>
      <button class="btn" data-level="medium">Medium</button>
      <button class="btn" data-level="hard">Hard</button>
    </div>
  </div>

  <div id="play" class="hidden">
    <div id="timer">0.0s</div>
    <div id="target-bar">Find: <strong>I am a robot</strong></div>
    <div id="options-grid"></div>
  </div>

  <div id="result" class="hidden">
    <div class="label">Found in</div>
    <div class="time" id="result-time">0.0s</div>
    <button class="btn" id="play-again">Play Again</button>
  </div>

  <script>
    const TARGET = "I am a robot";

    // TODO: tune difficulty counts
    const DIFFICULTY = {
      easy:   { count: 20  },
      medium: { count: 80  },
      hard:   { count: 200 },
    };

    // Visibly distinguishable from target — safe at every level.
    const VISIBLE_DECOYS = [
      "I am a Robot", "i am a robot", "I'm a robot", "I am a robots",
      "I am a bot", "I am the robot", "I am a robot.", "I am a robot!",
      "I am a robot?", "I am a robot,", "I am not a robot", "Am I a robot",
      "I am a droid", "I am a cyborg", "I am a machine", "I am a person",
      "You are a robot", "We are robots", "He is a robot", "She is a robot",
      "They are robots", "I might be a robot", "I used to be a robot",
      "I'm not a robot", "I am no robot", "I am one robot", "I am an robot",
      "I am a Robot.", "I am a Robot!", "i am a Robot", "I AM A ROBOT",
      "I am robot", "robot am I a", "robot a am I", "I am a roboot",
      "I am a roboto", "I am a rebot", "I am a robotic", "I am a robut",
      "I am a robbot", "I am a r0bot", "I am a rob0t", "I am a rob.ot",
      "I was a robot", "I were a robot", "I are a robot", "I be a robot",
      "I think I'm a robot", "I wish I was a robot", "I am a robot too",
      "I am still a robot", "I am also a robot", "Is I a robot",
      "Am I not a robot", "I am a Roboto", "I am a Roboot", "I am a rabbit",
      "I am a rocket", "I am a raccoon", "I am a radish", "I am a router",
      "I am a record", "I am a refund", "I am a region",
    ];

    // Subtle case/punctuation tricks — medium and hard only.
    const SUBTLE_DECOYS = [
      "I am A robot", "I Am a robot", "I am a Robot,", "I am a Robot?",
      "I am a robot:", "I am a robot;", "I am a robot...", "I am a robot-",
      "I'm a Robot", "I'm a robots", "i'm a robot", "I am a-robot",
      "I am  a Robot", "I-am a robot", "I am.a robot", "I am,a robot",
      "I am a r oboto", "I am a robо t", "I am a Robбt",
      "I am aa robot", "I aam a robot", "II am a robot", "I am a rrobot",
      "I am a robott", "I am a robotz", "I am a robotx",
    ];

    // Invisible / homoglyph traps — render almost identical to the target.
    // Hard only. THIS is what makes "looks right but isn't" a thing.
    const TRAP_DECOYS = [
      "I am a robot ",     // trailing space
      " I am a robot",     // leading space
      "I am  a robot",     // double space
      "I  am a robot",     // double space earlier
      "I am a  robot",     // double space later
      "I am a robot.",     // trailing period (same as visible, but feels sneakier here)
      "l am a robot",      // lowercase L instead of capital I
      "1 am a robot",      // digit 1 instead of capital I
      "I am a r0bot",      // zero
      "I am a rob0t",      // zero
      "I аm a robot",      // cyrillic а in "am"
      "I am а robot",      // cyrillic а as the article
      "I am a гobot",      // cyrillic г as r
      "I am a roЬot",      // cyrillic Ь as b
      "I am a rоbot",      // cyrillic о in robot
      "I am a robоt",      // cyrillic о later
      "I am a roboт",      // cyrillic т as t
      "I am a robоt",
      "I am a robot​", // zero-width space appended
      "I am a robot",  // non-breaking space
      "I am a robot",
      "I am a robot",
    ];

    // Combinatorial generator: swap 2 of the 4 words to grow the pool.
    // All substitutions are visibly distinct words, so the produced strings
    // remain fair (no invisible-character tricks come from here).
    const WORD_SUBS = [
      ['I',     'i', 'You', 'We', 'They', 'He', 'She', 'Joe', 'Bob'],
      ['am',    'was', 'were', 'are', "ain't", 'be', 'might be'],
      ['a',     'the', 'an', 'no', 'one', 'some'],
      ['robot', 'Robot', 'bot', 'droid', 'cyborg', 'machine', 'roboot', 'roboto', 'human', 'turtle'],
    ];

    function generateTwoWordSubs() {
      const out = new Set();
      const base = ['I', 'am', 'a', 'robot'];
      for (let p1 = 0; p1 < 4; p1++) {
        for (let p2 = p1 + 1; p2 < 4; p2++) {
          for (const s1 of WORD_SUBS[p1]) {
            for (const s2 of WORD_SUBS[p2]) {
              if (s1 === base[p1] && s2 === base[p2]) continue;
              const w = [...base];
              w[p1] = s1; w[p2] = s2;
              out.add(w.join(' '));
            }
          }
        }
      }
      return [...out];
    }

    function buildPool(level) {
      const set = new Set(VISIBLE_DECOYS);
      if (level !== 'easy') {
        for (const d of SUBTLE_DECOYS) set.add(d);
        for (const d of generateTwoWordSubs()) set.add(d);
      }
      if (level === 'hard') for (const d of TRAP_DECOYS) set.add(d);
      set.delete(TARGET);
      return [...set];
    }

    const menuEl = document.getElementById('menu');
    const playEl = document.getElementById('play');
    const resultEl = document.getElementById('result');
    const timerEl = document.getElementById('timer');
    const gridEl = document.getElementById('options-grid');
    const resultTimeEl = document.getElementById('result-time');

    let startTime = 0;
    let rafId = null;
    let finished = false;

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildGrid(level) {
      const cfg = DIFFICULTY[level];
      const pool = buildPool(level);
      shuffle(pool);
      const decoyCount = Math.min(cfg.count - 1, pool.length);
      const items = pool.slice(0, decoyCount);
      items.push(TARGET);
      shuffle(items);

      gridEl.innerHTML = '';
      for (const text of items) {
        const el = document.createElement('div');
        el.className = 'option';
        el.textContent = text;
        el.addEventListener('click', () => onOptionClick(el, text));
        gridEl.appendChild(el);
      }
    }

    function onOptionClick(el, text) {
      if (finished) return;
      if (text === TARGET) {
        finish();
      } else {
        // TODO: decide wrong-click penalty (time add? game over? streak break?)
        el.classList.remove('wrong');
        void el.offsetWidth;
        el.classList.add('wrong');
      }
    }

    function tickTimer() {
      const elapsed = (performance.now() - startTime) / 1000;
      timerEl.textContent = elapsed.toFixed(1) + 's';
      rafId = requestAnimationFrame(tickTimer);
    }

    function startGame(level) {
      finished = false;
      menuEl.classList.add('hidden');
      resultEl.classList.add('hidden');
      playEl.classList.remove('hidden');
      buildGrid(level);
      startTime = performance.now();
      timerEl.textContent = '0.0s';
      tickTimer();
    }

    function finish() {
      finished = true;
      cancelAnimationFrame(rafId);
      const elapsed = (performance.now() - startTime) / 1000;
      resultTimeEl.textContent = elapsed.toFixed(2) + 's';
      playEl.classList.add('hidden');
      resultEl.classList.remove('hidden');
      // TODO: decide end condition — single find (current), N rounds, or countdown
      // TODO: scoring / leaderboard?
    }

    function resetToMenu() {
      cancelAnimationFrame(rafId);
      playEl.classList.add('hidden');
      resultEl.classList.add('hidden');
      menuEl.classList.remove('hidden');
    }

    document.querySelectorAll('#menu .btn').forEach(btn => {
      btn.addEventListener('click', () => startGame(btn.dataset.level));
    });
    document.getElementById('play-again').addEventListener('click', resetToMenu);
  </script>
</body>
</html>
