<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Hero - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body { overflow: hidden; margin: 0; background: #0a0e27; display: block; }
    canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .back-link { z-index: 30; }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    #overlay.hidden { display: none; }
    .hidden { display: none !important; }

    #overlay h1 {
      font-size: 3.4rem;
      margin-bottom: 0.4rem;
      background: linear-gradient(135deg, #a0c4ff, #4e7fff, #22d3ee, #a0c4ff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s ease-in-out infinite;
      letter-spacing: 2px;
    }

    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    #overlay .sub { color: #6b8ecf; font-size: 1.1rem; margin-bottom: 0.5rem; }
    #overlay .score-display { color: #4ade80; font-size: 1.8rem; font-weight: bold; margin-bottom: 1.5rem; }

    #start-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      margin: 0.4rem 0 1.6rem;
    }
    #start-info.hidden { display: none; }
    .tagline {
      color: #8aa1d3;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
    }
    .lane-keys { display: flex; gap: 8px; }
    .lane-key {
      width: 40px;
      height: 48px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.15rem;
      color: #fff;
      border: 2px solid currentColor;
      background: rgba(255, 255, 255, 0.05);
      text-shadow: 0 0 10px currentColor;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.4), inset 0 0 8px rgba(255, 255, 255, 0.05);
      animation: laneBob 1.8s ease-in-out infinite;
    }
    @keyframes laneBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .lane-key:nth-child(1) { animation-delay: 0s; }
    .lane-key:nth-child(2) { animation-delay: 0.08s; }
    .lane-key:nth-child(3) { animation-delay: 0.16s; }
    .lane-key:nth-child(4) { animation-delay: 0.24s; }
    .lane-key:nth-child(5) { animation-delay: 0.32s; }
    .lane-key:nth-child(6) { animation-delay: 0.40s; }
    .lane-key:nth-child(7) { animation-delay: 0.48s; }
    .lane-key:nth-child(8) { animation-delay: 0.56s; }
    .lane-key:nth-child(9) { animation-delay: 0.64s; }

    .scoring {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.95rem;
      color: #bbb;
    }
    .zone-row { display: flex; align-items: center; gap: 10px; }
    .zone-pill {
      display: inline-block;
      min-width: 92px;
      text-align: center;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    .zone-pill.pp { background: rgba(34, 211, 238, 0.18); color: #22d3ee; border: 1px solid rgba(34, 211, 238, 0.5); }
    .zone-pill.p  { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.5); }
    .zone-pill.g  { background: rgba(250, 204, 21, 0.15); color: #facc15; border: 1px solid rgba(250, 204, 21, 0.5); }

    .prompt-pulse {
      color: #a0c4ff;
      font-size: 1.1rem;
      letter-spacing: 1px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    #invincible-toggle {
      position: fixed;
      bottom: 1rem;
      right: 1.5rem;
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      padding: 0.5rem 0.9rem;
      border-radius: 20px;
      border: 1px solid transparent;
      color: rgba(255, 255, 255, 0.08);
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
    }
    #invincible-toggle .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.2s;
    }
    #invincible-toggle.active {
      background: rgba(255, 215, 0, 0.15);
      border-color: rgba(255, 215, 0, 0.6);
      color: #ffd700;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
    }
    #invincible-toggle.active .dot {
      background: #ffd700;
      box-shadow: 0 0 8px #ffd700;
    }

    #overlay button {
      font-size: 1.2rem;
      padding: 0.8rem 2.5rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      color: #fff;
      background: linear-gradient(135deg, #e94560, #c73652);
      box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
      transition: box-shadow 0.3s, transform 0.15s;
    }

    #overlay button:hover {
      box-shadow: 0 0 35px rgba(233, 69, 96, 0.5);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <a href="../games.html" class="back-link">&larr; All Games</a>
  <div id="invincible-toggle" title="Misses don't count">
    <span class="dot"></span>
    <span>Invincible</span>
  </div>
  <canvas id="game"></canvas>
  <div id="overlay">
    <h1 id="overlay-title">Click Hero</h1>
    <p class="sub hidden" id="overlay-sub"></p>
    <div class="score-display hidden" id="overlay-score"></div>
    <div id="start-info">
      <p class="tagline">Hit the falling notes when they reach the line</p>
      <div class="lane-keys" id="lane-keys"></div>
      <div class="scoring">
        <div class="zone-row"><span class="zone-pill pp">PERFECT+</span><span>+3 — dead center</span></div>
        <div class="zone-row"><span class="zone-pill p">PERFECT</span><span>+2 — close</span></div>
        <div class="zone-row"><span class="zone-pill g">GOOD</span><span>+1 — anywhere in zone</span></div>
      </div>
      <p class="prompt-pulse">Press 1-9 to start</p>
    </div>
    <button class="hidden" id="overlay-btn">Play Again</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySub = document.getElementById('overlay-sub');
    const overlayScore = document.getElementById('overlay-score');
    const overlayBtn = document.getElementById('overlay-btn');

    // --- Audio ---
    let audioCtx;
    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, duration, type, volume) {
      ensureAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.value = volume || 0.3;
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function soundPerfectPlus() {
      playTone(880, 0.15, 'sine', 0.4);
      setTimeout(() => playTone(1320, 0.15, 'sine', 0.35), 60);
      setTimeout(() => playTone(1760, 0.25, 'sine', 0.3), 120);
    }

    function soundPerfect() {
      playTone(880, 0.12, 'sine', 0.3);
      setTimeout(() => playTone(1320, 0.18, 'sine', 0.25), 80);
    }

    function soundGood() {
      playTone(660, 0.15, 'triangle', 0.25);
    }

    function soundMiss() {
      playTone(200, 0.25, 'square', 0.15);
      setTimeout(() => playTone(150, 0.3, 'square', 0.12), 100);
    }

    function soundDrum() {
      playTone(160, 0.10, 'sine', 0.35);
      playTone(80, 0.18, 'sine', 0.25);
    }

    // --- Constants ---
    const LANE_COUNT = 9;
    const LANE_COLORS = [
      '#ef4444', // red
      '#f97316', // orange
      '#eab308', // yellow
      '#84cc16', // lime
      '#22c55e', // green
      '#06b6d4', // cyan
      '#3b82f6', // blue
      '#6366f1', // indigo
      '#a855f7', // violet
    ];
    const MAX_MISSES = 7;
    const NOTE_RADIUS = 18;
    const PERFECT_PLUS = 4;   // half-height of perfect+ zone (dead center)
    const PERFECT_HALF = 22;  // half-height of perfect zone
    const GOOD_HALF = 80;     // half-height of good zone
    const HIT_ZONE_Y_OFFSET = 200; // distance from bottom

    // --- Difficulty ---
    const BASE_SPEED = 6;     // pixels per frame
    const SPEED_STEP = 0.4;   // speed increase per tier
    const POINTS_PER_TIER = 10;

    // --- Multi-note thresholds: [score, maxNotes, chance] ---
    const NOTE_TIERS = [
      [260, 7, 0.003],
      [210, 6, 0.01],
      [160, 5, 0.03],
      [120, 4, 0.06],
      [80,  3, 0.12],
      [40,  2, 0.20],
    ];
    const SIMULTANEOUS_CHANCE = 0.20; // 20% chance notes fall together, otherwise staggered

    // --- State ---
    let score, misses, combo, bestCombo;
    let notes; // array of { lane, y }
    let speed;
    let gameRunning, gameOverFlag;
    let hitZoneY;
    let laneWidth, startX;
    let particles;
    let flashAlpha, flashColor;
    let laneFlash; // per-lane flash for key press feedback
    let invincible = false; // toggled via the corner button

    // --- Resize ---
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      hitZoneY = canvas.height - HIT_ZONE_Y_OFFSET;
      laneWidth = Math.min(80, (canvas.width - 40) / LANE_COUNT);
      startX = (canvas.width - laneWidth * LANE_COUNT) / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Init ---
    function init() {
      score = 0;
      misses = 0;
      combo = 0;
      bestCombo = 0;
      speed = BASE_SPEED;
      notes = [];
      gameRunning = true;
      gameOverFlag = false;
      particles = [];
      flashAlpha = 0;
      flashColor = '';
      laneFlash = new Array(LANE_COUNT).fill(0);
      spawnNotes();
    }

    function spawnNotes() {
      // Determine how many notes to spawn
      let count = 1;
      for (const [threshold, maxN, chance] of NOTE_TIERS) {
        if (score >= threshold && Math.random() < chance) {
          count = 2 + Math.floor(Math.random() * (maxN - 1)); // 2 to maxN
          break;
        }
      }
      // Keep any drums that are still on screen, and avoid spawning into their lanes
      const existingDrums = notes.filter(n => n.type === 'drum');
      const occupied = new Set(existingDrums.map(n => n.lane));
      const available = [];
      for (let i = 0; i < LANE_COUNT; i++) {
        if (!occupied.has(i)) available.push(i);
      }
      for (let i = available.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [available[i], available[j]] = [available[j], available[i]];
      }
      count = Math.min(count, available.length);
      // 20% simultaneous, 80% staggered (spread out vertically)
      const simultaneous = count <= 1 || Math.random() < SIMULTANEOUS_CHANCE;
      notes = [...existingDrums];
      const newStart = notes.length;
      for (let i = 0; i < count; i++) {
        const staggerY = simultaneous ? 0 : i * (NOTE_RADIUS * 4 + 20);
        notes.push({ lane: available[i], y: -NOTE_RADIUS - staggerY, type: 'note' });
      }
      // 5% chance to convert one of the new notes into a white drum (score >= 35)
      if (score >= 35 && count > 0 && Math.random() < 0.05) {
        const drumIdx = newStart + Math.floor(Math.random() * count);
        notes[drumIdx].type = 'drum';
        notes[drumIdx].comboGiven = false;
      }
    }

    function noRegularNotes() {
      for (const n of notes) if (n.type !== 'drum') return false;
      return true;
    }

    function laneX(lane) {
      return startX + lane * laneWidth + laneWidth / 2;
    }

    // --- Particles ---
    function spawnHitParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 1,
          decay: 0.02 + Math.random() * 0.03,
          color,
          radius: 2 + Math.random() * 4,
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // --- Drawing ---
    function drawLanes() {
      for (let i = 0; i < LANE_COUNT; i++) {
        const x = laneX(i);
        // Lane line
        ctx.strokeStyle = `rgba(255, 255, 255, 0.06)`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();

        // Lane flash on key press
        if (laneFlash[i] > 0) {
          ctx.fillStyle = LANE_COLORS[i];
          ctx.globalAlpha = laneFlash[i] * 0.15;
          ctx.fillRect(startX + i * laneWidth, 0, laneWidth, canvas.height);
          ctx.globalAlpha = 1;
          laneFlash[i] = Math.max(0, laneFlash[i] - 0.04);
        }

        // Lane number at bottom
        ctx.fillStyle = `rgba(255, 255, 255, 0.3)`;
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(i + 1, x, canvas.height - 20);
      }
    }

    function drawHitZone() {
      const x = startX;
      const w = laneWidth * LANE_COUNT;

      // Good zone (outer)
      ctx.fillStyle = 'rgba(78, 127, 255, 0.08)';
      ctx.fillRect(x, hitZoneY - GOOD_HALF, w, GOOD_HALF * 2);

      // Perfect zone (inner)
      ctx.fillStyle = 'rgba(78, 127, 255, 0.15)';
      ctx.fillRect(x, hitZoneY - PERFECT_HALF, w, PERFECT_HALF * 2);

      // Perfect+ zone (center)
      ctx.fillStyle = 'rgba(34, 211, 238, 0.12)';
      ctx.fillRect(x, hitZoneY - PERFECT_PLUS, w, PERFECT_PLUS * 2);

      // Glow line at center
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, hitZoneY);
      ctx.lineTo(x + w, hitZoneY);
      ctx.stroke();
    }

    function drawNotes() {
      for (const n of notes) {
        const x = laneX(n.lane);

        if (n.type === 'drum') {
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 22;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(x, n.y, NOTE_RADIUS, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          ctx.strokeStyle = 'rgba(120, 120, 120, 0.7)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(x, n.y, NOTE_RADIUS * 0.7, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(x, n.y, NOTE_RADIUS * 0.4, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = '#222';
          ctx.font = `bold ${NOTE_RADIUS}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(n.lane + 1, x, n.y);
          ctx.textBaseline = 'alphabetic';
          continue;
        }

        const color = LANE_COLORS[n.lane];

        // Glow
        ctx.shadowColor = color;
        ctx.shadowBlur = 20;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, n.y, NOTE_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Inner highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.beginPath();
        ctx.arc(x, n.y, NOTE_RADIUS * 0.5, 0, Math.PI * 2);
        ctx.fill();

        // Lane number on the note
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${NOTE_RADIUS}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(n.lane + 1, x, n.y);
        ctx.textBaseline = 'alphabetic';
      }
    }

    function drawHUD() {
      // Score
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`Score: ${score}`, 20, 40);

      // Combo
      if (combo > 1) {
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText(`Combo x${combo}`, 20, 65);
      }

      // Misses as X marks
      ctx.textAlign = 'right';
      ctx.font = '20px sans-serif';
      for (let i = 0; i < MAX_MISSES; i++) {
        if (invincible) {
          ctx.fillStyle = '#ffd700';
          ctx.shadowColor = '#ffd700';
          ctx.shadowBlur = 8;
        } else {
          ctx.fillStyle = i < misses ? '#ef4444' : 'rgba(255, 255, 255, 0.15)';
        }
        ctx.fillText('✕', canvas.width - 20 - (MAX_MISSES - 1 - i) * 28, 40);
      }
      ctx.shadowBlur = 0;

      // Speed tier indicator
      const tier = Math.floor(score / POINTS_PER_TIER);
      if (tier > 0) {
        ctx.fillStyle = '#f59e0b';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`Speed ${tier + 1}`, canvas.width - 20, 65);
      }
    }

    function drawFlash() {
      if (flashAlpha > 0) {
        ctx.fillStyle = flashColor;
        ctx.globalAlpha = flashAlpha;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1;
        flashAlpha = Math.max(0, flashAlpha - 0.03);
      }
    }

    // Floating text
    let floatingTexts = [];

    function addFloatingText(text, x, y, color) {
      floatingTexts.push({ text, x, y, color, life: 1 });
    }

    function drawFloatingTexts() {
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const t = floatingTexts[i];
        ctx.globalAlpha = t.life;
        ctx.fillStyle = t.color;
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(t.text, t.x, t.y);
        t.y -= 1.5;
        t.life -= 0.02;
        if (t.life <= 0) floatingTexts.splice(i, 1);
      }
      ctx.globalAlpha = 1;
    }

    // --- Hit logic ---
    function tryHit(lane) {
      if (!gameRunning || gameOverFlag) return;

      laneFlash[lane] = 1;

      // Prefer a regular note over a drum if both are in this lane
      let idx = notes.findIndex(n => n.lane === lane && n.type !== 'drum');
      if (idx === -1) {
        // Fall back to a drum in this lane
        const drumIdx = notes.findIndex(n => n.lane === lane && n.type === 'drum');
        if (drumIdx !== -1) {
          const d = notes[drumIdx];
          score += 1;
          if (!d.comboGiven) {
            combo++;
            if (combo > bestCombo) bestCombo = combo;
            d.comboGiven = true;
          }
          const x = laneX(lane);
          spawnHitParticles(x, d.y, '#ffffff', 8);
          soundDrum();
          updateSpeed();
        }
        return;
      }

      const n = notes[idx];
      const dist = Math.abs(n.y - hitZoneY);
      const x = laneX(lane);
      const color = LANE_COLORS[lane];

      if (dist <= PERFECT_PLUS) {
        score += 3;
        combo++;
        if (combo > bestCombo) bestCombo = combo;
        spawnHitParticles(x, hitZoneY, color, 30);
        spawnHitParticles(x, hitZoneY, '#fff', 15);
        addFloatingText('PERFECT+ +3', x, hitZoneY - 40, '#22d3ee');
        flashAlpha = 0.12;
        flashColor = color;
        soundPerfectPlus();
        notes.splice(idx, 1);
        updateSpeed();
        if (noRegularNotes()) spawnNotes();
      } else if (dist <= PERFECT_HALF) {
        score += 2;
        combo++;
        if (combo > bestCombo) bestCombo = combo;
        spawnHitParticles(x, hitZoneY, color, 20);
        spawnHitParticles(x, hitZoneY, '#fff', 8);
        addFloatingText('PERFECT +2', x, hitZoneY - 40, '#4ade80');
        flashAlpha = 0.08;
        flashColor = color;
        soundPerfect();
        notes.splice(idx, 1);
        updateSpeed();
        if (noRegularNotes()) spawnNotes();
      } else if (dist <= GOOD_HALF) {
        score += 1;
        combo++;
        if (combo > bestCombo) bestCombo = combo;
        spawnHitParticles(x, hitZoneY, color, 10);
        addFloatingText('GOOD +1', x, hitZoneY - 40, '#facc15');
        soundGood();
        notes.splice(idx, 1);
        updateSpeed();
        if (noRegularNotes()) spawnNotes();
      } else {
        if (invincible) return;
        addFloatingText('TOO EARLY', x, n.y, '#ef4444');
        soundMiss();
        onMissNote(idx);
      }
    }

    function onMissNote(idx) {
      misses++;
      combo = 0;
      flashAlpha = 0.15;
      flashColor = '#ef4444';
      if (idx !== null && notes[idx]) {
        addFloatingText('MISS', laneX(notes[idx].lane), hitZoneY - 40, '#ef4444');
        notes.splice(idx, 1);
      }
      if (misses >= MAX_MISSES) {
        gameOver();
      } else if (noRegularNotes()) {
        spawnNotes();
      }
    }

    function updateSpeed() {
      const tier = Math.floor(score / POINTS_PER_TIER);
      speed = BASE_SPEED + tier * SPEED_STEP;
    }

    function gameOver() {
      gameOverFlag = true;
      gameRunning = false;
      overlayTitle.textContent = 'Game Over';
      overlaySub.textContent = `Best combo: x${bestCombo}`;
      overlaySub.classList.remove('hidden');
      overlayScore.textContent = `Score: ${score}`;
      overlayScore.classList.remove('hidden');
      overlayBtn.classList.remove('hidden');
      overlayBtn.textContent = 'Play Again';
      document.getElementById('start-info').classList.add('hidden');
      overlay.classList.remove('hidden');
    }

    // Invincible toggle
    const invincibleToggle = document.getElementById('invincible-toggle');
    invincibleToggle.addEventListener('click', () => {
      invincible = !invincible;
      invincibleToggle.classList.toggle('active', invincible);
    });

    // Populate the lane-key preview boxes with their lane colors
    (function buildLaneKeys() {
      const container = document.getElementById('lane-keys');
      for (let i = 0; i < LANE_COUNT; i++) {
        const el = document.createElement('div');
        el.className = 'lane-key';
        el.style.color = LANE_COLORS[i];
        el.textContent = i + 1;
        container.appendChild(el);
      }
    })();

    // --- Update ---
    function update() {
      if (!gameRunning || notes.length === 0) return;

      for (const n of notes) {
        n.y += speed;
      }

      // Check for notes that fell past good zone
      for (let i = notes.length - 1; i >= 0; i--) {
        if (notes[i].y > hitZoneY + GOOD_HALF + NOTE_RADIUS) {
          if (notes[i].type === 'drum') {
            // Drums silently disappear off-screen — no miss penalty
            notes.splice(i, 1);
            continue;
          }
          if (invincible) {
            // Invincible mode: silently remove, no penalty, no sound
            notes.splice(i, 1);
            continue;
          }
          addFloatingText('MISS', laneX(notes[i].lane), hitZoneY - 40, '#ef4444');
          soundMiss();
          notes.splice(i, 1);
          misses++;
          combo = 0;
          flashAlpha = 0.15;
          flashColor = '#ef4444';
          if (misses >= MAX_MISSES) { gameOver(); return; }
        }
      }

      if (noRegularNotes()) spawnNotes();
    }

    // --- Game loop ---
    let started = false;

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (started) {
        drawLanes();
        drawHitZone();

        if (gameRunning) update();

        drawNotes();
        drawParticles();
        updateParticles();
        drawFloatingTexts();
        drawFlash();
        drawHUD();
      }

      requestAnimationFrame(loop);
    }

    // --- Input ---
    function getKeyLane(e) {
      // Try e.key first, then e.code (Digit1-Digit9)
      const k = parseInt(e.key);
      if (k >= 1 && k <= 9) return k;
      const m = e.code && e.code.match(/^Digit(\d)$/);
      if (m) { const d = parseInt(m[1]); if (d >= 1 && d <= 9) return d; }
      return 0;
    }

    window.addEventListener('keydown', e => {
      if (e.repeat) return;
      const key = getKeyLane(e);
      if (key >= 1 && key <= 9) {
        if (!started || (!gameRunning && !gameOverFlag)) {
          overlay.classList.add('hidden');
          started = true;
          init();
          return;
        }
        laneFlash[key - 1] = 1;
        tryHit(key - 1);
      }
    });

    // Click/tap on overlay to start too
    overlay.addEventListener('click', e => {
      if (e.target === overlayBtn) return; // let button handler deal with it
      if (!started || (!gameRunning && !gameOverFlag)) {
        overlay.classList.add('hidden');
        started = true;
        init();
      }
    });

    overlayBtn.addEventListener('click', () => {
      overlay.classList.add('hidden');
      started = true;
      init();
    });

    // --- Start ---
    loop();
  </script>
</body>
</html>
