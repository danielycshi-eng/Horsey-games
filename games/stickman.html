<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stickman - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../gate.js" data-gate="stickman"></script>
  <style>
    body { overflow: hidden; margin: 0; background: #0a0e27; display: block; }
    canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .back-link { z-index: 30; }

    #menu {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center;
      padding-top: 13vh;
      background: radial-gradient(ellipse at 50% 70%, rgba(10,14,39,0.15), rgba(10,14,39,0.8));
      transition: opacity 0.6s;
    }
    #menu.gone { opacity: 0; pointer-events: none; }
    #menu h1 {
      font-size: clamp(3rem, 10vw, 6.5rem);
      letter-spacing: 0.3em; padding-left: 0.3em;
      margin: 0 0 0.45em;
      color: #fff; font-weight: 800;
      text-shadow: 0 0 18px #4ee1ff, 0 0 42px rgba(78,225,255,0.55);
    }
    #play {
      font-family: inherit; font-weight: 700;
      font-size: clamp(1.6rem, 4vw, 2.5rem);
      letter-spacing: 0.25em; padding: 0.6em 2.4em 0.6em 2.65em;
      border-radius: 999px; border: 3px solid #4ee1ff;
      background: rgba(14,22,52,0.88); color: #fff; cursor: pointer;
      box-shadow: 0 0 24px rgba(78,225,255,0.4), inset 0 0 18px rgba(78,225,255,0.2);
      animation: pulse 1.8s ease-in-out infinite;
      transition: background 0.15s, color 0.15s;
    }
    #play:hover { background: #4ee1ff; color: #0a0e27; }
    @keyframes pulse {
      50% { box-shadow: 0 0 44px rgba(78,225,255,0.7), inset 0 0 18px rgba(78,225,255,0.35); transform: scale(1.04); }
    }

    #hint {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      z-index: 10; color: #a0c4ff; font-size: 0.95rem; text-align: center;
      opacity: 0; transition: opacity 0.8s; pointer-events: none; width: 92%;
    }
    #hint.show { opacity: 0.85; }

    #menu-sub { color: #a0c4ff; margin: 1.2em 0 0.4em; min-height: 1.2em; }
    #restart {
      font-family: inherit; font-size: 0.95rem; color: #a0c4ff;
      background: none; border: none; text-decoration: underline; cursor: pointer;
    }
    #restart:hover { color: #fff; }
    #admin-toggle {
      margin-top: 1.4em; padding: 0.4rem 1rem; font-family: inherit; font-size: 0.9rem;
      background: rgba(14,22,52,0.7); border: 1.5px solid rgba(160,196,255,0.35);
      color: #a0c4ff; border-radius: 8px; cursor: pointer;
    }
    #admin-toggle.on { border-color: #ff5a5a; color: #ff9a9a; box-shadow: 0 0 10px rgba(255,90,90,0.25); }

    #lvl {
      position: fixed; top: 14px; right: 18px; z-index: 10;
      color: #a0c4ff; font-size: 1rem; letter-spacing: 0.1em;
      opacity: 0; transition: opacity 0.4s; pointer-events: none;
    }
    #lvl.show { opacity: 0.9; }

    #banner {
      position: fixed; top: 22%; left: 50%; transform: translate(-50%, -50%);
      z-index: 12; text-align: center; pointer-events: none;
      color: #fff; font-size: clamp(2.4rem, 7vw, 4rem); font-weight: 800;
      letter-spacing: 0.25em; text-shadow: 0 0 18px #ff8a1f;
      opacity: 0; transition: opacity 0.5s;
    }
    #banner.show { opacity: 1; }

    #win {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 25;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(10,14,39,0.75); text-align: center;
      opacity: 0; pointer-events: none; transition: opacity 0.6s;
    }
    #win.show { opacity: 1; pointer-events: auto; }
    #win h2 {
      font-size: clamp(2rem, 7vw, 4rem); margin: 0; letter-spacing: 0.15em;
      color: #fff; text-shadow: 0 0 20px #ff8a1f;
    }
    #win p { color: #a0c4ff; margin: 0.8em 0 1.6em; }
    #again {
      font-family: inherit; font-weight: 700; font-size: 1.4rem;
      letter-spacing: 0.2em; padding: 0.55em 2em;
      border-radius: 999px; border: 3px solid #ff8a1f;
      background: rgba(14,22,52,0.88); color: #fff; cursor: pointer;
    }
    #again:hover { background: #ff8a1f; color: #0a0e27; }

  </style>
</head>
<body>
  <a href="../games.html" class="back-link">&larr; All Games</a>
  <canvas id="game"></canvas>

  <div id="menu">
    <h1>STICKMAN</h1>
    <button id="play" type="button">PLAY</button>
    <p id="menu-sub"></p>
    <button id="restart" type="button">start over from level 1</button>
    <button id="admin-toggle" type="button">🔧 Admin (test): OFF</button>
  </div>

  <div id="lvl"></div>
  <div id="banner"></div>

  <div id="win">
    <h2>YOU BEAT STICKMAN</h2>
    <p>you beat the red stickman and took his key. more coming soon</p>
    <button id="again" type="button">PLAY AGAIN</button>
  </div>

  <div id="hint">A / D or &larr; &rarr; move &nbsp;&middot;&nbsp; W / &uarr; / Space jump &nbsp;&middot;&nbsp; again in the air: double jump &nbsp;&middot;&nbsp; a third time: dash</div>


  <script>
  (function () {
    'use strict';

    var canvas  = document.getElementById('game');
    var ctx     = canvas.getContext('2d');
    var menu    = document.getElementById('menu');
    var playBtn = document.getElementById('play');
    var hint    = document.getElementById('hint');
    var banner  = document.getElementById('banner');
    var levelTag = document.getElementById('lvl');
    var winBox  = document.getElementById('win');
    var againBtn = document.getElementById('again');
    var menuSub = document.getElementById('menu-sub');
    var restartBtn = document.getElementById('restart');
    var bannerT = 0;
    var HINT_HTML = hint.innerHTML;
    var adminBtn = document.getElementById('admin-toggle');
    var adminMode = false;   // test mode: L skips to the next level

    /* ---------------- world ---------------- */
    var VIEW_H = 760, WORLD_W = 2400, PIT = 745;
    var G = 2300, RUN = 340, ACC_G = 2800, ACC_A = 1700, FRIC = 3200;
    var FLIP_T = 0.25;
    var JUMP = 860, DASH = 1150, DASH_T = 0.16, DASH_CD = 0.55;
    var PW = 22, PH = 98, TOOTH = 34;
    var LEN = { thigh: 23, shin: 23, upper: 17, fore: 17, torso: 30, head: 11 };
    var LEG = LEN.thigh + LEN.shin;
    var START_X = 160, START_Y = 620;
    var SAVE_KEY = 'stickman_level';

    /* ---------------- levels ----------------
       What each move reaches (edge to edge, same height):
         single jump  ~320 across, 165 up   (measured, frame-perfect)
         double jump  ~500 across, 280 up
         + dash       ~660 across
       So: double-jump gaps are ~390 (too far for one jump), dash gaps ~570
       (too far for a double; wider where you drop down), and double-jump
       walls are 200-230 tall (too tall for one jump). Nothing moves, so
       there's no timing, and every landing is on screen before you jump.

       cols   [x, w, top]  pillars rising out of the spike pit
       spikes [x, y]       one tooth pointing up, x = centre of its base
       slabs  [x, w, y]    floating block, toothed on top AND underneath;
                           y is its underside. Walk under it, don't jump.
       goal   [x, top]     the exit door                                   */
    var LEVELS = [
      { w: 3300, goal: [3180, 320],
        cols: [[0, 500, 620], [700, 260, 620], [1120, 220, 520], [1340, 300, 320],
               [2030, 260, 320], [2860, 440, 320]],
        spikes: [[300, 620]] },

      { w: 3720, goal: [3600, 450],
        cols: [[0, 420, 620], [810, 160, 600], [1350, 200, 480], [1550, 140, 250],
               [2080, 300, 450], [2770, 120, 450], [3280, 440, 450]],
        spikes: [[2097, 450], [2131, 450]] },

      { w: 4500, goal: [4360, 480],
        cols: [[0, 400, 600], [970, 200, 600], [1730, 180, 520], [1910, 160, 300],
               [2720, 200, 480], [3490, 160, 480], [4040, 440, 480]] },

      { w: 4500, goal: [4330, 460],
        cols: [[0, 400, 620], [578, 34, 460], [790, 420, 620], [1600, 180, 560],
               [1780, 180, 340], [2520, 140, 380], [3060, 380, 460], [4010, 440, 460]],
        spikes: [[595, 460], [3077, 460]],
        slabs: [[930, 200, 470], [3210, 120, 310]] },

      /* level 5: still nothing moves, but the timing is tight. Gaps sit
         close to each move's limit, landings are narrow, the runways
         after the slabs are short, and one dash gap has a spiky slab
         hanging over it: double-jump at the top of your first jump and
         you hit it, so you have to double late and dash underneath. */
      { w: 5310, goal: [5160, 400],
        cols: [[0, 300, 620], [740, 70, 620], [1000, 90, 380], [1690, 90, 380],
               [1950, 34, 330], [2220, 120, 440], [2900, 100, 440], [3440, 300, 440],
               [4350, 80, 440], [4870, 440, 400]],
        spikes: [[1967, 330]],
        slabs: [[2520, 200, 130], [3520, 160, 300]] },

      /* level 6: the sword on its pedestal. The door stays locked until
         you've picked it up. */
      { w: 2300, goal: [2160, 620], needs: 'sword', pedestal: [1500, 620],
        cols: [[0, 640, 620], [820, 300, 560], [1300, 1000, 620]] },

      /* level 7: the red stickman. He carries the key on his belt; the
         door won't open without it. */
      { w: 1500, goal: [1410, 620], needs: 'key', enemy: [980, 620],
        cols: [[0, 1500, 620]] },

      /* level 8: platforming either side of a middle platform, where another
         red stickman guards the key. He won't leave his platform. */
      { w: 3800, goal: [3600, 400], needs: 'key', enemy: [2060, 400],
        cols: [[0, 400, 620], [790, 160, 560], [1150, 140, 360], [1790, 420, 400],
               [2600, 140, 400], [3300, 500, 400]] }
    ];

    var level = 0, goal = null, solids = [], spikes = [];

    /* teeth tiled across the slab's whole width, no bare strip at the ends */
    function addTeeth(x, w, y, down) {
      var n = Math.max(1, Math.round(w / TOOTH)), tw = w / n;
      for (var i = 0; i < n; i++)
        spikes.push({ x: x + tw * (i + 0.5), y: y, w: tw, h: TOOTH, down: down, wide: true });
    }

    function buildLevel(n) {
      var L = LEVELS[n], i, c;
      level = n;
      WORLD_W = L.w;
      solids = [
        { x: -200,    y: -1000, w: 200, h: 3000 },
        { x: WORLD_W, y: -1000, w: 200, h: 3000 }
      ];
      spikes = [];
      for (i = 0; i < L.cols.length; i++) {
        c = L.cols[i];
        solids.push({ x: c[0], y: c[2], w: c[1], h: 1200 - c[2], col: true });
      }
      /* the pit floor: every stretch between pillars is tiled wall to wall
         with teeth (each stretch gets its own tooth width so they fit
         exactly, no gaps at the edges) */
      solids.push({ x: 0, y: PIT, w: WORLD_W, h: 400 });
      var sorted = L.cols.slice().sort(function (u, v) { return u[0] - v[0]; });
      var from = 0;
      for (i = 0; i <= sorted.length; i++) {
        var to = i < sorted.length ? sorted[i][0] : WORLD_W;
        if (to - from > 4) {
          var nT = Math.max(1, Math.round((to - from) / TOOTH)), tw = (to - from) / nT;
          for (var j = 0; j < nT; j++)
            spikes.push({ x: from + tw * (j + 0.5), y: PIT, w: tw, h: TOOTH, down: false });
        }
        if (i < sorted.length) from = Math.max(from, sorted[i][0] + sorted[i][1]);
      }
      var S = L.spikes || [];
      for (i = 0; i < S.length; i++)
        spikes.push({ x: S[i][0], y: S[i][1], w: TOOTH, h: TOOTH, down: false, wide: true });
      var B = L.slabs || [];
      for (i = 0; i < B.length; i++) {
        var b = B[i];
        solids.push({ x: b[0], y: b[2] - 30, w: b[1], h: 30 });
        addTeeth(b[0], b[1], b[2] - 30, false);
        addTeeth(b[0], b[1], b[2], true);
      }
      goal = { x: L.goal[0] - 22, y: L.goal[1] - 84, w: 44, h: 84 };
      START_X = L.cols[0][0] + 120;
      START_Y = L.cols[0][2];
      pedestal = L.pedestal ? { x: L.pedestal[0], y: L.pedestal[1] } : null;
      swordTaken = false;
    }

    /* ---------------- helpers ---------------- */
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function approach(v, t, d) { return v < t ? Math.min(v + d, t) : Math.max(v - d, t); }
    function smooth(t) { return t * t * (3 - 2 * t); }
    function mixPose(a, b, t) {
      var o = {}, k;
      for (k in a) if (a.hasOwnProperty(k)) o[k] = a[k] + (b[k] - a[k]) * t;
      return o;
    }
    function copyPose(a) { return mixPose(a, a, 0); }

    /* ---------------- input ---------------- */
    var keys = {};
    var LEFT = ['KeyA', 'ArrowLeft'], RIGHT = ['KeyD', 'ArrowRight'];
    var UP = ['KeyW', 'ArrowUp', 'Space'], DOWN = ['KeyS', 'ArrowDown'];
    function held(list) {
      for (var i = 0; i < list.length; i++) if (keys[list[i]]) return true;
      return false;
    }

    /* ---------------- state ---------------- */
    var state = 'menu';
    var T = 0, hintT = 0;
    var p = {};
    var pose = null, joints = null;
    var pieces = [], lines = [], ghosts = [], sparks = [];
    var cam = { x: 0, look: 0, shake: 0 };
    var ghostT = 0;

    /* ---------------- poses ----------------
       Every limb angle is measured from straight down; positive swings it
       towards the way he's facing. lean is the torso tipping forward. */
    var DASH_POSE = { lean: 0.95, tilt: -0.15, lt: -0.35, ls: -0.9, rt: -0.85, rs: -1.25,
                      lu: -1.35, lf: -1.6, ru: -1.15, rf: -1.45 };
    var CROUCH    = { lean: 0.35, tilt: 0.1, lt: 1.1, ls: -0.55, rt: 0.85, rs: -0.85,
                      lu: 0.6, lf: 1.1, ru: 0.3, rf: 0.9 };
    var SKID      = { lean: 0.38, tilt: 0.05, lt: 0.35, ls: -0.35, rt: -0.65, rs: -0.75,
                      lu: 0.9, lf: 1.3, ru: -0.6, rf: -0.2 };
    var RISE      = { lean: 0.12, tilt: -0.12, lt: 1.25, ls: 0.15, rt: 0.2, rs: -0.65,
                      lu: 2.4, lf: 2.8, ru: -0.7, rf: -0.3 };
    var FALL      = { lean: 0.05, tilt: 0.1, lt: 0.45, ls: 0.1, rt: -0.15, rs: -0.45,
                      lu: 1.65, lf: 2.1, ru: -1.55, rf: -1.9 };
    /* knees tucked up for a moment on the double jump (no spin) */
    var TUCK      = { lean: 0.55, tilt: 0.25, lt: 1.95, ls: 0.35, rt: 1.75, rs: 0.15,
                      lu: 1.3, lf: 2.3, ru: 1.1, rf: 2.1 };

    function idlePose() {
      var w = T * 2.4, b = Math.sin(w);
      return {
        lean: 0.03 + 0.012 * b, tilt: 0.02 * b,
        lt: 0.10 + 0.03 * b, ls: -0.02 - 0.04 * b,
        rt: -0.07 + 0.03 * b, rs: -0.12 - 0.04 * b,
        lu: 0.12 + 0.04 * Math.sin(w + 0.6), lf: 0.32 + 0.05 * Math.sin(w + 0.9),
        ru: -0.10 + 0.04 * Math.sin(w + 0.3), rf: 0.12 + 0.05 * Math.sin(w + 0.7)
      };
    }

    function runPose(k, ph) {
      function leg(o) {
        var s = Math.sin(ph + o), c = Math.cos(ph + o);
        var th = 0.12 + (0.25 + 0.6 * k) * s;
        /* knee folds while the leg swings through, straightens on the push */
        var bend = 0.1 + (0.25 + 1.3 * k) * Math.max(0, c);
        return [th, th - bend];
      }
      function arm(o) {
        var s = Math.sin(ph + o);
        var u = 0.1 - (0.12 + 0.3 * k) * s;
        return [u, u + 0.12 + 0.25 * k];
      }
      var A = leg(0), B = leg(Math.PI), C = arm(0), D = arm(Math.PI);
      return {
        lean: 0.08 + 0.22 * k, tilt: -0.05 * k + 0.03 * Math.sin(2 * ph),
        lt: A[0], ls: A[1], rt: B[0], rs: B[1],
        lu: C[0], lf: C[1], ru: D[0], rf: D[1]
      };
    }

    function airPose() {
      var t = smooth(clamp((p.vy + 300) / 900, 0, 1));
      var o = mixPose(RISE, FALL, t);
      o.lean += clamp(p.vx * p.face / RUN, -1, 1) * 0.1;
      return o;
    }

    function targetPose() {
      if (state === 'play' && p.flip > 0) return TUCK;
      if (state === 'play' && p.dashT > 0) return DASH_POSE;
      if (!p.onGround && p.squat <= 0) return airPose();
      var k = clamp(Math.abs(p.vx) / RUN, 0, 1);
      var tgt = mixPose(idlePose(), runPose(k, p.phase), smooth(clamp(k * 2.5, 0, 1)));
      var skid = clamp(-p.vx * p.face / RUN * 1.6, 0, 1);
      if (skid > 0) tgt = mixPose(tgt, SKID, skid);
      var sq = 0;
      if (p.landT > 0) sq = p.landAmt * (p.landT / 0.2);
      if (p.squat > 0) sq = Math.max(sq, 0.8);
      if (state === 'play' && held(DOWN)) sq = Math.max(sq, 0.7);
      if (sq > 0) tgt = mixPose(tgt, CROUCH, sq);
      return tgt;
    }

    function animate(dt) {
      var tgt = targetPose();
      if (!pose) pose = copyPose(tgt);
      var rate = p.dashT > 0 ? 35 : p.flip > 0 ? 30 : (p.onGround && Math.abs(p.vx) > 20 ? 22 : 14);
      var a = 1 - Math.exp(-rate * dt), k;
      for (k in tgt) if (tgt.hasOwnProperty(k)) pose[k] += (tgt[k] - pose[k]) * a;

      p.faceDraw += (p.face - p.faceDraw) * (1 - Math.exp(-18 * dt));
      var plantT = (p.onGround && p.dashT <= 0) ? 1 : 0;
      p.plant += (plantT - p.plant) * (1 - Math.exp(-20 * dt));
      if (p.onGround) p.phase += Math.abs(p.vx) * dt / 140 * Math.PI * 2;

      if (p.swingT > 0) swingArm();
      joints = keepOutOfWalls(computeJoints(p.x, p.y, pose, p.faceDraw, p.plant), p.x);
    }

    /* His collision box is slim, but a swinging arm, a reaching leg or the
       head can poke past it. If any part would be drawn inside a wall
       beside him, slide the whole figure back so it touches, not enters. */
    function keepOutOfWalls(J, cx) {
      var push = 0, k, i, s, pt, r;
      for (k in J) {
        if (!J.hasOwnProperty(k) || k === 'f') continue;
        pt = J[k];
        r = (k === 'head' ? LEN.head : 0) + LINE_W / 2;
        for (i = 0; i < solids.length; i++) {
          s = solids[i];
          /* only parts level with the wall (not the floor he stands on) */
          if (pt.y <= s.y + 2 || pt.y >= s.y + s.h) continue;
          if (cx <= s.x && pt.x + r > s.x) push = Math.min(push, s.x - (pt.x + r));
          else if (cx >= s.x + s.w && pt.x - r < s.x + s.w) push = Math.max(push, s.x + s.w - (pt.x - r));
        }
      }
      if (push === 0) return J;
      for (k in J) if (J.hasOwnProperty(k) && k !== 'f') J[k] = { x: J[k].x + push, y: J[k].y };
      return J;
    }

    function seg(o, ang, len, f) {
      return { x: o.x + Math.sin(ang) * len * f, y: o.y + Math.cos(ang) * len };
    }

    function computeJoints(px, py, P, f, plant) {
      var dL = Math.cos(P.lt) * LEN.thigh + Math.cos(P.ls) * LEN.shin;
      var dR = Math.cos(P.rt) * LEN.thigh + Math.cos(P.rs) * LEN.shin;
      /* on the ground the lowest foot is planted, so the hips ride up and
         down with the stride instead of the feet floating or sinking */
      var hipH = LEG + (Math.max(dL, dR) - LEG) * plant;
      var hip = { x: px, y: py - hipH };
      var sl = Math.sin(P.lean), cl = Math.cos(P.lean);
      var neck = { x: hip.x + sl * LEN.torso * f, y: hip.y - cl * LEN.torso };
      /* arms hang from the very top of the body; the head floats just above */
      var sh = neck;
      var ha = P.lean + P.tilt;
      var head = { x: neck.x + Math.sin(ha) * (LEN.head + 5) * f,
                   y: neck.y - Math.cos(ha) * (LEN.head + 5) };
      var lk = seg(hip, P.lt, LEN.thigh, f), lf = seg(lk, P.ls, LEN.shin, f);
      var rk = seg(hip, P.rt, LEN.thigh, f), rf = seg(rk, P.rs, LEN.shin, f);
      var le = seg(sh, P.lu, LEN.upper, f),  lh = seg(le, P.lf, LEN.fore, f);
      var re = seg(sh, P.ru, LEN.upper, f),  rh = seg(re, P.rf, LEN.fore, f);
      return { f: f, hip: hip, neck: neck, sh: sh, head: head,
               lk: lk, lf: lf, rk: rk, rf: rf, le: le, lh: lh, re: re, rh: rh };
    }

    /* ---------------- player ---------------- */
    function resetPlayer() {
      p.x = START_X; p.y = START_Y; p.vx = 0; p.vy = 0;
      p.onGround = true; p.face = 1; p.faceDraw = 1;
      p.coyote = 0; p.jumpBuf = 0; p.dashBuf = 0; p.squat = 0;
      p.jumping = false; p.cut = false;
      p.airJumps = 1; p.flip = 0;
      p.dead = false; p.deadT = 0;
      p.dashT = 0; p.cool = 0; p.canDash = true;
      p.landT = 0; p.landAmt = 0; p.phase = 0; p.plant = 1;
      p.hp = MAX_HP; p.inv = 0; p.stun = 0;
      p.swingT = 0; p.swingCool = 0; p.swingBuf = 0; p.swingHit = false; p.trail = [];
      var L = LEVELS[level];
      p.hasSword = !!(L && (L.enemy || (L.pedestal && swordTaken)));
      pose = null;
      animate(0);
    }

    function overlaps(x, y, s) {
      return x + PW / 2 > s.x && x - PW / 2 < s.x + s.w && y > s.y && y - PH < s.y + s.h;
    }

    function move(dt) {
      var i, s, wasGround = p.onGround, fallV = p.vy;

      p.x += p.vx * dt;
      for (i = 0; i < solids.length; i++) {
        s = solids[i];
        if (!overlaps(p.x, p.y, s)) continue;
        if (p.x < s.x + s.w / 2) p.x = s.x - PW / 2;
        else p.x = s.x + s.w + PW / 2;
        p.vx = 0;
      }

      p.y += p.vy * dt;
      p.onGround = false;
      for (i = 0; i < solids.length; i++) {
        s = solids[i];
        if (!overlaps(p.x, p.y, s)) continue;
        if (p.y - PH / 2 < s.y + s.h / 2) {
          p.y = s.y; if (p.vy > 0) p.vy = 0; p.onGround = true;
        } else {
          p.y = s.y + s.h + PH; if (p.vy < 0) p.vy = 0;
        }
      }

      if (p.onGround && !wasGround) {
        p.landAmt = clamp(fallV / 1400, 0.15, 0.85);
        p.landT = 0.2;
        p.flip = 0;
        p.jumping = false;
      }
      if (p.onGround && p.dashT <= 0) p.canDash = true;
      if (p.onGround) p.airJumps = 1;
    }

    function touchingSpike() {
      for (var i = 0; i < spikes.length; i++) {
        var k = spikes[i];
        /* a slim box up the middle of the tooth, so brushing the slope's
           empty corner doesn't count */
        /* hand-placed teeth kill across their whole base (and a hair past
           it), so there's no sliver of ledge to stand on beside one */
        var hb = k.wide
          ? { x: k.x - k.w / 2 - 2, y: k.down ? k.y : k.y - k.h * 0.8, w: k.w + 4, h: k.h * 0.8 }
          : k.down
          ? { x: k.x - k.w * 0.28, y: k.y, w: k.w * 0.56, h: k.h * 0.8 }
          : { x: k.x - k.w * 0.28, y: k.y - k.h * 0.8, w: k.w * 0.56, h: k.h * 0.8 };
        if (overlaps(p.x, p.y, hb)) return true;
      }
      return false;
    }

    /* ---------------- effects ---------------- */
    function zoomLine(spread) {
      var len = 50 + Math.random() * 110;
      var life = 0.18 + Math.random() * 0.1;
      lines.push({
        x: p.x - p.face * (6 + Math.random() * spread),
        y: p.y - 8 - Math.random() * (PH - 14),
        len: len, f: p.face, life: life, max: life
      });
    }

    function spawnDash() {
      for (var i = 0; i < 10; i++) zoomLine(60);
      cam.shake = Math.max(cam.shake, 3);
    }

    function snapshotJoints(J) {
      var o = {}, k;
      for (k in J) if (J.hasOwnProperty(k)) o[k] = (k === 'f') ? J[k] : { x: J[k].x, y: J[k].y };
      return o;
    }

    function burst(x, y, n, colors, speed) {
      for (var i = 0; i < n; i++) {
        var a = Math.random() * Math.PI * 2, v = speed * (0.3 + Math.random() * 0.7);
        sparks.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - speed * 0.4,
                      life: 0.5 + Math.random() * 0.4, max: 0.9,
                      c: colors[i % colors.length] });
      }
    }

    function updateFx(dt) {
      var i;
      for (i = lines.length - 1; i >= 0; i--) {
        lines[i].life -= dt;
        lines[i].x -= lines[i].f * 120 * dt;
        if (lines[i].life <= 0) lines.splice(i, 1);
      }
      for (i = ghosts.length - 1; i >= 0; i--) {
        ghosts[i].life -= dt;
        if (ghosts[i].life <= 0) ghosts.splice(i, 1);
      }
      for (i = sparks.length - 1; i >= 0; i--) {
        var s = sparks[i];
        s.life -= dt; s.vy += G * 0.5 * dt; s.x += s.vx * dt; s.y += s.vy * dt;
        if (s.life <= 0) sparks.splice(i, 1);
      }
      if (cam.shake > 0) cam.shake = Math.max(0, cam.shake - 30 * dt);
    }

    /* ---------------- death: he breaks apart ---------------- */
    function die() {
      p.dead = true; p.deadT = 0;
      pieces = [];
      breakApart(joints, p.vx, p.vy, ORANGE);
      cam.shake = 11;
      lines = []; ghosts = [];
    }

    /* snap a figure into its bones and send them flying */
    function breakApart(J, bvx, bvy, color) {
      var segs = [
        [J.hip, J.neck, false], [J.hip, J.lk, true], [J.lk, J.lf, true],
        [J.hip, J.rk, false], [J.rk, J.rf, false], [J.sh, J.le, true],
        [J.le, J.lh, true], [J.sh, J.re, false], [J.re, J.rh, false]
      ];
      for (var i = 0; i < segs.length; i++) {
        var a = segs[i][0], b = segs[i][1];
        var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        var dx = b.x - a.x, dy = b.y - a.y, len = Math.sqrt(dx * dx + dy * dy) || 1;
        var ox = mx - J.hip.x, oy = my - J.hip.y, ol = Math.sqrt(ox * ox + oy * oy);
        if (ol < 0.01) { ox = 0; oy = -1; } else { ox /= ol; oy /= ol; }
        var push = 180 + Math.random() * 260;
        pieces.push({
          x: mx, y: my, a: Math.atan2(dy, dx), h: len / 2,
          vx: bvx * 0.35 + ox * push,
          vy: bvy * 0.3 - 260 - Math.random() * 200 + oy * 150,
          va: (Math.random() - 0.5) * 22, color: color
        });
      }
      pieces.push({
        head: true, x: J.head.x, y: J.head.y, a: 0, h: LEN.head, f: J.f,
        vx: bvx * 0.4 + (Math.random() - 0.5) * 220, vy: -430 - Math.random() * 150,
        va: (Math.random() - 0.5) * 14, color: color
      });
      burst(J.hip.x, J.hip.y - 10, 26, ['#ffffff', color, '#ff4e6a'], 520);
    }

    function inside(x, y, s) {
      return x > s.x && x < s.x + s.w && y > s.y && y < s.y + s.h;
    }

    function updatePieces(dt) {
      for (var i = 0; i < pieces.length; i++) {
        var pc = pieces[i], j, s;
        pc.vy += G * dt;
        pc.x += pc.vx * dt; pc.y += pc.vy * dt; pc.a += pc.va * dt;

        if (pc.head) {
          var r = LEN.head;
          for (j = 0; j < solids.length; j++) {
            s = solids[j];
            if (pc.x + r * 0.7 < s.x || pc.x - r * 0.7 > s.x + s.w) continue;
            if (pc.y + r < s.y || pc.y - r > s.y + s.h) continue;
            if (pc.y - pc.vy * dt + r <= s.y + 2) {
              pc.y = s.y - r;
              if (pc.vy > 0) pc.vy = -pc.vy * 0.45;
              if (Math.abs(pc.vy) < 50) pc.vy = 0;
              pc.vx *= 0.94;
              pc.va = pc.vx / r;
            } else if (pc.y - pc.vy * dt - r >= s.y + s.h - 2) {
              pc.y = s.y + s.h + r; if (pc.vy < 0) pc.vy = 0;
            } else {
              pc.x = (pc.x < s.x + s.w / 2) ? s.x - r : s.x + s.w + r;
              pc.vx = -pc.vx * 0.5;
            }
          }
          continue;
        }

        var cx = Math.cos(pc.a) * pc.h, cy = Math.sin(pc.a) * pc.h;
        var ends = [[pc.x + cx, pc.y + cy], [pc.x - cx, pc.y - cy]];
        var touching = false;
        for (var e = 0; e < 2; e++) {
          var ex = ends[e][0], ey = ends[e][1];
          for (j = 0; j < solids.length; j++) {
            s = solids[j];
            if (!inside(ex, ey, s)) continue;
            var pen = ey - s.y;
            if (pen < 30) {
              pc.y -= pen; ey -= pen;
              if (pc.vy > 0) pc.vy = -pc.vy * 0.3;
              pc.vx *= 0.9; pc.va *= 0.85;
              /* the end that hit the floor is a pivot: the stick tips over
                 until it lies flat */
              pc.va += ((pc.x - ex) / pc.h) * 70 * dt;
              touching = true;
            } else {
              pc.x += (ex < s.x + s.w / 2) ? (s.x - ex) : (s.x + s.w - ex);
              pc.vx = -pc.vx * 0.4;
            }
          }
        }
        if (touching && Math.abs(pc.vy) < 40) pc.vy = 0;
      }
    }

    function piecesSettled() {
      for (var i = 0; i < pieces.length; i++) {
        var pc = pieces[i];
        if (Math.abs(pc.vx) > 25 || Math.abs(pc.vy) > 25 || Math.abs(pc.va) > 1.5) return false;
      }
      return true;
    }

    /* cut straight back to the start: no camera pan, it just jumps there */
    function respawn() {
      resetPlayer();
      resetEnemy();
      pieces = [];   // no body left behind
      cam.look = p.face * LOOK;
      cam.x = cameraTarget();
      burst(p.x, p.y - 45, 14, [ORANGE, '#ffffff'], 260);
    }

    function saveLevel(n) {
      try { localStorage.setItem(SAVE_KEY, String(n)); } catch (e) {}
    }
    function loadSaved() {
      var n = 0;
      try { n = parseInt(localStorage.getItem(SAVE_KEY), 10) || 0; } catch (e) {}
      return clamp(n, 0, LEVELS.length - 1);
    }

    function enterLevel(n) {
      buildLevel(n);
      saveLevel(n);
      lines = []; ghosts = []; sparks = [];
      respawn();
      levelTag.textContent = 'Level ' + (n + 1) + ' / ' + LEVELS.length;
      banner.textContent = 'LEVEL ' + (n + 1);
      banner.classList.add('show');
      bannerT = 1.8;
    }

    /* admin: L jumps straight to the next level (or the win screen) */
    function skipLevel() {
      if (level + 1 < LEVELS.length) enterLevel(level + 1);
      else reachGoal();
    }

    function reachGoal() {
      if (level + 1 < LEVELS.length) { enterLevel(level + 1); return; }
      state = 'won';
      saveLevel(0);
      winBox.classList.add('show');
      levelTag.classList.remove('show');
    }

    function doorOpen() {
      var need = LEVELS[level].needs;
      if (need === 'sword') return p.hasSword;
      if (need === 'key') return !!p.hasKey;
      return true;
    }

    function touchingGoal() {
      return doorOpen() && overlaps(p.x, p.y, goal);
    }

    /* ================= sword & the red stickman ================= */
    var MAX_HP = 100, SWING_T = 0.32, SWING_CD = 0.3, SWORD_LEN = 44, SWORD_DMG = 10;
    var RED = '#ff3b3b';
    var enemy = null, keyItem = null, pedestal = null, swordTaken = false, booms = [];

    /* His two attacks. wind = the visible wind-up you can react to,
       active = when it can hit, rec = recovery. Boxes are measured up from
       his feet: the punch is high (head/chest), the kick is low (legs/belly). */
    var ATTACKS = {
      punch: { wind: 0.17, active: 0.09, rec: 0.24, dmg: 5,  reach: 54, top: 108, bot: 48 },
      kick:  { wind: 0.27, active: 0.11, rec: 0.38, dmg: 10, reach: 76, top: 72,  bot: 8 }
    };

    var STANCE     = { lean: 0.12, tilt: -0.05, lt: 0.38, ls: -0.25, rt: -0.22, rs: -0.55,
                       lu: 0.95, lf: 2.55, ru: 0.75, rf: 2.35 };
    var PUNCH_WIND = { lean: -0.04, tilt: 0, lt: 0.42, ls: -0.3, rt: -0.3, rs: -0.62,
                       lu: 1.0, lf: 2.6, ru: -0.95, rf: 0.85 };
    var PUNCH_HIT  = { lean: 0.32, tilt: 0.05, lt: 0.55, ls: -0.12, rt: -0.48, rs: -0.55,
                       lu: 0.45, lf: 2.2, ru: 1.6, rf: 1.6 };
    var UPPERCUT   = { lean: 0.1, tilt: -0.25, lt: 0.5, ls: -0.1, rt: -0.4, rs: -0.5,
                       lu: 0.5, lf: 2.2, ru: 2.55, rf: 2.75 };
    var KICK_WIND  = { lean: -0.22, tilt: 0.05, lt: -0.05, ls: -0.12, rt: 1.55, rs: 0.1,
                       lu: 1.3, lf: 2.2, ru: -0.6, rf: -0.2 };
    var KICK_HIT   = { lean: -0.42, tilt: 0.12, lt: -0.1, ls: -0.15, rt: 1.62, rs: 1.62,
                       lu: 1.65, lf: 2.0, ru: -1.0, rf: -0.7 };
    var HURT       = { lean: -0.42, tilt: -0.3, lt: 0.3, ls: 0.0, rt: -0.4, rs: -0.6,
                       lu: -0.8, lf: -0.5, ru: -1.1, rf: -0.9 };

    function boxesTouch(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }
    function bodyBox(x, y) { return { x: x - PW / 2, y: y - PH, w: PW, h: PH }; }

    function resetEnemy() {
      var L = LEVELS[level];
      keyItem = null; p.hasKey = false; booms = [];
      if (!L.enemy) { enemy = null; return; }
      /* the platform he stands on is his: he never walks or gets knocked off it */
      var home = { x0: 0, x1: WORLD_W };
      for (var i = 0; i < L.cols.length; i++) {
        var c = L.cols[i];
        if (L.enemy[0] >= c[0] && L.enemy[0] <= c[0] + c[1] && c[2] === L.enemy[1]) home = { x0: c[0], x1: c[0] + c[1] };
      }
      enemy = { x: L.enemy[0], y: L.enemy[1], vx: 0, vy: 0, onGround: true, home: home, sx: L.enemy[0],
                face: -1, faceDraw: -1, plant: 1, phase: 0, pose: null, J: null,
                hp: MAX_HP, act: 'idle', actT: 0, cool: 1.0, stun: 0, hitDone: false,
                high: false, dead: false, flash: 0, backT: 0, readSwing: false, readDash: false };
      animateEnemy(0);
    }

    /* the same box-vs-walls movement the player uses */
    function moveBody(b, dt) {
      var i, s;
      b.x += b.vx * dt;
      for (i = 0; i < solids.length; i++) {
        s = solids[i];
        if (!overlaps(b.x, b.y, s)) continue;
        b.x = (b.x < s.x + s.w / 2) ? s.x - PW / 2 : s.x + s.w + PW / 2;
        b.vx = 0;
      }
      b.y += b.vy * dt;
      b.onGround = false;
      for (i = 0; i < solids.length; i++) {
        s = solids[i];
        if (!overlaps(b.x, b.y, s)) continue;
        if (b.y - PH / 2 < s.y + s.h / 2) { b.y = s.y; if (b.vy > 0) b.vy = 0; b.onGround = true; }
        else { b.y = s.y + s.h + PH; if (b.vy < 0) b.vy = 0; }
      }
    }

    function hurtPlayer(dmg, dir) {
      if (p.dead || p.inv > 0) return;
      p.hp = Math.max(0, p.hp - dmg);
      p.inv = 0.6; p.stun = 0.22;
      p.vx = dir * 330; p.vy = -260; p.onGround = false;
      p.dashT = 0; p.swingT = 0; p.squat = 0;
      burst(p.x, p.y - 60, 10, ['#ffffff', ORANGE], 300);
      cam.shake = Math.max(cam.shake, dmg >= 10 ? 7 : 4);
      if (p.hp <= 0) die();
    }

    function startAttack(e, kind, high) {
      e.act = kind; e.actT = 0; e.hitDone = false; e.high = !!high;
    }

    /* Reads you every frame: how far away you are, how high, whether
       you're winding up a swing, dashing in, or stuck in a swing's
       follow-through. Punches when you're close or jumping over him,
       kicks when you hover just outside punch range, backs off from
       swings and dashes some of the time, and rushes in to punish a
       missed swing. */
    function updateEnemy(dt) {
      var e = enemy;
      if (!e || e.dead) return;
      var dx = p.x - e.x, dist = Math.abs(dx), above = e.y - p.y;
      var alive = !p.dead;
      var sw = p.swingT > 0 ? 1 - p.swingT / SWING_T : -1;
      e.flash = Math.max(0, e.flash - dt);

      if (e.stun > 0) {
        e.stun -= dt;
        e.vx = approach(e.vx, 0, 1300 * dt);
        if (e.stun <= 0) { e.act = 'idle'; e.cool = Math.max(e.cool, 0.25); }
      } else if (e.act === 'punch' || e.act === 'kick') {
        var A = ATTACKS[e.act];
        e.actT += dt;
        e.vx = approach(e.vx, e.act === 'punch' && e.actT > A.wind * 0.6 ? e.face * 90 : 0, 1600 * dt);
        if (!e.hitDone && alive && e.actT >= A.wind && e.actT < A.wind + A.active) {
          var top = (e.act === 'punch' && e.high) ? 165 : A.top;
          var hb = { x: e.face > 0 ? e.x : e.x - A.reach, y: e.y - top, w: A.reach, h: top - A.bot };
          if (boxesTouch(hb, bodyBox(p.x, p.y))) { e.hitDone = true; hurtPlayer(A.dmg, e.face); }
        }
        if (e.actT >= A.wind + A.active + A.rec) { e.act = 'idle'; e.cool = 0.35 + Math.random() * 0.35; }
      } else {
        if (alive) e.face = dx >= 0 ? 1 : -1;
        e.cool -= dt;
        var windingUp = sw >= 0 && sw < 0.35;
        var recovering = sw >= 0.6;
        var dashingAtHim = p.dashT > 0 && p.face === (dx < 0 ? 1 : -1);

        if (windingUp && dist < 100 && !e.readSwing) {
          e.readSwing = true;
          if (Math.random() < 0.45) e.backT = 0.2;
        }
        if (!windingUp) e.readSwing = false;
        if (dashingAtHim && dist < 280 && !e.readDash) {
          e.readDash = true;
          if (Math.random() < 0.35) e.backT = 0.22;
        }
        if (p.dashT <= 0) e.readDash = false;

        if (e.backT > 0) {
          e.backT -= dt;
          e.vx = approach(e.vx, -e.face * 330, 2600 * dt);
        } else {
          var choice = null, high = false;
          if (alive && e.cool <= 0 && e.onGround) {
            if (above > 45 && above < 160 && dist < 62) { choice = 'punch'; high = true; }
            else if (above <= 45 && dist < 50) choice = 'punch';
            else if (above <= 30 && dist >= 50 && dist < 82) choice = 'kick';
          }
          if (choice) startAttack(e, choice, high);
          else if (!alive) e.vx = approach(e.vx, 0, 1500 * dt);
          else if (p.x < e.home.x0 || p.x > e.home.x1) {
            /* you're not on his platform yet: he waits at his post */
            var toPost = e.sx - e.x;
            e.vx = approach(e.vx, Math.abs(toPost) > 8 ? (toPost > 0 ? 160 : -160) : 0, 1800 * dt);
          }
          else {
            var spd = recovering ? 320 : 220;
            if (dist > 74) e.vx = approach(e.vx, e.face * spd, 1800 * dt);
            else if (dist < 38) e.vx = approach(e.vx, -e.face * 170, 1800 * dt);
            else e.vx = approach(e.vx, 0, 1800 * dt);
          }
        }
      }

      e.vy = Math.min(e.vy + G * dt, 1400);
      moveBody(e, dt);
      if (e.x < e.home.x0 + 12) { e.x = e.home.x0 + 12; e.vx = Math.max(0, e.vx); }
      if (e.x > e.home.x1 - 12) { e.x = e.home.x1 - 12; e.vx = Math.min(0, e.vx); }

      /* you can't walk through him (you can dash through) */
      if (alive && p.dashT <= 0 && Math.abs(p.x - e.x) < PW &&
          p.y > e.y - PH + 10 && p.y - PH < e.y - 10) {
        p.x = e.x + (p.x >= e.x ? PW : -PW);
      }
      animateEnemy(dt);
    }

    function enemyTarget(e) {
      if (e.stun > 0) return HURT;
      if (e.act === 'punch' || e.act === 'kick') {
        var A = ATTACKS[e.act];
        var W = e.act === 'punch' ? PUNCH_WIND : KICK_WIND;
        var H = e.act === 'kick' ? KICK_HIT : (e.high ? UPPERCUT : PUNCH_HIT);
        if (e.actT < A.wind) return W;
        if (e.actT < A.wind + A.active + A.rec * 0.45) return H;
        return STANCE;
      }
      if (!e.onGround) return FALL;
      var k = clamp(Math.abs(e.vx) / 300, 0, 1);
      var st = copyPose(STANCE), b = Math.sin(T * 5);
      st.lt += 0.04 * b; st.ls -= 0.04 * b; st.rt += 0.04 * b; st.rs -= 0.04 * b;
      st.lf += 0.05 * b; st.rf += 0.05 * Math.sin(T * 5 + 1);
      var walk = runPose(k * 0.8, e.phase);
      walk.lu = STANCE.lu; walk.lf = STANCE.lf; walk.ru = STANCE.ru; walk.rf = STANCE.rf;
      return mixPose(st, walk, smooth(clamp(k * 2, 0, 1)));
    }

    function animateEnemy(dt) {
      var e = enemy, tgt = enemyTarget(e), k;
      if (!e.pose) e.pose = copyPose(tgt);
      var striking = (e.act === 'punch' || e.act === 'kick') && e.actT >= ATTACKS[e.act].wind;
      var a = 1 - Math.exp(-(striking ? 40 : e.stun > 0 ? 25 : 16) * dt);
      for (k in tgt) if (tgt.hasOwnProperty(k)) e.pose[k] += (tgt[k] - e.pose[k]) * a;
      e.faceDraw += (e.face - e.faceDraw) * (1 - Math.exp(-18 * dt));
      e.plant += ((e.onGround ? 1 : 0) - e.plant) * (1 - Math.exp(-20 * dt));
      if (e.onGround) e.phase += Math.abs(e.vx) * dt / 140 * Math.PI * 2;
      e.J = keepOutOfWalls(computeJoints(e.x, e.y, e.pose, e.faceDraw, e.plant), e.x);
    }

    function killEnemy(e) {
      e.dead = true;
      breakApart(e.J, e.vx, e.vy, RED);
      keyItem = { x: clamp(e.J.hip.x, e.home.x0 + 14, e.home.x1 - 14), y: e.J.hip.y, vx: -e.face * 80, vy: -420, home: e.home };
      cam.shake = 10;
    }

    /* the overhead swing: arm goes back behind the head, then over the
       top and down in front. Angles run past -PI so it travels the long
       way round, over his head, instead of through his body. */
    function swingArm() {
      var s = 1 - p.swingT / SWING_T, t;
      var UP_U = -2.75, UP_F = -3.35, END_U = 0.7 - Math.PI * 2, END_F = 0.35 - Math.PI * 2;
      if (s < 0.25) {
        t = smooth(s / 0.25);
        pose.ru = p.swingFrom[0] + (UP_U - p.swingFrom[0]) * t;
        pose.rf = p.swingFrom[1] + (UP_F - p.swingFrom[1]) * t;
      } else if (s < 0.55) {
        t = smooth((s - 0.25) / 0.3);
        pose.ru = UP_U + (END_U - UP_U) * t;
        pose.rf = UP_F + (END_F - UP_F) * t;
      } else if (pose.ru < -Math.PI) {
        pose.ru += Math.PI * 2; pose.rf += Math.PI * 2;
      }
    }

    function swordTip(J) {
      var dx = J.rh.x - J.re.x, dy = J.rh.y - J.re.y, l = Math.sqrt(dx * dx + dy * dy) || 1;
      return { x: J.rh.x + dx / l * SWORD_LEN, y: J.rh.y + dy / l * SWORD_LEN, ux: dx / l, uy: dy / l };
    }

    function updateCombat(dt) {
      var i;
      /* the sword on its pedestal */
      if (pedestal && !swordTaken && !p.dead &&
          boxesTouch(bodyBox(p.x, p.y), { x: pedestal.x - 30, y: pedestal.y - 120, w: 60, h: 120 })) {
        swordTaken = true; p.hasSword = true;
        burst(pedestal.x, pedestal.y - 70, 24, ['#ffffff', '#fff3a8'], 380);
        hint.innerHTML = 'press <b>I</b> to swing your sword';
        hint.classList.add('show'); hintT = 5;
      }

      /* your swing */
      if (p.swingT > 0) {
        p.swingT -= dt;
        /* after a swing the sword needs 0.3s before it can swing again */
        if (p.swingT <= 0) p.swingCool = SWING_CD;
        var s = 1 - p.swingT / SWING_T;
        if (s > 0.2 && s < 0.6 && joints) {
          p.trail.push(swordTip(joints));
          if (p.trail.length > 7) p.trail.shift();
        } else p.trail = [];
        if (enemy && !enemy.dead && !p.swingHit && s >= 0.3 && s <= 0.6) {
          var hb = { x: p.face > 0 ? p.x - 10 : p.x - 72, y: p.y - 140, w: 82, h: 155 };
          if (boxesTouch(hb, bodyBox(enemy.x, enemy.y))) {
            p.swingHit = true;
            /* hitting him while you're in the air coming down = critical hit */
            var crit = !p.onGround && p.vy > 0;
            var dmg = crit ? SWORD_DMG * 2 : SWORD_DMG;
            var hx = enemy.x - p.face * 8, hy = clamp(p.y - 60, enemy.y - 90, enemy.y - 20);
            enemy.hp = Math.max(0, enemy.hp - dmg);
            enemy.flash = 0.12;
            enemy.stun = crit ? 0.45 : 0.28;
            enemy.act = 'hurt';
            enemy.vx = p.face * (crit ? 430 : 240);
            enemy.vy = crit ? -260 : -110;
            if (crit) {
              booms.push({ x: hx, y: hy, t: 0 });
              burst(hx, hy, 16, ['#ff3b3b', '#ff8a5a', '#ffffff'], 360);
              cam.shake = Math.max(cam.shake, 7);
            } else {
              burst(hx, hy, 8, ['#ffffff', '#ffd0d0'], 260);
              cam.shake = Math.max(cam.shake, 3);
            }
            if (enemy.hp <= 0) killEnemy(enemy);
          }
        }
      } else p.trail = [];

      for (i = booms.length - 1; i >= 0; i--) {
        booms[i].t += dt;
        if (booms[i].t > 0.35) booms.splice(i, 1);
      }

      updateEnemy(dt);

      /* the key he dropped */
      if (keyItem && !p.hasKey) {
        keyItem.vy = Math.min(keyItem.vy + G * dt, 1400);
        keyItem.x += keyItem.vx * dt; keyItem.y += keyItem.vy * dt;
        /* it stays on his platform, it never bounces off into the pit */
        if (keyItem.x < keyItem.home.x0 + 10) { keyItem.x = keyItem.home.x0 + 10; keyItem.vx = Math.abs(keyItem.vx) * 0.5; }
        if (keyItem.x > keyItem.home.x1 - 10) { keyItem.x = keyItem.home.x1 - 10; keyItem.vx = -Math.abs(keyItem.vx) * 0.5; }
        for (i = 0; i < solids.length; i++) {
          var sd = solids[i];
          if (keyItem.x > sd.x && keyItem.x < sd.x + sd.w && keyItem.y + 8 > sd.y && keyItem.y < sd.y + sd.h) {
            if (keyItem.y - keyItem.vy * dt + 8 <= sd.y + 2) {
              keyItem.y = sd.y - 8;
              keyItem.vy = keyItem.vy > 120 ? -keyItem.vy * 0.4 : 0;
              keyItem.vx *= 0.7;
            } else {
              keyItem.vx = -keyItem.vx * 0.5;
              keyItem.x = keyItem.x < sd.x + sd.w / 2 ? sd.x - 1 : sd.x + sd.w + 1;
            }
          }
        }
        if (!p.dead && Math.abs(keyItem.x - p.x) < 30 && keyItem.y > p.y - PH - 10 && keyItem.y < p.y + 10) {
          p.hasKey = true;
          burst(keyItem.x, keyItem.y, 18, ['#ffd166', '#ffffff'], 320);
        }
      }
    }

    /* ---------------- update ---------------- */
    function update(dt) {
      T += dt;
      updateFx(dt);

      if (state === 'menu' || state === 'won') {
        if (state === 'won') { p.vx = 0; p.dashT = 0; }
        animate(dt);
        updateCamera(dt);
        return;
      }

      if (bannerT > 0) {
        bannerT -= dt;
        if (bannerT <= 0) banner.classList.remove('show');
      }

      if (hintT > 0) {
        hintT -= dt;
        if (hintT <= 0) hint.classList.remove('show');
      }

      updatePieces(dt);

      /* dead: the camera holds still until the pieces have landed and
         stopped moving (2.5s at most), then cuts to the start */
      if (p.dead) {
        p.deadT += dt;
        updateCombat(dt);
        if ((p.deadT > 0.6 && piecesSettled()) || p.deadT >= 2.5) respawn();
        return;
      }

      var dir = (held(RIGHT) ? 1 : 0) - (held(LEFT) ? 1 : 0);
      p.jumpBuf -= dt; p.dashBuf -= dt; p.cool -= dt; p.swingBuf -= dt;
      if (p.inv > 0) p.inv -= dt;
      if (p.swingCool > 0) p.swingCool -= dt;
      /* knocked back by a hit: no control for a moment */
      if (p.stun > 0) { p.stun -= dt; dir = 0; p.jumpBuf = 0; p.dashBuf = 0; }

      if (p.swingBuf > 0 && p.hasSword && p.swingT <= 0 && p.swingCool <= 0 && p.stun <= 0) {
        p.swingT = SWING_T; p.swingHit = false; p.swingBuf = 0;
        p.swingFrom = [pose.ru, pose.rf]; p.trail = [];
      }
      p.coyote = p.onGround ? 0.1 : p.coyote - dt;
      if (p.landT > 0) p.landT -= dt;
      if (dir !== 0 && p.dashT <= 0) p.face = dir;

      /* third jump press (in the air, double jump used up) = dash */
      if (p.jumpBuf > 0 && !p.onGround && p.coyote <= 0 && p.squat <= 0 &&
          p.airJumps === 0 && p.dashT <= 0) {
        p.dashBuf = p.jumpBuf; p.jumpBuf = 0;
      }

      if (p.dashBuf > 0 && p.cool <= 0 && p.canDash) {
        p.dashT = DASH_T; p.cool = DASH_CD; p.canDash = false;
        p.dashBuf = 0; p.squat = 0; p.jumping = false; p.flip = 0;
        spawnDash();
      }

      if (p.dashT > 0) {
        p.dashT -= dt;
        p.vx = p.face * DASH; p.vy = 0;
        if (Math.random() < 0.8) zoomLine(40);
        ghostT -= dt;
        if (ghostT <= 0 && joints) {
          ghosts.push({ J: snapshotJoints(joints), life: 0.22, max: 0.22 });
          ghostT = 0.025;
        }
        if (p.dashT <= 0) p.vx = p.face * RUN;
      } else {
        var crouching = p.onGround && held(DOWN);
        var target = crouching ? 0 : dir * RUN;
        var acc = p.onGround ? (dir && !crouching ? ACC_G : FRIC) : (dir ? ACC_A : ACC_A * 0.35);
        p.vx = approach(p.vx, target, acc * dt);

        if (p.jumpBuf > 0 && (p.onGround || p.coyote > 0) && p.squat <= 0) {
          p.squat = 0.055; p.jumpBuf = 0; p.coyote = 0;
        } else if (p.jumpBuf > 0 && !p.onGround && p.squat <= 0 && p.airJumps > 0) {
          p.airJumps--; p.jumpBuf = 0;
          p.vy = -JUMP * 0.9; p.jumping = true; p.cut = false;
          p.flip = FLIP_T;
          burst(p.x, p.y, 10, [ORANGE, '#ffffff'], 220);
        }
        if (p.flip > 0) p.flip = Math.max(0, p.flip - dt);
        if (p.squat > 0) {
          p.squat -= dt;
          if (p.squat <= 0) {
            p.vy = -JUMP; p.onGround = false;
            p.jumping = true; p.cut = false; p.coyote = 0;
          }
        }
        if (p.jumping && !held(UP) && p.vy < 0 && !p.cut) { p.vy *= 0.45; p.cut = true; }

        p.vy = Math.min(p.vy + G * dt, 1400);
      }

      move(dt);
      animate(dt);
      updateCombat(dt);
      if (p.dead) { updateCamera(dt); return; }
      if (touchingSpike() || p.y >= PIT) die();
      else if (touchingGoal()) reachGoal();
      updateCamera(dt);
    }

    /* ---------------- camera & render ---------------- */
    var dpr = 1, scale = 1, vw = 1280;
    function resize() {
      var w = window.innerWidth || 1280, h = window.innerHeight || 760;
      dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      scale = h / VIEW_H;
      vw = w / scale;
    }

    /* the camera sits well ahead of you, so the next landing is always on
       screen before you have to jump for it */
    var LOOK = 230;
    function cameraTarget() {
      if (state === 'menu') return p.x - vw / 2;
      if (WORLD_W <= vw) return (WORLD_W - vw) / 2;
      return clamp(p.x + cam.look - vw / 2, 0, WORLD_W - vw);
    }

    function updateCamera(dt) {
      if (state !== 'menu') cam.look += (p.face * LOOK - cam.look) * (1 - Math.exp(-3 * dt));
      var target = cameraTarget();
      cam.x += (target - cam.x) * (1 - Math.exp(-6 * dt));
    }

    function poly(pts) {
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
    }

    /* Drawn like the Animation vs. stick figures: one flat orange, thick
       round-ended lines, no hands or feet, and a solid round head with no
       face that floats just above the body. */
    var ORANGE = '#ff8a1f', LINE_W = 6.5;

    function drawLimb(pts, color) {
      ctx.lineWidth = LINE_W;
      ctx.strokeStyle = color || ORANGE;
      poly(pts);
    }

    function drawHead(x, y, color) {
      ctx.beginPath();
      ctx.arc(x, y, LEN.head, 0, Math.PI * 2);
      ctx.lineWidth = LINE_W * 0.8;
      ctx.strokeStyle = color || ORANGE;
      ctx.stroke();
    }

    function drawFigure(J, alpha, color) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      drawLimb([J.hip, J.lk, J.lf], color);
      drawLimb([J.sh, J.le, J.lh], color);
      drawLimb([J.hip, J.neck], color);
      drawLimb([J.hip, J.rk, J.rf], color);
      drawLimb([J.sh, J.re, J.rh], color);
      drawHead(J.head.x, J.head.y, color);
      ctx.restore();
    }

    function drawPieces() {
      ctx.save();
      ctx.lineCap = 'round';
      for (var i = 0; i < pieces.length; i++) {
        var pc = pieces[i];
        if (pc.head) { drawHead(pc.x, pc.y, pc.color); continue; }
        var cx = Math.cos(pc.a) * pc.h, cy = Math.sin(pc.a) * pc.h;
        drawLimb([{ x: pc.x - cx, y: pc.y - cy }, { x: pc.x + cx, y: pc.y + cy }], pc.color);
      }
      ctx.restore();
    }

    function drawBackground() {
      ctx.fillStyle = '#0a0e27';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      /* faint parallax grid */
      ctx.save();
      ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
      ctx.strokeStyle = 'rgba(78,127,255,0.06)';
      ctx.lineWidth = 1;
      var gap = 80, off = -((cam.x * 0.4) % gap);
      ctx.beginPath();
      for (var x = off; x < vw + gap; x += gap) { ctx.moveTo(x, 0); ctx.lineTo(x, VIEW_H); }
      for (var y = 20; y < VIEW_H; y += gap) { ctx.moveTo(0, y); ctx.lineTo(vw, y); }
      ctx.stroke();
      ctx.restore();
    }

    function drawLevel() {
      var i, s;
      ctx.save();
      ctx.shadowColor = '#4e7fff'; ctx.shadowBlur = 10;
      ctx.fillStyle = '#121a3a'; ctx.strokeStyle = '#4e7fff'; ctx.lineWidth = 2.5;
      for (i = 2; i < solids.length; i++) {
        s = solids[i];
        if (s.x > cam.x + vw + 20 || s.x + s.w < cam.x - 20) continue;
        ctx.fillRect(s.x, s.y, s.w, s.h);
        ctx.strokeRect(s.x, s.y, s.w, s.h);
      }
      ctx.shadowColor = '#ff4e6a';
      ctx.fillStyle = '#1e0c1a'; ctx.strokeStyle = '#ff4e6a';
      ctx.lineJoin = 'round';
      for (i = 0; i < spikes.length; i++) {
        s = spikes[i];
        if (s.x > cam.x + vw + 40 || s.x < cam.x - 40) continue;
        ctx.beginPath();
        ctx.moveTo(s.x - s.w / 2, s.y);
        ctx.lineTo(s.x, s.down ? s.y + s.h : s.y - s.h);
        ctx.lineTo(s.x + s.w / 2, s.y);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
      }

      /* the exit door (red with a padlock while it's locked) */
      if (goal) {
        var open = doorOpen();
        var dc = open ? '123,255,178' : '255,78,106';
        var pulse = 0.6 + 0.4 * Math.sin(T * 3);
        ctx.shadowColor = 'rgb(' + dc + ')'; ctx.shadowBlur = open ? 14 + 8 * pulse : 8;
        ctx.fillStyle = 'rgba(' + dc + ',' + (open ? 0.10 + 0.08 * pulse : 0.08) + ')';
        ctx.strokeStyle = 'rgb(' + dc + ')'; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(goal.x, goal.y + goal.h);
        ctx.lineTo(goal.x, goal.y + 22);
        ctx.arc(goal.x + goal.w / 2, goal.y + 22, goal.w / 2, Math.PI, 0);
        ctx.lineTo(goal.x + goal.w, goal.y + goal.h);
        ctx.fill(); ctx.stroke();
        if (!open) {
          var lx = goal.x + goal.w / 2, ly = goal.y + 46;
          ctx.shadowBlur = 0;
          ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.arc(lx, ly - 6, 6, Math.PI, 0); ctx.stroke();
          ctx.fillStyle = 'rgb(' + dc + ')';
          ctx.fillRect(lx - 9, ly - 6, 18, 14);
        }
      }

      /* the pedestal, and the sword glowing on it until you take it */
      if (pedestal) {
        var px = pedestal.x, py = pedestal.y;
        ctx.shadowColor = '#4e7fff'; ctx.shadowBlur = 8;
        ctx.fillStyle = '#121a3a'; ctx.strokeStyle = '#4e7fff'; ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(px - 30, py); ctx.lineTo(px - 20, py - 40);
        ctx.lineTo(px + 20, py - 40); ctx.lineTo(px + 30, py);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        if (!swordTaken) {
          var g2 = 0.5 + 0.5 * Math.sin(T * 2.5), hover = Math.sin(T * 2) * 3;
          ctx.fillStyle = 'rgba(255,243,168,' + (0.07 + 0.06 * g2) + ')';
          ctx.beginPath();
          ctx.moveTo(px - 26, py - 40); ctx.lineTo(px - 8, py - 200);
          ctx.lineTo(px + 8, py - 200); ctx.lineTo(px + 26, py - 40);
          ctx.closePath(); ctx.fill();
          drawSword(px, py - 52 + hover, 0, -1, 14 + 12 * g2);
        }
      }

      ctx.restore();
    }

    function drawFx() {
      var i;
      ctx.save();
      ctx.lineCap = 'round';
      for (i = 0; i < lines.length; i++) {
        var l = lines[i], a = l.life / l.max;
        var x2 = l.x - l.f * l.len;
        var g = ctx.createLinearGradient(l.x, 0, x2, 0);
        g.addColorStop(0, 'rgba(255,255,255,' + (0.9 * a) + ')');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = g;
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(x2, l.y); ctx.stroke();
      }
      for (i = 0; i < sparks.length; i++) {
        var s = sparks[i];
        ctx.globalAlpha = clamp(s.life / s.max, 0, 1);
        ctx.fillStyle = s.c;
        ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
      }
      ctx.restore();
      for (i = 0; i < ghosts.length; i++) {
        drawFigure(ghosts[i].J, 0.35 * ghosts[i].life / ghosts[i].max);
      }
    }

    function render() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      drawBackground();
      var sx = (Math.random() - 0.5) * cam.shake, sy = (Math.random() - 0.5) * cam.shake;
      var k = dpr * scale;
      ctx.setTransform(k, 0, 0, k, -(cam.x + sx) * k, sy * k);
      drawLevel();
      drawFx();
      drawPieces();
      drawEnemy();
      drawKey();
      if (joints && !p.dead) {
        /* blink while you're briefly invincible after a hit */
        var blink = p.inv > 0 && Math.floor(p.inv / 0.08) % 2 === 0;
        drawFigure(joints, blink ? 0.35 : 1);
        if (p.hasSword) drawHeldSword();
      }
      drawBooms();
      if (joints && !p.dead && p.hasSword) drawBar(joints.head.x, joints.head.y - 26, p.hp, '#7bffb2');
      if (enemy && !enemy.dead && enemy.J) drawBar(enemy.J.head.x, enemy.J.head.y - 26, enemy.hp, RED);
    }

    /* a sword whose grip sits at (x, y), pointing along (ux, uy) */
    function drawSword(x, y, ux, uy, glow) {
      ctx.save();
      ctx.lineCap = 'round';
      if (glow) { ctx.shadowColor = '#fff3a8'; ctx.shadowBlur = glow; }
      ctx.strokeStyle = '#e8eef7'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(x + ux * 6, y + uy * 6);
      ctx.lineTo(x + ux * SWORD_LEN, y + uy * SWORD_LEN); ctx.stroke();
      ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x + ux * 6 - uy * 8, y + uy * 6 + ux * 8);
      ctx.lineTo(x + ux * 6 + uy * 8, y + uy * 6 - ux * 8); ctx.stroke();
      ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(x - ux * 6, y - uy * 6); ctx.lineTo(x + ux * 4, y + uy * 4); ctx.stroke();
      ctx.restore();
    }

    function drawHeldSword() {
      var J = joints, tip = swordTip(J), i;
      if (p.trail.length > 1) {
        ctx.save();
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.beginPath();
        ctx.moveTo(J.rh.x, J.rh.y);
        for (i = 0; i < p.trail.length; i++) ctx.lineTo(p.trail[i].x, p.trail[i].y);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      drawSword(J.rh.x, J.rh.y, tip.ux, tip.uy, 0);
    }

    function drawKeyShape(x, y, ang) {
      ctx.save();
      ctx.translate(x, y); ctx.rotate(ang);
      ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(0, -5, 4, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -1); ctx.lineTo(0, 10);
      ctx.moveTo(0, 6); ctx.lineTo(3.5, 6); ctx.moveTo(0, 9.5); ctx.lineTo(3.5, 9.5);
      ctx.stroke();
      ctx.restore();
    }

    function drawKey() {
      if (keyItem && !p.hasKey) drawKeyShape(keyItem.x, keyItem.y - 4, 0);
      if (p.hasKey && joints && !p.dead) drawKeyShape(joints.hip.x - p.faceDraw * 6, joints.hip.y + 6, Math.sin(T * 6) * 0.3);
    }

    function drawEnemy() {
      var e = enemy;
      if (!e || e.dead || !e.J) return;
      drawFigure(e.J, 1, e.flash > 0 ? '#ffffff' : RED);
      /* the key hangs off his belt, swinging as he moves */
      drawKeyShape(e.J.hip.x - e.faceDraw * 5, e.J.hip.y + 6, Math.sin(T * 7 + e.x * 0.05) * 0.35);
    }

    function drawBooms() {
      for (var i = 0; i < booms.length; i++) {
        var b = booms[i], t = b.t / 0.35;
        ctx.save();
        ctx.globalAlpha = 1 - t;
        ctx.fillStyle = '#ff3b3b';
        ctx.beginPath(); ctx.arc(b.x, b.y, 6 + 20 * t, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffd0a0';
        ctx.beginPath(); ctx.arc(b.x, b.y, 4 + 7 * (1 - t), 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }

    function drawBar(x, y, hp, color) {
      var w = 56, h = 10;
      ctx.save();
      ctx.fillStyle = 'rgba(10,14,39,0.85)';
      ctx.fillRect(x - w / 2 - 1.5, y - h / 2 - 1.5, w + 3, h + 3);
      ctx.fillStyle = color;
      ctx.fillRect(x - w / 2, y - h / 2, w * clamp(hp / MAX_HP, 0, 1), h);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 9px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(Math.ceil(hp)), x, y + 0.5);
      ctx.restore();
    }

    /* ---------------- loop ---------------- */
    var last = null, accum = 0, STEP = 1 / 120;
    function frame(now) {
      if (last === null) last = now;
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      accum += dt;
      while (accum >= STEP) { update(STEP); accum -= STEP; }
      render();
      requestAnimationFrame(frame);
    }

    function startGame(fromLevel) {
      if (state !== 'menu' && state !== 'won') return;
      state = 'play';
      menu.classList.add('gone');
      winBox.classList.remove('show');
      levelTag.classList.add('show');
      keys = {};
      enterLevel(fromLevel);
      if (fromLevel === 0) { hint.innerHTML = HINT_HTML; hint.classList.add('show'); hintT = 8; }
    }

    function showMenuProgress() {
      var n = loadSaved();
      menuSub.textContent = n > 0 ? 'continue from level ' + (n + 1) : '';
      restartBtn.style.display = n > 0 ? '' : 'none';
    }

    /* ---------------- events ---------------- */
    document.addEventListener('keydown', function (e) {
      if (e.target && e.target.tagName === 'INPUT') return;
      var c = e.code;
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].indexOf(c) >= 0) e.preventDefault();
      if (state === 'menu') {
        if (c === 'Enter' || c === 'Space') startGame(loadSaved());
        return;
      }
      if (state === 'won') return;
      keys[c] = true;
      if (e.repeat) return;
      if (UP.indexOf(c) >= 0) p.jumpBuf = 0.13;
      if (c === 'KeyI') p.swingBuf = 0.12;
      if (c === 'KeyL' && adminMode && !p.dead) { keys = {}; skipLevel(); }
    });
    document.addEventListener('keyup', function (e) { keys[e.code] = false; });
    window.addEventListener('blur', function () { keys = {}; });
    window.addEventListener('resize', resize);
    /* a hidden tab pauses; coming back doesn't fast-forward */
    document.addEventListener('visibilitychange', function () { last = null; accum = 0; });
    playBtn.addEventListener('click', function () { playBtn.blur(); startGame(loadSaved()); });
    adminBtn.addEventListener('click', function () {
      adminMode = !adminMode;
      adminBtn.textContent = '🔧 Admin (test): ' + (adminMode ? 'ON' : 'OFF');
      adminBtn.classList.toggle('on', adminMode);
      adminBtn.blur();
    });
    restartBtn.addEventListener('click', function () { restartBtn.blur(); startGame(0); });
    againBtn.addEventListener('click', function () { againBtn.blur(); startGame(0); });

    resize();
    buildLevel(loadSaved());
    resetPlayer();
    resetEnemy();
    showMenuProgress();
    cam.x = p.x - vw / 2;
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
