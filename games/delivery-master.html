<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Master - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      background: #0b0f24;
      overflow: hidden;
      justify-content: flex-start;
      padding-top: 0;
    }

    /* --- constellation bg + vignette (shared visual frame) --- */
    canvas#bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    }
    .back-link { z-index: 30; }

    .hidden { display: none !important; }

    /* === MENU SCREEN === */
    #menu {
      position: relative;
      z-index: 5;
      padding-top: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 720px;
      gap: 1.5rem;
      margin: 0 auto;
      animation: fadeIn 0.9s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #menu h1 {
      font-size: 3rem;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #a0c4ff 0%, #4e7fff 35%, #c7a0ff 70%, #a0c4ff 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 5s ease-in-out infinite, float 6s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(78, 127, 255, 0.4));
      margin-bottom: 0.2rem;
    }
    @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    .menu-stats {
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .stat-card {
      background: rgba(11, 15, 36, 0.55);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(78, 127, 255, 0.2);
      border-radius: 14px;
      padding: 0.9rem 1.4rem;
      min-width: 140px;
      text-align: center;
    }
    .stat-card .label {
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #8ea7d6;
      margin-bottom: 0.35rem;
    }
    .stat-card .val {
      font-size: 1.6rem;
      font-weight: 700;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      color: #f5d77a;
    }

    .panel {
      background: rgba(11, 15, 36, 0.55);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(78, 127, 255, 0.18);
      border-radius: 16px;
      padding: 1.2rem 1.4rem;
      width: 100%;
    }
    .panel-title {
      color: #a0c4ff;
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
      border-bottom: 1px solid rgba(78, 127, 255, 0.25);
      padding-bottom: 0.4rem;
      font-weight: 700;
    }

    /* Upgrades inside Garage panel */
    .upgrade {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.6rem 0.7rem;
      background: rgba(22, 33, 62, 0.5);
      border: 1.5px solid #0f3460;
      border-radius: 10px;
      margin-bottom: 0.5rem;
      transition: background 0.15s, border-color 0.15s;
    }
    .upgrade:hover { background: rgba(15, 52, 96, 0.6); }
    .upgrade.affordable { border-color: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,0.18); }
    .upgrade.maxed { opacity: 0.55; }

    .upgrade .info { flex: 1; min-width: 0; }
    .upgrade .name { font-weight: 700; color: #fff; font-size: 0.95rem; letter-spacing: 0.5px; }
    .upgrade .desc { font-size: 0.78rem; color: #98a8c5; font-style: italic; margin-top: 1px; }
    .upgrade .level { font-size: 0.72rem; color: #aaa; letter-spacing: 1px; margin-top: 2px; }

    .upgrade button {
      background: linear-gradient(135deg, #4e7fff, #345edb);
      color: #fff;
      border: none;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 1px;
      transition: transform 0.1s, box-shadow 0.15s;
      min-width: 80px;
    }
    .upgrade button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(78, 127, 255, 0.4);
    }
    .upgrade button:disabled { opacity: 0.45; cursor: not-allowed; background: #2a3550; }
    .upgrade.maxed button { background: #444; }

    .start-btn {
      padding: 1rem 3rem;
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #fff;
      border: 2px solid #15803d;
      border-radius: 14px;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
      box-shadow: 0 8px 24px rgba(34, 197, 94, 0.4);
      margin-top: 0.5rem;
    }
    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(34, 197, 94, 0.55);
    }
    .start-btn:active { transform: translateY(0); }

    /* === PLAY SCREEN === */
    #play {
      position: fixed;
      inset: 0;
      display: flex;
      z-index: 10;
      background: #1a1a2e;
    }

    #game-canvas {
      flex: 1;
      display: block;
      background: #2a2f3e;
      cursor: crosshair;
    }

    #sidebar {
      width: 320px;
      flex-shrink: 0;
      background: rgba(11, 15, 36, 0.95);
      border-left: 1px solid rgba(78, 127, 255, 0.25);
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 0.8rem;
      overflow-y: auto;
      color: #ddd;
      font-family: sans-serif;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(78, 127, 255, 0.12);
      font-size: 0.9rem;
    }
    .hud-row .lbl { color: #8ea7d6; letter-spacing: 1px; text-transform: uppercase; font-size: 0.7rem; }
    .hud-row .val { color: #f5d77a; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; font-size: 1rem; }

    .end-shift-btn {
      padding: 0.5rem;
      background: linear-gradient(135deg, #e94560, #b73247);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: inherit;
      font-size: 0.8rem;
      transition: transform 0.1s, box-shadow 0.15s;
    }
    .end-shift-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(233, 69, 96, 0.4);
    }

    .section-title {
      color: #a0c4ff;
      font-size: 0.7rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 0.4rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid rgba(78, 127, 255, 0.18);
    }

    .order-card {
      background: rgba(22, 33, 62, 0.7);
      border: 1.5px solid #0f3460;
      border-radius: 10px;
      padding: 0.55rem 0.7rem;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, transform 0.1s;
      position: relative;
    }
    .order-card.available:hover { background: rgba(34, 197, 94, 0.12); border-color: #22c55e; transform: translateX(-3px); }
    .order-card .hotkey {
      position: absolute;
      top: 0.4rem;
      right: 0.5rem;
      background: rgba(78, 127, 255, 0.25);
      color: #a0c4ff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    .order-card .pay {
      color: #f5d77a;
      font-weight: 700;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 1.05rem;
    }
    .order-card .meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #8ea7d6;
      margin-top: 0.2rem;
      letter-spacing: 0.5px;
    }
    .order-card .timer { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .order-card.active.pickup { border-color: #22c55e; }
    .order-card.active.delivering { border-color: #4e7fff; }
    .order-card .state-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      margin-right: 0.3rem;
    }
    .order-card.pickup .state-badge { background: rgba(34, 197, 94, 0.25); color: #4ade80; }
    .order-card.delivering .state-badge { background: rgba(78, 127, 255, 0.25); color: #93b5ff; }
    .order-card .shelf-bar {
      height: 3px;
      background: rgba(78, 127, 255, 0.18);
      border-radius: 2px;
      margin-top: 0.4rem;
      overflow: hidden;
    }
    .order-card .shelf-bar-fill {
      height: 100%;
      background: #4e7fff;
      transition: width 0.2s linear;
    }
    .order-card.active.urgent { animation: urgentPulse 0.5s ease-in-out infinite alternate; }
    @keyframes urgentPulse {
      from { box-shadow: 0 0 0 rgba(233, 69, 96, 0); }
      to   { box-shadow: 0 0 18px rgba(233, 69, 96, 0.7); }
    }
    .empty-state {
      color: #5a6f9c;
      font-size: 0.82rem;
      font-style: italic;
      padding: 0.4rem 0.2rem;
    }

    /* Toast for delivery success / fail */
    #toast {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.7rem 1.4rem;
      background: rgba(11, 15, 36, 0.95);
      color: #fff;
      border-radius: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      border: 2px solid #22c55e;
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.4);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.fail { border-color: #e94560; box-shadow: 0 0 30px rgba(233, 69, 96, 0.4); }

    /* Faint reset link */
    .reset-link {
      position: fixed;
      bottom: 0.8rem;
      right: 1.2rem;
      color: #555;
      font-size: 0.7rem;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: none;
      border: none;
      padding: 0.4rem 0.7rem;
      font-family: inherit;
      transition: color 0.15s;
      z-index: 25;
    }
    .reset-link:hover { color: #aaa; }

    .controls-hint {
      font-size: 0.72rem;
      color: #6a82a6;
      text-align: center;
      letter-spacing: 1px;
      margin-top: auto;
      padding-top: 0.8rem;
    }
    .controls-hint kbd {
      background: rgba(78, 127, 255, 0.2);
      color: #a0c4ff;
      padding: 1px 5px;
      border-radius: 3px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.72rem;
      margin: 0 1px;
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
  <a href="../games.html" class="back-link">&larr; All Games</a>

  <!-- ============================================================
       MENU SCREEN
       ============================================================ -->
  <div id="menu">
    <h1>Delivery Master</h1>

    <div class="menu-stats">
      <div class="stat-card">
        <div class="label">Cash</div>
        <div class="val" id="menu-cash">$0</div>
      </div>
      <div class="stat-card">
        <div class="label">Deliveries</div>
        <div class="val" id="menu-deliveries">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Best Tip</div>
        <div class="val" id="menu-best-tip">$0</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Garage</div>
      <div id="upgrades-list"></div>
    </div>

    <button class="start-btn" id="start-shift">Start Shift</button>
  </div>

  <!-- ============================================================
       PLAY SCREEN
       ============================================================ -->
  <div id="play" class="hidden">
    <canvas id="game-canvas"></canvas>
    <div id="sidebar">
      <div class="hud-row">
        <span class="lbl">Cash</span>
        <span class="val" id="play-cash">$0</span>
      </div>
      <div class="hud-row">
        <span class="lbl">Active orders</span>
        <span class="val" id="play-active-count">0 / 2</span>
      </div>
      <button class="end-shift-btn" id="end-shift">End Shift</button>

      <div class="section-title">Available</div>
      <div id="available-list"></div>

      <div class="section-title">Active</div>
      <div id="active-list"></div>

      <div class="controls-hint">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> drive ·
        <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> accept
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <button class="reset-link" id="reset" title="Wipe save and start over">reset</button>

  <script>
    // =====================================================================
    // CONSTANTS & STATE
    // =====================================================================
    const STORAGE_KEY = 'horsey:deliverymaster:v1';
    const WORLD_W = 2500, WORLD_H = 2500;
    const BASE_SPEED = 240;       // px/sec
    const BASE_ACCEL = 600;       // px/sec^2
    const BASE_BRAKE = 800;
    const BASE_TURN_RATE = 3.4;   // rad/sec at low speed
    const FRICTION = 0.92;        // per-second decay
    const SPEED_TUNE = 90;        // for time-limit math: dist / SPEED_TUNE + 20
    const PICKUP_RADIUS = 60;     // px proximity to pickup/dropoff
    const MAX_AVAILABLE = 3;      // pool size
    const NEW_ORDER_INTERVAL = 6; // seconds between new orders
    const SHELF_LIFE = 30;        // seconds an available order sits before vanishing

    const UPGRADE_DEFS = [
      {
        id: 'wheels', name: 'Faster wheels',
        desc: 'Top speed +20% per level',
        costs: [500, 2000, 8000],
      },
      {
        id: 'bag', name: 'Bigger bag',
        desc: 'Carry capacity +1 per level',
        costs: [800, 3000, 10000],
      },
      {
        id: 'charisma', name: 'Charisma',
        desc: 'Tip multiplier +0.2 per level',
        costs: [1000, 4000, 12000],
      },
      {
        id: 'steering', name: 'Snappy steering',
        desc: 'Turn rate +30% per level',
        costs: [600, 2500],
      },
    ];

    function defaultState() {
      return {
        cash: 0,
        lifetimeDeliveries: 0,
        bestTip: 0,
        upgrades: { wheels: 0, bag: 0, charisma: 0, steering: 0 },
      };
    }
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const merged = Object.assign(defaultState(), parsed);
          merged.upgrades = Object.assign(defaultState().upgrades, parsed.upgrades || {});
          return merged;
        }
      } catch (_) {}
      return defaultState();
    }
    let state = loadState();
    let saveTimer = null;
    function saveStateDebounced() {
      if (saveTimer) return;
      saveTimer = setTimeout(() => {
        saveTimer = null;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
      }, 250);
    }

    // Computed stats from upgrades
    function maxSpeed()      { return BASE_SPEED * (1 + 0.2 * state.upgrades.wheels); }
    function capacity()      { return Math.min(5, 2 + state.upgrades.bag); }
    function tipMultiplier() { return 1.0 + 0.2 * state.upgrades.charisma; }
    function turnRate()      { return BASE_TURN_RATE * (1 + 0.3 * state.upgrades.steering); }

    // =====================================================================
    // SVG SPRITES (pre-rendered to offscreen canvases)
    // =====================================================================
    function svgToImage(svgString) {
      const img = new Image();
      img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svgString);
      return img;
    }

    // Top-down scooter (faces up in SVG, so heading=0 == "up")
    const SCOOTER_SVG =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 40">' +
        // shadow under
        '<ellipse cx="15" cy="36" rx="11" ry="2" fill="#000" opacity="0.3"/>' +
        // back wheels
        '<rect x="3" y="22" width="4" height="9" rx="1.5" fill="#1a1a1a"/>' +
        '<rect x="23" y="22" width="4" height="9" rx="1.5" fill="#1a1a1a"/>' +
        // pizza box on back
        '<rect x="8" y="26" width="14" height="7" rx="1" fill="#d4a574" stroke="#5a3215" stroke-width="0.5"/>' +
        '<line x1="15" y1="26" x2="15" y2="33" stroke="#5a3215" stroke-width="0.4"/>' +
        // body
        '<rect x="6" y="6" width="18" height="22" rx="5" fill="#e94560" stroke="#7a1a30" stroke-width="0.8"/>' +
        // front wheels
        '<rect x="3" y="8" width="4" height="9" rx="1.5" fill="#1a1a1a"/>' +
        '<rect x="23" y="8" width="4" height="9" rx="1.5" fill="#1a1a1a"/>' +
        // windshield
        '<rect x="9" y="8" width="12" height="6" rx="2" fill="#a0c4ff" opacity="0.65"/>' +
        // driver helmet
        '<circle cx="15" cy="19" r="3.5" fill="#1a1a1a"/>' +
        '<circle cx="14" cy="18" r="1.2" fill="#fff" opacity="0.4"/>' +
        // small headlight glints
        '<circle cx="10" cy="7" r="1.2" fill="#fff" opacity="0.85"/>' +
        '<circle cx="20" cy="7" r="1.2" fill="#fff" opacity="0.85"/>' +
      '</svg>';

    const PICKUP_SVG =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 50">' +
        // glow halo
        '<circle cx="20" cy="25" r="18" fill="none" stroke="#22c55e" stroke-width="2.5" opacity="0.55"/>' +
        '<circle cx="20" cy="25" r="13" fill="rgba(34,197,94,0.18)"/>' +
        // parcel
        '<rect x="11" y="17" width="18" height="16" rx="2" fill="#a0784a" stroke="#5a3215" stroke-width="1.2"/>' +
        // twine cross
        '<line x1="20" y1="17" x2="20" y2="33" stroke="#3a2010" stroke-width="1.4"/>' +
        '<line x1="11" y1="25" x2="29" y2="25" stroke="#3a2010" stroke-width="1.4"/>' +
        // bow knot
        '<circle cx="20" cy="25" r="1.6" fill="#3a2010"/>' +
      '</svg>';

    const DROPOFF_SVG =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 50">' +
        '<circle cx="20" cy="25" r="18" fill="none" stroke="#4e7fff" stroke-width="2.5" opacity="0.55"/>' +
        '<circle cx="20" cy="25" r="13" fill="rgba(78,127,255,0.18)"/>' +
        // arrow above
        '<polygon points="20,6 14,14 17,14 17,17 23,17 23,14 26,14" fill="#fbbf24" stroke="#5a3215" stroke-width="0.8"/>' +
        // house
        '<polygon points="20,17 30,25 28,25 28,34 12,34 12,25 10,25" fill="#fbbf24" stroke="#5a3215" stroke-width="1.2"/>' +
        // door
        '<rect x="18" y="28" width="4" height="6" fill="#5a3215"/>' +
        '<circle cx="21" cy="31" r="0.4" fill="#fbbf24"/>' +
      '</svg>';

    const scooterImg = svgToImage(SCOOTER_SVG);
    const pickupImg  = svgToImage(PICKUP_SVG);
    const dropoffImg = svgToImage(DROPOFF_SVG);

    // =====================================================================
    // CITY GENERATION (Poisson-style rejection sampling for non-grid layout)
    // =====================================================================
    const ROOF_COLORS = ['#a0522d', '#6b7280', '#5f9ea0', '#daa520', '#cd853f', '#9370db', '#dc2626', '#0891b2'];

    let buildings = [];   // [{x, y, w, h, roof, windows}]
    let cityCanvas = null;

    function generateCity() {
      buildings = [];
      const minDist = 110;
      const targetCount = 150;
      let attempts = 0;
      const maxAttempts = 6000;

      while (buildings.length < targetCount && attempts < maxAttempts) {
        attempts++;
        const w = 60 + Math.random() * 80;
        const h = 60 + Math.random() * 80;
        const x = 150 + Math.random() * (WORLD_W - 300 - w);
        const y = 150 + Math.random() * (WORLD_H - 300 - h);
        const cx = x + w / 2, cy = y + h / 2;

        let ok = true;
        for (const b of buildings) {
          const bcx = b.x + b.w / 2, bcy = b.y + b.h / 2;
          if (Math.hypot(cx - bcx, cy - bcy) < minDist) { ok = false; break; }
        }
        if (ok) {
          buildings.push({
            x, y, w, h,
            roof: ROOF_COLORS[Math.floor(Math.random() * ROOF_COLORS.length)],
            shade: 0.7 + Math.random() * 0.3,
            windows: Math.floor(3 + Math.random() * 7),
          });
        }
      }

      // Pre-render the whole city to an offscreen canvas — drawn once per shift.
      cityCanvas = document.createElement('canvas');
      cityCanvas.width = WORLD_W;
      cityCanvas.height = WORLD_H;
      const c = cityCanvas.getContext('2d');

      // road/ground base
      c.fillStyle = '#2f3445';
      c.fillRect(0, 0, WORLD_W, WORLD_H);

      // subtle road texture stripes (mild diagonal hatching)
      c.strokeStyle = 'rgba(255,255,255,0.02)';
      c.lineWidth = 1;
      for (let i = -WORLD_H; i < WORLD_W; i += 30) {
        c.beginPath(); c.moveTo(i, 0); c.lineTo(i + WORLD_H, WORLD_H); c.stroke();
      }

      // world border (so the car can't escape visually)
      c.strokeStyle = '#4e7fff';
      c.lineWidth = 6;
      c.strokeRect(40, 40, WORLD_W - 80, WORLD_H - 80);

      // buildings
      for (const b of buildings) {
        // building shadow
        c.fillStyle = 'rgba(0,0,0,0.35)';
        c.fillRect(b.x + 4, b.y + 4, b.w, b.h);
        // walls
        c.fillStyle = '#3a3f55';
        c.fillRect(b.x, b.y, b.w, b.h);
        // roof
        const roof = b.roof;
        c.fillStyle = roof;
        c.globalAlpha = b.shade;
        c.fillRect(b.x + 2, b.y + 2, b.w - 4, b.h * 0.55);
        c.globalAlpha = 1;
        // roof edge
        c.strokeStyle = 'rgba(0,0,0,0.4)';
        c.lineWidth = 1;
        c.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h * 0.55);
        // windows (dots on the front face)
        c.fillStyle = '#fde68a';
        const rows = 2, cols = Math.min(b.windows, 6);
        const wx0 = b.x + 8;
        const wy0 = b.y + b.h * 0.6;
        const ww = (b.w - 16) / cols;
        const wh = (b.h * 0.35) / rows;
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            if (Math.random() < 0.7) {
              c.globalAlpha = 0.6 + Math.random() * 0.4;
              c.fillRect(wx0 + col * ww + ww * 0.2, wy0 + row * wh + wh * 0.2, ww * 0.6, wh * 0.6);
            }
          }
        }
        c.globalAlpha = 1;
        // outer outline
        c.strokeStyle = 'rgba(0,0,0,0.5)';
        c.lineWidth = 1.5;
        c.strokeRect(b.x, b.y, b.w, b.h);
      }
    }

    function buildingCenter(b) { return { x: b.x + b.w / 2, y: b.y + b.h / 2 }; }

    // Pick a random building, optionally excluding indices.
    function pickBuilding(exclude) {
      if (buildings.length === 0) return -1;
      let idx;
      let tries = 0;
      do {
        idx = Math.floor(Math.random() * buildings.length);
        tries++;
      } while (exclude && exclude.includes(idx) && tries < 20);
      return idx;
    }

    // =====================================================================
    // CAR
    // =====================================================================
    const CAR_W = 26, CAR_H = 36;
    const car = { x: 0, y: 0, heading: 0, speed: 0 };
    function resetCar() {
      // spawn at a safe spot: try centers of map, find non-colliding
      const tryPositions = [
        [WORLD_W / 2, WORLD_H / 2],
        [WORLD_W * 0.3, WORLD_H * 0.5],
        [WORLD_W * 0.7, WORLD_H * 0.5],
        [WORLD_W * 0.5, WORLD_H * 0.3],
        [WORLD_W * 0.5, WORLD_H * 0.7],
      ];
      for (const [x, y] of tryPositions) {
        if (!carCollidesAt(x, y)) {
          car.x = x; car.y = y;
          car.heading = 0; car.speed = 0;
          return;
        }
      }
      // fallback: brute search
      for (let i = 0; i < 200; i++) {
        const x = 200 + Math.random() * (WORLD_W - 400);
        const y = 200 + Math.random() * (WORLD_H - 400);
        if (!carCollidesAt(x, y)) {
          car.x = x; car.y = y;
          car.heading = 0; car.speed = 0;
          return;
        }
      }
    }

    function carCollidesAt(x, y) {
      const halfW = CAR_W / 2, halfH = CAR_H / 2;
      // Use the larger of W/H as the half-side to keep collision conservative under rotation.
      const r = Math.max(halfW, halfH);
      for (const b of buildings) {
        if (x - r < b.x + b.w && x + r > b.x && y - r < b.y + b.h && y + r > b.y) {
          return true;
        }
      }
      return false;
    }

    function updateCar(dt) {
      const keys = input;
      // steering
      const steerFactor = Math.min(1, 0.4 + Math.abs(car.speed) / maxSpeed());
      const turn = turnRate() * dt * steerFactor;
      if (keys.a) car.heading -= turn;
      if (keys.d) car.heading += turn;

      // throttle
      if (keys.w) car.speed += BASE_ACCEL * dt;
      if (keys.s) car.speed -= BASE_BRAKE * dt;

      // friction (when no input on throttle axis)
      if (!keys.w && !keys.s) {
        const decay = Math.pow(FRICTION, dt);
        car.speed *= decay;
        if (Math.abs(car.speed) < 4) car.speed = 0;
      }

      const ms = maxSpeed();
      if (car.speed > ms) car.speed = ms;
      if (car.speed < -ms * 0.5) car.speed = -ms * 0.5;

      // Move; resolve collisions on each axis independently so you can slide along walls.
      const dx = Math.sin(car.heading) * car.speed * dt;
      const dy = -Math.cos(car.heading) * car.speed * dt;

      // X axis
      const nextX = car.x + dx;
      if (!carCollidesAt(nextX, car.y) && nextX > 80 && nextX < WORLD_W - 80) {
        car.x = nextX;
      } else {
        car.speed *= 0.25; // bonk damping
      }
      // Y axis
      const nextY = car.y + dy;
      if (!carCollidesAt(car.x, nextY) && nextY > 80 && nextY < WORLD_H - 80) {
        car.y = nextY;
      } else {
        car.speed *= 0.25;
      }
    }

    // =====================================================================
    // INPUT
    // =====================================================================
    const input = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', (e) => {
      if (gameState !== 'playing') return;
      const k = e.key.toLowerCase();
      if (k === 'w') input.w = true;
      else if (k === 'a') input.a = true;
      else if (k === 's') input.s = true;
      else if (k === 'd') input.d = true;
      else if (k === '1' || k === '2' || k === '3') acceptByIndex(parseInt(k, 10) - 1);
      else if (k === 'arrowup') input.w = true;
      else if (k === 'arrowleft') input.a = true;
      else if (k === 'arrowdown') input.s = true;
      else if (k === 'arrowright') input.d = true;
      if (['w','a','s','d','1','2','3'].includes(k) || k.startsWith('arrow')) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') input.w = false;
      else if (k === 'a' || k === 'arrowleft') input.a = false;
      else if (k === 's' || k === 'arrowdown') input.s = false;
      else if (k === 'd' || k === 'arrowright') input.d = false;
    });
    // Drop inputs if window loses focus
    window.addEventListener('blur', () => { input.w = input.a = input.s = input.d = false; });

    // =====================================================================
    // ORDERS
    // =====================================================================
    let nextOrderId = 1;
    let availableOrders = [];
    let activeOrders = [];
    let timeSinceLastSpawn = 0;

    function makeOrder() {
      if (buildings.length < 2) return null;
      const pickupIdx = pickBuilding();
      const dropoffIdx = pickBuilding([pickupIdx]);
      if (pickupIdx < 0 || dropoffIdx < 0 || pickupIdx === dropoffIdx) return null;
      const a = buildingCenter(buildings[pickupIdx]);
      const b = buildingCenter(buildings[dropoffIdx]);
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const basePay = Math.round(dist * 0.05) + 5;
      const timeLimit = dist / SPEED_TUNE + 20;
      return {
        id: nextOrderId++,
        pickupIdx, dropoffIdx,
        basePay, timeLimit,
        timeRemaining: timeLimit,
        state: 'available',
        shelf: SHELF_LIFE,
      };
    }

    function updateOrders(dt) {
      timeSinceLastSpawn += dt;
      if (timeSinceLastSpawn >= NEW_ORDER_INTERVAL && availableOrders.length < MAX_AVAILABLE) {
        const o = makeOrder();
        if (o) availableOrders.push(o);
        timeSinceLastSpawn = 0;
      }

      // tick shelf life on available
      for (let i = availableOrders.length - 1; i >= 0; i--) {
        availableOrders[i].shelf -= dt;
        if (availableOrders[i].shelf <= 0) {
          availableOrders.splice(i, 1);
          renderAvailable();
        }
      }

      // tick active timers + check proximity
      for (let i = activeOrders.length - 1; i >= 0; i--) {
        const o = activeOrders[i];
        o.timeRemaining -= dt;
        if (o.timeRemaining <= 0) {
          showToast('Order failed!', true);
          playFail();
          activeOrders.splice(i, 1);
          renderActive();
          continue;
        }
        const target = o.state === 'picking-up'
          ? buildingCenter(buildings[o.pickupIdx])
          : buildingCenter(buildings[o.dropoffIdx]);
        const d = Math.hypot(car.x - target.x, car.y - target.y);
        if (d <= PICKUP_RADIUS) {
          if (o.state === 'picking-up') {
            o.state = 'delivering';
            showToast('Picked up!');
            playBell();
            renderActive();
          } else if (o.state === 'delivering') {
            const tip = Math.round(o.basePay * tipMultiplier() * (o.timeRemaining / o.timeLimit));
            const total = o.basePay + tip;
            state.cash += total;
            state.lifetimeDeliveries++;
            if (tip > state.bestTip) state.bestTip = tip;
            showToast('Delivered! +$' + total + ' (tip $' + tip + ')');
            playChime();
            saveStateDebounced();
            activeOrders.splice(i, 1);
            renderActive();
            renderHud();
          }
        }
      }
    }

    function acceptByIndex(idx) {
      if (idx < 0 || idx >= availableOrders.length) return;
      if (activeOrders.length >= capacity()) {
        showToast('At capacity (' + capacity() + ')', true);
        return;
      }
      const o = availableOrders.splice(idx, 1)[0];
      o.state = 'picking-up';
      o.timeRemaining = o.timeLimit;
      activeOrders.push(o);
      playBlip();
      renderAvailable();
      renderActive();
      renderHud();
    }

    // =====================================================================
    // RENDER
    // =====================================================================
    const gameCanvas = document.getElementById('game-canvas');
    const gameCtx = gameCanvas.getContext('2d');
    let viewportW = 0, viewportH = 0;
    let cameraX = 0, cameraY = 0;

    function resizeGameCanvas() {
      viewportW = gameCanvas.clientWidth;
      viewportH = gameCanvas.clientHeight;
      gameCanvas.width = viewportW;
      gameCanvas.height = viewportH;
    }

    function updateCamera(dt) {
      const targetX = car.x - viewportW / 2;
      const targetY = car.y - viewportH / 2;
      cameraX += (targetX - cameraX) * Math.min(1, 8 * dt);
      cameraY += (targetY - cameraY) * Math.min(1, 8 * dt);
      // clamp
      cameraX = Math.max(0, Math.min(WORLD_W - viewportW, cameraX));
      cameraY = Math.max(0, Math.min(WORLD_H - viewportH, cameraY));
    }

    let renderTick = 0;
    function render() {
      renderTick++;
      const ctx = gameCtx;
      ctx.clearRect(0, 0, viewportW, viewportH);
      ctx.save();
      ctx.translate(-cameraX, -cameraY);

      // city
      if (cityCanvas) ctx.drawImage(cityCanvas, 0, 0);

      // markers for active orders (pickup or dropoff depending on state)
      const pulse = 1 + Math.sin(renderTick * 0.12) * 0.08;
      for (const o of activeOrders) {
        const b = o.state === 'picking-up' ? buildings[o.pickupIdx] : buildings[o.dropoffIdx];
        const center = buildingCenter(b);
        const img = o.state === 'picking-up' ? pickupImg : dropoffImg;
        const size = 50 * pulse;
        if (img.complete) {
          ctx.drawImage(img, center.x - size / 2, center.y - size - 10, size, size);
        }
      }

      // car (rotated)
      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.heading);
      if (scooterImg.complete) {
        ctx.drawImage(scooterImg, -CAR_W / 2, -CAR_H / 2, CAR_W, CAR_H);
      }
      ctx.restore();

      ctx.restore();
    }

    // =====================================================================
    // GAME LOOP
    // =====================================================================
    let gameState = 'menu'; // 'menu' | 'playing'
    let lastFrame = performance.now();
    function loop() {
      const now = performance.now();
      let dt = (now - lastFrame) / 1000;
      if (dt > 0.05) dt = 0.05; // cap
      lastFrame = now;

      if (gameState === 'playing') {
        updateCar(dt);
        updateOrders(dt);
        updateCamera(dt);
        render();
        // tick the timer display in the sidebar (every ~250ms)
        sidebarTickAccumulator += dt;
        if (sidebarTickAccumulator >= 0.25) {
          sidebarTickAccumulator = 0;
          renderTimers();
        }
      }

      requestAnimationFrame(loop);
    }
    let sidebarTickAccumulator = 0;

    // =====================================================================
    // SIDEBAR / HUD RENDERING
    // =====================================================================
    const availableListEl = document.getElementById('available-list');
    const activeListEl    = document.getElementById('active-list');
    const playCashEl      = document.getElementById('play-cash');
    const playActiveCountEl = document.getElementById('play-active-count');

    function dollar(n) { return '$' + Math.floor(n).toLocaleString(); }

    function renderHud() {
      playCashEl.textContent = dollar(state.cash);
      playActiveCountEl.textContent = activeOrders.length + ' / ' + capacity();
    }

    function renderAvailable() {
      availableListEl.innerHTML = '';
      if (availableOrders.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'Scanning for orders…';
        availableListEl.appendChild(empty);
        return;
      }
      for (let i = 0; i < availableOrders.length; i++) {
        const o = availableOrders[i];
        const a = buildingCenter(buildings[o.pickupIdx]);
        const b = buildingCenter(buildings[o.dropoffIdx]);
        const dist = Math.round(Math.hypot(a.x - b.x, a.y - b.y));
        const card = document.createElement('div');
        card.className = 'order-card available';
        card.innerHTML =
          '<div class="hotkey">' + (i + 1) + '</div>' +
          '<div class="pay">$' + o.basePay + '</div>' +
          '<div class="meta">' +
            '<span>📍 ' + dist + ' px</span>' +
            '<span>⏱ ' + Math.round(o.timeLimit) + 's</span>' +
          '</div>' +
          '<div class="shelf-bar"><div class="shelf-bar-fill" style="width: ' + Math.max(0, o.shelf / SHELF_LIFE * 100) + '%"></div></div>';
        card.addEventListener('click', () => acceptByIndex(i));
        availableListEl.appendChild(card);
      }
    }

    function renderActive() {
      activeListEl.innerHTML = '';
      if (activeOrders.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No active orders';
        activeListEl.appendChild(empty);
        return;
      }
      for (const o of activeOrders) {
        const card = document.createElement('div');
        card.className = 'order-card active ' + (o.state === 'picking-up' ? 'pickup' : 'delivering');
        if (o.timeRemaining < 10) card.classList.add('urgent');
        card.dataset.orderId = o.id;
        card.innerHTML =
          '<div class="pay">$' + o.basePay + '</div>' +
          '<div class="meta">' +
            '<span><span class="state-badge">' + (o.state === 'picking-up' ? '📦 Pickup' : '🏠 Dropoff') + '</span></span>' +
            '<span class="timer">⏱ ' + Math.ceil(o.timeRemaining) + 's</span>' +
          '</div>';
        activeListEl.appendChild(card);
      }
    }

    // Cheap in-place update of just the timer text + urgent class (no full re-render).
    function renderTimers() {
      for (const o of activeOrders) {
        const card = activeListEl.querySelector('[data-order-id="' + o.id + '"]');
        if (!card) continue;
        const timer = card.querySelector('.timer');
        if (timer) timer.textContent = '⏱ ' + Math.ceil(o.timeRemaining) + 's';
        if (o.timeRemaining < 10 && !card.classList.contains('urgent')) card.classList.add('urgent');
      }
      // also refresh shelf bars on available
      const cards = availableListEl.querySelectorAll('.order-card.available');
      for (let i = 0; i < cards.length && i < availableOrders.length; i++) {
        const fill = cards[i].querySelector('.shelf-bar-fill');
        if (fill) fill.style.width = Math.max(0, availableOrders[i].shelf / SHELF_LIFE * 100) + '%';
      }
    }

    // =====================================================================
    // TOAST
    // =====================================================================
    const toastEl = document.getElementById('toast');
    let toastTimer = null;
    function showToast(msg, fail) {
      toastEl.textContent = msg;
      toastEl.classList.remove('fail');
      if (fail) toastEl.classList.add('fail');
      toastEl.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
    }

    // =====================================================================
    // SOUND (Web Audio)
    // =====================================================================
    let audioCtx = null;
    function ensureAudio() {
      if (audioCtx) return;
      try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); } catch (_) {}
    }
    function blip(freqStart, freqEnd, dur, vol, type) {
      ensureAudio(); if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'triangle';
      osc.frequency.setValueAtTime(freqStart, t);
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, freqEnd), t + dur);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(vol, t + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }
    function playBlip()  { blip(550, 720, 0.08, 0.15, 'triangle'); }
    function playBell()  { blip(820, 1100, 0.16, 0.16, 'sine'); blip(1240, 1240, 0.18, 0.08, 'triangle'); }
    function playChime() { blip(660, 660, 0.12, 0.16, 'sine'); setTimeout(() => blip(880, 880, 0.12, 0.16, 'sine'), 70); setTimeout(() => blip(1100, 1100, 0.2, 0.15, 'sine'), 140); }
    function playFail()  { blip(220, 110, 0.22, 0.18, 'sawtooth'); }
    function playPurchase() { blip(440, 880, 0.12, 0.13, 'sine'); }

    // =====================================================================
    // MENU: stats + upgrades
    // =====================================================================
    const menuCashEl = document.getElementById('menu-cash');
    const menuDeliveriesEl = document.getElementById('menu-deliveries');
    const menuBestTipEl = document.getElementById('menu-best-tip');
    const upgradesListEl = document.getElementById('upgrades-list');

    function upgradeCost(def) {
      const lvl = state.upgrades[def.id];
      if (lvl >= def.costs.length) return null;
      return def.costs[lvl];
    }
    function isMaxed(def) { return state.upgrades[def.id] >= def.costs.length; }

    function renderMenu() {
      menuCashEl.textContent = dollar(state.cash);
      menuDeliveriesEl.textContent = state.lifetimeDeliveries.toLocaleString();
      menuBestTipEl.textContent = dollar(state.bestTip);
      upgradesListEl.innerHTML = '';
      for (const def of UPGRADE_DEFS) {
        const lvl = state.upgrades[def.id];
        const maxLvl = def.costs.length;
        const cost = upgradeCost(def);
        const row = document.createElement('div');
        row.className = 'upgrade';
        if (isMaxed(def)) row.classList.add('maxed');
        else if (state.cash >= cost) row.classList.add('affordable');
        row.innerHTML =
          '<div class="info">' +
            '<div class="name">' + def.name + '</div>' +
            '<div class="desc">' + def.desc + '</div>' +
            '<div class="level">Level ' + lvl + ' / ' + maxLvl + '</div>' +
          '</div>' +
          (isMaxed(def)
            ? '<button disabled>MAX</button>'
            : '<button data-id="' + def.id + '">$' + cost.toLocaleString() + '</button>');
        upgradesListEl.appendChild(row);
      }
      // wire purchase buttons
      upgradesListEl.querySelectorAll('button[data-id]').forEach(btn => {
        btn.addEventListener('click', () => buyUpgrade(btn.dataset.id));
      });
    }

    function buyUpgrade(id) {
      const def = UPGRADE_DEFS.find(d => d.id === id);
      if (!def || isMaxed(def)) return;
      const cost = upgradeCost(def);
      if (state.cash < cost) return;
      state.cash -= cost;
      state.upgrades[id]++;
      saveStateDebounced();
      renderMenu();
      playPurchase();
    }

    // =====================================================================
    // SHIFT FLOW
    // =====================================================================
    const menuEl = document.getElementById('menu');
    const playEl = document.getElementById('play');

    function startShift() {
      ensureAudio();
      generateCity();
      resetCar();
      availableOrders = [];
      activeOrders = [];
      nextOrderId = 1;
      timeSinceLastSpawn = NEW_ORDER_INTERVAL - 1; // first order spawns ~1s in
      cameraX = car.x - viewportW / 2;
      cameraY = car.y - viewportH / 2;
      gameState = 'playing';
      menuEl.classList.add('hidden');
      playEl.classList.remove('hidden');
      resizeGameCanvas();
      renderHud();
      renderAvailable();
      renderActive();
    }
    function endShift() {
      gameState = 'menu';
      playEl.classList.add('hidden');
      menuEl.classList.remove('hidden');
      input.w = input.a = input.s = input.d = false;
      saveStateDebounced();
      renderMenu();
    }

    document.getElementById('start-shift').addEventListener('click', startShift);
    document.getElementById('end-shift').addEventListener('click', endShift);
    document.getElementById('reset').addEventListener('click', () => {
      if (!confirm('Reset ALL progress (cash + upgrades)?')) return;
      try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
      state = defaultState();
      renderMenu();
    });

    window.addEventListener('resize', () => {
      if (gameState === 'playing') resizeGameCanvas();
    });

    // =====================================================================
    // INIT
    // =====================================================================
    renderMenu();
    resizeGameCanvas();
    requestAnimationFrame(loop);

    // TODO: vehicle types (scooter / car / van) — would change SCOOTER_SVG + base stats
    // TODO: traffic / pedestrians as moving obstacles
    // TODO: weather / day-night cycle
    // TODO: achievements
    // TODO: shift-based scoring with end screen
  </script>
  <script src="../bg.js"></script>
</body>
</html>
