<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Master - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      background: #0b0f24;
      overflow: hidden;
      justify-content: flex-start;
      padding-top: 0;
    }

    /* --- constellation bg + vignette (shared visual frame) --- */
    canvas#bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    }
    .back-link { z-index: 30; }

    .hidden { display: none !important; }

    /* === MENU SCREEN === */
    #menu {
      position: relative;
      z-index: 5;
      padding-top: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 720px;
      gap: 1.5rem;
      margin: 0 auto;
      animation: fadeIn 0.9s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #menu h1 {
      font-size: 3rem;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #a0c4ff 0%, #4e7fff 35%, #c7a0ff 70%, #a0c4ff 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 5s ease-in-out infinite, float 6s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(78, 127, 255, 0.4));
      margin-bottom: 0.2rem;
    }
    @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    .menu-stats {
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .stat-card {
      background: rgba(11, 15, 36, 0.55);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(78, 127, 255, 0.2);
      border-radius: 14px;
      padding: 0.9rem 1.4rem;
      min-width: 140px;
      text-align: center;
    }
    .stat-card .label {
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #8ea7d6;
      margin-bottom: 0.35rem;
    }
    .stat-card .val {
      font-size: 1.6rem;
      font-weight: 700;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      color: #f5d77a;
    }

    .panel {
      background: rgba(11, 15, 36, 0.55);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(78, 127, 255, 0.18);
      border-radius: 16px;
      padding: 1.2rem 1.4rem;
      width: 100%;
    }
    .panel-title {
      color: #a0c4ff;
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
      border-bottom: 1px solid rgba(78, 127, 255, 0.25);
      padding-bottom: 0.4rem;
      font-weight: 700;
    }

    /* Upgrades inside Garage panel */
    .upgrade {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.6rem 0.7rem;
      background: rgba(22, 33, 62, 0.5);
      border: 1.5px solid #0f3460;
      border-radius: 10px;
      margin-bottom: 0.5rem;
      transition: background 0.15s, border-color 0.15s;
    }
    .upgrade:hover { background: rgba(15, 52, 96, 0.6); }
    .upgrade.affordable { border-color: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,0.18); }
    .upgrade.maxed { opacity: 0.55; }

    .upgrade .info { flex: 1; min-width: 0; }
    .upgrade .name { font-weight: 700; color: #fff; font-size: 0.95rem; letter-spacing: 0.5px; }
    .upgrade .desc { font-size: 0.78rem; color: #98a8c5; font-style: italic; margin-top: 1px; }
    .upgrade .level { font-size: 0.72rem; color: #aaa; letter-spacing: 1px; margin-top: 2px; }

    .upgrade button {
      background: linear-gradient(135deg, #4e7fff, #345edb);
      color: #fff;
      border: none;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 1px;
      transition: transform 0.1s, box-shadow 0.15s;
      min-width: 80px;
    }
    .upgrade button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(78, 127, 255, 0.4);
    }
    .upgrade button:disabled { opacity: 0.45; cursor: not-allowed; background: #2a3550; }
    .upgrade.maxed button { background: #444; }

    .start-btn {
      padding: 1rem 3rem;
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #fff;
      border: 2px solid #15803d;
      border-radius: 14px;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
      box-shadow: 0 8px 24px rgba(34, 197, 94, 0.4);
      margin-top: 0.5rem;
    }
    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(34, 197, 94, 0.55);
    }
    .start-btn:active { transform: translateY(0); }

    /* === PLAY SCREEN === */
    #play {
      position: fixed;
      inset: 0;
      display: flex;
      z-index: 10;
      background: #1a1a2e;
    }

    #game-canvas {
      flex: 1;
      display: block;
      background: #2a2f3e;
      cursor: crosshair;
    }

    #sidebar {
      width: 320px;
      flex-shrink: 0;
      background: rgba(11, 15, 36, 0.95);
      border-left: 1px solid rgba(78, 127, 255, 0.25);
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 0.8rem;
      overflow-y: auto;
      color: #ddd;
      font-family: sans-serif;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(78, 127, 255, 0.12);
      font-size: 0.9rem;
    }
    .hud-row .lbl { color: #8ea7d6; letter-spacing: 1px; text-transform: uppercase; font-size: 0.7rem; }
    .hud-row .val { color: #f5d77a; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; font-size: 1rem; }

    .end-shift-btn {
      padding: 0.5rem;
      background: linear-gradient(135deg, #e94560, #b73247);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: inherit;
      font-size: 0.8rem;
      transition: transform 0.1s, box-shadow 0.15s;
    }
    .end-shift-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(233, 69, 96, 0.4);
    }

    .section-title {
      color: #a0c4ff;
      font-size: 0.7rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 0.4rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid rgba(78, 127, 255, 0.18);
    }

    .order-card {
      background: rgba(22, 33, 62, 0.7);
      border: 1.5px solid #0f3460;
      border-radius: 10px;
      padding: 0.55rem 0.7rem;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, transform 0.1s;
      position: relative;
    }
    .order-card.available { background: rgba(34, 197, 94, 0.08); border-color: rgba(34, 197, 94, 0.55); }
    .order-card .order-available {
      color: #4ade80;
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 0.35rem;
      text-align: center;
    }
    .order-actions {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }
    .order-actions button {
      flex: 1;
      padding: 0.45rem 0.4rem;
      border: none;
      border-radius: 7px;
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.1s, box-shadow 0.15s;
    }
    .order-actions button:hover { transform: translateY(-1px); }
    .accept-btn {
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #fff;
      box-shadow: 0 2px 8px rgba(34, 197, 94, 0.35);
    }
    .decline-btn {
      background: rgba(80, 100, 140, 0.55);
      color: #cbd2e0;
      border: 1px solid #444b60 !important;
    }
    .order-card .hotkey {
      position: absolute;
      top: 0.4rem;
      right: 0.5rem;
      background: rgba(78, 127, 255, 0.25);
      color: #a0c4ff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    .order-card .pay {
      color: #f5d77a;
      font-weight: 700;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 1.05rem;
    }
    .order-card .meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #8ea7d6;
      margin-top: 0.2rem;
      letter-spacing: 0.5px;
    }
    .order-card .timer { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .order-card.active.pickup { border-color: #22c55e; }
    .order-card.active.delivering { border-color: #4e7fff; }
    .order-card .state-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      margin-right: 0.3rem;
    }
    .order-card.pickup .state-badge { background: rgba(34, 197, 94, 0.25); color: #4ade80; }
    .order-card.delivering .state-badge { background: rgba(78, 127, 255, 0.25); color: #93b5ff; }
    .order-card .shelf-bar {
      height: 3px;
      background: rgba(78, 127, 255, 0.18);
      border-radius: 2px;
      margin-top: 0.4rem;
      overflow: hidden;
    }
    .order-card .shelf-bar-fill {
      height: 100%;
      background: #4e7fff;
      transition: width 0.2s linear;
    }
    .order-card.active.urgent { animation: urgentPulse 0.5s ease-in-out infinite alternate; }
    @keyframes urgentPulse {
      from { box-shadow: 0 0 0 rgba(233, 69, 96, 0); }
      to   { box-shadow: 0 0 18px rgba(233, 69, 96, 0.7); }
    }
    .empty-state {
      color: #5a6f9c;
      font-size: 0.82rem;
      font-style: italic;
      padding: 0.4rem 0.2rem;
    }

    /* En-route card: shows the upcoming restaurant + item */
    .order-card .restaurant-line {
      font-size: 0.8rem;
      color: #b0b8ce;
      margin-top: 0.35rem;
      font-style: italic;
    }
    .order-card .restaurant-line strong { color: #e6ebf5; font-style: normal; font-weight: 700; }

    /* Food card: "Restaurant: item — $price" */
    .order-card.delivering .food-line {
      margin-bottom: 0.25rem;
      font-size: 0.92rem;
      line-height: 1.25;
    }
    .order-card.delivering .food-restaurant { color: #fff; font-weight: 800; }
    .order-card.delivering .food-item       { color: #cbd2e0; }
    .order-card.delivering .food-price {
      margin-top: 0.35rem;
      text-align: right;
      color: #f5d77a;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .order-card.delivering .food-breakdown {
      font-size: 0.68rem;
      color: #8ea7d6;
      text-align: right;
      letter-spacing: 0.4px;
    }

    /* "Pick up" / "Drop off" prompt — only visible when within range of an
       active order's current target. Clickable, or press E. */
    .interact-btn {
      position: fixed;
      bottom: 5rem;
      left: calc(50% - 160px);   /* center over the canvas, not the sidebar */
      transform: translateX(-50%);
      padding: 0.85rem 1.8rem;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #22c55e, #15803d);
      border: 3px solid #15803d;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 22px rgba(34, 197, 94, 0.55);
      z-index: 28;
      font-family: inherit;
      animation: interactPulse 1.4s ease-in-out infinite;
    }
    .interact-btn:hover { transform: translateX(-50%) translateY(-2px); }
    .interact-btn.dropoff {
      background: linear-gradient(135deg, #4e7fff, #2e5dc7);
      border-color: #2e5dc7;
      box-shadow: 0 6px 22px rgba(78, 127, 255, 0.55);
    }
    .interact-btn .key-hint {
      display: inline-block;
      background: rgba(0,0,0,0.25);
      padding: 1px 7px;
      border-radius: 4px;
      font-size: 0.85rem;
      margin-left: 0.5rem;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    @keyframes interactPulse {
      0%, 100% { box-shadow: 0 6px 22px rgba(34, 197, 94, 0.55); }
      50%      { box-shadow: 0 6px 32px rgba(34, 197, 94, 0.85); }
    }

    /* Toast for delivery success / fail */
    #toast {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.7rem 1.4rem;
      background: rgba(11, 15, 36, 0.95);
      color: #fff;
      border-radius: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      border: 2px solid #22c55e;
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.4);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.fail { border-color: #e94560; box-shadow: 0 0 30px rgba(233, 69, 96, 0.4); }

    /* Faint reset link */
    .reset-link {
      position: fixed;
      bottom: 0.8rem;
      right: 1.2rem;
      color: #555;
      font-size: 0.7rem;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: none;
      border: none;
      padding: 0.4rem 0.7rem;
      font-family: inherit;
      transition: color 0.15s;
      z-index: 25;
    }
    .reset-link:hover { color: #aaa; }

    .controls-hint {
      font-size: 0.72rem;
      color: #6a82a6;
      text-align: center;
      letter-spacing: 1px;
      margin-top: auto;
      padding-top: 0.8rem;
    }
    .controls-hint kbd {
      background: rgba(78, 127, 255, 0.2);
      color: #a0c4ff;
      padding: 1px 5px;
      border-radius: 3px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.72rem;
      margin: 0 1px;
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
  <a href="../games.html" class="back-link">&larr; All Games</a>

  <!-- ============================================================
       MENU SCREEN
       ============================================================ -->
  <div id="menu">
    <h1>Delivery Master</h1>

    <div class="menu-stats">
      <div class="stat-card">
        <div class="label">Cash</div>
        <div class="val" id="menu-cash">$0</div>
      </div>
      <div class="stat-card">
        <div class="label">Deliveries</div>
        <div class="val" id="menu-deliveries">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Best Tip</div>
        <div class="val" id="menu-best-tip">$0</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Garage</div>
      <div id="upgrades-list"></div>
    </div>

    <button class="start-btn" id="start-shift">Start Shift</button>
  </div>

  <!-- ============================================================
       PLAY SCREEN
       ============================================================ -->
  <div id="play" class="hidden">
    <canvas id="game-canvas"></canvas>
    <button class="interact-btn hidden" id="interact-btn">Pick up</button>
    <div id="sidebar">
      <div class="hud-row">
        <span class="lbl">Cash</span>
        <span class="val" id="play-cash">$0</span>
      </div>
      <div class="hud-row">
        <span class="lbl">Carrying</span>
        <span class="val" id="play-carry">0 / 1</span>
      </div>
      <div class="hud-row">
        <span class="lbl">Active orders</span>
        <span class="val" id="play-active-count">0</span>
      </div>
      <div class="hud-row" id="energy-row" style="display:none;">
        <span class="lbl">⚡ Energy</span>
        <span class="val" id="play-energy">0s</span>
      </div>
      <button class="end-shift-btn" id="end-shift">End Shift</button>

      <div class="section-title">Available</div>
      <div id="available-list"></div>

      <div class="section-title">En route</div>
      <div id="enroute-list"></div>

      <div class="section-title">Food</div>
      <div id="food-list"></div>

      <div class="controls-hint">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move ·
        <kbd>E</kbd> pick&nbsp;up / drop&nbsp;off
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <button class="reset-link" id="reset" title="Wipe save and start over">reset</button>

  <script>
    // =====================================================================
    // CONSTANTS & STATE
    // =====================================================================
    const STORAGE_KEY = 'horsey:deliverymaster:v1';
    const WORLD_W = 2500, WORLD_H = 2500;
    const BASE_SPEED = 130;       // px/sec — car top speed (once you upgrade to a car)
    const WALK_SPEED = 39;        // px/sec — on foot: ~70% slower than the car
    const ENERGY_MS = 5 * 60 * 1000;   // energy drink boost lasts 5 real minutes
    const BASE_ACCEL = 240;       // px/sec^2 — gentler ramp to top speed
    const BASE_BRAKE = 360;
    const BASE_TURN_RATE = 3.0;   // rad/sec
    const FRICTION = 0.55;        // per-second decay — coasts to a stop noticeably
    const PICKUP_RADIUS = 80;     // px proximity to pickup/dropoff
    // Per-second order spawn — 1-in-35 each tick of the wall clock. If
    // you decline an order you just wait for the next roll, no
    // auto-refill. Player asked for it scarce.
    const ORDER_SPAWN_DENOM = 35;
    const TIP_CHANCE_BASE   = 0.40;        // 40% chance of any tip at all
    const TIP_PCT_MIN = 0.05;              // 5%
    const TIP_PCT_MAX = 0.10;              // 10%
    const OFFROAD_SPEED_MULT = 0.25;       // off-road = 25% of normal top speed
    const INTERSECTION_HALF = 40;          // red-light stop-box half size (px)
    const STOP_SIGN_HALF    = 14;          // stop-sign solid-block half size (px)
    const STOP_SIGN_CHANCE  = 0.25;        // probability per narrow ↔ narrow junction
    const STOP_SIGN_MIN_DIST = 320;        // signs at least this far apart (px)
    const SHELF_MIN = 15;                  // seconds before a competing deliverer steals the order
    const SHELF_MAX = 30;
    const DELIVERER_NAMES = [
      'Bob', 'Fred', 'Joe', 'James',
      'Hedge', 'Bobbyjoefred', 'Horsecat',
      'Jayden', 'Xuwusnfksufnskjbdhbgayes',
    ];

    // Garage shop. Two kinds of items:
    //  - leveled (has `costs[]`): buy repeatedly until the array runs out.
    //  - special (`type`): the energy drink is a repeatable consumable, and
    //    the motorcycle is a one-time unlock that turns you into a car.
    const UPGRADE_DEFS = [
      {
        id: 'shoes', name: 'Running shoes',
        desc: 'Top speed +10% per level, permanent',
        costs: [200, 400, 600],
      },
      {
        id: 'energy', name: 'Energy drink', type: 'consumable',
        desc: '+40% speed for 5 minutes',
        cost: 300,
      },
      {
        id: 'backpack', name: 'Bigger backpack',
        desc: 'Carry +1 food at a time (start: 1)',
        costs: [300, 600, 900, 1200],
      },
      {
        id: 'motorcycle', name: 'Motorcycle', type: 'unlock',
        desc: 'Upgrade to a car — faster, carries more',
        cost: 6000,
      },
    ];

    function defaultState() {
      return {
        cash: 0,
        lifetimeDeliveries: 0,
        bestTip: 0,
        vehicle: 'walk',           // 'walk' | 'car' — the motorcycle unlocks 'car'
        energyUntil: 0,            // ms timestamp; energy boost active while now < this
        upgrades: { shoes: 0, backpack: 0 },
      };
    }
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const merged = Object.assign(defaultState(), parsed);
          merged.upgrades = Object.assign(defaultState().upgrades, parsed.upgrades || {});
          return merged;
        }
      } catch (_) {}
      return defaultState();
    }
    let state = loadState();
    let saveTimer = null;
    function saveStateDebounced() {
      if (saveTimer) return;
      saveTimer = setTimeout(() => {
        saveTimer = null;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
      }, 250);
    }

    // Computed stats from upgrades
    function energyActive()  { return Date.now() < (state.energyUntil || 0); }
    function speedMult()     { return (1 + 0.10 * state.upgrades.shoes) * (energyActive() ? 1.4 : 1); }
    function baseSpeed()     { return state.vehicle === 'car' ? BASE_SPEED : WALK_SPEED; }
    function maxSpeed()      { return baseSpeed() * speedMult(); }
    function carryCap()      { return (state.vehicle === 'car' ? 2 : 1) + state.upgrades.backpack; }  // food on you at once
    function tipChance()     { return TIP_CHANCE_BASE; }
    function turnRate()      { return BASE_TURN_RATE; }
    function carriedCount()  { return activeOrders.filter(o => o.state === 'delivering').length; }

    // =====================================================================
    // SVG SPRITES (pre-rendered to offscreen canvases)
    // =====================================================================
    function svgToImage(svgString) {
      const img = new Image();
      img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svgString);
      return img;
    }

    // Top-down scooter (faces up in SVG, so heading=0 == "up")
    const SCOOTER_SVG =

    const PICKUP_SVG =

    const DROPOFF_SVG =

        // arrow above

        // house
        '<polygon points="20,17 30,25 28,25 28,34 12,34 12,25 10,25" fill="#fbbf24" stroke="#5a3215" stroke-width="1.2"/>' +
        // door
        '<rect x="18" y="28" width="4" height="6" fill="#5a3215"/>' +
        '<circle cx="21" cy="31" r="0.4" fill="#fbbf24"/>' +
      '</svg>';

    // Top-down walker (faces up in SVG, so heading=0 == "up"). Head + shoulders
    // seen from above, with a delivery backpack on the back.
    const PERSON_SVG =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 30">' +
        '<ellipse cx="12" cy="25" rx="8" ry="2.2" fill="#000" opacity="0.3"/>' +
        // backpack on the back
        '<rect x="6.5" y="11" width="11" height="12" rx="3" fill="#3f7d4f" stroke="#255436" stroke-width="0.8"/>' +
        '<rect x="9" y="13.5" width="6" height="5" rx="1" fill="#2b5c39"/>' +
        // shoulders / torso
        '<ellipse cx="12" cy="14" rx="7" ry="6" fill="#4e7fff"/>' +
        // arms
        '<circle cx="5.5" cy="13" r="2.2" fill="#f0c39b"/>' +
        '<circle cx="18.5" cy="13" r="2.2" fill="#f0c39b"/>' +
        // head
        '<circle cx="12" cy="9" r="4.5" fill="#f0c39b" stroke="#c98f63" stroke-width="0.6"/>' +
        // hair toward the crown
        '<path d="M7.6 8.6 a4.5 4.5 0 0 1 8.8 0 a4.5 3.2 0 0 0 -8.8 0 z" fill="#5a3a22"/>' +
      '</svg>';

    const scooterImg = svgToImage(SCOOTER_SVG);
    const personImg  = svgToImage(PERSON_SVG);
    const pickupImg  = svgToImage(PICKUP_SVG);
    const dropoffImg = svgToImage(DROPOFF_SVG);

    // =====================================================================
    // CITY GENERATION (Poisson-style rejection sampling for non-grid layout)
    // =====================================================================
    const ROOF_COLORS = ['#a0522d', '#6b7280', '#5f9ea0', '#daa520', '#cd853f', '#9370db', '#dc2626', '#0891b2'];

    let buildings = [];   // [{x, y, w, h, roof, windows}]
    let cityCanvas = null;
    let roads = { horiz: [], vert: [], intersections: [] };
    let elapsedTime = 0;  // for light cycling

    // Lay out a few wide horizontal + vertical road bands at irregular
    // spacing. The varied spacing keeps it from reading as a grid.
    // Hierarchical road network:
    //  - Main roads: 4-5 each direction, ~75 px wide, traffic-lighted at
    //    every main↔main intersection, dashed yellow center line.
    //  - Side streets: 1-2 narrow (~30 px) one-laners slotted between each
    //    pair of adjacent main roads. No lights, no center line. They give
    //    you a short hop off the main grid to reach any building.
    // Two-tier road network:
    //  - Main roads span the whole world. Traffic lights at every main↔main
    //    crossing.
    //  - Side streets are PER-CELL segments (a side road only spans the cell
    //    it lives in, from one bounding main to the next), with a random
    //    chance of a stop sign at each side-road junction. Because the
    //    segments don't continue across cells the network reads less like a
    //    pure grid.
    function generateRoads() {
      roads = { horiz: [], vert: [], sideHoriz: [], sideVert: [], intersections: [], stopSigns: [] };

      // --- Main roads ---
      const MAIN_MIN = 400;
      let attempts = 0;
      const targetH = 4 + Math.floor(Math.random() * 2);
      while (roads.horiz.length < targetH && attempts < 150) {
        attempts++;
        const y = 350 + Math.random() * (WORLD_H - 700);
        if (roads.horiz.every(r => Math.abs(r.y - y) >= MAIN_MIN)) {
          roads.horiz.push({ y, w: 70 + Math.random() * 20 });
        }
      }
      attempts = 0;
      const targetV = 4 + Math.floor(Math.random() * 2);
      while (roads.vert.length < targetV && attempts < 150) {
        attempts++;
        const x = 350 + Math.random() * (WORLD_W - 700);
        if (roads.vert.every(r => Math.abs(r.x - x) >= MAIN_MIN)) {
          roads.vert.push({ x, w: 70 + Math.random() * 20 });
        }
      }

      // --- Per-cell side streets ---
      const SIDE_W = 30;
      const sortedH = [...roads.horiz].sort((a, b) => a.y - b.y);
      const sortedV = [...roads.vert].sort((a, b) => a.x - b.x);
      // virtual edges = world border, so the cells at the map boundary still
      // get side streets.
      const hEdges = [80, ...sortedH.map(r => r.y), WORLD_H - 80];
      const vEdges = [80, ...sortedV.map(r => r.x), WORLD_W - 80];
      for (let i = 0; i < hEdges.length - 1; i++) {
        for (let j = 0; j < vEdges.length - 1; j++) {
          const top = hEdges[i], bot = hEdges[i + 1];
          const left = vEdges[j], right = vEdges[j + 1];
          const cellH = bot - top, cellW = right - left;
          // horizontal side streets bisecting the cell vertically
          if (cellH > 180) {
            const slots = cellH > 340 ? 2 : 1;
            // perturb the slot positions slightly so adjacent cells don't
            // line up exactly — adds a bit of organic offset.
            for (let k = 1; k <= slots; k++) {
              const t = k / (slots + 1) + (Math.random() - 0.5) * 0.12;
              const y = top + cellH * Math.max(0.15, Math.min(0.85, t));
              roads.sideHoriz.push({ y, w: SIDE_W, xStart: left, xEnd: right });
            }
          }
          if (cellW > 180) {
            const slots = cellW > 340 ? 2 : 1;
            for (let k = 1; k <= slots; k++) {
              const t = k / (slots + 1) + (Math.random() - 0.5) * 0.12;
              const x = left + cellW * Math.max(0.15, Math.min(0.85, t));
              roads.sideVert.push({ x, w: SIDE_W, yStart: top, yEnd: bot });
            }
          }
        }
      }

      // --- Traffic lights at every main ↔ main crossing ---
      for (const v of roads.vert) {
        for (const h of roads.horiz) {
          roads.intersections.push({
            x: v.x, y: h.y,
            cycleOffset: Math.random() * 8,
            isRed: false,
          });
        }
      }

      // --- Stop signs at narrow ↔ narrow junctions ONLY ---
      // 25% per side-x-side crossing, with a min-distance spread so two
      // signs can't pile up in the same little cell. Wide-road
      // intersections never get one (they carry traffic lights instead).
      const candidates = [];
      for (const sh of roads.sideHoriz) {
        for (const sv of roads.sideVert) {
          const x = sv.x, y = sh.y;
          if (x >= sh.xStart && x <= sh.xEnd && y >= sv.yStart && y <= sv.yEnd) {
            candidates.push({ x, y });
          }
        }
      }
      // shuffle so the first eligible candidates aren't always top-left
      for (let i = candidates.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
      }
      for (const c of candidates) {
        if (Math.random() >= STOP_SIGN_CHANCE) continue;
        const tooClose = roads.stopSigns.some(s =>
          Math.hypot(s.x - c.x, s.y - c.y) < STOP_SIGN_MIN_DIST);
        if (!tooClose) roads.stopSigns.push({ x: c.x, y: c.y });
      }
    }

    // True if a world position is on any road (main or per-cell side segment).
    function isOnRoad(x, y) {
      for (const r of roads.horiz) if (y >= r.y - r.w / 2 && y <= r.y + r.w / 2) return true;
      for (const r of roads.vert)  if (x >= r.x - r.w / 2 && x <= r.x + r.w / 2) return true;
      for (const r of roads.sideHoriz) {
        if (y >= r.y - r.w / 2 && y <= r.y + r.w / 2 && x >= r.xStart && x <= r.xEnd) return true;
      }
      for (const r of roads.sideVert) {
        if (x >= r.x - r.w / 2 && x <= r.x + r.w / 2 && y >= r.yStart && y <= r.yEnd) return true;
      }
      return false;
    }

    // A building can't sit on top of any road. Mains get a slightly larger
    // safety margin than side streets so the buildings hug right up to the
    // narrow one-laners.
    function buildingOverlapsRoad(x, y, w, h) {
      for (const r of roads.horiz) { if (y < r.y + r.w / 2 + 6 && y + h > r.y - r.w / 2 - 6) return true; }
      for (const r of roads.vert)  { if (x < r.x + r.w / 2 + 6 && x + w > r.x - r.w / 2 - 6) return true; }
      for (const r of roads.sideHoriz) {
        if (y < r.y + r.w / 2 + 3 && y + h > r.y - r.w / 2 - 3 &&
            x < r.xEnd + 3 && x + w > r.xStart - 3) return true;
      }
      for (const r of roads.sideVert) {
        if (x < r.x + r.w / 2 + 3 && x + w > r.x - r.w / 2 - 3 &&
            y < r.yEnd + 3 && y + h > r.yStart - 3) return true;
      }
      return false;
    }

    function updateTrafficLights(now) {
      for (const it of roads.intersections) {
        const t = (now + it.cycleOffset) % 12;
        it.isRed = t < 6;
      }
    }

    function generateCity() {
      generateRoads();
      buildings = [];
      const minDist = 110;
      const targetCount = 150;
      let attempts = 0;
      const maxAttempts = 8000;

      while (buildings.length < targetCount && attempts < maxAttempts) {
        attempts++;
        const w = 60 + Math.random() * 80;
        const h = 60 + Math.random() * 80;
        const x = 150 + Math.random() * (WORLD_W - 300 - w);
        const y = 150 + Math.random() * (WORLD_H - 300 - h);
        const cx = x + w / 2, cy = y + h / 2;

        if (buildingOverlapsRoad(x, y, w, h)) continue;

        let ok = true;
        for (const b of buildings) {
          const bcx = b.x + b.w / 2, bcy = b.y + b.h / 2;
          if (Math.hypot(cx - bcx, cy - bcy) < minDist) { ok = false; break; }
        }
        if (ok) {
          buildings.push({
            x, y, w, h,
            roof: ROOF_COLORS[Math.floor(Math.random() * ROOF_COLORS.length)],
            shade: 0.7 + Math.random() * 0.3,
            windows: Math.floor(3 + Math.random() * 7),
          });
        }
      }

      // Pre-render the whole city to an offscreen canvas — drawn once per shift.
      cityCanvas = document.createElement('canvas');
      cityCanvas.width = WORLD_W;
      cityCanvas.height = WORLD_H;
      const c = cityCanvas.getContext('2d');

      // ground / pavement base
      c.fillStyle = '#2f3445';
      c.fillRect(0, 0, WORLD_W, WORLD_H);

      // subtle ground texture
      c.strokeStyle = 'rgba(255,255,255,0.02)';
      c.lineWidth = 1;
      for (let i = -WORLD_H; i < WORLD_W; i += 30) {
        c.beginPath(); c.moveTo(i, 0); c.lineTo(i + WORLD_H, WORLD_H); c.stroke();
      }

      // === side streets — only span their cell, not the whole world ===
      c.fillStyle = '#525870';
      for (const r of roads.sideHoriz) c.fillRect(r.xStart, r.y - r.w / 2, r.xEnd - r.xStart, r.w);
      for (const r of roads.sideVert)  c.fillRect(r.x - r.w / 2, r.yStart, r.w, r.yEnd - r.yStart);
      c.strokeStyle = 'rgba(0,0,0,0.45)';
      c.lineWidth = 1;
      for (const r of roads.sideHoriz) {
        c.beginPath(); c.moveTo(r.xStart, r.y - r.w / 2); c.lineTo(r.xEnd, r.y - r.w / 2); c.stroke();
        c.beginPath(); c.moveTo(r.xStart, r.y + r.w / 2); c.lineTo(r.xEnd, r.y + r.w / 2); c.stroke();
      }
      for (const r of roads.sideVert) {
        c.beginPath(); c.moveTo(r.x - r.w / 2, r.yStart); c.lineTo(r.x - r.w / 2, r.yEnd); c.stroke();
        c.beginPath(); c.moveTo(r.x + r.w / 2, r.yStart); c.lineTo(r.x + r.w / 2, r.yEnd); c.stroke();
      }

      // === main roads (darker grey, on top of side streets) ===
      c.fillStyle = '#4a5066';
      for (const r of roads.horiz) c.fillRect(0, r.y - r.w / 2, WORLD_W, r.w);
      for (const r of roads.vert)  c.fillRect(r.x - r.w / 2, 0, r.w, WORLD_H);
      c.strokeStyle = 'rgba(0,0,0,0.55)';
      c.lineWidth = 2;
      for (const r of roads.horiz) {
        c.beginPath(); c.moveTo(0, r.y - r.w / 2); c.lineTo(WORLD_W, r.y - r.w / 2); c.stroke();
        c.beginPath(); c.moveTo(0, r.y + r.w / 2); c.lineTo(WORLD_W, r.y + r.w / 2); c.stroke();
      }
      for (const r of roads.vert) {
        c.beginPath(); c.moveTo(r.x - r.w / 2, 0); c.lineTo(r.x - r.w / 2, WORLD_H); c.stroke();
        c.beginPath(); c.moveTo(r.x + r.w / 2, 0); c.lineTo(r.x + r.w / 2, WORLD_H); c.stroke();
      }
      // yellow dashed center lines — mains only
      c.strokeStyle = '#fbbf24';
      c.lineWidth = 2;
      c.setLineDash([24, 16]);
      for (const r of roads.horiz) {
        c.beginPath(); c.moveTo(0, r.y); c.lineTo(WORLD_W, r.y); c.stroke();
      }
      for (const r of roads.vert) {
        c.beginPath(); c.moveTo(r.x, 0); c.lineTo(r.x, WORLD_H); c.stroke();
      }
      c.setLineDash([]);

      // world border (so the car can't escape visually)
      c.strokeStyle = '#4e7fff';
      c.lineWidth = 6;
      c.strokeRect(40, 40, WORLD_W - 80, WORLD_H - 80);

      // buildings
      for (const b of buildings) {
        // building shadow
        c.fillStyle = 'rgba(0,0,0,0.35)';
        c.fillRect(b.x + 4, b.y + 4, b.w, b.h);
        // walls
        c.fillStyle = '#3a3f55';
        c.fillRect(b.x, b.y, b.w, b.h);
        // roof
        const roof = b.roof;
        c.fillStyle = roof;
        c.globalAlpha = b.shade;
        c.fillRect(b.x + 2, b.y + 2, b.w - 4, b.h * 0.55);
        c.globalAlpha = 1;
        // roof edge
        c.strokeStyle = 'rgba(0,0,0,0.4)';
        c.lineWidth = 1;
        c.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h * 0.55);
        // windows (dots on the front face)
        c.fillStyle = '#fde68a';
        const rows = 2, cols = Math.min(b.windows, 6);
        const wx0 = b.x + 8;
        const wy0 = b.y + b.h * 0.6;
        const ww = (b.w - 16) / cols;
        const wh = (b.h * 0.35) / rows;
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            if (Math.random() < 0.7) {
              c.globalAlpha = 0.6 + Math.random() * 0.4;
              c.fillRect(wx0 + col * ww + ww * 0.2, wy0 + row * wh + wh * 0.2, ww * 0.6, wh * 0.6);
            }
          }
        }
        c.globalAlpha = 1;
        // outer outline
        c.strokeStyle = 'rgba(0,0,0,0.5)';
        c.lineWidth = 1.5;
        c.strokeRect(b.x, b.y, b.w, b.h);
      }
    }

    function buildingCenter(b) { return { x: b.x + b.w / 2, y: b.y + b.h / 2 }; }

    // Pick a random building, optionally excluding indices.
    function pickBuilding(exclude) {
      if (buildings.length === 0) return -1;
      let idx;
      let tries = 0;
      do {
        idx = Math.floor(Math.random() * buildings.length);
        tries++;
      } while (exclude && exclude.includes(idx) && tries < 20);
      return idx;
    }

    // =====================================================================
    // CAR
    // =====================================================================
    const CAR_W = 26, CAR_H = 36;
    const car = { x: 0, y: 0, heading: 0, speed: 0 };
    function resetCar() {
      // spawn at a safe spot: try centers of map, find non-colliding
      const tryPositions = [
        [WORLD_W / 2, WORLD_H / 2],
        [WORLD_W * 0.3, WORLD_H * 0.5],
        [WORLD_W * 0.7, WORLD_H * 0.5],
        [WORLD_W * 0.5, WORLD_H * 0.3],
        [WORLD_W * 0.5, WORLD_H * 0.7],
      ];
      for (const [x, y] of tryPositions) {
        if (!carCollidesAt(x, y)) {
          car.x = x; car.y = y;
          car.heading = 0; car.speed = 0;
          return;
        }
      }
      // fallback: brute search
      for (let i = 0; i < 200; i++) {
        const x = 200 + Math.random() * (WORLD_W - 400);
        const y = 200 + Math.random() * (WORLD_H - 400);
        if (!carCollidesAt(x, y)) {
          car.x = x; car.y = y;
          car.heading = 0; car.speed = 0;
          return;
        }
      }
    }

    // Tight circle-vs-rect collision instead of an oversized AABB — the
    // old version inflated the hitbox to a 36 px square (max of car w/h)
    // so the car was rejecting at gaps where there was visible clearance.
    const CAR_RADIUS = 13;
    function carCollidesAt(x, y) {
      const r = CAR_RADIUS;
      for (const b of buildings) {
        const cx = Math.max(b.x, Math.min(x, b.x + b.w));
        const cy = Math.max(b.y, Math.min(y, b.y + b.h));
        const dx = x - cx, dy = y - cy;
        if (dx * dx + dy * dy < r * r) return true;
      }
      // Red traffic lights — block entry to the intersection box. If the
      // car is already inside (light just turned red on top of it), let it
      // keep moving so it can clear the box.
      const ib = INTERSECTION_HALF;
      for (const it of roads.intersections) {
        if (!it.isRed) continue;
        const inNew = (x > it.x - ib && x < it.x + ib && y > it.y - ib && y < it.y + ib);
        if (!inNew) continue;
        const inOld = (car.x > it.x - ib && car.x < it.x + ib && car.y > it.y - ib && car.y < it.y + ib);
        if (!inOld) return true;
      }
      // Stop signs — flat-out impassable. The block is sized so the car
      // can't squeeze through the narrow road around it.
      const sh = STOP_SIGN_HALF;
      for (const s of roads.stopSigns) {
        if (x > s.x - sh && x < s.x + sh && y > s.y - sh && y < s.y + sh) return true;
      }
      return false;
    }

    // Person collision: pedestrians only bump into buildings and the world
    // border — they ignore traffic lights and stop signs entirely.
    const PERSON_RADIUS = 9;
    function personCollidesAt(x, y) {
      const r = PERSON_RADIUS;
      for (const b of buildings) {
        const cx = Math.max(b.x, Math.min(x, b.x + b.w));
        const cy = Math.max(b.y, Math.min(y, b.y + b.h));
        const dx = x - cx, dy = y - cy;
        if (dx * dx + dy * dy < r * r) return true;
      }
      return false;
    }

    // On-foot movement: direct 8-way, no inertia. Walks full speed anywhere
    // (no off-road penalty) and phases past lights/stop signs. Heading tracks
    // the walk direction so the sprite faces where you're going.
    function updateWalk(dt) {
      let vx = 0, vy = 0;
      if (input.w) vy -= 1;
      if (input.s) vy += 1;
      if (input.a) vx -= 1;
      if (input.d) vx += 1;
      const moving = vx !== 0 || vy !== 0;
      if (moving) {
        const len = Math.hypot(vx, vy);
        vx /= len; vy /= len;
        car.heading = Math.atan2(vx, -vy);   // heading 0 == facing up
      }
      const spd = maxSpeed();
      car.speed = moving ? spd : 0;
      const nextX = car.x + vx * spd * dt;
      const nextY = car.y + vy * spd * dt;
      if (!personCollidesAt(nextX, car.y) && nextX > 80 && nextX < WORLD_W - 80) car.x = nextX;
      if (!personCollidesAt(car.x, nextY) && nextY > 80 && nextY < WORLD_H - 80) car.y = nextY;
    }

    function updatePlayer(dt) {
      if (state.vehicle === 'car') updateCar(dt);
      else updateWalk(dt);
    }

    function updateCar(dt) {
      const keys = input;
      // steering
      const steerFactor = Math.min(1, 0.4 + Math.abs(car.speed) / maxSpeed());
      const turn = turnRate() * dt * steerFactor;
      if (keys.a) car.heading -= turn;
      if (keys.d) car.heading += turn;

      // throttle
      if (keys.w) car.speed += BASE_ACCEL * dt;
      if (keys.s) car.speed -= BASE_BRAKE * dt;

      // friction (when no input on throttle axis)
      if (!keys.w && !keys.s) {
        const decay = Math.pow(FRICTION, dt);
        car.speed *= decay;
        if (Math.abs(car.speed) < 4) car.speed = 0;
      }

      // Off-road = 75% top-speed cut. Realised as a hard clamp so the
      // moment the car leaves pavement it visibly slows.
      const onRoad = isOnRoad(car.x, car.y);
      const ms = maxSpeed() * (onRoad ? 1 : OFFROAD_SPEED_MULT);
      if (car.speed > ms) car.speed = ms;
      if (car.speed < -ms * 0.5) car.speed = -ms * 0.5;

      // Move; resolve collisions on each axis independently so you can slide along walls.
      const dx = Math.sin(car.heading) * car.speed * dt;
      const dy = -Math.cos(car.heading) * car.speed * dt;

      // X axis
      const nextX = car.x + dx;
      if (!carCollidesAt(nextX, car.y) && nextX > 80 && nextX < WORLD_W - 80) {
        car.x = nextX;
      } else {
        car.speed *= 0.25; // bonk damping
      }
      // Y axis
      const nextY = car.y + dy;
      if (!carCollidesAt(car.x, nextY) && nextY > 80 && nextY < WORLD_H - 80) {
        car.y = nextY;
      } else {
        car.speed *= 0.25;
      }
    }

    // =====================================================================
    // INPUT
    // =====================================================================
    const input = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', (e) => {
      if (gameState !== 'playing') return;
      const k = e.key.toLowerCase();
      if (k === 'w') input.w = true;
      else if (k === 'a') input.a = true;
      else if (k === 's') input.s = true;
      else if (k === 'd') input.d = true;
      else if (k === '1' || k === '2' || k === '3') acceptByIndex(parseInt(k, 10) - 1);
      else if (k === 'e') doInteract();
      else if (k === 'arrowup') input.w = true;
      else if (k === 'arrowleft') input.a = true;
      else if (k === 'arrowdown') input.s = true;
      else if (k === 'arrowright') input.d = true;
      if (['w','a','s','d','e','1','2','3'].includes(k) || k.startsWith('arrow')) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') input.w = false;
      else if (k === 'a' || k === 'arrowleft') input.a = false;
      else if (k === 's' || k === 'arrowdown') input.s = false;
      else if (k === 'd' || k === 'arrowright') input.d = false;
    });
    // Drop inputs if window loses focus
    window.addEventListener('blur', () => { input.w = input.a = input.s = input.d = false; });

    function pickMenuItem() {
      const r = RESTAURANTS[Math.floor(Math.random() * RESTAURANTS.length)];
      const i = r.items[Math.floor(Math.random() * r.items.length)];
      return { restaurant: r.name, item: i.name, foodPrice: i.price };
    }

    let nextOrderId = 1;
    let availableOrders = [];
    let activeOrders = [];
    let spawnAccumulator = 0;   // ticks one full second at a time

    // Difficulty multiplier — counts how many main-road traffic-light
    // intersections fall inside the bounding box between pickup and
    // dropoff. Every potential red light makes the trip a bit longer,
    // so both pay AND time get scaled by the same factor.
    function routeDifficulty(a, b) {
      const xMin = Math.min(a.x, b.x), xMax = Math.max(a.x, b.x);
      const yMin = Math.min(a.y, b.y), yMax = Math.max(a.y, b.y);
      let lights = 0;
      for (const it of roads.intersections) {
        if (it.x >= xMin && it.x <= xMax && it.y >= yMin && it.y <= yMax) lights++;
      }
      return 1 + lights * 0.15;       // up to ~+15 % per crossing
    }

    function makeOrder() {
      if (buildings.length < 2) return null;
      const pickupIdx = pickBuilding();
      const dropoffIdx = pickBuilding([pickupIdx]);
      if (pickupIdx < 0 || dropoffIdx < 0 || pickupIdx === dropoffIdx) return null;
      const a = buildingCenter(buildings[pickupIdx]);
      const b = buildingCenter(buildings[dropoffIdx]);
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const diff = routeDifficulty(a, b);
      const basePay   = Math.max(3, Math.round((dist * 0.025 + 3) * diff));
      // Time limits assume the base on-foot pace, so speed upgrades buy you
      // slack rather than shrinking the clock.
      const timeLimit = ((dist / WALK_SPEED) * 2.5 + 25) * diff;
      // Pre-roll the tip at order creation so the displayed food price
      // is exact (and so Charisma upgrades affect future orders).
      let tip = 0;
      if (Math.random() < tipChance()) {
        const pct = TIP_PCT_MIN + Math.random() * (TIP_PCT_MAX - TIP_PCT_MIN);
        tip = Math.max(1, Math.round(basePay * pct));
      }
      const menu = pickMenuItem();
      return {
        id: nextOrderId++,
        pickupIdx, dropoffIdx,
        basePay, tip,
        restaurant: menu.restaurant,
        item: menu.item,
        foodPrice: menu.foodPrice,
        timeLimit,
        timeRemaining: timeLimit,
        shelfLife: SHELF_MIN + Math.random() * (SHELF_MAX - SHELF_MIN),
        difficulty: diff,
        lightsOnRoute: Math.round((diff - 1) / 0.15),
        state: 'available',
      };
    }

    function updateOrders(dt) {
      // One coin-flip per real second — 1 in ORDER_SPAWN_DENOM odds.
      // No cap on available; decline = back to waiting.
      spawnAccumulator += dt;
      while (spawnAccumulator >= 1) {
        spawnAccumulator -= 1;
        if (Math.random() < 1 / ORDER_SPAWN_DENOM) {
          const o = makeOrder();
          if (o) {
            availableOrders.push(o);
            renderAvailable();
          }
        }
      }

      // Tick shelf life on available orders. If you don't accept fast
      // enough, a competing deliverer scoops it.
      let availableChanged = false;
      for (let i = availableOrders.length - 1; i >= 0; i--) {
        availableOrders[i].shelfLife -= dt;
        if (availableOrders[i].shelfLife <= 0) {
          const stealer = DELIVERER_NAMES[Math.floor(Math.random() * DELIVERER_NAMES.length)];
          showToast('Order has been taken by ' + stealer, true);
          availableOrders.splice(i, 1);
          availableChanged = true;
        }
      }
      if (availableChanged) renderAvailable();

      // tick active timers + find the closest in-range target (if any)
      interactOrder = null;
      let bestInteractDist = Infinity;
      for (let i = activeOrders.length - 1; i >= 0; i--) {
        const o = activeOrders[i];
        o.timeRemaining -= dt;
        if (o.timeRemaining <= 0) {
          showToast('Order failed!', true);
          playFail();
          activeOrders.splice(i, 1);
          renderActive();
          continue;
        }
        const target = o.state === 'picking-up'
          ? buildingCenter(buildings[o.pickupIdx])
          : buildingCenter(buildings[o.dropoffIdx]);
        const d = Math.hypot(car.x - target.x, car.y - target.y);
        if (d <= PICKUP_RADIUS && d < bestInteractDist) {
          interactOrder = o;
          bestInteractDist = d;
        }
      }
      // Show / hide the interact button
      if (interactOrder) {
        const label = interactOrder.state === 'picking-up' ? '📦 Pick up' : '🏠 Drop off';
        interactBtn.innerHTML = label + '<span class="key-hint">E</span>';
        interactBtn.classList.toggle('dropoff', interactOrder.state === 'delivering');
        interactBtn.classList.remove('hidden');
      } else {
        interactBtn.classList.add('hidden');
      }
    }

    let interactOrder = null;
    function doInteract() {
      const o = interactOrder;
      if (!o) return;
      if (o.state === 'picking-up') {
        if (carriedCount() >= carryCap()) {
          showToast('Bag full! (' + carryCap() + ')', true);
          return;
        }
        o.state = 'delivering';
        showToast('Picked up!');
        playBell();
        renderActive();
        renderHud();
      } else if (o.state === 'delivering') {
        // Tip was pre-rolled at order creation; just pay it out now.
        const tip = o.tip || 0;
        const total = o.basePay + tip;
        state.cash += total;
        state.lifetimeDeliveries++;
        if (tip > state.bestTip) state.bestTip = tip;
        showToast(tip > 0
          ? 'Delivered! +$' + total + ' (tip $' + tip + ')'
          : 'Delivered! +$' + total + ' (no tip)'
        );
        playChime();
        saveStateDebounced();
        const idx = activeOrders.indexOf(o);
        if (idx >= 0) activeOrders.splice(idx, 1);
        renderActive();
        renderHud();
      }
      interactOrder = null;
      interactBtn.classList.add('hidden');
    }

    function acceptByIndex(idx) {
      if (idx < 0 || idx >= availableOrders.length) return;
      const o = availableOrders.splice(idx, 1)[0];
      o.state = 'picking-up';
      o.timeRemaining = o.timeLimit;
      activeOrders.push(o);
      playBlip();
      renderAvailable();
      renderActive();
      renderHud();
    }
    function declineByIndex(idx) {
      if (idx < 0 || idx >= availableOrders.length) return;
      availableOrders.splice(idx, 1);
      renderAvailable();
      // No auto-refill — wait for the next per-second 1/35 roll.
    }

    // =====================================================================
    // RENDER
    // =====================================================================
    const gameCanvas = document.getElementById('game-canvas');
    const gameCtx = gameCanvas.getContext('2d');
    let viewportW = 0, viewportH = 0;
    let cameraX = 0, cameraY = 0;

    function resizeGameCanvas() {
      viewportW = gameCanvas.clientWidth;
      viewportH = gameCanvas.clientHeight;
      gameCanvas.width = viewportW;
      gameCanvas.height = viewportH;
    }

    function updateCamera(dt) {
      const targetX = car.x - viewportW / 2;
      const targetY = car.y - viewportH / 2;
      cameraX += (targetX - cameraX) * Math.min(1, 8 * dt);
      cameraY += (targetY - cameraY) * Math.min(1, 8 * dt);
      // clamp
      cameraX = Math.max(0, Math.min(WORLD_W - viewportW, cameraX));
      cameraY = Math.max(0, Math.min(WORLD_H - viewportH, cameraY));
    }

    let renderTick = 0;
    function render() {
      renderTick++;
      const ctx = gameCtx;
      ctx.clearRect(0, 0, viewportW, viewportH);
      ctx.save();
      ctx.translate(-cameraX, -cameraY);

      // city
      if (cityCanvas) ctx.drawImage(cityCanvas, 0, 0);

      // traffic lights at intersections (small post with red/green head)
      for (const it of roads.intersections) {
        // post
        ctx.fillStyle = '#1f2233';
        ctx.fillRect(it.x - 1.5, it.y - 22, 3, 16);
        // light head
        const headColor = it.isRed ? '#ef4444' : '#22c55e';
        // halo
        ctx.fillStyle = it.isRed ? 'rgba(239,68,68,0.32)' : 'rgba(34,197,94,0.28)';
        ctx.beginPath();
        ctx.arc(it.x, it.y - 22, 10, 0, Math.PI * 2);
        ctx.fill();
        // bulb
        ctx.fillStyle = headColor;
        ctx.beginPath();
        ctx.arc(it.x, it.y - 22, 4.5, 0, Math.PI * 2);
        ctx.fill();
        // bulb highlight
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.arc(it.x - 1.3, it.y - 23.3, 1.4, 0, Math.PI * 2);
        ctx.fill();
      }

      // stop signs at narrow ↔ narrow junctions (solid block, no waiting)
      for (const s of roads.stopSigns) {
        ctx.save();
        ctx.translate(s.x, s.y);
        // pole
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(-1.5, -8, 3, 18);
        // octagon
        ctx.save();
        ctx.translate(0, -16);
        ctx.fillStyle = '#dc2626';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        const r = 10;
        for (let i = 0; i < 8; i++) {
          const a = Math.PI / 4 * i + Math.PI / 8;
          const px = r * Math.cos(a), py = r * Math.sin(a);
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 5px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('STOP', 0, 0);
        ctx.restore();
        ctx.restore();
      }

      // markers for active orders (pickup or dropoff depending on state)
      const pulse = 1 + Math.sin(renderTick * 0.12) * 0.08;
      for (const o of activeOrders) {
        const b = o.state === 'picking-up' ? buildings[o.pickupIdx] : buildings[o.dropoffIdx];
        const center = buildingCenter(b);
        const img = o.state === 'picking-up' ? pickupImg : dropoffImg;
        const size = 50 * pulse;
        if (img.complete) {
          ctx.drawImage(img, center.x - size / 2, center.y - size - 10, size, size);
        }
      }

      // player sprite (rotated to heading) — walker on foot, scooter in a car
      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.heading);
      const onFoot = state.vehicle !== 'car';
      const sprite = onFoot ? personImg : scooterImg;
      const sw = onFoot ? 20 : CAR_W;
      const sh = onFoot ? 26 : CAR_H;
      if (sprite.complete) {
        ctx.drawImage(sprite, -sw / 2, -sh / 2, sw, sh);
      }
      ctx.restore();

      ctx.restore();

      // === screen-space overlays ===
      // direction arrow at the screen edge for each active order, pointing
      // toward the pickup / dropoff so the player always knows where to go.
      for (const o of activeOrders) {
        const b = o.state === 'picking-up' ? buildings[o.pickupIdx] : buildings[o.dropoffIdx];
        const center = buildingCenter(b);
        const color = o.state === 'picking-up' ? '#22c55e' : '#4e7fff';
        drawDirectionArrow(center.x, center.y, color);
      }
    }

    // Edge-clamped indicator arrow. Hides itself when the target is already
    // visible inside the viewport (the building marker is enough then).
    function drawDirectionArrow(targetX, targetY, color) {
      const ctx = gameCtx;
      const screenX = targetX - cameraX, screenY = targetY - cameraY;
      const visMargin = 60;
      if (screenX > visMargin && screenX < viewportW - visMargin &&
          screenY > visMargin && screenY < viewportH - visMargin) {
        return; // marker is already on-screen
      }
      const cx = viewportW / 2, cy = viewportH / 2;
      const dx = screenX - cx, dy = screenY - cy;
      const dist = Math.hypot(dx, dy);
      if (dist < 1) return;
      // clamp to a rounded-rect-ish inset border
      const margin = 60;
      const halfW = viewportW / 2 - margin;
      const halfH = viewportH / 2 - margin;
      const scale = Math.min(halfW / Math.abs(dx || 0.0001), halfH / Math.abs(dy || 0.0001));
      const ax = cx + dx * scale;
      const ay = cy + dy * scale;
      const angle = Math.atan2(dy, dx);

      ctx.save();
      ctx.translate(ax, ay);
      // background coin
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.stroke();
      // arrow head
      ctx.rotate(angle);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(13, 0);
      ctx.lineTo(-7, -9);
      ctx.lineTo(-3, 0);
      ctx.lineTo(-7, 9);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    // =====================================================================
    // GAME LOOP
    // =====================================================================
    let gameState = 'menu'; // 'menu' | 'playing'
    let lastFrame = performance.now();
    function loop() {
      const now = performance.now();
      let dt = (now - lastFrame) / 1000;
      if (dt > 0.05) dt = 0.05; // cap
      lastFrame = now;

      if (gameState === 'playing') {
        elapsedTime += dt;
        updateTrafficLights(elapsedTime);
        updatePlayer(dt);
        updateOrders(dt);
        updateCamera(dt);
        render();
        // tick the timer display in the sidebar (every ~250ms)
        sidebarTickAccumulator += dt;
        if (sidebarTickAccumulator >= 0.25) {
          sidebarTickAccumulator = 0;
          renderTimers();
          updateEnergyHud();
        }
      }

      requestAnimationFrame(loop);
    }
    let sidebarTickAccumulator = 0;

    // =====================================================================
    // SIDEBAR / HUD RENDERING
    // =====================================================================
    const availableListEl = document.getElementById('available-list');
    const enrouteListEl   = document.getElementById('enroute-list');
    const foodListEl      = document.getElementById('food-list');
    const playCashEl      = document.getElementById('play-cash');
    const playCarryEl     = document.getElementById('play-carry');
    const playActiveCountEl = document.getElementById('play-active-count');
    const energyRowEl      = document.getElementById('energy-row');
    const playEnergyEl     = document.getElementById('play-energy');
    const interactBtn      = document.getElementById('interact-btn');
    interactBtn.addEventListener('click', doInteract);

    function updateEnergyHud() {
      if (energyActive()) {
        energyRowEl.style.display = '';
        playEnergyEl.textContent = Math.ceil((state.energyUntil - Date.now()) / 1000) + 's';
      } else {
        energyRowEl.style.display = 'none';
      }
    }

    function dollar(n) { return '$' + Math.floor(n).toLocaleString(); }

    function renderHud() {
      playCashEl.textContent = dollar(state.cash);
      playCarryEl.textContent = carriedCount() + ' / ' + carryCap();
      playActiveCountEl.textContent = activeOrders.length;
    }

    function renderAvailable() {
      availableListEl.innerHTML = '';
      if (availableOrders.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'Watching the radio…';
        availableListEl.appendChild(empty);
        return;
      }
      for (let i = 0; i < availableOrders.length; i++) {
        const o = availableOrders[i];
        const a = buildingCenter(buildings[o.pickupIdx]);
        const b = buildingCenter(buildings[o.dropoffIdx]);
        const dist = Math.round(Math.hypot(a.x - b.x, a.y - b.y));
        const card = document.createElement('div');
        card.className = 'order-card available';
        card.innerHTML =
          '<div class="pay">$' + o.basePay + '</div>' +
          '<div class="meta">' +
            '<span>📍 ' + dist + ' px</span>' +
            '<span>⏱ ' + Math.round(o.timeLimit) + 's</span>' +
          '</div>' +
          '<div class="order-available">Order available</div>' +
          '<div class="order-actions">' +
            '<button class="accept-btn" data-idx="' + i + '">Accept</button>' +
            '<button class="decline-btn" data-idx="' + i + '">Decline</button>' +
          '</div>';
        availableListEl.appendChild(card);
      }
      availableListEl.querySelectorAll('.accept-btn').forEach(btn => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); acceptByIndex(parseInt(btn.dataset.idx, 10)); });
      });
      availableListEl.querySelectorAll('.decline-btn').forEach(btn => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); declineByIndex(parseInt(btn.dataset.idx, 10)); });
      });
    }

    function renderActive() {
      // === En route (picking-up) ===
      enrouteListEl.innerHTML = '';
      const enroute = activeOrders.filter(o => o.state === 'picking-up');
      if (enroute.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No orders en route';
        enrouteListEl.appendChild(empty);
      } else {
        for (const o of enroute) {
          const card = document.createElement('div');
          card.className = 'order-card active pickup';
          if (o.timeRemaining < 10) card.classList.add('urgent');
          card.dataset.orderId = o.id;
          card.innerHTML =
            '<div class="pay">$' + o.basePay + (o.tip ? '+$' + o.tip : '') + '</div>' +
            '<div class="meta">' +
              '<span><span class="state-badge">📦 Pickup</span></span>' +
              '<span class="timer">⏱ ' + Math.ceil(o.timeRemaining) + 's</span>' +
            '</div>' +
            '<div class="restaurant-line"><strong>' + o.restaurant + '</strong> — ' + o.item + '</div>';
          enrouteListEl.appendChild(card);
        }
      }
      // === Food (delivering) ===
      foodListEl.innerHTML = '';
      const food = activeOrders.filter(o => o.state === 'delivering');
      if (food.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'Nothing on your back';
        foodListEl.appendChild(empty);
      } else {
        for (const o of food) {
          const card = document.createElement('div');
          card.className = 'order-card active delivering';
          if (o.timeRemaining < 10) card.classList.add('urgent');
          card.dataset.orderId = o.id;
          const total = o.foodPrice + o.basePay + (o.tip || 0);
          const tipText = o.tip > 0 ? (' + $' + o.tip + ' tip') : '';
          card.innerHTML =
            '<div class="food-line">' +
              '<span class="food-restaurant">' + o.restaurant + ':</span> ' +
              '<span class="food-item">' + o.item + '</span>' +
            '</div>' +
            '<div class="meta">' +
              '<span><span class="state-badge">🏠 Drop off</span></span>' +
              '<span class="timer">⏱ ' + Math.ceil(o.timeRemaining) + 's</span>' +
            '</div>' +
            '<div class="food-price">$' + total + '</div>' +
            '<div class="food-breakdown">$' + o.foodPrice + ' food + $' + o.basePay + ' delivery' + tipText + '</div>';
          foodListEl.appendChild(card);
        }
      }
    }

    // Cheap in-place update of just the timer text + urgent class (no full re-render).
    function renderTimers() {
      for (const o of activeOrders) {
        const card = document.querySelector('[data-order-id="' + o.id + '"]');
        if (!card) continue;
        const timer = card.querySelector('.timer');
        if (timer) timer.textContent = '⏱ ' + Math.ceil(o.timeRemaining) + 's';
        if (o.timeRemaining < 10 && !card.classList.contains('urgent')) card.classList.add('urgent');
      }
    }

    // =====================================================================
    // TOAST
    // =====================================================================
    const toastEl = document.getElementById('toast');
    let toastTimer = null;
    function showToast(msg, fail) {
      toastEl.textContent = msg;
      toastEl.classList.remove('fail');
      if (fail) toastEl.classList.add('fail');
      toastEl.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
    }

    // =====================================================================
    // SOUND (Web Audio)
    // =====================================================================
    let audioCtx = null;
    function ensureAudio() {
      if (audioCtx) return;
      try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); } catch (_) {}
    }
    function blip(freqStart, freqEnd, dur, vol, type) {
      ensureAudio(); if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'triangle';
      osc.frequency.setValueAtTime(freqStart, t);
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, freqEnd), t + dur);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(vol, t + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }
    function playBlip()  { blip(550, 720, 0.08, 0.15, 'triangle'); }
    function playBell()  { blip(820, 1100, 0.16, 0.16, 'sine'); blip(1240, 1240, 0.18, 0.08, 'triangle'); }
    function playChime() { blip(660, 660, 0.12, 0.16, 'sine'); setTimeout(() => blip(880, 880, 0.12, 0.16, 'sine'), 70); setTimeout(() => blip(1100, 1100, 0.2, 0.15, 'sine'), 140); }
    function playFail()  { blip(220, 110, 0.22, 0.18, 'sawtooth'); }
    function playPurchase() { blip(440, 880, 0.12, 0.13, 'sine'); }

    // =====================================================================
    // MENU: stats + upgrades
    // =====================================================================
    const menuCashEl = document.getElementById('menu-cash');
    const menuDeliveriesEl = document.getElementById('menu-deliveries');
    const menuBestTipEl = document.getElementById('menu-best-tip');
    const upgradesListEl = document.getElementById('upgrades-list');

    function upgradeCost(def) {
      if (def.type === 'consumable' || def.type === 'unlock') return def.cost;
      const lvl = state.upgrades[def.id];
      if (lvl >= def.costs.length) return null;
      return def.costs[lvl];
    }
    function isMaxed(def) {
      if (def.type === 'consumable') return false;               // always buyable
      if (def.type === 'unlock') return state.vehicle === 'car'; // one-time
      return state.upgrades[def.id] >= def.costs.length;
    }

    function renderMenu() {
      menuCashEl.textContent = dollar(state.cash);
      menuDeliveriesEl.textContent = state.lifetimeDeliveries.toLocaleString();
      menuBestTipEl.textContent = dollar(state.bestTip);
      upgradesListEl.innerHTML = '';
      for (const def of UPGRADE_DEFS) {
        const cost = upgradeCost(def);
        const maxed = isMaxed(def);
        const row = document.createElement('div');
        row.className = 'upgrade';
        if (maxed) row.classList.add('maxed');
        else if (cost != null && state.cash >= cost) row.classList.add('affordable');

        // status line under the description depends on the item kind
        let statusLine;
        if (def.type === 'consumable') {
          statusLine = energyActive()
            ? 'Active — ' + Math.ceil((state.energyUntil - Date.now()) / 1000) + 's left'
            : 'Buy anytime';
        } else if (def.type === 'unlock') {
          statusLine = state.vehicle === 'car' ? 'Owned' : 'Not owned';
        } else {
          statusLine = 'Level ' + state.upgrades[def.id] + ' / ' + def.costs.length;
        }

        const btnLabel = (def.type === 'unlock' && maxed) ? 'OWNED'
                       : maxed ? 'MAX'
                       : '$' + cost.toLocaleString();
        row.innerHTML =
          '<div class="info">' +
            '<div class="name">' + def.name + '</div>' +
            '<div class="desc">' + def.desc + '</div>' +
            '<div class="level">' + statusLine + '</div>' +
          '</div>' +
          (maxed
            ? '<button disabled>' + btnLabel + '</button>'
            : '<button data-id="' + def.id + '">' + btnLabel + '</button>');
        upgradesListEl.appendChild(row);
      }
      // wire purchase buttons
      upgradesListEl.querySelectorAll('button[data-id]').forEach(btn => {
        btn.addEventListener('click', () => buyUpgrade(btn.dataset.id));
      });
    }

    function buyUpgrade(id) {
      const def = UPGRADE_DEFS.find(d => d.id === id);
      if (!def || isMaxed(def)) return;
      const cost = upgradeCost(def);
      if (cost == null || state.cash < cost) return;
      state.cash -= cost;
      if (def.type === 'consumable') {
        // stacks if you buy more than one — extends from whenever it runs out
        const base = Math.max(Date.now(), state.energyUntil || 0);
        state.energyUntil = base + ENERGY_MS;
      } else if (def.type === 'unlock') {
        state.vehicle = 'car';
      } else {
        state.upgrades[id]++;
      }
      saveStateDebounced();
      renderMenu();
      playPurchase();
    }

    // =====================================================================
    // SHIFT FLOW
    // =====================================================================
    const menuEl = document.getElementById('menu');
    const playEl = document.getElementById('play');

    function startShift() {
      ensureAudio();
      generateCity();
      resetCar();
      availableOrders = [];
      activeOrders = [];
      interactOrder = null;
      interactBtn.classList.add('hidden');
      nextOrderId = 1;
      elapsedTime = 0;
      spawnAccumulator = 0;
      // Give the player one order to start so they aren't waiting on RNG.
      const starter = makeOrder();
      if (starter) availableOrders.push(starter);
      cameraX = car.x - viewportW / 2;
      cameraY = car.y - viewportH / 2;
      gameState = 'playing';
      menuEl.classList.add('hidden');
      playEl.classList.remove('hidden');
      resizeGameCanvas();
      renderHud();
      renderAvailable();
      renderActive();
      updateEnergyHud();
    }
    function endShift() {
      gameState = 'menu';
      playEl.classList.add('hidden');
      menuEl.classList.remove('hidden');
      interactBtn.classList.add('hidden');
      interactOrder = null;
      input.w = input.a = input.s = input.d = false;
      saveStateDebounced();
      renderMenu();
    }

    document.getElementById('start-shift').addEventListener('click', startShift);
    document.getElementById('end-shift').addEventListener('click', endShift);
    document.getElementById('reset').addEventListener('click', () => {
      if (!confirm('Reset ALL progress (cash + upgrades)?')) return;
      try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
      state = defaultState();
      renderMenu();
    });

    window.addEventListener('resize', () => {
      if (gameState === 'playing') resizeGameCanvas();
    });

    // =====================================================================
    // INIT
    // =====================================================================
    renderMenu();
    resizeGameCanvas();
    requestAnimationFrame(loop);

    // TODO: vehicle types (scooter / car / van) — would change SCOOTER_SVG + base stats
    // TODO: traffic / pedestrians as moving obstacles
    // TODO: weather / day-night cycle
    // TODO: achievements
    // TODO: shift-based scoring with end screen
  </script>
  <script src="../bg.js"></script>
</body>
