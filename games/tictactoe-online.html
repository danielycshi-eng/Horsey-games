<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe Online - Horsey Games</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    canvas#bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%); }
    .back-link { z-index: 30; }
    .hidden { display: none !important; }

    .wrap { position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center;
      width: 100%; max-width: 460px; margin: 0 auto; padding: 2rem 1rem; gap: 1.2rem; text-align: center;
      animation: fadeIn 0.8s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    h1 { font-size: 2rem; letter-spacing: 3px; margin: 0.2rem 0;
      background: linear-gradient(135deg, #a0c4ff, #4e7fff 40%, #c7a0ff 75%, #a0c4ff); background-size: 300% 300%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: shimmer 5s ease-in-out infinite; filter: drop-shadow(0 0 18px rgba(78,127,255,0.4)); }
    @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    .tagline { color: #8ea7d6; font-size: 0.78rem; letter-spacing: 3px; text-transform: uppercase; margin-top: -0.6rem; }

    .panel { background: rgba(11,15,36,0.6); backdrop-filter: blur(8px); border: 1px solid rgba(78,127,255,0.2);
      border-radius: 16px; padding: 1.1rem 1.2rem; width: 100%; }
    .btn { padding: 0.8rem 1.4rem; border: none; border-radius: 12px; cursor: pointer; font-family: inherit;
      font-weight: 800; letter-spacing: 2px; text-transform: uppercase; font-size: 1rem; color: #fff;
      background: linear-gradient(135deg, #4e7fff, #345edb); transition: transform 0.12s, box-shadow 0.15s; width: 100%; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(78,127,255,0.45); }
    .btn.green { background: linear-gradient(135deg, #22c55e, #15803d); }
    .btn.ghost { background: rgba(80,100,140,0.45); }
    .row { display: flex; gap: 0.6rem; }
    input.code { flex: 1; padding: 0.75rem; border-radius: 10px; border: 1.5px solid #0f3460; background: rgba(0,0,0,0.35);
      color: #fff; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.2rem; letter-spacing: 4px; text-align: center; text-transform: uppercase; }
    input.code:focus { outline: none; border-color: #4e7fff; }

    .code-box { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 2.4rem; font-weight: 800; letter-spacing: 8px;
      color: #f5d77a; margin: 0.4rem 0; }
    .status { color: #a0c4ff; font-size: 0.95rem; min-height: 1.4em; letter-spacing: 0.5px; }
    .status.err { color: #ff8ba0; }
    .hint { color: #6a82a6; font-size: 0.8rem; line-height: 1.5; }

    .board { display: grid; grid-template-columns: repeat(3, 92px); grid-template-rows: repeat(3, 92px); gap: 8px; margin: 0.4rem auto; }
    .cell { background: rgba(22,33,62,0.7); border: 2px solid #0f3460; border-radius: 12px; font-size: 3rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.12s, border-color 0.12s; font-family: inherit; color: #fff; }
    .cell:hover:not(.taken) { background: rgba(15,52,96,0.7); border-color: #4e7fff; }
    .cell.taken { cursor: default; }
    .cell.x { color: #6aa6ff; }
    .cell.o { color: #ff7a90; }
    .cell.win { border-color: #22c55e; box-shadow: 0 0 16px rgba(34,197,94,0.5); }
    .turn { font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; min-height: 1.4em; }
    .you { color: #8ea7d6; font-size: 0.85rem; letter-spacing: 1px; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
  <a href="../games.html" class="back-link">&larr; All Games</a>

  <div class="wrap">
    <h1>Tic Tac Toe Online</h1>
    <div class="tagline">play a friend anywhere</div>

    <div id="lobby" class="panel">
      <div class="row" style="flex-direction:column; gap:0.7rem;">
        <button class="btn green" id="host-btn">Host a game</button>
        <div class="row">
          <input class="code" id="code-input" maxlength="5" placeholder="CODE">
          <button class="btn" id="join-btn" style="width:auto; padding:0.75rem 1.2rem;">Join</button>
        </div>
      </div>
      <p class="hint" style="margin-top:0.9rem;">Host a game to get a 5-letter code, then share it. Your friend picks <b>Join</b> and types the code. Browser-to-browser — no sign-up.</p>
    </div>

    <div id="waiting" class="panel hidden">
      <div class="you">Share this code with your friend:</div>
      <div class="code-box" id="code-display">-----</div>
      <button class="btn ghost" id="copy-btn" style="width:auto; padding:0.5rem 1rem; font-size:0.8rem;">Copy code</button>
      <div class="status" id="wait-status" style="margin-top:0.8rem;">Waiting for opponent…</div>
    </div>

    <div id="connecting" class="panel hidden">
      <div class="status" id="conn-status">Connecting…</div>
    </div>

    <div id="game" class="hidden">
      <div class="you" id="you-label">You are X</div>
      <div class="turn" id="turn-label">Your turn</div>
      <div class="board" id="board"></div>
      <button class="btn green hidden" id="rematch-btn" style="margin-top:0.6rem;">Rematch</button>
      <div class="status" id="game-status" style="margin-top:0.6rem;"></div>
    </div>

    <div class="status err" id="fatal"></div>
  </div>

  <script type="module">
    import { joinRoom } from 'https://esm.sh/trystero/nostr';
    window.__tttReady = true;

    const $ = id => document.getElementById(id);
    const lobby = $('lobby'), waiting = $('waiting'), connecting = $('connecting'), gameEl = $('game');
    const boardEl = $('board');
    const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    const APP = { appId: 'horsey-games-tictactoe', rtcConfig: { iceServers: [
      { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
      { urls: 'stun:global.stun.twilio.com:3478' },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
    ] } };

    // ---------- state ----------
    let room = null, sendMove = null, sendRematch = null, sendKey = null, hs = null;
    let mySym = 'X', oppSym = 'O', oppId = null, oppKey = null, started = false;
    let board = Array(9).fill(''), turn = 'X', over = false;
    const myKey = Math.random().toString(36).slice(2) + Date.now() + Math.random().toString(36).slice(2);

    function show(el) { [lobby, waiting, connecting, gameEl].forEach(e => e.classList.add('hidden')); el.classList.remove('hidden'); }
    function randCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }

    // ---------- lobby / connect ----------
    $('host-btn').addEventListener('click', hostGame);
    $('join-btn').addEventListener('click', joinGame);
    $('code-input').addEventListener('keydown', e => { if (e.key === 'Enter') joinGame(); });
    $('copy-btn').addEventListener('click', () => { try { navigator.clipboard.writeText($('code-display').textContent); $('copy-btn').textContent = 'Copied!'; setTimeout(() => $('copy-btn').textContent = 'Copy code', 1200); } catch (_) {} });
    $('rematch-btn').addEventListener('click', () => { try { sendRematch && sendRematch({}); } catch (_) {} resetBoard(); });

    function hostGame() {
      const code = randCode();
      show(waiting); $('code-display').textContent = code; $('wait-status').textContent = 'Waiting for opponent…'; $('wait-status').classList.remove('err');
      connectRoom(code, true);
    }
    function joinGame() {
      const code = ($('code-input').value || '').trim().toUpperCase();
      if (code.length < 4) { const i = $('code-input'); i.style.borderColor = '#e94560'; setTimeout(() => i.style.borderColor = '', 600); return; }
      show(connecting); $('conn-status').textContent = 'Connecting…'; $('conn-status').classList.remove('err');
      connectRoom(code, false);
    }

    function connectRoom(code, hosting) {
      const statusEl = hosting ? $('wait-status') : $('conn-status');
      try { room = joinRoom(APP, code); }
      catch (e) { statusEl.textContent = 'Failed to start networking.'; statusEl.classList.add('err'); return; }

      const mv = room.makeAction('mv'); sendMove = mv[0];
      mv[1](d => { if (started && !over && d && board[d.cell] === '' && turn === oppSym) applyMove(d.cell, oppSym); });
      const rm = room.makeAction('rmt'); sendRematch = rm[0]; rm[1](() => resetBoard());
      const ky = room.makeAction('key'); sendKey = ky[0]; ky[1](k => { oppKey = k; maybeStart(); });

      room.onPeerJoin(id => { oppId = id; statusEl.textContent = 'Opponent found — syncing…'; beginHandshake(); });
      room.onPeerLeave(id => { if (id === oppId && !over) { over = true; $('game-status').textContent = 'Opponent left the game.'; $('game-status').classList.add('err'); updateTurnLabel(); } });

      setTimeout(() => { if (!started) statusEl.textContent = hosting
        ? 'Waiting for opponent… (share the code)'
        : "Still trying… make sure the code is right and your friend clicked Host."; }, 15000);
    }
    function beginHandshake() {
      try { sendKey(myKey); } catch (_) {}
      if (hs) clearInterval(hs);
      hs = setInterval(() => { if (started) { clearInterval(hs); return; } try { sendKey(myKey); } catch (_) {} }, 800);
    }
    function maybeStart() {
      if (started || oppKey === null) return;
      started = true; if (hs) clearInterval(hs);
      mySym = (myKey > oppKey) ? 'X' : 'O'; oppSym = (mySym === 'X') ? 'O' : 'X';   // deterministic on both sides
      startGame();
    }

    // ---------- game ----------
    function startGame() { resetBoard(); show(gameEl); $('you-label').textContent = 'You are ' + mySym; }
    function resetBoard() {
      board = Array(9).fill(''); turn = 'X'; over = false;
      $('rematch-btn').classList.add('hidden'); $('game-status').textContent = ''; $('game-status').classList.remove('err');
      renderBoard();
    }
    function renderBoard() {
      boardEl.innerHTML = '';
      board.forEach((v, i) => {
        const c = document.createElement('div');
        c.className = 'cell' + (v ? ' taken ' + v.toLowerCase() : '');
        c.textContent = v;
        c.addEventListener('click', () => tryMove(i));
        boardEl.appendChild(c);
      });
      updateTurnLabel();
    }
    function updateTurnLabel() {
      const t = $('turn-label');
      if (over) { t.textContent = ''; return; }
      t.textContent = (turn === mySym) ? 'Your turn (' + mySym + ')' : "Opponent's turn (" + oppSym + ')';
      t.style.color = (turn === mySym) ? '#6be2a6' : '#8ea7d6';
    }
    function tryMove(i) {
      if (over || board[i] || turn !== mySym || !started) return;
      applyMove(i, mySym);
      try { sendMove({ cell: i }); } catch (_) {}
    }
    function applyMove(i, sym) {
      if (board[i]) return;
      board[i] = sym;
      const winLine = LINES.find(l => l.every(k => board[k] === sym));
      if (winLine) finish(sym);
      else if (board.every(v => v)) finish(null);
      else turn = (turn === 'X') ? 'O' : 'X';
      renderBoard();
      if (winLine) winLine.forEach(k => boardEl.children[k].classList.add('win'));
    }
    function finish(winner) {
      over = true;
      const gs = $('game-status');
      gs.textContent = !winner ? "It's a draw!" : (winner === mySym ? 'You win! 🎉' : 'You lose!');
      gs.classList.remove('err');
      $('rematch-btn').classList.remove('hidden');
      updateTurnLabel();
    }
  </script>
  <script>
    // Fallback if the multiplayer library (CDN module) fails to load.
    setTimeout(function () { if (!window.__tttReady) { document.getElementById('fatal').textContent = 'Could not load the multiplayer library — check your connection and reload.'; } }, 6000);
  </script>
  <script src="../bg.js"></script>
</body>
</html>
