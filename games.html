<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horsey Games - All Games</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { overflow: hidden; position: relative; background: #0b0f24; }

    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      animation: contentIn 1s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes contentIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin-bottom: 0.3rem;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #a0c4ff 0%, #4e7fff 35%, #c7a0ff 70%, #a0c4ff 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 5s ease-in-out infinite, float 6s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(78, 127, 255, 0.4));
    }
    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }

    .subtitle {
      color: #8ea7d6;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.2rem;
      max-width: 800px;
      width: 90%;
    }

    .game-card {
      background: rgba(22, 33, 62, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 2px solid #0f3460;
      border-radius: 14px;
      padding: 1.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 0 rgba(78, 127, 255, 0);
      animation: cardIn 0.8s cubic-bezier(.2,.7,.2,1) both;
    }
    .game-card:nth-child(1) { animation-delay: 0.05s; }
    .game-card:nth-child(2) { animation-delay: 0.12s; }
    .game-card:nth-child(3) { animation-delay: 0.19s; }
    .game-card:nth-child(4) { animation-delay: 0.26s; }
    .game-card:nth-child(5) { animation-delay: 0.33s; }
    .game-card:nth-child(6) { animation-delay: 0.40s; }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .game-card:hover {
      background: rgba(15, 52, 96, 0.85);
      transform: translateY(-6px);
      border-color: #4e7fff;
      box-shadow: 0 0 30px rgba(78, 127, 255, 0.5), 0 0 80px rgba(78, 127, 255, 0.2);
    }

    .game-card .icon { font-size: 2.8rem; margin-bottom: 0.6rem; }
    .game-card .name { font-size: 1.1rem; font-weight: 600; letter-spacing: 1px; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
  <a href="index.html" class="back-link">&larr; Home</a>
  <div class="content">
    <h1>Horsey Games</h1>

            <line x1="46" y1="34" x2="34" y2="46" stroke="#e94560" stroke-width="3" stroke-linecap="round"/>
