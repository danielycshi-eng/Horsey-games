<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horsey Games</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { overflow: hidden; position: relative; background: #0b0f24; }

    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Soft vignette over the canvas */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: contentIn 1.2s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes contentIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 5rem;
      margin-bottom: 0.4rem;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #a0c4ff 0%, #4e7fff 35%, #c7a0ff 70%, #a0c4ff 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 5s ease-in-out infinite, float 6s ease-in-out infinite;
      filter: drop-shadow(0 0 24px rgba(78, 127, 255, 0.45));
    }
    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    .subtitle {
      color: #8ea7d6;
      font-size: 1rem;
      margin-bottom: 2.8rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .start-wrap {
      position: relative;
      display: inline-block;
    }
    .start-wrap::before,
    .start-wrap::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 999px;
      border: 2px solid rgba(233, 69, 96, 0.5);
      animation: pulseRing 2.4s ease-out infinite;
      pointer-events: none;
    }
    .start-wrap::after {
      animation-delay: 1.2s;
    }
    @keyframes pulseRing {
      0%   { transform: scale(0.92); opacity: 0.9; }
      80%  { transform: scale(1.35); opacity: 0; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    .btn {
      font-size: 1.4rem;
      padding: 1rem 3.5rem;
      letter-spacing: 3px;
      border: 2px solid transparent;
      background: linear-gradient(135deg, #ff5677, #e94560 50%, #c73652);
      box-shadow:
        0 0 24px rgba(233, 69, 96, 0.45),
        0 0 60px rgba(233, 69, 96, 0.15);
      transition: box-shadow 0.3s, transform 0.15s, letter-spacing 0.3s;
      position: relative;
      z-index: 1;
    }
    .btn:hover {
      box-shadow:
        0 0 40px rgba(233, 69, 96, 0.7),
        0 0 100px rgba(233, 69, 96, 0.25);
      transform: scale(1.08);
      letter-spacing: 5px;
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
  <div class="content">
    <h1>Horsey Games</h1>
    <p class="subtitle">saddle up</p>
    <span class="start-wrap"><a href="games.html" class="btn">Start</a></span>
  </div>

  <script src="bg.js"></script>
</body>
</html>
