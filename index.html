<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horsey Games</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { overflow: hidden; position: relative; background: #0b0f24; }

    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Soft vignette over the canvas */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: contentIn 1.2s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes contentIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 5rem;
      margin-bottom: 0.4rem;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #a0c4ff 0%, #4e7fff 35%, #c7a0ff 70%, #a0c4ff 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 5s ease-in-out infinite, float 6s ease-in-out infinite;
      filter: drop-shadow(0 0 24px rgba(78, 127, 255, 0.45));
    }
    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    .subtitle {
      color: #8ea7d6;
      font-size: 1rem;
      margin-bottom: 2.8rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      opacity: 0.85;
    }
    .subtitle .cursor {
      display: inline-block;
      width: 0.55ch;
      margin-left: 2px;
      background: #8ea7d6;
      animation: blink 1.1s steps(2) infinite;
      vertical-align: -2px;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    .start-wrap {
      position: relative;
      display: inline-block;
    }
    .start-wrap::before,
    .start-wrap::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 999px;
      border: 2px solid rgba(233, 69, 96, 0.5);
      animation: pulseRing 2.4s ease-out infinite;
      pointer-events: none;
    }
    .start-wrap::after {
      animation-delay: 1.2s;
    }
    @keyframes pulseRing {
      0%   { transform: scale(0.92); opacity: 0.9; }
      80%  { transform: scale(1.35); opacity: 0; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    .btn {
      font-size: 1.4rem;
      padding: 1rem 3.5rem;
      letter-spacing: 3px;
      border: 2px solid transparent;
      background: linear-gradient(135deg, #ff5677, #e94560 50%, #c73652);
      box-shadow:
        0 0 24px rgba(233, 69, 96, 0.45),
        0 0 60px rgba(233, 69, 96, 0.15);
      transition: box-shadow 0.3s, transform 0.15s, letter-spacing 0.3s;
      position: relative;
      z-index: 1;
    }
    .btn:hover {
      box-shadow:
        0 0 40px rgba(233, 69, 96, 0.7),
        0 0 100px rgba(233, 69, 96, 0.25);
      transform: scale(1.08);
      letter-spacing: 5px;
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
  <div class="content">
    <h1>Horsey Games</h1>
    <p class="subtitle">saddle up<span class="cursor">&nbsp;</span></p>
    <span class="start-wrap"><a href="games.html" class="btn">Start</a></span>
  </div>

  <script>
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');

    let w, h, particles;
    let mouseX = -9999, mouseY = -9999;

    const NUM = 110;
    const LINK_DIST = 140;
    const MOUSE_DIST = 200;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }

    function createParticles() {
      particles = [];
      for (let i = 0; i < NUM; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          r: 1 + Math.random() * 1.6,
          hue: Math.random() < 0.18 ? 'gold' : 'blue',
        });
      }
    }

    function draw() {
      // Fade trail
      ctx.fillStyle = 'rgba(11, 15, 36, 0.35)';
      ctx.fillRect(0, 0, w, h);

      // Update positions + mouse repulsion
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;

        const dx = p.x - mouseX;
        const dy = p.y - mouseY;
        const d = Math.hypot(dx, dy);
        if (d < MOUSE_DIST && d > 0.1) {
          const f = (MOUSE_DIST - d) / MOUSE_DIST;
          p.x += (dx / d) * f * 1.4;
          p.y += (dy / d) * f * 1.4;
        }
      }

      // Constellation lines
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i], b = particles[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const d = Math.hypot(dx, dy);
          if (d < LINK_DIST) {
            const alpha = (1 - d / LINK_DIST) * 0.35;
            ctx.beginPath();
            ctx.strokeStyle = `rgba(120, 165, 255, ${alpha})`;
            ctx.lineWidth = 1;
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      // Particle nodes
      for (const p of particles) {
        ctx.beginPath();
        if (p.hue === 'gold') {
          ctx.fillStyle = '#f5d77a';
          ctx.shadowColor = 'rgba(245, 215, 122, 0.8)';
          ctx.shadowBlur = 8;
        } else {
          ctx.fillStyle = '#a0c4ff';
          ctx.shadowColor = 'rgba(160, 196, 255, 0.6)';
          ctx.shadowBlur = 6;
        }
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      // Mouse glow
      if (mouseX > -9000) {
        const grad = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, MOUSE_DIST);
        grad.addColorStop(0, 'rgba(199, 160, 255, 0.18)');
        grad.addColorStop(0.5, 'rgba(78, 127, 255, 0.08)');
        grad.addColorStop(1, 'rgba(78, 127, 255, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => { resize(); createParticles(); });
    window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
    window.addEventListener('mouseleave', () => { mouseX = -9999; mouseY = -9999; });
    window.addEventListener('touchmove', (e) => {
      if (e.touches[0]) { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; }
    }, { passive: true });

    resize();
    createParticles();
    draw();
  </script>
</body>
</html>
